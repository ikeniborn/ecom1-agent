- agents_md_anchor: null
  content: When parsing /bin/sql stdout into rows and columns, split on the delimiter
    the tool actually emits (comma-separated CSV whose first line is the header) instead
    of assuming a pipe ('|') delimiter; mis-guessing the delimiter collapses each
    row to a single field, so length/index guards like `len(row) >= N` fail and path/email
    columns are silently dropped from refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$store_path'', ''$emp_path'']) but actual refs [] contain only static template
    entries []". Root cause: SQL DID return one valid row (emp_036, store_path /proc/stores/store_bratislava_stare_mesto.json,
    emp_path /proc/employees/emp_036.json, is_manager=1) but parsing dropped it. OBSERVED
    output is comma-separated CSV (`employee_id,employee_display_name,employee_email,...`).
    Failing fragment: `cols = [c.strip() for c in line.split("|")]` splits on pipe,
    but stdout uses commas — so each line yields a single-element list. Then `if manager_check
    and len(manager_check) >= 10` is False (len==1), so refs stays [] and message
    falls to the ''<NO> — no store found'' branch despite a real YES match. Rule linkage:
    delimiter must match the tool''s actual output format (comma CSV here), not an
    assumed pipe, before column indexing can recover path columns for refs.'
  status: active
