entries:
- content: Never assert in a spec_goal that a security policy in docs has already
    been read when the task involves disclosing an employee's direct work email; always
    require explicit retrieval and review of the security policy from docs as a discrete
    success criterion before authorizing any PII disclosure.
  created: '2026-05-23'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''SDD phase: failed to parse LLM output. Raw: ```json\n{\n  "spec_goal":
    "Verify whether Lisa König is the store manager at PowerTool Bratislava Stare
    Mesto and determine, per the already-read security policy, whether her direct
    work email may be disclosed to the customer.",\n  "success_criteria": [\n    "Locate''.
    Root cause: wrong-spec. Failing fragment: the spec_goal clause ''determine, per
    the already-read security policy, whether her direct work email may be disclosed
    to the customer'' falsely presupposes the security policy has been consulted and
    improperly fuses employment verification with PII disclosure authorization. Rule
    linkage: the rule_content prohibits presupposing policy review in the spec_goal
    and mandates explicit retrieval of the security policy from docs as a discrete
    success criterion.'
  source: learn
  status: active
