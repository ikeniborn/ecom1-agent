- agents_md_anchor: null
  content: Always include a discovery step that inspects the relevant properties table
    (listing distinct keys and sample values) before constructing SQL queries that
    filter entities by property conditions, to ensure exact column names and value
    formats are used.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: The plan produced OUTCOME_NONE_UNSUPPORTED because at least one product
    SKU was empty, causing the decision branch to fail. The SQL query used hardcoded
    property conditions (e.g., property_value_text = 'wood screw') without first verifying
    the actual column name or value format in the product_variant_properties table.
    Without observed output, the most likely root cause is a schema or data mismatch
    that a preliminary inspection step would have surfaced, allowing the plan to adapt
    the filter conditions correctly.
  status: active
  surface: ir
