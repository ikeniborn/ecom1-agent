- agents_md_anchor: '#important-things > availability scope'
  content: When an availability or inventory answer is scoped to a resolved store
    or location, include that scope object's full record_path in the answer refs alongside
    the qualifying product paths — select the store/location record_path in the discovery
    query and append it to refs, never emit only product-variant paths.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/stores/store_linz_hauptplatz.json''".
    Root cause: CODEGEN built refs solely from $result.available_paths (product_variant
    record_paths) and dropped the resolved store record. Failing fragment: discovery
    SQL selects only `store_id, store_name, city, is_open` (no record_path), and final
    call `vm.answer(message=message, outcome="OUTCOME_OK", refs=paths)` where paths
    = product paths only. The availability-scope constraint requires referencing both
    available products and the store; grader demands the store''s record_path present
    in refs. Rule linkage: r001 (RPC multiset) and r002 (CSV parse) do not cover ref
    composition for scoped store/location objects, so a new technique rule is needed
    to make CODEGEN select and include the scope record_path.'
  status: active
