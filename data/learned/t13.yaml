- agents_md_anchor: null
  content: When an answer outcome requires a ref of kind record_path sourced from
    a variable, always include a discovery step that resolves that variable to a concrete
    path (e.g., by listing a directory or querying a catalog) and binds it to a variable
    used in the decision and answer refs.
  created: '2026-06-22'
  deactivated_reason: null
  id: r003
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/catalog/FST-1KPF96UD.json''''.
    The PlanIR had no discovery step to locate the store record path; variable $store_record_path
    was never populated, so the decision branch''s nonempty check failed and the ref
    was omitted. Existing rule r001 only adds a null check but does not ensure the
    variable is resolved. The plan must include a discovery step (e.g., listing /proc/catalog)
    to bind the store''s record path before the decision.'
  status: active
  surface: ir
