  id: r001
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/catalog/FST-3SJKL8BF.json''''.
    The PlanIR''s answer.ok.refs includes a record_path ref sourced from $store.record_path,
    but the decision only checks $store null and found_skus<4, not whether record_path
    is null. If record_path is null, the interpreter may omit the ref, causing the
    grader to reject the answer. The fix is to add a null check for the ref source
    variable before emitting the ok outcome.'
  status: inactive
  surface: ir
