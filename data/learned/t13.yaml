- agents_md_anchor: null
  content: Always include a discovery step that inspects the relevant properties table
    (listing distinct keys and sample values) before constructing SQL queries that
    filter entities by property conditions, to ensure exact column names and value
    formats are used.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: The plan produced OUTCOME_NONE_UNSUPPORTED because at least one product
    SKU was empty, causing the decision branch to fail. The SQL query used hardcoded
    property conditions (e.g., property_value_text = 'wood screw') without first verifying
    the actual column name or value format in the product_variant_properties table.
    Without observed output, the most likely root cause is a schema or data mismatch
    that a preliminary inspection step would have surfaced, allowing the plan to adapt
    the filter conditions correctly.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use 'any_true' as a predicate op; use only the predicate ops defined
    in the PlanIR schema (eq, ne, gt, ge, lt, le, in, not_in, contains, starts_with,
    ends_with, matches, exists, not_exists, and, or, not). When checking if any of
    a set of refs are non-empty, use 'exists' on each ref and combine with 'or'.
  created: '2026-06-24'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: plan validation failed with ''unknown predicate op any_true''.
    Root cause: The planner attempted to use ''any_true'' as a predicate op in a decision
    branch''s ''when'' clause, but this op is not defined in the PlanIR schema. The
    intended logic was likely to check if any of the product record_paths are non-empty.
    The correct approach is to use the ''exists'' predicate on each ref and combine
    them with ''or''. This rule ensures only valid predicate ops are used.'
  status: active
  surface: ir
