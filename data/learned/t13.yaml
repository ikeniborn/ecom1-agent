- agents_md_anchor: null
  content: Never add conditional early-return guards that emit Answer before issuing
    every Exec declared in the tool_plan (discovery + ops); CODEGEN must run each
    planned RPC unconditionally so the emitted RPC multiset equals the plan's.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [\''Answer\'', \''Exec\'', \''Exec\''] got: [\''Answer\'',
    \''Exec\'']''. Plan declares two Execs (discovery store resolve + main count op)
    plus Answer = 3 RPCs. Got only 1 Exec + Answer. Root cause: CODEGEN injected speculative
    clarification guard not present in tool_plan. Failing fragment: ''data_rows =
    [r for r in store_rows if not r.lower().startswith("store_id")] ... if len(data_rows)
    == 0: vm.answer(..., outcome="OUTCOME_NONE_CLARIFICATION", refs=[]); return''.
    Discovery parse yielded 0 data rows (header-only/empty), so the guard returned
    after the first Exec, skipping the planned main op Exec. Fidelity multiset check
    is exact, so any branch that short-circuits a planned RPC drifts. Rule links:
    forbid CODEGEN from adding unplanned conditional exits that drop planned Exec
    calls.'
  status: active
- agents_md_anchor: '#important-tools > sql inventory'
  content: When parsing /bin/sql stdout, treat it as CSV (first line header, comma-delimited,
    fields with embedded commas wrapped in double quotes) — never split on '|'; strip
    the header row, then CSV-parse each data row respecting quoted fields so multi-value
    columns like GROUP_CONCAT paths land in one field.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column''. Root
    cause: SQL ran fine (OBSERVED output: product_count=3, available_paths=''/proc/catalog/FST-23VT61XO.json,/proc/catalog/FST-1KPF96UD.json,/proc/catalog/STO-12JLHT7D.json''),
    but /bin/sql emits CSV not pipe-delimited. Failing fragment: parser checks `if
    "|" in line:` and falls to else branch where `line.lstrip("-").isdigit()` is False
    for the data row ''3,"/proc/...json,..."'' (contains commas), so product_count
    stays 0 and available_paths stays []. The quoted multi-path field was never CSV-split.
    Rule links the wrong-delimiter assumption to a CSV-aware parse so row parsing
    stops dropping columns.'
  status: active
