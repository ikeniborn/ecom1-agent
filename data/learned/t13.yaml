- agents_md_anchor: null
  content: When using Exec with SQL, embed all variable values directly into the stdin
    string; do not pass them as extra top-level args.
  created: '2026-06-22'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: ''interpret: tool validation: arg ''specs_json'' not accepted
    by Exec (accepts: args, path, stdin)''. The PlanIR passed ''store_name'' and ''specs_json''
    as top-level keys in the Exec args object, but Exec only accepts ''args'', ''path'',
    and ''stdin''. The SQL query in stdin referenced :store_name and :specs_json,
    but those parameters were not bound via the Exec interface. The fix is to embed
    the values directly into the stdin string instead of relying on unsupported parameter
    binding.'
  status: active
  surface: ir
