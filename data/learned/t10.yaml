- agents_md_anchor: null
  content: Always assign the final computed value to the variable name specified in
    the TOOL_PLAN params (e.g., 'count'), and use that variable in the answer message
    and success criteria.
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''ge'', ''lhs'':
    ''$count'', ''rhs'': 0, ''args'': []}. The SQL returned cnt=1, but the script
    bound the result to ''count_val'' instead of ''count''. The TOOL_PLAN params define
    the variable name as ''count'', so success criteria referenced $count, which was
