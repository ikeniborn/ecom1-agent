- agents_md_anchor: null
  content: When the answer shape is '%d', the answer message must be a number, not
    a string. Use a compute step to extract the numeric value and set the answer message
    to that number directly.
  created: '2026-06-21'
  deactivated_reason: Superseded by more explicit rule requiring variable reference,
    not string template.
  id: r001
  reasoning: 'The verify step failed with ''success_criteria[OUTCOME_OK][0] failed:
    {''op'': ''ge'', ''lhs'': ''$answer'', ''rhs'': 0, ''args'': []}'' despite the
    SQL returning cnt=1. The answer shape is ''%d'', which expects a numeric answer,
    but the PlanIR set the answer message to a string ''{count}''. The verification
    likely compared the string ''1'' to 0 and failed. The root cause is a mismatch
    between the answer shape and the message type. The corrective rule ensures that
    when the answer shape is ''%d'', the answer message is a number, not a string
    interpolation.'
  status: inactive
  surface: ir
