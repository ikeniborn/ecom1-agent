- agents_md_anchor: null
  content: Count query ("how many X", answer format <COUNT:%d>). SELECT COUNT(*) over
    the normalized product kind/type match (match the kind/category name with LOWER/TRIM).
    COMPUTE the integer count scalar. ANSWER OUTCOME_OK with message EXACTLY the literal
    '<COUNT:N>' where N is the count — no surrounding words, no quotes; build it by
    concatenating '<COUNT:' + count + '>'. required_refs[OUTCOME_OK]=[]; outcome_space=[OUTCOME_OK].
    A count of 0 is still OUTCOME_OK with <COUNT:0> — NEVER answer CLARIFICATION/UNSUPPORTED.
  created: '2026-06-18'
  deactivated_reason: null
  id: rc1
  reasoning: Consolidated authoritative method rule (rule-overload fix, mirrors t01).
    Folds the learnable-INTENT + conditional-grounding levers + family method; replaces
    accumulated ref-shaping rules that caused 5-6 cycle non-convergence -> empty CLARIFICATION.
  status: active
  surface: ir
