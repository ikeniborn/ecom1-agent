- agents_md_anchor: null
  content: When using auto_delim format to parse SQL output into rowsets, ensure that
    the field names used in subsequent compute steps (e.g., 'get') exactly match the
    'into' column names defined in the rowsets mapping.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The verify step failed because the answer message was not a number >=0.
    Observed SQL output was ''cnt 0'', and the PlanIR rowsets mapping used ''into'':''cnt''.
    However, the compute step used ''get'':[''$first_row'',''count''], referencing
    a non-existent field ''count''. This mismatch caused the answer to be empty, failing
    the success criteria. The root cause is a PlanIR shape bug: inconsistent field
    naming between rowsets and compute.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always set the answer message to a numeric value directly, not a string
    template, when the answer shape is '%d'. Use a compute step to extract the numeric
    value and assign it to the answer message without any formatting.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The verify step failed because the answer message was a string '6' instead
    of a number. The PlanIR used a string template '{count}' for the answer message,
    which the interpreter did not convert to a numeric value. The existing rule r001
    was present but not correctly applied; the new rule explicitly prohibits string
    templates and requires direct numeric assignment.
  status: inactive
  surface: ir
- agents_md_anchor: '#get'
  content: 'Always provide two arguments to the ''get'' primitive: the object and
    the key, not a combined dot-separated path.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The interpret error ''missing 1 required positional argument: ''key''''
    occurred because the compute step ''get'' was called with a single argument ''$stat_policy.path''
    (dot notation). The ''get'' primitive expects two separate arguments: the object
    and the key. The correct call is ''get'' with args [''$stat_policy'', ''path''].
    The second ''get'' step has the same issue but was not reached. This rule ensures
    future PlanIR uses the correct two-argument form.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the answer shape is '%d', the answer message must be a variable reference
    (e.g., '$count_val'), not a string template (e.g., '{count_val}').
  created: '2026-06-22'
  deactivated_reason: r005 is specific to '%d' answer shape; the new rule generalizes
    to any variable reference shape.
  id: r005
  reasoning: 'verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''ge'', ''lhs'':
    ''$answer'', ''rhs'': 0, ''args'': []}. The answer message was ''{count_val}''
    which is a string template, not a numeric value. The compute step correctly extracted
    cnt into count_val, but the answer message used a string template, causing the
    answer to be a string. The existing rule r001 and in-session rule were not precise
    enough; they said ''set the answer message to that number directly'' but the plan
    used a template. The new rule explicitly requires a variable reference (e.g.,
    ''$count_val'') to ensure the answer is numeric.'
  status: inactive
  surface: ir
