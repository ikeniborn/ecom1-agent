    of '$count_val' (a variable reference). The answer shape is '$count_val', so the
    message must be a variable reference. This mismatch caused the outcome to be OUTCOME_NONE_CLARIFICATION
    instead of OUTCOME_OK. Existing rule r005 only covers '%d' shape, so it is deactivated
    in favor of this more general rule.
