- agents_md_anchor: null
  content: Always assign the final computed value to the variable name specified in
    the TOOL_PLAN params (e.g., 'count'), and use that variable in the answer message
    and success criteria.
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''ge'', ''lhs'':
    ''$count'', ''rhs'': 0, ''args'': []}. The SQL returned cnt=1, but the script
    bound the result to ''count_val'' instead of ''count''. The TOOL_PLAN params define
    the variable name as ''count'', so success criteria referenced $count, which was
    undefined. The failing PlanIR fragment: compute step ''to_number'' into ''count_val'',
    and answer message using count_val, while success criteria uses $count. No existing
    rule prevents this variable-name mismatch.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always assign the scalar result of a SQL query to the variable name specified
    in the TOOL_PLAN params using a compute step with 'assign' operation, referencing
    the parsed column variable from the rowset (e.g., '$parsed_count.count').
  created: '2026-06-24'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: verify success_criteria[OUTCOME_OK][0] failed because $count
    is undefined. Root cause: The PlanIR script parsed the SQL result into a rowset
    variable ''parsed_count'' with column ''count'', but never assigned that scalar
    value to the variable ''count'' required by TOOL_PLAN params. The decision branch
    used ''$count'' (undefined) and the answer message used ''{count}'' (undefined).
    The script violated existing rule r009 (assign final computed value to param variable)
    but lacked a compute step. A more specific rule is needed to ensure scalar SQL
    results are explicitly assigned to the param variable.'
  status: active
  surface: ir
