- agents_md_anchor: null
  content: 'Count query ("how many X"), answer EXACTLY the token <COUNT:N>. Resolve
    the product kind/type by name normalized (LOWER/TRIM); SELECT COUNT(*) of matching
    product_variants. COMPUTE the count as an INTEGER — message must render <COUNT:2>,
    NEVER <COUNT:2.0>; build it as ''<COUNT:'' + int(count) + ''>''. If a governing
    policy doc applies (facts docs_inventory/policies, e.g. a catalogue-reporting
    policy), INTENT MUST set required_refs[OUTCOME_OK]=[{kind: policy_doc, path: <that
    /docs/...md>}] so the interpreter projects it; else required_refs[OUTCOME_OK]=[].
    outcome_space=[OUTCOME_OK]; count 0 is still OUTCOME_OK with <COUNT:0>; NEVER
    CLARIFICATION.'
  created: '2026-06-18'
  deactivated_reason: null
  id: rc1
  pinned: true
  reasoning: Canonical single rule (candidate-aware). Deactivates all run-distilled
    rules (iLEARN re-bloat). Uses pre-phase CATALOGUE_CANDIDATES + family fixes (count
    int+policy-doc; claim <NO>/SKU).
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never include a `params` field or `:placeholder` bind variables in an Exec
    RPC's args — ExecRequest has no params field and rejects it. Inline the discovery/match
    values directly into the SQL stdin as properly-quoted literals so the query string
    is fully self-contained.
  created: '2026-06-19'
  deactivated_reason: superseded by canonical rc1
  id: r002
  reasoning: 'Verbatim error: ''real_vm: Protocol message ExecRequest has no "params"
    field.'' Root cause: the PlanIR Exec RPC passed SQL bind parameters via a `params`
    map alongside `:kind_id`/`:kind_name` placeholders in stdin — failing PlanIR fragment:
    {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"...:kind_id...:kind_name","params":{...}}}.
    The real VM''s ExecRequest schema accepts only path+stdin (no params field), so
    the message is rejected before execution and placeholders never bind. Fix is a
    PLAN-shape technique: build one self-contained SQL string with values inlined
    as quoted literals; no params map, no colon-prefixed bind vars. Complements rc1
    (count-query shape) by constraining how the Exec carries its match values.'
  status: inactive
  surface: ir
