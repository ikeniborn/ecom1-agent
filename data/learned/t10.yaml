- agents_md_anchor: null
  content: When a success_criteria expression references $result.<field>, the PLAN
    must create a dict variable named result that contains that field as a key, and
    the answer must reference $result.<field> (e.g., $result.count). Use a rowset‑to‑dict
    compute step (or a ref primitive) to bind the first row of the relevant rowset
    into a variable called result, preserving the original column names, rather than
    emitting a scalar variable with a different name.
  created: '2026-06-24'
  deactivated_reason: r008 is too generic and does not explicitly forbid extracting
    fields into separate scalars before verification; the new rule supersedes it with
    clearer guidance.
  id: r008
  reasoning: 'diagnosis: verify failure because $result.count is undefined; PlanIR
    created scalar variable result_count instead of dict result with field count.
    The success_criteria expects $result.count, so the PLAN must shape the compute
    step to produce a dict result containing the count column.'
