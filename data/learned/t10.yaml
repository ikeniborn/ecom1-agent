- agents_md_anchor: null
  content: When a required reference is a field of a sampled record (e.g., $sample_row.record_path),
    the PLAN must create a variable that holds the whole record (sample_row) and then
    reference its field, rather than creating a scalar variable whose name contains
    a dot. Use a compute step that maps the first row of the sample rowset into a
    dict variable (into "sample_row"), or use a ref primitive to bind the column value
    to a variable named "sample_row" and then reference $sample_row.record_path in
    the answer refs list. Never name a variable with a dot; always keep the dot as
    a field accessor on a dict variable.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'diagnosis: interpret error – unresolved ref $sample_row.record_path.
    Root cause: PLAN created scalar variable "sample_row.record_path" via compute,
    so the placeholder $sample_row.record_path could not be resolved. Failing PlanIR
    fragment: compute step with into "sample_row.record_path" and answer refs referencing
    "$sample_row.record_path". Rule linkage: ensures required refs are satisfied by
    proper variable shaping.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required reference is expressed as a dotted field accessor (e.g.,
    $sample_row.record_path), the PLAN must create a dict variable named exactly the
    prefix (sample_row) that contains the full row record, and the answer's refs list
    must reference the field via the dotted accessor on that variable; do not create
    a separate scalar variable for the field value.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'diagnosis: interpret error – unresolved required ref [''$sample_row.record_path''];
    root cause: PLAN generated a scalar variable sample_record_path and referenced
    it directly, while required_refs expects a dict variable sample_row with a .record_path
    field; failing PlanIR fragment: compute step ''first'' into ''first_sample_row''
    then ''get'' into ''sample_record_path'' and answer.refs uses ''$sample_record_path''.
    The rule links the missing reference to the need for a dict variable and proper
    dotted ref in answer.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required reference is expressed as a dotted field accessor on a
