- agents_md_anchor: null
  content: When a numeric value is extracted from a rowset and will be used in success
    criteria, Always cast it to the appropriate numeric type (e.g., int) using a compute
    step before assigning to the variable.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''ge'',
    ''lhs'': ''$count'', ''rhs'': 0, ''args'': []}. Observed RPC output: ''cnt\n2'',
    so SQL returned 2. PlanIR compute step: ''get'' from first row into ''count''
    without casting. The rowset parsing likely produced a string ''2'', causing the
    numeric comparison (ge) to fail because string vs int is invalid or false. Root
    cause: missing type cast from string to int before using $count in success criteria.
    Failing PlanIR fragment: compute step ''get'' into ''count'' without subsequent
    cast.'
  status: inactive
  surface: ir
