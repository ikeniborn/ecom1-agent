  id: r010
  reasoning: The PlanIR incorrectly used the policy_doc as the data source for the
    rowset, resulting in an empty rowset and a null count. The success criteria then
    failed because $result.count was null. The intended count must be obtained via
    a database query using the SQL provided in the TOOL_PLAN params. The new rule
    instructs the planner to generate a SQL query RPC, bind its first row to result,
    and use $result.count for verification and answer formatting.
