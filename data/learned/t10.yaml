- agents_md_anchor: null
  content: Never use the concat primitive with a single argument; concat requires
    exactly two arguments, each being a list[dict] (rowset). For creating a reference
    to a literal path, use a 'ref' step or include the path directly in the answer's
    refs list.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: interpret compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. The PlanIR compute step used concat with
    a single string argument (the policy doc path) instead of two list[dict] rowsets.
    The concat primitive expects two rowsets to combine. The root cause is a misunderstanding
    of the concat contract. This rule prevents future misuse by clarifying the correct
    usage and alternative for literal refs.'
  status: inactive
  surface: ir
