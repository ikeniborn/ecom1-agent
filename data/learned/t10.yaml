entries:
- agents_md_anchor: null
  content: Never use unbound named parameter placeholders in SQL queries sent through
    Exec RPC stdin; always inline the required values from intent parameters or prior
    discovery refs into the query text.
  created: '2026-06-18'
  deactivated_reason: consolidated into crisp authoritative rc1 (rule-overload caused
    non-convergence)
  id: r001
  reasoning: 'The verbatim error is ''real_vm: answer must be non empty''. The root
    cause is that the PlanIR emitted an Exec RPC to /bin/sql whose stdin contained
    the named placeholder '':requested_kind_name'' but the RPC ''args'' array was
    empty, leaving the parameter unbound. This caused the SQL execution to yield no
    valid delimited result, so ''$sql_result_text'' could not be parsed into ''$rows'',
    and downstream variables ''$count_str'' and ''$count'' remained empty. The failing
    fragment is the Exec discovery step with ''"args":[]'' and '':requested_kind_name''
    in the query text. The new rule prevents this by requiring that any value needed
    in a SQL query be explicitly inlined into the string rather than relying on unsupported
    placeholder binding.'
  status: inactive
  surface: ir
