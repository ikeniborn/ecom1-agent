- agents_md_anchor: '#important-tools > payments'
  content: When a frozen ops RPC mutates a backing record through a CLI tool whose
    arguments embed bind-reference placeholders (e.g. ':payment_id'), substitute each
    placeholder with the concrete value resolved from its discovery binding AND verify
    the key mutation arguments are non-empty before issuing the call; an empty or
    unresolved substituted argument makes the tool silently no-op, producing zero
    file changes and failing a grader that expects an exact file mutation.
  created: '2026-06-06'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: ''grader: expected only file changes [/proc/payments/pay_024.json],
    got []''. This is a side-effect grader, not lint/fidelity: it asserts the ops
    phase must produce exactly one file mutation at the payment record path, but the
    run produced none. Root cause: the frozen ops command /bin/payments retry-3ds
    --payment :payment_id --basket :basket_id only mutates pay_024.json when --payment
    carries the real payment id; the failing fragment recover_result = vm.exec(path=''/bin/payments'',
    args=[''retry-3ds'',''--payment'', str(payment_id), ''--basket'', basket_id])
    substitutes str(payment_id) from the parsed SQL row, but when that binding resolves
    empty (or the wrong column) the tool runs with an empty --payment value and no-ops,
    yielding got []. SQL-parse correctness (r005) and unconditional emission (r004)
    ensure the call is issued, but neither guarantees the substituted ops argument
    is the concrete non-empty record id that actually triggers the mutation — the
    missing technique this rule adds. Distinct from r003 (identity placeholder) and
    r002 (read tolerance).'
  status: active
