- agents_md_anchor: null
  content: Always include an explicit catch-all branch in the decision block with
    a condition that always evaluates to true (e.g., {'op':'true'}) as the final branch,
    rather than relying on the default_label, to ensure a defined outcome is always
    produced.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''.
    The PlanIR''s decision block used ''default_label'': ''unsupported'' but the interpreter
    produced OUTCOME_NONE_CLARIFICATION, an undefined outcome, instead of OUTCOME_NONE_UNSUPPORTED.
    Root cause: reliance on default_label failed, likely because the interpreter fell
    back to a built-in clarification outcome when no branch matched or evaluation
    errored. Failing PlanIR fragment: decision block with only two conditional branches
    and a default_label, no explicit always-true catch-all. This extends rule r003''s
    guidance against default_label reliance for the success outcome to all outcomes.'
  status: active
  surface: ir
