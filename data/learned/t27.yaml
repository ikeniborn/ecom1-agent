- agents_md_anchor: null
  content: When fetching a payment record for a state-dependent operation (like recovery),
    do not filter the discovery query by a specific expected status; instead, retrieve
    the most recent payment for the basket and use decision branches to check its
    actual status fields.
  created: '2026-06-22'
  deactivated_reason: r001 advised retrieving the single most recent payment and checking
    its state, which caused this failure when the most recent payment was not the
    one requiring recovery. The new rule supersedes it by retrieving multiple payments
    and filtering for the eligible one.
  id: r001
  reasoning: The cycle produced OUTCOME_DENIED_SECURITY because the payment discovery
    query (SELECT ... WHERE payment_status = 'requires_3ds_action') likely returned
    no rows, making $payment null and triggering the 'isnull' branch. The root cause
    is an overly restrictive WHERE clause that assumed a specific payment_status.
    The PlanIR should have fetched the payment without that filter and evaluated its
    state in the decision branches.
  status: inactive
  surface: ir
