- agents_md_anchor: '#3ds-recovery'
  content: When recovering a checkout after a 3DS failure, do not limit the payment
    discovery query to a single most recent row; instead, retrieve the most recent
    payments (e.g., all payments for the basket ordered by created_at descending)
    and use a decision branch to select the one that satisfies the required state
    conditions (three_ds_status = 'failed' and payment_status = 'requires_3ds_action').
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The PlanIR's discovery query used 'LIMIT 1' to fetch the single most
    recent payment for basket_230. That payment did not have three_ds_status='failed'
    and three_ds_attempts equal to three_ds_max_attempts, so the decision branch correctly
    triggered 'deny_security'. The grader expected OUTCOME_OK, indicating that a payment
    meeting the 3DS failure conditions exists but was not the absolute most recent.
    The root cause is that the discovery step assumed the most recent payment is the
    one needing recovery, which is not always true. The corrective rule instructs
    the PLAN phase to retrieve multiple payments and select the most recent eligible
    one, ensuring the security check passes on the correct payment.
  status: inactive
  surface: ir
