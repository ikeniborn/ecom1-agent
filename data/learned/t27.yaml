- agents_md_anchor: null
  content: When a plan must evaluate multiple constraints, include discovery steps
    for all required data sources (policy docs, records) and decision branches for
    each constraint, with a final branch for the success outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'The plan only evaluated the guest constraint and defaulted to denied_security,
    ignoring the 3DS constraint and the success path. It lacked discovery of the payment
    record and the 3DS policy, and lacked decision branches for the 3DS constraint
    and success outcome. The error: ''expected outcome OUTCOME_OK, got OUTCOME_DENIED_SECURITY''.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always use a valid always-true predicate for the catch-all branch in a
    decision block, such as {'op':'eq','lhs':1,'rhs':1}, rather than an unsupported
    op like 'true'.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'PLAN validation failed: ''unknown predicate op \''true\'''' on decision.branches.2.when.
    Root cause: existing rule r006 instructs to use {''op'':''true''} as a catch-all
    condition, but PlanIR schema does not support ''true'' as a predicate op. The
    fix is to replace r006 with a rule that uses a valid always-true predicate (e.g.,
    eq on two equal literals). Deactivating r006 and providing corrected rule.'
  status: active
  surface: ir
