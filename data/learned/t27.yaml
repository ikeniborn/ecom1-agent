    "docs/"''. Root cause: wrong-value-type: the action ''tree:docs/'' used a relative
    path instead of an absolute path required by the tree tool. Failing fragment:
    action ''tree:docs/'' from PLAN_OUTPUT. Rule linkage: the new rule will require
    absolute paths for filesystem commands, preventing this error.'
