- agents_md_anchor: '#important-tools > id'
  content: Always resolve the caller/actor identity by parsing the bound identity-discovery
    RPC output (e.g. the /bin/id exec result) and use that resolved value in ownership
    comparisons; never trust an unsubstituted placeholder param (a literal '$var'
    token), since comparing it against record fields silently fails the ownership
    guard and forces a wrong refusal/clarification outcome instead of OUTCOME_OK.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''.
    Root cause: script runs `identity = vm.exec(path="/bin/id", args=[])` but never
    reads its stdout; ownership is computed from `caller = params.get("caller","")`
    which is the unresolved placeholder ''$agent_customer_id''. Failing fragment:
    `owns = bool(caller_id) and (caller_id == basket_customer_id or caller_id == payment_customer_id)`
    — literal ''$agent_customer_id'' never equals a real customer_id, so owns=False,
    safe_to_recover=False, recover gets --dry-run and outcome becomes a refusal rather
    than OUTCOME_OK. The plan bound /bin/id to `identity` for exactly this resolution
    but the binding is discarded. Linkage: distinct from r001 (RPC-emission fidelity)
    and r002 (Read guarding); this targets consuming the identity RPC result so the
    ownership branch reaches OUTCOME_OK.'
  status: active
- agents_md_anchor: null
  content: Always emit every planned RPC (discovery and ops) unconditionally on every
    path, even when its resolved argument is empty/unresolved or a prior step failed;
    never place a planned vm.read/vm.stat/vm.exec behind an `if path:` guard or a
    helper that returns a default without issuing the call — call the RPC and catch
    errors instead of skipping, since fidelity compares the executed RPC multiset
    against the frozen plan.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer,Exec*5,Find*2,Read*3,Stat] got: [Answer,Exec*5,Find*2]''.
    Missing executed RPCs: 1 Stat + 3 Read. Root cause: planned discovery RPCs were
    gated behind empty-path conditions. Failing fragments: `_safe_read(path)` returns
    '''' without calling vm.read when `path` falsy; `pay_stat` block `if payment_path:`
    skips vm.stat; `_safe_read(pay_policy_path)`/`_safe_read(sec_policy_path)` skip
    vm.read when Find resolved no path. So when SQL/Find data resolution yielded empty
    paths, the Stat and three Read RPCs never issued, dropping them from the multiset.
    Rule linkage: extends r001 (ops gated behind early-return) to ALL planned RPCs
    gated behind empty-argument/short-circuit guards; complements r002 (still call,
    just wrap in try/except instead of pre-skipping).'
  status: active
- agents_md_anchor: null
  content: When parsing /bin/sql tabular output into column bindings, derive the delimiter
    from the actual header line (handle comma/CSV as well as pipe) and zip the header
    names to each data row, rather than hard-coding a single separator like '|'; a
    wrong-delimiter assumption matches no columns, drops every data row, and leaves
    downstream path/id bindings empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$payment_path'', ''$pay_policy_path'', ''$sec_policy_path'']) but actual refs
    [] contain only static template entries [] — SQL likely returned no rows or row
    parsing dropped the path column". Root cause: SQL did NOT return no rows — observed
    /bin/sql output is comma-delimited CSV with a header line (`payment_id,record_path,...`
    then `pay_024,/proc/payments/pay_024.json,basket_224,cust_032,...`). Failing fragment:
    the parser loops `for line in pay_txt.splitlines(): if not line or "|" not in
    line: continue; parts = [p.strip() for p in line.split("|")]`. Since the real
    output contains no ''|'', every line is skipped, `cols` stays empty, so payment_id/payment_path
    resolve to '''' — stat gets path='''', the retry-3ds op is called with --payment
    '''', and refs=[] (empty), tripping the answer_refs check. Rule linkage: distinct
    from r001/in-session (those cover unconditional RPC emission) and r003 (placeholder
    identity) — this is a tabular-output-delimiter parsing defect, not covered by
    any active rule, so no skip.'
  status: active
