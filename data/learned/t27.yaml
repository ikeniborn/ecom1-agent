- agents_md_anchor: null
  content: Always include an explicit branch for the desired success outcome in the
    decision block, checking all required state conditions, rather than relying on
    a default_label fallback.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The script's decision block had no branch for the case where all conditions
    for OUTCOME_OK were met (payment_id nonempty, three_ds_status='failed', attempts==max,
    payment_status='requires_3ds_action', basket_status='checked_out'). The interpreter
    fell through to OUTCOME_NONE_CLARIFICATION because no branch matched and the default_label
    was not used. The fix is to add an explicit branch for the success outcome.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always provide both the source object and the key when using the 'get'
    primitive in a compute step; the first argument must be the object reference,
    the second the key to extract.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The interpret phase failed with: ''compute step ''get'' failed: <lambda>()
    missing 1 required positional argument: ''key''''. The PlanIR compute step was:
    {"prim":"get","args":["basket_264"],"into":"basket_id"}. The ''get'' primitive
    requires two arguments (obj, key), but only one was supplied. The step intended
    to extract the basket_id, but the source object was missing. The rule ensures
    future PlanIRs always supply both arguments to ''get''.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When using filter_rows in a compute step, provide exactly two arguments:
    the rows reference and a predicate object (e.g., {"op":"eq","lhs":"column","rhs":"value"}),
    not separate column and value arguments.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'The PlanIR compute step ''filter_rows'' failed with: ''_filter_rows()
    takes 2 positional arguments but 3 were given''. The step was: {"prim":"filter_rows","args":["$payments_rows","payment_status","requires_3ds_action"],"into":"filtered1"}.
    The interpreter contract requires filter_rows(rows, pred) where pred is a predicate
    object, not a column name and value. This rule ensures future PlanIR uses the
    correct two-argument form.'
  status: active
  surface: ir
