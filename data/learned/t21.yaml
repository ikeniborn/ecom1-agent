  id: r019
  reasoning: 'Error: ''expected outcome OUTCOME_NONE_UNSUPPORTED, got OUTCOME_NONE_CLARIFICATION''.
    The PlanIR decision branch for the unsupported case used label ''unsupported'',
    but the outcome_space only contains ''OUTCOME_NONE_UNSUPPORTED''. The interpreter
    likely used the branch label as the outcome, producing an invalid outcome and
    falling back to OUTCOME_NONE_CLARIFICATION. The fix is to align branch labels
    with the exact outcome strings.'
