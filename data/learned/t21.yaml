- agents_md_anchor: null
  content: Never use concat with a single argument; concat requires two list-of-rows
    arguments. To set a variable to a literal value from the instruction, embed the
    literal directly in the answer message or use a compute step with a 'literal'
    primitive.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'interpret: compute step ''concat'' failed: <lambda>() missing 1 required
    positional argument: ''b''. CONTRACT: concat(a, b): both args must be list[dict]
    rows (parse Exec output via rowsets first). The PlanIR compute step {"prim":"concat","args":["basket_158"],"into":"basket_id"}
    provided only one argument, a string, not two list-of-rows arguments. The intent
    was to set basket_id for the answer message, but the literal ''basket_158'' is
    already given in the instruction; no compute is needed. The rule prevents future
    misuse of concat and guides proper handling of instruction literals.'
  status: inactive
  surface: ir
