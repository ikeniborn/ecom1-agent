  content: When the outcome space includes both OUTCOME_DENIED_SECURITY and OUTCOME_NONE_UNSUPPORTED,
    and a constraint denies non-customers, map the non-customer branch to OUTCOME_NONE_UNSUPPORTED,
    not OUTCOME_DENIED_SECURITY.
