    occurred because the PlanIR attempted to re-assign the basket_id parameter via
    a literal step, but the interpreter rejected it as the parameter was already bound
    from the TOOL_PLAN. The failing fragment: {"prim":"literal","args":["basket_186"],"into":"basket_id"}.
    The parameter basket_id is already available as $basket_id from the TOOL_PLAN
    params, so the literal step is redundant and caused the failure.'
  status: inactive
