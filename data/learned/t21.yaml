- agents_md_anchor: null
  content: Always include a decision branch that checks if a looked-up record (e.g.,
    the result of a 'first' compute on a rowset) is empty or missing, and map it to
    an appropriate outcome (such as OUTCOME_NONE_UNSUPPORTED) before any branches
    that depend on its fields. This prevents the interpreter from falling back to
    OUTCOME_NONE_CLARIFICATION when the record is not found.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The error 'expected OUTCOME_NONE_UNSUPPORTED, got OUTCOME_NONE_CLARIFICATION'
    indicates the decision branches did not match any condition. The PlanIR's decision
    branches assume the basket exists; when the basket lookup returns no rows, the
    $basket variable is empty, and conditions like '$basket.basket_status != active'
    may not evaluate as true, causing the interpreter to fallback to OUTCOME_NONE_CLARIFICATION.
    The plan must handle the empty-basket case by mapping it to OUTCOME_NONE_UNSUPPORTED.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always use the 'literal' primitive to assign a constant string value in
    a compute step, not 'get'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The interpret error ''get() missing 1 required positional argument:
    key'' occurred because the PlanIR compute step used ''get'' with a single string
    argument (''Checkout is not supported for guest users...''), but ''get'' requires
    two arguments (obj, key). The step intended to set msg_skeleton to a constant
    string. The correct primitive for constant assignment is ''literal''. This rule
    prevents misuse of ''get'' for literal values.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always map a security constraint's deny_when condition to OUTCOME_DENIED_SECURITY,
    and place that branch before any overlapping non-security branches, even if the
    TOOL_PLAN's desired outcome is different.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: verify: I3: security constraint ''#checkout-eligibility in /docs/checkout.md''
    deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY.
    The PlanIR''s decision branch for caller_kind != customer mapped to guest_unsupported
    -> OUTCOME_NONE_UNSUPPORTED, but the constraint is marked security, so the interpreter
    requires OUTCOME_DENIED_SECURITY. Root cause: the branch ignored the security
    flag. Existing rule r002 explicitly advised this incorrect mapping.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always place all DENIED_SECURITY decision branches before any non-DENIED
    branches in the decision tree. If a DENIED_SECURITY branch condition accesses
    fields of a record that may be null, add a notnull guard to the condition to prevent
    evaluation errors when the record is missing.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'interpret: security-first violation: a DENIED_SECURITY branch follows
    a non-DENIED branch in the decision tree. The PlanIR placed the basket_not_found
    branch (OUTCOME_NONE_UNSUPPORTED) before the ownership_denied branch (OUTCOME_DENIED_SECURITY).
    The interpreter requires all DENIED_SECURITY branches to be evaluated first. Additionally,
    the ownership_denied condition accesses $basket.customer_id, which would fail
    if $basket is null; a notnull guard is needed.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always provide the value for a ''literal'' compute step as an object with
    a ''value'' key, e.g., {"value": "basket_186"}, not as a bare string in an array.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'The interpreter failed with error ''interpret: compute step ''literal''
    failed: ''literal''''. The failing PlanIR fragment is the compute step {"prim":"literal","args":["basket_186"],"into":"$basket_id"}.
    The root cause is that the ''literal'' primitive expects its argument to be an
    object with a ''value'' key (e.g., {"value": "basket_186"}), but the PlanIR supplied
    a bare string inside an array. This caused the interpreter to abort before reaching
    the decision phase. The new rule mandates the correct object format for literal
    values, preventing this compute-step failure in future cycles.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always provide the value for a 'literal' compute step as a bare string
    in the args array, e.g., `"args":["guest"]`, not as an object with a 'value' key.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'The error ''interpret: compute step ''literal'' failed: ''literal''''
    indicates the interpreter could not process the literal step. The script used
    `{"prim":"literal","args":[{"value":"guest"}],"into":"caller_kind"}`. The args
    format `[{"value":"guest"}]` is an object inside an array, which the interpreter
    rejected. The correct format is a bare string in the args array: `["guest"]`.
    This supersedes the in-session rule that advised using an object with a ''value''
    key.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use a literal compute step to assign a value that is already provided
    as a parameter in the TOOL_PLAN; reference the parameter directly using $param_name.
