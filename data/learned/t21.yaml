entries:
- content: Always issue LIKE probe (`WHERE id LIKE '%<basket_id>%'` or `WHERE cart_id
    LIKE '%<basket_id>%'`) before any exact-literal ID predicate against `carts.id`
    or `cart_items.cart_id`. Gate exact-match on confirmed LIKE hit ≥1 row in same
    plan cycle — dispatching the LIKE query is NOT sufficient; the result must be
    received and verified ≥1 row before issuing exact literal. Interleaving schema
    queries or other JOINs does NOT satisfy the gate.
  created: '2026-05-19'
  deactivated_reason: null
  id: r001
  reasoning: ''
  source: learn
  status: active
- content: 'Discovery sequence: `exact-kind query → if 0 rows → LIKE probe → count`.
    Never skip LIKE probe on empty discovery. Empty result = ambiguous, not authoritative.
    Proceed to count only after LIKE probe confirms absence or yields candidates.'
  created: '2026-05-19'
  deactivated_reason: null
  id: r002
  reasoning: ''
  source: learn
  status: active
- content: 'Multi-attribute JOIN: never filter `pp.key = ''A'' AND pp.key = ''B''`
    in single join — use separate EXISTS subquery per attribute key. Join column is
    `product_properties.sku = products.sku`.'
  created: '2026-05-19'
  deactivated_reason: null
  id: r003
  reasoning: ''
  source: learn
  status: active
- content: Numeric attributes use `value_number`; text attributes use `value_text`
    — never mix types.
  created: '2026-05-19'
  deactivated_reason: null
  id: r004
  reasoning: ''
  source: learn
  status: active
- content: Payment workflow must be initiated through `payments` tool, not raw SQL
    writes. Reserved quantity update required on commit via `payments` tool flow.
  created: '2026-05-19'
  deactivated_reason: null
  id: r005
  reasoning: ''
  source: learn
  status: active
- content: 'Basket ownership must be confirmed before checkout: basket''s `customer_id`
    must match identity returned by `id` tool (currently `cust_060`). Cross-customer
    basket access forbidden.'
  created: '2026-05-19'
  deactivated_reason: null
  id: r006
  reasoning: ''
  source: learn
  status: active
- content: 'Inventory gate: for each item in basket, `inventory.available_today >=
    item.quantity`; block checkout if any item fails. JOIN inventory on both `sku`
    and `store_id`.'
  created: '2026-05-19'
  deactivated_reason: null
  id: r007
  reasoning: ''
  source: learn
  status: active
- content: 'Price source: `products.price_cents` and `products.price_currency` — no
    other price fields.'
  created: '2026-05-19'
  deactivated_reason: null
  id: r008
  reasoning: ''
  source: learn
  status: active
- content: Always retrieve basket data by querying the `carts` table via the `sql`
    tool with `SELECT * FROM carts WHERE id = '<basket_id>'` (after confirming existence
    via LIKE probe per r001). Never read basket data from `/proc/baskets/<basket_id>.json`
    or any file path.
  created: '2026-05-19'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: AssertionError: expected columns not found in [''# read: /proc/baskets/basket_191.json''].
    Root cause: wrong-data-source — the operation attempted to read basket data from
    a file path `/proc/baskets/basket_191.json` instead of querying the `carts` table
    via the `sql` tool. The test expected columns from a SQL result (id, customer_id,
    status, store_id, sku) but got a file read header. This violates the requirement
    to use SQL for cart data retrieval. No existing rule covers data source selection.'
  source: learn
  status: active
- content: Always invoke the `id` tool directly (no arguments) to retrieve the current
    user identity; never use the literal string 'id' as a file path or argument to
    any tool that expects an absolute path. The identity is returned on stdout, not
    accessible via file read.
  created: '2026-05-19'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: ''Exec exception: exec failed: invalid path: path must be absolute:
    "id"''. Root cause: wrong-value-type — the agent used the literal string ''id''
    as a file path argument to a path-expecting tool, instead of invoking the `id`
    tool directly to retrieve the current identity. Failing fragment: passing the
    string ''id'' where an absolute path was required. Rule linkage: new rule must
    explicitly forbid using ''id'' as a path and mandate direct invocation of the
    `id` tool.'
  source: learn
  status: active
- content: Always abort further queries referencing a basket ID if the initial LIKE
    probe on `carts.id` returns 0 rows; report the basket as non-existent immediately.
  created: '2026-05-19'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: ''Empty result set:'' across all queries. Root cause: empty-result
    — the basket_id ''basket_191'' does not exist in the `carts` table. The first
    LIKE probe `SELECT COUNT(*) FROM carts WHERE id LIKE ''%basket_191%''` returned
    0, confirming absence, yet the agent continued to issue exact-match queries on
    `carts` and `cart_items`, violating r001''s gate (exact match only on LIKE hit
    ≥1 row) and disregarding r002''s implication that absence should stop further
    processing. Failing fragment: the sequence of queries after the 0-count LIKE probe
    on carts.'
  source: learn
  status: active
task_id: t21
