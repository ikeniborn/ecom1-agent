- agents_md_anchor: null
  content: Do not use the 'concat' primitive for string concatenation; concat only
    merges two rowsets (list of dicts). To build a string, use a single Exec that
    returns the string, or use a 'format' primitive if available.
  created: '2026-06-22'
  deactivated_reason: null
  id: r021
  reasoning: 'Error: ''interpret: compute step ''concat'' failed: <lambda>() takes
    2 positional arguments but 3 were given CONTRACT: concat(a, b): both args must
    be list[dict] rows (parse Exec output via rowsets first)''. Root cause: PlanIR
    used concat with multiple string arguments to build payment_record_path, new_basket_json,
    and payment_json, violating the contract that concat takes exactly two rowsets.
    Failing fragment: compute steps with prim ''concat'' and args containing strings
    and variable references. Rule ensures future PlanIR uses concat only for rowset
    merging and uses alternative methods for string construction.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using filter_rows, the predicate must be a string (e.g., 'nonempty($row.field)')
    or a structured object with an 'op' attribute, not a dict.
