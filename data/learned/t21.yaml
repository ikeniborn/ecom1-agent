    to OUTCOME_NONE_UNSUPPORTED, which contradicts the interpreter's requirement that
    security constraints always yield OUTCOME_DENIED_SECURITY.
  id: r002
  reasoning: 'Error: grader expected OUTCOME_NONE_UNSUPPORTED, got OUTCOME_DENIED_SECURITY.
    Root cause: PlanIR decision branches mapped identity.kind != customer to ''denied''
    (OUTCOME_DENIED_SECURITY), but the correct outcome for a guest attempting checkout
    is unsupported. The failing fragment: decision.branches[0] label ''denied'' with
    outcome OUTCOME_DENIED_SECURITY. The rule corrects this mapping for future cycles.'
