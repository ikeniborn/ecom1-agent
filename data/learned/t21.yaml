- agents_md_anchor: null
  content: When using Exec RPC to run a command that reads from stdin, provide the
    stdin content as a top-level 'stdin' field in the RPC object, not inside the 'args'
    object.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. Root cause: The PlanIR placed the SQL query inside the ''args'' object
    as a ''stdin'' key, but the interpreter did not deliver it to the command''s stdin.
    Failing PlanIR fragment: {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"SELECT
    record_path FROM shopping_baskets WHERE basket_id = :basket_id;","args":["--set","basket_id=$basket_id"]}}.
    The stdin should be a top-level field of the RPC call, not nested inside args.
    No existing rule covers this.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not include a 'stdin' field in a discovery step; stdin is only valid
    in Exec RPC steps.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'The PlanIR validation failed because a discovery step contained a ''stdin''
    field, which is not allowed. The error: ''discovery.1.stdin Extra inputs are not
    permitted''. The failing PlanIR fragment likely attempted to pass a SQL query
    via stdin in a discovery step. Discovery steps should not have stdin; if stdin
    is required, use an Exec RPC step instead.'
  status: inactive
  surface: ir
