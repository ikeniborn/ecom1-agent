- agents_md_anchor: null
  content: When a decision branch depends on properties of a record that may be missing
    (e.g., from a query that could return zero rows), include a branch that checks
    for an empty rowset or missing record and routes to the appropriate unsupported
    outcome before evaluating property conditions.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'Error: ''grader: expected outcome OUTCOME_NONE_UNSUPPORTED, got OUTCOME_NONE_CLARIFICATION''.
    Root cause: The PlanIR''s decision branches assumed the basket record always exists
    and has properties. If the SQL query for basket_190 returned no rows, the compute
    step ''first'' produced an empty object, causing $basket.basket_status to be undefined.
    The condition ''ne $basket.basket_status active'' could not evaluate, so no branch
    matched, and the interpreter defaulted to a clarification outcome. The desired
    outcome for a non-existent basket is OUTCOME_NONE_UNSUPPORTED. The fix is to add
    a branch that checks for an empty rowset or missing record before property checks.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a security constraint's deny_when references $_facts.identity.kind,
    the decision branch must use the same $_facts.identity.kind reference directly,
    not a locally computed identity from /bin/id output.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'Error: verify: I3: security constraint ''#security-guest-checkout''
    deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY.
    Root cause: The PlanIR computed identity from /bin/id output (which returned ''customer''),
    but the verifier evaluated the constraint using the system-provided $_facts.identity.kind
    (which was ''guest''). The decision branch used the computed $identity.kind, causing
    a mismatch. The PlanIR must use the same fact reference as the constraint to ensure
    consistent routing.'
  status: inactive
  surface: ir
