entries:
- agents_md_anchor: '#security > guest-actions'
  content: Always run /bin/id and bind its output to a fact (e.g., identity) before
    evaluating any security deny_when predicate that depends on identity kind or roles.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). Root cause: PlanIR decision
    branch checks $_facts.identity.kind == ''guest'' but no prior discovery step runs
    /bin/id to populate that fact. The security policy at /docs/security.md mandates
    running /bin/id before any identity-dependent action. Without it, the predicate
    evaluates incorrectly (likely undefined), causing a spurious denial. The PlanIR
    fragment shows only a Read of /docs/security.md, missing the required identity
    discovery. Rule linkage: missing identity discovery step.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a required ref for an answer branch is derived from a database query
    result, include a decision branch that checks whether that ref is non-null (or
    the query returned rows) before defaulting to that answer; if the ref is null,
    route to an outcome that does not require that ref, such as OUTCOME_NONE_UNSUPPORTED.
  created: '2026-06-25'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''''$basket.record_path'''']
    on OK answer''. The PlanIR computes basket_record_path from a SQL query and uses
    it as a required ref in the OK answer. The decision only checks identity_kind;
    if not guest, it defaults to OK. However, if the SQL query returns no rows (e.g.,
    basket_id not found), basket_record_path is null, causing the ref to be unresolved.
    The fix is to add a decision branch that checks whether basket_record_path is
    non-null before proceeding to OK, and if null, route to OUTCOME_NONE_UNSUPPORTED.
    This rule ensures the PlanIR handles missing query results gracefully.'
  status: active
  surface: ir
