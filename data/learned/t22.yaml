- agents_md_anchor: null
  content: Always include a discovery step to read the record for any caller-provided
    identifier that appears in the answer message, and include its record_path as
    a reference in the answer for every outcome that uses that identifier.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Error: grader: answer missing required reference ''/proc/baskets/basket_019.json''.
    The PlanIR only had branches for clarify and unsupported, and the unsupported
    answer included only a policy_doc ref. The basket_id parameter was used in the
    message but no discovery step read the basket record, so its record_path was missing.
    The grader expected a reference to the basket record. Root cause: PlanIR omitted
    a discovery step to read the basket record and did not include its record_path
    in the answer refs. Corrective rule: always read the record for any caller-provided
    identifier used in the answer message and include its record_path as a ref.'
  status: inactive
  surface: ir
