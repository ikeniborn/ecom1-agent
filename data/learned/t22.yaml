    customer says "my basket" or "check it out" without basket ID: return OUTCOME_NONE_CLARIFICATION
    (never OUTCOME_NONE_UNSUPPORTED — checkout tool exists, basket ID required). Always
    emit valid structured SDD spec (fields: spec_goal, success_criteria, plan, actions)
    even for OUTCOME_NONE_CLARIFICATION: set spec_goal=''clarify_basket_id'', list
    candidate basket IDs in success_criteria, set actions to single clarify action.
    Never emit free-form conversational text as SDD output.'
  created: '2026-05-24'
  deactivated_reason: 'Consolidated: r003, r004'
  id: r004
  reasoning: 'r001+r002+r003 all address same scenario (ambiguous basket, clarification
    flow). r003 is highest id and adds precision constraint on spec_goal format. Merged
    to cover full scope: clarification trigger (r001), SDD structure requirement (r002),
    and spec_goal literal format enforcement (r003).'
  source: learn
  status: inactive
- content: Always emit a structured plan object (with approach, steps, and action
    fields) in the PLAN phase — never free-form prose — even when spec_goal is 'clarify_basket_id';
    for clarification goals, set action to a single clarify step listing candidate
    basket IDs, not a conversational question.
  created: '2026-05-24'
  deactivated_reason: 'Consolidated: r005, r007'
  id: r005
  reasoning: 'Verbatim error: ''PLAN phase: failed to parse LLM output. Raw: 3 open
    baskets found for your account. Which to check out?\n\nNeed basket ID to proceed
    — which is yours?\n\n(If you see basket IDs in a previous message, share it; otherwise
    say "show my baskets" and I''ll list them with store/date details.)''. Root cause:
    wrong-action — the PLAN phase emitted free-form conversational text instead of
    a structured plan object. The SDD_OUTPUT looks correct (spec_goal=''clarify_basket_id'',
    valid fields), but the PLAN phase output was raw prose rather than a parseable
    plan structure. The failing fragment is the PLAN phase LLM output itself: free-form
    text ''Need basket ID to proceed — which is yours?'' instead of a JSON/structured
    plan. Existing rules r003 and r004 both target SDD output format but neither addresses
    PLAN phase output format. The PLAN phase must also emit a structured object (approach,
    steps, action fields), not conversational prose — even when spec_goal is clarify_basket_id.
    Rule linkage: new rule must cite PLAN phase and clarify_basket_id to prevent prose
    output at plan stage.'
  source: learn
  status: inactive
