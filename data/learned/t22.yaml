- agents_md_anchor: null
  content: Always extract record_path values into a dedicated top-level variable using
    a compute step before using them as ref sources in answer branches; never use
    nested field access like $basket.record_path directly in a ref source.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/baskets/basket_024.json''''.
    The PlanIR answer branches for OUTCOME_OK included a record_path ref with source
    ''$basket.record_path''. The basket record was discovered and non-null (otherwise
    the ''unsupported'' branch would have fired), yet the interpreter omitted the
    ref. Root cause: the interpreter likely failed to resolve the nested path when
    emitting the answer ref. Extracting the record_path value into a top-level variable
    (e.g., via a compute ''get'' step) and using that variable as the ref source avoids
    this resolution gap.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always provide exactly two arguments to the ''get'' primitive: an object
    and a key. Never use ''get'' to assign a literal value; use a ''literal'' compute
    step or embed the value directly in the answer refs.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'The PlanIR compute step ''get'' was called with a single argument ''/docs/security.md'',
    violating the contract ''get(obj, key)''. The interpreter raised ''missing 1 required
    positional argument: key''. The intent was to set a variable to a literal path,
    which should be done via a ''literal'' step or by placing the path directly in
    the answer refs. This rule prevents future misuse of the ''get'' primitive.'
  status: inactive
  surface: ir
