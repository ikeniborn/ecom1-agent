- agents_md_anchor: null
  content: When a parameter is marked as 'extract from instruction, or null if not
    provided', always include a decision branch that checks if the parameter is null
    and, if so, routes to a clarification outcome before evaluating any security constraints.
  created: '2026-06-22'
  deactivated_reason: r011 required null‑checks before security constraints, which
    violates the security‑first ordering enforced by the interpret phase.
  id: r011
  reasoning: Grader expected OUTCOME_NONE_CLARIFICATION, got OUTCOME_DENIED_SECURITY.
    The PlanIR only had a branch for identity.kind == guest leading to deny, and default
    deny. It did not check for basket_id presence. The instruction likely lacked a
    basket_id, so the plan should have clarified. The rule ensures missing required
    parameters trigger clarification before security checks.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always order decision branches so that any branch leading to OUTCOME_DENIED_SECURITY
    is evaluated before any branch leading to a non-DENIED outcome. This includes
    null‑checks for parameters that would otherwise route to OUTCOME_NONE_CLARIFICATION.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: The interpret phase rejected the PlanIR because the DENIED_SECURITY branch
    (checking is_guest) appeared after the non-DENIED ask_basket_id branch. Existing
    rule r011 instructed placing the null‑check before security constraints, which
    caused the violation. The new rule enforces security‑first ordering and supersedes
    r011.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include all required refs for each outcome in the answer branch,
    using compute steps to extract nested field sources into top-level variables as
    per r009.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'Error: interpret: unresolved required ref(s) [''$basket.record_path'']
    on OK answer. The PlanIR answer for ''ok'' had no refs, but the intent spec requires
    a record_path ref sourced from $basket.record_path. The PlanIR must include that
    ref, and per r009, must first extract the nested field into a top-level variable
    via a compute step.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the output of an Exec RPC as a sequence argument to 'first' or
    'column' primitives; Exec RPC returns an ExecResponse object, not a list of rows.
    If you need a null value for a parameter, use a 'literal' compute step instead.
  created: '2026-06-22'
  deactivated_reason: null
  id: r014
  reasoning: 'Error: ''interpret: compute step ''first'' failed: ''ExecResponse''
    object is not subscriptable''. Root cause: the discovery step bound basket_id_src
    to an Exec RPC that ran ''SELECT NULL AS basket_id;''. The Exec RPC returns an
    ExecResponse object, not a list of rows. The compute step ''first'' tried to subscript
    that object, causing the failure. Failing PlanIR fragment: discovery step with
    bind ''basket_id_src'' and compute step ''first'' on ''$basket_id_src''. The correct
    approach is to use a ''literal'' compute step to assign null when the parameter
    is not provided.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use the 'concat' primitive to build strings; concat only merges two
    lists of rows. To construct a string value, use a 'literal' compute step or embed
    the string directly in the operation's args.
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: 'Error: ''interpret: compute step ''concat'' failed: <lambda>() takes
    2 positional arguments but 3 were given. CONTRACT: concat(a, b): both args must
    be list[dict] rows (parse Exec output via rowsets first).'' The failing PlanIR
    compute step was: {"prim":"concat","args":["/payments/","$new_payment_id",".json"],"into":"payment_record_path"}.
    The concat primitive expects exactly two row-list arguments, not three string
    arguments. The same misuse appears in the step building payment_json. Root cause:
    the planner attempted to use concat for string concatenation, which is not its
    purpose. The rule ensures future plans use proper string construction (literal
    or direct embedding) instead.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include discovery steps to extract parameters from the instruction
    when the parameter is marked as 'extract from instruction, or null if not provided',
    before any decision branches that check for null.
  created: '2026-06-22'
  deactivated_reason: null
  id: r016
  reasoning: 'Error: interpret: attempt grounded discovery before clarifying (clarify-only
    plan rejected while OUTCOME_OK is reachable). Root cause: PlanIR lacks discovery
    steps to extract basket_id from instruction; it immediately routes to clarify
    without attempting extraction. Failing PlanIR fragment: discovery empty, decision
    only checks null and defaults to clarify. Existing rule r011 covers null-check
    branch but not discovery. New rule ensures discovery steps are included before
    null-check.'
  status: active
  surface: ir
