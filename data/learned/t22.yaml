- agents_md_anchor: '#important-tools > id'
  content: Always parse the stdout of an identity/resolver discovery RPC and bind
    its extracted value into the parameters of any dependent downstream RPC, instead
    of forwarding the unresolved tool_plan placeholder (e.g. $agent_customer_id) verbatim
    into the query.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/baskets/basket_043.json''".
    Root cause: script resolves identity via vm.exec(''/bin/id'') into identity_out
    but never parses it; it feeds customer_id = params[''customer_id''] (the unresolved
    plan placeholder ''$agent_customer_id'') straight into the SQL bind ''customer_id=''
    + str(customer_id). Failing fragment: `customer_id = params["customer_id"]` then
    `vm.exec(path="/bin/sql", args=[sql, "customer_id=" + str(customer_id)])` while
    identity_out is computed but discarded. With a placeholder customer_id the WHERE
    b.customer_id = :customer_id never matches the real customer, so basket_043''s
    record_path is absent from basket_paths and from refs. The id discovery''s output
    is the dependency feeding the SQL discovery; technique gap is data-flow between
    dependent discovery RPCs. Linkage: r001/r002 cover RPC-multiset emission and outcome
    gating, not parsing one RPC''s output into another''s params — this rule fills
    that gap.'
  status: active
- agents_md_anchor: null
  content: Never default a Read RPC's path to a directory (such as the Find search
    root) when its binding comes from a prior Find result that returned no match;
    pass the unresolved/empty path through instead, because Read on a directory fails
    with 'is a directory'.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: is a directory''. Observed:
    Find {''root'':''/docs'', name:''checkout''} returned <empty>, so matches is None
    and checkout_policy_path stays "". Failing fragment: `read_target = checkout_policy_path
    or "/docs"` then `checkout_policy = vm.read(path=read_target, number=True)` —
    the empty result triggers the `or "/docs"` fallback, feeding the directory /docs
    to Read, which raises ''is a directory''. Root cause is a directory used as a
    Read fallback target, not the unconditional emission (r001) nor outcome gating
    (r002) nor identity-binding (r003) — those leave the directory-fallback CODEGEN
    technique uncovered, so this is a new rule.'
  status: active
