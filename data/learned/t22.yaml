entries:
- content: Never use a wildcard find with extension .json on /proc/baskets/ (as in
    action 'find:*.json /proc/baskets/') without first listing the directory via /bin/ls
    to determine the actual filename pattern; instead, use /bin/ls /proc/baskets/
    and then read the basket file directly by matching the customer ID obtained from
    /bin/id.
  created: '2026-05-21'
  deactivated_reason: r001 instructs to list /proc/baskets/ via /bin/ls before reading,
    but the list operation timed out in this case, causing the failure. Deactivating
    r001 prevents re-applying the same timeout-prone behavior.
  id: r001
  reasoning: 'Verbatim error: ''Empty result''. Root cause category: empty-result.
    Failing fragment: action ''find:*.json /proc/baskets/''. The spec_goal ''checkout
    not directly supported — basket file provided as grounding ref'' and success criterion
    ''Read the basket content as grounding reference'' assumed basket files are .json
    in /proc/baskets/, but the find returned no files, likely because basket filenames
    lack a .json extension or the path structure differs. Rule must prevent relying
    on a wildcard pattern that can return empty before verifying the naming convention.'
  source: learn
  status: inactive
- content: Never use list:/proc/baskets/ or /bin/ls /proc/baskets/ as the first basket
    discovery action; instead, directly read the basket file by constructing its path
    using /bin/id (e.g., /proc/baskets/<cust_id>.json) and attempt read, falling back
    to list only if read fails.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003, r004'
  id: r002
  reasoning: 'Error: ''The read operation timed out'' on action ''list:/proc/baskets/''.
    Root cause: timeout on directory listing (semantic). Failing fragment: spec_goal=''checkout
    not directly supported — basket file provided as grounding ref'', action=''list:/proc/baskets/''.
    Existing rule r001 encourages listing /proc/baskets/ via /bin/ls, which directly
    caused the timeout. New rule must avoid listing entirely and instead construct
    the basket path from /bin/id.'
  source: learn
  status: inactive
- content: Always include the basket file read action (e.g., /bin/cat /proc/baskets/<cust_id>.json
    or equivalent) immediately after /bin/id in the same action sequence when spec_goal
    references checkout or basket retrieval, and do not interrupt the flow with a
    clarification unless the read fails.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003, r004'
  id: r003
  reasoning: 'Verbatim error: ''I''ve identified you as customer cust_067, but I haven''t
    retrieved your basket contents yet. To check out, I need to know what''s in your
    basket. Please ask me to view your basket or provide more detail so I can proceed.''
    Root cause category: wrong-action — the action set only included /bin/id and omitted
    the basket file read step. Failing fragment: actions list [''/bin/id''] from SDD_OUTPUT
    and the plan step ''Read the basket file'' that was not executed. Rule linkage:
    new rule must cite spec_goal ''checkout not directly supported — basket file provided
    as grounding ref'' and the incomplete action set to enforce sequential basket
    read.'
  source: learn
  status: inactive
- content: Always include a read command (e.g., /bin/cat /proc/baskets/<cust_id>.json)
    to read the basket file, and immediately after it include a fallback listing command
    (e.g., /bin/ls /proc/baskets/) in the same action sequence when spec_goal references
    checkout or basket retrieval, so that if the read fails, available baskets are
    discovered.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003, r004'
  id: r004
  reasoning: 'Verbatim error: ''Execute exception [''Read the basket file for customer
    cust_067 to provide groun]: read failed: not found''. Root cause category: wrong-action
    – the action ''/proc/baskets/cust_067.json'' is a path, not an executable read
    command; the spec_goal and plan correctly intended to read the basket file but
    the action omitted both the proper command and the fallback listing. Failing fragment:
    action ''/proc/baskets/cust_067.json'' from SDD_OUTPUT and PLAN_OUTPUT. Rule linkage:
    New rule must mandate a command like /bin/cat for reading and a fallback /bin/ls
    to handle not-found errors when spec_goal mentions checkout or basket retrieval.'
  source: learn
  status: inactive
- content: Never use list:/proc/baskets/ or /bin/ls /proc/baskets/ as the first basket
    discovery action; when spec_goal references checkout or basket retrieval, always
    include a read command (e.g., /bin/cat /proc/baskets/<cust_id>.json) immediately
    after /bin/id in the same action sequence, and immediately after that include
    a fallback listing command (e.g., /bin/ls /proc/baskets/) so that if the read
    fails, available baskets are discovered. Do not interrupt the flow with a clarification
    unless the read fails.
  created: '2026-05-21'
  deactivated_reason: r005 forced the inclusion of /bin/id as the first action even
    when it had already been executed, directly causing the repeated action error.
  id: r005
  reasoning: Merged r002 (explicitly forbids listing first, requires read then fallback),
    r003 (mandates immediate read after /bin/id, no clarification), and r004 (requires
    both read and fallback in sequence). The combined rule covers all constraints.
  source: learn
  status: inactive
- content: Never repeat an action that triggered a 'Repeated action detected' error
    in the previous cycle; when the error indicates /bin/id was repeated, do not include
    /bin/id in the new action sequence; instead, use /bin/ls /proc/baskets/ as the
    first action to discover available baskets, bypassing the identity retrieval.
  created: '2026-05-21'
  deactivated_reason: r006's condition ('error indicates /bin/id was repeated') is
    too generic and was not triggered in this cycle despite the same error, because
    the spec_goal did not match its implied context. The new rule ties the prohibition
    directly to the spec_goal content, ensuring it is applied when a checkout-related
    spec_goal is present.
  id: r006
  reasoning: 'Error: ''Repeated action detected — Action was: /bin/id''. Root cause:
    wrong-action — the spec and plan both specify /bin/id as the first action, but
    that action was already executed in a prior cycle. Failing fragment: action ''/bin/id''
    in SDD_OUTPUT and PLAN_OUTPUT. Existing rule r005 mandates always including /bin/id
    followed by read and listing, but does not account for prior execution. This rule
    likely caused the repetition. The correct approach is to skip /bin/id when it
    has already been used and instead use /bin/ls /proc/baskets/ to discover baskets
    directly.'
  source: learn
  status: inactive
- content: When spec_goal involves identifying or listing files in /proc/baskets/
    (e.g., 'Identify the user\'s basket from available files in /proc/baskets/'),
    use /bin/ls /proc/baskets/ as the action instead of list:/proc/baskets/ to avoid
    repeated action detection.
  created: '2026-05-21'
  deactivated_reason: These rules incorrectly prescribe /bin/ls which is not a supported
    runtime tool.
  id: r007
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: list:/proc/baskets/''. Root cause category: wrong-action
    — the plan chose list:/proc/baskets/ which had already been used in a prior cycle,
    triggering repetition. Failing fragment: action ''list:/proc/baskets/'' in both
    SDD_OUTPUT and PLAN_OUTPUT. Rule linkage: new rule must forbid using list:/proc/baskets/
    when the spec_goal involves enumerating basket files, and must mandate /bin/ls
    /proc/baskets/ instead.'
  source: learn
  status: inactive
- content: When spec_goal includes 'basket file provided as grounding ref' or 'checkout
    not directly supported', never include /bin/id in the action sequence; instead,
    use /bin/ls /proc/baskets/ as the first action, then read the basket file for
    the current customer by picking the appropriate filename from the listing (e.g.,
    the only file or a file matching the session identifier).
  created: '2026-05-21'
  deactivated_reason: These rules incorrectly prescribe /bin/ls which is not a supported
    runtime tool.
  id: r008
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: /bin/id''. Root cause category: wrong-action — the plan
    included /bin/id despite a prior repeated-action error. Failing fragment: action
    ''/bin/id'' in SDD_OUTPUT and PLAN_OUTPUT. Existing rule r006 states: ''Never
    repeat an action that triggered a Repeated action detected error... do not include
    /bin/id; instead use /bin/ls /proc/baskets/''. This rule was ignored because the
    spec_goal (''checkout not directly supported — basket file provided as grounding
    ref'') did not trigger the rule''s condition (which is based on error, not spec_goal).'
  source: learn
  status: inactive
- content: When the spec_goal involves listing files in /proc/baskets/ to identify
    the user's basket, use 'list:/proc/baskets/' as the action instead of '/bin/ls
    /proc/baskets/'.
  created: '2026-05-21'
  deactivated_reason: r009 caused use of list:/proc/baskets/ which times out; new
    rule provides safe alternative.
  id: r009
  reasoning: 'Verbatim error: ''runtime tool not found: not found'' for action ''/bin/ls
    /proc/baskets/''. Root cause: wrong-action — the tool /bin/ls does not exist in
    the runtime environment. Failing fragment: action ''/bin/ls /proc/baskets/'' from
    both SDD and PLAN outputs. Rule linkage: existing rules r007 and r008 prescribe
    this action, causing the failure.'
  source: learn
  status: inactive
- content: Never use composite descriptive sentences as plan steps; each step must
    be exactly one executable tool command (e.g., '/bin/id', '/bin/cat /path', 'list:/path/')
    from the SDD actions list.
  created: '2026-05-21'
  deactivated_reason: null
  id: r010
  reasoning: 'Verbatim error: "Execute exception [''Determine user identity via /bin/id,
    read the corresponding]: runtime tool not found: not found". Root cause category:
    wrong-action (plan steps were descriptive, not executable tool calls). Failing
    fragment: plan step 1 "Determine user identity via /bin/id, read the corresponding
    basket file from /proc/baskets/". Rule linkage: new rule must prohibit descriptive
    sentences as plan steps and enforce tool-command-only steps.'
  source: learn
  status: active
- content: Never include /bin/id as an action when a prior action sequence in the
    session has already executed /bin/id; instead, start the action sequence with
    reading the basket file at /proc/baskets/<cust_id>.json when the spec_goal involves
    checkout or basket retrieval.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r011, r012'
  id: r011
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: /bin/id''. Root cause category: wrong-spec — the spec_goal
    and plan omitted the basket file read action and only contained /bin/id, which
    had already been executed in a prior sequence. Failing fragment: actions list
    [''/bin/id''] and plan step ''Execute /bin/id''. Rule linkage: new rule must cite
    spec_goal ''Provide the user''s basket contents as a grounding reference for manual
    checkout'' and action ''/bin/id'' to prevent repetition and enforce inclusion
    of the basket read.'
  source: learn
  status: inactive
- content: When the spec_goal involves checkout or basket retrieval and a listing
    action (list:/proc/baskets/) has already been executed in the current session,
    never repeat the listing; instead start the action sequence with reading the basket
    file at /proc/baskets/<cust_id>.json.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r011, r012'
  id: r012
  reasoning: 'Error: ''Repeated action detected — must use a different query or approach.
    Action was: list:/proc/baskets/''. Root cause category: wrong-action. Failing
    fragment: action ''list:/proc/baskets/'' in SDD plan and PLAN_OUTPUT. The spec_goal
    was to provide basket contents and reference checkout policy, but the plan started
    with listing baskets, which had already been executed in a prior cycle. Existing
    rules r009, r010, r011 did not address the repetition of list action. A new rule
    is needed to skip listing if already performed.'
  source: learn
  status: inactive
- content: When the spec_goal involves checkout or basket retrieval and either /bin/id
    or list:/proc/baskets/ has already been executed in the current session, do not
    repeat them; instead start the action sequence with reading the basket file at
    /proc/baskets/<cust_id>.json.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r013, r014'
  id: r013
  reasoning: 'r011 and r012 both address the same pattern: skip a previously executed
    action (id or listing) and directly read the basket file. They are complementary
    and can be merged into a single rule covering both prior actions. r012 (highest
    id) was used as the base and extended to include /bin/id from r011.'
  source: learn
  status: inactive
- content: When the spec_goal involves checkout, verify if /bin/id has already been
    executed in the current session; if yes, omit any step that executes /bin/id and
    instead directly read the basket file at /proc/baskets/<cust_id>.json as the first
    action.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r013, r014'
  id: r014
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: /bin/id''. Root cause category: wrong-action (repeated
    action). Failing fragment: action ''/bin/id'' in both SDD_OUTPUT.actions and PLAN_OUTPUT.action,
    plus spec_goal phrase ''after identity retrieval'' that implies /bin/id is unconditionally
    needed. Existing rule r013 states: ''When the spec_goal involves checkout or basket
    retrieval and either /bin/id or list:/proc/baskets/ has already been executed
    in the current session, do not repeat them; instead start the action sequence
    with reading the basket file at /proc/baskets/<cust_id>.json.'' This rule was
    not applied because the spec_goal assumed identity retrieval must precede basket
    reading, and the plan generation ignored session history. The failure was predictable
    and preventable if r013 had been enforced during plan generation.'
  source: learn
  status: inactive
- content: When the spec_goal involves checkout or basket retrieval, verify if /bin/id
    or list:/proc/baskets/ has already been executed in the current session; if yes,
    omit any step that executes /bin/id or list:/proc/baskets/ and instead directly
    read the basket file at /proc/baskets/<cust_id>.json as the first action.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r015, r016'
  id: r015
  reasoning: r014 (checkout, /bin/id only) is a strict subset of r013 (checkout or
    basket retrieval, /bin/id or list:/proc/baskets/). Merged rule extends r014's
    wording to cover basket retrieval and list:/proc/baskets/ as in r013, ensuring
    no repetition of either command when already executed.
  source: learn
  status: inactive
- content: Never use 'list:/proc/baskets/' when the spec_goal involves checkout or
    basket retrieval; always first execute '/bin/id' to determine the current user's
    cust_id, then directly read the basket file at '/proc/baskets/<cust_id>.json'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r015, r016'
  id: r016
  reasoning: 'Verbatim error: ''Execute exception [''List the /proc/baskets/ directory
    to enumerate basket files]: The read operation timed out''. Root cause: wrong-action
    (list:/proc/baskets/ timed out; should have used /bin/id then direct read). Failing
    fragment: action ''list:/proc/baskets/''. Rule linkage: new rule must supersede
    r009, which suggested using list:/proc/baskets/ for basket identification, but
    that action causes timeout.'
  source: learn
  status: inactive
- content: When the spec_goal involves checkout or basket retrieval, never use 'list:/proc/baskets/'.
    First, if '/bin/id' has not already been executed in the current session, execute
    '/bin/id' to determine the current user's cust_id. Then directly read the basket
    file at '/proc/baskets/<cust_id>.json' as the first action.
  created: '2026-05-21'
  deactivated_reason: null
  id: r017
  reasoning: r015 and r016 both address checkout/basket retrieval scenarios and overlap
    significantly. r016 prohibits use of list:/proc/baskets/ and mandates /bin/id
    first. r015 adds a condition to skip /bin/id if already executed. Merging preserves
    the prohibition and the skipping logic, using r016 as the base (higher id) extended
    with r015's pre-execution check.
  source: learn
  status: active
- content: When the spec_goal is about submitting or completing checkout, after executing
    /bin/id and reading the basket file at /proc/baskets/<cust_id>.json, the actions
    list must include an attempt to submit checkout using the appropriate tool (e.g.,
    '/bin/payments' with checkout command) rather than presenting the basket and requesting
    clarification; never assume checkout is not directly supported without attempting
    an available tool.
  created: '2026-05-21'
  deactivated_reason: null
  id: r018
  reasoning: 'Verbatim error: ''I cannot submit a checkout because no basket data
    or checkout process was executed.'' Root cause: wrong-spec — the spec_goal incorrectly
    stated ''checkout not directly supported'', leading to an actions list containing
    only ''/bin/id'' without any checkout submission attempt. Failing fragment: spec_goal
    phrase ''checkout not directly supported'' and action list missing checkout tool
    invocation. Rule linkage: new rule must enforce that when spec_goal involves checkout,
    the actions list includes an executable checkout submission step.'
  source: learn
  status: active
