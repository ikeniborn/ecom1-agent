- agents_md_anchor: null
  content: When a required parameter is missing, Always include a discovery step to
    attempt to resolve it from the caller's active session or identity before falling
    back to clarification.
  created: '2026-06-21'
  deactivated_reason: Superseded by stricter rule forbidding clarify-only plans without
    discovery.
  id: r001
  reasoning: 'Error: ''interpret: attempt grounded discovery before clarifying (clarify-only
    plan rejected while OUTCOME_OK is reachable)''. The PlanIR was a pure clarify-only
    plan (discovery empty, decision default clarify). The interpret phase rejected
    it because OUTCOME_OK is reachable without clarification, implying the basket_id
    could be inferred from the session. The plan should have included a discovery
    step to resolve the basket_id from the caller''s active session or identity before
    defaulting to clarification.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a specific record path is unknown, Always list the parent directory
    first to discover available records before attempting to read a specific path.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The script attempted to read ''/customer/guest'' which does not exist,
    causing ''real_vm: read failed: not found''. The plan should have first listed
    ''/customer'' to see what records are available, then used a valid path or branched
    to clarification. The existing rule about missing parameters does not cover this
    discovery failure.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always use the 'get' primitive to extract a field from a single row; 'column'
    expects a list[dict] and will fail on a single dict.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'ERROR: interpret: compute step ''column'' failed: ''column'' expects
    list[dict]; use ''get'' for a single row. Root cause: PlanIR used ''first'' to
    reduce basket_info_rows to a single row, then incorrectly used ''column'' to extract
    fields from that single dict. The failing fragment: {"prim":"first","args":["$basket_info_rows"],"into":"basket_info"}
    followed by {"prim":"column","args":["$basket_info","basket_id"],"into":"basket_id"}.
    The ''column'' primitive requires a list of rows; for a single row, ''get'' is
    the correct primitive. This rule prevents future misuse of ''column'' on single-row
    bindings.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never emit a PlanIR that only contains a clarify decision without any discovery
    steps when the objective's required parameters are missing.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The PlanIR contained only a clarify decision with no discovery steps,
    despite the basket_id parameter being missing. The interpret phase rejected it
    as clarify-only while OUTCOME_OK is reachable. The existing rule (r001) advised
    including discovery but was not enforced; this stricter rule forbids clarify-only
    plans outright.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use 'concat' to build strings; 'concat' merges two rowsets. Use 'format'
    to interpolate values into a template string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: The compute step 'concat' failed because it was given three arguments
    (two strings and a reference) instead of two list[dict] rowsets. The intent was
    to build a file path string. The correct primitive for string interpolation is
    'format', which takes a template string and a list of bindings. This rule will
    prevent future misuse of concat for string construction.
  status: inactive
  surface: ir
