  id: r006
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/baskets/basket_013.json''''.
    The PlanIR only had a clarify answer with no refs. Discovery found a basket_id
    via SQL but did not map it to a record_path. The decision had no branches, so
    it defaulted to clarify, which lacks the required ref. Root cause: PlanIR omitted
    a branch for successful discovery and did not construct the record_path. The rule
    ensures future plans include such a branch and path construction.'
