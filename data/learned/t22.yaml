- agents_md_anchor: null
  content: When the script computes a verification signal that a success_criterion
    depends on (inventory sufficiency, identity resolution, single-record existence,
    policy precondition), gate the final answer outcome on that signal and emit OUTCOME_NONE_CLARIFICATION
    when it fails, instead of unconditionally emitting the answer_template's hardcoded
    OUTCOME_OK.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_NONE_CLARIFICATION,
    got OUTCOME_OK''. Root cause: script computed verification signal `inventory_ok`
    (avail < req branch sets it False) but never read it before calling vm.answer;
    outcome string was hardcoded ''OUTCOME_OK'' from the answer_template. Failing
    fragment: `inventory_ok = True ... if avail < req: inventory_ok = False` is dead
    — followed by unconditional `vm.answer(message=message, outcome="OUTCOME_OK",
    refs=refs)`. The success_criteria require ''Every basket line has sufficient available_today_quantity'';
    when unmet the run must clarify, not check out. Rule linkage: r001 governs RPC-multiset
    emission (run every RPC unconditionally) and does NOT address outcome selection
    — orthogonal. New rule covers the CODEGEN technique of binding answer outcome
    to computed verification signals, which no active rule encodes. Not identical
    to r001, so no skip.'
  status: active
