- agents_md_anchor: null
  content: Never use the output of an Exec RPC as a sequence argument to 'first' or 'column' primitives;
    Exec RPC returns an ExecResponse object, not a list of rows. If you need a null value for a parameter,
    use a 'literal' compute step instead.
  created: '2026-06-22'
  deactivated_reason: null
  id: r014
  reasoning: 'Error: ''interpret: compute step ''first'' failed: ''ExecResponse'' object is not subscriptable''.
    Root cause: the discovery step bound basket_id_src to an Exec RPC that ran ''SELECT NULL AS basket_id;''.
    The Exec RPC returns an ExecResponse object, not a list of rows. The compute step ''first'' tried
    to subscript that object, causing the failure. Failing PlanIR fragment: discovery step with bind ''basket_id_src''
    and compute step ''first'' on ''$basket_id_src''. The correct approach is to use a ''literal'' compute
    step to assign null when the parameter is not provided.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use the 'concat' primitive to build strings; concat only merges two lists of rows. To
    construct a string value, use a 'literal' compute step or embed the string directly in the operation's
    args.
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: 'Error: ''interpret: compute step ''concat'' failed: <lambda>() takes 2 positional arguments
    but 3 were given. CONTRACT: concat(a, b): both args must be list[dict] rows (parse Exec output via
    rowsets first).'' The failing PlanIR compute step was: {"prim":"concat","args":["/payments/","$new_payment_id",".json"],"into":"payment_record_path"}.
    The concat primitive expects exactly two row-list arguments, not three string arguments. The same
    misuse appears in the step building payment_json. Root cause: the planner attempted to use concat
    for string concatenation, which is not its purpose. The rule ensures future plans use proper string
    construction (literal or direct embedding) instead.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include discovery steps to extract parameters from the instruction when the parameter
    is marked as 'extract from instruction, or null if not provided', before any decision branches that
    check for null.
  created: '2026-06-22'
  deactivated_reason: null
  id: r016
  reasoning: 'Error: interpret: attempt grounded discovery before clarifying (clarify-only plan rejected
    while OUTCOME_OK is reachable). Root cause: PlanIR lacks discovery steps to extract basket_id from
    instruction; it immediately routes to clarify without attempting extraction. Failing PlanIR fragment:
    discovery empty, decision only checks null and defaults to clarify. Existing rule r011 covers null-check
    branch but not discovery. New rule ensures discovery steps are included before null-check.'
  status: active
  surface: ir
