  source: learn
  status: active
- content: Always emit complete, well-formed JSON for SDD output — never truncate
    mid-string or mid-object; for spec_goal='clarify_basket_id', keep plan.steps entries
    short (≤ 20 words each) and actions to a single clarify action so total output
    stays within token limits and all braces/brackets/strings are closed before the
    response ends.
  created: '2026-05-24'
  deactivated_reason: 'Consolidated: r005, r007'
  id: r007
  reasoning: 'Verbatim error: ''failed to parse LLM output'' — the raw SDD JSON was
    truncated mid-string (''belonging to cu...''). Root cause category: syntax — the
    LLM output was cut off before the JSON object was closed, producing invalid/unparseable
    JSON. Failing fragment: the ''plan.steps'' array string was truncated: ''"Query
    baskets table for all open baskets belonging to cu'' — no closing quote, bracket,
    or brace. Rule linkage: r006 mandates ''Always emit valid structured SDD spec''
    but does not address output length/truncation causing malformed JSON. The new
    rule must require that the SDD JSON be complete and well-formed (all braces/brackets/strings
    closed) before emission, specifically for the clarify_basket_id spec_goal path
    where plan.steps content can grow long.'
  source: learn
  status: inactive
