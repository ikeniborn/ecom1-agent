entries:
- content: When a customer says "my basket" or "check it out" without specifying a
    basket ID, return OUTCOME_NONE_CLARIFICATION asking which basket they want to
    check out. List any candidate baskets found in SQL results to help them specify.
    Do NOT return OUTCOME_NONE_UNSUPPORTED — the checkout tool exists, but the basket
    ID is required to proceed.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r001
  reasoning: Agent said UNSUPPORTED but correct is CLARIFICATION — the basket ID was
    not specified so agent should ask for it.
  source: manual
  status: inactive
- content: 'Always emit a valid structured SDD spec (fields: spec_goal, success_criteria,
    plan, actions) in the SDD phase even when the resolution is OUTCOME_NONE_CLARIFICATION;
    encode the clarification intent as spec_goal=''clarify_basket_id'', list candidate
    basket IDs (e.g. basket_063, basket_016, basket_027) in success_criteria, and
    set actions to a single clarify action — never emit free-form conversational text
    as SDD output.'
  created: '2026-05-24'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r002
  reasoning: 'Verbatim error: ''SDD phase: failed to parse LLM output. Raw: 3 active
    baskets found. Which to check out? 1. `basket_063`...''. Root cause: wrong-spec
    — SDD phase emitted free-form conversational text instead of a structured spec
    document (spec_goal/success_criteria/plan/actions). Failing fragment: the SDD
    LLM acted on r001''s ''return OUTCOME_NONE_CLARIFICATION'' instruction directly,
    producing the clarification message as raw output rather than encoding the clarification
    intent inside a valid SDD schema. Rule linkage: new rule must constrain SDD phase
    output format when intent is OUTCOME_NONE_CLARIFICATION, complementing r001 which
    targets only ANSWER phase behavior.'
  source: learn
  status: inactive
- content: 'Always set spec_goal to the exact literal string ''clarify_basket_id''
    with no appended text, punctuation, or prose (e.g. never ''clarify_basket_id —
    ...'' or ''clarify_basket_id: ...''); any clarification context belongs in success_criteria
    or plan fields only.'
  created: '2026-05-24'
  deactivated_reason: 'Consolidated: r003, r004'
  id: r003
  reasoning: 'Verbatim error: ''failed to parse LLM output. Raw: ```json\n{\n  "spec_goal":
    "clarify_basket_id — customer has 3 open baskets; need to know which to check
    out"''. Root cause: wrong-value-type — spec_goal field contains prose annotation
    appended after the required literal value ''clarify_basket_id'', making it unparseable
    as a clean enum/literal. Failing fragment: spec_goal=''clarify_basket_id — customer
    has 3 open baskets; need to know which to check out'' — the em-dash and trailing
    prose corrupt the field value. Rule r002 says set spec_goal=''clarify_basket_id''
    but does not explicitly forbid appending prose to that field value. New rule must
    close that gap by requiring spec_goal be EXACTLY the literal string ''clarify_basket_id''
    with no appended text.'
  source: learn
  status: inactive
- content: 'Always set spec_goal to exact literal ''clarify_basket_id'' (no appended
