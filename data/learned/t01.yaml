entries:
- content: Always push product_properties key/value filters into the JOIN ON clause
    (e.g., JOIN product_properties pp ON p.sku=pp.sku AND pp.key='storage_type' AND
    pp.value_text='tool bag') instead of using HAVING on a computed alias — keeps
    query short, avoids alias-in-HAVING, prevents output truncation.
  created: '2026-05-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''failed to parse LLM output. Raw: ...GROUP BY p.sku,
    p.pa'' — output truncated mid-SQL string, breaking JSON. Root cause: wrong-action
    — the PLAN phase emitted a long SQL with HAVING on a computed alias (''storage_type'')
    plus three joins; the combined length exceeded the output window and was cut at
    ''p.pa'' (should be ''p.path''). Failing fragment: action ''SELECT p.sku, p.path
    ... HAVING storage_type = \''tool bag\''''. Rule linkage: spec_goal requires ''property
    key=storage_type value=tool bag'' filter — this can be pushed into the JOIN ON
    clause, shortening the query enough to prevent truncation.'
  source: learn
  status: active
- content: Always split multi-token series names into individual AND-chained LIKE
    conditions when a full-string series LIKE filter returns empty results — e.g.,
    replace `p.series LIKE '%SYS 3JJ-9LM%'` with `p.series LIKE '%SYS%' AND p.series
    LIKE '%3JJ%' AND p.series LIKE '%9LM%'` — to tolerate catalogue spacing and naming
    variations.
  created: '2026-05-24'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''Empty result: sku,path,name,series,available_today''.
    Root cause: wrong-filter — series LIKE ''%SYS 3JJ-9LM%'' is too specific; catalogue
    may store series name with different spacing, casing, or token order. Failing
    fragment: action filter ''p.series LIKE \''%SYS 3JJ-9LM%\'''' in spec_goal ''Find
    Festool SYS 3JJ-9LM series products''. STOP_RULES explicitly say ''If series name
    differs slightly, broaden series filter'' but no rule encodes HOW to broaden.
    Rule linkage: new rule must target spec_goal series filter and prescribe token-split
    fallback.'
  source: learn
  status: active
- content: 'Always report NO with a catalogue-not-found explanation when the series-only
    fallback query (action: ''SELECT p.sku, p.path, p.name, p.series FROM products
    p WHERE p.brand=... AND p.series LIKE token-split'') returns empty after r001
    and r002 have been applied — do not attempt further query variants; the item is
    absent from catalogue.'
  created: '2026-05-24'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''Empty result: sku,path,name,series,available_today''.
    Root cause: empty-result — both r001 (JOIN ON clause) and r002 (AND-chained LIKE
    tokens) were applied correctly per SDD_OUTPUT actions, yet result still empty.
    Failing fragment: action ''SELECT p.sku, p.path, p.name, p.series, COALESCE(SUM(i.available_today),
    0) AS available_today FROM products p JOIN product_properties pp ON p.sku = pp.sku
    AND pp.key = ''storage_type'' AND pp.value_text = ''tool bag'' LEFT JOIN inventory
    i ON p.sku = i.sku WHERE p.brand = ''Festool'' AND p.series LIKE ''%SYS%'' AND
    p.series LIKE ''%3JJ%'' AND p.series LIKE ''%9LM%'' GROUP BY p.sku, p.path, p.name,
    p.series'' and fallback ''SELECT p.sku, p.path, p.name, p.series FROM products
    p WHERE p.brand = ''Festool'' AND p.series LIKE ''%SYS%'' AND p.series LIKE ''%3JJ%''
    AND p.series LIKE ''%9LM%'''' both returned empty. STOP_RULES states: ''If token-split
    query still returns empty, report NO with catalogue-not-found explanation''. Rule
    linkage: new rule must encode the terminal reporting behavior when both primary
    and fallback queries return empty after applying r001+r002.'
  source: learn
  status: active
