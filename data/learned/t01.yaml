- agents_md_anchor: null
  content: Do not use concat to set a literal string value; use a literal step or
    bind the string directly. Concat requires two list[dict] arguments.
  created: '2026-06-22'
  deactivated_reason: superseded by pinned fuzzy-match method rule (cap)
  id: r010
  reasoning: 'The PlanIR compute step ''concat'' was called with a single string argument
    ''Nut Bolt and Washer'', but concat expects two list[dict] arguments (rowsets).
    The error: ''concat() missing 1 required positional argument: b''. The intent
    was to set product_name for the answer message, which should be done via a literal
    primitive or by referencing the param directly, not concat.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: To answer ‘do you carry product X’, resolve the product using NORMALIZED
    / case-insensitive tokenized matching (ILIKE on the key tokens of brand + kind
    + descriptive attributes) on the product catalogue table — do NOT use exact full-string
    `series =` equality. Structure the plan to first discover candidate rows (a ‘first’
    step with fuzzy/ILIKE filters), then get the sku/name/record_path from the matched
    record (a ‘get’ or field-extract step). Return OUTCOME_NONE_UNSUPPORTED only when
    the product is genuinely absent after normalized fuzzy matching, not because an
    exact-match query returned zero rows.
  created: '2026-06-23'
  deactivated_reason: null
  id: g001
  pinned: true
  reasoning: Task t01 failed repeatedly because PLAN used exact WHERE series = '<full
    descriptive string>' which returned 0 rows even though the product exists. The
    correct approach is to normalize and tokenize the product name, then match via
    ILIKE on individual tokens (brand, kind, key attributes). This pinned method rule
    ensures PLAN always uses fuzzy/tokenized matching and never falls back to exact-string
    equality for catalogue existence checks.
  status: active
  surface: ir
