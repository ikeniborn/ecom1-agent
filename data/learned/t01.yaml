  content: Always include all required refs from the plan's required_refs in the answer's
    refs list, mapping each ref to the corresponding column from the rowset as indicated
    by the ref's source path.
  created: '2026-06-18'
  deactivated_reason: consolidated into the crisp authoritative r004
  id: r001
  reasoning: 'Error: interpret: unresolved required ref(s) [''$row.record_path'']
    on OK answer. Root cause: The PlanIR answer for the ''found'' branch has an empty
    refs list, but the plan''s required_refs for OUTCOME_OK includes a record_path
    ref. The planner omitted the required refs from the answer. Failing PlanIR fragment:
    the answer object in the ''found'' branch has "refs":[]. Rule linkage: This rule
    ensures the planner always populates the answer''s refs with all required refs,
    preventing unresolved ref errors.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never include both a top-level 'answer' mapping and explicit answer ops
    in the same PlanIR; use only one method to define answers.
  created: '2026-06-18'
  deactivated_reason: consolidated into the crisp authoritative r004
  id: r002
  reasoning: 'Error ''real_vm: answer already provided'' indicates duplicate answer
    attempts. The PlanIR contains both a top-level ''answer'' object (mapping labels
    to answer configs) and explicit answer ops with guard_labels. The system likely
    auto-generates answers from the top-level mapping, causing a conflict when explicit
    ops also try to provide answers. The fix is to remove the top-level ''answer''
    mapping and rely solely on explicit answer ops, or vice versa.'
  status: inactive
  surface: ir
