- agents_md_anchor: null
  content: Catalogue matching must err toward FINDING a present product, not toward
    a false 'absent'. Match on the FEWEST distinctive attributes — brand plus the
    single most distinctive model/series token via a broad normalized LIKE on a short
    fragment (e.g. a model code stem) — NOT every named property ANDed together and
    NOT a full multi-word series string. Each extra variant-property JOIN or exact-equality
    predicate narrows the result and risks 0 rows when the re-seeded value differs
    in format. If unsure of a stored value's format, SELECT DISTINCT the candidate
    column (or sample the table) first to learn it, then match normalized (LOWER/TRIM).
    Only after a non-empty match should the found/absent decision be trusted.
  created: '2026-06-18'
  deactivated_reason: consolidated into the crisp authoritative r004
  id: r006
  reasoning: 'Run v006: a present product (STO-2R84BSHQ) scored 0 because the PLAN
    over-constrained (brand AND name/series/model token AND a storage_type property
    JOIN with a baked ''sys 3jj-9lm'' fragment) -> 0 rows -> default ''absent'' ->
    wrong <NO>. The ref-plumbing was correct; the matching was too strict. Method
    rule: minimal-distinctive-attribute matching + probe-before-constrain, so a present
    product is found and the conditional record_path grounds. Survives re-seeding.'
  status: inactive
  surface: ir
