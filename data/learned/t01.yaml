- agents_md_anchor: '#answer-shape-field-inclusion'
  content: When success_criteria includes a nonempty check on a field under $answer
    (e.g., $answer.product_sku) and the answer message skeleton includes a placeholder
    for that field (e.g., {product_sku}), the answer branch for the matching outcome
    must include that field as a top-level attribute of the answer object, assigned
    the computed value. The placeholder will be automatically replaced, and the field
    is necessary for the success_criteria to pass.
  created: '2026-06-16'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: verify: success_criteria[0] failed: nonempty $answer.product_sku.
    The PlanIR sets $product_sku via compute but does not add a ''product_sku'' field
    to the answer object; only ''message'' and ''refs'' are present. The message skeleton
    ''{product_sku}'' does not create the field. The success_criteria checks the answer
    object''s fields, so the field must be explicitly included. The required_refs
    (record_path) were correctly provided. This is a shape bug in the PlanIR answer
    branch. No existing rule covers this exact case (r009 is for dotted variable paths
    like $product.product_sku, not $answer.field).'
  status: active
  surface: ir
- agents_md_anchor: '#plan-answer-construction'
  content: When the answer message skeleton includes simple placeholders like {field_name}
    (single-level, no dot), the answer branch for that outcome must include those
    field names as top-level attributes in the answer object, with their values set
    to the computed variable or path that holds the data, so that placeholder substitution
    succeeds and success_criteria referencing $answer.field_name are satisfied. Additionally,
    the answer branch must include all required refs from the IntentSpec's required_refs
    for that outcome.
  created: '2026-06-16'
  deactivated_reason: r011 advises including top-level attributes in answer for placeholder
    substitution, but the schema only allows 'message' and 'refs' (see r007 and validation
    error). This rule directly caused the extra fields that led to validation failure.
  id: r011
  reasoning: 'The error ''real_vm: <lambda>() takes 2 positional arguments but 3 were
    given'' occurs because the answer object for the ''found'' branch is missing the
    fields ''product_sku'' and ''product_name'' that are required by the message skeleton
    placeholders {product_sku} and {product_name}. The Answer rpc attempts to substitute
    these placeholders by looking up the fields as top-level attributes of the answer
    object, but when the field is absent, a lambda that expects two arguments (the
    answer object and the key) receives a third argument (likely a default or fallback)
    causing a mismatch. The failing PlanIR fragment is the answer branch: {"found":
    {"message": "The product {product_name} (SKU: {product_sku}) is available in the
    catalogue.", "outcome": "OUTCOME_OK", "refs": []}}. It lacks the necessary fields
    and also fails to include the required_refs (record_path) for OUTCOME_OK. Existing
    rules (r001, r005, r009) address parts of this but do not explicitly mandate top-level
    fields for simple placeholders, so a new rule is needed to ensure the answer object
    carries both placeholder fields and required refs.'
  status: inactive
  surface: ir
