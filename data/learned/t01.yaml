    is kept as the canonical form.
  source: learn
  status: inactive
- content: When a full-string `p.series` LIKE filter returns empty results, split
    multi-token series names into individual AND-chained LIKE conditions, but exclude
    descriptive product name tokens such as 'Tool', 'Box', and 'Bag' from the `p.series`
    filters; restrict those filters to series identifier tokens (e.g., '%SYS%', '%3JJ%',
    '%9LM%') and match descriptive tokens against `p.name` instead, to tolerate catalogue
    spacing and naming variations while avoiding empty results.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r029, r031'
  id: r031
  reasoning: r002 and r029 address the same spec_goal (handling multi-token series
    names in LIKE filters). r029 (highest id) refines the token-split approach by
    excluding descriptive tokens from `p.series`; the merged rule extends r029 with
    r002's trigger condition so the full scope is covered in one rule.
  source: learn
  status: inactive
- content: Never AND-chain multiple descriptive product name tokens in `p.name` LIKE
    filters in the primary catalogue query action when `p.series` already contains
    the unique identifier tokens for the product line, because requiring every descriptive
    token in `p.name` over-constrains the query and causes empty results before the
    series-only fallback is reached.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r032'
  id: r032
  reasoning: 'Verbatim error: ''Empty result: sku,path,name''. Root cause: wrong-filter.
    The action ''SELECT p.sku, p.path, p.name FROM products p JOIN product_properties
    pp ON p.sku = pp.sku AND pp.key = ''storage_type'' AND pp.value_text = ''parts
    case'' WHERE p.brand = ''Festool'' AND p.series LIKE ''%SYS%'' AND p.series LIKE
    ''%3JJ%'' AND p.series LIKE ''%9LM%'' AND p.name LIKE ''%Tool%'' AND p.name LIKE
    ''%Box%'' AND p.name LIKE ''%Bag%'''' AND-chained multiple descriptive tokens
    (''Tool'', ''Box'', ''Bag'') in `p.name`, which over-constrained the primary catalogue
    query and excluded valid products before the series-only fallback could be evaluated.
    The new rule prohibits applying redundant, restrictive `p.name` descriptive filters
    when `p.series` already contains the unique identifier tokens.'
  source: learn
  status: inactive
- content: Use correct column name.
