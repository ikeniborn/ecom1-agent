- agents_md_anchor: null
  content: When the decision branch is not_found, the answer message must contain
    the literal '<NO>'.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more direct and unconditional rule.
  id: r001
  reasoning: The grader error 'Answer should contain '<NO>'' indicates the answer
    for the not_found branch lacked '<NO>'. The script's answer was 'No matching product
    found.' which does not contain '<NO>'. The rule ensures future PlanIRs include
    '<NO>' in the not_found answer message.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always set the answer message for the not_found branch to '<NO>'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The verify phase failed because the answer message for OUTCOME_NONE_UNSUPPORTED
    did not contain ''<NO>''. The PlanIR set the not_found branch message to ''We
    sell the {product_name} (SKU: {product_sku}).'' which is the same as the found
    branch. Existing rule r001 (''When the decision branch is not_found, the answer
    message must contain the literal ''<NO>''.'') was not applied. A stronger, unconditional
    rule is needed to force the not_found answer message to be exactly ''<NO>''.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use the answer_shape skeleton when the not_found outcome requires
    a specific message; instead, set the message directly in the answer block for
    each outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'The verify step failed because the answer message for OUTCOME_NONE_UNSUPPORTED
    did not contain ''<NO>''. The plan''s not_found answer block set message to ''<NO>'',
    but the answer_shape skeleton ''We sell the {product_name} (SKU: {product_sku}).''
    was applied, overriding it with a message that lacked ''<NO>''. The root cause
    is that the answer_shape skeleton interfered with the explicit not_found message.
    The corrective rule ensures that the skeleton is not used when a specific not_found
    message is required.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always use the exact outcome string from the IntentSpec (e.g., 'OUTCOME_OK',
    'OUTCOME_NONE_UNSUPPORTED') as the key in the answer block, not a custom label
    like 'found' or 'not_found'.
  created: '2026-06-22'
  deactivated_reason: Superseded by new rule that requires outcome strings for both
    decision labels and answer keys.
  id: r004
  reasoning: 'The verify step failed for OUTCOME_NONE_UNSUPPORTED because the answer
    message did not contain ''<NO>''. The PlanIR used ''not_found'' as the answer
    block key, but the interpreter likely expects the key to match the outcome string
    exactly. As a result, the explicit message ''<NO>'' was ignored and the answer_shape
    skeleton was used instead, producing a message without ''<NO>''. The failing fragment
    is the answer block keys: "found" and "not_found" instead of "OUTCOME_OK" and
    "OUTCOME_NONE_UNSUPPORTED".'
  status: inactive
  surface: ir
