- agents_md_anchor: null
  content: When success_criteria includes a regex_match on $answer.text, the answer
    message must be exactly the string that matches the regex (e.g., '<YES>' or '<NO>'),
    not a natural-language sentence.
  created: '2026-06-16'
  deactivated_reason: null
  id: r002
  reasoning: The verify phase failed with 'regex_match' on $answer.text because the
    answer message was a full sentence ('Milwaukee FID3 is available... <YES>') rather
    than the exact pattern '<YES>' or '<NO>'. The regex_match op likely requires the
    entire string to match the pattern, so the PLAN must produce an answer message
    that is exactly the matched string.
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using /bin/sql, do not use --param flags; instead embed parameter
    values directly in the SQL query string, properly quoted and escaped.
  created: '2026-06-16'
  deactivated_reason: null
  id: r003
  reasoning: 'The error was verify: success_criteria[0] failed because the answer.text
    did not match ''<YES>|<NO>''. The root cause is that the SQL query used unsupported
    --param flags, causing the /bin/sql tool to output its help text instead of executing
    the query. This led to no data rows, and the answer branch likely produced an
    incorrect answer.text. The PlanIR fragment: discovery args with ''--param'' flags.
    The /bin/sql tool does not support --param; parameters must be embedded directly
    in the SQL string. The rule ensures future plans use correct SQL syntax.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When success_criteria includes a regex_match on $answer.text, the answer
    branch must set the message to the exact string that matches the regex, and the
    answer_shape skeleton must be ignored (the message is the full answer text).
  created: '2026-06-16'
  deactivated_reason: null
  id: r004
  reasoning: 'The verify step failed with ''success_criteria[0] failed: regex_match
    on $answer.text with pattern <YES>|<NO>''. The observed SQL output was cnt=0,
    so the decision branch correctly selected ''no'' and the answer message was set
    to ''<NO>''. However, the final answer text likely incorporated the answer_shape
    skeleton ''Milwaukee FID3 is {availability_status} in the catalog. {details}'',
    producing a text that did not match the regex. The existing rule [in-session]
    only requires the message to be the exact matching string, but does not explicitly
    forbid using the skeleton. A new rule is needed to ensure the skeleton is omitted
    when a regex_match on $answer.text is present.'
  status: active
  surface: ir
- content: null
