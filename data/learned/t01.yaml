- content: Always exclude descriptive product name tokens such as 'Tool', 'Box', and
    'Bag' from the token-split AND-chained LIKE filters on `p.series` in the action;
    restrict those filters to the series identifier tokens (e.g., '%SYS%', '%3JJ%',
    '%9LM%') and match descriptive tokens against `p.name` instead, to avoid empty
    results when the series column does not contain product descriptions.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r029, r031'
  id: r029
  reasoning: 'Verbatim error: ''Empty result: sku,path,name''. Root cause: wrong-filter
    — the action applied token-split LIKE conditions to the `series` column using
    descriptive product name tokens (''Tool'', ''Box'', ''Bag'') that are not stored
    in the `series` field, causing both the primary query and the intended fallback
    to return empty. Failing fragment: action ''SELECT p.sku, p.path, p.name FROM
    products p ... WHERE p.brand = ''Festool'' AND p.series LIKE ''%SYS%'' ... AND
    p.series LIKE ''%Tool%'' AND p.series LIKE ''%Box%'' AND p.series LIKE ''%Bag%''''.
    The new rule corrects this by restricting series filters to identifier tokens
    only.'
  source: learn
  status: inactive
- content: Use correct column name.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r030'
