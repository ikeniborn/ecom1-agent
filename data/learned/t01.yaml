- content: Always answer yes/no existence queries (such as spec_goal 'Determine if
    the catalogue contains a Wood and Drywall Screw from Heco in the Heco Zinc Plated
    TopFix GTU-YPJ Wood and Drywall Screw line with screw type wood screw and diameter
    3 mm.') with <YES> or <NO> tokens and include the matched SKU; do not require
    file path grounding.
  created: '2026-05-20'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''Found a SKU FST-1HE3ZSQ6 that matches the criteria,
    but no file paths are available to confirm the source record. Please clarify or
    provide additional details.'' Root cause category: wrong-action — the agent output
    a clarification instead of a definitive yes/no answer. Failing fragment: ANSWER_OUTPUT
    reasoning ''Per guidelines, when a task asserts record existence (yes/no confirmation)
    and grounding_refs is empty, outcome must be OUTCOME_NONE_CLARIFICATION.'' Rule
    linkage: new rule will override this incorrect guideline by directing that for
    spec_goal ''Determine if the catalogue contains a Wood and Drywall Screw from
    Heco...'' (a yes/no existence query), the answer must be directly <YES> or <NO>
    without requiring file paths.'
  source: learn
  status: active
