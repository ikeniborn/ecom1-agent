- agents_md_anchor: null
  content: Always generate a rowset for constant placeholder values (e.g., status)
    using a primitive that produces a list of dicts such as "list" or "constant" before
    any concat or other list‑based compute steps, and bind the result to a named rowset
    (e.g., "status_rows") that can be referenced in message templates.
  created: '2026-06-24'
  deactivated_reason: null
  id: r002
  reasoning: 'diagnosis: compute step ''concat'' failed because it received only one
    argument (''present'') while concat requires two list[dict] rows. The PlanIR attempted
    to create a placeholder ''status'' via concat, causing a lambda missing argument
    error. The failing fragment is the compute entry {"prim":"concat","args":["present"],"into":"status"}.
    The rule directs the planner to create a proper rowset for constant values before
    using concat or to avoid concat entirely for single constants.'
  status: active
  surface: ir
