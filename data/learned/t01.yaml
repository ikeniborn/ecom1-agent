- agents_md_anchor: null
  content: Do not use concat to set a literal string value; use a literal step or
    bind the string directly. Concat requires two list[dict] arguments.
  created: '2026-06-22'
  deactivated_reason: null
  id: r010
  reasoning: 'The PlanIR compute step ''concat'' was called with a single string argument
    ''Nut Bolt and Washer'', but concat expects two list[dict] arguments (rowsets).
    The error: ''concat() missing 1 required positional argument: b''. The intent
    was to set product_name for the answer message, which should be done via a literal
    primitive or by referencing the param directly, not concat.'
  status: active
  surface: ir
