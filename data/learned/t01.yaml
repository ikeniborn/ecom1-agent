- agents_md_anchor: '#answerbranch'
  content: Never include fields other than 'message' and 'refs' in the answer branch
    of PlanIR; placeholder substitution for message skeleton tokens (e.g., {product_name})
    works automatically from the execution environment variables (e.g., $found_product.product_name)
    — do not add answer attributes for them.
  created: '2026-06-16'
  deactivated_reason: null
  id: r012
  reasoning: 'Error: plan validation failed with ''Extra inputs are not permitted''
    for answer.found.product_name and answer.found.sku. The generated PlanIR included
    a ''found'' object inside the answer branch, adding top-level attributes beyond
    the allowed ''message'' and ''refs''. Root cause: adherence to r011 which advises
    including placeholder fields as top-level answer attributes, but the PlanIR schema
    only permits ''message'' and ''refs'' (as stated by r007). The correct approach
    is to omit extra fields; placeholder substitution resolves from the execution
    environment. Rule linkage: r007 already forbids extra fields, but r011 contradicted
    it and caused the violation. Deactivate r011 to prevent recurrence.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always define variables referenced by success_criteria (e.g., $found_product.product_sku)
    in every execution path. When no matching data exists, construct a default object
    that contains all fields required by success_criteria, with nonempty placeholder
    values (e.g., 'MISSING'), and assign it to the variable before the decision branch.
    Also, for each outcome specified in the IntentSpec, include all required refs
    in the answer branch's refs list.
  created: '2026-06-16'
  deactivated_reason: null
  id: r013
  reasoning: 'Error: verify: success_criteria[0] failed on nonempty check of $found_product.product_sku.
    OBSERVED_RPC_OUTPUTS shows SQL returned only column headers, no rows. The PlanIR
    executed correctly but $found_product was undefined in the ''not_found'' branch
    because compute set it via ''first'' on an empty $rows. The decision branch for
    not_found did not define $found_product, so success_criteria failed. Additionally,
    the ''found'' branch omitted the required record_path ref. Root cause: PlanIR
    does not define success_criteria variables in all paths. Rule r008 covers equality
    checks but not nonempty; this rule generalizes to any variable referenced in success_criteria.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Do not use the 'neq' predicate in decision branch conditions; use only
    valid predicates such as 'eq', 'exists', 'regex', or 'not' (wrapping a valid predicate)
    to express inequality. When you need to check if a variable is not equal to a
    sentinel value (e.g., 'MISSING'), write the condition using 'eq' and swap the
    true/false branches, or use a 'not' operator with 'eq'.
  created: '2026-06-16'
  deactivated_reason: null
  id: r014
  reasoning: PlanIR validation failed with error 'unknown predicate op 'neq''. The
    PlanIR used 'neq' in decision.branches.0.when, but the PlanIR schema does not
    support 'neq' — allowed ops are 'eq', 'exists', 'regex', 'not', etc. This is a
    structural bug in the plan shape. Correct by using 'eq' with reversed branches
    or a 'not' wrapper.
  status: active
  surface: ir
