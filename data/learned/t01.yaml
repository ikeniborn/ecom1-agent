- agents_md_anchor: null
  content: Always omit the Answer RPC from the ops array when a top-level answer mapping
    exists for the target decision label, so the interpreter uses the top-level template
    and projects required_refs instead of applying empty op args.
  created: '2026-06-18'
  deactivated_reason: consolidated into the crisp authoritative r004
  id: r005
  reasoning: 'Error ''real_vm: answer must be non empty'' with verdict ''answer missing
    required reference ''/proc/catalog/FST-3SJKL8BF.json'''' shows the final answer
    payload was empty despite a required record_path ref configured in the plan. The
    PlanIR defines both a top-level ''answer'' object (with refs left empty for interpreter
    projection per r004) AND an explicit Answer op in ''ops'' with args:{}. This dual
    definition (already prohibited by r002) caused the explicit op to execute with
    empty args, overriding the top-level answer template and bypassing required_refs
    projection. Removing the Answer op from ops lets the interpreter synthesize the
    answer solely from the top-level mapping and populate refs from required_refs.'
  status: inactive
  surface: ir
