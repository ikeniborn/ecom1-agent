- content: Always when spec_goal requires filtering products by a multi-token alphanumeric
    series code, first run `SELECT DISTINCT series FROM products WHERE brand=?` to
    verify the exact stored form of the series identifier before applying LIKE filters;
    never assume the series code spacing or casing matches the user-supplied string
    verbatim.
  created: '2026-05-26'
  deactivated_reason: null
  id: r016
  reasoning: 'Verbatim error: ''Empty result: sku,path,name,series,key,value_text''.
    Root cause: empty-result — likely wrong-filter on series code token. Failing fragment:
    action filter `p.series LIKE ''%SYS 3JJ-9LM%''` assumes verbatim storage of the
    alphanumeric series code including spaces and separators, but the series may be
    stored with different spacing, casing, or separator characters. Additionally `pp.value_text
    = ''tool bag''` uses exact case match which may not align with stored values.
    Rule linkage: the action''s LIKE pattern on series must be verified against actual
    distinct series values before applying.'
  source: learn
  status: active
