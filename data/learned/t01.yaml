  id: r033
  reasoning: r028 and r030 are semantically identical duplicates; keeping r030 as
    the active rule.
  source: learn
  status: inactive
- content: Never AND-chain multiple descriptive product name tokens in `p.name` LIKE
    filters in the primary catalogue query action when `p.series` already contains
    the unique identifier tokens for the product line, because requiring every descriptive
    token in `p.name` over-constrains the query and causes empty results before the
    series-only fallback is reached. When a full-string `p.series` LIKE filter returns
    empty, split multi-token series names into individual AND-chained LIKE conditions,
    but always exclude descriptive product name tokens such as 'Tool', 'Box', and
    'Bag' from `p.series` filters; restrict those filters to series identifier tokens
    (e.g., '%SYS%', '%3JJ%', '%9LM%') and match descriptive tokens against `p.name`
    instead, to tolerate catalogue spacing and naming variations while avoiding empty
    results.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r034'
  id: r034
  reasoning: r029, r031, and r032 all address the same spec_goal of constructing catalogue
    queries for products described by mixed identifier/descriptive tokens. r032 (highest
    id) forms the base; extended to incorporate the token-split fallback instructions
    from r031 and the general series-filter exclusion from r029.
  source: learn
  status: inactive
- content: Always include the series-only fallback query as a second discrete action
    in the `actions` array when a success_criterion states 'If primary is empty, series-only
    fallback is executed', rather than describing the fallback only in plan steps.
  created: '2026-05-25'
  deactivated_reason: null
  id: r035
  reasoning: 'The ERROR is ''Empty result: sku,path,name,series''. The primary catalogue
    query action returned zero rows. The success_criteria explicitly state ''If primary
    is empty, series-only fallback is executed; if fallback is empty, response contains
    <NO>...''. However, the SDD_OUTPUT `actions` array and the PLAN_OUTPUT `action`
    field each contain only the primary query; the series-only fallback is described
    in plan text but is not emitted as a discrete executable action. Because the executor
    had no fallback action to run, the pipeline halted with an empty-result error
    instead of confirming series absence and answering <NO>. Root cause category:
    wrong-action. Failing fragment: SDD_OUTPUT actions = [primary query only] and
    PLAN_OUTPUT action = primary query, which omit the fallback despite the success_criterion
    requiring it.'
  source: learn
  status: active
