- agents_md_anchor: null
  content: When the success_criteria for an outcome references a variable, the PlanIR
    must compute that variable and ensure it is nonempty.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The plan produced OUTCOME_OK (product found, store_count > 0) but the
    interpreter's success-criteria check failed because the required variable $stores_with_availability
    was not defined in the compute block. The plan only computed $store_count. The
    missing variable caused a fallback to OUTCOME_NONE_CLARIFICATION, resulting in
    the grader error 'expected OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION'. The failing
    PlanIR fragment is the compute block, which lacks a step to produce $stores_with_availability.
    This rule ensures all success-criteria variables are explicitly computed.
  status: inactive
  surface: ir
