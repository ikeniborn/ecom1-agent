- agents_md_anchor: null
  content: When verifying existence of a product with multiple attributes, structure
    the PlanIR to first discover candidate rows using the most stable attributes (e.g.,
    brand, series, model) and then filter or verify the remaining attributes in a
    subsequent compute step, to avoid false negatives caused by exact-match failures
    on optional or variable properties.
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'The PlanIR executed a single SQL query with all attribute filters (including
    property_key and property_value_text). The query returned no rows, causing the
    decision to default to ''not_found'' and outcome OUTCOME_NONE_UNSUPPORTED, while
    the grader expected OUTCOME_OK. Root cause: the exact-match query was too restrictive,
    likely because the property value ''threaded rod'' was stored differently or missing.
    The plan lacked a fallback to detect the product by core attributes alone.'
  status: active
  surface: ir
