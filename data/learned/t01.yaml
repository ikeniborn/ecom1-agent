- agents_md_anchor: null
  content: When success_criteria or required_refs reference a dotted variable path
    (e.g., $product.product_sku), the PlanIR must define an object variable with the
    object name (e.g., $product) that contains all fields referenced by success_criteria
    and required_refs. This can be done by first extracting the row as a dict variable,
    then using compute steps (e.g., 'assign' or 'set') to create the object with named
    keys, or by using a rowset that directly produces the object. The answer branch
    for the outcome must reference the correct dotted path in the message skeleton
    and include required refs mapping from the required ref path to the object's key.
  created: '2026-06-16'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: verify: success_criteria[0] failed nonempty on $product.product_sku.
    Root cause: PlanIR uses flat variables ($product_sku, $product_name, $record_path)
    instead of an object variable $product with keys product_sku, product_name, record_path.
    The IntentSpec''s success_criteria and required_refs both reference $product.product_sku
    and $product.record_path, so the variable path must match exactly. Additionally,
    the answer branch for OUTCOME_OK had empty refs list, violating required_refs.
    The new rule ensures the PlanIR constructs the necessary object and includes proper
    refs.'
  status: active
  surface: ir
