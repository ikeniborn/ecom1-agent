- agents_md_anchor: null
  content: Prefer using a dedicated SQL RPC (e.g., 'Sql' or 'Query') over Exec with
    stdin for database queries, because the sql tool may not accept stdin input and
    will return a usage banner. If Exec must be used, pass the SQL as a command-line
    argument (e.g., -c 'query') instead of via stdin.
  created: '2026-06-24'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. Root cause: The PlanIR discovery step used Exec with stdin to pass a
    SQL query, but the sql tool does not accept stdin input; it expects the query
    as a command-line argument. The failing fragment is the Exec RPC with ''stdin''
    containing the SQL. This rule ensures future plans avoid stdin for SQL delivery,
    preventing the usage banner error.'
  status: active
  surface: ir
