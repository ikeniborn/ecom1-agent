- agents_md_anchor: null
  content: When the required ref is a dotted path on a single matched record (e.g.,
    $matched_candidate.record_path), use a compute step with first() to extract the
    single row from the rowset into a scalar object named exactly as the ref stem
    (e.g., matched_candidate), then reference its field with a dotted path; ensure
    the discovery SQL returns at most one row (LIMIT 1).
  created: '2026-06-20'
  deactivated_reason: r017 advocates using a compute step with first() to extract
    a single row, which leads to unresolved ref errors; the new rule provides the
    correct approach (bind rowset directly) and supersedes r017.
  id: r017
  reasoning: 'Error: interpret: unresolved required ref(s) [''$matched_candidate.record_path'']
    on OK answer. The PlanIR binds the SQL result (rowset) directly to ''matched_candidate''
    and then references $matched_candidate.record_path. The interpreter cannot resolve
    a dotted path on a rowset; it requires a scalar object. The existing in-session
    rule that says ''do not use a compute step like first()'' is incorrect and causes
    this failure. The correct approach is to use a compute step with first() to extract
    the single row into a scalar object, then reference its field. The discovery SQL
    already uses LIMIT 1, so the rowset has at most one row.'
  status: inactive
