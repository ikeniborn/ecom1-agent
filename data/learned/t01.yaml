- agents_md_anchor: null
  content: 'Existence ("is X / do you carry X"). discovery: ONE Exec /bin/sql whose
    stdin is a BROAD-OR query (NEVER AND across attributes, NEVER a variant-property
    JOIN — that returns 0 for a present product): SELECT record_path FROM product_variants
    WHERE LOWER(TRIM(brand)) LIKE ''%<brand>%'' OR LOWER(TRIM(series)) LIKE ''%<token>%''
    OR LOWER(TRIM(model)) LIKE ''%<code>%'' ORDER BY ((LOWER(TRIM(brand)) LIKE ''%<brand>%'')+(LOWER(TRIM(model))
    LIKE ''%<code>%'')+(LOWER(TRIM(series)) LIKE ''%<token>%'')) DESC LIMIT 5 — fill
    <brand>/<token>/<code> (lowercased) from the instruction or facts CATALOGUE_CANDIDATES.
    rowset auto_delim -> rows (column record_path). compute: count(rows)->n; first(rows)->r.
    decision: n ge 1 -> found else absent. answer (ONE top-level mapping, NO Answer
    op): found -> OUTCOME_OK, message contains <YES>, refs=[$r.record_path]; absent
    -> OUTCOME_OK, message contains <NO>, refs=[]. INTENT: required_refs[OUTCOME_OK]=[],
    success_criteria[OUTCOME_OK]=[], outcome_space=[OUTCOME_OK]. Never CLARIFICATION/UNSUPPORTED.'
  created: '2026-06-19'
  deactivated_reason: null
  id: rc1
  pinned: true
  reasoning: Prescriptive BROAD-OR discovery SQL (the probe's proven pattern, ORDER
    BY relevance) so the agent's OWN query finds present products and binds record_path
    -> conditional grounding cites it. deepseek over-constrained (AND/JOIN->0->false
    <NO>) and ignored copied candidates; this forbids AND/JOIN and hands the exact
    working query. success_criteria=[] (verify fix). Pinned.
  status: active
  surface: ir
