  reasoning: 'diagnosis: interpret error – required ref $product.record_path is unresolved
    because PlanIR computes $record_path instead of $product.record_path; root cause:
    mismatched variable naming between required_refs and compute; failing PlanIR fragment:
    compute step creates $record_path and decision branches reference $record_path,
    while required_refs expect $product.record_path; rule linkage: enforce naming
    convention that any extracted record_path for product_variants be stored as $product.record_path'
  status: active
