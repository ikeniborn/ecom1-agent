- agents_md_anchor: null
  content: Always use an explicit rowset format (e.g., 'csv' or 'json') that matches
    the RPC output when the RPC returns structured data, and include a validation
    step to ensure the rowset contains dicts before using column access primitives.
  created: '2026-06-18'
  deactivated_reason: misdirected — blamed rowset format for an interpreter primitive-contract
    bug now fixed by F1/F2; superseded by r004
  id: r003
  reasoning: 'Error: ''str'' object has no attribute ''get'' in real_vm. Root cause:
    The rowset format ''auto_delim'' parsed the SQL Exec RPC output into a list of
    strings instead of dicts, so the ''first'' primitive returned a string, and the
    subsequent ''column'' primitive called .get() on that string, causing the AttributeError.
    The PlanIR must guarantee that rows are dicts before column access. Using an explicit
    format like ''csv'' with column headers ensures each row is a dict. A validation
    step (e.g., checking type of first row) would also prevent this, but the VM may
    not support it; thus the rule focuses on format choice.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Catalogue existence query — the product may be PRESENT or ABSENT (re-seeded);
    BOTH answer OUTCOME_OK. MATCH MINIMALLY: brand + ONE distinctive model/series
    token via normalized LIKE (LOWER/TRIM) on a SHORT fragment; do NOT add variant-property
    JOINs/EXISTS unless a single token is genuinely insufficient — over-constraining
    yields a false 0-row ''absent'' for a present product. SELECT the record_path
    column. COMPUTE match_count = count(rows); first_record = first(rows). DECIDE:
    match_count ge 1 -> label found, else label absent. ANSWER (single top-level answer
    mapping, NO Answer op in ops): found.message contains the literal token <YES>
    and found.refs = [$first_record.record_path]; absent.message contains the literal
    token <NO> and absent.refs = []. INTENT: required_refs[OUTCOME_OK] = [] (the record_path
    is CONDITIONAL, authored per-branch by PLAN); outcome_space = [OUTCOME_OK]. Read
    single-record fields with get, never column.'
  created: '2026-06-18'
  deactivated_reason: null
  id: r004
  reasoning: Consolidated authoritative t01 method (folds r001 refs, r002/r005 single-answer,
    r006 minimal-match). Single crisp rule to maximize PLAN compliance — prior multi-rule
    set produced over-constrained SQL (false absent) and a drifted answer binding
    ($matched_path). Encodes Lever-1 (INTENT required_refs empty, conditional) + Lever-2
    (per-branch authored record_path) + minimal-distinctive matching.
  status: active
  surface: ir
