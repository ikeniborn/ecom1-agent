  - 'path: "/docs/README.md"

    content_type: "text/markdown"

    content: "# ECOM1\n\nUse the security policy for identity, permissions, and authorization
    checks.\nUse the checkout process for basket checkout tasks.\nUse the discount
    policy before applying or refusing basket discounts.\nUse the payment policies
    before recovering payment workflow failures.\nUse the returns policy before approving
    or finalizing customer refunds.\nUse the OS/tooling incidents policy before applying
    documented runtime-tool or\nmount workarounds.\nUsing today\''s catalogue reporting
    rule means checking for a current catalogue\ncounting or reporting update before
    answering catalogue product-count questions,\nunless the request explicitly says
    to ignore reporting updates.\n\n\n\n## Document Families\n\nThe `/docs` tree contains
    several document families. Some are active decision\npolicies. Some are operational
    background. Some are migration or readiness notes\nthat sound important because
    they are important to the merchant, but they do not\ndecide customer-specific
    actions.\n\nWhen a request changes commerce state or answers whether a customer-specific\naction
    is allowed, use the smallest dedicated decision policy first. Broad\noperations
    documents may provide context, but they do not override identity,\ncheckout, discount,
    payment, return, package, installment, or risk rules.\n\n### Active Decision Policies\n\n|
    Document | Use when | Authority boundary |\n| --- | --- | --- |\n| `/docs/security.md`
    | A request depends on identity, permissions, ownership, roles, or the word \"my\"
    | Authoritative for identity and authorization checks |\n| `/docs/checkout.md`
    | A request asks to check out a basket or decide whether checkout is supported
    | Authoritative for basket checkout inventory checks |\n| `/docs/discounts.md`
    | A request asks to apply, refuse, or size a basket discount | Authoritative for
    basket discount conditions |\n| `/docs/payments/3ds.md` | A request asks to recover
    a simulated 3DS payment flow | Authoritative for 3DS recovery conditions |\n|
    `/docs/returns.md` | A request asks to approve or finalize a customer return refund
    | Authoritative for refund workflow conditions |\n| `/docs/os-and-tooling-incidents-and-workarounds.md`
    | A runtime tool, OS mount, temporary directory, generated index, or local command
    reports a known incident with a documented workaround | Authoritative for who
    may use and cite incident workarounds |\n\nThe active decision policies are short
    on purpose. A long document with a more\ndramatic title is not more authoritative
    than the dedicated policy for the\naction at hand.\n\nBefore applying an active
    decision policy, check under `/docs` for dated policy\nupdates that name the same
    workflow, record, or operating day. A matching update\noverrides the base policy
    only for the case it names.\n\nFor catalogue product-count questions, always check
    today\''s catalogue reporting\nrule unless the request says otherwise. Current
    reporting updates may live under\npaths such as `/docs/current-updates/`, `/docs/policy-updates/`,\n`/docs/ops-policy-notes/`,
    or `/docs/catalogue-addenda/`. If a matching update\nnames the catalogue count
    workflow, requested product kind, operating day, city,\nfamily hold, or similar
    scope, use that rule instead of the plain catalogue row\ncount.\n\n### Operational
    Background\n\n| Document | Why it exists | Do not use it for |\n| --- | --- |
    --- |\n| `/docs/merchant-continuity-and-critical-incidents.md` | Incident rhythm,
    staffing coordination, store communications, and after-action review | Customer
    authorization, payment recovery, discount approval, package conclusions, return
    outcomes |\n| `/docs/powertools-agentic-os-origin-story.md` | Founding story,
    employee legacy, and why the workspace calls itself an agentic OS | Any current
    customer action, current state lookup, authorization, checkout, discount, payment,
    return, package, installment, or risk decision |\n| `/docs/store-associate-exception-handbook.md`
    | Store-floor staffing, till, signage, training, and local associate exception
    notes | Runtime identity, basket ownership, discounts, refunds, replacements,
    payment state changes |\n| `/docs/warehouse-systems-migration-runbook.md` | Warehouse
    system cutover planning, rehearsal mapping, and migration archive rules | Live
    package tracing, fulfillment evidence, refund or replacement decisions |\n\nOperational
    background can be useful when a human asks \"how should the merchant\norganize
    this incident?\" It is usually not useful when a customer asks \"can you\ndo this
    for me now?\"\n\n### Proc And Runtime Companions\n\nThese are not policy documents,
    but they often explain how to read current\nstate:\n\n| Location | Meaning |\n|
    --- | --- |\n| `/proc/customers/` | Customer profiles |\n| `/proc/baskets/` |
    Basket records and basket line items |\n| `/proc/payments/` | Payment attempts
    for checked-out baskets |\n| `/proc/returns/` | Return workflow records |\n| `/proc/stores/`
    | Store records and inventory-related projections |\n| `/bin` | Mechanical runtime
    tools; read policy before using tools that mutate state |\n\nCurrent state should
    come from `/proc` and runtime tools. Policy should come\nfrom the active decision
    policy family. Readiness notes, migration notes, and\nincident notes are not current
    state.\n\n### Common Reading Traps\n\n| Trap | Safer interpretation |\n| --- |
    --- |\n| A title says `critical`, `incident`, `exception`, or `continuity` | It
    may still be operational background only |\n| A paragraph mentions a manager,
    executive, store lead, or support coordinator | That person is not automatically
    the runtime identity returned by `/bin/id` |\n| A migration table contains warehouse,
    hold, manifest, or route wording | It may describe field mapping, not a live package
    |\n| A promotional note mentions a campaign, appeasement, VIP, or holiday period
    | It does not change the discount policy unless `/docs/discounts.md` says so |\n|
    A store-floor exception says the queue is busy | It does not change customer ownership
    or payment safety |\n\nWhen in doubt, quote or reference the dedicated decision
    policy and the concrete\nrecord that makes the decision possible. Do not rely
    on document title weight.\n"

    sha256: "979477da9930204f8601cfbddacdce2def31f8374336449b65825bb6e78aaee0"

    '
