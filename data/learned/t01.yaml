- agents_md_anchor: null
  content: When the IntentSpec's required_refs for an outcome specifies a ref (e.g.,
    record_path), the answer branch for that outcome must include that ref in its
    refs list, mapping the required ref path to the computed variable that holds the
    value.
  created: '2026-06-16'
  deactivated_reason: null
  id: r005
  reasoning: 'The PlanIR computed $found_product.record_path but the answer branch
    for OUTCOME_OK had an empty refs list. The IntentSpec required a record_path ref
    for that outcome, causing an interpret error: ''unresolved required refs ["$found_product.record_path"]
    on OK answer''. The rule ensures that all required refs are explicitly included
    in the answer branch''s refs list.'
  status: active
  surface: ir
- content: null
