- agents_md_anchor: null
  content: When the answer requires a dotted reference to a field of a single matched
    record (e.g., $matched_candidate.record_path), ensure the discovery SQL returns
    at most one row (e.g., LIMIT 1) and bind the rowset directly to the output, then
    reference the field as $rowset_name.field_name without an index; do not use a
    compute step like first() to extract the record, as that creates a scalar that
    cannot be dereferenced with a dotted path.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'Error: interpret: unresolved required ref(s) [''$matched_candidate.record_path'']
    on OK answer. The PlanIR uses compute first() to create matched_candidate from
    the matched_candidates rowset. The interpreter cannot resolve the dotted path
    $matched_candidate.record_path because first() returns a scalar (the first row
    as a string or list) rather than an object with named fields. The fix is to avoid
    the compute step and instead have the SQL return a single row (LIMIT 1) and bind
    the rowset directly to the output, naming it matched_candidate. Then the ref $matched_candidate.record_path
    can be resolved directly from the rowset''s field. This aligns with the existing
    rule r012 but adds the critical detail of using a single-row rowset instead of
    a compute extraction.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Use a compute step with first() to extract the single matched record from
    the rowset into a scalar object named exactly as the required ref stem (e.g.,
    matched_candidate), then reference its field with a dotted path (e.g., $matched_candidate.record_path);
    do not rely on the rowset step alone to create a dereferenceable object.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''''$matched_candidate.record_path'''']
    on OK answer''. The PlanIR uses a rowset step to create a list named matched_candidate,
    but the answer ref expects a scalar object with a field. The system cannot resolve
    a dotted path into a list element. Existing rule r012 incorrectly advises against
    using compute step (first()), but that is the correct technique to produce a dereferenceable
    object. Deactivating r012 and replacing with this rule ensures the ref is resolved.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the required ref is a dotted path on a single matched record (e.g.,
    $matched_candidate.record_path), ensure the discovery SQL returns at most one
    row (LIMIT 1) and bind the rowset directly to the variable named exactly as the
    ref stem (e.g., matched_candidate), then reference the field with a dotted path;
    do not use a compute step like first() to extract the record, as that creates
    a scalar that cannot be dereferenced.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'Error: interpret: unresolved required ref(s) [''$matched_candidate.record_path'']
    on OK answer. The PlanIR used a compute step with first() to extract matched_candidate
    from candidate_rowset, but first() produces a scalar (dict) that the ref system
    cannot dereference with a dotted path. The existing in-session rule advising to
    use first() is incorrect. The correct technique is to bind the rowset directly
    to the variable named matched_candidate (by setting ''into'':''matched_candidate''
    in the rowset step) and reference $matched_candidate.record_path without an intermediate
    compute step. The discovery SQL already has LIMIT 1, so the rowset will contain
    at most one row, and the ref system can dereference it.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the required ref is a dotted path on a single matched record (e.g.,
    $matched_candidate.record_path), bind the rowset directly to the variable named
    exactly as the ref stem (e.g., matched_candidate) without using a compute step
    like first() to extract the record; the rowset should have at most one row (LIMIT
    1); then reference the field with a dotted path (e.g., $matched_candidate.record_path).
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'Error: interpret: unresolved required ref(s) [''$matched_candidate.record_path'']
    on OK answer. The PlanIR uses a compute step with first() to extract matched_candidate
    from the rowset. The interpreter cannot resolve the dotted path on the result
    of first() because it creates a scalar object that is not a rowset. The correct
    approach is to bind the rowset directly to the variable named matched_candidate
    without using first(), and then reference $matched_candidate.record_path. This
    is consistent with the existing rule that says ''do not use a compute step like
    first()''. The conflicting rule that says to use first() should be deactivated.'
  status: inactive
