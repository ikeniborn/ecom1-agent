- agents_md_anchor: null
  content: When success_criteria includes equality checks on a variable (e.g., $found_product)
    that will be null if no matching record is found, the PlanIR must ensure that
    variable is always defined by constructing a default object from the IntentSpec
    param values (e.g., brand, kind_name, family_name, properties) and using it in
    the answer branch for the 'not found' outcome.  This avoids verify-phase failures
    due to null evaluation.
  created: '2026-06-16'
  deactivated_reason: null
  id: r008
  reasoning: 'verify: success_criteria[0] failed — the and-equality chain on $found_product
    could not be evaluated because $found_product was null when the SQL returned no
    rows.  The root cause is that the PlanIR decision branch for not_found left $found_product
    undefined, while the success_criteria unconditionally expects it.  The fix is
    to guarantee $found_product is always assigned, using a custom-extracted dummy
    object populated from the search parameters.  Also, the found branch currently
    misses the required record_path ref (r005).'
  status: active
  surface: ir
- content: null
