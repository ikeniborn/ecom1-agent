- agents_md_anchor: null
  content: When success_criteria includes a nonempty check on a token under $answer
    (e.g., $answer.yes_no_token), the answer branch for the matching outcome must
    set that token to a nonempty value (e.g., 'YES' or 'NO') in addition to the message.
  created: '2026-06-16'
  deactivated_reason: null
  id: r006
  reasoning: The verify step failed because success_criteria[0] required $answer.yes_no_token
    to be nonempty, but the PlanIR answer branch for the 'found' outcome only set
    'message' and 'outcome', not 'yes_no_token'. The SQL query returned a row, so
    the decision took the 'found' branch, but the missing token caused the criteria
    to fail. A new rule is needed to ensure that answer branches emit all tokens checked
    by success_criteria.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Do not include fields other than 'message' and 'refs' in the answer branch
    of PlanIR; extra fields like 'yes_no_token' are forbidden by the schema.
  created: '2026-06-16'
  deactivated_reason: null
  id: r007
  reasoning: The PlanIR validation error 'Extra inputs are not permitted' occurred
    because the answer branch contained a 'yes_no_token' field. The PlanIR schema
    only allows 'message' and 'refs' in the answer object. The success_criteria check
    on $answer.yes_no_token cannot be satisfied by adding an extra field; the answer
    branch must only contain the standard fields.
  status: active
  surface: ir
