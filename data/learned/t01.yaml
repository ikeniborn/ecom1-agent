- agents_md_anchor: null
  content: Always use an explicit rowset format (e.g., 'csv' or 'json') that matches
    the RPC output when the RPC returns structured data, and include a validation
    step to ensure the rowset contains dicts before using column access primitives.
  created: '2026-06-18'
  deactivated_reason: misdirected — blamed rowset format for an interpreter primitive-contract
    bug now fixed by F1/F2; superseded by r004
  id: r003
  reasoning: 'Error: ''str'' object has no attribute ''get'' in real_vm. Root cause:
    The rowset format ''auto_delim'' parsed the SQL Exec RPC output into a list of
    strings instead of dicts, so the ''first'' primitive returned a string, and the
    subsequent ''column'' primitive called .get() on that string, causing the AttributeError.
    The PlanIR must guarantee that rows are dicts before column access. Using an explicit
    format like ''csv'' with column headers ensures each row is a dict. A validation
    step (e.g., checking type of first row) would also prevent this, but the VM may
    not support it; thus the rule focuses on format choice.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When answering a catalogue existence/identification query, ground the OUTCOME_OK
    answer on the matched product record. INTENT: set required_refs[OUTCOME_OK] to one
    record_path ref whose source is $first_record.record_path; set success_criteria[OUTCOME_OK]
    to match_count ge 1; keep outcome_space [OUTCOME_OK]. PLAN: match brand/model/variant
    properties NORMALIZED (LOWER and TRIM, LIKE for a partial model token) in a rowset that
    selects the record_path column; bind first_record = first(rows); read fields with get
    (never column on a single record); leave answer.refs empty so the interpreter projects
    them from required_refs.'
  created: '2026-06-18'
  deactivated_reason: null
  id: r004
  reasoning: Method-not-value rule (F6, extended). Now drives BOTH phases via the
    learn-aware INTENT channel — INTENT declares the record_path required_ref (the grader
    rejects an OUTCOME_OK with no /proc/catalog/<sku>.json ref) and PLAN binds first_record
    so the interpreter projects it. Survives per-StartRun re-seeding; pairs with F1/F2.
    Replaces r003 which misattributed the crash to format.
  status: active
  surface: ir
