  created: '2026-05-25'
  deactivated_reason: null
  id: r037
  reasoning: r032 and r034 address the same spec_goal of avoiding over-constrained
    `p.name` filters. r034 is a strict superset of r032, adding guidance on splitting
    multi-token series names and excluding descriptive tokens from `p.series` filters.
    r034 subsumes r032 completely.
  source: learn
  status: active
- content: Always provide a non-empty terminal action in the PLAN action field when
    the spec_goal is to report a final <NO> answer based on prior empty catalogue
    results — an empty action string causes a PLAN phase semantic error even when
    success criteria state that no further SQL queries or catalogue actions are executed.
  created: '2026-05-25'
  deactivated_reason: null
  id: r038
  reasoning: 'The verbatim error is ''PLAN phase: action is empty''. Root cause category:
    wrong-action. The failing fragment is the PLAN_OUTPUT action string '''' and the
    SDD_OUTPUT actions array [] for the spec_goal ''Report that the Festool Stackable
    SYS 3JJ-9LM Tool Box and Bag with storage type parts case is not found in the
    product catalogue, citing the empty series-only fallback result.'' The planner
    omitted an action because the success criterion stated ''No further SQL queries
    or catalogue actions are executed'', but the pipeline still requires a non-empty
    terminal action to advance to the answer phase. The new rule ensures the PLAN
    action field is always populated with a terminal identifier when the spec_goal
    is to deliver a final NO response.'
  source: learn
  status: active
