    and answer keys. The system expects outcome strings as keys to map the decision
    outcome. When the decision defaulted to 'not_found', no answer block key matched,
    causing a fallback to OUTCOME_NONE_CLARIFICATION instead of the intended OUTCOME_NONE_UNSUPPORTED.
    Existing rule r004 only required answer block keys to be outcome strings, but
    the decision labels must also match. This new rule ensures full alignment.
  status: inactive
