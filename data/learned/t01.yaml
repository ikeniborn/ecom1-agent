- content: Always verify that property keys (e.g., 'diameter_mm') used in JOIN conditions
    on product_properties exist in the database by first querying distinct keys for
    products in the same series; if not confirmed, use a more permissive query (e.g.,
    ILIKE key matching) to avoid empty results.
  created: '2026-05-21'
  deactivated_reason: null
  id: r022
  reasoning: 'Verbatim error: ''Empty result: sku''. Root cause: wrong-key — the query
    uses property key ''diameter_mm'' with value_number=3.0, but the actual property
    key in product_properties may be different (e.g., ''diameter'') or the value might
    be stored as text, causing no match. Failing fragment: action ''SELECT p.sku FROM
    products p INNER JOIN product_properties pp1 ON p.sku = pp1.sku AND pp1.key =
    ''screw_type'' AND pp1.value_text = ''wood screw'' INNER JOIN product_properties
    pp2 ON p.sku = pp2.sku AND pp2.key = ''diameter_mm'' AND pp2.value_number = 3.0
    WHERE p.brand = ''Heco'' AND p.series LIKE ''%TopFix GTU-YPJ%'' LIMIT 1''. Rule
    linkage: new rule will cite the action''s use of ''diameter_mm'' as a key that
    may not exist.'
  source: learn
  status: active
