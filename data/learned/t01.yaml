- agents_md_anchor: null
  content: Do not pass both stdin and command-line arguments to Exec when the tool
    expects SQL on stdin; use stdin alone.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. The PlanIR RPC used both ''stdin'' (SQL query) and ''args'' (--brand=Heco,
    etc.). The interpreter likely passed the args as command-line arguments and did
    not properly pipe stdin, causing the SQL tool to print its usage banner. Root
    cause: mixing stdin and args for a tool that expects SQL only via stdin. Failing
    PlanIR fragment: {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"SELECT ...","args":["--brand=Heco",...]}}.
    Rule: never combine stdin and command-line arguments for SQL execution; use stdin
    alone.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a discovery step uses Exec, always include an on_error handler that
    maps to a valid outcome from the IntentSpec's outcome_space, to prevent the system
    from defaulting to an invalid outcome like OUTCOME_NONE_CLARIFICATION.
  created: '2026-06-22'
  deactivated_reason: null
  id: r008
  reasoning: The plan produced outcome OUTCOME_NONE_CLARIFICATION, which is not in
    the IntentSpec's outcome_space. The likely cause is that the Exec RPC failed (e.g.,
    SQL error, missing table) and the plan lacked an on_error handler, causing the
    system to default to an invalid outcome. The PlanIR must include error handling
    for discovery steps to ensure the outcome is always one of the allowed outcomes.
  status: active
  surface: ir
