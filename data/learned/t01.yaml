entries:
- agents_md_anchor: '#plan-phase-answer-refs'
  content: When success_criteria includes a nonempty check on $answer.exists, the
    answer branch for the matching outcome must include the required refs (e.g., record_path)
    from the discovered row.
  created: '2026-06-16'
  deactivated_reason: null
  id: r001
  reasoning: 'verify: success_criteria[0] failed: {''op'': ''nonempty'', ''lhs'':
    ''$answer.exists'', ''rhs'': None, ''args'': []}. The PlanIR answer for ''found''
    branch had refs: [] but the required refs for OUTCOME_OK included a record_path.
    The answer shape omitted the refs, causing $answer.exists to be empty. The PlanIR
    must populate answer refs with the required record_path from the matching row.'
  status: active
  surface: ir
