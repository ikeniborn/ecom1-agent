- agents_md_anchor: null
  content: Do not escape single quotes as \' inside PlanIR JSON string values such
    as Exec RPC stdin SQL text; JSON parsers reject that escape sequence and the whole
    PlanIR fails to parse. Write SQL string literals with literal single quotes unescaped
    within the double-quoted JSON string.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'The error is ''plan: could not parse JSON'' with the PlanIR head showing
    a discovery Exec step whose stdin contains SQL with brand name ''Heco'' encoded
    as \''Heco\''. Inside a JSON double-quoted string, \'' is an illegal escape sequence,
    which breaks parsing immediately. The fix is to ensure SQL literals inside PlanIR
    use literal single quotes without backslash escaping so the JSON remains valid.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the ToolPlan declares a dotted required reference such as `$matched_candidate.record_path`,
    bind the single matched catalogue record into a rowset or object named exactly
    `matched_candidate` and project its `record_path` field; do not flatten the record
    path into a top-level scalar with a different stem such as `$matched_record_path`.
  created: '2026-06-19'
  deactivated_reason: r012 advises against using compute step first() to extract a
    record, but that is necessary to create a scalar object that can be dereferenced
    with a dotted path; the rule is superseded by the new rule.
  id: r012
  reasoning: 'Interpreter error: unresolved required ref `$matched_candidate.record_path`
    on OK answer. The PlanIR extracted the `record_path` column into a list via `column`,
    then collapsed it with `first` into a scalar named `$matched_record_path`. The
    ToolPlan''s `required_refs` and `success_criteria`, however, explicitly require
    `$matched_candidate.record_path`. Because the bound identifier stem (`matched_record_path`)
    did not match the required dotted-reference stem (`matched_candidate`), the interpreter
    could not resolve the required ref. The rule forces the PlanIR to preserve the
    matched row as a binding whose name and structure align exactly with the ToolPlan''s
    declared required-ref syntax.'
  status: inactive
  surface: ir
- content: null
