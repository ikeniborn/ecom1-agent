  content: When a decision condition depends on a fact that may not be present in $_facts (e.g., identity.kind
    for security checks), include a discovery step to read the necessary data and use the binding in the
    condition.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: The PlanIR relied on $_facts.identity.kind without a discovery step, assuming the pre-phase
    would provide it. The interpreter could not evaluate the condition, leading to OUTCOME_NONE_CLARIFICATION
    instead of the expected OUTCOME_DENIED_SECURITY. The fix ensures the PlanIR self-supplies the required
    fact.
  status: active
