- agents_md_anchor: null
  content: When a policy document is a required reference for the desired outcome,
    always include a compute step that parses the policy document to extract discount
    eligibility rules, and use those rules in the decision branches instead of hardcoded
    conditions.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: ''grader: answer missing required reference ''/docs/discounts.md''''.
    The PlanIR produced a deny answer because the hardcoded decision conditions (subtotal
    >= 15000, status ''active'', discount null, role ''discount_manager'') did not
    match the actual policy in /docs/discounts.md, causing the decision to fall to
    the deny branch. The deny answer only included /docs/security.md, so the required
    discount policy ref for OUTCOME_OK was missing. Root cause: the decision logic
    ignored the policy document content. Fix: derive eligibility conditions from the
    policy document via a compute step, ensuring the decision reaches the ok branch
    when policy permits.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using the concat primitive, always provide two list[dict] rowsets
    as arguments; parse Exec output via rowsets first. Never pass a string literal
    directly to concat.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'The interpret error ''concat() missing 1 required positional argument:
    b'' occurred because the compute step passed a single string literal ''basket_004''
    to concat, which expects two list[dict] rowsets. The script also lacked discovery
    of the basket record, but the immediate failure is a PlanIR shape violation: concat
    requires two rowsets, not a string.'
  status: active
  surface: ir
