- agents_md_anchor: null
  content: Do not re-discover facts that are already available in the pre-phase $_facts;
    reference them directly in decision conditions instead of adding discovery steps
    for them.
  created: '2026-06-22'
  deactivated_reason: r003 forbids re-discovering facts already in $_facts, but $_facts
    may not always contain the needed fact, causing evaluation failures. This new
    rule supersedes it by requiring discovery when the fact is not guaranteed.
  id: r003
  reasoning: The PlanIR included an Exec discovery step for /bin/id to bind 'identity',
    but the decision condition used '$identity.kind'. The Exec output likely did not
    contain a 'kind' field, causing the condition to fail and the interpreter to produce
    OUTCOME_NONE_CLARIFICATION instead of the expected OUTCOME_DENIED_SECURITY. The
    constraint in the IntentSpec references '$_facts.identity.kind', so the PlanIR
    should have used the pre-phase fact directly rather than re-discovering it.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When extracting a value from a single row (dict), use the 'get' primitive;
    the 'column' primitive expects a list of dicts.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The PlanIR used ''first'' to extract a single row from a list, then
    ''column'' to extract a field from that single row. The ''column'' primitive expects
    a list of dicts, not a single dict, causing the error: "''column'' expects list[dict];
    use ''get'' for a single row". The fix is to use ''get'' on the single row, or
    restructure to use ''column'' on the list then ''first'' on the result.'
  status: inactive
  surface: ir
