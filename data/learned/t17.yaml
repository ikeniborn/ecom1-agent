entries:
- content: Always first verify the existence of the target product in the `products`
    table using only brand and series constraints (e.g., SELECT * FROM products WHERE
    brand='Heco' AND series LIKE '%GTU-YPJ%') before applying property-based filters,
    when the spec_goal involves identifying a product by brand, series, and a property
    like screw_type.
  created: '2026-05-21'
  deactivated_reason: r001 directed to verify existence using brand and series constraints,
    but the series constraint was incorrect, leading to empty result; the new rule
    ensures correct series discovery before filtering.
  id: r001
  reasoning: 'ERROR: Empty result: sku,name,series,brand. Root cause: empty-result,
    specifically wrong-filter — the combined filter conditions in the action query
    (brand=''Heco'', series LIKE ''%GTU-YPJ%'', and property key=''screw_type'' value=''drywall
    screw'') were too specific and returned no rows. The failing fragment is the action
    from PLAN_OUTPUT: ''SELECT p.sku, p.name, p.series, p.brand FROM products p JOIN
    product_properties pp ON p.sku=pp.sku WHERE pp.key=''screw_type'' AND pp.value_text=''drywall
    screw'' AND p.brand=''Heco'' AND p.series LIKE ''%GTU-YPJ%'';''. Rule linkage:
    the new rule will reference the spec_goal to ensure that before applying property
    filters, the product existence is verified with a simpler query.'
  source: learn
  status: inactive
- content: Always first query distinct series values for the given brand from the
    products table before applying a LIKE filter with a guessed pattern, when the
    spec_goal involves identifying a product by brand and series (as in the action
    that failed).
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003, r004'
  id: r002
  reasoning: 'Verbatim error: ''Empty result: sku,brand,series,model,name''. Root
    cause category: wrong-filter. The failing action is ''SELECT sku, brand, series,
    model, name FROM products WHERE brand=''Heco'' AND series LIKE ''%GTU-YPJ%''''
    from PLAN_OUTPUT, which returned empty because no product matched the series pattern.
    The spec_goal phrase ''series contains ''GTU-YPJ'''' and success_criterion ''series
    contains ''GTU-YPJ'''' were incorrect assumptions about the actual series value.
    Rule linkage: the new rule will require verifying actual series values before
    applying a LIKE pattern, directly addressing this faulty filter.'
  source: learn
  status: inactive
- content: 'Always ensure the actions list in the spec includes all queries required
    to achieve the spec_goal: after discovering series, include queries to find the
    product SKU (by brand, series, and property), list all stores in the specified
    city, fetch inventory for that SKU, and sum available_today values.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003, r004'
  id: r003
  reasoning: 'Error: ''Unable to determine the count because the query only returned
    the product series (''Zinc Plated'') and no branch-level availability information.''
    Root cause: incomplete-action (actions list in SDD_OUTPUT omitted queries for
    product SKU, store listing, and inventory summation). Failing fragment: actions
    list in SDD_OUTPUT contains only ''SELECT name, sql FROM sqlite_schema...'' and
    ''SELECT DISTINCT series FROM products WHERE brand=''Heco'';'' — missing the subsequent
    queries needed to achieve spec_goal. Rule linkage: new rule must reference spec_goal
    and actions to ensure completeness.'
  source: learn
  status: inactive
- content: Always ensure that the plan output's action field includes all SQL queries
    from the spec's actions list that are necessary to achieve the spec_goal, specifically
    including queries to list stores in the target city and join with inventory for
    the identified SKU.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003, r004'
  id: r004
  reasoning: 'Verbatim error: ''ANSWER clarification: Found the product record ...
    However, no branch stock or availability data for Vienna stores was retrieved.''
    Root cause: wrong-action (incomplete plan output action). Failing fragment: plan
    output action only contained product search query ''SELECT * FROM products WHERE
    brand=''Heco'' AND name LIKE ''%Wood and Drywall Screw%'' AND sku IN (SELECT sku
    FROM product_properties WHERE key=''screw_type'' AND value_text=''drywall screw'');'',
    omitting the store inventory query defined in the spec''s actions list. Rule linkage:
    new rule will require plan output action to include all spec actions.'
  source: learn
  status: inactive
- content: Always ensure the plan output's action field includes a query that returns
    the individual store records (all columns) for the target city and the product
    record (all columns) for the identified product, so that they can be cited as
    grounding references; the aggregate sum must be computed from these rows in the
    answer reasoning rather than from a separate aggregate-only query.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r005'
  id: r005
  reasoning: 'Verbatim error: ''ANSWER clarification: count : 0''. Root cause: wrong-action
    — the plan output''s action field contained only the aggregate SELECT SUM(...)
    query, missing the queries to retrieve store records and product record required
    for citation by the spec_goal. Failing fragment: the plan output''s action was
    ''SELECT SUM(COALESCE(i.available_today,0)) AS total FROM stores s LEFT JOIN inventory
    i ...'' which returns only a single aggregated row, providing no individual store
    or product records to cite. The spec_goal and success_criteria explicitly require
    citing ''every city store record plus the product record''. The existing rules
    (r003, r004) require including all necessary queries from spec''s actions list,
    but the plan output violated that by omitting the store and product queries. New
    rule reinforces that the action must produce row-level data for grounding references.'
  source: learn
  status: inactive
- content: 'Always follow this sequence for brand+series product identification and
    availability queries: first, query distinct series values for the given brand
    from the products table before applying a LIKE filter with a guessed pattern (to
    confirm the series name). Then, ensure the actions list in the spec includes all
    necessary queries: (1) discover the correct series, (2) find the product SKU by
    brand, series, and relevant properties, (3) list all stores in the target city,
    (4) fetch inventory for that SKU (optionally joining stores for city filtering),
    and (5) sum available_today values. Specifically, the plan output''s action field
    must include all these SQL queries from the spec''s actions list. Moreover, the
    queries for stores and the product must return individual store records (all columns)
    for the target city and the product record (all columns) for the identified product,
    so that they can be cited as grounding references; the aggregate sum must be computed
    from these rows in the answer reasoning rather than from a separate aggregate-only
    query.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r006'
  id: r006
  reasoning: Merged r002, r003, r004 into r005 (highest id). r002 added the step of
    querying distinct series values first. r003 added the full set of required queries.
    r004 added the requirement to include those queries in the plan action field.
    r005 already covered the individual-row grounding and reasoning-based sum. The
    merged rule now covers all layers in a single policy.
  source: learn
  status: inactive
