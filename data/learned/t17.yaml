- agents_md_anchor: '#decision-tree-branches'
  content: Always structure decision branches with 'condition' and 'plan' keys, where
    'plan' is the name of the answer block to execute; never use 'when' and 'label'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'The PlanIR used ''when'' and ''label'' keys in the decision branch instead
    of the required ''condition'' and ''plan'' keys. This caused the interpreter to
    fail to evaluate the decision tree, resulting in an OUTCOME_NONE_CLARIFICATION
    instead of the expected OUTCOME_OK. The error message: ''grader: expected outcome
    OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''. The failing PlanIR fragment: ''branches'':
    [{''when'': {...}, ''label'': ''ok''}]. Existing rule r004 mentions ''condition''
    and ''plan'' but was not specific enough to prevent this mistake.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always represent filter_rows predicates as a list [op, lhs, rhs] where
    op is a string like 'eq', 'in_set', etc., and lhs/rhs are references; never use
    a dict.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: ''interpret: compute step ''filter_rows'' failed: ''dict'' object
    has no attribute ''op'' CONTRACT: filter_rows(rows, pred): first arg must be list[dict]
    rows''. The failing PlanIR fragment is: {"prim":"filter_rows","args":["$inventory_all",{"op":"eq","lhs":"$row.product_sku","rhs":"$target_sku"}],"into":"target_inventory_rows"}.
    The predicate is a dict with keys ''op'', ''lhs'', ''rhs'', but the interpreter
    expects an object with an attribute ''op'', not a dict. The correct PlanIR representation
    for a predicate is a list, e.g., ["eq", "$row.product_sku", "$target_sku"]. This
    rule ensures predicates are lists, not dicts, to match the interpreter''s expected
    format.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always access the content of a Read RPC result via the 'content' field
    (e.g., $bind.content) when using it in decision conditions; never use the raw
    bind directly as a string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Error: ''Protocol message ReadResponse has no "guest" field.'' The PlanIR
    read /docs/security.md and bound it to $security_policy_raw. In the decision,
    it used ''contains_any'' with lhs=$security_policy_raw and rhs=["guest","guests"].
    The ReadResponse is an object with fields like ''content'', not a plain string.
    The VM tried to access a ''guest'' field on the ReadResponse object, causing the
    error. The fix is to reference $security_policy_raw.content to get the text content.
    This rule ensures future PlanIRs correctly extract the text from Read RPC results.'
  status: inactive
  surface: ir
