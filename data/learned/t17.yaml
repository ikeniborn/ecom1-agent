- agents_md_anchor: null
  content: 'Always use a multi-step discovery for products with complex criteria:
    first find candidate SKUs by brand and series, then refine by model and properties
    in compute, to avoid OUTCOME_NONE_UNSUPPORTED.'
  created: '2026-06-22'
  deactivated_reason: Superseded by more specific rule requiring two separate discovery
    steps and compute intersection.
  id: r003
  reasoning: The plan's product discovery query returned no rows, causing $product_sku
    to be empty, which triggered the unsupported branch. The exact string matching
    for model and property_value_text may have failed due to case or synonym differences.
    A multi-step discovery with a broader initial search and compute-time filtering
    would be more robust. Additionally, a pre-phase deep read of product_variant_properties
    will surface the actual property values.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always structure the 'decision' field in PlanIR as a valid DecisionTree
    dictionary with a 'branches' list, each branch containing 'condition' and 'plan'
    keys; never set it to null or an empty object.
  created: '2026-06-22'
  deactivated_reason: r004 is too vague; it did not explicitly forbid 'when' and 'label',
    leading to this failure. The new rule provides precise key names.
  id: r004
  reasoning: The PlanIR validation error 'decision Input should be a valid dictionary
    or instance of DecisionTree' indicates the 'decision' field was present but not
    a proper DecisionTree object (likely null or missing required keys). The rule
    ensures future PlanIR outputs include a correctly formed decision tree when a
    decision is needed.
  status: inactive
  surface: ir
