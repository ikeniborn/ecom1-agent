- agents_md_anchor: null
  content: 'When discovering a product by family name and properties, always use a
    stepwise approach: first discover the product family, then its variants, then
    filter by properties using a join on product_variant_properties, and verify the
    property keys and values match the expected ones before proceeding.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. Root
    cause: the SQL query used EXISTS subqueries to filter product variants by properties,
    but it returned no rows, so product_variant.record_path was empty, triggering
    the no_product branch. The plan''s product lookup was not robust enough to find
    the product. A stepwise approach with explicit joins and verification would improve
    grounding.'
  status: active
  surface: ir
- agents_md_anchor: '#plan-primitives'
  content: Never pass more than two arguments to the 'get' primitive. To extract a
    column value from a specific row of a rowset, first use 'column' to obtain the
    list of values for that column, then use 'get' with the row index to retrieve
    the desired value.
  created: '2026-06-22'
  deactivated_reason: null
  id: r012
  reasoning: 'The interpret step failed with: ''get(obj, key) takes 2 positional arguments
    but 3 were given''. The failing PlanIR compute step was: {"prim":"get","args":["$product_and_total_rowset","0","record_path"],"into":"product_record_path"}.
    The ''get'' primitive expects exactly two arguments (object and key), but three
    were supplied. The correct approach to extract a column value from a specific
    row is to first use ''column'' to get the list of values for that column, then
    ''get'' to index into that list. This rule prevents misuse of ''get'' with a column
    name as a third argument.'
  status: active
  surface: ir
