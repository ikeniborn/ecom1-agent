    from these rows in the answer reasoning rather than from a separate aggregate-only
    query.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r007'
  id: r007
  reasoning: r005 is fully subsumed by r006. r006 includes the same grounding requirement
    (product and store records returned as individual rows, aggregate computed from
    them) and adds the crucial brand+series sequence steps. Since r006 is the higher-id
    rule and covers all of r005's content, r005 is redundant and can be deactivated.
  source: learn
  status: inactive
