  created: '2026-05-21'
  deactivated_reason: r008 and r009 erroneously instructed to include all SQL queries
    in the plan output's action field, which caused the action field to be set to
    a single first query and led to a repeated-action error upon subsequent attempts.
    Their directive is incompatible with the sequential execution model where the
    action field should contain only the immediate next query.
  id: r008
  reasoning: Rules r006 and r007 are identical in content. r007 has the higher numeric
    id, so it is kept as the merged rule. r006 is redundant and deactivated.
  source: learn
  status: inactive
