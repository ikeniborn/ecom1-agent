- agents_md_anchor: null
  content: Always ensure that every variable referenced in an answer ref exists as
    a record with the exact field name used in the ref source path. If the data originates
    from a rowset, extract the needed column and wrap it in a record with that field
    name before the answer is built.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: interpret: unresolved required ref(s) [''$graz_stores.record_path'',
    ''$product.record_path''] on OK answer. Root cause: The PlanIR defined $graz_stores
    as a rowset (list of records) and $product as a record with field ''product_record_path'',
    but the answer refs required $graz_stores.record_path and $product.record_path.
    The interpreter could not resolve these paths because $graz_stores.record_path
    is ambiguous on a rowset and $product.record_path does not exist. Failing PlanIR
    fragment: rowsets mapping graz_stores_raw into a rowset with column ''record_path'',
    and product_rows mapping product_record_path; compute step creating $product from
    first of product_rows without renaming the field; answer refs using $graz_stores.record_path
    and $product.record_path. Rule linkage: The new rule instructs to always shape
    variables so that answer ref source paths resolve to a record with the exact field
    name, converting rowsets to records with the required field when necessary.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always ensure the PlanIR contains only the allowed fields: discovery,
    rowsets, compute, and answer; do not include discovery_ext, rowsets_ext, or compute_ext.'
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: PLAN validation failed with 'Extra inputs are not permitted' for discovery_ext,
    rowsets_ext, compute_ext. The generated PlanIR included these extraneous fields,
    which are not part of the PlanIR schema. The root cause is that the plan generation
    step incorrectly added these fields. The corrective rule ensures future PlanIR
    outputs omit them.
  status: inactive
  surface: ir
