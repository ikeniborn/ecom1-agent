entries:
- agents_md_anchor: null
  content: When parsing /bin/sql stdout, split each row on comma (output is CSV) and
    skip the first header line; never assume pipe-delimited output, or column extraction
    yields single-element rows and path/ref columns are dropped.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column''. RPC
    outputs show SQL DID return rows: ''STO-12JLHT7D,/proc/catalog/STO-12JLHT7D.json''
    and two Graz store rows with record_path. Root cause: parse_rows splits on ''|''
    (`line.split("|")`) but /bin/sql emits CSV (comma-delimited with header). Each
    line never contains ''|'', so every row collapses to a single-element list. Failing
    fragment: `if product_rows and len(product_rows[0]) >= 2` and `if len(row) >=
    2` both fail → product_path=None, store_paths=[] → refs=[]. total parsed correctly
    only by luck (single column). Rule linkage: delimiter mismatch + unskipped header
    is the parsing-technique defect; rule mandates comma-split and header-skip.'
  status: active
