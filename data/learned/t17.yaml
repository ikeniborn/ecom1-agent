- agents_md_anchor: null
  content: Always use $bind.stdout as the source for rowsets when the discovery step
    is an Exec RPC, because Exec returns a structured object with stdout, stderr,
    exit_code; using the raw bind may cause ambiguity and trigger a clarification
    outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r010
  reasoning: The interpreter returned OUTCOME_NONE_CLARIFICATION instead of OUTCOME_OK
    or OUTCOME_NONE_UNSUPPORTED. This indicates the PlanIR was ambiguous and the interpreter
    could not proceed. The likely cause is that the rowsets' from_ fields reference
    the raw Exec RPC bind names (e.g., $product_skus_raw) without specifying the stdout
    field. Exec RPC returns an object with stdout, stderr, exit_code; the rowset parser
    expects a string, so it encountered an object and asked for clarification. The
    failing fragment is the rowsets' from_ attributes. This is analogous to existing
    rule r008 for Read RPC, but for Exec.
  status: active
  surface: ir
