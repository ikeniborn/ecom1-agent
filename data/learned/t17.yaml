  source: learn
  status: inactive
- content: Always ensure that in brand+series product identification and availability
    queries, the spec's actions list enumerates each SQL query in order. The plan
    output's action field must contain exactly one SQL query — the next one to be
    executed — not the entire list from the spec. After each query is successfully
    executed, update the action field to the next query in the sequence. Do not include
    multiple queries or the full list in the action field.
  created: '2026-05-21'
  deactivated_reason: r010 required the plan output action to be an SQL query but
    did not mandate that store retrieval itself be SQL-based; the agent attempted
    to satisfy r010 with a file-list action (which is not SQL), then got stuck. The
    new rule explicitly requires SQL for store/product retrieval and clarifies action
    content, making r010 obsolete.
  id: r010
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: SELECT DISTINCT series FROM products WHERE brand = ''Heco''''.
    Root cause category: wrong-action. The failing fragment is the plan output''s
    action field containing only ''SELECT DISTINCT series FROM products WHERE brand
    = ''Heco'''', which matched the first query from the spec''s actions list. Existing
    rule r008/r009 demanded that the plan output''s action field include all SQL queries
    from the spec''s actions list. However, the system expects the action field to
    contain exactly one query—the next one to execute. By adhering to the flawed rule,
    the plan output placed only the first query (since it couldn''t include the full
    list as a single string), causing the system to attempt re-execution of the same
    query, resulting in a repeated-action error. The new rule will correct this by
    specifying that the action field must contain only the next unexecuted query.'
  source: learn
  status: inactive
- content: Always retrieve store IDs and product details for availability queries
    using SQL queries against the database (e.g., SELECT id, city FROM stores WHERE
    city = 'Graz'), never by reading flat files from /proc/stores/. The plan output's
    action must be the first SQL query from the spec's actions list (if any SQL queries
    are listed), and after each step execute that action; if no SQL query is listed,
    set the action to the first step of the plan and proceed normally. Do not issue
    clarifications requesting flat file content that is already available via SQL.
  created: '2026-05-21'
  deactivated_reason: null
  id: r011
  reasoning: 'Verbatim error: ''ANSWER clarification: I found the Graz store records:
    store_graz_jakomini.json and store_graz_lend.json. To compute the total units
    across both stores for the specified product (Heco Zinc Plated HECO 3DW-64B Nut
    Bolt and W'' (truncated). Root cause category: wrong-action. The plan output''s
    action was ''list:/proc/stores/'' (a flat file operation) instead of an SQL query
    from the spec''s actions list. The agent then issued a clarification because it
    lacked store file contents and product data, despite the fact that store IDs and
    product details can be retrieved via SQL from the database. This violates BASE''s
    ''Inventory lives only in SQL projections'' and the existing rule r010''s requirement
    that the action field contain exactly one SQL query. The failing fragment is the
    plan output action ''list:/proc/stores/'' and the spec''s plan steps that rely
    on reading /proc/stores/ flat files for store identification. The new rule must
    forbid file-based store retrieval and enforce SQL-first approach, superseding
    r010 which was ambiguous about action content.'
  source: learn
  status: active
