- agents_md_anchor: null
  content: 'Always separate product discovery into two distinct discovery steps: first
    query product_variants for candidate SKUs based on brand and name/series, then
    query product_variant_properties to filter those SKUs by property_key and property_value_text,
    and use compute to find the intersection; never combine both filters in a single
    SQL query.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The PlanIR''s single discovery query combined product_variants and product_variant_properties
    filters, returning empty and causing OUTCOME_NONE_UNSUPPORTED. The objective requires
    a multi-step discovery: first find candidate SKUs by brand and name/series, then
    refine by properties. The failure indicates that the combined query did not match
    any rows, likely due to data nuances. A two-step approach with separate queries
    and compute intersection would be more robust and align with the intended discovery
    logic.'
  status: inactive
  surface: ir
