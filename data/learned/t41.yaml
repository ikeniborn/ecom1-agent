- agents_md_anchor: '#important-things > policy-grounding'
  content: When the docs Tree discovery surfaces nested sub-policy documents under
    the policy directory relevant to the task, read those nested docs and add their
    full paths to answer refs, instead of citing only the top-level policy doc named
    in answer_template.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/payments/3ds.md''".
    Root cause: script built refs from a hardcoded list — failing fragment `refs =
    []; if payment_path: refs.append(payment_path); refs.append("/docs/payments.md")`
    — citing only the top-level /docs/payments.md from answer_template. The docs_tree
    RPC (Tree /docs level 2) was emitted and captured but never consumed; it exposes
    the nested 3DS sub-policy /docs/payments/3ds.md, which is the policy actually
    applied (3DS advance). Grader requires the specific applied sub-policy doc as
    a grounding reference. Rule linkage: complements policy-grounding constraint by
    directing CODEGEN to expand refs from discovered Tree output rather than the static
    template list. Not covered by r001 (op emission) or r002 (stat/read try/except).'
  status: active
- agents_md_anchor: null
  content: Always wrap each vm.exec RPC on a tool path in a try/except that captures
    the 'runtime tool not found' error and continues with an empty result, so a tool
    absent from the runtime registry does not abort the script before tool_plan.ops
    and vm.answer are emitted.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''real_vm_exec: runtime tool not found: not found''.
    OBSERVED_RPC_OUTPUTS shows only the first exec (/bin/id -> cust_023) returned;
    the next unwrapped vm.exec aborted the run. Root cause: vm.exec on a tool path
    not registered in the runtime throws ''runtime tool not found'', and unlike the
    wrapped vm.read probes (lines reading /docs/payments/3ds.md etc.), the exec calls
    are bare. Failing fragment: `docs_tree = vm.exec(path="/usr/bin/tree", ...)` /
    `payments_help = vm.exec(path="/bin/payments", args=["--help"], ...)` / the ops
    `advance = vm.exec(path="/bin/payments", args=["retry-3ds", ...])` are all unguarded,
    so the first missing runtime tool kills the script before vm.answer. Linkage:
    r002 already mandates try/except for Read/Stat path-not-found; this extends the
    same defensive technique to Exec tool-not-found, a distinct RPC type and error
    class (runtime tool registry vs filesystem path), so it is complementary not a
    duplicate.'
  status: active
- agents_md_anchor: null
  content: Always emit every RPC declared in tool_plan — discovery and ops alike —
    unconditionally, including Read RPCs whose path comes from an upstream binding
    (e.g. $pay.record_path) that resolved to empty; never guard such a call with `if
    path else None` or any conditional, since a skipped discovery Read diverges the
    emitted RPC multiset from the frozen plan and fails fidelity.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''fidelity: AssertionError: fidelity drift (RPC multiset)
    expected: [Answer, Exec, Exec, Exec, Exec, Exec, Read, Read, Read] got: [Answer,
    Exec, Exec, Exec, Exec, Exec, Read, Read]''. Plan declares 3 discovery Reads:
    pay_record ($pay.record_path), payments_policy (/docs/payments.md), security_policy
    (/docs/security.md). Root cause: failing fragment `pay_record = safe_read(record_path,
    True) if record_path else None` — when SQL parsing yields empty record_path, the
    Read on $pay.record_path is conditionally skipped, dropping the multiset to 2
    Reads. Linkage: r001 forbids the same short-circuit but is scoped to tool_plan.ops
    and early-return; this failure is a conditional skip of a DISCOVERY Read bound
    to an empty upstream value. New rule generalizes the no-conditional-emit invariant
    to discovery RPCs too, strictly superseding r001.'
  status: active
