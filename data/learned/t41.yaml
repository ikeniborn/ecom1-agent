  content: Always set outcome_from_exit in every operation to the label of the answer block that provides
    the required references for the intended outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: ''grader: answer missing required reference ''/docs/payments/3ds.md''''. The PlanIR''s
    ''recover'' branch executes an operation to fix the payment, but the operation''s ''outcome_from_exit''
    is null. The interpreter therefore did not use the ''recover'' answer block (which includes the required
    3ds.md ref), causing the final answer to lack the reference. Failing fragment: ops[0].outcome_from_exit
    = null. The new rule ensures the answer block with all required refs is always selected after an operation.'
