- agents_md_anchor: null
  content: Always order decision branches so that all branches leading to a denied outcome (e.g., OUTCOME_DENIED_SECURITY)
    appear before any branch leading to a non-denied outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: ''interpret: security-first violation: a DENIED_SECURITY branch follows a non-DENIED
    branch in the decision tree''. The PlanIR decision block has: branch 1 (denied_security, guest check),
    branch 2 (success, payment completed and 3ds successful), branch 3 (denied_security, catch-all). Branch
    2 is a non-denied outcome, and branch 3 is a denied outcome that follows it, violating the security-first
    ordering constraint. The rule must enforce that all denied branches are evaluated before any non-denied
    branch.'
  status: active
  surface: ir
- agents_md_anchor: '#decision-branches'
  content: 'When creating a catch-all decision branch that must always be true, use a valid predicate
    such as {''op'':''eq'', ''lhs'': 1, ''rhs'': 1} instead of an invalid op like ''true''.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r008
  reasoning: The error 'unknown predicate op 'true'' occurred because the PlanIR used {'op':'true'} as
    a when condition, which is not a valid predicate. Existing rule r005 incorrectly suggested using {'op':'true'}
    as an example of an always-true condition. The new rule corrects this by specifying a valid predicate
    that evaluates to true, ensuring the catch-all branch passes validation.
  status: active
  surface: ir
