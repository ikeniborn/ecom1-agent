    positional argument: b'' occurred because the PlanIR compute step used ''concat''
    with only one argument (a literal string) instead of two rowsets. The intent already
    provided the basket_id parameter, so no compute step was needed; the answer message
    should have referenced the parameter directly. This rule prevents future misuse
    of concat and unnecessary recomputation of provided parameters.'
  status: inactive
