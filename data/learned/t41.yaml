  reasoning: 'Error: ''grader: answer missing required reference ''/docs/payments/3ds.md''''.
    The PlanIR''s ''recover'' branch executes an operation to fix the payment, but
    the operation''s ''outcome_from_exit'' is null. The interpreter therefore did
    not use the ''recover'' answer block (which includes the required 3ds.md ref),
