- agents_md_anchor: null
  content: Do not use the default_label to supply required references; always create
    an explicit catch-all branch with a when condition that is always true (e.g.,
    {'op':'true'}) and include all required refs for the outcome there.
  created: '2026-06-22'
  deactivated_reason: r005 suggested using {'op':'true'} as an always-true condition,
    which is an invalid predicate op and caused the validation error.
  id: r005
  reasoning: 'Error: grader: answer missing required reference ''/docs/payments/3ds.md''.
    The PlanIR includes the ref in both already_ok and resume_ok branches, and default_label
    is already_ok, yet the answer was missing the ref. This indicates the interpreter
    may omit refs when falling back to the default_label. To guarantee inclusion,
    an explicit catch-all branch with a tautological condition should be used instead
    of relying on default_label.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always provide a non-empty string for the default_label in every decision
    block; never set it to null or omit it.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The PlanIR validation failed with 'Input should be a valid string [type=string_type,
    input_value=None, input_type=NoneType]' for decision.default_label. The existing
    rule r005 advises not to use default_label to supply required references, but
    does not explicitly forbid a null value. The PlanIR likely had a decision with
    default_label set to None, causing the validation error. This rule ensures default_label
    is always a valid string.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always order decision branches so that all branches leading to a denied
    outcome (e.g., OUTCOME_DENIED_SECURITY) appear before any branch leading to a
    non-denied outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: ''interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree''. The PlanIR decision block
    has: branch 1 (denied_security, guest check), branch 2 (success, payment completed
    and 3ds successful), branch 3 (denied_security, catch-all). Branch 2 is a non-denied
    outcome, and branch 3 is a denied outcome that follows it, violating the security-first
    ordering constraint. The rule must enforce that all denied branches are evaluated
    before any non-denied branch.'
  status: active
  surface: ir
- agents_md_anchor: '#decision-branches'
  content: 'When creating a catch-all decision branch that must always be true, use
    a valid predicate such as {''op'':''eq'', ''lhs'': 1, ''rhs'': 1} instead of an
    invalid op like ''true''.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r008
  reasoning: The error 'unknown predicate op 'true'' occurred because the PlanIR used
    {'op':'true'} as a when condition, which is not a valid predicate. Existing rule
    r005 incorrectly suggested using {'op':'true'} as an example of an always-true
    condition. The new rule corrects this by specifying a valid predicate that evaluates
    to true, ensuring the catch-all branch passes validation.
  status: active
  surface: ir
