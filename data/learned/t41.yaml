- agents_md_anchor: null
  content: When a security constraint's deny_when condition references a fact (e.g.,
    $_facts.identity.kind), the decision branch that maps to the denied outcome must
    use the same fact path in its when condition, not a locally extracted variable.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The plan extracted identity_kind from /bin/id output as 'customer', but
    the constraint '#guest-access' evaluated $_facts.identity.kind as 'guest' (likely
    from session facts). The decision branch used the local variable, so it did not
    match, falling through to default unsupported outcome. The verifier flagged that
    the constraint held but the outcome was not DENIED_SECURITY. The plan must use
    the fact path from the constraint directly.
  status: inactive
  surface: ir
