- agents_md_anchor: null
  content: Always set outcome_from_exit in every operation to the label of the answer
    block that provides the required references for the intended outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: ''grader: answer missing required reference ''/docs/payments/3ds.md''''.
    The PlanIR''s ''recover'' branch executes an operation to fix the payment, but
    the operation''s ''outcome_from_exit'' is null. The interpreter therefore did
    not use the ''recover'' answer block (which includes the required 3ds.md ref),
    causing the final answer to lack the reference. Failing fragment: ops[0].outcome_from_exit
    = null. The new rule ensures the answer block with all required refs is always
    selected after an operation.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Always extract the identity kind from the /bin/id output by parsing the
    ''roles'' line: if the roles include ''customer'', set identity.kind to ''customer'';
    otherwise set it to ''guest''. Use a compute step that splits the output on newlines,
    finds the line starting with ''roles:'', and checks for the substring ''customer''.'
  created: '2026-06-24'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: verify I3: outcome DENIED_SECURITY but no declared security deny_when
    predicate holds (spurious over-refusal). The PlanIR''s compute step used a malformed
    ''get'' prim with a literal object instead of parsing the /bin/id output. The
    /bin/id output shows ''user: cust_088'' and ''roles: customer'', so identity.kind
    should be ''customer'', not ''guest''. The decision branch incorrectly labeled
    as denied because identity_kind was not correctly derived. The root cause is that
    the PLAN phase did not properly model extraction of identity kind from the /bin/id
    output. This rule ensures correct extraction before decision branches.'
  status: active
  surface: ir
- agents_md_anchor: '#security'
  content: Always extract the identity kind from /bin/id output using a compute step
    that splits on newlines, finds the line starting with 'roles:', and checks for
    substring 'customer'. Never use contains_any directly on the raw Exec output for
    identity checks.
  created: '2026-06-24'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "roles: customer"
    field.'' Root cause: The PlanIR used contains_any directly on $identity_raw (raw
    Exec output) to check for ''roles: customer''. The VM interprets contains_any''s
    lhs as a field path on the ExecResponse protobuf, causing a field access error.
    Failing PlanIR fragment: the decision branch with {"op":"contains_any","lhs":"$identity_raw","rhs":["roles:
    customer"]}. Existing rule [in-session] prescribed a compute-step extraction but
    was not followed; this new rule supersedes it by explicitly forbidding the direct
    contains_any approach.'
  status: active
  surface: ir
