- agents_md_anchor: null
  content: Always name answer refs and compute 'into' targets exactly as specified
    in the TOOL_PLAN required_refs sources, preserving dots and structure (e.g., use
    '$product.record_path' not '$product_record_path').
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: The error 'unresolved required ref(s) ["$product.record_path", "$vienna_stores"]
    on OK answer' occurred because the PlanIR answer refs list used '$product_record_path'
    instead of the required '$product.record_path'. The TOOL_PLAN required_refs for
    OUTCOME_OK specify source '$product.record_path', but the compute section bound
    the record_path into '$product_record_path' and the answer refs listed that. The
    interpreter could not resolve the required ref, causing the failure. The $vienna_stores
    ref may also have been unresolved if the compute section's output was not a record_path,
    but the primary issue is the naming mismatch. This rule ensures exact alignment
    with required_refs sources.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When extracting a field from a single row (e.g., after 'first'), use 'get'
    instead of 'column'; 'column' requires a list of rows.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'The interpret step failed with: ''column'' expects list[dict]; use ''get''
    for a single row. The PlanIR used ''first'' to obtain a single row, then incorrectly
    applied ''column'' to extract ''product_record_path''. The correct primitive for
    a single row is ''get''. Existing rule r006 (''Always use first with a single
    sequence argument; to extract a field from the first row, apply first then column'')
    is directly contradicted by this error and must be deactivated.'
  status: inactive
  surface: ir
