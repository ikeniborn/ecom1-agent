- agents_md_anchor: null
  content: Always ensure that every answer branch's outcome field exactly matches
    one of the outcomes listed in the TOOL_PLAN's outcome_space.
  created: '2026-06-22'
  deactivated_reason: null
  id: r010
  reasoning: The error 'expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION'
    indicates the PlanIR produced an outcome not in the allowed outcome_space. The
    script code shows a mapping for unsupported to OUTCOME_NONE_UNSUPPORTED, but the
    actual PlanIR likely had a different mapping. To prevent this, the PLAN phase
    must restrict answer outcomes to the outcome_space.
  status: active
