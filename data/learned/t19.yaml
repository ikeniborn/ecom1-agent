- agents_md_anchor: null
  content: When a required ref needs a field from a single row (e.g., after 'first'),
    always use a 'get' primitive to extract the field into a named variable and reference
    that variable; never use dot notation like '$row.field' in refs.
  created: '2026-06-22'
  deactivated_reason: null
  id: r012
  reasoning: 'The error ''interpret: unresolved required refs [''$product.record_path'']
    on OK answer'' occurred because the PlanIR used ''first'' to capture a single
    row into $product, then attempted to reference $product.record_path directly in
    the answer refs. The interpreter cannot resolve dot-notation field access on a
    row object; the field must be extracted via a ''get'' compute step into a named
    variable, and that variable referenced.'
  status: active
  surface: ir
