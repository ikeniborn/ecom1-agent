  content: When writing SQL discovery queries that filter by property values, always
    use case-insensitive and whitespace-insensitive comparisons (e.g., LOWER(TRIM(property_value_text))
    = LOWER(TRIM('storage bin'))) to avoid empty results due to formatting differences.
