  deactivated_reason: 'Consolidated: r004, r005'
  id: r005
  reasoning: 'Verbatim error: ''Empty result:''. Root cause: wrong-key — the product_properties
    query used key ''connector type'' (with space) and ''diameter_mm'', but the actual
    stored key for connector type is likely ''connector_type'' (underscore), resulting
    in no matching rows. Failing fragment: action "/bin/sql \"SELECT sku, key, value_text,
    value_number FROM product_properties WHERE sku IN (SELECT sku FROM products WHERE
    brand = ''AlcaPlast'' AND series = ''Universal Basic'' AND model = ''1CT-04J'')
    AND key IN (''connector type'', ''diameter_mm'');\"". Rule linkage: new rule will
    enforce inclusion of a plan step to discover exact property keys before building
    such a filter, targeting the spec_goal phrase ''Valve and Connector from AlcaPlast
    ... that has connector type ball valve and diameter 32 mm''.'
  source: learn
  status: inactive
