entries:
- content: Always sample `products` for brand 'Spax' and `product_properties` for
    keys 'diameter_mm' and 'length_mm' to verify column contents and value storage
    types before executing the action that filters by `p.series LIKE '%Outdoor T-Star%''
    and `value_number = 4` and `value_number = 80`.
  created: '2026-05-23'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''Empty result: sku,path,name,series,model''. Root cause
    category: wrong-action. The failing fragment is the action ''SELECT p.sku, p.path,
    p.name, p.series, p.model FROM products p JOIN product_properties pp_d ON p.sku
    = pp_d.sku AND pp_d.key = ''diameter_mm'' AND pp_d.value_number = 4 JOIN product_properties
    pp_l ON p.sku = pp_l.sku AND pp_l.key = ''length_mm'' AND pp_l.value_number =
    80 WHERE p.brand = ''Spax'' AND p.series LIKE ''%Outdoor T-Star%''''. This action
    assumed the product line text is in the `series` column and that `diameter_mm`
    and `length_mm` are stored as `value_number`, without exploratory verification.
    The new rule requires sampling `products` and `product_properties` before such
    precise joins.'
  source: learn
  status: active
- content: Always sample `products` for brand 'Rawlplug' and `product_properties`
    for keys 'anchor_type' and 'diameter_mm' to verify column contents and value storage
    types before executing the action that filters by `p.series LIKE '%Pro Pack UNO
    3FA-C1B%'' and `anchor_type = 'concrete anchor'` and `diameter_mm = 8`.
  created: '2026-05-23'
  deactivated_reason: null
  id: r002
  reasoning: 'The executed SQL query returned an empty result set (verbatim error:
    ''Empty result: sku,path,name,series,anchor_type,diameter_mm,store_id,store_path,store_name,available_today'').
    Root cause category is wrong-value-type/wrong-key: the action `SELECT ... MAX(CASE
    WHEN pp.key=''diameter_mm'' THEN pp.value_number END) AS diameter_mm ... HAVING
    anchor_type = ''concrete anchor'' AND diameter_mm = 8` assumes that the ''diameter_mm''
    property is stored as a REAL in the `value_number` column and that the key/value
    pairs exist as written, but without prior sampling the actual storage type could
    be `value_text` or the key/value could differ, causing the HAVING filter to eliminate
    all rows. The spec_goal explicitly requires identifying the Rawlplug SKU with
    these properties, yet the unsampled pivot filter produced zero rows. The new rule
    requires pre-flight sampling of the product_properties table for these exact keys
    before running the action.'
  source: learn
  status: active
- content: Always sample `products` for brand 'Osram' and `product_properties` (SELECT
    DISTINCT key, value_text, value_number) for the matched SKUs to verify actual
    key names and value storage types before executing the action that filters by
    `p.series LIKE '%3PW-R88%'` and HAVING fitting='G9' AND wattage_w=4 AND lumen=470.
  created: '2026-05-24'
  deactivated_reason: r003 prescribes series LIKE '%3PW-R88%' which returned empty
    results in both the prior cycle and this cycle; the actual series string does
    not contain that substring, so the rule perpetuates the wrong-filter failure.
  id: r003
  reasoning: 'Verbatim error: ''Empty result: sku,path,series,model,fitting,wattage_w,lumen''.
    Root cause category: wrong-key or wrong-value-type — the pivot action assumes
    property keys ''fitting'', ''wattage_w'', ''luminous_flux_lm'' exist with those
    exact names and that wattage_w stores value_number=4 and luminous_flux_lm stores
    value_number=470, but no rows matched. The failing fragment is the action in SDD_OUTPUT:
    ''MAX(CASE WHEN pp.key=\''fitting\'' THEN pp.value_text END)'' and ''MAX(CASE
    WHEN pp.key=\''wattage_w\'' THEN pp.value_number END)'' and ''MAX(CASE WHEN pp.key=\''luminous_flux_lm\''
    THEN pp.value_number END)'' inside HAVING fitting=\''G9\'' AND wattage_w=4 AND
    lumen=470 — none of these key names or value types were verified before use. The
    schema digest lists top property keys as ''color_family, material, volume_ml,
    length_mm, diameter_mm, voltage_v, size, power_source, use_area, pack_count''
    — none of ''fitting'', ''wattage_w'', ''luminous_flux_lm'' appear there, confirming
    they may be named differently. Rule linkage: new rule must require sampling products
    for brand ''Osram'' and product_properties for actual key names and value storage
    types before executing the pivot action with series LIKE ''%3PW-R88%'' and those
    HAVING filters.'
  source: learn
  status: inactive
- content: Always sample `products` WHERE brand='Osram' AND (name LIKE '%LED%' OR
    name LIKE '%Bulb%' OR series LIKE '%Eco%') WITH NO assumed series substring, then
    sample `product_properties` (SELECT DISTINCT key, value_text, value_number) for
    the returned SKUs to discover the actual series name and property key names, before
    filtering by series, fitting, wattage, or lumen for the spec_goal 'Find total
    units available_today across all Graz PowerTool branches for the Osram 3PW-R88
    LED Bulb with G9 fitting, 4W, 470lm'.
  created: '2026-05-24'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''Empty result: sku,path,series,model,name''. Root cause:
    wrong-filter — the series filter ''%3PW%'' returned no rows, meaning the actual
    series string does not contain ''3PW''. The failing fragment is the action ''SELECT
    p.sku, p.path, p.series, p.model, p.name FROM products p WHERE p.brand = \''Osram\''
    AND p.series LIKE \''%3PW%\'''' from both PLAN_OUTPUT.action and SDD_OUTPUT.actions[0].
    Rule r003 already mandates sampling products for brand=''Osram'' before filtering,
    but it still specifies LIKE ''%3PW-R88%'' as the series filter — which is the
    same pattern that keeps failing. The series substring ''3PW'' (and ''3PW-R88'')
    does not match the actual data. A broader sample with no series filter is needed
    to discover the real series value. Rule r003 is the blocking rule: it prescribes
    a still-wrong series filter and must be deactivated.'
  source: learn
  status: active
