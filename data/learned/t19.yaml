- content: Always use the property keys confirmed by the preliminary key retrieval
    query (step 2 in plan) in the final SQL when filtering product_properties; never
    hardcode key names like 'device_type', 'color_family', or 'ip_rating' without
    validating their presence, and if the expected keys are not among the retrieved
    list, treat the product as non-existent (0 available) and cite all stores with
    zero.
  created: '2026-05-21'
  deactivated_reason: r008 and r009 required validating property keys but did not
    ensure the existence of the product with those key-value combinations, which contributed
    to the empty-result failure when keys existed but no product matched. The new
    rule supersedes both by adding a product existence check.
  id: r008
  reasoning: 'Error: ''Empty result'' (ERROR_TYPE: empty). Root cause category: wrong-key.
    The final action SQL hardcoded property key names ''device_type'', ''color_family'',
    ''ip_rating'' without verifying they exist among Legrand''s product properties.
    The plan included step 2 to retrieve distinct keys, but the action ignored those
    results, leading to an empty product match. The failing fragment is the action:
    `/bin/sql "WITH matched_sku AS (...) AND EXISTS ... key=''device_type'' ..."`.
    The spec_goal references ''device type terminal clamp, color family White, and
    ip rating IP44''. Existing rules r003 and r007 mandate preliminary queries but
    do not enforce using the actual keys, so the plan-action gap is unaddressed. The
    new rule must ensure the final SQL uses confirmed property keys.'
  source: learn
  status: inactive
- content: Always use the property keys confirmed by the preliminary key retrieval
    query (included as a step in the plan) in the final SQL when filtering product_properties;
    never hardcode key names like 'device_type', 'color_family', or 'ip_rating' without
    validating their presence, and if the expected keys are not among the retrieved
    list, treat the product as non-existent (0 available) and cite all stores with
    zero. Additionally, always include in the plan a step that retrieves all distinct
    property keys for the brand's products (e.g., `SELECT DISTINCT key FROM product_properties
    WHERE sku IN (SELECT sku FROM products WHERE brand = 'AlcaPlast')`) before constructing
    any query that filters product_properties by specific keys when the spec_goal
    involves filtering by product properties (e.g., 'Valve and Connector from AlcaPlast
    ... that has connector type ball valve and diameter 32 mm').
  created: '2026-05-21'
  deactivated_reason: r008 and r009 required validating property keys but did not
    ensure the existence of the product with those key-value combinations, which contributed
    to the empty-result failure when keys existed but no product matched. The new
    rule supersedes both by adding a product existence check.
  id: r009
  reasoning: 'Merged r007 and r008: r007 mandates the preliminary property key retrieval
    step, and r008 mandates using those keys in the final query and forbids hardcoding.
    They cover the same scenario (filtering by product properties) and are complementary
    — the combined rule describes the full procedure from plan to execution.'
  source: learn
  status: inactive
- content: Always include in the plan a step to verify the existence of a product
    matching all specified property key-value combinations (e.g., device_type='terminal
    clamp', color_family='White', ip_rating='IP44') for the given brand/series, after
    confirming that the property keys exist; if no product matches, immediately set
    total to 0 and cite all stores without attempting a complex join. Ensure the final
    SQL action is structured to produce output rows even when no product exists (e.g.,
    by starting from the stores list and left joining to product and inventory).
  created: '2026-05-21'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: ''Empty result: '' (empty-result). The final SQL query used CROSS
    JOIN with target_product CTE; when that CTE returned no rows (no product matched
    the property filters), the entire query returned empty, failing to produce any
    output. The plan included steps to confirm city and property keys (per r003, r008,
    r009), but lacked a step to verify the existence of a product with the exact property
    values (device_type=''terminal clamp'', color_family=''White'', ip_rating=''IP44'').
    The action string: ''... FROM vienna_stores vs LEFT JOIN inventory i ... CROSS
    JOIN target_product tp ...'' fails silently on empty CTE. Existing rules r008/r009
    only covered missing property keys, not missing product when keys exist. New rule
    must mandate a pre-check for product existence or restructure the query to always
    yield rows.'
  source: learn
  status: active
- content: Always output the final message as exactly the format string specified
    in the spec_goal (e.g., '[QTY:%d]') without any additional explanatory text; place
    citations and explanations in the reasoning or grounding_refs fields.
  created: '2026-05-21'
  deactivated_reason: null
  id: r011
  reasoning: 'Verbatim error: ''ANSWER clarification: ... [QTY''. Root cause category:
    wrong-action (answer formatting violated exact format). Failing fragment: the
    message field in ANSWER_OUTPUT includes extra explanatory text (''Across all Vienna
    branches, there are 0 units available today. However, the product record ... was
    not found in the database.'') before the required format string ''[QTY:0]''. Rule
    linkage: new rule will cite spec_goal ''Answer exactly as ''[QTY:%d]'''' and the
    plan step ''Format the final answer as ''[QTY:%d]'' and cite each city store record
    plus the product record'' which allowed ambiguity.'
  source: learn
  status: active
- content: 'Always include in the plan a step after the preliminary city query to
    handle the case where it returns no rows: immediately set total to 0, cite that
    no stores exist in that city (e.g., ''no Vienna stores found''), and produce the
    final answer as [QTY:0] without executing the main product join query. This addresses
    the success_criterion ''All Vienna store IDs are cited as grounding references''
    by omitting store IDs when none exist.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r003, r012'
  id: r012
  reasoning: 'Error: ''Empty result: ''. Root cause: The preliminary SQL query to
    confirm city values returned no rows (no Vienna stores), and the pipeline could
    not produce an answer because the plan lacked a contingency for this case. The
    failing fragment is the spec_goal phrase ''including stores with 0 availability''
    — ambiguous about zero stores — and the success_criterion ''All Vienna store IDs
    are cited as grounding references'' which becomes unsatisfiable when no stores
    exist. The existing rules (r003, r006, r010, r011) do not cover the missing-handling
    of an empty city query. The plan step ''Retrieve distinct city values from stores
    table to confirm ''''Vienna'''' exists.'' was executed, but no step dictated how
    to proceed if the result set is empty.'
  source: learn
  status: inactive
- content: Always include in the plan a preliminary SQL query to retrieve distinct
    city values from the stores table when the spec_goal involves filtering stores
    by a specific city name (e.g., 'Vienna'), to confirm the correct city string before
    forming the final aggregation query. After that preliminary query, if it returns
    no rows, immediately set total to 0, cite that no stores exist in that city (e.g.,
    'no Vienna stores found'), and produce the final answer as [QTY:0] without executing
    the main product join query. Otherwise, proceed with the main product/inventory
    join query.
  created: '2026-05-21'
  deactivated_reason: null
  id: r013
  reasoning: r003 (preliminary city query) and r012 (handle empty city query results)
    are part of the same logical workflow when the spec_goal involves filtering stores
    by city. r012 extends r003 by adding the empty-result branch. Merging removes
    the redundancy of having two separate rules that both must be applied in sequence.
  source: learn
  status: active
