entries:
- content: Always ensure that the action field contains the final query that completes
    all required steps from the plan, specifically including inventory retrieval and
    aggregation when the spec_goal involves summing available_today across stores
    (e.g., 'Determine the total units available today ... across all PowerTool stores
    in Vienna').
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r001
  reasoning: 'Verbatim error: ''The product AlcaPlast Universal Basic 1CT-04J ball
    valve 32mm was identified (SKU PLB-2GPWMO8V). However, no inventory data for Vienna
    branches was retrieved, so the total units available across branches is unknown.''
    Root cause category: wrong-action — the executed action only covered product identification,
    not the required inventory aggregation. Failing fragment citation: plan action
    ''SELECT sku, name, brand, series, model, properties FROM products WHERE brand
    = \''AlcaPlast\'' AND (name LIKE \''%Valve and Connector%\'' OR name LIKE \''%Universal
    Basic 1CT-04J%\'');'' which omits the inventory query. Rule linkage: new rule
    ensures the final action includes all necessary queries from the plan, specifically
    citing spec_goal ''Determine the total units available today for a specific product
    ... across all PowerTool stores in Vienna'' and success_criterion ''Sum available_today
    from inventory''.'
  source: learn
  status: inactive
- content: Always format the action as a complete shell command using the sql tool,
    e.g., `/bin/sql 'WITH product AS ...'`, enclosing the SQL query in single quotes,
    so that the query is passed as stdin when the spec_goal involves aggregating inventory
    across stores (e.g., 'Determine the total units available today across all PowerTool
    stores in Vienna').
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r002
  reasoning: 'Verbatim error: ''Execute exception ["Identify the specific AlcaPlast
    product using product prope"]: exec failed: invalid path: path must be absolute:
    "WITH"''. Root cause category: wrong-action. Failing fragment: the action field
    in both SDD_OUTPUT and PLAN_OUTPUT, which contains the raw SQL query starting
    with ''WITH'' without the required tool invocation. Rule linkage: new rule must
    enforce that the action includes the sql tool command prefix to avoid being treated
    as a file path.'
  source: learn
  status: inactive
- content: Always include in the plan a preliminary SQL query to retrieve the distinct
    city values from the stores table when the spec_goal involves filtering stores
    by a specific city name (e.g., 'Vienna'), to confirm the correct city string before
    forming the final aggregation query.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r003, r012'
  id: r003
  reasoning: 'Verbatim error: ''Empty result''. Root cause category: empty-result
    — the SQL query returned zero rows despite UNION ALL of stores, product, and sum.
    The failing fragment is the action query: ''/bin/sql ''WITH vienna_stores AS (SELECT
    id, name, city FROM stores WHERE city = "Vienna") ...'' . The plan assumed city=''Vienna''
    without verifying the actual city names in the stores table. This leads to an
    empty vienna_stores CTE if the stored city differs (e.g., ''Wien'', ''Vienna,
    Austria''), causing the entire query to return no rows. Rule linkage: new rule
    targets the spec_goal''s implicit assumption about store city filtering.'
  source: learn
  status: inactive
- content: Always verify the exact property keys in `product_properties` by querying
    distinct keys for the brand's products (e.g., `SELECT DISTINCT key FROM product_properties
    WHERE sku IN (SELECT sku FROM products WHERE brand = 'AlcaPlast')`) before building
    the product identification query when the spec_goal involves filtering by product
    properties (e.g., 'Valve and Connector from AlcaPlast ... that has connector type
    ball valve and diameter 32 mm').
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r004, r005'
  id: r004
  reasoning: 'Verbatim error: ''Empty result: '' (no rows returned). Root cause category:
    wrong-key. The action performed a product identification query joining `products`
    and `product_properties` with keys ''connector_type'' and ''diameter_mm''. The
    spec_goal specifies ''connector type ball valve'', but the actual key in `product_properties`
    may use a different naming (e.g., ''connector type'', ''connector-type'', or not
    exist). The query returned empty because the property key mismatch. Failing fragment:
    action `/bin/sql ''SELECT p.sku, p.name, p.brand FROM products p JOIN product_properties
    pp1 ON p.sku = pp1.sku AND pp1.key = "connector_type" ...''`. Rule linkage: New
    rule must cite the spec_goal phrase ''Valve and Connector ... that has connector
    type ball valve and diameter 32 mm'' to ensure property keys are verified before
    building the join.'
  source: learn
  status: inactive
- content: Always include in the plan a step that retrieves all distinct property
