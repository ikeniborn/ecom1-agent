entries:
- agents_md_anchor: null
  content: When a required ref is a record_path from a query, always include a decision
    branch that checks if the query returned any rows; if empty, produce an error
    outcome to avoid unresolved refs.
  created: '2026-06-21'
  deactivated_reason: This rule can produce outcomes not in the allowed outcome_space,
    causing verify failures.
  id: r001
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product_variant.record_path'']
    on OK answer. Root cause: The PlanIR used ''first'' and ''get'' on $inventory_rows
    to extract product_variant.record_path, but the SQL query returned no rows because
    the product SKU was not found. The compute step did not set the ref, leaving it
    unresolved. The PlanIR lacked a decision branch to handle an empty rowset, so
    it attempted to produce an OK answer without the required record_path. The rule
    ensures that any required ref derived from a query is guarded by an emptiness
    check, branching to an error outcome when data is missing.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never include a decision branch that produces an outcome not listed in
    the outcome_space.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The plan's decision branch produced OUTCOME_NONE_CLARIFICATION, which
    is not in the allowed outcome_space ['OUTCOME_OK']. The existing rule 'When a
    required ref is a record_path from a query, always include a decision branch that
    checks if the query returned any rows; if empty, produce an error outcome to avoid
    unresolved refs.' caused this branch. The product SKU method returned no SKU,
    so product_record_path was empty, triggering the error outcome. The plan must
    only produce allowed outcomes. Additionally, the product SKU method may have failed
    because the pre-phase did not deep-read the necessary tables; requesting deep-read
    of product_variants, product_kinds, and product_variant_properties will help the
    next run find the product.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include all required refs in the answer's refs list, mapping each
    required ref to a computed variable that holds the record_path or value.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The interpret error 'unresolved required ref(s) ["$product_variant.record_path"]'
    occurred because the answer block's refs list was empty, while the intent required
    $product_variant.record_path and $vienna_stores_record_paths. The PlanIR computed
    product_variant as a row but never extracted its record_path field, and never
    included any refs in the answer. The rule ensures that every required ref is explicitly
    provided in the answer's refs list.
  status: inactive
  surface: ir
