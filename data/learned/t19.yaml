- agents_md_anchor: null
  content: Always use 'first' with a single sequence argument; to extract a field
    from the first row, apply 'first' then 'column'.
  created: '2026-06-22'
  deactivated_reason: r006 incorrectly advises using 'column' after 'first' to extract
    a field from a single row; the correct primitive is 'get'.
  id: r006
  reasoning: 'interpret: compute step ''first'' failed: <lambda>() takes 1 positional
    argument but 2 were given CONTRACT: first(seq). The PlanIR compute step {"prim":"first","args":["$inventory_rows","product_record_path"],"into":"product.record_path"}
    incorrectly passes two arguments to the ''first'' primitive, which expects only
    one (a sequence). Root cause: misunderstanding of primitive contract. Failing
    PlanIR fragment: compute step for ''first''. Rule linkage: corrects usage of ''first''
    primitive.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always define rowsets to parse RPC outputs into sequences before using
    compute primitives like first, column, etc.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The compute step 'first' failed with 'ExecResponse object is not subscriptable'
    because it received the raw ExecResponse from the SQL RPC instead of a sequence.
    The PlanIR omitted rowsets definitions that would parse the stdout into a rowset.
    The fix is to add rowsets that convert RPC outputs into sequences, then apply
    'first' to the resulting rowset.
  status: inactive
  surface: ir
