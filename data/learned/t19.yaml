- agents_md_anchor: null
  content: Always separate the 'into' variable from the 'args' list in compute steps;
    'args' must contain only the primitive's positional arguments.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: ''interpret: compute step ''get'' failed: <lambda>() takes 2
    positional arguments but 3 were given CONTRACT: get(obj, key)''. The failing PlanIR
    compute step was: {"prim":"get","args":["$product_total_row","0","total"],"into":"total"}.
    The ''into'' variable ''total'' was incorrectly placed inside the ''args'' array,
    causing the interpreter to pass three arguments to the get primitive. The correct
    structure should have args: ["$product_total_row","0"] and into: "total".'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never design a PlanIR that requires a nonempty ref from a query that may
    return no rows, unless the outcome_space includes a fallback outcome for missing
    data.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: The PlanIR's required ref $product_record_path depended on a product
    query that returned no rows, causing the 'first' primitive to fail and the variable
    to be undefined, leading to an unresolved ref error. The outcome_space only contained
    OUTCOME_OK, so there was no way to handle the missing product gracefully. The
    rule prevents such fragile dependencies.
  status: inactive
  surface: ir
