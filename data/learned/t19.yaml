- agents_md_anchor: null
  content: When parsing /bin/sql stdout into rows, split on the actual output delimiter
    — comma-separated CSV with a header line — never an assumed pipe '|'; a wrong
    delimiter collapses each line into one cell, fails the column-count guard, and
    drops path columns so runtime refs come up empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "template/constraints require runtime refs ([''$product.product_path'',
    ''$rows[*].store_path'']) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column". Root
    cause: NOT empty SQL — OBSERVED_RPC_OUTPUTS show all three queries returned rows
    with paths (product_path /proc/catalog/.../SFE-57W1EN82.json, store paths, total
    7). The failing fragment is _rows(): `out.append([c.strip() for c in line.split("|")])`.
    /bin/sql emits comma-delimited CSV (header `store_id,store_path,...`), but code
    splits on ''|''. Result: each line becomes one cell. Then `if len(cells) < 5:
    continue` drops every store row → available_store_paths empty; product loop checks
    `c.startswith(''/'')` on the single cell `SFE-57W1EN82,/proc/...` which starts
    with ''SFE'' → product_path stays ''''. So refs=[] even though total=7 parsed
    (single-cell ''7'' coincidentally int-castable). Rule linkage: corrective rule
    fixes the delimiter assumption that severed path extraction.'
  status: active
- agents_md_anchor: '#important-things > references'
  content: When a discovery query must resolve required runtime refs and its result
    is CROSS JOINed into the ops query, verify it returned at least one data row before
    proceeding — a zero-row CTE annihilates the CROSS JOIN to empty, so short-circuit
    to a not-found/failure outcome instead of emitting OUTCOME_OK with empty refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$store_paths'', ''$product_path'']) but actual refs [] contain only static
    template entries []". Root cause: /bin/id discovery returned `user: anonymous,
    roles: GUEST`; the product-resolution SQL returned header-only `product_sku,record_path,product_name`
    with zero data rows, so the prod CTE was empty and the ops query''s `CROSS JOIN
    prod` annihilated to empty (`store_id,store_path,product_path,available_today,total_available`
    header only). Failing fragment: `return vm.answer(message=..., outcome="OUTCOME_OK",
    refs=refs)` with refs=[] — no guard checks that discovery resolved exactly one
    variant before building the answer, and the fetched `identity` result is never
    used. Parsing is correct (csv.reader, per r001), so this is genuinely a zero-row
    result, not a delimiter drop. New rule adds a zero-row / empty-CTE guard before
    emitting success, complementary to r001 (which covers delimiter parsing).'
  status: active
