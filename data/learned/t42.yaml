- agents_md_anchor: '#compute'
  content: Use 'get' to extract a field from a single row; 'column' is only for lists
    of rows.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'ERROR: interpret: compute step ''column'' failed: ''column'' expects
    list[dict]; use ''get'' for a single row. Root cause: PlanIR used ''first'' to
    obtain a single row from $basket_rows, then applied ''column'' to that single
    dict to extract ''max_discount_percent''. ''column'' requires a list of dicts;
    ''get'' is the correct primitive for a single row. Failing fragment: {"prim":"column","args":["$basket_row","max_discount_percent"],"into":"discount_percent"}.'
  status: inactive
  surface: ir
