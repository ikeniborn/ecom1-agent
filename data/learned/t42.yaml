  content: When a required answer ref of kind 'record_path' cannot be resolved from a rowset, construct
    its path from the known entity identifier using the 'literal' primitive and a predictable pattern
    (e.g., '/proc/{entity_type}/{entity_id}.json').
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/baskets/basket_076.json''''.
    The PlanIR''s OK branch included a record_path ref with source ''$basket_record_path'', but the path
    was null because the SQL query in discovery did not return a record_path column or the rowset extraction
    failed. The required ref path must be concrete; when the source record path is unavailable, it should
    be constructed from the known basket_id parameter.'
  status: active
