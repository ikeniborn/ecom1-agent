- agents_md_anchor: null
  content: Always wrap each discovery RPC whose argument is derived from an upstream
    binding (especially Read/Exec on a path bound from a Find/Search result) in error
    handling so a runtime 'not found'/failed-read degrades to an empty result instead
    of raising and aborting the script before the planned ops and terminal Answer;
    never fabricate a hardcoded literal path to substitute for an unresolved or empty
    Find/Search binding.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: not found''. Observed:
    /bin/id -> emp_048; Tree /docs -> empty; Find /docs name=discount -> empty (no
    matches). Root cause: Find returned zero matches, so `policy_paths` was empty
    and the code fell back to a fabricated literal `discount_policy_path = policy_paths[0]
    if policy_paths else ''/docs/discount_policy.md''`. The very next line `discount_policy
    = vm.read(path=discount_policy_path, number=True)` then read that nonexistent
    guessed path, raising ''read failed: not found'' which propagated unhandled and
    aborted run() before the SQL context, the /bin/discount op, and vm.answer ever
    executed. Failing fragments: the `else ''/docs/discount_policy.md''` fallback
    and the unguarded `vm.read(path=discount_policy_path)`. Linkage: r001/r002 ensure
    all planned RPCs are issued but assume each returns; they do not cover a discovery
    call that throws on a fabricated/empty-binding argument. This new rule adds the
    missing technique — guard derived-argument RPCs and never substitute a literal
    for an empty binding — so the script survives to reach ops and Answer.'
  status: active
