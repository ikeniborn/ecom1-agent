- agents_md_anchor: '#important-things > grounding'
  content: When a discovered policy doc has parameter-scoped addenda or amendments
    (a sibling addenda subdirectory or dated supplement keyed to store, reason-code,
    or date), enumerate that directory at runtime and add the addendum whose path
    or content matches the task's runtime parameters to the Answer refs; do not ground
    only on the base policy document.
  created: '2026-06-07'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/discounts/addenda/2021-08-09-powertool-ljubljana-center-service-recovery.md''".
    Root cause: script grounded refs statically on base policies plus basket record
    only and never discovered or cited the store+reason-scoped addendum. The governing
    rule for THIS case lives in an addendum keyed to store (powertool-ljubljana-center)
    and reason (service-recovery) under /docs/discounts/addenda/, not in the base
    /docs/discounts.md. Failing fragment: `refs = ["/docs/security.md", "/docs/discounts.md",
    record_path]` — no addenda enumeration or param-matching. Rule linkage: r004 covers
    following cross-referenced doc paths cited inside policy text; this rule extends
    grounding to parameter-matched addenda that require enumerating an addenda subdirectory
    and selecting the supplement matching runtime params (store+reason+date). Complementary
    to r004, not a superset, so no deactivation.'
  status: active
