- agents_md_anchor: null
  content: When a required answer ref of kind 'record_path' cannot be resolved from
    a rowset, construct its path from the known entity identifier using the 'literal'
    primitive and a predictable pattern (e.g., '/proc/{entity_type}/{entity_id}.json').
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/baskets/basket_076.json''''.
    The PlanIR''s OK branch included a record_path ref with source ''$basket_record_path'',
    but the path was null because the SQL query in discovery did not return a record_path
    column or the rowset extraction failed. The required ref path must be concrete;
    when the source record path is unavailable, it should be constructed from the
    known basket_id parameter.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When constructing a decision condition based on identity from /bin/id,
    use the 'roles' field to check for the presence of the 'employee' role using the
    'in' operator (e.g., op:in lhs:$identity.roles rhs:['employee']), rather than
    relying on a 'kind' field which may not be present in the output.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: verify rejected outcome DENIED_SECURITY because no security deny_when
    predicate holds. The plan''s decision used $identity.kind != ''employee'' to trigger
    the guest branch, but the actual /bin/id output (user: emp_050, roles: employee,
    ...) does not contain a ''kind'' field; $identity.kind is undefined, causing the
    condition to evaluate as true (undefined != ''employee'') and incorrectly selecting
    the guest branch. The verify step correctly sees that the actual identity.kind
    (derived from roles) is ''employee'', so the deny_when predicate (ne employee)
    is false, making the outcome spurious. The fix is to use the ''roles'' field with
    an ''in'' operator to determine employee status.'
  status: active
  surface: ir
- agents_md_anchor: '#security.md'
  content: When the TOOL_PLAN's constraints include a deny_when predicate that references
    $_facts.identity.kind, the PLAN must include a discovery step that reads the document
    specified by the constraint's anchor to obtain the identity kind, and use that
    field in the decision condition for the security denial branch, rather than relying
    on /bin/id roles.
  created: '2026-06-24'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). Root cause: The PLAN used a
    decision condition based on /bin/id roles (in_set roles employee) instead of the
    constraint''s deny_when predicate which references $_facts.identity.kind. The
    observed /bin/id output includes the employee role, so the roles-based condition
    would be false, but the PLAN still declared a denied_security branch. The PLAN
    also failed to read the required ref /docs/security.md (the constraint''s anchor)
    which would provide the identity.kind field. Additionally, the PLAN used an incorrect
    basket_id literal (''basket_076'' instead of the param literal ''basket_062''),
    but that is secondary. The new rule ensures the PLAN reads the security document
    and uses identity.kind, aligning with the constraint and preventing spurious over-refusal.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Do not use the ''literal'' primitive to hardcode identity kind when the
    TOOL_PLAN''s constraints reference $_facts.identity.kind; instead, reference the
    fact directly in the decision condition (e.g., lhs: ''$_facts.identity.kind'')
    or, if the fact is unavailable, read the identity from the document specified
    by the constraint''s anchor and use that field in the condition.'
  created: '2026-06-24'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: ''interpret: compute step ''literal'' failed: ''literal''''.
    The PlanIR compute step used {''prim'':''literal'',''args'':[''guest'']} to set
    identity_kind. The interpreter likely expects a single value, not a list, causing
    the failure. More fundamentally, the PlanIR hardcodes ''guest'' instead of using
    the fact $_facts.identity.kind from the environment or the security doc content.
    The existing in-session rule about reading the document to obtain identity kind
    was not followed (doc read but not used). This rule corrects the PlanIR shape
    by forbidding literal hardcoding and directing use of the fact or document field.'
  status: active
  surface: ir
