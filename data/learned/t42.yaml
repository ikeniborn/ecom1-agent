- agents_md_anchor: '#important-things > policy-grounding'
  content: When grounding an Answer on a policy document discovered via Find/Read,
    scan that document's content for cross-referenced doc paths (e.g. a security or
    RBAC policy cited inside the discount policy) and add every such referenced path
    to the Answer refs; do not rely on the single primary policy path matched by Find,
    and never hardcode a literal companion doc path — extract it from the policy text
    so grounding covers all governing documents.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/security.md''".
    Root cause: tool_plan discovers only the discount policy via Find(name=''discount'')
    and the policy-grounding constraint is satisfied by that one path, but the discount
    policy text cross-references /docs/security.md (the RBAC/security policy governing
    discount_manager scoping), which the grader requires as a grounding ref. Failing
    fragment: refs assembly `refs.append(discount_policy_path); refs.append(''/docs/security.md'')`
    — the script only learned to include security.md by hardcoding a literal path,
    which is brittle and task-specific rather than derived from the discovered policy
    content. CODEGEN technique: parse the read policy_text for referenced doc paths
    and append them to refs, so all governing policy documents are grounded regardless
    of which single file Find matched. Distinct from r001/r002/r003 (RPC-multiset
    fidelity and binding error-handling); this addresses Answer reference completeness
    from cross-referenced policy docs.'
  status: active
