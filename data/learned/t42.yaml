- agents_md_anchor: null
  content: When constructing the answer object, always place the 'refs' field at the top level of the
    answer, not inside individual answer branches, and populate it with all required references for the
    outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: ''grader: answer missing required reference ''/docs/security.md''''. The PlanIR placed
    refs inside each answer branch (denied_security and ok), but the interpreter only emitted the message
    and outcome from the selected branch, omitting the nested refs. The required refs for OUTCOME_DENIED_SECURITY
    include /docs/security.md, so the answer was missing it. Moving refs to the top-level answer object
    ensures the interpreter includes them.'
  status: active
  surface: ir
- agents_md_anchor: '#compute'
  content: Use the 'literal' primitive to create a constant list of values; never use 'concat' for that
    purpose, as 'concat' requires two rowset arguments.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: The compute step 'concat' was called with a single argument (a list containing a string)
    instead of two rowset lists, causing a lambda error. The intent was to set required_roles to a constant
    list, but 'concat' is designed to concatenate two rowset lists. The correct primitive for a constant
    list is 'literal'. The underlying need to extract roles from the delegation policy is a separate concern;
    this rule addresses the immediate misuse of 'concat'.
  status: active
  surface: ir
