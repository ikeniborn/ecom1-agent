  content: Never use the `concat` primitive for string concatenation; `concat` is
    defined for rowset concatenation (list[dict] rows) and expects exactly two arguments.
    For string building, use `str_concat` or `format` primitives instead.
  created: '2026-06-25'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: ''compute step ''concat'' failed: <lambda>() takes 2 positional
    arguments but 3 were given''. Root cause: The PlanIR uses `concat` primitive for
    string concatenation (e.g., `["/proc/payments/","$payment_id",".json"]` with three
    arguments), but `concat` is defined for rowset concatenation (list[dict] rows)
    and expects exactly two arguments. The correct primitive for string concatenation
    is `str_concat` or `format`. The failing fragment is the compute step with `"prim":"concat"`
    and three args. This rule ensures the PLAN phase uses the appropriate primitive
    for string operations.'
  status: active
  surface: ir
