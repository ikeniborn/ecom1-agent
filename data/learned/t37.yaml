- agents_md_anchor: null
  content: Always execute every RPC declared in the tool_plan discovery and ops arrays
    unconditionally, before any result-dependent early return or guard, so the emitted
    RPC multiset matches the plan; never gate a planned RPC behind a truthiness check
    on a value parsed from a prior result (e.g. `vm.read(path) if policy_path else
    None`), and never short-circuit remaining discovery/ops RPCs when an intermediate
    row set is empty — branch on results only after all planned calls have fired.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: `fidelity: ... AssertionError: fidelity drift (RPC multiset)
    expected: [''Answer'', ''Exec'', ''Exec'', ''Exec'', ''Exec'', ''Find'', ''Read'']
    got: [''Answer'', ''Exec'', ''Exec'', ''Find'']`. Plan declares 4 Exec (id, basket
    sql, issuer sql, discount) + 1 Find + 1 Read + 1 Answer. Script emitted only Exec(id),
    Find, Exec(basket sql), Answer. Two drops: (1) Read skipped because `policy_doc
    = vm.read(...) if policy_path else None` — path extraction from Find returned
    empty so the planned Read never fired; (2) issuer Exec and discount Exec skipped
    because `if not basket_rows: return vm.answer(...)` short-circuited the rest of
    the sequence when the basket query returned no rows. Root cause: defensive early-returns
    and truthiness guards suppress planned RPCs, so the executed multiset diverges
    from the frozen tool_plan. Fix linkage: codegen must run the full discovery+ops
    RPC sequence verbatim and defer all result-conditional branching (not-found answers,
    denials) until after every planned call has executed.'
  status: active
