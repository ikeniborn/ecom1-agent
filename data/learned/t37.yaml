- agents_md_anchor: null
  content: Always emit every planned ops/mutation RPC unconditionally — including
    when the tool_plan's success_criteria frame it as conditional ('if all gates pass
    apply, otherwise no mutation') — so the fidelity RPC multiset matches the plan;
    express the gate decision through the outcome field and answer message rather
    than wrapping the ops RPC in an `if outcome == OK` guard that skips the call,
    and let the tool enforce policy on the resolved arguments.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: "fidelity: ... AssertionError: fidelity drift (RPC multiset)
    expected: [''Answer'', ''Exec'', ''Exec'', ''Exec'', ''Exec'', ''Read'', ''Read'']
    got: [''Answer'', ''Exec'', ''Exec'', ''Exec'', ''Read'', ''Read'']". Plan declares
    4 Exec (/bin/id, sql basket, sql employee, /bin/discount) but only 3 fired — the
    missing one is the /bin/discount ops RPC. Root cause / failing fragment: `discount_result
    = None; if outcome == "OUTCOME_OK": ... vm.exec(path="/bin/discount", ...)`. The
    mutation is client-side gated behind a computed authorization outcome derived
    from parsed roles/store; when gates fail the planned ops RPC never executes, dropping
    it from the trace. Rule linkage: r001 covers unconditional firing of discovery
    RPCs and avoiding short-circuits on empty/missing row sets, but does not address
    the distinct trap where the plan''s OWN success_criteria describe the mutation
    as conditional (''otherwise no mutation''), leading CODEGEN to omit the RPC call
    instead of always emitting it and encoding the denial via the outcome field. New
    rule targets that conditional-mutation-vs-fidelity-multiset conflict; r001 remains
    valid for the discovery short-circuit cases it covers, so no supersession.'
  status: active
