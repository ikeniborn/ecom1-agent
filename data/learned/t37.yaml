- agents_md_anchor: null
  content: 'When using a compute step with prim ''get'', args must be a list of exactly
    two elements: the source object and the key to extract.'
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: ''interpret: compute step ''get'' failed: <lambda>() missing
    1 required positional argument: ''key''''. Root cause: the ''get'' primitive expects
    two arguments (obj, key) but the PlanIR provided only a single string ''$basket_rows.0.record_path''
    as args. The failing fragment: {"prim":"get","args":["$basket_rows.0.record_path"],"into":"basket_record_path"}.
    The rule ensures args is a list of two elements, e.g., ["$basket_rows.0", "record_path"],
    matching the lambda signature.'
  status: inactive
  surface: ir
- agents_md_anchor: '#discount-application'
  content: When the TOOL_PLAN includes security constraints with deny_when predicates,
    the decision branches must include a branch for each deny condition that maps
    to the deny outcome, and the default branch must be the allow outcome (OUTCOME_OK)
    unless a deny condition is met.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Error: verify I3: outcome DENIED_SECURITY but no declared security deny_when
    predicate holds. Observed identity is employee with non-null employee_id, so both
    deny conditions (kind != employee, employee_id is null) are false. The PlanIR
    decision has only one branch (deny_security) with conditions that are false, and
    the default_label is also ''deny_security'', causing spurious denial. Root cause:
    the decision structure lacks an allow branch; the default should be the allow
    outcome when no deny condition matches. The failing PlanIR fragment is the decision
    block with default_label set to deny_security. Rule linkage: new rule ensures
    decision branches correctly map security constraints to outcomes.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always match the variable structure in answer ref sources to the required_refs
    source paths: if the source uses dot notation (e.g., ''$basket.record_path''),
    create a variable with the base name (e.g., $basket) that is an object containing
    the referenced field, and reference the exact dot notation path in the answer''s
    ref source.'
  created: '2026-06-24'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''''$basket.record_path'''']
    on OK answer''. The PlanIR''s answer for the allow branch uses source ''$basket_record_path'',
    but the required_refs source is ''$basket.record_path''. The interpreter expects
    a variable named $basket with a field record_path, but no such variable exists.
    The compute step extracts record_path into a flat variable $basket_record_path,
    which does not match the dot notation. The fix is to ensure the variable structure
    aligns with the required_refs source path, e.g., by binding the rowset''s ''into''
    to the base name and extracting the first row into that same variable, then referencing
    ''$basket.record_path'' in the answer.'
  status: active
  surface: ir
