- agents_md_anchor: null
  content: Do not use concat for string concatenation; concat is for merging two rowsets
    (list[dict] rows). Use format or join primitives to build strings.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: ''interpret: compute step ''concat'' failed: <lambda>() takes
    2 positional arguments but 3 were given. CONTRACT: concat(a, b): both args must
    be list[dict] rows (parse Exec output via rowsets first)''. Root cause: PlanIR
    step ''concat'' with args [''/payments/'', ''$payment_id'', ''.json''] attempts
    to concatenate three strings, but concat expects exactly two rowsets. Failing
    fragment: {"prim":"concat","args":["/payments/","$payment_id",".json"],"into":"payment_record_path"}.
    The same misuse occurs in later concat steps for building payment_json and insert_sql.
    Rule: concat is only for merging rowsets; string building must use format or join.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not assume the existence of /proc files for authorization or approval
    status; prefer using parameter values or policy document content.
  created: '2026-06-22'
  deactivated_reason: null
  id: r002
  reasoning: 'The error ''real_vm: read failed: not found'' indicates a Read RPC failed
    because the path does not exist. The PlanIR attempted to read ''/proc/trusted_override''
    and ''/proc/cross_customer_approval'' to obtain authorization and cross-customer
    approval status. These paths are not listed in required_refs and are not guaranteed
    to exist. The instruction explicitly provides ''authorization'': ''verified''
    and ''cross_customer_checkout'': ''approved'' as parameters. The PlanIR should
    have used those parameter values directly in the decision branches instead of
    relying on /proc reads. This rule will prevent similar failures in future cycles.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a required ref specifies a source like '$basket.record_path', ensure
    that the PlanIR compute step creates a variable with that exact name (e.g., into
    '$basket.record_path') and the answer ref uses that variable. Do not invent a
    different variable name.
  created: '2026-06-24'
  deactivated_reason: null
  id: r003
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''''$basket.record_path'''']
    on OK answer''. The PlanIR computes ''basket_record_path'' and references it as
    ''$basket_record_path'' in the answer refs, but the required ref expects ''$basket.record_path''.
    The interpreter cannot resolve the required ref because the variable name does
    not match. The fix is to align the variable name exactly with the required ref
    source.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always order decision branches so that any branch with outcome OUTCOME_DENIED_SECURITY
    appears before any branch with outcome OUTCOME_NONE_UNSUPPORTED or OUTCOME_OK.
  created: '2026-06-24'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree. Root cause: The PlanIR decision
    tree has branches [basket_not_found (OUTCOME_NONE_UNSUPPORTED), customer_mismatch
    (OUTCOME_DENIED_SECURITY), already_checked_out (OUTCOME_DENIED_SECURITY)] with
    default ok (OUTCOME_OK). The DENIED_SECURITY branches (customer_mismatch, already_checked_out)
    appear after the non-DENIED branch (basket_not_found), violating the security-first
    ordering rule. The interpreter enforces that all DENIED_SECURITY outcomes must
    be evaluated before any non-DENIED outcomes to prevent information leakage. The
    fix is to reorder branches so that customer_mismatch and already_checked_out come
    before basket_not_found. No existing rule covers this structural requirement.'
  status: active
  surface: ir
