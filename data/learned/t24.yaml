entries:
- agents_md_anchor: null
  content: 'Always use structured PredExpr objects (e.g., {"ref": "$ref_name"}) for
    ref arguments in decision branches, never bare strings.'
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: plan validation failed with ''Input should be a valid dictionary
    or instance of PredExpr'' for args.0.args.0 and args.1.args.0, which received
    bare strings ''$basket'' and ''$customer''. Root cause: the PlanIR generator emitted
    raw ref strings where the schema expects a PredExpr dict (e.g., {"ref": "$basket"}).
    The failing PlanIR fragment likely had "when": {"args": [{"args": ["$basket"]},
    ...]}. This rule ensures the PLAN phase always wraps refs in proper PredExpr objects,
    preventing validation errors.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always guard the 'first' primitive by first checking that the rowset is
    nonempty using a compute step with prim 'nonempty', and branch accordingly to
    handle missing data before calling 'first'.
  created: '2026-06-24'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: interpret: compute step ''first'' failed: 0. The ''first'' primitive
    was called on an empty sequence. The PlanIR attempts to extract the first row
    from basket_rows without verifying that the SQL query returned any rows. The decision
    branch later checks nonempty of $basket.record_path, but that variable is only
    set after the failed compute step. The plan should have a guard: check nonempty
    of basket_rows before calling first, and branch to a missing-basket path if empty.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always extract the rows from an ExecResponse using the 'rows' primitive
    before applying row-level primitives such as 'first' or 'column'.
  created: '2026-06-24'
  deactivated_reason: null
  id: r003
  reasoning: 'Error: ''ExecResponse'' object is not subscriptable when applying ''first''
    to $basket_rows, $customer_rows, $inventory_check_rows. Root cause: PlanIR assumes
    Exec RPC returns a list of rows, but the actual response is an ExecResponse object.
    The ''first'' primitive expects a list, not an object. Failing PlanIR fragment:
    compute steps using ''first'' on Exec RPC bindings. Rule linkage: This rule ensures
    rows are extracted before row-level operations, preventing the type mismatch.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never read a file that is not listed in the plan's required_refs or constraints;
    only read files that are guaranteed to exist or are explicitly required.
  created: '2026-06-24'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: real_vm: read failed: not found. The PlanIR includes a read for
    /docs/security.md which is not in required_refs (only /docs/checkout.md is required).
    This file likely does not exist, causing the read failure. The plan should only
    read files that are necessary and known to exist. The decision branch checks for
    nonempty data after reads, but the read failure itself is unhandled. The rule
    prevents unnecessary reads that can cause VM errors.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include a decision branch that allows the main outcome when the
    identity kind does not match the deny_when condition, and set the default label
    to the deny outcome only when the identity kind matches the deny condition; do
    not default to deny for all identity kinds.
  created: '2026-06-25'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). Root cause: The PlanIR decision
    only has a branch for identity_kind == ''guest'' leading to deny, and the default
    label is also ''deny_security''. Since /bin/id returned ''customer'', the plan
    incorrectly defaulted to deny. The security constraint only denies guests, so
    the plan should have allowed the main outcome for ''customer'' and only denied
    when identity_kind is ''guest''. The failing fragment: ''decision'': {''branches'':
    [{''when'': {''op'': ''eq'', ''lhs'': ''$identity_kind'', ''rhs'': ''guest'',
    ''args'': []}, ''label'': ''deny_security''}], ''default_label'': ''deny_security''}.
    This rule ensures the decision logic correctly reflects the constraint''s deny
    scope.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always use the 'get' primitive to extract a field from a single row (obtained
    via 'first'), not the 'column' primitive which expects a list of dicts.
  created: '2026-06-25'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: ''interpret: compute step column failed: column expects list[dict];
    use get for a single row''. Root cause: PlanIR uses ''column'' on $basket_row,
    $total_row, $store_row, $time_row — each is a single dict from ''first''. ''column''
    requires a list of dicts; ''get'' is correct for a single row. Failing fragment:
    compute steps like {"prim":"column","args":["$basket_row","store_id"]}. No existing
    rule covers this pattern; r003 addresses extracting rows from ExecResponse, not
    the post-first extraction.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always use the record_path obtained from a database query to read the corresponding
    file, rather than constructing a path from parameters.
  created: '2026-06-25'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: ''real_vm: read failed: not found''. Root cause: The PlanIR hardcodes
    the basket file path ''/baskets/basket_001.json'' instead of using the record_path
    obtained from the SQL query (bound as ''basket_record_path''). The required_refs
    for OUTCOME_OK include a record_path from $result.record_path, indicating the
    file at that path is needed. The hardcoded path likely does not exist, causing
    the read failure. Failing PlanIR fragment: the Read RPC with args {''path'': ''/baskets/basket_001.json''}
    and subsequent compute steps that extract fields from that file. Rule linkage:
    This new rule ensures that when a record_path is available from a query, it is
    used to ground file reads, preventing hardcoded paths that may not exist.'
  status: active
  surface: ir
