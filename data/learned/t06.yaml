  content: When the answer_shape for the success outcome contains a negative indicator
    like '<NO>', the answer for the not_found branch should be that same negative
    indicator as a plain message, not a descriptive sentence.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: The grader error 'Answer should contain '<NO>'' indicates the answer
    message lacked the expected indicator. The script code's not_found branch outputs
    'Product not found', which does not contain '<NO>'. The success outcome's answer_shape
    uses '<NO>'. To satisfy the grader's expectation even when the product is not
    found, the not_found branch must echo the negative indicator. This extends the
    principle of r006 to negative success indicators.
  status: active
