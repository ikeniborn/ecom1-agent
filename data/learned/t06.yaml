- agents_md_anchor: null
  content: When building a discovery step that queries a database table by attribute
    values, always include a prior Exec step to list available tables and a step to
    describe the target table to confirm exact column names before constructing the
    final SELECT query.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'The PlanIR''s SQL query likely failed to find the variant because the
    table name or column names were incorrect, leading to an empty rowset and the
    ''not_found'' branch, which produced an answer without ''<NO>''. The grader error
    ''Answer should contain ''<NO>'''' indicates the answer did not match the required
    pattern. The root cause is insufficient discovery: the PlanIR assumed table ''product_variants''
    and columns ''product_sku'', ''record_path'' without verification. A corrective
    rule to always list tables and describe the target table before querying will
    prevent such mismatches.'
  status: inactive
  surface: ir
