- agents_md_anchor: '#important-things > yes/no token'
  content: When the DesignOutput answer_template specifies a literal verdict token
    such as <YES> or <NO>, emit that exact token from the template in the final answer
    rather than independently recomputing the yes/no decision in CODEGEN; recomputed
    token logic can diverge from the design's verified ground truth and drop the grader-required
    token.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "grader: Answer should contain ''<NO>''". The answer_template
    fixed the verdict as message starting with ''<NO>'' (design''s verified ground
    truth: line lacks both 1000 ml and 5000 ml variants). Root cause: CODEGEN ignored
    the frozen template token and recomputed it dynamically — `token = "<YES>" if
    (have_a and have_b) else "<NO>"` driven by `have_a = any(str(r.get("volume_ml","")).split(".")[0]
    == str(vol_a) for r in matched_volumes_rows)`. The plan''s LIKE ''%line%'' filter
    over-matched sibling rows, so matched_volumes_rows contained both volumes and
    the recomputed token flipped to ''<YES>'', omitting the required ''<NO>''. Failing
    fragment: the `token = "<YES>" if (have_a and have_b)` block plus the hand-built
    `message` that never honors answer_template.message. Linkage: rule forces CODEGEN
    to carry the template''s literal verdict token instead of recomputing, guaranteeing
    the grader-required token survives. Distinct from r001 (CSV delimiter parsing)
    and v001 (a verdict record, not a rule).'
  status: active
