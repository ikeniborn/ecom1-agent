entries:
- content: 'For any "verify catalogue claim" task where task says "if base product
    exists but extra claim is absent, answer <NO> + SKU": (1) Identify the BASE PRODUCT
    using the PRIMARY identifying properties (brand + model/series + main type/property).
    (2) If base product exists but a SECONDARY property claim does not match, that
    IS the answer SKU. (3) Do NOT pick a SKU that matches secondary properties but
    has the wrong primary type. (4) CRITICAL: set message = "<NO> EXACT_SKU_ID" (e.g.
    "<NO> FST-VBCWS2XQ"). NEVER leave message empty — the harness checks that message
    contains the correct SKU. (5) grounding_refs = [path of the identified base product].
    Example: claim "wood screw 8mm 60mm" → base product = type:wood screw + diameter:8mm
    → found FST-X (wood screw 8mm 40mm) → message = "<NO> FST-X" because length 40≠60.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r001
  reasoning: First run OUTCOME_OK but empty message — harness failed "Answer should
    contain SKU". Fix adds explicit message format requirement.
