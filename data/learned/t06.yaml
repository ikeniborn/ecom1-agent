- agents_md_anchor: null
  content: 'Catalogue tasks (existence / claim-verification / count): identify the
    product by its attributes matched NORMALIZED (case- and whitespace-insensitive),
    preferring the real rows in the pre-phase CATALOGUE_CANDIDATES fact over a guessed
    query; ground every positive/identifying answer in the matched record''s record_path;
    produce the answer token/format the instruction asks for; both present and absent
    are OUTCOME_OK (never CLARIFICATION). This is a general method — derive concrete
    SQL/values from THIS run''s facts, never reuse a fixed recipe.'
  created: '2026-06-18'
  deactivated_reason: It prescribes multiple conditional verdict branches that conflict
    with a singleton outcome_space and a hardcoded answer template, causing the planner
    to emit an empty PlanIR.
  id: rc1
  pinned: true
  reasoning: 'General method-not-value rule (reverted from prescriptive prose per
    user directive: execution CONTROL belongs in the harness check-specs + interpreter
    scripts, not in task-prose). Pinned.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always name answer-branch fields to match the exact key the success_criteria
    reads — when a criterion tests `$answer.msg` for nonempty, every answer branch
    must emit the key `msg` (not `message`/`text`/`answer`), so the populated string
    resolves instead of a missing field that reads as empty.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r005
  reasoning: 'Verbatim error: `verify: success_criteria[OUTCOME_OK][0] failed: {''op'':
    ''nonempty'', ''lhs'': ''$answer.msg'', ''rhs'': None, ''args'': []}`. The RPC
    succeeded — row `AUT-EFU34IM8,/proc/catalog/Sonax/AUT-EFU34IM8.json,1,0` → match_count=1,
    len500_num=1, len650_num=0 → decision correctly picks `found_absent` (650 absent).
    So discovery/grounding/branching are all fine. Root cause is a PlanIR answer-shape
    bug: each answer branch emits the message under key `"message"` (e.g. `"found_absent":{"message":"...absent.
    <NO> SKU {checked_sku}",...}`), but success_criteria reads `$answer.msg`. No `msg`
    key exists, so `$answer.msg` resolves empty and the nonempty op fails despite
    a well-formed string being produced. Fix is to align the answer object''s field
    name with the literal path the criterion checks. Note this is independent of rc1
    (which governs the claim-verification flow and branch labels) and adds the missing
    field-naming-alignment technique.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always name each answer-branch text field `message` — the PlanIR schema
    requires the literal key `message` on every answer branch (e.g. found_holds/found_absent/absent);
    a success_criteria accessor like `$answer.msg` is a runtime resolution that maps
    onto that `message` field, so never rename the schema field to match the accessor
    token.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r006
  reasoning: 'Verbatim error: ''plan: PLAN: validation failed: 3 validation errors
    for PlanIR / answer.found_holds.message Field required [type=missing] / answer.found_absent.message
    Field required / answer.absent.message Field required''. The pydantic error input_values
    show each branch carrying only {outcome, refs} (e.g. found branches with refs:[''$base_record_path''],
    absent with refs:[]) and NO `message` key. Root cause: the author followed the
    in-session rule, which directs naming the branch text field `msg` (explicitly
    ''not message'') to mirror the success_criteria accessor `$answer.msg`. But the
    PlanIR structural schema mandates the literal field name `message` on every answer
    branch — these are two different layers: the schema field name is fixed, while
    `$answer.msg` is an accessor that resolves over the `message` field. Naming the
    field `msg` removed the required `message` key, triggering three ''Field required''
    failures. Rule linkage: supersedes the in-session rule (which told the author
    to emit `msg`, the direct cause of this failure) by asserting the schema-mandated
    branch field is `message`; the accessor still resolves correctly against it. Pure
    PlanIR-shape bug, no data grounding gap, so no deep-read.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a success_criteria accessor reads `$answer.<key>` (here `$answer.msg`),
    name every answer-branch text field with that exact key verbatim — the interpreter
    exposes each branch field directly under `$answer` with NO `message`→`msg` aliasing,
    so a branch keyed `message` leaves `$answer.msg` unresolved and the nonempty check
    fails even though discovery succeeded; mirror the accessor token (`msg`) as the
    literal field key on all branches.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r007
  reasoning: 'Verbatim error: verify: success_criteria[OUTCOME_OK][0] failed: {''op'':
    ''nonempty'', ''lhs'': ''$answer.msg'', ''rhs'': None, ''args'': []}. OBSERVED_RPC_OUTPUTS
    prove the whole pipeline grounded correctly: SQL returned product_sku=AUT-EFU34IM8,
    record_path, len500_count=1, len650_count=0; rowsets/compute/decision all resolved
    (base found, len500>=1, len650=0 → found_absent branch). Root cause is purely
    answer-field naming: the failing PlanIR fragment `"answer":{"found_holds":{"message":"..."},"found_absent":{"message":"..."},"absent":{"message":"..."}}`
    emits the text under key `message`, but the criterion reads `$answer.msg`. No
    alias maps message→msg, so `$answer.msg` resolves empty and nonempty fails. This
    exposes a direct contradiction between the two in-session rules: one says ''name
    the field to match the accessor (msg)'', the other says ''always name it message,
    the accessor maps onto it''. This cycle''s failure is empirical proof the message-mapping
    rule is wrong — `message` does NOT satisfy `$answer.msg`. New rule reaffirms the
    accessor-matching side and supersedes the message-only guidance.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always emit the literal schema field `message` on every PlanIR answer branch
    (absent/found_holds/found_absent); the PlanIR schema requires the key `message`,
    and a success_criteria accessor like `$answer.msg` is resolved by the interpreter
    onto that `message` field, so never rename the schema field to mirror the accessor
    token — renaming it to `msg`/`text`/`answer` fails PLAN with `answer.<branch>.message
    Field required`.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r008
  reasoning: 'Verbatim error: `plan: PLAN: validation failed: 3 validation errors
    for PlanIR / answer.absent.message Field required ... answer.found_holds.message
    Field required ... answer.found_absent.message Field required`. Root cause: prior
    cycle followed two contradictory in-session rules that told the planner to rename
    the branch text field to `msg` to mirror the `$answer.msg` accessor; the PlanIR
    schema mandates the literal key `message`, so dropping it triggers required-field
    validation on all three branches (absent, found_holds with refs [''$base.record_path''],
    found_absent with refs [''$base.record_path'']). Failing fragment: each branch
    dict {''outcome'':''OUTCOME_OK'',''refs'':[...]} lacks `message`. Rule linkage:
    the surviving correct in-session rule already states schema requires `message`
    and `$answer.msg` aliases onto it; the two msg-mirroring rules directly contradict
    it and caused the loop, so deactivate them and reaffirm the schema field name.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a success_criteria accessor reads an answer token (here `$answer.msg`)
    that differs from the PlanIR schema's required branch field name `message`, emit
    BOTH keys on every answer branch — keep the schema-required `message` (so PLAN's
    `answer.<branch>.message Field required` check passes) AND add a sibling key named
    exactly like the accessor token (`msg`), both set to the same rendered string;
    branches already carry extra keys (outcome, refs), so additional keys are permitted,
    and the interpreter exposes each branch key directly under `$answer` with no message→msg
    aliasing, letting the nonempty accessor resolve.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r009
  reasoning: 'Verbatim error: "verify: success_criteria[OUTCOME_OK][0] failed: {''op'':
    ''nonempty'', ''lhs'': ''$answer.msg'', ''rhs'': None, ''args'': []}". Discovery
    + decision worked: OBSERVED_RPC_OUTPUTS row AUT-EFU34IM8, len500_count=1, len650_count=0
    → match_count=1, len650_num=0 fails found_holds → default found_absent, whose
    `message` (''...absent. <NO> SKU {checked_sku}'') is non-empty. Root cause is
    a pure field-name mismatch: branches emit key `message` but the criterion reads
    `$answer.msg`; the interpreter exposes branch keys directly under `$answer` with
    NO message→msg aliasing, so `$answer.msg` is unresolved/empty and nonempty fails
    despite a populated `message`. Prior cycles tried renaming the field to `msg`,
    which fails PLAN with `answer.<branch>.message Field required`. The four [in-session]
    rules thrash between these two single-sided fixes (two say rename to `msg`, two
    say keep `message`). Reconciliation: since branches already legally carry extra
    keys (outcome, refs), emit BOTH `message` and `msg` with the same string — PLAN''s
    field-required check and VERIFY''s accessor both pass.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always emit BOTH the schema-required branch field `message` AND a sibling
    field named exactly the success_criteria accessor token (here `msg`) on every
    PlanIR answer branch (absent/found_holds/found_absent), binding both to the SAME
    rendered string — the interpreter exposes branch fields directly under `$answer`
    with NO message→token aliasing, so a `message`-only branch leaves `$answer.msg`
    unresolved and fails the nonempty VERIFY gate, while a token-only branch fails
    the PLAN schema's required-`message` check; dual-keying is the only branch shape
    that clears both PLAN and VERIFY.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r010
  reasoning: 'Verbatim error: verify: success_criteria[OUTCOME_OK][0] failed: {''op'':
    ''nonempty'', ''lhs'': ''$answer.msg'', ''rhs'': None, ''args'': []}. Root cause:
    success_criteria reads `$answer.msg`, but every answer branch in SCRIPT_CODE emits
    only the field `message` (found_holds/found_absent/absent each carry `{"message":
    ...}`). The interpreter does no message→msg aliasing, so `$answer.msg` resolves
    to nothing → empty → nonempty fails, even though discovery succeeded (RPC returned
    AUT-160WP2PB, len500=0, len650=1, i.e. found_absent branch). Failing fragment:
    "answer":{"found_holds":{"message":...},"found_absent":{"message":...},"absent":{"message":...}}
    — no `msg` sibling anywhere. Rule linkage: the existing in-session rule base is
    self-contradictory — some rules mandate `message`-only (PLAN requires `message`,
    renaming fails answer.<branch>.message Field required), others mandate `msg`-only.
    Both single-key shapes fail one gate. The author followed the message-only guidance
    and hit this VERIFY failure. This consolidating rule resolves the contradiction:
    emit both keys so PLAN''s required-`message` check AND VERIFY''s `$answer.msg`
    accessor both pass.'
  status: inactive
  surface: ir
