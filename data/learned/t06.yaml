- agents_md_anchor: '#important-things > references'
  content: When success_criteria require citing the exact checked record and the discovery
    query reduces matches to one row via LIMIT 1 over a heuristic ORDER BY score,
    do not build refs solely from that single winning row; capture every matching
    candidate's record_path (drop the single-row LIMIT or retain all returned rows)
    and emit them all in the answer refs, so a mis-ranked or tie-broken selection
    cannot drop the grader-required reference.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/3M/SFE-2PLXTQAV.json''".
    Root cause: the discovery query matches multiple base products via product_name
    LIKE ''%SecureFit 2CE-B35%'', then collapses to one row with ''ORDER BY (has_lens_yellow
    + has_size_xl) DESC, b.product_sku LIMIT 1''. Failing fragment: ''refs = []; if
    record_path: refs.append(record_path)'' — refs is derived only from the single
    LIMIT-1 winner. The heuristic ranking selected a different base record than the
    grader''s canonical SKU SFE-2PLXTQAV, so its record_path ''/proc/catalog/3M/SFE-2PLXTQAV.json''
    never entered refs. Rule linkage: a CODEGEN technique to preserve all candidate
    record_paths in refs prevents heuristic single-row selection from dropping a required
    reference. Distinct from r001 (CSV delimiter parsing) and r002 (literal verdict
    token emission) — neither addresses single-row ref collapse.'
  status: active
