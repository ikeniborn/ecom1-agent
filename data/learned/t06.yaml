  content: When the answer_shape for the success outcome contains a message skeleton
    with a positive indicator like '<YES>', the answer for the not_found branch should
    be the corresponding negative indicator '<NO>' as a plain message, not a descriptive
    sentence.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: grader: Answer should contain ''<NO>''. The PlanIR''s not_found
    branch answer was ''No product variant matches the given criteria.'' which does
    not contain ''<NO>''. The answer_shape for OUTCOME_OK specifies ''<YES> for SKU
    {sku}'', so the negative counterpart should be ''<NO>''. The failing fragment
    is the answer.not_found.message. This rule ensures the not_found answer mirrors
    the positive skeleton''s indicator.'
  status: active
  surface: ir
