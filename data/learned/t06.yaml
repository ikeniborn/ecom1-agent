entries:
- agents_md_anchor: '#important-tools > sql'
  content: 'When parsing /bin/sql stdout in CODEGEN, treat the output as CSV (comma-delimited
    with a leading header row): skip the header line and split data rows on comma,
    or map columns by header-name index — never split on a pipe ''|'' delimiter, which
    yields a single column and silently drops fields like record_path needed for refs.'
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim ERROR: "answer_refs: template/constraints require runtime refs
    ([''$path'']) but actual refs [] contain only static template entries [] — SQL
    likely returned no rows or row parsing dropped the path column". Root cause: SQL
    did return a row — OBSERVED output is CSV: header `product_sku,record_path,product_name,has_extra_diameter`
    then `PLB-1B0AEUWP,/proc/catalog/Viega/PLB-1B0AEUWP.json,...,0`. Failing fragment:
    `cols = [c.strip() for c in line_txt.split("|")]` splits on pipe, but /bin/sql
    emits comma-separated values with a header row. split(''|'') produced one column
    per line, so first[1] (record_path) was empty, refs stayed []. Also the header
    line was never skipped, so the first parsed ''row'' was column names. Rule linkage:
    codegen must parse /bin/sql stdout with the correct CSV delimiter and header handling
    to extract record_path for refs.'
  status: active
