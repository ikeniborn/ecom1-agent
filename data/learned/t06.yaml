- agents_md_anchor: '#plan-phase-compute-bindings'
  content: When a required ref uses a dotted source path like $row.record_path, always
    bind the parent variable as an object in the compute section using a primitive
    that constructs an object, not a flat variable with a dot in its name. First extract
    the value into a simple variable, then use an object primitive to bind the parent
    variable with the required property.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''$row.record_path'']
    on OK answer''. The PlanIR compute step binds ''first'' result into ''row.record_path'',
    but the interpreter treats the dot as a property accessor and cannot find a variable
    ''row''. The answer ref source ''$row.record_path'' expects a variable ''row''
    with property ''record_path''. The fix is to bind a simple variable for the value,
    then use an object primitive to create ''row'' with that property.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include all fields referenced in success_criteria (e.g., $answer.sku)
    as top-level keys in the answer object for the outcome, bound to the corresponding
    compute variables.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Verification failed because $answer.sku was empty. The PlanIR answer
    for OUTCOME_OK only contained message, outcome, and refs, but the success_criteria
    required a nonempty sku field. The compute section correctly extracted sku from
    the row, but the answer object did not include a sku key. This is a PlanIR shape
    defect: the answer object must explicitly include all fields that success_criteria
    will check, not just those listed in required_refs. The failing fragment is the
    ''found'' answer block lacking a ''sku'' field.'
  status: inactive
  surface: ir
