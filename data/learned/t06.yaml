- agents_md_anchor: null
  content: 'Support-note claim verification ("a note claims we stock X ... cite the
    exact record; if the base product exists but the extra claimed property is absent
    answer <NO> with the checked SKU; if it exists answer <YES> with the SKU"). STEP
    1: find the BASE product by brand + line/series (minimal normalized match, LOWER/TRIM,
    LIKE on a short token); SELECT product_sku + record_path; bind base=first(rows).
    STEP 2: test whether the EXTRA claimed property/variant holds for that base (separate
    predicate). ALWAYS answer OUTCOME_OK (never UNSUPPORTED/CLARIFICATION). Branches:
    base found AND extra holds -> message contains <YES> and the checked SKU; base
    found AND extra absent -> message contains <NO> and the checked SKU; base absent
    -> message contains <NO>. Author refs=[$base.record_path] on every found/base-exists
    branch (conditional grounding; cite the BASE record). INTENT: required_refs[OUTCOME_OK]=[];
    outcome_space=[OUTCOME_OK]. Put the literal SKU string into the message.'
  created: '2026-06-18'
  deactivated_reason: null
  id: rc1
  reasoning: Consolidated authoritative method rule (rule-overload fix, mirrors t01).
    Folds the learnable-INTENT + conditional-grounding levers + family method; replaces
    accumulated ref-shaping rules that caused 5-6 cycle non-convergence -> empty CLARIFICATION.
  status: active
  surface: ir
