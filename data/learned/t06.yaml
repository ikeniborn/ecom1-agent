    arguments. The PlanIR must explicitly construct the message string (verdict literal
    + identifier) and supply it in the Answer RPC args. Separately, the rowset also
    lacked the required broad normalized match predicate on brand and product line,
    but the empty-answer payload is the immediate cause of the real_vm failure.'
