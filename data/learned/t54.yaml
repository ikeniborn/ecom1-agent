- agents_md_anchor: null
  content: When using the concat primitive, both arguments must be list[dict] rowsets,
    not plain strings.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'ERROR: interpret step ''concat'' failed: <lambda>() missing 1 required
    positional argument: ''b''. CONTRACT: concat(a, b): both args must be list[dict]
    rows (parse Exec output via rowsets first). The PlanIR compute step used concat
    with a single string argument ''Guest users cannot modify account information.''
    instead of two list[dict] rowsets. Root cause: concat was misused to build a message
    string; it only combines rowsets. Failing PlanIR fragment: compute step ''concat''
    with args [''Guest users cannot modify account information.''].'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using filter_rows, the predicate must be a list of condition dicts,
    not a single dict. Each condition dict must have 'op', 'lhs', 'rhs', and 'args'
    keys.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'interpret: compute step ''filter_rows'' failed: ''dict'' object has
    no attribute ''op''. The predicate argument to filter_rows was a dict {''op'':''and'',''args'':[...]},
    but the interpreter expects a predicate object with an ''op'' attribute, not a
    raw dict. The correct format is a list of condition dicts, each with ''op'', ''lhs'',
    ''rhs'', ''args''. The failing fragment: filter_rows args: ["$policy_lines", {"op":"and","args":[{"op":"contains_any","lhs":"$row.line","rhs":["guest"]},{"op":"contains_any","lhs":"$row.line","rhs":["modify"]}]}].
    The new rule instructs to use a list of condition dicts.'
  status: inactive
  surface: ir
