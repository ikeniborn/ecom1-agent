- agents_md_anchor: '#security'
  content: When a decision branch condition references a fact field (e.g., identity.kind),
    the PlanIR must include a discovery step that extracts that field from the raw
    output and binds it to the fact variable, ensuring the field is populated before
    evaluation.
  created: '2026-06-24'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). Observed RPC output from /bin/id
    shows ''user: anonymous, roles: GUEST'' but no ''kind'' field. The PlanIR decision
    branch used ''$_facts.identity.kind'' in its when condition, and the branch was
    taken, leading to DENIED_SECURITY. However, the verifier evaluated the security
    constraint''s deny_when predicate (which also references identity.kind) and found
    it did not hold because the fact lacked a ''kind'' field, making the refusal spurious.
    Root cause: the discovery step did not extract a structured ''kind'' field from
    the raw identity output, so the decision branch''s condition was evaluated on
    an unpopulated field, causing a mismatch with the constraint''s predicate. The
    new rule ensures that any fact field used in a security deny_when condition is
    explicitly populated by a discovery step before the decision tree evaluates it.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always parse the stdout of an Exec RPC into a list of rows before using
    the bound variable in a sequence operation (first, last, nth, map, filter).
  created: '2026-06-24'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: interpret: compute step ''first'' failed: ''ExecResponse'' object
    is not subscriptable. Root cause: The discovery step bound the entire ExecResponse
    object to $_customer_rows, but the compute step ''first'' expects a list. The
    PlanIR must include a step to extract and parse the stdout into rows before using
    sequence primitives. This is a PlanIR shape bug.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a decision branch condition checks the identity kind from an Exec
    RPC (e.g., /bin/id), the PlanIR must first extract the stdout field from the ExecResponse,
    then use a string operation (e.g., contains) on that stdout string to test for
    the presence of identity labels (e.g., 'CUSTOMER', 'EMPLOYEE'), rather than attempting
    to access a field named after the identity kind directly on the response object.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "CUSTOMER" field.''
    Root cause: The PlanIR binds the raw ExecResponse to _identity_raw and then uses
    contains_any on that object with [''CUSTOMER'',''EMPLOYEE'']. The ExecResponse
    is a protobuf message with fields like stdout, stderr, exit_code, not a field
    named ''CUSTOMER''. The identity kind is embedded in the stdout string (e.g.,
    ''uid=1001(cust_043) gid=1001(cust_043) groups=1001(cust_043)''). The decision
    branch must first extract the stdout field (e.g., via a compute step or inline
    extraction) and then check for the substring. This rule ensures the PlanIR correctly
    accesses the identity information from the Exec RPC output.'
  status: active
  surface: ir
