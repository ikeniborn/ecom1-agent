- agents_md_anchor: null
  content: When discovering a product by series, use a case-insensitive or substring
    match to avoid zero rows due to minor variations.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The script used a single SQL query with exact series match ('JSP Light
    Sonis 3US-9EL Safety Eyewear'). The grader expected OUTCOME_OK, but the script
    returned OUTCOME_NONE_UNSUPPORTED, indicating the query returned no rows. The
    root cause is likely that the series string in the database differs slightly (e.g.,
    casing, extra spaces), causing the WHERE clause to filter out the product. The
    existing rule r001 advises separating property queries but does not address series
    matching. A flexible match would prevent zero rows.
  status: inactive
  surface: ir
