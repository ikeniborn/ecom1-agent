- agents_md_anchor: null
  content: Never use 'Exec' with '/bin/sql' for SQL queries; always use the 'sql'
    tool, because 'Exec' returns an ExecResponse object that is not a list and cannot
    be used with list primitives like 'first'.
  created: '2026-06-24'
  deactivated_reason: null
  id: r017
  reasoning: The error 'ExecResponse' object is not subscriptable occurs because the
    plan uses 'Exec' with '/bin/sql' to run a SQL query, but the result is an ExecResponse
    object, not a list of rows. The 'first' primitive expects a list. The existing
    rule r016 advises using 'sql' tool instead, but the plan ignored it. This rule
    reinforces that 'sql' must be used to get a list of dicts directly.
  status: active
  surface: ir
