- agents_md_anchor: null
  content: When combining multiple conditions in a decision branch, use the 'all'
    operator with an 'args' list of conditions, not 'and' with null lhs/rhs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'The run produced OUTCOME_NONE_CLARIFICATION instead of the expected
    OUTCOME_OK or OUTCOME_NONE_UNSUPPORTED. The PlanIR decision branch used ''op'':
    ''and'' with ''lhs'': null, ''rhs'': null and an ''args'' list. This is not a
    valid condition structure in PlanIR; the interpreter likely failed to evaluate
    the branch, causing a fallback to the system-level clarification outcome. The
    correct way to require all conditions to be true is the ''all'' operator, which
    accepts an ''args'' list of sub-conditions. The existing rules r001 and r002 address
    discovery patterns and remain valid.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use the concat primitive to build JSON strings; concat merges two
    rowsets (list of dicts). To construct a properties dict for the answer, use a
    'construct' or 'json' compute step with the extracted values.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() takes 2
    positional arguments but 9 were given. CONTRACT: concat(a, b): both args must
    be list[dict] rows. The failing PlanIR fragment is the concat step that attempted
    to concatenate multiple string literals and variable references to build a JSON
    string. Root cause: concat is designed to merge two rowsets, not to assemble strings.
    The plan should instead use a primitive that constructs a dict (e.g., ''construct''
    or ''json'') to produce the properties object required by the success criteria
    ($answer.properties.voltage, etc.). This rule prevents future misuse of concat
    for string building.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the success criteria for an outcome require a specific marker in the
    answer message (e.g., '<NO>'), ensure the answer block's message field explicitly
    includes that marker, not just the outcome label.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The verify step failed because the answer message did not contain ''<NO>''.
    The script''s answer block for ''not_found'' set message to ''Product {$fallback_sku}:
    <NO> OUTCOME_NONE_UNSUPPORTED'', but the interpreter likely used the answer shape
    skeleton ''Product {sku}: {outcome}'' which omitted ''<NO>'', causing the contains_any
    check to fail. The root cause is that the answer block''s message was overridden
    by the skeleton. The rule instructs to explicitly include the required marker
    in the answer block''s message field to satisfy the success criteria.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the intent spec requires a record_path ref for an outcome, the PlanIR
    answer block for that outcome must include a ref of kind 'record_path' sourced
    from the discovered record's path field.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The interpret error 'unresolved required ref(s) ["$answer.record_path"]
    on OK answer' occurred because the PlanIR answer block for the 'found' branch
    had an empty refs list, but the intent spec's success criteria for OUTCOME_OK
    required a record_path ref. The discovery step correctly retrieved the record_path
    from the database, but the answer block failed to map it to the required ref.
    The rule ensures that required refs are explicitly included in the answer block.
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-phase-answer-shape'
  content: When the success criteria for an outcome require a specific marker in the
    answer message (e.g., '<NO>'), ensure the answer_shape's msg_skeleton includes
    that marker, or omit the msg_skeleton entirely and rely on the answer block's
    message field.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'The verify step failed because the final answer message did not contain
    ''<NO>''. The PlanIR answer block for ''unsupported'' had message ''Product {product_sku}:
    <NO>'', but the answer_shape skeleton ''Product {sku}: {outcome}'' overrode it,
    producing ''Product {sku}: OUTCOME_NONE_UNSUPPORTED'' without the required marker.
    The existing in-session rule only addressed the answer block''s message field,
    not the skeleton override. This new rule ensures the skeleton itself carries the
    marker or is omitted so the answer block''s message is used.'
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-phase-rowsets-parsing'
  content: When parsing RPC output that may be a dict (e.g., an SQL error response),
    use rowsets format 'json' with a 'path' to the expected array key, so that a missing
    key yields an empty list instead of passing the dict to filter_rows.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: The interpret error 'dict' object has no attribute 'op' in filter_rows
    indicates that $candidates_rows was a dict, not a list of dicts. This occurred
    because the Exec RPC likely returned an error dict (e.g., table missing or SQL
    syntax error), and the rowsets step with format 'auto_delim' passed that dict
    through unchanged. The PlanIR must ensure that any rowset fed to filter_rows is
    always a list; using format 'json' with an explicit path to the rows array and
    relying on the default empty list when the path is absent would prevent this failure.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the answer_shape includes a msg_skeleton with placeholders (e.g.,
    {sku}), the answer block for each outcome must provide all referenced fields with
    values that satisfy the success criteria, including any required markers like
    '<NO>' for unsupported outcomes.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: verify: success_criteria[OUTCOME_NONE_UNSUPPORTED][0] failed:
    contains_any on $answer.msg with [''<NO>'']. Root cause: The PlanIR answer block
    for ''unsupported'' did not include a ''sku'' field, so the interpreter''s msg_skeleton
    ''Product {sku}: {outcome}'' produced a message without the ''<NO>'' marker (and
    also failed the nonempty sku check). The default_sku ''<NO>'' was available but
    not placed into the answer''s sku field. Failing PlanIR fragment: answer.unsupported
    had only message, outcome, refs; missing ''sku'' field. Rule linkage: existing
    in-session rule about msg_skeleton marker is insufficient because the skeleton
    cannot be changed; the answer block must supply the field.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When extracting a property value that may be missing (e.g., from a LEFT
    JOIN), use a 'coalesce' compute step to provide a default value before performing
    equality checks, to avoid primitive failures on null values.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'The error ''compute step ''eq'' failed: ''eq'''' occurred because the
    eq primitive likely received a null value for voltage (the LEFT JOIN may not have
    found a matching property row). The eq primitive cannot compare null to a string,
    causing the failure. The PlanIR should have used a coalesce step to default nulls
    to an empty string or other sentinel before the eq check.'
  status: inactive
  surface: ir
