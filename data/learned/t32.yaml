- agents_md_anchor: null
  content: When verifying a product with multiple properties, first discover the product
    by brand and name only, then separately query each property to avoid zero rows
    due to missing properties.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The error 'expected outcome OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED'
    indicates the plan returned 'not_found' because the SQL query returned no rows.
    The query used INNER JOINs on adhesive type and color family, so if the product
    exists but lacks either property, the entire query yields zero rows, even if the
    product and wifi property exist. The plan should first find the product SKU by
    brand and name, then check properties independently.
  status: inactive
  surface: ir
