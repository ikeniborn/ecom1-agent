- agents_md_anchor: null
  content: When a discovery step may return no results, use a compute step that checks
    if the result set is empty and, if so, constructs a fallback record using the
    'dict' primitive with placeholder values for all fields required by the success
    criteria, rather than relying on a second discovery step that could also fail.
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION. Root
    cause: The PlanIR''s fallback mechanism used a second discovery step (fallback_raw)
    which likely failed or produced an empty rowset, causing the compute chain (concat
    → first → get) to yield a null product, making the decision evaluation fail and
    triggering a system fallback outcome OUTCOME_NONE_CLARIFICATION. The failing fragment
    is the fallback_raw discovery and the absence of an emptiness check with a direct
    dict construction. Existing rules r012/r014 advise a compute-step fallback, but
    the script used a discovery step instead, violating their intent.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Use the 'sql' tool for SQL queries instead of 'Exec' with a '/bin/sql'
    path, because the 'sql' tool is the standard database interface and 'Exec' may
    not be available or may not find the command.
  created: '2026-06-22'
  deactivated_reason: null
  id: r016
  reasoning: 'The error ''real_vm: runtime tool not found: not found'' indicates a
    tool used in the PlanIR is not available. The PlanIR discovery steps use ''Exec''
    with path ''/bin/sql'' to run SQL queries. Either the ''Exec'' tool or the ''/bin/sql''
    command is not recognized by the runtime. The standard tool for database queries
    is ''sql''. The PlanIR should use ''rpc'': ''sql'' with a ''query'' argument instead.
    This rule prevents the tool-not-found error by directing the PLAN phase to use
    the correct tool.'
  status: active
  surface: ir
