- agents_md_anchor: '#important-tools > sql'
  content: Never default the current/catalog side of a numeric comparison to the document's own recorded
    value for unmatched keys (e.g. cat.get(sku, old_unit_price) as a dict default, or treating a JOIN's
    unmatched rows as if priced from the receipt); when a parsed identifier misses the catalog the per-item
    delta collapses to zero and biases the absolute-difference threshold toward a false within-range token.
    Treat an unmatched lookup as a failure — exclude it, surface it, or zero only the current side — never
    copy the baseline value across.
  created: '2026-06-05'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: "grader: Answer should contain ''<NO>''" — script emitted <YES> (diff <=
    3 EUR) when correct answer was <NO> (diff > 3 EUR). Root cause: catalog lookup for parsed receipt
    SKUs returned no matches, so the JOIN aggregate `SUM(r.qty * pv.price_cents)` came back NULL/empty;
    the loop then failed to parse two numeric totals and dropped into the fallback. Failing fragment:
    `cur_cents = sum(q * cat.get(s, c) for s, q, c in rows)` defaults the current price to the receipt''s
    own old price `c` for every SKU absent from `cat`, plus the SQL JOIN naturally excludes unmatched
    SKUs — both paths force current==old, yielding diff=0 and a false <YES>. This is distinct from r003
    (consistent aggregation basis across both sides): here both sides ARE same-basis, but the current
    side silently inherits baseline values for missing keys. The fallback default-to-baseline masks the
    lookup miss and inverts the threshold token.'
  status: active
