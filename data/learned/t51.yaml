- agents_md_anchor: null
  content: When extracting OCR-noisy receipt SKUs for catalog matching, use a glyph-tolerant
    prefix character class such as [A-Z0-9]{3}-[A-Z0-9]+ (anchored on the leading
    qty position) instead of an alphabetic-only prefix [A-Z]{3}-..., and apply the
    full ambiguous-glyph canonicalization on BOTH the receipt and catalog sides before
    lookup; an over-strict prefix silently drops noisy lines from the parsed line-items
    so that line zeroes the today/current side while the SUBTOTAL-based old total
    still includes it, creating a one-sided gap that inflates the absolute diff and
    flips the threshold token from the correct value to the wrong one.
  created: '2026-06-06'
  deactivated_reason: null
  id: r012
  reasoning: 'Verbatim error: "grader: Answer should contain ''<YES>''" — the script
    emitted <NO> when correct answer was within-threshold <YES>. Root cause: SKU extraction
    regex `sku_re = re.compile(r"\b([A-Z]{3}-[A-Z0-9]+)\b")` requires a clean ALPHABETIC
    3-char prefix. OCR substitutes digits into prefix glyphs (8->B, 0->O, etc.), so
    a noisy line fails `m = sku_re.search(ln)` and is skipped from `line_items` entirely
    (the `if m:` branch never appends it). The downstream canon/fuzzy matching (price_map
    keyed on _canon) never gets a chance because the line was already dropped pre-match.
    Effect: old_ex = receipt SUBTOTAL still counts that line''s value, but today_ex
    omits it -> asymmetric gap -> diff inflated past 3 EUR -> yes_no="<NO>". This
    refines r010 part (4), which explicitly recommends the over-strict token [A-Z]{3}-[A-Z0-9]+;
    the prefix must also tolerate OCR noise. Distinct from r006/r007/r009 (those cover
    unmatched defaults, empty-match, and delimiter parsing) — this is a pre-match
    extraction defect. Not identical to any existing rule, so not skipped.'
  status: active
