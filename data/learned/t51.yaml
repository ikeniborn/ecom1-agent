- agents_md_anchor: null
  content: Never produce a PlanIR that directly returns an unsupported outcome without
    first attempting the required operations; always include discovery steps to attempt
    data retrieval and a decision branch that checks for success or failure.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r019
  reasoning: 'Error: grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION.
    Root cause: The PlanIR contained no discovery steps to attempt reading the receipt
    file or querying the database, and no decision branches to evaluate results. The
    interpreter, having no steps to execute, fell back to a clarification outcome
    instead of either computing the price difference or returning the intended unsupported
    outcome. Failing PlanIR fragment: entire plan with empty discovery, rowsets, compute,
    and decision branches, default_label ''unsupported'' but no branch to trigger
    it. The plan must include at least one discovery step to attempt the operation
    and a branch on its outcome to avoid the interpreter''s clarification fallback.'
  status: inactive
  surface: ir
