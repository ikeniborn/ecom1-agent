    [] — SQL likely returned no rows or row parsing dropped the path column". Root
    cause: vm.list(''/uploads/'') returned empty (OBSERVED: [list {''path'':''/uploads/''}]
    <empty>), so receipt_path fell to the placeholder and the guarded vm.read set
    read_ok=False; the SQL then ran with ''__NONE__'' and returned header-only (no
    rows), so no match. The script DID reach vm.answer and emit a token (r014 satisfied),
    but the failing fragment `refs = [receipt_path] if read_ok else []` produced []
    on the failure branch, so the rendered refs lacked the template''s required runtime
    $ref ($receipt_path) and answer_refs validation failed. The SQL-binding hint in
    the error is a generic heuristic; true cause is the empty-listing → read-fail
    → refs-gated-empty chain. Linkage: extends r014 (guarantees token emission on
    retrieval failure but is silent on refs) and sharpens the compacted ''include
    the receipt path in refs'' by mandating UNCONDITIONAL refs population even when
    retrieval fails, so refs always carries the resolved $ref placeholder value.'
