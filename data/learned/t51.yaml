- agents_md_anchor: null
  content: Always issue every tool_plan.discovery RPC—including a Read whose path is resolved at runtime—even
    when that path cannot be determined from prior results; substitute a best-effort non-directory placeholder
    (the listing's first file entry, or any known regular file) instead of guarding the call as `vm.read(...)
    if path else None`, because conditionally skipping the Read drops it from the fidelity RPC multiset
    and triggers a drift failure.
  created: '2026-06-05'
  deactivated_reason: null
  id: r011
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC multiset) expected:
    [Answer, Exec, Exec, List, Read] got: [Answer, Exec, Exec, List]''. Root cause: the Read RPC was emitted
    conditionally. Failing fragment: `receipt = vm.read(path=receipt_path, number=True) if receipt_path
    else None` — when the /uploads listing yields no resolvable file entry, receipt_path stays '''' and
    the Read call is never issued, so the executed multiset loses one Read. The compacted rule permits
    ''skip the unresolved Read or substitute a known regular file''; this run exercised the skip branch,
    which directly breaks fidelity. New rule strictly tightens that: never skip — always substitute a
    non-directory placeholder so the Read RPC always executes. Distinct from r010 (which only covers the
    2nd/VAT Read fallback, not the first runtime-resolved Read) and not identical to the compacted rule,
    since it removes the permitted skip option.'
  status: active
