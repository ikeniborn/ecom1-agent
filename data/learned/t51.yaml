- agents_md_anchor: null
  content: Always structure the 'answer' field in PlanIR as a list of objects, each
    with a 'label' field matching a decision branch label, not as a dictionary keyed
    by label.
  created: '2026-06-22'
  deactivated_reason: r013 advised using a list for the answer field, which contradicts
    the validator's requirement for a dictionary.
  id: r013
  reasoning: 'The PlanIR''s answer section was a dictionary {"denied": {...}} instead
    of a list. The interpreter could not map the decision label to an outcome, defaulting
    to OUTCOME_NONE_CLARIFICATION. The error ''expected OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''
    confirms the answer structure was invalid. The decision logic also always denies,
    but the immediate failure is the malformed answer.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always structure the 'answer' field in PlanIR as a dictionary mapping decision
    branch labels to answer objects, not as a list.
