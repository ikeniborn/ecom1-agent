- agents_md_anchor: null
  content: When the plan includes a Read RPC for a path obtained from a directory
    listing, do not include a Stat RPC or a decision branch that checks the file type
    after selection, because the Read is executed unconditionally in discovery. Instead,
    ensure the listing filter is correct by using the appropriate field and value
    for file entries (e.g., 'type' == 'file' or 'is_dir' == false). If the listing
    filter is correct, the path is guaranteed to be a file.
  created: '2026-06-24'
  deactivated_reason: null
  id: r031
  reasoning: 'Error: ''real_vm: read failed: is a directory''. The PlanIR includes
    a Read RPC in discovery for a path derived from a directory listing. Despite having
    a Stat RPC and a decision branch checking stat_result.kind != ''file'', the Read
    is executed before the decision, so the Stat check cannot prevent reading a directory.
    The listing filter used ''type'' field, but the path was still a directory, indicating
    the filter field or value is incorrect. Existing in-session rules recommending
    a Stat check and file-type decision branch are misleading because they cannot
    prevent the unconditional Read. The new rule corrects this by omitting the Stat
    RPC and relying on a correct listing filter. A prephase deep-read of /uploads
    will help determine the correct listing structure for future runs.'
  status: active
