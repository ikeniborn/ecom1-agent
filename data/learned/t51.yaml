- agents_md_anchor: '#important-things > references'
  content: Always fill vm.answer(refs=...) with every runtime-resolved path that the
    answer_template declares as a $ref, unconditionally — never gate a $ref entry
    on read success, parse success, or lookup match (use refs=[resolved_path], not
    refs=[resolved_path] if read_ok else []) — because the answer_refs validator rejects
    rendered refs that are empty or contain only static template entries, including
    on the retrieval-failure/negative branch.
