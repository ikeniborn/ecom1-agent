- agents_md_anchor: null
  content: When a security constraint may deny access, the PlanIR must include a decision
    branch for the denial condition, but the default branch must proceed to compute
    all required variables and evaluate the success criteria to produce the correct
    outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The plan's decision tree had a single branch for the denial condition
    and set the default label to 'denied', causing every run to produce OUTCOME_DENIED_SECURITY
    regardless of the actual identity and path. The plan lacked any steps to read
    the receipt, look up prices, compute totals, or check the price difference against
    the success criteria. The root cause is an incomplete decision structure that
    never reaches the computation needed for OUTCOME_OK.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the 'any_true' primitive, always supply a sequence argument
    (e.g., a list of boolean values) to evaluate.
