- agents_md_anchor: null
  content: 'When a planned Read resolves its path at runtime from a possibly-empty
    List/Search result, never fall back to a guessed or hardcoded filename (e.g. ''/uploads/receipt.txt'');
    a nonexistent placeholder raises ''read failed: not found'' and aborts the script
    before vm.answer so no token is emitted. Wrap any runtime-resolved discovery RPC
    (Read/Exec) in try/except, treat the failure as a retrieval failure that takes
    the negative/over-threshold branch, and always fall through to vm.answer so the
    <YES>/<NO> token is still emitted.'
  created: '2026-06-07'
  deactivated_reason: null
  id: r014
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: not found''. OBSERVED_RPC_OUTPUTS
    shows List(''/uploads/'') returned <empty>. Root cause: with an empty listing
    the fallback chain set receipt_path to a hardcoded guess and then read it unconditionally.
