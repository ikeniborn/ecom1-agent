- agents_md_anchor: null
  content: 'When a yes/no threshold compares two aggregates summed over matched line
    items, guard against the degenerate empty-match case: if the catalog/current-price
    lookup returns zero parseable rows (or no receipt key overlaps it), both sums
    collapse to 0 and abs_diff becomes 0, which falsely satisfies any within-threshold
    test and emits the wrong token; treat an empty match set as a retrieval failure
    that takes the over-threshold/negative branch or surfaces the gap, never as a
    within-range zero difference.'
  created: '2026-06-05'
  deactivated_reason: null
  id: r007
  reasoning: 'Verbatim error: "grader: Answer should contain ''<NO>''". Expected NO
    (difference over 2 EUR) but script emitted <YES>. Root cause: the catalog dict
    is built by parsing pipe-split stdout from the /bin/sql current_prices exec; when
    that lookup yields no parseable rows (binding/format mismatch or no overlapping
    SKU), `catalog` stays empty. Failing fragment: `for it in items: if it[''sku'']
    in catalog: old_gross += ...; today_gross += ...` — with empty catalog both `old_gross`
    and `today_gross` remain 0, so `abs_diff = 0`, `within = 0 <= threshold = True`,
    and `yes_no_token = ''<YES>''`. A collapsed-to-zero difference from missing data
    silently passes the within-threshold test. r006 covers per-item baseline defaulting
    and r003 covers consistent aggregation basis, but neither catches the all-empty
    aggregate producing a false zero-difference token, so this is a new technique
    rule rather than a skip.'
  status: active
- agents_md_anchor: null
  content: 'When a planned Read RPC targets a path resolved at runtime from an empty
    Search/List result, never default its placeholder argument to a directory root
    (e.g. read(path=vat_policy_path or "/docs")); reading a directory raises "read
    failed: is a directory" and aborts the whole script before vm.answer, so emit
    no token. Guard the unresolved-path case by skipping that Read (or substituting
    a known regular-file path) while still issuing the other planned RPCs.'
  created: '2026-06-05'
  deactivated_reason: null
  id: r008
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: is a directory''. OBSERVED_RPC_OUTPUTS
    show the receipt Read succeeded and the Search(''/docs'',''(?i)vat|tax'') returned
    <empty>, leaving vat_policy_path = "". Failing fragment: `vat_policy = vm.read(path=vat_policy_path
    or "/docs", number=True)` — the `or "/docs"` fallback feeds a directory to read(),
    which the VM rejects, crashing before vm.answer() and emitting no <YES>/<NO> token.
    Root cause: r001 mandates running every planned RPC with best-effort placeholder
    args including a ''fallback path'', but a directory-root fallback is not a legal
    Read target. New rule refines r001''s placeholder strategy specifically for runtime-resolved
    Read paths: the fallback must be a regular file or the Read must be skipped. It
    complements r001/r002 (still run RPCs, still finalize with vm.answer) rather than
    superseding them, so no deactivation.'
  status: active
