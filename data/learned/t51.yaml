- agents_md_anchor: null
  content: When reading a file located via Find/listing under a named directory, project
    a verified regular-file path into the Read ref and branch on the empty-listing
    case; never pass a bare directory root or an unguarded index ref that can resolve
    to a directory.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Verbatim error: ''real_vm: read failed: is a directory''. Failing PlanIR
    fragment: discovery step {"rpc":"Read","args":{"path":"$receipt_files.0.path"},"bind":"receipt_text"}
    chained off Find(root=/uploads,kind=file,limit=5). Root cause: the path ref $receipt_files.0.path
    did not project a concrete file — it resolved to a directory (the /uploads root
    or an unfiltered entry), so Read was handed a directory and failed before receipt_text
    was ever bound; every downstream ref (receipt_items, matched_products, totals)
    was therefore empty. The PlanIR blindly indexed .0 with no guard that the entry
    is a regular file and no branch for an empty/dir-only listing. Rule linkage: forces
    the PLAN to project a verified file path into the Read ref and guard the listing,
    so the next cycle grounds receipt_text on an actual file. Added /uploads to prephase_deep_read
    so the pre-phase eagerly surfaces the real receipt filename, letting the PlanIR
    reference a concrete file path instead of guessing index .0.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the target file lives under a named upload directory, make discovery
    recursive and add a rowset that filters listing entries to regular files by entry
    kind before projecting the first path into Read; do not trust Find's kind=file
    argument or a bare index ref, since a non-recursive listing can still surface
    a subdirectory at index 0.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Verbatim ERROR: ''real_vm: read failed: is a directory''. Failing PlanIR
    fragment: discovery step Read with path ''$receipt_files.0.path'' fed by Find{root:/uploads,
    kind:file, limit:5}. Root cause: /uploads nests the receipt inside a subdirectory
    (or Find did not honor kind=file), so the non-recursive listing returned a directory
    at index 0; the unguarded index projection ''.0.path'' passed that directory path
    straight to Read, which rejects directories. The in-session rule already bans
    unguarded index refs but the PLAN rationalized that kind=file made the ref safe
    — this rule closes that loophole: kind=file is not a guarantee, so the listing
    must be recursive and explicitly type-filtered to regular files before any path
    is projected into Read. Adds /uploads to prephase deep-read so the pre-phase surfaces
    the actual receipt path next run instead of guessing via index projection.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always invoke the filter_rows primitive with exactly two arguments — the
    rowset ref plus a single predicate/op-spec — and never pass column and value as
    separate positional args (3-arg form); encode an equality filter as one op-spec
    object, or push the row filter into the discovery query or rowset column projection
    so the kind=regular-file selection happens before compute.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Verbatim error: "plan: primitive ''filter_rows'' takes 2 arg(s), plan
    supplies 3". Root cause: PlanIR arity mismatch — the compute step {"prim":"filter_rows","args":["$files","kind","file"],"into":"regular_files"}
    supplies three positional args (rowset, column name, value), but the filter_rows
    primitive signature accepts only two. The author followed the existing in-session
    rule to filter listing entries to regular files by entry kind, but materialized
    it with a 3-arg positional call instead of the supported 2-arg (rowset + predicate)
    form. Pure PlanIR-shape bug — no grounding/data deficiency — so the fix is a plan-construction
    technique on primitive arity: collapse column+value into one predicate/op-spec
    or move the regular-file filter into the discovery SQL/rowset projection. Links
    to and complements the prior ''filter to regular files by entry kind'' rules by
    constraining HOW that filter is expressed; it does not supersede them.'
  status: inactive
  surface: ir
