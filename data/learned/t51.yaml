- agents_md_anchor: null
  content: When using the List RPC to discover a specific file, always include a decision
    branch that checks if the items list is empty; if empty, produce OUTCOME_NONE_UNSUPPORTED,
    otherwise proceed with the computation. Never assume the listing is non-empty.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: The PlanIR's compute step applies 'first' to the items list from List
    /uploads without checking if it's empty. If the directory is empty, 'first' returns
    null, and the subsequent 'get' on null fails, causing the interpreter to produce
    OUTCOME_NONE_CLARIFICATION instead of a valid outcome. The error 'expected OUTCOME_OK,
    got OUTCOME_NONE_CLARIFICATION' indicates a runtime failure before the decision,
    consistent with an empty listing. Additionally, the decision default label is
    'denied', which violates r003 (default must proceed to computation), but that
    would yield OUTCOME_DENIED_SECURITY, not CLARIFICATION. The immediate fix is to
    handle empty discovery results gracefully.
  status: inactive
  surface: ir
