    listing still comes back empty, retry once with the normalized path before treating
    it as a genuine empty directory — a slash-terminated path makes the listing RPC
    return an empty result, which cascades into an unresolved runtime receipt path,
    an IN ('') catalogue query, zero matched rows, an over-threshold guard misfire,
    and an empty refs array that fails answer_refs validation.
