- agents_md_anchor: null
  content: Never add a conditional retry or fallback RPC that duplicates a planned
    call (e.g. re-issuing List with and without a trailing slash when the first returns
    empty); fidelity validation compares the exact RPC multiset against tool_plan,
    so an extra call fails the drift check just as a dropped one does. Instead normalize
    arguments (strip the trailing slash) on the SINGLE planned List call and handle
    an empty listing in-script — fall through to the negative/over-threshold branch
    and still reach vm.answer — without emitting a second RPC of the same kind.
  created: '2026-06-07'
  deactivated_reason: null
  id: r017
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer, Exec, Exec, List, Read, Stat] got: [Answer, Exec,
    Exec, List, List, Read, Stat]''. Root cause: script emits TWO List calls but tool_plan.discovery
    declares ONE. Failing fragment: ''uploads_listing = vm.list(path="/uploads") ...
    if not entries: uploads_listing = vm.list(path="/uploads/")'' — the empty-retry
    guard duplicates the List RPC. Rule linkage: prior r016 explicitly advised ''retry
    once with the normalized path before treating it as a genuine empty directory'',
    which is exactly what produced the extra List. Fidelity validates an EXACT multiset
    (no drop AND no add), so any conditional retry that re-issues a planned RPC breaks
    it. New rule keeps r016''s valid strip-trailing-slash advice on the single call
    but removes the retry that causes drift.'
  status: active
