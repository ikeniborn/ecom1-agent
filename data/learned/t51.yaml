- agents_md_anchor: null
  content: 'Receipt-vs-today ex-VAT comparison. (1) vm.list(''/uploads/'') then vm.read the FILE entry
    (never a directory path). (2) old_ex = receipt SUBTOTAL = SUM over ALL line items of qty*unit (parse
    the printed ''SUB T0TAL'' line; OCR writes 0 for O). (3) today_ex = SUM over EVERY receipt line item
    of qty*catalogue_price_cents/100; catalogue price_cents is EX-VAT so NO division by (1+vat). A line
    item whose SKU is genuinely absent from the catalogue (discontinued) contributes 0 to today_ex (NOT
    its old price, NOT dropped) so its full value enters the diff and forces <NO>. Do NOT restrict the
    OLD side to matched SKUs. (4) Query catalogue with INLINE single-quoted SKU literals IN (''AAA-111'',...),
    NOT :name binds (the /bin/sql tool rejects binds: exit_code 1 ''missing named argument''). Extract
    SKUs only from the SKU column (token [A-Z]{3}-[A-Z0-9]+ right after the leading qty), not from wrapped
    description text or TERM/POS header codes. Receipt SKUs are OCR-noisy: match catalogue EXACTLY first,
    then FUZZY (0/O, 1/I, 5/S, 8/B, 2/Z interchangeable) before treating a SKU as discontinued. (5) diff=abs(today_ex-old_ex);
    <YES> if diff<=3 else <NO>; outcome OUTCOME_OK; refs include the receipt file path.'
  created: '2026-06-05'
  deactivated_reason: null
  id: r010
  reasoning: 'Grader-oracle confirmed: catalogue price_cents is ex-VAT (an unchanged item''s receipt unit
    == price_cents/100 exactly, e.g. 2371==2371); the prior ''restrict both sums to matched'' guidance
    was the bug — it dropped discontinued items from the OLD side, hiding their full-value gap and emitting
    <YES> when the answer was <NO>. Discontinued SKU -> today 0. OCR corrupts receipt SKUs so fuzzy matching
    is required to avoid false ''discontinued''. :name binds fail; inline literals work.'
  status: active
