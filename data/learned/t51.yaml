- agents_md_anchor: null
  content: Always include discovery steps to list a directory and select the target
    file when the intent specifies such a method, and always bind all parameters used
    in Exec steps to outputs of prior discovery steps; never hardcode a file path
    or leave parameters unbound.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r020
  reasoning: 'Error: expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. Root cause:
    The PlanIR hardcoded ''/uploads/receipt_ocr_N1JVzBm3.txt'' instead of listing
    /uploads/ to find the receipt file, and the SQL query used parameter :receipt_data
    which was never bound by any prior step (the custom_extract was defined but not
    integrated into the discovery flow). This caused the query to return nulls, triggering
    the unsupported outcome. The rule enforces proper file discovery and parameter
    binding.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When listing a directory to locate a file, always filter the listing to
    include only entries of type 'file' before selecting an entry to read.
  created: '2026-06-22'
  deactivated_reason: null
  id: r021
  reasoning: 'The real_vm error ''read failed: is a directory'' occurred because the
    PlanIR selected the first entry from the /uploads listing without checking its
    type. The listing likely returned a directory entry first, causing the subsequent
    Read step to fail. The PlanIR must filter directory listings to only files before
    selecting a path to read.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When listing a directory to locate a file, always include a decision branch
    that checks whether the filtered list of file entries is non-empty before attempting
    to read the first file; if the list is empty, branch to an unsupported outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r022
  reasoning: 'Error: ''real_vm: read failed: is a directory''. The PlanIR listed /uploads/,
    filtered for files, but did not verify that the filtered list was non-empty. The
    ''first'' step on an empty list likely returned null, causing ''concat'' to produce
    ''/uploads/'' (a directory) as the read path. The Read RPC then failed because
    it received a directory path. The new rule ensures a check for file existence
    before reading, preventing the directory read attempt.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When filtering a directory listing to select files, always use the field
    that indicates the entry type (commonly 'type' or 'is_dir') and compare to the
    value that represents a file (e.g., 'file' or false). Do not assume the field
    is 'kind'.
  created: '2026-06-22'
  deactivated_reason: null
  id: r023
  reasoning: 'Error: real_vm: read failed: is a directory. Root cause: The filter_rows
    step used ''kind'' as the field to identify files, but the List RPC output likely
    uses a different field (e.g., ''type''), so the filter did not exclude directories.
    The first entry remained a directory, causing receipt_path to be a directory and
    the Read RPC to fail. Failing PlanIR fragment: filter_rows with condition on ''kind''.
    Existing in-session rule about filtering for files was too vague, leading to this
    field-name mistake.'
  status: active
  surface: ir
