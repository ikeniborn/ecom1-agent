- agents_md_anchor: null
  content: When performing a comparison, use a compare step with 'op' field set to
    'eq' or 'neq', not a compute step with 'is' or 'is not' keys.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'PLAN validation error: compute steps 6 and 7 had extra forbidden keys
    ''is'' and ''is not'' in their value fields. The PlanIR schema does not allow
    these keys in compute steps. The correct way to express equality/inequality is
    via a compare step with an ''op'' field (e.g., ''eq'' for equals, ''neq'' for
    not equals). This rule prevents misuse of compute steps for comparisons.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using filter_rows, always define the predicate as a separate compute
    step and reference it by its bind name, never inline a dict with op/lhs/rhs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'Error: interpret: compute step ''filter_rows'' failed: ''dict'' object
    has no attribute ''op''. The filter_rows step in the plan provided a predicate
    as an inline dict {"op":"in_set","lhs":"$row.product_sku","rhs":"$receipt_skus"}.
    The interpreter expects the predicate argument to be a reference to a compute
    step that has an ''op'' attribute, not a raw dict. Root cause: incorrect predicate
    structure. Failing PlanIR fragment: {"prim":"filter_rows","args":["$variants_rows",{"op":"in_set","lhs":"$row.product_sku","rhs":"$receipt_skus"}],"into":"current_prices_rows"}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use a compute step to define a comparison, filter predicate, or conditional.
    Compute steps must only bind a literal value (string, number, boolean) or a reference
    to another step's bind name. For comparisons, use a compare step with 'op' field.
    For filter predicates, reference a compare step's bind name in the filter step.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r017
  reasoning: 'PlanIR validation failed because compute steps contained dicts (e.g.,
    {''op'': ''in_set'', ''lhs'': ''...'', ''rhs'': ''$sku_list''}) and lists (e.g.,
    [{''bool'': True, ''text'': ''...''}]) as their ''value'', which are not permitted.
    The schema expects compute steps to bind simple literals or references, not structured
    predicates or conditionals. The user likely attempted to define filter predicates
    and comparisons as compute steps, violating the intended step types. This rule
    ensures compute steps are used only for literal/reference binding, while compare
    steps handle comparisons and filter steps reference those bind names.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use a compute step to bind a literal value. Use a literal step with
    the 'value' field set to the constant.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r018
  reasoning: The error 'compute.3.value Extra inputs are not permitted' indicates
    that a compute step was given a 'value' field containing the integer 300, which
    is not allowed. The failing PlanIR fragment likely attempted to bind a constant
    number using a compute step. The correct approach is to use a literal step for
    any constant value (string, number, boolean).
  status: inactive
  surface: ir
