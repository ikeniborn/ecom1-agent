- agents_md_anchor: null
  content: When consuming a List/Search RPC result, do not call .get() on it nor chain
    .get('items') or .get('entries') or .get('files') fallbacks, because the directory-listing
    RPC returns the entries array itself (or None/empty when the dir is empty), so
    .get on a list/None raises "'list'/'NoneType' object has no attribute 'get'" and
    aborts the script before vm.answer; normalize with an isinstance(result, list)
    check (iterate the result directly when it is already a list, else subscript the
    single known wrapper key) and never assume the listing is a dict.
  created: '2026-06-07'
  deactivated_reason: null
  id: r013
  reasoning: 'Verbatim ERROR: ''real_vm_exec: get''. OBSERVED_RPC_OUTPUTS shows [list
    {''path'': ''/uploads/''}] <empty> — the directory listing came back empty/non-dict.
    Failing fragment: `listing = vm.list(path=uploads_dir); entries = listing.get(''items'')
    or listing.get(''entries'') or listing.get(''files'') or []`. Root cause: the
    List RPC returns the entries array directly (a list) or None when empty, not a
    dict wrapper, so the very first listing.get(''items'') raises AttributeError (''list''/''NoneType''
    has no attribute ''get'') and crashes before any vm.answer, leaving the response
    empty. Rule linkage: extends the existing dict-subscript access rule, which assumed
    every RPC result is a dict and only warned against dot-attribute; this adds the
    missing case that the List result can itself be a list/None and must be type-checked,
    not .get-unwrapped.'
  status: active
