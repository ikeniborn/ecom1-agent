- agents_md_anchor: null
  content: When listing a directory to discover a file path, filter the list to only
    entries that are files (e.g., by checking the 'type' field if available) before
    selecting a path to read, to avoid attempting to read a directory.
  created: '2026-06-20'
  deactivated_reason: null
  id: r012
  reasoning: 'Error: ''real_vm: read failed: is a directory''. The PlanIR''s discovery
    phase includes a Read RPC on ''$uploads_list.0.path'', which resolved to a directory
    entry from the List RPC. The root cause is that the PlanIR assumed the first entry
    in /uploads/ is a file, but it may be a directory. The failing fragment is the
    Read RPC in discovery. The rule ensures that the PlanIR filters the directory
    listing to only files (e.g., using a rowset filter on type) before selecting a
    path, preventing this runtime failure.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never apply the 'to_number' primitive to a value that is already numeric
    (e.g., the result of 'sum_col', 'abs_diff', or any arithmetic primitive); instead,
    use the numeric value directly without conversion, or if conversion is necessary,
    ensure the input is a string representation of a number.
  created: '2026-06-20'
  deactivated_reason: null
  id: r013
  reasoning: 'The error ''real_vm: bad argument type for built-in operation'' occurred
    during compute. The PlanIR includes a ''to_number'' primitive applied to ''$diff_cents'',
    which is the result of ''abs_diff'' and is already a numeric value. The ''to_number''
    built-in expects a string argument, so passing a number causes a type error. The
    fix is to remove the ''to_number'' step and use ''$diff_cents'' directly in the
    decision condition.'
  status: active
  surface: ir
