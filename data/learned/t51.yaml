- agents_md_anchor: null
  content: When the plan requires locating a file by listing a directory, always include
    a List RPC on that directory, filter the listing to entries of type 'file', select
    the first entry's path, and set the file path variable from that path using a
    'get' primitive on the first row's 'path' field; never hardcode the file path
    or use 'concat' for string concatenation.
  created: '2026-06-24'
  deactivated_reason: null
  id: r030
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. The PlanIR used concat with a single string
    argument, but concat expects two list[dict] arguments for rowset concatenation.
    The plan also hardcoded the file path ''/uploads/receipt_ocr_hLFaevcm.txt'' without
    listing the directory, violating existing rules r021, r022, r023. The root cause
    is a malformed PlanIR that bypasses directory listing and misuses concat. The
    corrective rule ensures proper directory listing, file selection, and correct
    use of primitives.'
  status: active
