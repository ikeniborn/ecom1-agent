- agents_md_anchor: null
  content: When using the filter_rows primitive, supply exactly 2 arguments — the
    rowset ref and a single predicate (one structured condition object such as {column,
    op, value}); never pass column, op, and value as separate positional args, and
    pack any multi-field condition into that one predicate argument.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Verbatim error: "plan: primitive ''filter_rows'' takes 2 arg(s), plan
    supplies 4". Failing PlanIR fragment: {"prim":"filter_rows","args":["$uploads_rows","kind","eq","file"],"into":"regular_files"}.
    Root cause: filter_rows has a 2-arg signature (rowset + one predicate), but the
    plan unpacked the kind==''file'' condition into 4 flat positional args (rowset,
    column, op, value). The arity check rejected it before execution. r008 mandates
    filter_rows with a kind predicate to select regular files but never pinned its
    calling convention, so the planner spread the predicate across positional slots.
    New rule constrains the signature: pack the predicate into a single argument.
    r008 remains valid (overall discovery+filter+first-path shape) and is supplemented,
    not superseded.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never let a discovery-phase RPC (e.g. Read) reference a path ref that is
    only produced by the later rowset/compute stage (List → rowset filter_rows → first
    → get → $receipt_file); all discovery RPCs execute BEFORE rowsets and compute
    run, so the unbound ref falls back to the raw IntentSpec param description string
    and fails path validation. Stage the PlanIR so the directory-listing-and-filter
    pipeline resolves the discovered path ref first, then consume it in a subsequent
    execution stage that runs after the ref is bound.
  created: '2026-06-20'
  deactivated_reason: null
  id: r011
  reasoning: 'Verbatim error: real_vm: read failed: invalid path: path must be absolute:
    "Discovery: list /uploads/, filter to regular files, take the first entry''s path
    (do not hardcode a filename); bind to $receipt_file". Root cause: staging/ordering
    bug. The failing PlanIR fragment places the Read in the discovery array — {"rpc":"Read","args":{"path":"$receipt_file"},"bind":"receipt_content"}
    — but $receipt_file is only produced downstream in compute (filter_rows → first
    → get path). All discovery RPCs run before the rowsets/compute stage, so during
    discovery $receipt_file is unbound and the VM substituted the raw TOOL_PLAN param.receipt_file
    description text, which is not an absolute path. Linkage: r008 already prescribes
    the List→filter→first→Read-ref pattern but does not cover the execution-stage
    dependency; this rule adds the staging constraint that a discovery RPC may not
    consume a compute-derived ref, complementing r008 rather than superseding it.'
  status: active
  surface: ir
