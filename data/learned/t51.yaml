- content: When parsing /bin/sql stdout into the catalog price map, detect the column
    delimiter from the header line (it is comma/CSV, not pipe) and never require or
    split solely on '|'; a hardcoded '|' split skips every comma-delimited row, leaving
    the catalog map empty so no receipt line matches, both net totals collapse to
    0, the degenerate empty-match branch fires (diff=tol+1) and the wrong <YES>/<NO>
    token is emitted. Parse header cols, split each data row on the same delimiter,
    map product_sku -> price_cents.
  created: '2026-06-05'
  id: r009
  reasoning: 'Verdict v004 root cause: t51 codegen split /bin/sql output on ''|''
    and skipped lines lacking ''|''. Runtime emits CSV (comma) with header on line
    1, so the catalog map was empty (message showed catalog total EUR 0.00), no receipt
    SKU matched, items=[] took the degenerate branch (old=0, new=0, diff=tol+1=4.0)
    and emitted <NO> when grader expected <YES>. Mirrors proven t01 r013 / t38 r009
    CSV-parsing fixes. Complements r006/r007 (empty-match guards) by removing the
    empty-match cause.'
  status: active
