- agents_md_anchor: null
  content: Never use the 'concat' primitive to create a string literal; use the 'literal'
    primitive to bind a constant string value.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'The compute step ''concat'' failed with error: <lambda>() missing 1
    required positional argument: ''b''. The concat primitive expects two list[dict]
    row arguments, but the PlanIR supplied only one argument, a string literal ''/uploads/receipt_ocr_5YuPD1B3.txt''.
    The intended use was to set the variable ''receipt_file_path'' to that path string.
    The correct primitive for binding a literal string is ''literal'', not ''concat''.
    This rule prevents future misuse of concat for string literals.'
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-primitives'
  content: 'When using the filter_rows primitive, always provide exactly two arguments:
    the rows (list of dicts) and a predicate function. Do not pass column name and
    set directly; instead, use a predicate-building primitive (e.g., ''in_set_pred'')
    to create the predicate, then pass it as the second argument.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'The interpreter failed on step ''filter_rows'' because it received 4
    arguments: ''$all_variants'', ''product_sku'', ''in_set'', ''$unique_skus''. The
    contract for filter_rows requires exactly 2 arguments: rows and a predicate function.
    The PlanIR incorrectly attempted to specify a column and a set inline. The fix
    is to first build a predicate using a dedicated primitive (e.g., ''in_set_pred'')
    that takes a column name and a set, then pass that predicate to filter_rows. This
    ensures the interpreter receives the correct number of arguments.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the 'literal' primitive to bind a constant string value, always
    provide the string directly as the 'value' field, not inside an 'args' list.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'The error ''interpret: compute step ''literal'' failed: ''literal''''
    occurred because the PlanIR used the ''literal'' primitive with an ''args'' list
    containing the string. The interpreter likely expects the literal value to be
    provided directly as a ''value'' field. The failing PlanIR fragment: {"prim":"literal","args":["/uploads/receipt_ocr_5YuPD1B3.txt"],"into":"receipt_file_path"}.
    The existing rule [in-session] advises using ''literal'' for constant strings
    but does not specify the correct argument structure. This new rule clarifies the
    required format to prevent future failures.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the 'literal' primitive in a compute step, never include a 'value'
    field at the step level; instead, pass the constant string as the sole element
    of the 'args' list.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: The PlanIR validation error 'Extra inputs are not permitted' occurred
    because a compute step included a 'value' field containing the file path string
    '/uploads/receipt_ocr_5YuPD1B3.txt'. The correct PlanIR schema for a literal binding
    requires the constant to be placed inside the 'args' list, not as a top-level
    'value' field. The existing in-session rule incorrectly advised using a 'value'
    field, which directly caused this schema violation.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When constructing a compute step in PlanIR, always include the 'prim' field
    with the primitive name and an 'args' list containing the arguments. Do not use
    'name' or 'input' fields; the step's name is defined by the 'into' field, and
    the input is passed via 'args'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'The PlanIR generation produced a compute step with ''name'' and ''input''
    fields instead of the required ''prim'' and ''args'' fields, causing validation
    errors: ''compute.1.prim Field required'', ''compute.1.name Extra inputs are not
    permitted'', ''compute.1.input Extra inputs are not permitted''. The correct structure
    for a compute step is {''prim'': ''<primitive_name>'', ''args'': [...], ''into'':
    ''<variable_name>''}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the 'literal' primitive to bind a constant string value, always
    provide the string in the 'value' field of the step, not in an 'args' list.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'The PlanIR compute step ''literal'' failed because it used an ''args''
    list to pass the string ''/uploads/receipt_ocr_5YuPD1B3.txt''. The interpreter
    expects the string to be provided via a ''value'' field. The existing in-session
    rule that says ''never include a value field at the step level; instead, pass
    the constant string as the sole element of the args list'' is incorrect and caused
    this failure. The correct format is: {"prim":"literal","value":"/uploads/receipt_ocr_5YuPD1B3.txt","into":"receipt_file_path"}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the 'literal' primitive in a compute step, always provide the
    constant string in the 'value' field of the step, not in an 'args' list.
  created: '2026-06-22'
  deactivated_reason: r012 incorrectly suggests that a compute step can have a 'value'
    field for a literal primitive; the error shows that compute steps do not accept
    a 'value' field. The new rule supersedes it by directing the use of a literal
    step instead.
  id: r012
  reasoning: 'The interpret error ''compute step ''literal'' failed: ''literal''''
    indicates that the literal step format with ''args'' containing the string is
    not accepted by the interpreter. The correct format is to use a ''value'' field
    directly in the step, as per one existing in-session rule. The conflicting in-session
    rule that says to use ''args'' should be deactivated but lacks an ID. The failing
    PlanIR fragment is the literal steps for receipt_file_path and product_variants.record_path.'
  status: inactive
  surface: ir
