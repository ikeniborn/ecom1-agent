  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The PlanIR compute step ''any_true'' was called with no arguments, causing
    the error: ''any_true() missing 1 required positional argument: seq''. The primitive
    requires a sequence to check for any true value. The rule ensures future PlanIRs
    provide the required argument.'
  status: inactive
