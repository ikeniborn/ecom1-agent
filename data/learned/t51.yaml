- agents_md_anchor: null
  content: Always include compute steps to derive all variables referenced in the
    answer template or success criteria.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The PlanIR only performed discovery (Find, Exec, Read) and a security
    decision, but the answer template and success criteria reference $price_difference_abs_cents.
    No compute steps were included to parse the receipt, look up current prices, or
    calculate the difference. The verify step failed because the required variable
    was never computed. The plan must include rowsets/compute to derive price_difference_abs_cents
    from the receipt content and product_variants table.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the List RPC, the result is a ListResponse object; always use
    a 'get' primitive to extract the 'items' list before applying sequence primitives
    like 'first'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The error 'ListResponse object is not subscriptable' occurred because
    the PlanIR applied 'first' directly to the output of a List RPC. The List RPC
    returns a structured object, not a plain list. The root cause is missing extraction
    of the 'items' list. The rule ensures future PlanIRs include a 'get' step to retrieve
    the list before using sequence primitives.
  status: inactive
  surface: ir
