- agents_md_anchor: null
  content: Always define each required ref from the success criteria as a named variable
    in the PlanIR (via bind, into, or compute) using the exact name as specified in
    the success criteria's lhs (e.g., $receipt_file, $receipt_products, $difference_cents).
    Do not substitute alternative names like $receipt_path for a required ref.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The verify failure occurred because the PlanIR produced an answer with
    outcome OUTCOME_OK but the success criteria required nonempty $receipt_file and
    $receipt_products, which were never defined. The plan used $receipt_path instead
    of $receipt_file and did not define $receipt_products. The plan also lacked a
    branch to handle the empty-listing case. The root cause is that the PlanIR did
    not match the required ref names from the IntentSpec, causing the verify step
    to fail. This rule ensures that the plan correctly populates all required refs
    with the exact names expected by the success criteria.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always define each required list ref from the success criteria by including
    a custom_extract step that parses the file and outputs that list variable; when
    using that list in a filter_rows predicate, reference column names as plain strings
    (without $) and the list variable as a variable (with $).
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: ''sum_col'' expects list[dict]; got single row. Root cause: filter_rows
    predicate used ''$sku'' (variable) instead of column name ''sku'', and ''$items.sku''
    was undefined because $items was not defined. The PlanIR also omitted the required
    $receipt_products list ref from success criteria. The fix is to extract the SKU
    list from the receipt via custom_extract and use it in filter_rows with correct
    column name reference.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use 'custom_extract' as a primitive in the compute array; instead,
    define custom extraction logic in the dedicated 'custom_extract' section and rely
    on its automatic binding of the output variable.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: ''plan: unknown primitive ''custom_extract'' (compute -> receipt_parsed)''.
    Root cause: The PlanIR compute array includes a step with prim=''custom_extract'',
    which is not a recognized primitive. The PlanIR schema provides a separate top-level
    ''custom_extract'' section for defining such extractions, and the output variable
    is automatically bound when defined there. The failing fragment is: {"prim":"custom_extract","args":["fuzzy_sku_receipt","$receipt_raw"],"into":"receipt_parsed"}.
    The correct approach is to omit this compute step entirely and let the custom_extract
    section handle the binding. No existing rule covers this pattern.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the plan requires extracting a list of items from a file and then
    computing a total based on current prices from a database, always include a Read
    RPC to get the file content, a custom_extract step to parse the content into the
    required list ref, and then use compute primitives (map/reduce) or a parameterized
    SQL query to compute the total; never skip the file reading step or hardcode placeholder
    values that are not populated from the extracted list.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The verify step failed because required refs $receipt_file and $receipt_products
    were not defined. The PlanIR skipped reading the file and extracting products,
    instead attempting a SQL query with hardcoded placeholders that were never populated.
    The discovery was non-recursive and did not filter to regular files. The compute
    steps referenced $totals_result before it was bound. The plan did not define the
    required refs as specified in the success criteria. This violates the in-session
    rule about defining required refs and the general pattern for file-based data
    extraction.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the TOOL_PLAN's param for a file location instructs to find a file
    in a directory (e.g., 'Find the first regular file in /uploads/ directory'), the
    PlanIR must include a discovery step (Find or List) that produces a rowset of
    entries, filter to regular files using a rowset filter (filter_rows with kind
    predicate), and then use the first entry's path as the Read ref; do not hardcode
    a filename. Additionally, bind the discovered path to the required ref name as
    specified in the success criteria (e.g., $receipt_file).
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Error: ''real_vm: read failed: not found'' because PlanIR hardcoded
    path ''/uploads/receipt.txt'' which does not exist. The TOOL_PLAN param says ''Find
    the first regular file in /uploads/ directory using a directory listing, filter
    to regular files, and read its content.'' The plan skipped discovery and directly
    attempted to read a hardcoded filename. Existing rules r001 and r002 already advise
    using discovery, but the plan ignored them. The plan also fails to define the
    required ref $receipt_file (success criteria requires it). The correct PlanIR
    should include a List RPC on /uploads/, filter entries to regular files, project
    the first path into $receipt_file, then Read $receipt_file. This rule reinforces
    that pattern.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the 'mul' primitive in the compute section; instead, perform
    multiplication by including the arithmetic in a SQL query (e.g., SELECT price_cents
    * ?) or by using a supported primitive if available.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: unknown primitive ''mul''. The PlanIR used ''mul'' to multiply
    $qty and $current_price_cents, but the system does not support this primitive.
    The correct approach is to compute products within a SQL query, which supports
    arithmetic operations. This rule prevents reliance on unsupported compute primitives
    and ensures multiplication is handled by the database.'
  status: inactive
  surface: ir
