- agents_md_anchor: null
  content: When the answer_shape contains a placeholder for a claim status, and the
    grader expects a specific token (like '<YES>' or '<NO>'), the answer message should
    use that token verbatim, not a descriptive phrase.
  created: '2026-06-22'
  deactivated_reason: r005 did not specify overriding the answer_shape when the grader's
    expected token conflicts; new rule supersedes it.
  id: r005
  reasoning: 'Error: grader: Answer should contain ''<NO>''. The PlanIR''s ''no_115''
    branch answer message was ''Checked SKU {sku}: 115mm disc diameter not found'',
    which lacks the required ''<NO>'' token. The answer_shape template is ''Checked
    SKU {sku}: {claim_status}'', so the claim_status placeholder should be filled
    with the exact token the grader expects (here ''<NO>'') rather than a human-readable
    description.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always design the discovery step to guarantee at least one candidate record
    is found when the task requires a record for all possible outcomes; use fallback
    queries with broader matching if the primary query returns empty.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'verify: success_criteria[OUTCOME_CLAIM_ABSENT][0] failed: {''op'': ''nonempty'',
    ''lhs'': ''$answer.sku'', ''rhs'': None, ''args'': []}. Root cause: SQL discovery
    query returned no rows (observed RPC output empty), causing compute step ''sku''
    to be empty, which violated the nonempty requirement for OUTCOME_CLAIM_ABSENT.
    The plan lacked a fallback to ensure a product variant is always found when both
    outcomes require a SKU.'
  status: inactive
  surface: ir
