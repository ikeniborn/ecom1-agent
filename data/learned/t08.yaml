- agents_md_anchor: null
  content: Always verify claimed variant properties of a bound base product by performing
    a separate rowset lookup scoped to that base record's product identifier, then
    applying count or exists primitives to the resulting property rows to determine
    the verdict; never fold variant predicates into the initial broad-match discovery
    SQL as computed flags, and never call sum_col with a single argument instead of
    the required rowset-reference and column-name pair.
  created: '2026-06-19'
  deactivated_reason: re-bloat reset; rc1 is the pinned canonical rule
  id: r008
  reasoning: 'Diagnosis: plan: primitive ''sum_col'' takes 2 arg(s), plan supplies
    1. Root cause: the planner collapsed the broad-match discovery and variant-property
    check into one monolithic SQL statement that injected a CASE flag (is_variant_match)
    inside the initial query, then extracted that flag column into $variant_flags,
    and finally invoked the failing fragment {"prim":"sum_col","args":["$variant_flags"],"into":"variant_sum"}
    with only one argument. This violates the required two-argument signature of sum_col
    (rowset, column_name) and also introduces a logic flaw by aggregating across all
    candidates rather than testing the specific bound base. The correct PlanIR shape
    separates these concerns: first bind $base via a broad match, then query the properties
    table filtered by $base.product_sku, and use a simple count or emptiness check
    on that scoped rowset to drive the decision branches—eliminating any need for
    sum_col or cross-candidate flag aggregation.'
  status: inactive
  surface: ir
