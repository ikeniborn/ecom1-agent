- agents_md_anchor: null
  content: 'Support-note claim verification ("a note claims we stock X ... cite the
    exact record; if base exists but extra claim absent answer <NO> with checked SKU;
    if it exists answer <YES> with SKU"). Use facts CATALOGUE_CANDIDATES to find the
    BASE product by brand+line/series (real row + product_sku + record_path); bind
    base=first(rows) over a BROAD normalized match (don''t over-constrain). Then test
    whether the EXTRA claimed property/variant holds for that base (separate predicate
    over product_variant_properties). ALWAYS answer OUTCOME_OK (never UNSUPPORTED/CLARIFICATION).
    Branches: base found AND extra holds -> message contains <YES> and the checked
    SKU; base found AND extra absent -> message contains <NO> and the checked SKU;
    base absent -> message contains <NO>. Author refs=[$base.record_path] on EVERY
    base-exists branch. INTENT: required_refs[OUTCOME_OK]=[]; outcome_space=[OUTCOME_OK].
    Put the literal checked SKU into the message.'
  created: '2026-06-18'
  deactivated_reason: null
  id: rc1
  pinned: true
  reasoning: Canonical single rule (candidate-aware). Deactivates all run-distilled
    rules (iLEARN re-bloat). Uses pre-phase CATALOGUE_CANDIDATES + family fixes (count
    int+policy-doc; claim <NO>/SKU).
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always materialize the answer message with an explicit format/concat op
    that injects the bound variables (checked_sku, verdict) into the string and assigns
    the result to the field the nonempty success-criterion reads ($answer.msg); never
    leave bare {placeholder} braces in a branch message, because with ops=[] and custom_extract=[]
    nothing substitutes them and the rendered msg comes back empty, failing the nonempty
    check.
  created: '2026-06-19'
  deactivated_reason: superseded by canonical rc1
  id: r001
  reasoning: 'Verbatim error: "verify: success_criteria[OUTCOME_OK][0] failed: {''op'':
    ''nonempty'', ''lhs'': ''$answer.msg'', ''rhs'': None, ''args'': []}". Root cause:
    every answer branch (yes/no/absent) carries a message ending ''...Checked SKU:
    {checked_sku}'', but the PlanIR has ops=[] and custom_extract=[], so no format/substitution
    stage ever runs. compute binds checked_sku via get($base,''product_sku'') yet
    the bare {checked_sku} brace is never interpolated; the renderer yields an empty/null
    msg, so $answer.msg fails the nonempty op even though the decision did select
    a branch (row found: FST-20PSA3I9, ms_count=1 -> ''yes''). Failing fragment: answer.yes.message
    ''<YES> — ... Checked SKU: {checked_sku}''. Linkage: extends rc1 (''put the literal
    SKU string into the message'') by specifying the mechanism — substitute via an
    explicit format op, not template braces — so the message is non-empty when verify
    reads $answer.msg. (Secondary, not the verify blocker: the OR on ''%nut bolt and
    washer%'' broadened the base lookup and matched line 1DA-WYU instead of the named
    14H-WRK, so the verdict should resolve <NO> per rule v001 — left to that rule.)'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always emit a complete non-empty PlanIR object even under uncertainty:
    structure it as ordered discovery rowsets that bind refs (base lookup binding
    first-row, then the extra-property predicate) followed by a single decision branch
    that materializes the answer field; never return a blank or empty response when
    the schema requires a PlanIR.'
  created: '2026-06-19'
  deactivated_reason: superseded by canonical rc1
  id: r002
  reasoning: 'Verbatim error: ''plan: PLAN LLM returned empty response''. SCRIPT_CODE
    is an empty code block — the PLAN phase emitted NO PlanIR at all, so the cycle
    never reached interpret/execute (no OBSERVED_RPC_OUTPUTS). Root cause is not a
    PlanIR-shape bug in a produced artifact but a total non-emission: the model returned
    blank rather than a minimal valid plan. Existing rules (rc1 strategy, in-session
    message materialization) prescribe WHAT branches/ops to author but none guard
    against returning nothing. Linkage: this rule complements rc1/in-session by forcing
    the PLAN phase to always output at least the discovery-rowset + single-decision-branch
    skeleton so a non-empty PlanIR exists for the next cycle to ground.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always emit the answer-message string materialization (the concat/format
    op that injects checked_sku and the verdict literal) inside the ops (or custom_extract)
    array — the scope the answer-branch template actually renders against — and have
    each branch message reference that materialized output directly; do not build
    the message string in the compute array and then reference it through {brace}
    placeholders in the branch message, because compute-scope bindings are invisible
    to the answer-template substitution and resolve to an empty $answer.msg.
  created: '2026-06-19'
  deactivated_reason: superseded by canonical rc1
  id: r003
  reasoning: 'Verbatim: verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''nonempty'',
    ''lhs'': ''$answer.msg'', ''rhs'': None, ''args'': []}. The PlanIR built msg_yes/msg_no/msg_absent
    via concat ops in the `compute` array (e.g. {"prim":"concat",...,"into":"msg_yes"})
    while `ops`:[] and `custom_extract`:[] are empty, then each answer branch set
    message via a single-brace template ({"found_yes":{"message":"{msg_yes}"}}). The
    answer-template substitution does not draw from compute-scope bindings, so {msg_yes}
    resolved to empty and $answer.msg rendered blank, tripping the nonempty gate.
    SQL ran fine and ms_count surfaced (data present), so this is purely a PlanIR
    message-materialization placement bug. Refines the prior in-session brace rule
    by pinning WHERE the materialization op must live (ops/custom_extract, not compute)
    and to reference the output directly rather than via {brace} placeholders.'
  status: inactive
  surface: ir
