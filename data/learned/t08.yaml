- agents_md_anchor: null
  content: Never use concat with a single literal argument; concat requires two list[dict]
    rowsets. To set a scalar variable from a literal, use a 'literal' compute step
    or embed the literal directly in the answer message.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: ''concat'' failed: missing argument ''b''. The PlanIR compute
    step used concat with a single string literal ''36Q-4QO'' instead of two rowset
    arguments. The contract states concat(a, b) expects both args as list[dict] rows.
    The intent was to capture the SKU value for answer messages, but concat is not
    the correct primitive for scalar assignment. Root cause: misuse of concat for
    literal-to-variable binding. The rule instructs to avoid concat for scalars and
    use a literal step or direct embedding.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a decision branch leads to an outcome whose success criteria require
    a nonempty ref column, include a nonempty check for that column in the branch
    condition to prevent verify failures.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The verify error 'success_criteria[OUTCOME_NONE_UNSUPPORTED][0] failed'
    occurred because the decision branch for 'found_mismatch' lacked a nonempty check
    on record_path, yet the success criteria for OUTCOME_NONE_UNSUPPORTED requires
    record_path nonempty. The row likely had an empty record_path, causing the branch
    to be taken but verification to fail. The fix is to align branch conditions with
    ref requirements.
  status: inactive
  surface: ir
