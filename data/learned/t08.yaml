  id: r007
  reasoning: 'Error: ''plan: PLAN LLM returned empty response''. Observed SCRIPT_CODE
    is an empty Python markdown fence (```python\n\n```), meaning the planner emitted
    a fenced code block with no structured content. Root cause: the planner defaulted
    to an empty code-wrapped document instead of valid PlanIR JSON. Failing PlanIR
    fragment: the entire output is an empty markdown code block. A stricter structural
    rule is needed that makes the opening JSON brace and non-empty steps array an
    unconditional requirement, overriding any tendency to output blank fenced blocks.'
  status: inactive
