entries:
- agents_md_anchor: '#important-tools > sql'
  content: When parsing /bin/sql stdout in CODEGEN scripts, split each row on the
    delimiter the tool actually emits (comma-separated CSV) rather than assuming '|'-separated
    columns, and identify the header by column-name match; a delimiter mismatch makes
    every line fail the column-count guard, drops the data columns, and leaves runtime
    refs empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ([\''$base_check.record_path\'']) but actual refs [] contain only static
    template entries []''. OBSERVED_RPC_OUTPUT shows /bin/sql emitted the comma-separated
    header ''product_sku,record_path,product_name,extra_present''. Root cause: SCRIPT_CODE
    parses with `parts = line.split("|")` then guards `if len(parts) < 4: continue`.
    The sql tool emits CSV (commas), so every line becomes a single element, fails
    the `< 4` guard, and is skipped — `rows` ends empty, the no-rows branch fires
    with `refs=[]`. The failing fragment is the pipe-delimiter assumption colliding
    with comma output, which silently discards the record_path column the answer_template
    needs. Rule links by mandating CODEGEN parse using the actual emitted CSV delimiter
    and detect the header by name, so record_path survives and refs populate.'
  status: active
- agents_md_anchor: '#important-things > references'
  content: 'When the SQL result drives an answer that asserts a record exists and
    cites a runtime ref, branch on whether at least one data row was parsed: emit
    the existence/<NO>-style message and refs only inside the has-row branch, and
    emit a distinct not-found outcome otherwise — never substitute blank fields and
    an empty refs list into a fixed ''base product exists'' message.'
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$base_check.record_path'']) but actual refs [] contain only static template
    entries [] — SQL likely returned no rows or row parsing dropped the path column".
    OBSERVED_RPC_OUTPUTS shows /bin/sql stdout contained ONLY the header line ''product_sku,record_path,product_name,extra_present''
    with zero data rows — the base CTE matched nothing. Failing fragment: after `data_lines
    = rows[1:]` is empty, `record_path`/`product_sku`/`product_name` keep their ''''
    defaults, so `refs=[]`, yet the script unconditionally calls `vm.answer(message=''<NO>
    Base product exists — ...'', refs=refs)`. Root cause: no empty-result guard —
    CODEGEN assumed the row always exists and hardcoded the ''exists'' assertion plus
    a runtime ref the template demands. Linkage: distinct from the in-session delimiter
    rule (parsing matched the comma CSV here); this rule covers the unhandled zero-data-row
    branch.'
  status: active
