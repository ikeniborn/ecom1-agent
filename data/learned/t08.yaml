- agents_md_anchor: null
  content: Never use /bin/echo or any external tool to output literal strings or variable
    values in ops; use the 'literal' primitive to bind constants, and reference variables
    directly in the answer template or via 'assign'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: ''real_vm: runtime tool not found: not found'' occurred because
    the PlanIR ops used ''/bin/echo'' to output ''<YES>'', ''<NO>'', and variable
    values. The runtime does not have that tool registered. Root cause: the PlanIR
    relied on an external tool for string output instead of using the built-in ''literal''
    primitive or direct variable binding. The failing PlanIR fragment: ops section
    with Exec rpc path ''/bin/echo''. The new rule instructs the PLAN phase to avoid
    external tools for output and use primitives, preventing this error.'
  status: inactive
  surface: ir
