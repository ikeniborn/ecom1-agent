- agents_md_anchor: null
  content: 'Always emit support-note catalogue-verification PlanIR as a linear sequence
    of simple, named operations: first a broad-match rowset discovery to bind $base
    with product_sku and record_path; second a predicate projection over the bound
    base to test claimed variant properties; third a message-build step that fills
    the answer_shape skeleton using only the previously bound variables. Do not collapse
    these into a single nested expression or monolithic conditional block.'
  created: '2026-06-19'
  deactivated_reason: re-bloat reset; rc1 is the pinned canonical rule
  id: r004
  reasoning: 'Verbatim error: ''plan: PLAN LLM returned empty response''. Root cause:
    existing rule [rc1] compresses the entire multi-branch lookup, predicate check,
    and messaging logic into one dense natural-language paragraph, overwhelming the
    planner and causing it to emit an empty script block. The failing PlanIR fragment
    is the empty SCRIPT_CODE. By forcing a stepwise, binding-oriented PlanIR structure,
    each generation step is mechanically simple and the LLM is far less likely to
    return emptiness.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never place multi-line SQL scripts or heavily escaped string literals inside
    PlanIR JSON fields; always decompose data discovery into discrete, simple rowset
    operations that do not require embedding complex query syntax within JSON string
    values.
  created: '2026-06-19'
  deactivated_reason: re-bloat reset; rc1 is the pinned canonical rule
  id: r005
  reasoning: The planner emitted a monolithic Exec RPC with a multi-line SQL CTE placed
    in the 'stdin' JSON string, including newlines and escaped single quotes (fragment
    shows '\\n  SELECT product_sku...' and 'LIKE \\'%\\' || LO'). This caused the
    PlanIR parser to fail with 'could not parse JSON'. Existing structural rule [in-session]
    prefers linear simple operations but does not explicitly prohibit the JSON-escaping
    hazard of inlining SQL text as a JSON string value. A dedicated rule is needed
    to stop planners from encoding complex SQL inside JSON fields.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always shape support-note claim-verification PlanIR as a non-empty JSON
    object containing a top-level 'steps' array with at least one named rowset-discovery
    operation; never emit an empty document, markdown prose, or a programming-language
    code block.
  created: '2026-06-19'
  deactivated_reason: re-bloat reset; rc1 is the pinned canonical rule
  id: r006
  reasoning: 'Verbatim error: ''plan: PLAN LLM returned empty response''. The candidate
    PlanIR (SCRIPT_CODE) is completely empty, indicating the LLM produced no structured
    output. Root cause is lack of a mandatory minimum-structure floor in the existing
    rules; the model had no enforced starting scaffold and defaulted to an empty response.
    The failing fragment is the empty document itself. Adding a rule that mandates
    a non-empty JSON ''steps'' array beginning with a discovery operation prevents
    empty plans and clarifies that markdown/code fences are not acceptable PlanIR.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always emit PlanIR as a raw JSON object beginning with the '{' character
    and containing a non-empty top-level 'steps' array of named rowset operations;
    never return an empty response, markdown prose, or a programming-language code
    block even when the planner is uncertain how to fulfil the intent.
  created: '2026-06-19'
