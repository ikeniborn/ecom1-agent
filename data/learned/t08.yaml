entries:
- content: Never confine the search for Wurth Universal ASSY SIA-ROX Nut Bolt and
    Washer products to a single `p.series LIKE` filter containing the full line description;
    always decompose the search across `p.series`, `p.model`, and `p.name` when retrieving
    products by line description.
  created: '2026-05-23'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''Empty result: sku,path,brand,series,model,name,fastener_type,diameter_mm,length_mm''.
    Root cause category: wrong-filter. The action `SELECT ... WHERE p.brand=''Wurth''
    AND p.series LIKE ''%Universal ASSY SIA-ROX Nut Bolt and Washer%'' ... GROUP BY
    p.sku, p.path` failed because it placed the entire line description into the `series`
    column filter. Catalogue product line names are typically split across `series`,
    `model`, and `name`, so the single-column `LIKE` pattern excluded all rows. Failing
    fragment: the `WHERE p.brand=''Wurth'' AND p.series LIKE ''%Universal ASSY SIA-ROX
    Nut Bolt and Washer%''` clause in the action. The rule requires distributing the
    search terms across multiple product columns to locate the matching base product.'
  source: learn
  status: active
