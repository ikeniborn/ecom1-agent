- agents_md_anchor: null
  content: Do not hardcode property_key values in SQL discovery; instead, retrieve
    all properties for the target SKU as key-value pairs and perform matching in a
    compute step using case-insensitive comparison or normalization.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. The
    PlanIR''s SQL query used hardcoded property_key strings (''adhesive_type'', ''color_family'',
    ''chemistry'') in CASE statements. If the actual database keys differ (e.g., ''Adhesive
    Type''), the query returns NULLs, causing property comparisons to fail and the
    decision to fall to unsupported. Root cause: assuming exact property key names
    without discovery. The rule prevents this by requiring generic property retrieval
    and compute-step matching, allowing normalization.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always pass SQL queries to the sql binary using the -c flag as a command-line
    argument, not via stdin.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The interpret error ''sql returned usage banner — SQL not delivered
    via stdin'' indicates that the PlanIR Exec step attempted to deliver SQL via stdin,
    but the sql binary expects queries via the -c flag. The failing PlanIR fragment:
    ''{"rpc":"Exec","args":{"path":"/bin/sql","stdin":"SELECT ..."}}''. The root cause
    is incorrect delivery method for SQL. The rule instructs the PLAN phase to always
    use the -c flag for sql queries.'
  status: inactive
  surface: ir
