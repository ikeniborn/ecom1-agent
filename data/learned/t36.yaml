  content: Always extract the matches list from a Search RPC response before applying
    sequence primitives like first. Use a rowset with format 'search_response' or
    a get primitive with key 'matches' to obtain the list.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The compute step 'first' failed with 'SearchResponse' object is not subscriptable.
    The PlanIR passed the raw Search RPC bind ($exception_search) directly to the
    first primitive, but the RPC returns a response object, not a list. The contract
    for first expects a sequence. The fix is to extract the matches list from the
    response before using first.
  status: inactive
  surface: ir
