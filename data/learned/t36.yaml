- agents_md_anchor: null
  content: When a plan includes both a security constraint and a policy-document check
    for an exception, order the decision branches to first verify the exception's
    existence; only if the exception is found should the security constraint be evaluated.
    If the exception is not found, the outcome should be unsupported without evaluating
    security.
  created: '2026-06-22'
  deactivated_reason: r002's ordering (exception existence before security) caused
    the plan to ignore a violated security constraint, producing an incorrect unsupported
    outcome instead of DENIED_SECURITY.
  id: r002
  reasoning: 'The grader expected OUTCOME_NONE_UNSUPPORTED because the exception is
    not in the handbook, but the script''s decision branch checked security first,
    leading to OUTCOME_DENIED_SECURITY. The root cause is the ordering of decision
    branches: the security check (identity.kind != employee) was placed before the
    exception existence check (contains_any on handbook_text). The correct order should
    first check if the exception is supported; if not, go to unsupported. Only if
    the exception is found should the security constraint be evaluated. The failing
    PlanIR fragment is the decision block with branches ordered security first, then
    exception_found.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always extract the content from a Read RPC response using a rowset with
    format 'read_response' and a column mapping to 'content', or use a compute get
    with key 'content'.
  created: '2026-06-22'
  deactivated_reason: Superseded by new rule that explicitly forbids using raw Read
    output in decision branches.
  id: r003
  reasoning: 'The error ''real_vm: Protocol message ReadResponse has no ''f'' field.''
    indicates that the PlanIR discovery step bound the raw Read RPC response to ''handbook_text'',
    but the interpreter later tried to access a field ''f'' (likely a default) that
    does not exist. The correct PLAN technique is to extract the file content from
    the structured Read response using a rowset or get primitive. Failing PlanIR fragment:
    {"rpc":"Read","args":{"path":"/docs/store-associate-exception-handbook.md"},"bind":"handbook_text"}.'
  status: inactive
  surface: ir
