- agents_md_anchor: null
  content: Never use the raw output of a Read RPC directly in a decision branch; always
    extract the content using a rowset with format 'read_response' and a column mapping
    to 'content' before checking for phrases.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The plan used $handbook_text directly in a decision branch's contains_any
    check, but $handbook_text was the raw RPC response, not the extracted content.
    This caused a false positive match on the exception phrase, leading the plan to
    take the exception_found branch and attempt an Exec that failed, resulting in
    OUTCOME_NONE_CLARIFICATION instead of the expected OUTCOME_NONE_UNSUPPORTED. The
    existing rule r003 requires extracting content, but the plan violated it. A stronger
    rule is needed to prevent direct use of raw Read output.
  status: inactive
  surface: ir
