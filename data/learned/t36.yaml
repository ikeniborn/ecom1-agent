- agents_md_anchor: null
  content: When a decision branch uses a ref obtained from a Read RPC (e.g., handbook content), first
    check that the ref is non-empty; if it is empty, route directly to the outcome that corresponds to
    the document not containing the required information (e.g., OUTCOME_NONE_UNSUPPORTED) without evaluating
    the content condition.
  created: '2026-06-22'
  deactivated_reason: null
  id: r012
  reasoning: The plan produced OUTCOME_NONE_CLARIFICATION instead of OUTCOME_NONE_UNSUPPORTED. The root
    cause is likely that the handbook Read RPC returned empty content (e.g., file missing or unreadable),
    causing the 'contains_any' condition on a null ref to trigger a clarification request. The decision
    tree lacked a guard branch for empty content, so the interpreter could not resolve the condition and
    fell back to clarification. The fix is to add a branch that checks for non-empty content before evaluating
    the content condition, routing empty reads directly to the unsupported outcome.
  status: active
  surface: ir
