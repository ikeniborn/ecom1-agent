- agents_md_anchor: '#decision-branch-ordering'
  content: Always order decision branches so that all DENIED outcomes (e.g., DENIED_SECURITY)
    are evaluated before any non-DENIED outcomes (e.g., OUTCOME_OK). When a plan includes
    a security constraint, place the branch that leads to DENIED_SECURITY immediately
    after the existence check and before the authorized branch, and ensure its condition
    explicitly tests that the security constraint is NOT met.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The plan placed the ''authorized'' (OUTCOME_OK) branch before the ''denied_security''
    branch, causing a security-first violation. The correct order is: 1) exception
    not found -> unsupported, 2) exception found AND security fails -> denied_security,
    3) exception found AND security passes -> authorized. The denied_security condition
    must explicitly check that the security constraint is not satisfied (e.g., using
    ''not'' around the security checks). Existing rule r002 partially addressed ordering
    but did not enforce that DENIED branches precede non-DENIED branches, so it is
    superseded.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use the concat primitive to bind a constant string or to construct
    JSON strings. Use the literal primitive to emit a constant value, and the format
    primitive to build strings from variables.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. Root cause: The PlanIR compute step used
    concat with a single string literal ''basket_184'' (and similarly for payment_id
    and payment_json_str) instead of two list[dict] rowset arguments. The concat primitive
    expects two rowset lists to concatenate, not a constant string. The plan attempted
    to set basket_id to a constant string, but the correct primitive for emitting
    a constant value is literal. Failing PlanIR fragment: {"prim":"concat","args":["basket_184"],"into":"basket_id"}
    and the subsequent concat steps for payment_id and payment_json_str. No existing
    rule covers this misuse.'
  status: inactive
  surface: ir
- agents_md_anchor: '#decision'
  content: When a plan includes a security constraint that denies based on identity/role,
    evaluate that constraint first in the decision tree; if the deny_when condition
    holds, produce OUTCOME_DENIED_SECURITY. Only if the security constraint passes
    should the plan check for the existence of the exception.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The plan's decision tree only checked for the exception's existence and
    went to OUTCOME_NONE_UNSUPPORTED when not found, ignoring the security constraint.
    The security constraint's deny_when held (user not authorized), so the correct
    outcome should have been OUTCOME_DENIED_SECURITY. Rule r002 incorrectly advised
    to check exception existence first and skip security evaluation if not found,
    which caused this violation. The new rule ensures security is evaluated first
    and leads to DENIED_SECURITY when violated.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When using the ''get'' primitive in a compute step, provide exactly two
    arguments: the object and the key. Do not include an extra empty list or any third
    argument.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'The interpret error ''get() takes 2 positional arguments but 3 were
    given'' occurred because the compute step for ''employee_roles'' passed three
    arguments: [''$identity_row'', ''roles'', []]. The ''get'' primitive contract
    expects only two arguments (obj, key). The empty list is extraneous and caused
    the lambda invocation to fail. The PlanIR fragment responsible is: {"prim":"get","args":["$identity_row","roles",[]],"into":"employee_roles"}.
    Removing the third argument will fix the grounding.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a plan includes a security constraint that can lead to OUTCOME_DENIED_SECURITY,
    place the branch that tests the security constraint first in the decision tree,
    before any branch that leads to a non-DENIED outcome (including OUTCOME_NONE_UNSUPPORTED).
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'interpret: security-first violation: a DENIED_SECURITY branch follows
    a non-DENIED branch in the decision tree. The plan placed the unsupported branch
    (non-DENIED) before the denied_security branch. The security-first rule requires
    DENIED branches to be evaluated before any non-DENIED branch. The existing in-session
    rule already states this, but the plan did not follow it. This new rule makes
    the ordering explicit for all non-DENIED outcomes.'
  status: inactive
  surface: ir
