- agents_md_anchor: null
  content: Always extract the text content from a ReadResponse (e.g., via a compute
    primitive 'get' on the 'text' field) before using it in string operations like
    contains_any.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: ''real_vm: Protocol message ReadResponse has no "does not authorize
    basket checkout" field.'' Root cause: The PlanIR decision branch uses `$handbook_text`
    (a raw ReadResponse object) directly in a `contains_any` operation. The VM interprets
    the RHS list as field names on the protocol message, not as substring literals.
    The fix is to extract the document''s text content into a string variable before
    performing string matching. The failing PlanIR fragment is the decision condition:
    `{"op":"contains_any","lhs":"$handbook_text","rhs":["does not authorize basket
    checkout",...]}`. This rule ensures the PLAN phase always includes a text extraction
    step after a Read RPC, preventing similar runtime errors.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never include a decision branch that outputs OUTCOME_DENIED_SECURITY; security
    denials are handled automatically by the interpreter's constraint engine.
  created: '2026-06-25'
  deactivated_reason: null
  id: r002
  reasoning: The PlanIR included a decision branch that checked identity.kind == 'guest'
    and output OUTCOME_DENIED_SECURITY. The verify phase detected that the security
    constraint's deny_when predicate (identity.kind == 'guest') was not satisfied,
    yet the outcome was DENIED_SECURITY, causing a spurious over-refusal. The PlanIR
    should not manually enforce security constraints; the interpreter applies them
    automatically. The decision tree should only handle the exception applicability
    (e.g., handbook content check) and default to unsupported.
  status: active
  surface: ir
