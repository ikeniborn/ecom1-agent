- agents_md_anchor: null
  content: When a plan needs to execute a tool referenced in a policy document, include
    a discovery step that extracts the tool's path from the document (e.g., by reading
    the document and using a rowset to parse the path) before using it in an Exec
    step; never hardcode a path like /finalization.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'real_vm: stat failed: not found. The plan hardcoded the path /finalization
    for the finalization tool, but that path does not exist. The plan should have
    discovered the correct path by reading the handbook and extracting the tool''s
    location, or by searching for the tool. Failing PlanIR fragment: discovery step
    {"rpc":"Stat","args":{"path":"/finalization"},"bind":"finalization_stat"} and
    ops step {"rpc":"Exec","args":{"path":"/finalization",...}}. The rule ensures
    future plans always discover tool paths from policy documents before execution.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use the 'concat' primitive to bind a single literal value; 'concat'
    requires two list[dict] rowsets. Use the 'literal' primitive for a single value,
    or reference the parameter directly in the answer template.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'Error: ''concat'' failed: missing 1 required positional argument: ''b''.
    CONTRACT: concat(a, b) requires both args to be list[dict] rows. The plan used
    concat with a single string literal ''basket_124'' to bind basket_id, violating
    the primitive''s contract. The correct approach is to use the ''literal'' primitive
    or directly reference the parameter in the answer message.'
  status: inactive
