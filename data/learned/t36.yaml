- agents_md_anchor: '# security'
  content: Always include a decision branch that evaluates each security constraint's deny_when condition;
    if the condition holds, route to the security denial outcome, regardless of other checks.
  created: '2026-06-22'
  deactivated_reason: null
  id: r014
  reasoning: 'ERROR: verify: I3: security constraint ''# security'' deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'',
    not DENIED_SECURITY. The PlanIR only checked handbook content and defaulted to unsupported, ignoring
    the security constraint entirely. Existing rule r013 advised ordering content before security and
    skipping security if content missing, which directly caused this failure. The plan must always evaluate
    security constraints; if deny_when holds, the outcome must be the security denial outcome.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'When a plan includes an Exec /bin/id to determine the actor''s role for a security constraint,
    always follow it with a compute step that extracts the role using a regex (e.g., ''roles: (\w+)'')
    and binds it to a ref like $actor_role; use that ref in decision branches instead of $identity.kind.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: 'verify: I3: security constraint ''# security'' deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'',
    not DENIED_SECURITY. Observed /bin/id output: ''user: cust_041\nroles: customer'', so identity.kind
    should be ''customer'', not ''guest''. The interpreter likely misbound identity.kind from pre-phase
    facts, causing the decision branch to miss the security denial. The plan must explicitly extract the
    role from the Exec output to ensure correct evaluation.'
  status: active
  surface: ir
