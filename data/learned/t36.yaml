- agents_md_anchor: '# security'
  content: Always include a decision branch that evaluates each security constraint's
    deny_when condition; if the condition holds, route to the security denial outcome,
    regardless of other checks.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: 'ERROR: verify: I3: security constraint ''# security'' deny_when holds
    but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY. The PlanIR only
    checked handbook content and defaulted to unsupported, ignoring the security constraint
    entirely. Existing rule r013 advised ordering content before security and skipping
    security if content missing, which directly caused this failure. The plan must
    always evaluate security constraints; if deny_when holds, the outcome must be
    the security denial outcome.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When a plan includes an Exec /bin/id to determine the actor''s role for
    a security constraint, always follow it with a compute step that extracts the
    role using a regex (e.g., ''roles: (\w+)'') and binds it to a ref like $actor_role;
    use that ref in decision branches instead of $identity.kind.'
  created: '2026-06-22'
  deactivated_reason: r015 advises extracting role from /bin/id and using that ref
    in decision branches, but the verifier requires the exact expression from the
    security constraint's deny_when condition. Using a computed ref causes mismatch
    and spurious security denial errors.
  id: r015
  reasoning: 'verify: I3: security constraint ''# security'' deny_when holds but outcome
    is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY. Observed /bin/id output:
    ''user: cust_041\nroles: customer'', so identity.kind should be ''customer'',
    not ''guest''. The interpreter likely misbound identity.kind from pre-phase facts,
    causing the decision branch to miss the security denial. The plan must explicitly
    extract the role from the Exec output to ensure correct evaluation.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use concat with a single argument; concat requires two list[dict]
    arguments. For constant values, use a compute step with prim 'literal' (or 'set')
    and the value as the single argument.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'Error: compute step ''concat'' failed: <lambda>() missing 1 required
    positional argument: ''b''. Root cause: concat was called with a single string
    argument ''basket_192'' instead of two list[dict] arguments. The plan incorrectly
    used concat to assign a constant value. The correct approach is to use a literal
    assignment prim. This rule prevents similar misuse.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a security constraint's deny_when condition references $_facts.identity.kind,
    use that exact expression in the decision branch condition, not a computed variable
    that holds the same value.
  created: '2026-06-24'
  deactivated_reason: null
  id: r017
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds. Root cause: Plan used $actor_role (computed from $identity.kind)
    in the decision branch condition, but the security constraint''s deny_when uses
    $_facts.identity.kind. The verifier checks that the branch condition exactly matches
    the declared deny_when expression. Using a derived variable fails that check,
    causing spurious over-refusal. The plan correctly identified the role but used
    the wrong ref. Rule r015 (use $actor_role) caused this; deactivating it. New rule:
    use the exact deny_when expression from the constraint.'
  status: active
  surface: ir
- agents_md_anchor: '#security'
  content: Always include an Exec /bin/id RPC in the discovery phase when the TOOL_PLAN
    contains a security constraint that references $_facts.identity.kind. Then use
    a compute step to extract the role from the output and bind it to a ref (e.g.,
    $actor_role), and use that ref in the decision branch condition instead of $_facts.identity.kind.
  created: '2026-06-24'
  deactivated_reason: null
  id: r018
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds. The PlanIR produced DENIED_SECURITY via a branch condition
    `$_facts.identity.kind != employee`, but the verify step found that no security
    deny_when condition actually holds. Root cause: the PlanIR omitted an Exec /bin/id
    RPC, so `$_facts.identity.kind` was never populated (likely null/undefined). The
    condition `ne` with null and ''employee'' evaluated to true, causing spurious
    denial. The verify step, using actual facts (no identity known), considered the
    security predicate false, flagging the outcome as spurious. The fix is to always
    fetch identity via /bin/id when security constraints reference identity, then
    extract the role and use that computed ref in the decision branch. Existing rule
    r015 covers extraction but assumes /bin/id is already present; this rule ensures
    the fetch is included.'
  status: active
  surface: ir
- agents_md_anchor: '#security'
  content: Always use the exact expression from the security constraint's deny_when
    condition in the decision branch that routes to the security denial outcome, rather
    than deriving the role from /bin/id output or any other computed ref.
  created: '2026-06-24'
  deactivated_reason: null
  id: r019
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds. The plan used a regex_match on $id_output to check
    for ''employee'', but the security constraint''s deny_when condition is {op: ne,
    lhs: $_facts.identity.kind, rhs: ''employee''}. The verifier expects the exact
    expression from the constraint; the plan''s derived condition is not recognized
    as matching, causing a spurious over-refusal. The plan should use $_facts.identity.kind
    directly in the branch condition, not a computed ref from /bin/id.'
  status: active
  surface: ir
