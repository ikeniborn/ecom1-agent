- agents_md_anchor: null
  content: Do not use the 'concat' primitive to build SQL strings; it expects two
    rowset arguments. Use a string concatenation primitive (e.g., 'str_concat') that
    takes multiple string arguments and returns a single string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() takes 2
    positional arguments but 3 were given. CONTRACT: concat(a, b): both args must
    be list[dict] rows (parse Exec output via rowsets first). The failing PlanIR compute
    step: {"prim":"concat","args":[".headers off\nSELECT CASE WHEN ","$difference_eur","
    <= 3.0 THEN ''True'' ELSE ''False'' END;"],"into":"within_3_sql"}. The ''concat''
    primitive is designed to concatenate two rowsets (list[dict]), not strings. The
    step attempted to concatenate three string fragments to form a SQL query, which
    violates the primitive''s contract. The correct approach is to use a string concatenation
    primitive (e.g., ''str_concat'') that accepts multiple string arguments and produces
    a single string, then pass that string as stdin to Exec.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always use the 'expr' primitive to construct the predicate for filter_rows,
    rather than passing a plain dict.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'The error ''interpret: compute step ''filter_rows'' failed: ''dict''
    object has no attribute ''op'''' occurred because the PlanIR passed a plain dict
    {"op":"in_set","lhs":"$row.product_sku","rhs":"$sku_list"} as the predicate. The
    interpreter expects the predicate to be an expression object with an .op attribute,
    not a dict. The existing rule r002 incorrectly advises using a predicate dict,
    which is incompatible with the interpreter''s implementation. Deactivating r002
    and providing a rule to use the ''expr'' primitive to create the required expression
    object.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use the 'custom_extract' primitive; it is not supported. Instead,
    use standard primitives like 'regex' and 'split' to parse unstructured text into
    rowsets, then use 'column' to project fields.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: ''interpret: compute step ''custom_extract'' failed: ''custom_extract''''.
    The PlanIR attempted to use a custom_extract named ''fuzzy_sku_receipt'' to parse
    the receipt text, but the interpreter does not recognize this primitive. Root
    cause: reliance on an undefined custom extraction function. Failing PlanIR fragment:
    compute step with prim ''custom_extract''. Rule instructs to avoid custom_extract
    and instead compose parsing from available primitives.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always ensure that the first argument to filter_rows is a list of dicts;
    if the source binding (e.g., from an Exec RPC) might be a single dict, wrap it
    in a list using the 'list' primitive before passing to filter_rows.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Error: ''interpret: compute step ''filter_rows'' failed: ''filter_rows''
    expects list[dict]; use ''get'' for a single row''. Root cause: The binding $all_variants
    from the Exec RPC is a single dict (likely because the query returned a single
    row or the Exec output is a single row object), not a list of dicts. Failing PlanIR
    fragment: compute step {"prim":"filter_rows","args":["$all_variants",{"op":"in","lhs":"$row.product_sku","rhs":"$old_skus"}],"into":"current_items"}.
    Rule linkage: This new rule ensures the rowset is a list before filter_rows is
    called, preventing the type mismatch.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always wrap the result of any Exec RPC that runs a SQL query in a list
    using the 'list' primitive before using it as a rowset, because SQL queries may
    return a single row as a dict.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: interpret: compute step ''filter_rows'' failed: ''filter_rows''
    expects list[dict]; use ''get'' for a single row. Root cause: The Exec RPC binding
    $all_products (from ''SELECT product_sku, price_cents FROM product_variants;'')
    returned a single dict instead of a list of dicts, so filter_rows received a non-list
    first argument. The existing [in-session] rule ''Always ensure that the first
    argument to filter_rows is a list of dicts; if the source binding might be a single
    dict, wrap it in a list using the ''list'' primitive'' was not applied. This new
    rule makes the wrapping unconditional for all Exec SQL results to prevent recurrence.'
  status: inactive
  surface: ir
