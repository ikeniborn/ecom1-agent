- agents_md_anchor: null
  content: When a plan uses a file discovered by Find as input to an Exec RPC that
    imports it into SQL, always include a prior Read RPC step to inspect the file's
    content and determine its column layout, so the SQL query can be constructed to
    match the actual format.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: 'verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''nonempty'',
    ''lhs'': ''$difference_cents'', ''rhs'': None, ''args'': []}. The plan produced
    OUTCOME_NONE_CLARIFICATION because $difference_cents was empty, causing the decision
    condition to fail. Root cause: the Exec RPC imported the receipt file with hardcoded
    column assumptions (c1, c2, c3) without first inspecting the file''s actual structure.
    The SQL import likely failed or returned no rows, leaving all computed refs empty.
    Failing PlanIR fragment: the Exec RPC that directly runs .import --csv --skip
    1 ''$receipt_candidates.0.path'' receipt without a prior Read to verify the format.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always verify that a file path obtained from a Find RPC points to a file
    (not a directory) before using it in a Read RPC, by checking the item's 'kind'
    field or using a filter step, because Find may return directories with matching
    names.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'Error: ''real_vm: read failed: is a directory''. The PlanIR used Find
    to locate ''receipt*'' files in /uploads, then immediately read the first result''s
    path. The Read failed because the path pointed to a directory, not a file. The
    Find RPC may have returned a directory whose name matched the pattern, despite
    the ''kind'' filter. The plan lacked a verification step to ensure the selected
    item was a file before reading. The new rule instructs the planner to always guard
    against this by checking the item''s type after Find, preventing such failures.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include a Read RPC step to inspect the content of any file discovered
    by Find before using it in SQL or other processing, to determine its format and
    structure.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: The plan used a file discovered by Find directly in an SQL query with
    json_extract(readfile(...), '$.payment_id'), assuming the file is a JSON with
    a payment_id field. The Exec RPC likely failed or returned empty because the file
    format was different. The verify step failed because $difference_cents was empty.
    The root cause is missing a Read step to inspect the file content. The in-session
    rule already advises this, but it was not followed. Formalizing as a rule will
    enforce it.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using List or Find to discover files, always filter the results to
    include only entries where 'kind' is 'file' before using the path in a Read RPC,
    because directories will cause a read failure.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'Error: ''real_vm: read failed: is a directory''. The plan used List
    on /uploads, bound to ''upload_list'', then used ''first_entry.path'' directly
    in a Read RPC without checking if the entry was a file. The first entry was a
    directory, causing the Read to fail. The plan must filter the list to only file
    entries before selecting the first one.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always structure each discovery step as an object with a single 'rpc' key,
    whose value is a dict containing 'prim' (string), 'args' (a dict of named parameters),
    and 'into' (string). Never place 'prim', 'args', or 'into' directly at the step
    level.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'PlanIR validation failed with 16 errors: each step object was missing
    the required ''rpc'' field, and instead had ''prim'', ''args'', ''into'' as top-level
    keys. Additionally, ''args'' was a list instead of a dict. The correct PlanIR
    schema requires each step to be {"rpc": {"prim": "...", "args": {...}, "into":
    "..."}}. The contract error for filter_rows is a consequence of the malformed
    args. Root cause: incorrect PlanIR structure emitted by the PLAN phase.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always ensure that any file path used in a Read RPC is bound in a prior
    discovery step, not a compute step. Prefer using a Find RPC to directly obtain
    the file path, as it returns absolute paths that can be immediately used in a
    subsequent Read RPC.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r017
  reasoning: 'Error: real_vm: read failed: invalid path: path must be absolute: "discover
    by listing files in /uploads/ directory and selecting the receipt file". Root
    cause: The PlanIR placed a Read RPC in discovery that referenced $receipt_file_path,
    but that variable was only bound in a later compute step (via filter_rows and
    get on the List output). Because compute runs after discovery, the variable was
    unbound at Read time, causing the VM to fall back to the param value, which is
    a task description, not a path. The failing PlanIR fragment: discovery step {"rpc":"Read","args":{"path":"$receipt_file_path"},...}
    and compute steps that set receipt_file_path after discovery. The corrective technique
    is to use a Find RPC to directly locate the receipt file and obtain its absolute
    path, then reference that path in the Read RPC, ensuring the variable is bound
    in a prior discovery step.'
  status: inactive
  surface: ir
