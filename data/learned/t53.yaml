- agents_md_anchor: '#important-things > yes-no'
  content: Always route every control path through exactly one terminal vm.answer
    call whose outcome equals the tool_plan answer_template OUTCOME, and wrap discovery/read/exec
    calls so no unhandled exception or empty branch can short-circuit before that
    call; a run that never reaches vm.answer defaults to OUTCOME_NONE_CLARIFICATION,
    which the grader scores as a failure to answer even when the verdict logic is
    correct.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''.
    Root cause: harness emits OUTCOME_NONE_CLARIFICATION when the script terminates
    without reaching vm.answer. Failing fragments: unguarded vm.read(path=receipt_path,...)
    on the fabricated fallback ''/uploads/receipt.txt'' and the bare vm.exec(path=''/bin/sql'',
    args=[...]) calls (cur_sql, comp_sql) — any of these can raise, and the single
    vm.answer(outcome=''OUTCOME_OK'') sits at the bottom with no surrounding guard,
    so an exception aborts the run before answering and the host defaults to a clarification
    outcome. Linkage: distinct from r001 (symmetric matched-set summation prevents
    a wrong YES/NO but does not address the missing answer) and broader than r002
    (r002 guards only the empty-discovery Read; this covers any pre-answer crash incl.
    SQL exec/parse), so the verdict logic never gets emitted. r002''s no-fabricated-path
    content stays valid, so no deactivation.'
  status: active
- agents_md_anchor: null
  content: When the tool_plan declares a fixed discovery+ops RPC sequence and fidelity
    is graded by RPC multiset, execute every planned Read/Exec exactly once on the
    main path; never let a heuristic parse/not-found guard early-return before those
    RPCs run, since skipping planned dependent calls drifts the emitted multiset from
    the plan and fails fidelity.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer, Exec, Exec, List, Read] got: [Answer, List]''. Root
    cause: script ran vm.list, the file-detection heuristic (''FILE'' in kind or ''.''
    in name) failed to bind receipt_path, hit the `if not receipt_path:` early-return
    that calls vm.answer and `return` — skipping the planned vm.read and both vm.exec
    calls. Failing fragment: `if not receipt_path: vm.answer(...); return`. Tool_plan
    discovery+ops mandates List+Read+Exec+Exec+Answer; the conditional short-circuit
    dropped Read and both Execs. Rule linkage: technique forces CODEGEN to mirror
    the plan''s full RPC set on the main path instead of gating planned calls behind
    fragile guards.'
  status: active
