- agents_md_anchor: null
  content: Always extract stdout from ExecResponse and parse it into a rowset before
    using list primitives like first.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: ''ExecResponse'' object is not subscriptable. Root cause: compute
    step ''first'' received $price_result, which is the raw ExecResponse from the
    SQL Exec RPC, not a list of rows. The PlanIR must first extract the stdout (e.g.,
    $price_result.stdout) and parse it (e.g., json_parse) into a rowset before applying
    list primitives. Failing PlanIR fragment: {"prim":"first","args":["$price_result"],"into":"price_row"}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always call filter_rows with exactly two arguments: the rowset (list of
    dicts) and a predicate dict. The predicate must be a single expression (e.g.,
    {"op":"in","lhs":"$row.product_sku","rhs":"$sku_list"}), not a column name and
    a list passed as separate arguments.'
  created: '2026-06-22'
  deactivated_reason: r002 incorrectly advises using a predicate dict, which causes
    'dict' object has no attribute 'op' error; the interpreter requires an expression
    object with .op attribute.
  id: r002
  reasoning: 'interpret: compute step ''filter_rows'' failed: _filter_rows() takes
    2 positional arguments but 3 were given. CONTRACT: filter_rows(rows, pred): first
    arg must be list[dict] rows. The failing PlanIR fragment: {"prim":"filter_rows","args":["$all_products","product_sku","$sku_list"],"into":"matching_products"}.
    The primitive was incorrectly invoked with three arguments (rowset, column name,
    list) instead of two (rowset, predicate).'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not nest 'args' inside the Exec args object; provide path, args (list),
    and stdin (string) as direct keys.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. Root cause: The Exec RPC step in PlanIR had a nested ''args'' key inside
    the args object, causing the interpreter to ignore the ''stdin'' field. The SQL
    query was not passed to the tool. Failing fragment: {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"$sql_query","args":[...]}}.
    The correct structure is flat: {"rpc":"Exec","args":{"path":"/bin/sql","args":[...],"stdin":"$sql_query"}}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using Exec to run a SQL query that references external data, embed
    the data directly into the stdin SQL script (e.g., via string concatenation in
    a prior compute step) rather than passing it as a command-line argument, because
    the SQL interpreter does not bind command-line arguments to query parameters.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: ''real_vm: bad argument type for built-in operation''. Root cause:
    The PlanIR passed the receipt text as a command-line argument to /bin/sql (args:
    [''$receipt_text'']), while the SQL script on stdin used a named parameter '':receipt_text''
    that the SQLite CLI cannot resolve from command-line arguments. The SQL query
    likely failed, producing non-tabular output, causing the rowset parser to return
    a non-list value, which then caused the ''first'' primitive to fail with a bad
    argument type. Failing PlanIR fragment: Exec RPC with args: [''$receipt_text'']
    and stdin containing '':receipt_text'' placeholder. The rule ensures data is embedded
    in stdin to avoid parameter binding failures.'
  status: inactive
  surface: ir
