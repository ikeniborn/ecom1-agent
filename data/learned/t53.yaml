- agents_md_anchor: null
  content: Always ensure that any rowset produced by a custom_extract is defined before the compute section
    that references it. If the PlanIR structure requires custom_extract after compute, do not reference
    such rowsets in compute; instead, parse the data using a rowsets step or restructure the plan to avoid
    forward references.
  created: '2026-06-22'
  deactivated_reason: null
  id: r018
  reasoning: The plan returned OUTCOME_NONE_CLARIFICATION because compute steps referenced $receipt_items,
    which was only defined in the custom_extract 'fuzzy_sku_receipt' placed after the compute section.
    The interpreter processes compute before custom_extract, causing a missing variable error and fallback
    to an undefined outcome. The rule prevents forward references to custom_extract outputs in compute.
  status: active
  surface: ir
- content: null
  created: '2026-06-22'
  id: v015
  score: 0.0
  score_detail:
