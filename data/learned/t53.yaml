- agents_md_anchor: null
  content: Never apply the catalog path constraint to files in /uploads/; that constraint is only for
    catalog data. When the instruction specifies a receipt file in /uploads/, read it directly using a
    Read RPC on the given path.
  created: '2026-06-22'
  deactivated_reason: null
  id: r019
  reasoning: 'The plan applied the catalog path constraint (allowed set: /PROD, /docs/..., etc.) to the
    receipt file path, which is in /uploads/. Since /uploads/ is not in the allowed set, the decision
    branch triggered OUTCOME_DENIED_SECURITY. The constraint is only for catalog data, not for user-provided
    receipt files. The plan should have directly read the receipt file from /uploads/ without checking
    it against the catalog allowed set. The plan also lacked any discovery steps to read the receipt file,
    which is needed to extract items. This rule ensures future plans exempt /uploads/ files from the catalog
    constraint and include a Read RPC for the receipt.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'When the instruction says ''the single file in /uploads/'' or similar, use a Find RPC with
    a pattern like ''*'' to locate the file, and bind the result. Then use the bound path directly in
    a Read RPC. Do not use a List RPC to list the directory and then extract a path, as List may return
    directory entries or require additional filtering, leading to a ''read failed: is a directory'' error.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r020
  reasoning: 'ERROR: real_vm: read failed: is a directory. The PlanIR used a List RPC on /uploads, then
    attempted to read the first entry''s path via $receipt_path.0.path, but that path resolved to a directory,
    not a file. The instruction required reading the single file in /uploads. The correct PLAN technique
    is to use a Find RPC to locate the file (e.g., with pattern ''*'') and bind the result, then Read
    that bound path. Existing rule r017 already prefers Find over List, but this error indicates a need
    for a more explicit rule for directory-to-file discovery.'
  status: active
  surface: ir
