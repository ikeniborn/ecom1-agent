- agents_md_anchor: null
  content: 'Existence query ("is X in the catalogue"/"do you carry X"). MATCH MINIMALLY:
    brand + ONE distinctive model/series token via normalized LIKE (LOWER/TRIM) on
    a SHORT fragment; do NOT add extra variant-property JOINs/EXISTS unless one token
    is genuinely insufficient — over-constraining yields a false 0-row ''absent''
    for a present product. For ''regular or flat''/''bare or kit'' alternants match
    ANY variant (OR), never require all. SELECT the record_path column. COMPUTE match_count=count(rows);
    first_record=first(rows). DECIDE match_count ge 1 -> label found else label absent.
    ANSWER (single top-level mapping, NO Answer op in ops): found.message contains
    the literal token <YES> and found.refs=[$first_record.record_path]; absent.message
    contains the literal token <NO> and absent.refs=[]. INTENT: required_refs[OUTCOME_OK]=[]
    (record_path is CONDITIONAL, authored per-branch); outcome_space=[OUTCOME_OK].
    NEVER answer CLARIFICATION/UNSUPPORTED — ''absent'' is OUTCOME_OK with <NO>. Read
    single-record fields with get, never column.'
  created: '2026-06-18'
