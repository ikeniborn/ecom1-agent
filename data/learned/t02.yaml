- agents_md_anchor: null
  content: Do not use 'eq' to produce a constant boolean; use 'const' with a boolean value (e.g., {"prim":"const","args":[true],"into":"in_stock"}).
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'The interpret error ''compute step ''eq'' failed: ''eq'''' occurred because the PlanIR used
    {"prim":"eq","args":["1","1"],"into":"in_stock"} to set a constant true. The ''eq'' primitive is intended
    for comparing two variable references, not for emitting a constant. The interpreter could not evaluate
    it. The correct approach is to use a ''const'' primitive with a literal boolean value.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'When a success criteria requires a constant boolean field in the answer (e.g., in_stock: true),
    set it directly in the answer branch object rather than using a compute step with ''const''.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r010
  reasoning: 'The compute step ''const'' failed with error ''interpret: compute step ''const'' failed:
    ''const'''', indicating the interpreter does not support a ''const'' primitive. The script attempted
    to set in_stock to true using ''const'' as per an existing in-session rule. The fix is to embed the
    constant value directly in the answer branch object (e.g., ''in_stock'': true) instead of using a
    compute step. This avoids the unsupported primitive.'
  status: active
  surface: ir
