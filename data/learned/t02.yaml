entries:
- agents_md_anchor: null
  content: When a tool_plan discovery step invokes /bin/sql with :name bindings, pass
    the SQL statement through stdin exactly as the plan specifies and supply each
    binding value through the plan's declared bind channel; never move the SQL into
    argv while routing bindings into stdin, since /bin/sql then parses the binding
    lines as the query and returns zero rows.
  created: '2026-06-06'
  deactivated_reason: 'The new rule strictly supersedes r001 and r002: both only barred
    relocating the query/bindings into argv, whereas the new rule covers that case
    plus the newly observed stdin literal-inlining failure under one directive to
    keep :name placeholders verbatim and supply values through the declared bind channel.'
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$path'']) but actual refs [] contain only static template entries [] — SQL
    likely returned no rows or row parsing dropped the path column; check `:name`
    bindings on /bin/sql and the SELECT columns". Root cause: tool_plan discovery
    declares args=[] with the SQL in stdin and bind="match"; the script inverted this
    — failing fragment `result = vm.exec(path="/bin/sql", args=[sql], stdin=bindings)`
    puts the SQL in argv and the `brand=...\nline=...\nlens_color=...` binding lines
    in stdin. /bin/sql reads its query from stdin, so it received the binding lines
    as the statement, executed nothing, and OBSERVED_RPC_OUTPUTS is <empty>. Empty
    rows → refs=[] → template needs $path → answer_refs failure. Rule linkage: enforce
    that CODEGEN routes SQL and :name bind values through the exact channels the tool_plan
    discovery declares.'
  status: inactive
- agents_md_anchor: null
  content: When a tool_plan /bin/sql discovery step declares an empty argv and relies
    on :name placeholders resolved from params, keep argv exactly as the plan specifies
    and do not append name=value binding pairs into argv; let the harness substitute
    the :name bindings from params so the query returns rows instead of an empty result
    set.
  created: '2026-06-06'
  deactivated_reason: 'The new rule strictly supersedes r001 and r002: both only barred
    relocating the query/bindings into argv, whereas the new rule covers that case
    plus the newly observed stdin literal-inlining failure under one directive to
    keep :name placeholders verbatim and supply values through the declared bind channel.'
  id: r002
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$path'']) but actual refs [] contain only static template entries [] — SQL
    likely returned no rows or row parsing dropped the path column; check `:name`
    bindings on /bin/sql and the SELECT columns". Root cause: the tool_plan discovery
    step declared `args: []` with SQL in stdin and `:brand/:line/:lens_color` placeholders
    to be bound from params, but the codegen built `bind_args = ["brand="+brand, "line="+line,
    "lens_color="+lens_color]` and passed them as argv (OBSERVED_RPC shows args=[''brand=3M'',''line=...'',''lens_color=Yellow'']).
    Failing fragment: `vm.exec(path="/bin/sql", args=bind_args, stdin=sql)`. /bin/sql
    received populated argv instead of the plan''s empty argv, so the :name placeholders
    were never substituted, the query matched zero rows, the <NO> branch ran with
    refs=[], and the fidelity check failed the required $path runtime ref. Rule linkage:
    existing in-session rule covers the inverse mistake (SQL moved into argv with
    bindings in stdin); this run kept SQL correctly in stdin but injected extraneous
    name=value pairs into argv, a distinct deviation from the plan''s declared empty
    argv — so a sharper, complementary rule is warranted rather than a skip.'
  status: inactive
- agents_md_anchor: '#important-things > reference'
  content: When parsing /bin/sql stdout in CODEGEN, split rows on comma (CSV) and
    discard the first header line whose fields equal the SELECT column names; never
    split on '|' or treat the header as data, since /bin/sql emits comma-separated
    output with a leading column-name row and pipe-splitting yields fewer than the
    expected fields so every data row is dropped and refs come back empty.
  created: '2026-06-06'
  deactivated_reason: r003 instructs to split /bin/sql output on comma, which fails
    when the first column contains commas. This new rule supersedes it by mandating
    csv.reader for robust CSV parsing.
  id: r003
  reasoning: 'Verbatim error: "template/constraints require runtime refs ([''$record_path''])
    but actual refs [] contain only static template entries []". OBSERVED_RPC_OUTPUTS
    shows /bin/sql returned CSV: header line ''product_sku,product_name,record_path''
    then data row ''HND-274DRRGP,Bahco Workshop... ,/proc/catalog/Bahco/HND-274DRRGP.json''.
    Failing fragment: `parts = [p.strip() for p in line.split(''|'')]` then `if len(parts)
    < 3: continue`. Output is comma-delimited, so split(''|'') yields 1 part per line
    → every row skipped → match=None → refs=[]. Row existed; parser dropped it. Root
    cause is output-format mismatch (CSV vs pipe), not binding routing — so r001/r002
    do not cover this. New rule fixes the CSV parsing technique.'
  status: inactive
- agents_md_anchor: null
  content: Always pass a /bin/sql discovery query through stdin exactly as the tool_plan
    specifies, keeping its :name placeholders intact and supplying each value through
    the plan's declared bind channel; never relocate the query or its bindings into
    argv in any form — not inlined as quoted SQL literals, not as appended name=value
    pairs, and not by splitting the SQL into argv while bindings go to stdin — because
    /bin/sql reads its statement only from stdin, so any argv-based variation returns
    just the header row with zero data and leaves refs empty.
  created: '2026-06-07'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$matches[*].record_path'']) but actual refs [] contain only static template
    entries [] — SQL likely returned no rows or row parsing dropped the path column;
    check `:name` bindings on /bin/sql and the SELECT columns". OBSERVED_RPC_OUTPUTS
    confirms the call returned only the header line `product_sku,record_path,product_name,...`
    with zero data rows. Root cause: CODEGEN fabricated a false premise (code comment:
    "/bin/sql does not accept :name bindings (verified) -> inline as quoted literals")
    and abandoned the plan''s stdin+:name discovery, building the full statement and
    passing it via argv (failing fragment: `result = vm.exec(path="/bin/sql", args=[sql])`).
    /bin/sql reads its query from stdin, so an argv-only invocation executed no statement
    and emitted only the column header, producing matches=[] and refs=[]. Rule linkage:
    r001 covers SQL-in-argv-while-bindings-in-stdin and r002 covers empty-argv-with-appended-name=value
    pairs, but neither covers this third variation (whole query inlined as literals
    into argv with no stdin). A single rule forbidding ANY argv-based relocation of
    the query or bindings strictly supersedes both prior mechanical rules.'
  status: active
- agents_md_anchor: null
  content: When a tool_plan /bin/sql discovery step declares :name placeholders bound
    through a declared bind channel, emit the SELECT via stdin with its :name placeholders
    kept verbatim and supply every value through that bind channel; never substitute
    the param values into the statement as inlined quoted SQL literals (whether in
    stdin or argv) and never relocate the query or its bindings into argv, because
    /bin/sql resolves rows only through the harness binding-substitution path, so
    any inlined-literal or argv variation returns just the header line with zero data
    rows and leaves refs empty.
  created: '2026-06-07'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$matches[*].record_path'']) but actual refs [] contain only static template
    entries [] — SQL likely returned no rows or row parsing dropped the path column".
    Root cause: CODEGEN replaced the plan''s :name placeholders with inlined single-quoted
    literals built via esc() and shipped the resulting statement through stdin (args=[]).
    OBSERVED_RPC_OUTPUTS shows the query ran but emitted only the header row ''product_sku,record_path,product_name,brand,series,model,product_kind_name,adhesive_type''
    with zero data rows, so matches=[] and refs=[]. /bin/sql returns rows only through
    the harness :name binding substitution; an inlined-literal statement bypasses
    that path and yields header-only output. Failing fragment: the esc()-built `sql`
    string ("... WHERE pv.brand = ''" + esc(brand) + "'' ...") passed as stdin instead
    of the plan''s parameterized query with bind ''matches''. Rule linkage: r001/r002
    and the in-session rule only forbade argv relocation; this run shows the same
    root cause (bypassing :name binding) manifesting via stdin literal inlining, so
    a unified binding-preservation rule is needed that forbids inlining in both stdin
    and argv. r003 (CSV header parsing) is orthogonal and stays active.'
  status: active
