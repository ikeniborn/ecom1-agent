entries:
- content: Always verify that any property key used in a WHERE clause for product_properties
    is present in the known property keys list (color_family, material, volume_ml,
    length_mm, diameter_mm, voltage_v, size, power_source, use_area, power_w) before
    constructing the action; if the key is not in the list, rephrase the search (e.g.,
    use the properties JSON field or broaden the criteria) to avoid empty results.
    This applies to spec_goals like 'Determine whether a Valve and Connector product
    from Geberit in the Geberit Mapress Silent IC5-GU6 Valve and Connector line with
    connector type thread adapter exists in the catalogue.'
  created: '2026-05-21'
  deactivated_reason: null
  id: r001
  reasoning: 'ERROR: ''Empty result: sku,name,brand,series,value_text''. Root cause:
    wrong-key — the property key ''connector_type'' is not among the known property
    keys listed in the schema (color_family, material, volume_ml, length_mm, diameter_mm,
    voltage_v, size, power_source, use_area, power_w), causing the JOIN to yield zero
    rows. Failing fragment: action SQL WHERE clause ''pp.key = ''connector_type''''
    in the spec_goal ''Determine whether a Valve and Connector product from Geberit
    in the Geberit Mapress Silent IC5-GU6 Valve and Connector line with connector
    type thread adapter exists in the catalogue.'' Rule linkage: the new rule will
    require validation of property keys against the schema before constructing queries.'
  source: learn
  status: active
