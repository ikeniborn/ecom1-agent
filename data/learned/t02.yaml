- agents_md_anchor: null
  content: When searching for product variants by property value, do not rely on exact
    string matching in the initial query. Instead, first retrieve all variants matching
    the brand, product kind, and product family, then filter by property value using
    case-insensitive or partial matching.
  created: '2026-06-22'
  deactivated_reason: Superseded by comprehensive case-insensitive partial matching
    rule for all string fields.
  id: r001
  reasoning: The plan used a single SQL query with exact matches on all fields including
    property value 'petrol'. The query returned no rows, causing the decision to branch
    to 'not_found' and outcome OUTCOME_NONE_UNSUPPORTED. The root cause is likely
    that the property value is stored differently (e.g., 'Petrol', 'petrol ', or a
    different representation). The plan should have first retrieved all variants for
    the given brand/kind/family, then filtered the property value with flexible matching.
  status: inactive
  surface: ir
