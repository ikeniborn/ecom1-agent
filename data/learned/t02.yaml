- agents_md_anchor: null
  content: Never populate match_count for an existence check by applying the count
    primitive to a discovery rowset that may be empty. Instead, emit a dedicated COUNT(*)
    discovery query that always returns exactly one scalar row to bind match_count,
    and fetch the first candidate record separately. This guarantees match_count is
    always bound to an integer so the success-criteria nonempty check passes even
    when zero rows match.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The broad discovery SQL returned zero rows, causing the auto_delim rowset
    parser to leave discovery_rows unbound. The count primitive over an unbound variable
    produced no value, so $match_count was empty and failed the 'nonempty' success-criterion.
    Using a separate COUNT(*) query ensures match_count is always defined as 0 or
    more. Rule [v003] is stale because it references a different product catalog entry
    and a required_ref constraint absent from the current TOOL_PLAN.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Never compute match_count for an existence check from a unified SQL query
    that also retrieves candidate records via CTEs, scalar subqueries, or dummy-table
    LEFT JOINs. Always plan two separate discovery RPCs: one that performs SELECT
    COUNT(*) AS match_count with the broad normalized WHERE clause so it always returns
    exactly one scalar row, and another that performs SELECT record_path, ... LIMIT
    1 for first_record. Bind match_count directly from the scalar row of the first
    query, ensuring it is always a defined integer even when zero candidates exist.'
  created: '2026-06-19'
  deactivated_reason: superseded by simplified pinned rc1
  id: r008
  reasoning: 'verify error: $match_count failed the nonempty check. Root cause: The
    PlanIR emitted a single discovery SQL query that combined a COUNT(*) scalar subquery
    with a LEFT JOIN against a dummy row (SELECT 1) to conditionally project the first
    candidate record. This unified CTE pattern intended to guarantee one output row,
    but the observed RPC output for /bin/sql was empty, causing the ''catalog_rows''
    rowset to be empty. Emptiness propagated through column→first→to_number, leaving
    $match_count unbound. Existing rule [in-session] only prohibited using the ''count''
    primitive on a possibly-empty rowset; it did not ban this scalar-subquery/CTE/dummy-join
    workaround, so the planner applied it and failed. Strict separation into two dedicated
    queries eliminates reliance on fragile multi-purpose SQL shapes and guarantees
    match_count is always bound.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never deliver SQL text to a `/bin/sql` Exec RPC via a `stdin` field; instead
    construct the complete statement as one SQL string with all search tokens inlined
    using standard SQL quoting and concatenation, and append it as the last positional
    argument in the `args` array after any flags like `-header`.
  created: '2026-06-19'
  deactivated_reason: superseded by simplified pinned rc1
  id: r009
  reasoning: 'The PlanIR passed discovery SQL through a `stdin` key inside the `Exec`
    RPC args, but the interpreter did not deliver it to the process, so `/bin/sql`
    printed its usage banner (''SQL not delivered via stdin'') and the queries never
    executed. The failing fragments are the two discovery blocks with `"stdin": ".param
    init..."`. Moving the SQL to a positional argument in `args` guarantees the tool
    receives the text. Because `args`-passed SQL bypasses sqlite3 shell dot-command
    processing, `.param` bindings cannot be used; literals must be inlined directly
    in the WHERE clause.'
  status: inactive
  surface: ir
