- agents_md_anchor: null
  content: 'Existence ("is X / do you carry X"). ONE discovery query: SELECT record_path
    FROM product_variants WHERE LOWER(TRIM(brand)) LIKE ''%<brand>%'' AND (LOWER(TRIM(model))
    LIKE ''%<code>%'' OR LOWER(TRIM(series)) LIKE ''%<word>%'') — brand + ONE distinctive
    model code or series word (take real values from facts CATALOGUE_CANDIDATES if
    present); NO other predicates. compute: count(rows)->n; first(rows)->r. decision:
    n ge 1 -> found else absent. answer (ONE top-level mapping, NO Answer op): found
    -> OUTCOME_OK, message contains <YES>, refs [$r.record_path]; absent -> OUTCOME_OK,
    message contains <NO>, refs []. INTENT: required_refs[OUTCOME_OK]=[]; outcome_space
    [OUTCOME_OK]. Never CLARIFICATION/UNSUPPORTED. Keep the plan minimal.'
