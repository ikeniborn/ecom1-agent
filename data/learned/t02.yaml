- agents_md_anchor: null
  content: Always parse /bin/sql stdout with Python's csv.reader when the SELECT returns
    multiple columns that may contain commas (e.g., concatenated answer text). Never
    use str.split(',') for such output, because embedded commas in the first column
    will misparse the columns, leading to truncated answer text and missing or incorrect
    record_path refs.
  created: '2026-06-07'
  deactivated_reason: null
  id: r011
  reasoning: 'ERROR: grader: answer missing required reference ''/proc/catalog/Schneider
    Electric/ELC-1ECVU00O.json''. Root cause: The script splits stdout lines on '',''
    with split('',''), but the SQL''s first column (answer_text) is a concatenated
    string with commas (e.g., ''SKU: ELC-1ECVU00O, ... Record: ...''). This splitting
    breaks the record_path field, resulting in an incorrect or empty record_path and
    the required reference is missing. Failing fragment: lines[1].split('','') and
    subsequent index [1] extraction. The new rule replaces r003''s naive comma-split
    with csv.reader to properly handle quoted or embedded commas.'
  status: active
