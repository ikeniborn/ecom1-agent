- agents_md_anchor: null
  content: When the test harness for a SQL discovery step expects an integer row count
    (e.g., test_sql asserts result is a non-negative integer) and the tool_plan specifies
    a SELECT statement that returns columns, convert that step to SELECT COUNT(*)
    while keeping the same bind; then, if the count is positive, run an additional
    vm.exec with the original SELECT to retrieve the rows needed for refs, passing
    the SQL via stdin as per existing rules.
  created: '2026-06-07'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: test_sql assertion ''count must be non-negative integer'' got
    ''/proc/catalog/Raaco/STO-UQOPJLUX.json''. Root cause: the script executed the
    plan''s SELECT DISTINCT columns query, returning CSV string, but the intent test
    (test_sql) expected a count. The failing fragment: query_result = vm.exec(path=''/bin/sql'',
    args=[...]) produced the CSV header+path; the test harness then bound that CSV
    string to ''query_result'' and test_sql failed because it expected an integer.
    No existing rule converts a column-returning SQL step to COUNT(*) when a count
    test is present. The corrective rule instructs CODEGEN to replace the SQL with
    COUNT(*) for the bound step and conditionally fetch the rows if needed.'
  status: active
- agents_md_anchor: '#important-things > include tokens'
  content: When the tool_plan includes an agents_md_constraint that requires <YES>
    or <NO> in the answer, generate the message string to contain the token <YES>
    if the condition is met or <NO> if not; e.g., use f'... <YES>' or f'... <NO>'.
    Do not rely on the caller to inject these tokens.
  created: '2026-06-07'
  deactivated_reason: null
  id: r007
  reasoning: 'The error ''AssertionError: missing required token in message'' occurred
    because the generated answer message did not include <YES> or <NO> as required
    by the agents_md_constraint under #important-things > include tokens. The script
    constructed a message without the token, resulting in a fidelity failure. The
    root cause is that the CODEGEN phase did not translate the constraint into code.
    A new rule is needed to ensure tokens are explicitly embedded in the message string.'
  status: active
