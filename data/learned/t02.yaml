- agents_md_anchor: null
  content: When a LIKE pattern contains 'and' and the initial query returns no rows,
    try replacing 'and' with '&' and re-query before giving a NO answer.
  created: '2026-06-07'
  deactivated_reason: null
  id: r008
  reasoning: The ERROR 'answer missing required reference' indicates that the expected
    product was not found and thus the script answered NO, leaving an empty refs list.
    The root cause is that the database likely stores the product name with '&' (e.g.,
    'Hammer Measuring & Cutting Tool') while the provided LIKE pattern uses 'and'
    ('%Hammer Measuring and Cutting Tool%'), causing the SQL query to return no rows
    despite the product's existence. The corrective technique adds a fallback query
    that substitutes '&' for 'and' to handle this common catalogue spelling variation
    before finalising a NO answer.
  status: active
- agents_md_anchor: null
  content: When a /bin/sql Exec step in the tool_plan includes the SQL statement as
    an element in args, ignore args entirely and instead put the SQL statement (with
    its :name placeholders intact) into the stdin stream, followed by a newline and
    then the bind values as key=value lines; pass an empty list for args to vm.exec.
    This ensures the SQL is read from stdin, which /bin/sql requires.
  created: '2026-06-07'
  deactivated_reason: null
  id: r009
  reasoning: 'The error was ''last result empty'' because the /bin/sql execution returned
    no output: the script passed the SQL query as a command-line argument (args) while
    the tool_plan erroneously placed the query there, violating rule r004 which mandates
    that SQL must come via stdin. The script must instead move the SQL from args to
    stdin, with bind values appended after a newline, and pass an empty args list.
    This corrects the execution path.'
  status: active
- agents_md_anchor: null
  content: When a /bin/sql Exec step includes :name placeholders, pass the SQL statement
    via stdin with placeholders intact and supply the bind values through the vm.exec's
    bindings argument; do not append key=value lines to the stdin stream after the
    SQL.
  created: '2026-06-07'
  deactivated_reason: r010 instructs not to append key=value lines, but the correct
    method for this environment is to append them; this new rule supersedes it.
  id: r010
  reasoning: The error 'assert last, last result empty' occurs because the generated
    script appended the binding key=value lines directly to stdin after the SQL, violating
    r004/r005 which forbid appending name=value pairs. The /bin/sql mock or harness
    expects bindings to be passed via a separate bindings channel (the bindings argument
    of vm.exec), not embedded in the stdin stream. As a result the parameters are
    not substituted, the query returns no rows, and the downstream test fails.
  status: inactive
