entries:
- content: 'Never merge product existence lookup with available_today > 0 inventory
    filter in a single action when STOP_RULES distinguish OUTCOME_NONE from unavailable;
    always split into two actions: first find product by brand/series/property without
    inventory filter, then check available_today separately on matched SKUs. Also
    use LOWER(pp.value_text) = LOWER(''target'') or LIKE for property value matches
    to avoid case-mismatch empty results.'
  created: '2026-05-26'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''Empty result: sku,path,name,series,price_cents,price_currency,available_today''.
    Root cause: wrong-filter. Failing fragment: action ''JOIN inventory i ON p.sku
    = i.sku WHERE ... AND i.available_today > 0'' collapses product-absent and product-exists-but-unavailable
    into the same empty result, making STOP_RULES distinction impossible. Additionally,
    pp.value_text = ''pruning saw'' uses exact equality on a property value that may
    be stored with different casing or phrasing. Rule linkage: spec_goal requires
    confirming product absent OR reporting unavailable — but the single filtered action
    cannot surface the unavailable case.'
  source: learn
  status: active
task_id: t02
