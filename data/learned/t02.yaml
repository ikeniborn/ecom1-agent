- agents_md_anchor: null
  content: 'When matching a product family by name, use a two-step discovery: first query the product_families
    table with a broad LIKE pattern to retrieve the exact family name, then use that exact name in subsequent
    joins. This avoids failures due to minor name formatting differences.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r011
  reasoning: The plan's single SQL query used LIKE '%Bahco Workshop BAH 3VZ-SPH Hammer Measuring and Cutting
    Tool%' to match the product family name, but no rows were returned, causing the decision to fall through
    to OUTCOME_NONE_UNSUPPORTED. The root cause is likely a mismatch between the provided product line
    string and the actual family name in the database. A two-phase discovery would first retrieve the
    exact family name, ensuring a reliable match.
  status: active
  surface: ir
