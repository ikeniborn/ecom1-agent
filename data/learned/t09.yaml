  id: r017
  reasoning: 'Error: plan: primitive ''concat'' takes 2 arg(s), plan supplies 1. Root
    cause: In the compute section, concat is called with a single argument (the policy
    doc path string) to produce $policy_doc_path. The concat primitive requires exactly
    two arguments to concatenate. The intended operation is to assign a literal string,
    which should use the ''literal'' primitive instead. This is a PlanIR shape bug,
    not a data grounding issue. The rule will guide future plans to use ''literal''
    for single string constants.'
  status: active
