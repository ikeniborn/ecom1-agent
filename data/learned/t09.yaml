entries:
- content: Always run tree:/docs/ first, then identify and read the file in /docs/policy-updates/
    whose filename contains 'wood' or 'drywall' or 'screw'. The count in that policy
    document is the authoritative catalogue count. Include that policy doc path in
    grounding_refs. Do NOT rely on SQL property counting for the catalogue count report.
  created: '2026-05-23'
  deactivated_reason: The new rule generalizes the workflow for any product type and
    any policy document under /docs/, making the product-specific r001 and the narrow
    policy-updates-only r002 obsolete.
  id: r001
  reasoning: The SQL counted distinct screw_type property values (2) not actual products.
    Policy-updates doc gives the authoritative count.
  source: manual
  status: inactive
- content: Always use tree:/docs/ as the first action when the spec_goal requires
    locating a policy document in /docs/policy-updates/; never emit list:/docs/policy-updates/
    because it returns an empty result.
  created: '2026-05-23'
  deactivated_reason: The new rule generalizes the workflow for any product type and
    any policy document under /docs/, making the product-specific r001 and the narrow
    policy-updates-only r002 obsolete.
  id: r002
  reasoning: 'Verbatim error: ''Empty result: 2025-06-22-catalogue-reporting-nuts-bolts-washers-graz.md''.
    Root cause category: wrong-action. The plan generated the action ''list:/docs/policy-updates/''
    instead of the required ''tree:/docs/'' first step, which returned an empty directory
    listing and blocked all downstream policy-file identification. Failing fragment:
    PLAN_OUTPUT action ''list:/docs/policy-updates/''. The new rule hard-codes tree:/docs/
    as the first action and explicitly prohibits list:/docs/policy-updates/ to prevent
    this empty-result failure.'
  source: learn
  status: inactive
- content: Always use tree:/docs/ as the first action when the spec_goal requires
    locating an authoritative policy addendum in /docs/ for a catalogue product count;
    never emit find with a product-keyword pattern under /docs/. The count stated
    in the identified policy document is the authoritative catalogue count. Do NOT
    rely on SQL queries against products or kinds for the final catalogue count report.
    Include the policy doc path in grounding_refs.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r003'
  id: r003
  reasoning: 'The agent emitted action `find:*nut* /docs/` which produced the verbatim
    error `Empty result: `. Root cause category is `wrong-action` because the correct
    first action should have been `tree:/docs/`. The spec_goal stated `locating the
    authoritative policy addendum in /docs/` and the success criterion included `Query
    the products and kinds tables to count all products whose kind matches Nut, Bolt,
    or Washer`, but the agent used a glob find that returned nothing and planned to
    rely on SQL counts. The new rule prohibits using find with product-keyword patterns
    under /docs/ for this spec_goal and mandates tree:/docs/ first, while also forbidding
    SQL reliance for the final count.'
  source: learn
  status: inactive
- content: Never emit list:/docs/catalogue-addenda/ or any other presumed subdirectory
    path under /docs/; always use tree:/docs/ as the first action when the spec_goal
    requires locating an authoritative policy addendum in /docs/ for a catalogue product
    count.
  created: '2026-05-23'
  deactivated_reason: Superseded by the new rule, which covers the search action that
    r005 failed to prevent and also retains the list prohibition from r004.
  id: r004
  reasoning: '1. Verbatim error: ''Execute exception [''List the /docs/catalogue-addenda/
    directory to locate the r]: list failed: not found''. 2. Root cause category:
    wrong-action — the agent assumed a fixed subdirectory that does not exist. 3.
    Failing fragment: SDD_OUTPUT action ''list:/docs/catalogue-addenda/'' and PLAN_OUTPUT
    action ''list:/docs/catalogue-addenda/''. 4. Rule linkage: The new rule explicitly
    bans the failing ''list:/docs/catalogue-addenda/'' action and reinforces that
    ''tree:/docs/'' must be the first action for this spec_goal.'
  source: learn
  status: inactive
- content: Never emit list:/docs/catalogue-addenda/ or any other presumed subdirectory
    path under /docs/, and never emit find with a product-keyword pattern under /docs/;
    always use tree:/docs/ as the first action when the spec_goal requires locating
    an authoritative policy addendum in /docs/ for a catalogue product count. The
    count stated in the identified policy document is the authoritative catalogue
    count. Do NOT rely on SQL queries against products or kinds for the final catalogue
