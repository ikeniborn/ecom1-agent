- agents_md_anchor: null
  content: 'Count ("how many X"). ONE discovery query: SELECT COUNT(*) AS n FROM product_variants
    WHERE the kind/type is matched by name (LOWER/TRIM LIKE). compute: get n as an
    INTEGER. answer OUTCOME_OK; set answer.message to the LITERAL template from the
    instruction with a single {n} slot — e.g. answer.message = ''<COUNT:{n}>'' (the
    interpreter fills {n} with the integer). Do NOT build the message with concat/char
    primitives (that yields a char-list). If the instruction/policies cite a governing
    /docs counting policy, INTENT sets required_refs[OUTCOME_OK]=[{kind:policy_doc,
    path:<that /docs...md>}]; else []. outcome_space [OUTCOME_OK]. Never CLARIFICATION.
    Keep the plan minimal.'
  created: '2026-06-18'
  deactivated_reason: null
  id: rc1
  pinned: true
  reasoning: 'Convergence-simplified + targeted fixes: count uses a literal {n} template
    (not concat -> no char-list bug); claim restores the extra-property check (present+extra=YES
    / present+no-extra=NO) and cites the base record on both. Pinned canonical.'
  status: active
  surface: ir
