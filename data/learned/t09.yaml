  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: 'Error: ''plan: PLAN LLM returned empty response''. Root cause: the planner
    faced a cross-source dependency—extract product_kind_id from a policy document,
    then count matching catalogue records—but had no pre-phase content from that document
    and no mandated multi-step pattern, leaving it unable to materialize a concrete
    PlanIR. The SCRIPT_CODE is completely empty. A rigid extraction→bind→query→format
    sequence prevents the LLM from collapsing the two sources into an ungrounded or
    omitted plan. Eagerly reading the literal policy path supplies the necessary fact
    for grounding.'
