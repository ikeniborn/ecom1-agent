  content: When a read policy document imposes additional relational filters—such
    as inventory availability thresholds, store location restrictions, or open-store
    status—on a catalogue count objective, the discovery SQL must JOIN the relevant
    inventory and store tables and encode every policy filter in the WHERE clause,
    using DISTINCT when the policy requires counting each SKU once across multiple
    branches. Do not emit an unconstrained base-table count after ingesting a qualifying
    policy.
  created: '2026-06-19'
  deactivated_reason: superseded by simplified pinned rc1
  id: r007
  reasoning: The verify failure ($count >= 0) reflects an incorrect/ungrounded count
    because the discovery SQL counted all product_variants for the named kind while
    ignoring the Graz inventory and store-openness constraints introduced by the read
    policy document /docs/ops-policy-notes/catalogue-count-nuts-bolts-washers-graz-2025-06-22.md.
    The PlanIR bound the policy into $policy_doc but never translated its requirements
    into SQL predicates (no JOIN to inventory/stores, no available_today_quantity
    > 0 filter, no DISTINCT per-SKU semantics). This produced a wrong cardinality.
    The corrected PlanIR must materialize every policy restriction as a SQL predicate
    and reference the policy document in required_refs[OUTCOME_OK].
  status: inactive
  surface: ir
