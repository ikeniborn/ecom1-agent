- agents_md_anchor: null
  content: When extracting a value from a single row, use 'get' instead of 'column';
    'column' expects a list of rows.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: interpret: compute step ''column'' failed: ''column'' expects
    list[dict]; use ''get'' for a single row. Root cause: The PlanIR used ''first''
    to reduce rows to a single row, then applied ''column'' to that single row. ''column''
    requires a list of dicts. The correct primitive for a single row is ''get''. Failing
    PlanIR fragment: {"prim":"first","args":["$rows"],"into":"first_row"}, {"prim":"column","args":["$first_row","cnt"],"into":"count"}.
    No existing rule covers this.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include a 'value' field in the answer section set to the numeric
    result when the success criteria reference $answer.value, and include all required
    refs from the intent spec in the answer's refs array.
  created: '2026-06-24'
  deactivated_reason: null
  id: r006
  reasoning: 'Verify failed because success_criteria[OUTCOME_OK][0] expects $answer.value
    (numeric) but the PlanIR answer section only contains ''message'' and an empty
    ''refs'' array. Rule r003 already mandates using ''value'' and including required
    refs, but the PlanIR did not follow it. This new rule reinforces the exact structure
    needed: a ''value'' key with the numeric count and a ''refs'' array containing
    the policy_doc ref from the intent spec.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include both a 'value' field (numeric) and a 'message' field (string)
    in the answer section for each outcome when the success criteria reference $answer.value;
    set 'value' to the numeric result and 'message' to a string following the msg_skeleton
    from the intent spec, and include all required refs from the intent spec in the
    answer's refs array.
  created: '2026-06-24'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: verify failed because success_criteria[OUTCOME_OK][0] expects
    $answer.value (ge 0) but the answer section only contained a ''message'' field,
    no ''value'' field. Root cause: PlanIR answer block omitted the ''value'' field.
    Failing fragment: "answer":{"ok":{"message":"<COUNT:{count_value}>","outcome":"OUTCOME_OK","refs":[...]}}.
    Existing rule r003 advised using ''value'' not ''message'', but that rule is misleading
    because both fields are required: ''value'' for numeric success criteria and ''message''
    for the msg_skeleton. New rule supersedes r003 with precise requirement for both
    fields.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include a 'value' field in the answer section for each outcome,
    set to the numeric result, when the success criteria reference $answer.value;
    also include a 'message' field if msg_skeleton is defined, and include all required
    refs from the intent spec.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Verify failure: success_criteria[OUTCOME_OK][0] expects $answer.value
    >= 0, but the PlanIR answer object only contains ''message'' and ''outcome'' and
    ''refs'', missing the ''value'' field. Root cause: the PLAN phase did not add
    a ''value'' key to the answer, despite existing rules r003 and in-session requiring
    it. The SQL returned count=1, so the numeric result was available but not placed
    in the answer. The new rule explicitly mandates the ''value'' field and also the
    ''message'' field per msg_skeleton, ensuring compliance with success criteria.'
  status: active
  surface: ir
