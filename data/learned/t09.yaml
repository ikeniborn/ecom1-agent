  content: When a PlanIR discovery step runs a CLI that reads its program text from
    standard input (such as a SQL runner), deliver that text through the Exec RPC's
    dedicated stdin channel exactly as the interpreter contract requires, never as
    a nested key buried inside the positional args payload, otherwise the process
    receives empty stdin and emits its usage banner instead of returning rows.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'Verbatim error: ''interpret: sql returned usage banner — SQL not delivered
    via stdin''. Root cause: the failing PlanIR fragment placed the query string as
    a sibling key inside the Exec args object — {"rpc":"Exec","args":{"path":"/bin/sql","args":["--params",...],"stdin":"SELECT
    DISTINCT pv.product_sku ..."}}. The interpreter did not route that nested ''stdin''
    field to the /bin/sql process''s actual standard input, so the binary ran with
    no input and printed its usage banner; sql_out then carried the banner, not rowset
    data, so the rowset/count never grounded. This is a pure PlanIR-shape bug in how
    the Exec step wires stdin, distinct from r012 (discovery→query→projection sequencing,
    which is correct here) and rc1 (catalogue normalized-match method). New rule fixes
    the stdin-delivery mechanism the sequence depends on.'
  status: inactive
  surface: ir
