- agents_md_anchor: null
  content: Do not use named bind parameters (e.g., :product_kind_name) in Exec discovery
    queries against /bin/sql when the SQL is supplied via stdin, because the CLI does
    not resolve them; instead, embed the filter values directly into the query string
    in the PlanIR so the SQL engine executes with valid literals and returns a countable
    rowset.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: The verify failure shows $count was null, failing the 'ge 0' success
    criterion. The OBSERVED_RPC_OUTPUTS show the [Exec /bin/sql] step produced completely
    empty stdout, indicating the SQL did not return a parseable result. The PlanIR
    emitted a query containing ':product_kind_name' but provided an empty args array,
    leaving the parameter unbound. Because /bin/sql reads the statement from stdin
    and cannot resolve named parameters, the execution yielded no rows; the subsequent
    first/get/to_number chain then produced a null $count. The policy doc was read
    successfully, so the failure is purely a PlanIR SQL-construction bug.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always compute a `message` variable in the compute section that holds the
    fully materialized answer text matching the answer_shape msg_skeleton, then bind
    `answer.ok.message` to `$message`; never place the raw msg_skeleton literal with
    curly-brace placeholders directly into the answer object. Also ensure `answer.ok.refs`
    includes every `required_refs` entry from TOOL_PLAN for the chosen outcome.
  created: '2026-06-19'
  deactivated_reason: superseded by pinned rc1
  id: r009
  reasoning: verify failed because $message was empty. The PlanIR computed `count`
    via SQL and to_number, but never produced a compute variable named `message`.
    Instead it placed the raw skeleton literal `<COUNT:{count}>` into `answer.ok.message`.
    The verify phase evaluates the compute variable `$message`, which was absent,
    causing the nonempty criterion to fail. Additionally, `answer.ok.refs` was empty
    while TOOL_PLAN required a policy_doc reference for OUTCOME_OK.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not pass fewer or greater than exactly two arguments to the PlanIR `concat`
    primitive in compute steps. To assemble a formatted message from multiple fragments
    (e.g., prefix, variable, suffix), chain sequential binary `concat` operations
    using intermediate binds. Do not use a single-argument `concat` to materialize
    a literal string; place string literals directly into `answer.ok.refs` or other
    answer fields.
  created: '2026-06-19'
  deactivated_reason: superseded by pinned rc1
  id: r010
  reasoning: 'ERROR: plan: primitive ''concat'' takes 2 arg(s), plan supplies 3; primitive
    ''concat'' takes 2 arg(s), plan supplies 1. Root cause: the PlanIR compute section
    treated `concat` as variadic and as an identity pass-through. Failing fragments:
    (1) `{"prim":"concat","args":["<COUNT:","$count_str",">"],"into":"message"}` with
    3 arguments, and (2) `{"prim":"concat","args":["/docs/current-updates/catalogue-counting-2025-06-22-wood-drywall-screws-linz.md"],"into":"policy_doc_path"}`
    with 1 argument. The `concat` primitive is strictly binary. The 3-arg usage must
    be split into two chained binary concats (e.g., concat("<COUNT:", $count_str)
    into temp, then concat($temp, ">") into message). The 1-arg usage was an unnecessary
    attempt to create a bind for a literal path; `answer.ok.refs` can hold the literal
    string directly without a compute step. No existing rule governs `concat` arity,
    so a new rule is required.'
  status: inactive
  surface: ir
