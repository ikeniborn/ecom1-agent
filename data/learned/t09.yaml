- agents_md_anchor: null
  content: Always extract classification criteria from a policy doc and translate
    them into the filtering logic (e.g., SQL WHERE conditions) rather than hardcoding
    a guessed product_kind_id.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more specific rule that explicitly forbids guessing
    product_kind_id and requires extracting exact names/categories from the policy
    doc.
  id: r002
  reasoning: The error 'Answer should be "<COUNT:2>"' indicates the PlanIR returned
    a wrong count. The PlanIR read the policy doc but ignored its content, hardcoding
    'product_kind_id = \'nuts_bolts_washers\'' in the SQL query. The policy doc likely
    defines Nut, Bolt, Washer as separate product kinds or via product name, so the
    query missed the correct products. The root cause is failure to use the policy
    doc's classification rules to construct the filter.
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-phase'
  content: Always use the 'value' field (not 'message') in the answer section when
    the success criteria involve numeric operators (ge, le, eq, etc.), and always
    include all required refs from the intent spec.
  created: '2026-06-22'
  deactivated_reason: null
  id: r003
  reasoning: 'The verify phase failed with ''success_criteria[OUTCOME_OK][0] failed:
    {"op": "ge", "lhs": "$answer", "rhs": 0, "args": []}''. The PlanIR produced an
    answer with a ''message'' skeleton "{count}", yielding a string. The success criteria
    expects a numeric comparison, so the answer must provide a numeric ''value'' field.
    Additionally, the answer refs were empty, but the intent spec required a policy_doc
    ref. The rule ensures numeric answers use ''value'' and all required refs are
    included.'
  status: active
  surface: ir
