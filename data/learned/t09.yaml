- agents_md_anchor: null
  content: 'Count ("how many X"). ONE discovery query: SELECT COUNT(*) AS n FROM product_variants
    WHERE the kind/type is matched by name (LOWER/TRIM LIKE). compute: get n as an
    INTEGER. answer OUTCOME_OK with message in the instruction''s EXACT format with
    n integer (e.g. ''<COUNT:3>'', never 3.0). If the instruction/policies cite a
    governing /docs counting policy, INTENT sets required_refs[OUTCOME_OK]=[{kind:policy_doc,
    path:<that /docs...md>}]; else []. outcome_space [OUTCOME_OK]. Never CLARIFICATION.
    Keep the plan minimal.'
