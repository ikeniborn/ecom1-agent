  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r006'
  id: r006
  reasoning: 'Verbatim error: ''Empty result: /docs/policy-updates/2025-06-22-catalogue-reporting-nuts-bolts-washers-graz.md:5:Requested
    product kind: Nut Bolt and Wa''. Root cause category: wrong-action — the cycle
    emitted the action ''search:Nut /docs/'' (a product-keyword search under /docs/)
    and also planned a SQL query against kinds (''SELECT name FROM kinds WHERE name
    LIKE...'') instead of listing /docs/ to locate the policy addendum. Failing fragment
    citation: action string ''search:Nut /docs/''. Rule linkage: the new rule explicitly
    prohibits ''search:Nut /docs/'' and any product-keyword search/find under /docs/,
    mandates tree:/docs/ as the first action for this spec_goal, and forbids SQL reliance
    for the final count.'
  source: learn
  status: inactive
- content: 'Never satisfy the success criterion that requires executing a supplementary
    SQL count for the exact kind name by joining products with the kinds table; the
    kinds table does not exist in the database, so the query fails with ''no such
    table: kinds'', and the authoritative product count from the policy document is
    the sole source for the catalogue count report.'
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r007'
  id: r007
  reasoning: 'Verbatim error: ''SQL logic error: no such table: kinds (1)''. Root
    cause category: wrong-action — the success criterion and corresponding action
    prescribed a JOIN against the kinds table, which does not exist in the database.
    Failing fragment: success criterion ''The supplementary SQL count for the exact
    kind name is executed as required by catalogue reporting rules.'' and action ''SELECT
    COUNT(*) FROM products p JOIN kinds k ON p.kind_id = k.id WHERE k.name = ''Nut
    Bolt and Washer''''. The new rule directly prohibits satisfying that success criterion
    via any SQL join with the kinds table because the table is absent.'
  source: learn
  status: inactive
- content: 'When the spec_goal requires locating an authoritative policy addendum
