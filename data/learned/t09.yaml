  reasoning: 'Verbatim error: `real_vm: Protocol message ExecRequest has no "params"
    field.` Root cause: the PlanIR Exec discovery step passed args.params={kind_name,kind_id,city}
    alongside :named placeholders in stdin, but the VM''s ExecRequest schema exposes
    only path+stdin — any extra field is rejected before execution. Failing fragment:
    {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"...WHERE ...= :kind_name ...","params":{...}}}.
    Fix shapes the PlanIR to inline literals into stdin (e.g. = LOWER(TRIM(''nut bolt
    and washer''))) so the Exec args carry only the two supported fields. Complements
