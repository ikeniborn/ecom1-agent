- agents_md_anchor: null
  content: When parsing /bin/sql stdout into rows, split each line on commas because
    /bin/sql emits CSV, and select the target column by finding its name's index in
    the header row; never split on '|' or hardcode a column index, since a wrong delimiter
    collapses each row into a single field and drops the path column, leaving the
    runtime refs array empty.
  created: '2026-06-08'
  deactivated_reason: null
  id: r007
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$matched_variants_record_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". Root cause: discovery RPC actually returned 3 CSV rows (e.g. ''FST-1HE3ZSQ6,/proc/catalog/FST-1HE3ZSQ6.json'')
    — comma-delimited, with a header line ''product_sku,record_path''. Failing fragment:
    `cols = [c.strip() for c in line.split("|")]` followed by `if len(cols) >= 2:
    path = cols[1]`. Since output uses commas not pipes, split(''|'') yields one element
    per line, len(cols)>=2 is always False, record_paths stays [], so refs=[] despite
    valid rows. The COUNT path worked only because split(''|'')[0] happens to grab
    the whole single-field line. Rule linkage: complements r003/r006 (which mandate
    populating runtime refs) by fixing the upstream delimiter-parse bug that produced
    the empty refs they forbid.'
  status: active
