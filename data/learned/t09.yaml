- agents_md_anchor: null
  content: 'Never emit a Read (or any fetch) RPC just to include a static document
    path as a provenance reference; cite the path as a literal string directly in
    the answer refs array, because reading a path that is only an answer-template
    citation and not a VM-resident data source raises ''real_vm: read failed: not
    found''.'
  created: '2026-06-08'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''real_vm: read failed: not found''. Root cause: to
    satisfy prior verdict v005 (''answer missing required reference /docs/ops-policy-notes/...''),
    the script added a discovery Read RPC to fetch that doc path, but the path does
    not exist as VM data — it is only an answer-block citation. The Read therefore
    failed at runtime. Failing fragment: {"rpc":"Read","args":{"path":"/docs/ops-policy-notes/catalogue-count-wood-drywall-screws-linz-2025-06-22.md"},"bind":"policy_doc"}.
    Correct technique: the path belongs in answer.refs as a literal string (the SQL
    Exec already supplies runtime data); fetching it via Read is both unnecessary
    and fatal. Complements r002 (no non-plan RPCs / source refs from answer_template)
    by making explicit that reference paths are cited, not read, and naming the runtime
    read-failure signature rather than the fidelity-drift one.'
  status: active
