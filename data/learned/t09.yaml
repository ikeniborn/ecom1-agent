- agents_md_anchor: null
  content: When a PlanIR compute section references a variable that is bound by an
    Exec RPC in the ops section, restructure the PlanIR so that the Exec RPC is placed
    in the discovery section instead, because compute executes before ops and cannot
    access ops-bound variables. This prevents 'bad argument type' errors from undefined
    variables.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'Error: ''real_vm: bad argument type for built-in operation''. Root cause:
    The PlanIR compute section uses primitives ''first'' and ''get'' on ''$count_rows'',
    which is defined from ''count_raw'' bound by an Exec RPC in the ops section. However,
    compute executes before ops, so ''$count_rows'' is undefined at compute time,
    causing the built-in operation to receive a bad argument type. The failing fragment
    is the compute block: {"prim":"first","args":["$count_rows"],"into":"count_row"},
    {"prim":"get","args":["$count_row","count"],"into":"count"}. The rowsets section
    also references ''count_raw'' before it is bound. Existing rule r012 correctly
    requires sequencing discovery->query->projection but does not forbid compute from
    depending on ops-bound variables. This new rule enforces that any data needed
    for compute must be gathered in discovery, not ops.'
  status: inactive
