- agents_md_anchor: null
  content: Never use concat to construct a literal string; embed literal paths directly
    in the answer refs array. Concat is only for merging two rowsets.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'The PlanIR compute step used concat with a single string argument ''/docs/ops-policy-notes/catalogue-count-nuts-bolts-washers-vienna-2025-06-22.md'',
    but concat requires two list[dict] rowsets. The interpreter failed with ''missing
    1 required positional argument: b''. The correct approach is to embed the literal
    path directly in the answer refs array, avoiding compute for static values.'
  status: inactive
  surface: ir
