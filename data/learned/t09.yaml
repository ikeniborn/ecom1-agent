  content: When the objective requires deriving a filter key from a policy or configuration
    document before querying a downstream table, the PlanIR must sequence a discovery
    step that extracts the key into a named variable, then a query step that uses
    that variable in its predicate, and finally a projection step that formats the
    aggregate result into the required answer template.
