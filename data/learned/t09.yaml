- agents_md_anchor: null
  content: When the frozen answer_template lists only data-source refs (e.g. /proc/*),
    do not pass them verbatim to vm.answer; first discover relevant provenance documentation
    paths (glob /docs/current-updates for files matching the task entity/kind) and
    append every match to the answer refs, since graders require documentation references
    absent from the tool_plan.
  created: '2026-06-06'
  deactivated_reason: r001 instructs adding a glob/search discovery RPC to find provenance
    docs, but that extra RPC is not in the frozen tool_plan and the fidelity grader
    rejects any RPC-multiset deviation; r001 directly causes 'fidelity drift (RPC
    multiset)' and is superseded by the no-extra-RPC rule.
  id: r001
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/current-updates/catalogue-counting-2025-06-22-nuts-bolts-washers-graz.md''".
    Root cause: CODEGEN copied answer_template.refs literally (refs=["/proc/catalog"])
    — failing fragment `vm.answer(message=cnt, outcome="OUTCOME_OK", refs=["/proc/catalog"])`.
    The SQL count logic is correct; failure is purely the refs set. The required provenance
    doc lives under /docs/current-updates and is keyed by task entity (nuts-bolts-washers),
    discoverable but never emitted by the script. Rule linkage: corrective CODEGEN
    technique tells codegen to discover doc refs and append them rather than trust
    the data-only refs from the frozen tool_plan. Existing v001 is a raw verdict record,
    not an active rule, so not semantically identical — no skip.'
  status: inactive
- agents_md_anchor: null
  content: Never emit vm RPC calls (vm.search, vm.glob, vm.read, etc.) that are absent
    from the frozen tool_plan ops; the fidelity grader asserts the executed RPC multiset
    equals the tool_plan's exact set, so any extra discovery RPC raises 'fidelity
    drift (RPC multiset)'. If provenance refs are needed but no Search op exists,
    source refs only from answer_template.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''fidelity: AssertionError: fidelity drift (RPC multiset)
    expected: [Answer, Exec] got: [Answer, Exec, Search]''. Root cause: SCRIPT_CODE
    added an out-of-plan vm.search(root=''/docs/current-updates'', pattern=kind_name)
    to fabricate provenance doc refs. Failing fragment: ''hits = vm.search(root="/docs/current-updates",
    pattern=str(kind_name))''. The frozen tool_plan ops contain only one Exec; appending
    Search inflated the RPC multiset and broke fidelity. This was directly induced
    by r001, which instructed discovering provenance via glob/search of /docs/current-updates
    and appending matches to refs. r001 is therefore unsafe: it commands an RPC not
    in the frozen tool_plan. The fidelity invariant strictly supersedes provenance-padding,
    so r001 must be deactivated and replaced with a rule forbidding any RPC absent
    from tool_plan.'
  status: active
