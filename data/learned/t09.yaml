  id: r009
  reasoning: 'Verbatim error: ''PLAN phase: action is empty'' with PLAN_OUTPUT approach
    stating ''The only candidate action has already been executed, leaving no further
    actions to select.'' Root cause category: wrong-action — the PLAN phase discarded
    the sole candidate and emitted an empty action instead of scheduling a concrete
    document read. Failing fragment: SDD_OUTPUT actions contained the bare path ["/docs/policy-updates/2025-06-22-catalogue-reporting-nuts-bolts-washers-graz.md"]
    and PLAN_OUTPUT action was "". Rule linkage: the new rule mandates that the PLAN
    phase must always emit a concrete read action for that exact policy document path
    and must never leave the action empty on the grounds it was already attempted
    in a prior action.'
  source: learn
  status: inactive
