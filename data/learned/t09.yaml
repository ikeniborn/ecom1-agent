- agents_md_anchor: null
  content: When answer_shape.required_ref_kinds includes 'runtime', always populate
    the answer block's refs array with the runtime variable references used in the
    message template; never emit an empty refs array when runtime refs are mandated.
  created: '2026-06-08'
  deactivated_reason: null
  id: r003
  reasoning: 'Error: ''interpret: OK answer carries only static refs but a runtime
    ref is required''. Root cause: CODEGEN produced an empty refs array in the answer
    block despite the tool_plan specifying required_ref_kinds: [''runtime''] and the
    message template interpolating the runtime variable {count_result}. Failing fragment:
    ''"answer":{"ok":{"message":"<COUNT:{count_result}>","outcome":"OUTCOME_OK","refs":[]}}''.
    The interpreter requires runtime refs to be explicitly declared in the answer
    refs array.'
  status: active
- agents_md_anchor: null
  content: When the tool_plan success criteria reference a runtime variable by a specific
    name, always emit a compute or discovery `into` binding that creates a top-level
    variable with exactly that referenced name; do not alias it to a different identifier.
  created: '2026-06-08'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: verify: success_criteria[0] failed: {''op'': ''nonempty'',
    ''lhs'': ''$count_result'', ''rhs'': None, ''args'': []}. Root cause: The script
    parses the SQL result through a rowset and then extracts the count via `{"prim":"get","args":["$count_row","count_result"],"into":"count_val"}`,
    binding it to `count_val`. Consequently no top-level variable named `$count_result`
    exists in the runtime environment, so the success criteria `nonempty $count_result`
    evaluates against an undefined reference and fails. Failing fragment: `into:"count_val"`
    instead of `into:"count_result"`. Rule linkage: The new rule requires exact-name
    `into` bindings for any variable referenced in success criteria, preventing verification
    failures caused by aliasing.'
  status: active
