    the kinds table does not exist in the database and the query fails with ''no such
    table: kinds''. Include the policy doc path in grounding_refs.'
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r008'
  id: r008
  reasoning: r006 and r007 both address the same spec_goal of determining a catalogue
    product count from an authoritative policy addendum in /docs/. r007 (highest id)
