  id: r005
  reasoning: r003 and r004 address the same spec_goal (locating an authoritative policy
    addendum in /docs/ for a catalogue product count). r004 (highest id) prohibits
    listing presumed subdirectories; r003 mandates using tree:/docs/ first, prohibits
    find patterns, requires SQL avoidance, authoritative count usage, and grounding_refs.
    Merged rule extends r004 to cover the full scope of both rules and subsumes r003.
  source: learn
  status: inactive
- content: Never emit search:Nut /docs/ or any other product-keyword search or find
    under /docs/, nor list:/docs/catalogue-addenda/ or any other presumed subdirectory
    path under /docs/; always use tree:/docs/ as the first action when the spec_goal
