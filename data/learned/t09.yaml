entries:
- agents_md_anchor: '#plan-phase'
  content: Always use the 'value' field (not 'message') in the answer section when the success criteria
    involve numeric operators (ge, le, eq, etc.), and always include all required refs from the intent
    spec.
  created: '2026-06-22'
  deactivated_reason: null
  id: r003
  reasoning: 'The verify phase failed with ''success_criteria[OUTCOME_OK][0] failed: {"op": "ge", "lhs":
    "$answer", "rhs": 0, "args": []}''. The PlanIR produced an answer with a ''message'' skeleton "{count}",
    yielding a string. The success criteria expects a numeric comparison, so the answer must provide a
    numeric ''value'' field. Additionally, the answer refs were empty, but the intent spec required a
    policy_doc ref. The rule ensures numeric answers use ''value'' and all required refs are included.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a policy document defines a product classification, read the document and extract the
    exact product names, categories, or attributes to use in SQL WHERE conditions; never use a guessed
    product_kind_id.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: The plan read the policy doc but then hardcoded product_kind_id = 'wood_drywall_screws' without
    extracting the actual criteria. This caused the SQL query to return no rows, leading to a null count
    and the plan returning OUTCOME_NONE_CLARIFICATION. Existing rule r002 says to extract criteria, but
    it wasn't specific enough to prevent this guess. The new rule explicitly forbids using a guessed product_kind_id
    and mandates extracting exact names/categories.
  status: active
  surface: ir
