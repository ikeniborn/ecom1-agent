    catalogue count; never leave the PLAN phase action empty claiming the document
    was already attempted in a prior action.
  created: '2026-05-23'
  deactivated_reason: r009 mandates emitting the file-read action in PLAN even when
    the exact same action string is already present in SDD actions, which directly
