- agents_md_anchor: null
  content: Never join auxiliary tables to filter by display name when a required policy
    document states a concrete identifier; bind that identifier from the document
    and use direct equality in the WHERE clause. Do not use `to_number` in a compute
    step for a COUNT scalar; instead ensure the rowset extraction produces a true
    integer so that `ge` and similar numeric checks succeed. Always include the required
    policy-doc variable in answer refs.
  created: '2026-06-19'
  deactivated_reason: superseded by pinned rc1
  id: r011
  reasoning: 'The verify error `success_criteria[OUTCOME_OK][1] failed: ge($n,0)`
    indicates `$n` was not a valid integer >= 0. The PlanIR SQL used `JOIN product_kinds
    ... WHERE LOWER(TRIM(pk.product_kind_name)) LIKE ''nut bolt and washer''` instead
    of extracting the authoritative `product_kind_id = ''nuts_bolts_washers''` from
    the required policy doc (`$policy_doc`) as specified in TOOL_PLAN.params. After
    rowset extraction, the compute chain `column -> first -> to_number` produced a
    value that passed `nonempty` but not `ge`, likely because `first` consumed a header
    row (yielding `''n''` -> `NaN`) or because `to_number` is not a supported primitive
    and left `$n` as a string. Existing rule rc1 advocates name-based LIKE matching,
    which is superseded by direct-ID extraction when a policy document supplies a
    concrete identifier.'
  status: inactive
