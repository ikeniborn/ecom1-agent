- agents_md_anchor: '#important-things > references'
  content: 'When an entity lookup filters on multiple ANDed exact-equality predicates
    built from hardcoded tool_plan literals and returns zero rows, relax the predicates
    progressively one at a time — starting with the brittlest (unit-bearing values,
    long free-text columns): normalize whitespace/units, case-fold, or switch to trimmed
    substring matching — to localize which literal mismatched the stored value, then
    re-resolve so ref paths populate before answering; never call vm.answer with OUTCOME_OK
    and an empty refs list, since the harness reclassifies a refless OK as OUTCOME_NONE_CLARIFICATION.'
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''.
    Root cause: discovery/ops SELECTs filter on hardcoded exact literals (voltage=''6
    V'', long product_line string, product_type=''battery charger'') via _bind inlining;
    if any stored value differs by unit spacing, case, or trailing text, the product/per_store
    queries return zero rows. Failing fragment: ''product_path'' and ''store_paths''
    stay empty, yet `vm.answer(message=..., outcome="OUTCOME_OK", refs=refs)` fires
    with refs=[]. Harness downgrades a refless OUTCOME_OK to OUTCOME_NONE_CLARIFICATION,
    so grader sees clarification instead of OK. Linkage: extends r002 (relaxed retry)
    with progressive predicate-by-predicate relaxation to pinpoint the mismatched
    literal, and reinforces r003 by forbidding the refless OK path that produced the
    clarification reclassification.'
  status: active
