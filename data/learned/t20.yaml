- agents_md_anchor: null
  content: Always perform entity lookups (e.g., product, store) in separate discovery
    steps before using them in joins or aggregations. This ensures that if an entity
    is not found, the decision branch can correctly detect the missing entity and
    branch to the unsupported outcome, avoiding verification failures from empty results.
  created: '2026-06-24'
  deactivated_reason: Superseded by new rule that additionally requires a decision
    branch to handle missing entities.
  id: r001
  reasoning: The error shows success_criteria[OUTCOME_OK][0] (ge $answer >= 0) failed,
    but the observed RPC output shows answer=0. This contradiction suggests that the
    decision branch incorrectly went to 'ok' even though product_sku was empty (NULL).
    The root cause is that the single SQL query uses scalar subqueries that return
    NULL when the product is not found, but the decision condition nonempty on $product_sku
    did not correctly evaluate to false, causing the ok branch to be taken. The PlanIR
    should split the lookup into separate steps to ensure the decision can reliably
    detect missing entities.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When extracting a field from a single row (e.g., after using 'first' or
    'get' to obtain a single dict), use the 'get' primitive instead of 'column' to
    avoid type errors.
  created: '2026-06-24'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: interpret: compute step ''column'' failed: ''column'' expects
    list[dict]; use ''get'' for a single row. Root cause: In the compute section,
    ''first'' returns a single dict, but ''column'' was applied to it. The PlanIR
    fragment: {"prim":"first","args":["$parsed_rows"],"into":"row"} followed by {"prim":"column","args":["$row","product_sku"],"into":"product_sku"}.
    The fix is to use ''get'' instead of ''column'' for single-row field extraction.
    This rule ensures correct primitive usage in the PLAN phase.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never apply 'first' or 'column' directly to the result of an Exec RPC.
    The Exec RPC returns an ExecResponse object, not a list. To access the rows, first
    extract the 'stdout' field using 'get', then parse the JSON string into a list
    using 'parse_json', then apply 'first' or 'column' on that list.
  created: '2026-06-24'
  deactivated_reason: r003 is too narrow; it only covers 'first' and 'column' but
    not rowsets. The new rule covers all uses of Exec RPC output.
  id: r003
  reasoning: 'Error: ''ExecResponse'' object is not subscriptable when applying ''first''
    to discovery result. Root cause: PlanIR uses a single Exec RPC discovery step
    and then applies ''first'' directly to the ExecResponse object, which is not a
    list. The ExecResponse contains stdout (JSON string) and other fields. The correct
    pattern is to extract ''stdout'' via ''get'', parse JSON to a list, then use ''first''.
    This rule prevents similar type errors.'
  status: inactive
  surface: ir
- content: null
