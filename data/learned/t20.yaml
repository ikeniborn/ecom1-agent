- content: Always execute every action listed in the SDD 'actions' array sequentially
    without interruption; for spec_goal 'Determine the total available_today across
    all Vienna PowerTool branches for the specific Vileda Cleaning Machine' and its
    actions (stores query, product query, inventory join), all actions must be completed
    before producing the final answer, never stopping to ask for clarification midway.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r005, r006'
  id: r006
  reasoning: 'Verbatim error: ''I found the store records for PowerTool branches in
    Vienna (store_vienna_praterstern, store_vienna_meidling) but need additional queries
    to locate the product'' reveals the agent executed only the first action from
    the SDD actions array (stores query) and stopped, instead of executing the remaining
    actions (product query and inventory join). Root cause category: wrong-action
    — the action set was present but only partially executed. Failing fragment: the
    ''actions'' array in SDD_OUTPUT defined three actions, but only the first was
    completed. Rule linkage: new rule must enforce that every action in the array
    is executed sequentially.'
  source: learn
  status: inactive
