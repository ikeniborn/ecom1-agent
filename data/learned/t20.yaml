- agents_md_anchor: null
  content: 'When a product must be identified by multiple attributes (e.g., brand,
    family, and properties), structure the discovery into two steps: first, find candidate
    products by brand and family; second, filter by properties using a separate query
    or compute step. This ensures the plan can detect whether the product family exists
    at all, and if not, can fail early with a clear reason rather than defaulting
    to an unsupported outcome.'
  created: '2026-06-22'
  deactivated_reason: r001 recommended a two-step structure but was not enforced;
    this new rule strictly prohibits the combined pattern, superseding r001.
  id: r001
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. Root
    cause: The single SQL query joined product_variants with product_variant_properties
    on exact property keys/values. If the properties did not match (e.g., due to key
    naming differences), the entire product_info subquery returned empty, causing
    the decision branch to trigger ''unsupported'' because product.record_path was
    empty. The plan lacked a way to distinguish ''product family not found'' from
    ''properties not matching'', and defaulted to unsupported. The corrective rule
    advises a two-step discovery: first, a broad lookup by brand/family to verify
    existence; second, property filtering. Additionally, a pre-phase deep-read of
    product_variant_properties is requested to surface actual property keys and values,
    enabling correct filtering in the next run.'
  status: inactive
  surface: ir
