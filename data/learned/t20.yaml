- content: Always include all necessary queries from the spec's actions list in the
    plan. For spec_goal 'Determine the total available_today across all Vienna stores',
    the plan must include at least the stores query (e.g., 'select * from stores where
    city = "Vienna";') and an inventory join with the product SKU to compute the total.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002, r003, r004'
  id: r001
  reasoning: 'Verbatim error: ''Found the product SKU CLN-5IZV3OGJ (Vileda Workshop
    UltraMax 3R0-GQ8 Cleaning Machine, floor cleaner, 3000W), but no branch inventory
    data is available.'' Root cause: wrong-action — the plan action only executed
    the products query, omitting the required stores and inventory queries. Failing
    fragment: PLAN_OUTPUT action ''select sku, brand, series, model, name, properties
    from products where brand = "Vileda";'' — this solitary action did not fetch store
    or inventory data. Rule linkage: new rule must cite spec_goal ''Determine the
    total available_today across all Vienna stores'' and action identifier ''select
    * from stores where city = "Vienna";'' from SDD_OUTPUT.'
  source: learn
  status: inactive
- content: When the spec_goal or success_criteria includes 'Cite all store records
    and the product record', the plan must include actions that capture and include
    the file paths of those records (e.g., by recording the execution output file
    paths or querying a metadata table) before computing the final answer.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002, r003, r004'
  id: r002
  reasoning: 'Error: ''ANSWER clarification: count : 9 <COUNT:9>. File paths for the
    records were not provided in execution results.'' Root cause category: wrong-spec
    (the spec''s action list did not include any step to capture file paths, despite
    success_criteria requiring citations). Failing spec fragment: success_criteria:
    ''Cite all store records and the product record in the answer.'' The plan actions
    only included SQL data queries, not any operation to retrieve file paths. Rule
    linkage: new rule must enforce that when citation is required, the plan includes
    explicit steps to capture file paths.'
  source: learn
  status: inactive
- content: Always validate product existence by first querying the products table
    with the brand and series alone (e.g., WHERE brand='Vileda' AND series='Vileda
    Workshop UltraMax 3R0-GQ8') before applying property joins; if the initial query
    returns empty, escalate or apply fuzzy matching (LIKE, alternative keys) before
    finalizing the plan. This rule is triggered when spec_goal contains specific brand
    and series identifiers like 'Vileda' and 'Vileda Workshop UltraMax 3R0-GQ8'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002, r003, r004'
  id: r003
  reasoning: 'Verbatim error: ''Empty result: sku,path''. Root cause category: empty-result.
    Failing fragment: The action ''SELECT p.sku, p.path FROM products p JOIN product_properties
    pp1 ON p.sku=pp1.sku AND pp1.key=''machine_type'' AND pp1.value_text=''floor cleaner''
    JOIN product_properties pp2 ON p.sku=pp2.sku AND pp2.key=''power'' AND (pp2.value_text=''3000
    W'' OR pp2.value_number=3000) WHERE p.brand=''Vileda'' AND p.series=''Vileda Workshop
    UltraMax 3R0-GQ8'';'' returned zero rows. Rule linkage: The spec_goal assumed
    exact brand=''Vileda'' and series=''Vileda Workshop UltraMax 3R0-GQ8'' without
    first verifying data existence; the new rule must require a preliminary existence
    check to avoid assuming exact matches.'
  source: learn
  status: inactive
- content: 'Always include in the SDD ''actions'' array every SQL query and step required
    to compute the final answer directly. For spec_goal ''Determine the total available_today
    across all Vienna stores for the specific Vileda Cleaning Machine product'' with
    success_criteria ''Cite all store records and the product record'', the actions
    must include at minimum: stores query, product query(s), inventory join with SUM(available_today)
    and COALESCE, and a final action that formats the count with citations.'
