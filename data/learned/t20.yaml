    even if the first query returns zero rows; one or more product queries for the
    specific product; an inventory join with SUM(available_today) and COALESCE, placed
    after both product queries; and a final action that constructs the answer string
    by explicitly listing the product path and all store paths retrieved from the
    preceding stores query, ensuring the final output includes both the count and
    the full file paths of all cited records, even if the list of stores is empty.
    Do not rely on a single SQL query that may return zero rows; instead, capture
    the store paths via a separate stores query and the product path via a separate
    product query, then format the answer string in a final step. When filtering on
    numeric properties (e.g., power, voltage), query both value_text and value_number
    with OR (e.g., (pp.value_text = ''3000 W'' OR pp.value_number = 3000)). Never
    stop to ask for clarification midway; all actions must be completed before producing
    the final answer. Additionally, always execute the product validation query as
    a separate action and verify that it returns at least one row before using it
    in any subsequent inventory join. Never embed the product identification subquery
    inside the final inventory join SQL because that will cause an empty result if
    the product query fails. The plan steps must explicitly list both the initial
    product query and the broader follow-up query as distinct actions.'
  created: '2026-05-21'
  deactivated_reason: null
  id: r015
  reasoning: 'Merged r013 and r014. r014 (highest id) provided the base requirement
    for two distinct product query actions (exact then broader) and explicit inventory
    join placement. r013 added comprehensive requirements: stores query, final answer
    construction listing paths, numeric property handling, unconditional inclusion
    of broader query, separate product validation, no embedded subqueries, and never
    asking for clarification. The merged rule extends r014 by incorporating all these
    points, resolving the apparent contradiction (r013''s conditional broader query
    vs r014''s unconditional broader query) by requiring the broader query as an unconditional
    separate action while still recommending conditional use of its results if the
    first query succeeds.'
