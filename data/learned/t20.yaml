    a separate action and verify that it returns at least one row before using it
    in any subsequent inventory join. Never embed the product identification subquery
    inside the final inventory join SQL because that will cause an empty result if
    the product query fails.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r011, r012'
  id: r011
  reasoning: Merged r009 (basic SDD actions structure, citations, numeric property
    filtering) with r010 (explicit separate product validation, fallback steps, forbidding
    embedded subqueries). r010 adds detail on execution separation and fallback that
    is compatible with and extends r009. Highest numeric id (r010) used as base, extended
    with r009's requirements for stores query, citations with full file paths, numeric
    property OR filtering, and the sequential uninterruptible execution instruction.
  source: learn
  status: inactive
- content: Always, for spec_goals that require citing all store records even if zero
    stores match (e.g., 'Across every Vienna PowerTool branch, including branches
    with 0 availability'), include in the SDD 'actions' array a final action that
    constructs the answer string by explicitly listing the product path and all store
    paths retrieved from preceding queries, and ensure the final output includes both
    the count and the full file paths of all cited records, even if the list of stores
    is empty. Do not rely on a single SQL query that may return zero rows; instead,
    capture the store paths via a separate stores query and the product path via a
    separate product query, then format the answer string in a final step.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r011, r012'
  id: r012
  reasoning: 'Verbatim error: ''Empty result: '' (blank after colon). Root cause:
    empty-result — the final combined SQL query returned zero rows because either
    no stores matched the filter ''s.city = "Vienna" AND s.name LIKE "%PowerTool%"''
    or the embedded product subquery returned NULL causing an unexpected empty set.
    Failing fragment: the third action in SDD_OUTPUT (the combined stores/inventory/format
    query) and the plan action that embeds the product identification subquery inside
    the final inventory join. Existing rule r011 prohibits embedding the product subquery
    and requires separate product validation, but does not enforce handling the case
    where the stores query returns zero rows, leading to an empty answer when no stores
    match. Rule linkage: new rule must cite spec_goal ''Across every Vienna PowerTool
    branch, including branches with 0 availability'' to ensure the final action always
    produces a non-empty output even if no stores exist.'
  source: learn
  status: inactive
- content: 'Always, for spec_goals requiring citation of store records and product
    records (e.g., ''Determine the total available_today across all stores for a specific
    product'', or ''Across every Vienna PowerTool branch, including branches with
    0 availability''), ensure the SDD ''actions'' array includes at minimum: a stores
    query that captures all store paths even if the inventory join returns zero rows;
    a product validation query (first query the products table with brand and series
    alone; if empty, apply broader or fuzzy matching such as LIKE on series/name or
    remove property filters, then escalate if still empty); one or more product queries
    for the specific product; an inventory join with SUM(available_today) and COALESCE;
    and a final action that constructs the answer string by explicitly listing the
    product path and all store paths retrieved from the preceding stores query, ensuring
    the final output includes both the count and the full file paths of all cited
    records, even if the list of stores is empty. Do not rely on a single SQL query
    that may return zero rows; instead, capture the store paths via a separate stores
    query and the product path via a separate product query, then format the answer
    string in a final step. When filtering on numeric properties (e.g., power, voltage),
    query both value_text and value_number with OR (e.g., (pp.value_text = ''3000
    W'' OR pp.value_number = 3000)). Never stop to ask for clarification midway; all
    actions must be completed before producing the final answer. Additionally, always
    execute the product validation query as a separate action and verify that it returns
    at least one row before using it in any subsequent inventory join. Never embed
    the product identification subquery inside the final inventory join SQL because
    that will cause an empty result if the product query fails.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r013, r014'
  id: r013
  reasoning: r011 and r012 both address spec_goals that require citing all store records
    and product records for inventory availability queries under a 'cite all records'
    success criterion. r011 provides comprehensive technical instructions (product
    validation, fuzzy matching, numeric property OR, separate product query, never
    embed subquery). r012 specifically emphasizes the case where zero stores match
    and the need to capture store paths via a separate stores query. Since r012's
    requirement is a subset of r011's broader instructions but adds explicit handling
    of zero-store scenarios, merging eliminates redundancy and ensures all edge cases
    are covered.
  source: learn
  status: inactive
- content: 'Always, for spec_goals requiring product identification with brand, series,
    and properties before inventory computation (e.g., ''Across every Vienna PowerTool
    branch ... how many units of product ... are available today?''), include in the
    SDD ''actions'' array at least two distinct product query actions executed sequentially:
    (1) a product query with brand=''X'' AND series LIKE ''%Y%'' (exact or LIKE);
    (2) a broader product query executed unconditionally (e.g., using LIKE on name
    or series with less specificity, or removing property filters) to locate the product
    even if the first query returns zero rows. The inventory join action must be placed
    after both product queries. The plan steps must explicitly list both queries.
    Never rely on a single product query to succeed.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r013, r014'
  id: r014
  reasoning: 'Verbatim error: ''Unable to determine the total available units because
    the product record and availability data for the Cleaning Machine (Vileda Workshop
    UltraMax 3R0-GQ8, floor cleaner, 3000W) were not found.'' Root cause: wrong-spec
    — the SDD actions array contained only a single product query (action #2) and
    did not include a fallback broader query, despite the requirement in existing
    rule r013 to ''if empty, apply broader or fuzzy matching''. The failing fragment
    is SDD action #2 (SELECT sku, path FROM products WHERE brand=''Vileda'' AND series
    LIKE ''%Vileda Workshop UltraMax 3R0-GQ8%'') which returned zero rows, and the
    plan step #2 that only mentions a single query. The agent consequently stopped
    asking clarification instead of executing broader search. Rule linkage: new rule
    must enforce that the SDD actions list includes at least two separate product
    queries (exact then broader) executed unconditionally, so that the inventory join
    (action #3) only runs after product is confirmed found via either query.'
  source: learn
  status: inactive
