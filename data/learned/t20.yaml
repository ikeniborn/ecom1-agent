  content: 'Never combine product identification by brand/family with property filtering
    in a single discovery step. Always use separate discovery steps: first find candidate
    products by brand and family, then in a subsequent step filter by properties.
    This allows the plan to detect missing product family vs missing variant and produce
    appropriate outcomes.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The plan used a single SQL query that joined product_variants, product_families,
    and product_variant_properties in one step. When the query returned no rows, the
    plan defaulted to OUTCOME_NONE_UNSUPPORTED, but the grader expected OUTCOME_OK,
    indicating the product exists. The single-step approach made it impossible to
    determine whether the product family was missing or the property filter failed,
    and it violated existing rule r001. The new rule enforces a strict separation
    to enable stepwise verification and clear failure reasons.
  status: inactive
