- agents_md_anchor: null
  content: 'When a filter condition in the method lacks a table qualifier, do not
    assume it belongs to a specific table. Instead, ensure the pre-phase deep-reads
    the schemas of all tables involved in the query, and use the discovered columns
    to place the condition correctly. If schema is not available, split the step:
    first retrieve rows using only filters with clear table affiliation, then in a
    subsequent step filter by the ambiguous condition using a query that checks all
    candidate tables.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The interpreter returned OUTCOME_NONE_UNSUPPORTED because the decision
    branch evaluated $candidate_skus as empty. The first discovery SQL placed `brand='Fiskars'`
    on `product_variants`, but in the actual schema `brand` is likely a column of
    `product_families`. This caused the query to return no rows despite the product
    existing. The method did not specify which table holds `brand`, so the PLAN phase
    guessed incorrectly. No existing rule prevents this; a new rule should enforce
    schema-aware placement or a safe two-step approach.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always use filter_rows with exactly two arguments: the rows variable and
    a predicate object. The predicate object must contain keys ''column'', ''op'',
    and ''value'' (e.g., {''column'': ''type'', ''op'': ''eq'', ''value'': ''product''}).
    Do not pass column, op, and value as separate arguments.'
  created: '2026-06-22'
  deactivated_reason: r007 instructs to use a dict predicate for filter_rows, which
    causes the interpreter error 'dict' object has no attribute 'op'. This rule is
    superseded by the correct approach of filtering in SQL.
  id: r007
  reasoning: 'interpret: compute step ''filter_rows'' failed: _filter_rows() takes
    2 positional arguments but 4 were given. The PlanIR used filter_rows with four
    arguments: rows variable, column name, operator, and value. The interpreter expects
    exactly two arguments: the rows variable and a predicate object. This caused the
    interpreter to fail. The correct usage is to pass a predicate object like {''column'':
    ''type'', ''op'': ''eq'', ''value'': ''product''} as the second argument.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always use `get` with exactly two arguments: the rowset variable and the
    column name. Do not pass an index argument; the primitive retrieves the value
    from the first row of the rowset.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'The compute step `get` was called with three arguments: `["$sum_row",
    "0", "total_count"]`. The interpreter''s `get` lambda expects only two arguments
    (rowset and column name). The index `"0"` is unnecessary because `get` returns
    the value from the first row. The correct call is `["$sum_row", "total_count"]`.
    This rule prevents future misuse of the `get` primitive.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always ensure that the input to `sum_col` is a list of dicts. If the source
    variable might be a single dict (e.g., from an Exec that returned one row), convert
    it to a list using `to_list` or use a different primitive like `get` + `to_number`
    for scalar aggregation.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: interpret: compute step ''sum_col'' failed: ''sum_col'' expects
    list[dict]; use ''get'' for a single row. Root cause: The discovery step Exec
    returned a single dict (because the SQL query returned exactly one row), but the
    plan assumed it would be a list of dicts. The failing PlanIR fragment is the compute
    step `{"prim":"sum_col","args":["$store_data","qty"],"into":"count"}`. No existing
    rule covers this shape mismatch; a new rule is needed to ensure list input for
    sum_col.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never pass a dict as the predicate to filter_rows; the interpreter expects
    an object with an 'op' attribute. Instead, filter rows directly in SQL queries
    using WHERE clauses, or use separate discovery steps for each subset.
  created: '2026-06-24'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: interpret: compute step ''filter_rows'' failed: ''dict'' object
    has no attribute ''op''. Root cause: The filter_rows primitive expects the predicate
    to be an object with an ''op'' attribute, but the PlanIR passes a dict (e.g.,
    {''column'':''type'',''op'':''eq'',''value'':''PRODUCT''}). The interpreter tries
    to access predicate.op on the dict, which fails. The failing PlanIR fragment is
    the compute step with filter_rows. Existing rule r007 instructs to use a dict
    predicate, which is now causing this error. Therefore, r007 must be deactivated
    and replaced with a rule that avoids dict predicates for filter_rows.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Prefer to compute aggregations (sum, count, avg) directly in SQL queries
    rather than using compute primitives like sum_col. This avoids type mismatches
    and ensures correct handling of single-row or empty results. Use get to extract
    the scalar from the result rowset.
  created: '2026-06-24'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: interpret compute step ''sum_col'' failed because ''$vienna_stores''
    was a single dict (not list[dict]) — the Exec returned one row and the interpreter
    unwrapped it. Root cause: PlanIR used sum_col on a rowset that may be a single
    row. Existing rule [in-session] advises converting to list, but the PlanIR did
    not follow it. A better plan technique is to compute the sum directly in the SQL
    query (e.g., SELECT SUM(...) ...) and bind the scalar result, then use get to
    extract it. This eliminates the type mismatch entirely and is simpler.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use filter_rows with a predicate object; the interpreter expects
    the predicate to be an object with an 'op' attribute, not a dict. Instead, filter
    rows directly in SQL queries using WHERE clauses, or use separate discovery steps
    for each subset.
  created: '2026-06-24'
  deactivated_reason: null
  id: r012
  reasoning: 'Error: ''dict'' object has no attribute ''op'' in filter_rows. Root
    cause: PlanIR passed a dict predicate (e.g., {''column'':''row_type'',''op'':''eq'',''value'':''product''})
    to filter_rows, but the interpreter expects an object with an ''op'' attribute,
    not a dict. The existing rule r007 incorrectly instructs to use such a dict predicate.
    The correct approach is to avoid filter_rows with predicate objects entirely and
    instead filter in SQL or use separate discovery steps.'
  status: active
