- agents_md_anchor: null
  content: Always bind discovery steps to variables that match the required refs specified
    in the IntentSpec. When the IntentSpec requires `$product.record_path`, bind the
    final product identification step to `$product`. When it requires `$stores[*].record_path`,
    bind the store lookup step to `$stores`. Use these exact variable names in the
    answer refs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product.record_path'',
    ''$stores[*].record_path''] on OK answer. Root cause: The PlanIR bound product
    discovery to `candidate_skus` and `matching_skus`, and stores to `graz_stores`,
    then used `$product_record_path` and `$graz_stores[*].record_path` in the answer
    refs. The interpreter expected refs exactly matching the IntentSpec''s required
    refs, which are `$product.record_path` and `$stores[*].record_path`. Failing PlanIR
    fragment: answer.ok.refs = ["$product_record_path","$graz_stores[*].record_path"].
    No existing rule covers variable naming for required refs.'
  status: inactive
  surface: ir
