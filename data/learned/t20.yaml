- agents_md_anchor: null
  content: Always parse /bin/sql stdout as CSV using the comma delimiter and drop
    the first header row before indexing columns, rather than splitting on a pipe
    '|' delimiter; otherwise every row collapses into a single field, len(row) checks
    fail, path columns are dropped, and refs come out empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$product_path'', ''$store_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column; check `:name` bindings on /bin/sql and the SELECT columns". Root cause:
    /bin/sql emits CSV — the only non-empty observed output, the schema query, returned
    comma-separated rows (`name,sql`, `customer_accounts_city_idx,CREATE INDEX...`).
    Failing fragment: `_rows()` splits each line on ''|'' (`line.split("|")`), so
    a CSV row like `store_id,store_path,product_path,available_units` becomes one
    field; the downstream guard `if len(row) < 4: continue` then drops every per_store
    row, `product_path` stays None, store refs never append, and `final_refs` is [].
    It also never skips the header line. Even had the discovery rows been present,
    the pipe-split parser would have produced this exact empty-refs error, so the
    durable CODEGEN defect is the delimiter/header mismatch when translating tool_plan
    /bin/sql binds into row parsing — not the frozen SQL. Rule linkage: enforce CSV
    parsing with header skip so path columns survive into refs.'
  status: active
- agents_md_anchor: null
  content: Always consume the schema-discovery query output to resolve and validate
    real table/column names (and inspect distinct stored values for equality filters)
    before building dependent queries; when a parametrized lookup returns zero rows,
    retry with relaxed/case-insensitive or trimmed matching instead of emitting empty
    refs from blindly hardcoded tool_plan literals.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$product_path'', ''$store_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". Root cause: script ran the `schema` discovery query (`select name, sql
    from sqlite_schema ...`) but never used its result — the `schema` variable is
    discarded. Every dependent query (product lookup, vienna_stores, per_store, total)
    returned `<empty>`, so product_path and store_paths stayed empty and refs came
    out []. Failing fragment: `schema = vm.exec(...)` followed by product/store queries
    using rigid equality literals (`p.product_line = ''Varta Workshop Silver 30Z-3D8...''`,
    `p.voltage = ''6 V''`, `s.city = ''Vienna''`) with no verification against actual
    stored values or column names. The CSV-parsing rule already covers stdout decoding,
    but this is a distinct CODEGEN gap: discovery output must drive name/value resolution,
    and zero-row lookups must trigger relaxed matching rather than silently producing
    empty refs.'
  status: active
- agents_md_anchor: '#important-things > references'
  content: When the answer_template declares runtime ref placeholders (e.g. $product_path,
    $store_paths) and, after parsing every query output, the resolved refs list is
    empty because upstream SELECTs returned zero rows, do not call vm.answer with
    OUTCOME_OK and an empty refs list; first re-resolve the schema/value mismatch
    and retry, or emit a not-found/error outcome, so the run never reports a fabricated
    count backed by no references.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$product_path'', ''$store_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". Failing fragment: script fetches `schema = vm.exec(...)` but never parses/uses
    it, then at the end runs `vm.answer(message=message, outcome="OUTCOME_OK", refs=refs)`
    with refs==[]. Root cause: every dependent query (product, vienna_stores, per_store,
    total) returned <empty> — hardcoded table names products/stores/inventory do not
    match the real schema (discovery shows customer_accounts, employee_accounts, payment_transaction_items.product_sku,
    etc.), so product_path and store_paths stayed empty; the script still emitted
    OUTCOME_OK with count:0 and no refs. Linkage: existing rule on consuming schema-discovery
    to validate real table/column names covers WHY the queries returned zero rows;
    this new rule adds the missing output-gate technique — never emit a successful
    answer when the template-required runtime refs are empty — which neither existing
    rule expresses.'
  status: active
