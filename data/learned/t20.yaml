    query, product validation query (first query the products table with brand and
    series alone; if empty, apply broader or fuzzy matching such as LIKE on series/name
    or remove property filters, then escalate if still empty), product query(s) for
    the specific product, inventory join with SUM(available_today) and COALESCE, and
