- agents_md_anchor: null
  content: 'When a filter condition in the method lacks a table qualifier, do not
    assume it belongs to a specific table. Instead, ensure the pre-phase deep-reads
    the schemas of all tables involved in the query, and use the discovered columns
    to place the condition correctly. If schema is not available, split the step:
    first retrieve rows using only filters with clear table affiliation, then in a
    subsequent step filter by the ambiguous condition using a query that checks all
    candidate tables.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: The interpreter returned OUTCOME_NONE_UNSUPPORTED because the decision
    branch evaluated $candidate_skus as empty. The first discovery SQL placed `brand='Fiskars'`
    on `product_variants`, but in the actual schema `brand` is likely a column of
    `product_families`. This caused the query to return no rows despite the product
    existing. The method did not specify which table holds `brand`, so the PLAN phase
    guessed incorrectly. No existing rule prevents this; a new rule should enforce
    schema-aware placement or a safe two-step approach.
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Always use filter_rows with exactly two arguments: the rows variable and
    a predicate object. The predicate object must contain keys ''column'', ''op'',
    and ''value'' (e.g., {''column'': ''type'', ''op'': ''eq'', ''value'': ''product''}).
    Do not pass column, op, and value as separate arguments.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'interpret: compute step ''filter_rows'' failed: _filter_rows() takes
    2 positional arguments but 4 were given. The PlanIR used filter_rows with four
    arguments: rows variable, column name, operator, and value. The interpreter expects
    exactly two arguments: the rows variable and a predicate object. This caused the
    interpreter to fail. The correct usage is to pass a predicate object like {''column'':
    ''type'', ''op'': ''eq'', ''value'': ''product''} as the second argument.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Always use `get` with exactly two arguments: the rowset variable and the
    column name. Do not pass an index argument; the primitive retrieves the value
    from the first row of the rowset.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r008
  reasoning: 'The compute step `get` was called with three arguments: `["$sum_row",
    "0", "total_count"]`. The interpreter''s `get` lambda expects only two arguments
    (rowset and column name). The index `"0"` is unnecessary because `get` returns
    the value from the first row. The correct call is `["$sum_row", "total_count"]`.
    This rule prevents future misuse of the `get` primitive.'
  status: active
  surface: ir
