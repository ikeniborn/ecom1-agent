- agents_md_anchor: null
  content: 'Always use separate discovery steps when identifying a product by brand/family
    and filtering by variant properties: first query product_variants joined with
    product_families to get candidate SKUs, then in a subsequent step filter those
    SKUs using product_variant_properties. Never combine these into a single SQL query,
    as a combined query may return no rows ambiguously (e.g., when the family exists
    but properties don''t match) and cause the interpreter to default to a clarification
    outcome instead of the intended unsupported outcome.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The plan violated existing rule r002 by combining product identification
    and property filtering in a single discovery SQL query. This likely caused the
    query to either fail or return an empty result that the interpreter could not
    map to the 'unsupported' answer block, resulting in an unexpected OUTCOME_NONE_CLARIFICATION.
    The corrective rule enforces separation of discovery steps to ensure clear detection
    of missing product family vs. missing variant, and to allow the plan's decision
    branches to correctly route to OUTCOME_NONE_UNSUPPORTED.
  status: inactive
  surface: ir
