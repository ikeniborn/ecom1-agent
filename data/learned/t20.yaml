- agents_md_anchor: null
  content: Always parse every discovery output that will be used in a decision condition
    or answer ref into a rowset. When a discovery step binds a variable (e.g., $product,
    $stores) and that variable is later referenced in a decision branch (nonempty,
    eq, etc.) or as a ref source, include a corresponding rowset entry that parses
    the raw text into structured rows with named columns. This ensures the interpreter
    can evaluate conditions and extract record_paths correctly.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The plan produced OUTCOME_NONE_CLARIFICATION instead of the expected
    OUTCOME_OK or OUTCOME_NONE_UNSUPPORTED. Root cause: discovery steps bound $product
    and $stores to raw text outputs, but the plan lacked rowsets to parse those outputs
    into structured rows. The decision condition ''nonempty'' on $product and the
    answer refs ($product.record_path, $stores[*].record_path) require parsed rowsets;
    without them, the interpreter could not evaluate the condition and defaulted to
    clarification. Failing PlanIR fragment: the rowsets section only parsed $sum_result_text,
    omitting rowsets for $product and $stores. This is a PlanIR-shape bug, not a data
    issue.'
  status: inactive
  surface: ir
