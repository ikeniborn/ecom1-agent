  deactivated_reason: 'Consolidated: r001, r002, r003, r004'
  id: r004
  reasoning: 'Verbatim error: "product record and per‑store availability data are
    missing". Root cause category: wrong-spec: the SDD actions list omitted the inventory
    join and final answer step, causing the executor to only run the stores query
    and stop prematurely. Failing fragment: actions array in SDD_OUTPUT contains only
    three queries (stores, products exact, products fuzzy) but no inventory join or
    formatting action. Rule linkage: new rule will enforce that the actions list must
    include every step needed to produce the final answer directly.'
  source: learn
  status: inactive
