entries:
- content: Never search for an alphanumeric product identifier such as '1TO-KNA' exclusively
    in the series and name columns; always include the products.model column in the
    WHERE clause, as the action SELECT p.sku, p.path, p.name, p.brand, p.series, prop.value_text
    FROM products... produced an empty result because the identifier was likely stored
    in model.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r001'
  id: r001
  reasoning: '1. Verbatim error: ''Empty result: sku,path,name,brand,series,value_text''.
    2. Root cause category: wrong-filter. 3. Failing fragment citation: The action
    query ''SELECT p.sku, p.path, p.name, p.brand, p.series, prop.value_text FROM
    products p LEFT JOIN product_properties prop ON p.sku = prop.sku WHERE p.brand
    = ''Sonax'' AND prop.key = ''cleaner type'' AND prop.value_text = ''screen wash''
    AND (p.series LIKE ''%1TO-KNA%'' OR p.name LIKE ''%1TO-KNA%'');'' restricted the
    search for the alphanumeric code ''1TO-KNA'' exclusively to the series and name
    columns. 4. Rule linkage: The new rule mandates including the model column when
    filtering by such product identifiers because the schema provides a dedicated
    model field and omitting it caused the empty result set.'
  source: learn
  status: inactive
- content: Never conjoin an alphanumeric product identifier search for '1TO-KNA' across
    products.model, products.series, and products.name with a product_properties join
    filtering on key='cleaner type' and value_text='screen wash' and an exact brand
    filter 'Sonax' in the initial SKU lookup query, because this action produced an
    empty result; always first retrieve candidate SKUs from the products table by
    the identifier across model, series, and name alone, then verify brand and properties
    in separate follow-up queries.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r002'
  id: r002
  reasoning: 'The verbatim error is ''Empty result: sku,path,name,brand,series,model,value_text''.
    The root cause category is wrong-action: the initial SKU lookup action simultaneously
    joined product_properties, filtered by exact brand ''Sonax'', and required property
    key=''cleaner type'' with value_text=''screen wash'' while also matching the identifier
    ''1TO-KNA'' across model/series/name, causing the entire query to collapse to
    zero rows when any single constraint mismatched. The failing fragment is the action
    ''SELECT p.sku, p.path, p.name, p.brand, p.series, p.model, prop.value_text FROM
    products p LEFT JOIN product_properties prop ON p.sku = prop.sku WHERE p.brand
    = ''Sonax'' AND prop.key = ''cleaner type'' AND prop.value_text = ''screen wash''
    AND (p.series LIKE ''%1TO-KNA%'' OR p.name LIKE ''%1TO-KNA%'' OR p.model LIKE
    ''%1TO-KNA%'')''. The rule directly targets this action by mandating a decoupled
    lookup: isolate the SKU with the identifier first, then verify brand and properties
    separately.'
  source: learn
  status: inactive
- content: Never conjoin an alphanumeric product identifier search for '1TO-KNA' across
    products.model, products.series, and products.name with a product_properties join
    filtering on properties (e.g., key='cleaner type' and value_text='screen wash')
    or an exact brand filter (e.g., 'Sonax') in the initial SKU lookup query. More
    generally, never search for an alphanumeric product identifier exclusively in
    the products.series and products.name columns; always include the products.model
    column in the initial WHERE clause. Always first retrieve candidate SKUs from
    the products table by the identifier across model, series, and name alone, then
    verify brand and properties in separate follow-up queries.
  created: '2026-05-23'
  deactivated_reason: null
  id: r003
  reasoning: r001 and r002 share the same spec_goal (look up a product by an alphanumeric
    identifier like '1TO-KNA') but prescribe different/complementary actions. r002
    (highest id) subsumes the core lesson of r001 by searching across model, series,
    and name, while also adding the broader two-step strategy. Merging them eliminates
    redundant guidance and consolidates the rule set.
  source: learn
  status: active
- content: Never wrap the plan-phase JSON action object (containing 'function' and
    'query' fields) in markdown code fences or any other formatting — always emit
    the raw JSON object directly so the PCM harness can parse it.
  created: '2026-05-24'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''PLAN phase: failed to parse LLM output. Raw: ```json\n{\n  "function":
    "sql",\n  "query": "SELECT sku..."\n}\n```''. Root cause: wrong-action — the PLAN
    phase emitted a fenced JSON code block instead of the raw JSON object the PCM
    harness expects; the harness could not parse the output because of the markdown
    code fence wrapping. Failing fragment: the action ''SELECT sku, path, brand, series,
    model, name FROM products WHERE model LIKE ...'' was correct in substance but
    the LLM wrapped it in ```json ... ``` fences, making it unparseable. Rule linkage:
    the new rule must target the output formatting of plan-phase actions — never wrap
    the JSON action object in markdown fences.'
  source: learn
  status: active
- content: Never conjoin an alphanumeric product identifier search across products.model,
    products.series, and products.name with a product_properties join (e.g., key='cleaner
    type', value_text='screen wash') or an exact brand filter (e.g., 'Sonax') in the
    initial SKU lookup query — this produces empty results. Also never search an alphanumeric
    product identifier exclusively in products.series and products.name; always include
    products.model in the initial WHERE clause. Always first retrieve candidate SKUs
    from the products table by the identifier across model, series, and name alone,
    then verify brand and properties in separate follow-up queries.
  created: '2026-05-24'
  deactivated_reason: null
  id: r005
  reasoning: r002 is strict subset of r003. r003 covers all of r002's scope (no property/brand
    joins in initial query) plus adds the rule about including products.model in the
    initial search. r003 used as base, r002 deactivated.
  source: learn
  status: active
