- agents_md_anchor: null
  content: Always use the exact variable names specified in the plan's required_refs
    as the source in answer refs. Do not rename them; assign the computed values to
    variables with those exact names.
  created: '2026-06-24'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product_record.record_path'',
    ''$store_records''] on OK answer. The PlanIR script defines answer refs with source
    ''$product_record_path_value'' and ''$store_record_paths_list'', but the plan''s
    required_refs expect ''$product_record.record_path'' and ''$store_records''. The
    interpreter looks for variables with those exact names and cannot find them. The
    script must assign the computed values to variables named exactly as in required_refs,
    e.g., $product_record.record_path and $store_records, and use those in the answer
    refs.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always extract the 'stdout' field from an Exec RPC response using the 'get'
    primitive before using it in rowsets or compute steps. The ExecResponse object
    is not a string and cannot be parsed directly; first obtain the stdout string,
    then parse it with 'parse_json' if it is JSON, or use it directly in rowsets if
    it is delimited text.
  created: '2026-06-24'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: unresolved required ref ''$product_record.record_path'' because
    $product_record was never set. Root cause: the PlanIR binds the entire ExecResponse
    to ''raw_result'' and then uses it directly in rowsets (from_: ''raw_result'').
    The rowsets step expects a string variable containing the data, not an ExecResponse
    object. Consequently, parsed_rows is empty, ''first'' returns nothing, and $product_record
    is undefined. This violates the principle that Exec RPC output must be unwrapped
    before parsing. The existing rule r003 only warns against applying ''first'' or
    ''column'' directly to Exec result, but does not cover rowsets. A new rule is
    needed to explicitly require extraction of stdout before any parsing step.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always perform entity lookups (e.g., product, store) in separate discovery
    steps, each with its own Exec RPC, and then use a decision branch to check if
    the entity was found (non-empty) before proceeding to compute the answer. If the
    entity is not found, branch to the unsupported outcome. This ensures that required
    refs from the entity are only used when the entity exists, avoiding unresolved
    ref errors.
  created: '2026-06-24'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product_record.record_path'']
    on OK answer. Root cause: The PlanIR combined product, store, and total lookups
    into a single Exec RPC and did not include a decision branch to check if the product
    was found. When the product SKU lookup returned no rows (product not found), the
    variable $product_record.record_path was never assigned, but the answer refs required
    it. The plan''s success criteria require nonempty product_sku, so the correct
    behavior is to branch to OUTCOME_NONE_UNSUPPORTED. The existing rule r001 advises
    separate discovery steps but does not explicitly require a decision branch. This
    new rule supersedes r001 by adding the decision branch requirement.'
  status: active
  surface: ir
