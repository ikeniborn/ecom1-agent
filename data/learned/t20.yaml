  source: learn
  status: inactive
- content: Always use LIKE matching on series (e.g., series LIKE '%Vileda Workshop
    UltraMax 3R0-GQ8%') when exact match returns empty, and when filtering on numeric
    properties (e.g., power, voltage) query both value_text and value_number with
    OR (e.g., (pp.value_text = '3000 W' OR pp.value_number = 3000)). For spec_goal
    'Determine the total available_today units of the specified Cleaning Machine product
    across all PowerTool branches in Vienna', ensure the product is identified with
    fuzzy series matching and dual-format property filter.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r007, r008'
  id: r008
  reasoning: 'Verbatim error: ''ERROR: Empty result: sku,path''. Root cause category:
    wrong-filter. The SDD''s product query uses exact series=''Vileda Workshop UltraMax
    3R0-GQ8'' (missing ''Cleaning Machine line'') and compares power as value_text=''3000
    W'' when power may be stored as numeric value_number. Failing action: "SELECT
    p.sku, p.path FROM products p JOIN product_properties pp1 ON p.sku=pp1.sku AND
    pp1.key=''machine_type'' AND pp1.value_text=''floor cleaner'' JOIN product_properties
    pp2 ON p.sku=pp2.sku AND pp2.key=''power'' AND pp2.value_text=''3000 W'' WHERE
    p.brand=''Vileda'' AND p.series=''Vileda Workshop UltraMax 3R0-GQ8'';". Rule r007
    already requires fuzzy matching on empty brand+series results, but the SDD actions
    did not implement any fallback. The new rule must enforce LIKE matching on series
    and dual-format property filters to avoid empty results.'
  source: learn
  status: inactive
- content: 'Always include in the SDD ''actions'' array every SQL query and step required
    to compute the final answer directly, and execute every action listed sequentially
    without interruption. For spec_goals like ''Determine the total available_today
    across all stores for a specific product'' with success_criteria ''Cite all store
    records and the product record'', the actions must include at minimum: stores
    query, product validation query (first query the products table with brand and
    series alone; if empty, apply LIKE matching on series (e.g., series LIKE ''%...%'')
    or escalate or apply further fuzzy matching before finalizing), product query(s)
    for the specific product, inventory join with SUM(available_today) and COALESCE,
    and a final action that formats the count with citations. When citing records,
    include their full file paths (e.g., by recording the execution output file paths
    or querying a metadata table) before computing the final answer. When filtering
    on numeric properties (e.g., power, voltage), query both value_text and value_number
    with OR (e.g., (pp.value_text = ''3000 W'' OR pp.value_number = 3000)). Never
    stop to ask for clarification midway; all actions must be completed before producing
    the final answer.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r009, r010'
  id: r009
  reasoning: 'r007 (general SDD structure for available_today queries) and r008 (specific
    fuzzy matching and property filter techniques) overlap: r007''s ''apply fuzzy
    matching'' is generic, and r008 specifies LIKE matching on series and dual-format
    property queries. Merged rule takes r007''s procedural framework and extends it
    with r008''s concrete techniques, ensuring consistency and avoiding redundant
    separate rules.'
  source: learn
  status: inactive
- content: Always execute the product validation query as a separate action and verify
    that it returns at least one row before using it in any subsequent inventory join.
    If the product validation action returns zero rows, immediately apply broader
    or fuzzy matching (e.g., remove property filters, use less restrictive LIKE on
    series/name) or escalate to clarify the exact product specification. Never embed
    the product identification subquery inside the final inventory join SQL because
    that will cause an empty result if the product query fails. This applies to spec_goals
    like 'Determine the total available_today across all Vienna PowerTool branches
    for the specific Vileda Cleaning Machine' where product identification is critical.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r009, r010'
  id: r010
  reasoning: 'Verbatim error: ''Empty result: ''count : '' || CAST(COALESCE(SUM(inv.available_today),
    0) AS TEXT) || '' Product: '' || p.path || '' Stores: '' || GROUP_CON''. Error
    type: empty. Root cause: The final action''s CROSS JOIN with a product subquery
    returned zero rows because the product subquery likely returned no matching product.
    The agent failed to execute the product validation query separately and check
    for emptiness before proceeding to the inventory join, as required by existing
    rule r009. The spec_goal included product identification, and the plan included
    a separate product query step, but the actions merged it into a subquery, which
    caused empty result when product not found. The failing fragment is the last action:
    ''SELECT ... FROM stores s CROSS JOIN (SELECT ...) p LEFT JOIN inventory ...''.
    Rule linkage: new rule must mandate that product validation is executed as a separate
    action and its result non-empty before reuse, and prohibit embedding the product
    subquery in the final join.'
  source: learn
  status: inactive
- content: 'Always include in the SDD ''actions'' array every SQL query and step required
