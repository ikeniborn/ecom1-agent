- agents_md_anchor: null
  content: When extracting a scalar value from a rowset that may be empty (e.g., a
    SQL COUNT that returns no rows due to query error), always include a compute step
    that defaults to 0 if the rowset is empty, using a conditional or a fallback primitive.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The verification step failed because $answer.total was not a number (likely
    null). The observed RPC output for the SQL query was empty, indicating the query
    produced no stdout. The PlanIR extracted the first row from an empty rowset, resulting
    in null, which then failed the >=0 check. The root cause is that the PlanIR did
    not handle an empty rowset gracefully. A fallback to 0 would satisfy the success
    criteria even if the query fails or returns no rows.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not pass a default value as a third argument to the get primitive; get
    accepts exactly two arguments (object, key). To provide a fallback value, use
    a conditional or a separate compute step.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''compute step ''get'' failed: <lambda>() takes 2 positional
    arguments but 3 were given. CONTRACT: get(obj, key)''. The PlanIR compute step
    used ''get'' with three arguments: ''$first_row'', ''total'', and 0. The get primitive
    only supports two arguments. The third argument (0) was intended as a default,
    but get does not accept defaults. The existing rule already advises using conditionals
    or fallback primitives for empty rowsets, but this specific misuse of get''s signature
    needs a direct prohibition.'
  status: inactive
  surface: ir
