- agents_md_anchor: '#plan-phase'
  content: When planning to query a database, do not hardcode a file path; first use
    a discovery step (e.g., list directory contents or search for known filenames)
    to locate the actual database file, and only then bind the verified path to a
    Stat or Exec call.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: ''real_vm: stat failed: not found''. The PlanIR hardcoded the
    path ''/catalog/catalogue.db'' in a Stat discovery step, but that file does not
    exist on the real VM. The root cause is assuming a fixed database location without
    verification. The failing fragment: {"rpc":"Stat","args":{"path":"/catalog/catalogue.db"},"bind":"db_stat"}.
    The rule instructs the PLAN phase to always discover the actual file path before
    binding it to a Stat or Exec call.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a discovery step (e.g., reading a policy note) provides a specific
    field name or identifier for a query, always use that field in the query; do not
    assume a generic column name.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''ge'', ''lhs'':
    ''$answer.count'', ''rhs'': 0, ''args'': []}. The PlanIR used ''category = \''Metal
    and Concrete Paint\'''' in the SQL query, but the policy note explicitly stated
    ''product_kind_id'' as the field and ''metal_concrete_paint'' as the value. The
    observed RPC output from the Read step contained that information, yet the plan
    did not use it. The root cause is a planning error: the query was built with a
    hardcoded column name instead of the discovered field name, leading to an empty
    or invalid result and a missing count value.'
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-phase'
  content: Always include in the answer object all fields referenced by success_criteria,
    even if the message skeleton also uses them. The answer object must contain the
    actual computed values, not just a pre-formatted message string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''ge'', ''lhs'':
    ''$answer.count'', ''rhs'': 0, ''args'': []}. The script''s answer branches only
    provided a ''message'' string (e.g., ''<COUNT: 0>'') but did not include a ''count''
    field in the answer object. Because $answer.count was missing, the success criteria
    check failed. The answer object must contain all fields referenced by success_criteria,
    not just a formatted message.'
  status: inactive
  surface: ir
