- agents_md_anchor: null
  content: When a required policy document specifies a database file path, always
    include a compute step to extract that path from the document content and bind
    it to a variable; use that variable in subsequent Stat/Exec calls instead of hardcoding
    a path.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: ''real_vm: stat failed: not found''. The PlanIR hardcoded ''/catalog/catalogue.db''
    for the Stat call, but the actual database file was not at that location. The
    policy doc likely contained the correct path, but the PlanIR did not extract it.
    This violates r003 (do not hardcode paths; discover them). The root cause is a
    missing extraction step after reading the policy doc. The corrective rule instructs
    the PLAN phase to always parse the database path from the policy document content
    and bind it, rather than assuming a default path.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not pass a predicate as a second argument to the any_true primitive;
    any_true expects only a list. To test for existence of rows matching a condition,
    first use a filter step to produce a filtered list, then apply any_true to that
    filtered list.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'The interpret error ''any_true failed: <lambda>() takes 1 positional
    argument but 2 were given'' occurred because the PlanIR compute step ''any_true''
    was called with two arguments: a list and a predicate object. The interpreter''s
    any_true implementation expects a single list argument. The failing PlanIR fragment:
    {"prim":"any_true","args":["$schema_rows",{"op":"eq","lhs":"$row.table_name","rhs":"products"}],"into":"has_products"}.
    The root cause is an incorrect assumption about the any_true primitive''s signature.
    The rule instructs the PLAN phase to avoid this pattern and instead use a separate
    filter step before any_true.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use a Find step to locate a database file when a required policy
    document specifies the file path; instead, after reading the document, use a compute
    step to extract the path and bind it to a variable, then use that variable in
    the Exec step.
  created: '2026-06-22'
  deactivated_reason: Superseded by a general rule that covers both discovery RPCs
    and hardcoding.
  id: r008
  reasoning: 'Error: real_vm: find failed: not found. The PlanIR used a Find step
    for *.db under /catalog, which returned nothing. The required policy document
    likely contains the exact database file path, but the PlanIR did not extract it.
    The existing in-session rule already advises extracting the path, but the PlanIR
    ignored it. This new rule explicitly prohibits the Find step in such cases to
    prevent grounding failures.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use a List RPC to discover a database file path when a required policy
    document already specifies the path; instead, extract the path directly from the
    document content using a compute step (e.g., regex or string extraction) and bind
    it to a variable for use in Exec.
  created: '2026-06-22'
  deactivated_reason: Superseded by a general rule that covers both discovery RPCs
    and hardcoding.
  id: r009
  reasoning: 'The plan attempted to list ''/catalog'' to find the database file name,
    but the directory does not exist (real_vm: list failed: not found). The required
    policy document likely contains the exact database file path, so the plan should
    have extracted it directly from the document content rather than using a List
    RPC. The existing in-session rule advises extracting the path from the doc, but
    the plan still used List; this new rule explicitly forbids that pattern.'
  status: inactive
  surface: ir
