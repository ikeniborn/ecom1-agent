- agents_md_anchor: '#important-tools > sql'
  content: Always derive the answer outcome from validated RPC results rather than
    copying answer_template.outcome verbatim; before emitting OUTCOME_OK, assert the
    bound op result is non-empty and not an error/clarification payload, and emit
    the failure/clarification outcome (not a fabricated success with a placeholder
    value) when the aggregate is missing or the query errored.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''.
    Root cause: codegen hard-coded vm.answer(outcome="OUTCOME_OK") copied straight
    from answer_template, then fed it a cnt that fell through to the literal "0" default
    (`if cnt == "": cnt = "0"`). The failing count query against `products`/`category`
    returned no usable cnt row (schema discovery output was discarded via `_ = _stdout(schema)`),
    so the harness resolved the run to OUTCOME_NONE_CLARIFICATION while the script
    still claimed success. Failing fragment: `cnt = "0"` followed by `vm.answer(message=message,
    outcome="OUTCOME_OK", ...)`. Linkage: r001 covers parsing discovery + not defaulting
    aggregates to a placeholder, and r002 covers emitting all planned RPCs; neither
    covers the distinct technique of gating the success outcome on result validity
    instead of trusting the static answer_template.outcome, which is the direct cause
    of the OUTCOME_OK vs OUTCOME_NONE_CLARIFICATION divergence.'
  status: active
