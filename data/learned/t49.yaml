- agents_md_anchor: null
  content: Always extract the database file path from a required policy document by first parsing the
    document content into a rowset (using Read and a rowset step with format auto_delim), then using a
    compute step to select the path column; never hardcode the path in an Exec step.
  created: '2026-06-22'
  deactivated_reason: null
  id: r013
  reasoning: The PlanIR hardcoded '/catalog/products.db' in the Exec step, ignoring the required policy
    document content. This caused the interpreter to produce OUTCOME_NONE_CLARIFICATION instead of OUTCOME_OK,
    likely because the database could not be found or the required ref was not properly grounded. Existing
    rule r010 prohibits hardcoding, but the script also failed to parse the policy document into a rowset
    to extract the path, violating r012. The new rule enforces rowset parsing and compute-based extraction,
    preventing hardcoded assumptions.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always parse the output of /bin/id into a rowset and compute the identity kind explicitly;
    never bind the raw output directly to identity when a security constraint depends on identity.kind.
  created: '2026-06-22'
  deactivated_reason: null
  id: r014
  reasoning: The plan bound the raw /bin/id output to 'identity' without parsing. The security constraint
    'security.md' deny_when evaluated $identity.kind as 'guest' (likely defaulting to 'guest' when field
    missing), causing a false deny. Observed /bin/id output shows user emp_011, not guest. The plan must
    parse the output into a rowset and compute kind from the user field.
  status: active
  surface: ir
