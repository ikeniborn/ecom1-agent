entries:
- agents_md_anchor: '#important-tools > sql'
  content: Never discard discovery RPC output; parse the schema/discovery result to
    confirm referenced tables and columns exist before querying, and treat an empty
    discovery response or zero result rows as a failure signal rather than silently
    defaulting an aggregate to a placeholder like "0".
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim ERROR: ''answer_refs: template/constraints require runtime
    refs ... but actual refs [''/proc/catalog''] contain only static template entries
    ... SQL likely returned no rows''. OBSERVED_RPC_OUTPUTS show BOTH execs returned
    <empty>: the schema discovery query and the count query produced no stdout. Root
    cause: script fetched discovery then threw it away — fragment `_ = _stdout(schema)`
    — so it never validated that table `products`/column `category` actually exist
    in the projection. When the count query returned empty stdout, fragment `if cnt
    == "": cnt = "0"` silently fabricated a count and emitted OUTCOME_OK with only
    the static template ref. Rule linkage: codegen must consume discovery output to
    adapt SQL identifiers and must escalate empty results as failure instead of masking
    them with a default value.'
  status: active
- agents_md_anchor: null
  content: Always emit every RPC declared in tool_plan (discovery RPCs and ops RPCs)
    unconditionally; never insert an early-return or vm.answer branch that skips a
    planned Exec when a discovery/intermediate result is empty or unparsable, because
    fidelity validates the exact RPC multiset and a short-circuit drops a required
    call.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer, Exec, Exec] got: [Answer, Exec]''. Root cause: script
    ran schema discovery Exec, then guarded `if not schema_out.strip(): vm.answer(...);
    return` — when discovery output parsed empty, the function early-returned after
    only ONE Exec, never reaching the second (count) Exec. Failing fragment: lines
    `if not schema_out.strip(): vm.answer(message=...); return`. Plan mandates two
    Exec RPCs (discovery bind=schema, ops bind=count_row) plus Answer = multiset [Exec,Exec,Answer];
    the conditional abort produced [Exec,Answer]. Linkage: prior in-session rule pushed
    ''treat empty discovery as failure rather than default placeholder'', which motivated
    the abort branch; new rule refines that — discovery emptiness may be diagnosed
    but must NOT skip subsequent planned RPCs, since fidelity counts the call multiset,
    not values.'
  status: active
