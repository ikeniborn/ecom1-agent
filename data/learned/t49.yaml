- agents_md_anchor: null
  content: Always extract the database file path from a required policy document using
    a compute step; never use a Find or List RPC to discover it, and never hardcode
    the path in an Exec step.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more specific rule that requires parsing the
    policy document into a rowset before extracting the path, covering both the prohibition
    of hardcoding and the rowset-based extraction method.
  id: r010
  reasoning: 'The PlanIR hardcoded the database path ''/catalog/products.db'' and
    ignored the policy document content. The required policy document likely specifies
    the correct path and possibly the query details. The outcome was OUTCOME_NONE_UNSUPPORTED
    because the hardcoded path or query failed, resulting in an empty value. Existing
    rules r008 and r009 prohibit using Find/List to discover the path, but they didn''t
    explicitly forbid hardcoding. This new rule generalizes: always extract the path
    from the document, never hardcode.'
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-concat-arity'
  content: When using the concat primitive, provide exactly two arguments; to concatenate
    more than two strings, chain multiple concat steps.
  created: '2026-06-22'
  deactivated_reason: null
  id: r011
  reasoning: 'The compute step ''concat'' failed because it was given three arguments
    (a string, a ref, and another string), but the concat primitive expects exactly
    two arguments. To build a SQL query with a variable in the middle, use two concat
    steps: first concat the prefix with the variable, then concat that result with
    the suffix.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always extract file paths from policy documents using a compute step that
    reads the document as a rowset and selects the appropriate column; do not use
    custom extractors that may return non-rowset data.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more specific rule that requires parsing the
    policy document into a rowset before extracting the path, covering both the prohibition
    of hardcoding and the rowset-based extraction method.
  id: r012
  reasoning: The error 'bad argument type for built-in operation' occurred because
    the PlanIR used a custom extractor 'fuzzy_sku_receipt' on the policy document,
    which likely returned non-rowset data, causing the subsequent `column` primitive
    to produce a non-list value, which then caused `first` or `Exec` to fail with
    a type error. The plan should have extracted the database path directly from the
    policy document's table using a compute step with `column` on the document's rowset,
    not via a custom extractor designed for receipts.
  status: inactive
  surface: ir
