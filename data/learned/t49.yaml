- agents_md_anchor: '#important-tools > sql'
  content: When parsing /bin/sql aggregate output (count(*)/sum/etc.), skip the column-header
    line and read the numeric value from the data row, and treat the query as successful
    because a scalar aggregate always returns exactly one row; never map a parser
    miss on a guaranteed single-row aggregate to a failure outcome such as OUTCOME_NONE_UNSUPPORTED.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED''.
    Root cause: brittle single-row parser failed to extract the aggregate, so cnt
    stayed None and the defensive branch fired. Failing fragment: the parse loop (`token
    = line.split("|")[0]... if token.lstrip("-").isdigit(): cnt = int(token)`) followed
    by `if count_err != 0 or cnt is None: vm.answer(... outcome="OUTCOME_NONE_UNSUPPORTED")`.
    A count(*) query always yields one row, so cnt==None signals a parser/format bug,
    not data absence — emitting a failure outcome is a false negative. Rule linkage:
    complements r003 (don''t fabricate success) by guarding the inverse — don''t fabricate
    failure on a guaranteed-result aggregate; complements r001 which only covers empty-discovery
    handling.'
  status: active
