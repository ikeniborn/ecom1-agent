entries:
- agents_md_anchor: '#plan-concat-arity'
  content: When using the concat primitive, provide exactly two arguments; to concatenate more than two
    strings, chain multiple concat steps.
  created: '2026-06-22'
  deactivated_reason: null
  id: r011
  reasoning: 'The compute step ''concat'' failed because it was given three arguments (a string, a ref,
    and another string), but the concat primitive expects exactly two arguments. To build a SQL query
    with a variable in the middle, use two concat steps: first concat the prefix with the variable, then
    concat that result with the suffix.'
  status: active
  surface: ir
