- agents_md_anchor: null
  content: When a policy doc defines a condition (e.g., checkout eligibility, discount
    limits), always extract that condition from the doc's content and incorporate
    it into the decision branches; never rely on hardcoded assumptions or ad-hoc checks.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: The plan produced OUTCOME_NONE_UNSUPPORTED instead of OUTCOME_OK. The
    most likely cause is the not_checkoutable branch triggered because the plan used
    a hardcoded inventory check (lines_failing > 0) to determine checkoutability,
    ignoring the /docs/checkout.md policy doc that was read but never consulted. The
    doc may define checkoutability based on basket status or other criteria, not solely
    inventory. The plan must extract eligibility rules from policy docs and use them
    in decision branches, not substitute its own heuristics. Additionally, the plan
    violated r004 (stdin usage) which could have caused issuer lookup failure, but
    the primary flaw is the missing doc-driven logic.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always provide both the object and the key arguments when using the `get`
    primitive in compute steps; never call `get` with a single argument. If the intent
    is to retrieve a value from a known context (e.g., identity), use the appropriate
    primitive or query instead.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: interpret: compute step ''get'' failed: <lambda>() missing 1
    required positional argument: ''key''. Root cause: the PlanIR compute step `{"prim":"get","args":[null],"into":"discount_issuer_employee_id"}`
    provides only one argument (null) to the `get` primitive, which requires two arguments
    (object and key). The plan incorrectly attempted to retrieve an employee ID from
    null instead of querying the employee_accounts table or using a proper identity
    source. This is a PlanIR shape bug: the `get` primitive was misused. No existing
    rule covers correct usage of the `get` primitive in compute steps.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the `concat` primitive to build strings; use `str_concat` or
    `template` primitive instead. The `concat` primitive is only for merging rowsets
    (list[dict] rows) and requires exactly two arguments, both of which must be list[dict]
    rows.
  created: '2026-06-24'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: interpret compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. The PlanIR called concat with a single
    string argument (e.g., ''matthias.schuster+cust986@icloud.com'') and later with
    multiple string arguments to build an SQL string. The concat primitive is defined
    to accept exactly two arguments, both of which must be list[dict] rows (output
    of rowsets). Using concat for string construction is incorrect. The correct approach
    is to use a dedicated string concatenation primitive (e.g., str_concat or template)
    for building strings. This rule prevents future misuse of concat.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never apply list primitives (e.g., `first`, `last`, `filter`) directly
    to the result of a `Search` RPC; always access the `results` property of the `SearchResponse`
    to obtain the list of matches before using list operations.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: interpret: compute step ''first'' failed: ''SearchResponse''
    object is not subscriptable. The PlanIR applied `first` to `$discount_search_results`,
    which is the output of a `Search` RPC. The `Search` RPC returns a `SearchResponse`
    object, not a list, so it cannot be subscripted. The root cause is that the PLAN
    phase assumed the `Search` response is a list. The corrective rule instructs the
    PLAN phase to always extract the `results` property from a `SearchResponse` before
    using list primitives, ensuring the data is in the expected sequence format.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a security constraint defines a deny_when condition on $discount_issuer_employee_id,
    always include a dedicated query to employee_accounts to retrieve the employee_id
    for the current session (using $_facts.identity.employee_id or equivalent) and
    bind it to $discount_issuer_employee_id. Then use that variable in the decision
    branch for security denial; do not substitute with any other field (e.g., basket's
    existing_discount_issuer_employee_id).
  created: '2026-06-24'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). The PlanIR produced a decision
    branch ''denied_security'' that triggered when $existing_discount_issuer_employee_id
    (from the basket row) was null. However, the security constraint in TOOL_PLAN
    defines deny_when as isnull $discount_issuer_employee_id, which is supposed to
    come from a lookup to employee_accounts using the current session''s employee_id.
    The plan omitted that lookup entirely, so the variable $discount_issuer_employee_id
    was never computed. Consequently, the security decision was based on an irrelevant
    field (the basket''s existing discount issuer, which is null because the basket
    has no discount), causing a spurious denial. The correct approach is to always
    perform the employee identity query and use its result for the security branch.'
  status: active
  surface: ir
