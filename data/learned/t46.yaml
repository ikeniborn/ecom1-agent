- agents_md_anchor: null
  content: When a policy doc defines a condition (e.g., checkout eligibility, discount limits), always
    extract that condition from the doc's content and incorporate it into the decision branches; never
    rely on hardcoded assumptions or ad-hoc checks.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: The plan produced OUTCOME_NONE_UNSUPPORTED instead of OUTCOME_OK. The most likely cause is
    the not_checkoutable branch triggered because the plan used a hardcoded inventory check (lines_failing
    > 0) to determine checkoutability, ignoring the /docs/checkout.md policy doc that was read but never
    consulted. The doc may define checkoutability based on basket status or other criteria, not solely
    inventory. The plan must extract eligibility rules from policy docs and use them in decision branches,
    not substitute its own heuristics. Additionally, the plan violated r004 (stdin usage) which could
    have caused issuer lookup failure, but the primary flaw is the missing doc-driven logic.
  status: active
  surface: ir
