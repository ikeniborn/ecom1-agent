- agents_md_anchor: null
  content: Do not include a decision branch that denies based solely on identity.kind;
    always discover the required operations for the desired outcome first and rely
    on execution-time security enforcement.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The plan's decision branch unconditionally denied when identity.kind
    == 'guest', causing OUTCOME_DENIED_SECURITY despite the desired OUTCOME_OK. The
    plan did not discover the required operations (e.g., discount application) or
    verify whether a guest could perform them. The root cause is a premature security
    check that assumes all guest access is forbidden without knowing the specific
    operations. The corrective rule instructs the PLAN phase to avoid preemptive denial
    and instead discover operations and let execution enforce security.
  status: inactive
  surface: ir
