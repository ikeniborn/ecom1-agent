- agents_md_anchor: null
  content: Never use concat with a single argument; concat requires two list[dict]
    arguments. To bind a literal string, use a 'literal' compute step or extract the
    value from a rowset.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The compute step ''concat'' failed with: ''<lambda>() missing 1 required
    positional argument: b''. The contract for concat is: both args must be list[dict]
    rows. The failing PlanIR fragment is: {"prim":"concat","args":["ralf.albers+cust998@yahoo.com"],"into":"customer_email"}.
    The root cause is misuse of concat to bind a literal string instead of merging
    two rowsets. The new rule prohibits this misuse and suggests proper alternatives.'
  status: inactive
  surface: ir
