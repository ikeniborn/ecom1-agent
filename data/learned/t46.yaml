- agents_md_anchor: '#important-things > policy-grounding'
  content: When a grounding/policy search (Search over docs) returns multiple matching
    documents, include every matched document path in the answer refs — never collapse
    to hit_paths[0] — so required policy references like a security doc are not dropped
    from the grounding set.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/security.md''".
    Root cause: script narrowed the service_recovery policy search to a single document.
    Failing fragment: `hit_paths = _extract_paths(policy_hits); if hit_paths: policy_doc_path
    = hit_paths[0]` then `if policy_doc_path: refs.append(policy_doc_path)`. Only
    the first Search hit was bound and added to refs; /docs/security.md (a required
    grounding doc among the matches) was never referenced. The policy max percent
    and its grounding span more than one doc, so refs must carry all matched policy
    paths, not just index 0. Rule linkage: distinct from r001/r002 (RPC-emission fidelity);
    this targets answer-reference completeness from a multi-hit search — the policy-grounding
    constraint.'
  status: active
