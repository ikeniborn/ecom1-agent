- agents_md_anchor: null
  content: Never use /bin/id to determine caller identity for decision branches; always query the relevant
    accounts table (e.g., employee_accounts) to verify the caller's role, or omit the identity check entirely
    and rely on execution-time security enforcement.
  created: '2026-06-22'
  deactivated_reason: null
  id: r003
  reasoning: The plan produced OUTCOME_NONE_CLARIFICATION because the decision branch condition `$caller_identity.kind
    != 'employee'` could not be evaluated. The discovery step `Exec /bin/id` likely returned non-JSON
    output (e.g., 'uid=1000(employee) ...'), causing the rowset with format 'json' to fail to extract
    the 'kind' column. This left the decision variable undefined, leading to a clarification outcome.
    The plan should have either omitted the identity branch (per existing rule r001) or used a database
    query to check employee status, which would have produced a reliable boolean.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use the `stdin` field in Exec RPCs; always pass input data (e.g., SQL) as command-line
    arguments via the `args` array.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via stdin''. The PlanIR
    used Exec RPCs with a `stdin` field to pass SQL to /bin/sql, but the interpreter does not deliver
    that content to the process''s stdin, causing the tool to print its usage banner. Root cause: Exec
    RPC implementation expects input via command-line arguments, not stdin. Failing PlanIR fragment: discovery
    Exec RPCs for issuer_sql_output, basket_sql_output, new_json_10_text, new_json_5_text all used `stdin`.'
  status: active
  surface: ir
- content: null
  created: '2026-06-22'
  id: v015
  score: 0.0
  score_detail:
  - expected outcome OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED
  source: verdict
  status: active
  submitted_message: No basket found for customer .
  submitted_outcome: OUTCOME_NONE_UNSUPPORTED
  submitted_refs:
