- agents_md_anchor: null
  content: When the plan selects an element by position (e.g. $last_file means the
    last entry in listing order), index it directly from the listing's returned order;
    never inject an undeclared sort key (mtime, name, ctime) that can reorder entries
    and pick a different item than the plan specifies.
  created: '2026-06-14'
  deactivated_reason: 'r002''s blanket prohibition on sort keys caused codegen to
    take raw listing order even though success_criteria declared a ''most recent /
    latest by sorted filename'' ordering, producing the wrong reference. The new rule
    supersedes it: it preserves r002''s positional-indexing behavior only for the
    no-declared-ordering case while requiring a declared-key sort when the plan specifies
    one.'
  id: r002
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/incoming/payments/inpay_Rj5zF3qb.json''".
    Root cause: tool_plan.success_criteria states the file must be ''selected deterministically
    from the listing order'' and binds Read to $last_file, but CODEGEN added an mtime-based
    ranking not declared in the plan. Failing fragment: `ranked = [(_mtime(e), i,
    e) ...]; if all(r[0] is not None ...): ranked.sort(key=lambda t: (t[0], t[1]));
    last_entry = ranked[-1][2]`. When every entry carried an mtime, this sort overrode
    listing order and selected a file other than the listing-order-last one (inpay_Rj5zF3qb.json),
    so refs cited the wrong path. Linkage: a positional plan binding ($last) must
    be resolved by listing index, not by an invented secondary sort; this is a CODEGEN
    translation technique, distinct from r001 (which governs firing all planned ops).'
  status: inactive
