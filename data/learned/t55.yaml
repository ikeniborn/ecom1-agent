- agents_md_anchor: null
  content: Do not set the default_label to 'deny' when a security constraint is present;
    instead, set it to a label that proceeds to the main objective (e.g., 'proceed').
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_DENIED_SECURITY. The
    PlanIR decision has only a deny branch for guest identity and a default_label
    of ''deny'', causing all non-guest identities to also be denied. The IntentSpec
    requires deny only when identity.kind is guest, so the default branch must lead
    to the main objective (retrieving payment details). Failing PlanIR fragment: decision.default_label
    = ''deny''. Existing rule r006 already states the default branch should proceed
    to the main objective, but the plan violated it; this new rule explicitly forbids
    using ''deny'' as the default label in security-constrained plans.'
  status: active
  surface: ir
