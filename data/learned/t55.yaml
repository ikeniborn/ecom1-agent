- agents_md_anchor: '#payment-access-control'
  content: When a security constraint references fields from a record, the PlanIR
    must include discovery steps to fetch that record using the provided query or
    path, and to fetch identity roles if referenced. The decision must evaluate all
    deny conditions, with the default_label set to the allowed outcome. The answer
    must include a branch for the allowed outcome with the required refs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The script''s decision only checks for guest identity and defaults to
    denied, ignoring the other deny conditions (customer not owning, employee without
    role). It also fails to fetch the payment record and identity roles, so it cannot
    evaluate those conditions. The error ''expected outcome OUTCOME_OK, got OUTCOME_DENIED_SECURITY''
    indicates the test identity was allowed, but the script denied. Root cause: incomplete
    constraint evaluation and missing data retrieval. The new rule ensures future
    PlanIRs fetch all necessary data and implement full decision logic.'
  status: inactive
  surface: ir
