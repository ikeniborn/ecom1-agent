- agents_md_anchor: null
  content: Never include identity-based deny conditions in the decision unless the
    IntentSpec explicitly requires them.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The plan included a decision branch that denied access when identity_kind
    was 'guest', leading to OUTCOME_DENIED_SECURITY. The IntentSpec has no security
    constraints and only requires a nonempty last_transaction with a specific record_path
    prefix. The spurious identity check caused the failure. The plan should only evaluate
    the success criteria and default to the allowed outcome when they are met.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use 'column' on a single row; use 'get' to extract a field from
    a single row.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: ''column'' expects list[dict]; use ''get'' for a single row.
    Root cause: PlanIR used ''first'' to reduce rows to a single row, then applied
    ''column'' to that row. The contract requires ''get'' for single-row field extraction.
    Failing PlanIR fragment: compute steps after ''first'' used ''column'' on $row.'
  status: active
  surface: ir
