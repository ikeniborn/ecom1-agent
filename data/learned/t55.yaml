- agents_md_anchor: null
  content: Do not use 'column' on a single row; use 'get' to extract a field from
    a single row.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: ''column'' expects list[dict]; use ''get'' for a single row.
    Root cause: PlanIR used ''first'' to reduce rows to a single row, then applied
    ''column'' to that row. The contract requires ''get'' for single-row field extraction.
    Failing PlanIR fragment: compute steps after ''first'' used ''column'' on $row.'
  status: inactive
  surface: ir
- agents_md_anchor: '#security'
  content: When the IntentSpec contains a security constraint, the PlanIR must include
    a discovery step to resolve the identity fact and a decision branch that evaluates
    the deny condition, with a deny outcome only when the condition is true, and a
    default branch that proceeds to the main objective.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_DENIED_SECURITY. Root
    cause: PlanIR produced a hardcoded deny outcome without checking the user''s identity.
    The IntentSpec includes a security constraint that denies guests, but the plan
    must first discover the identity and then conditionally deny only if the user
    is a guest; otherwise, it should retrieve the transaction. The failing PlanIR
    fragment: decision with no branches and default_label ''deny'', no discovery for
    identity. Existing rule r004 permits identity-based deny conditions when explicitly
    required, but the plan omitted the required identity check entirely.'
  status: inactive
  surface: ir
