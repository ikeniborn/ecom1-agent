- agents_md_anchor: null
  content: When using an Exec RPC to retrieve rows, the PlanIR must include a custom_extract
    step to parse the stdout into a list of rows before using sequence primitives
    like 'first'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: ''interpret: compute step ''first'' failed: ''ExecResponse''
    object is not subscriptable''. The PlanIR bound the Exec RPC result directly to
    ''payment_rows'' and then applied ''first'' to it. Exec RPC returns an ExecResponse
    object, not a list. The compute step expected a sequence. Root cause: missing
    extraction of rows from stdout. The failing PlanIR fragment: discovery step with
    bind ''payment_rows'' and compute step ''first'' on ''$payment_rows''. The new
    rule instructs to always parse stdout into a list before using sequence primitives.'
  status: inactive
  surface: ir
