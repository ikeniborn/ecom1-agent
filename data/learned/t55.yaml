  content: When a security constraint denies only for a specific condition, the decision
    default_label must lead to the allowed outcome, and the answer must include a
    branch for that outcome with the required refs.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more comprehensive rule that includes data fetching
    and full constraint evaluation, while retaining the default_label and answer branch
    guidance.
  id: r001
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_DENIED_SECURITY. The
    PlanIR decision only has a branch for guest -> denied and default_label ''denied'',
    so it always denies. The constraint only denies guest identities; non-guests should
    be allowed. The answer lacks an allowed branch with required refs (record_path).
    Root cause: default_label and missing allowed branch.'
