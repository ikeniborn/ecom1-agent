- agents_md_anchor: null
  content: When success_criteria or intent define a selection ordinal by explicit
    ordering semantics (e.g. 'most recent' / 'latest by timestamp field or by sorted
    filename'), sort the listing entries by that declared key and pick the extreme
    element; only index raw listing order when no ordering is declared.
  created: '2026-06-14'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/incoming/payments/inpay_jMqoicx7.json''".
    Root cause: tool_plan.success_criteria define ''the last transaction'' = the MOST
    RECENT file (latest payment_created_at, or latest by sorted filename when timestamps
    tie) — a declared ordering, not a raw listing position. The script instead interpreted
    ''last'' as the final entry in listing order and explicitly cited r002 to refuse
    any sort, picking the wrong file. Failing fragment: `# ''last'' == last entry
    in listing order; no injected sort key (r002).` followed by `chosen = file_entries[-1]`.
    Rule linkage: r002''s absolute ''never inject an undeclared sort key'' was over-applied
    here — the sort key WAS declared (in success_criteria/intent), so sorting by sorted-filename/timestamp
    was required to select inpay_jMqoicx7.json. The new rule restores declared-ordering
    selection and subsumes r002''s positional case (fall back to listing order only
    when no ordering is declared).'
  status: active
