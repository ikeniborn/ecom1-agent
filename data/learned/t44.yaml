- content: 'For refund approval requests ("approve the refund for payment pay_037"):
    run tree:/docs/ to find returns policy docs (e.g. /docs/returns.md), read it.
    Then search /proc/returns/ for a return record linked to pay_037 — use search:pay_037
    /proc/returns/ or list:/proc/returns/ then read the file. The return record is
    /proc/returns/ret_019.json (or similar). Include the return record path in grounding_refs.
    Do NOT read /proc/payments/pay_037.md directly — it does not exist.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r003
  reasoning: Expected grounding ref is /proc/returns/ret_019.json. Agent must find
    return record for pay_037 in /proc/returns/ not in /proc/payments/.
  source: manual
  status: active
- content: 'For refund approval denial tasks ("Approve the refund for payment PAY_ID"):
    NEVER return DENIED_SECURITY after reading only /docs/returns.md. BOTH /docs/returns.md
    AND /docs/security.md MUST be read (appear in FILES_READ_IN_PRIOR_CYCLES) before
    returning DENIED_SECURITY. grounding_refs MUST include both paths. The returns
    policy says to apply security.md first — always follow that instruction.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r004
  reasoning: Agent returned DENIED_SECURITY with only returns.md in grounding_refs.
