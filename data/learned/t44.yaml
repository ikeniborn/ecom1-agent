- agents_md_anchor: null
  content: Always set the decision's default_label to the desired outcome (e.g., OUTCOME_OK)
    and only add branches for denial conditions; never set default_label to a denial
    outcome unless the denial condition is always true.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The plan's decision had a single branch for guest -> denied_security
    and default_label also denied_security, causing all paths to yield OUTCOME_DENIED_SECURITY.
    The correct plan should have default_label OUTCOME_OK and a branch for guest ->
    denied_security. The error is purely a decision-structure bug.
  status: inactive
