entries:
- agents_md_anchor: '#security-guest-access'
  content: 'When using identity roles in decision branches that require a list (e.g.,
    contains_any), always pre-process roles with a compute step that coerces the value
    to a list: if it is a string, wrap it in a list; if it is null or missing, default
    to an empty list.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error ''real_vm: bad argument type for built-in operation'' occurred
    during execution. Root cause: the /bin/id command returned a JSON object where
    the ''roles'' field was not a list (likely a string or missing), causing the decision
    primitive ''contains_any'' to fail because it expects a list as its first argument.
    Failing PlanIR fragment: decision branch {"when":{"op":"not",...,"args":[{"op":"contains_any","lhs":"$identity.roles","rhs":["refund_manager"]}]}}.
    The rule ensures identity roles are normalized to a list before list-based operations,
    preventing type errors in security checks.'
  status: inactive
  surface: ir
