- agents_md_anchor: null
  content: When a param is defined as a record from a table, always include a decision
    branch that checks if the record was found (i.e., the rowset is non-empty), and
    if not, set the outcome to OUTCOME_NONE_UNSUPPORTED.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: The PlanIR only had a decision branch for guest identity, and the default
    branch also set OUTCOME_DENIED_SECURITY. The return_request lookup for pay_023
    returned no rows, so the correct outcome should have been OUTCOME_NONE_UNSUPPORTED,
    as the grader expected. The PlanIR lacked a branch to handle missing record, causing
    the wrong outcome.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the 'get' primitive with a single argument; 'get' requires an
    object and a key. To assign a literal value to a param, use a 'literal' compute
    step instead.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'The compute step ''get'' failed with ''missing 1 required positional
    argument: key'' because the script provided only one argument (''pay_027'') instead
    of the required two (object, key). The intent was to set the payment_id param
    to the literal ''pay_027'', but ''get'' is designed to retrieve a value from an
    object by key. The correct approach is to use a ''literal'' compute step to assign
    a constant value. The script also omitted a discovery step for the return_requests
    table, but the immediate error is the misuse of ''get''.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When binding identity from /bin/id, always parse the output into a structured
    fact with a 'kind' field (e.g., 'employee', 'guest') and bind it as $identity,
    so that decision branches and security constraints can reference $identity.kind.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: The script bound the raw /bin/id output to 'identity' but did not parse
    it into a structured object with a 'kind' field. The decision branch `$identity.kind
    == 'guest'` therefore never matched, causing the script to fall through to the
    default 'unsupported' outcome. The security constraint's deny_when condition evaluated
    true (likely because the interpreter extracted 'kind' from the raw output differently),
    but the script's outcome was OUTCOME_NONE_UNSUPPORTED, violating the constraint.
    The fix is to parse the /bin/id output to set identity.kind explicitly.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the 'concat' primitive with a single argument; concat requires
    exactly two arguments, each of which must be a list of dicts (rows) from a rowset.
    To assign a literal value to a variable, use a 'literal' compute step instead.
  created: '2026-06-24'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. The PlanIR contains a compute step with
    prim=''concat'' and args=[''ret_014''], providing only one argument. The concat
    primitive expects two row arguments (list[dict]) to concatenate. The plan attempted
    to assign a literal string to return_id, which is a plan-shape bug. The correct
    technique is to use a ''literal'' compute step for literal assignments. No existing
    rule covers this misuse of concat (r009 covers ''get'', not concat).'
  status: active
  surface: ir
- agents_md_anchor: '#security'
  content: When the plan includes a security constraint that depends on identity.kind
    (e.g., deny_when identity.kind == guest), the discovery phase MUST include an
    Exec RPC to run '/bin/id' and parse its output into a structured fact with a 'kind'
    field, bound as $identity. Do not hardcode identity values or derive identity
    from any other source.
  created: '2026-06-24'
  deactivated_reason: null
  id: r012
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds. Root cause: The PlanIR set $identity to a literal string
    ''guest'' via a ''get'' primitive on a hardcoded object, without running /bin/id.
    The security constraint''s deny_when predicate expects $_facts.identity.kind to
    be set from /bin/id, but it was never set, so the predicate did not hold, causing
    spurious over-refusal. The plan also failed to include an Exec RPC for /bin/id
    as required by the security policy. Rule r010 advises parsing /bin/id output but
    does not mandate running it when security depends on identity.kind. New rule fills
    that gap.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never include a default branch that maps to an outcome not in the outcome_space.
    The plan's decision branches must only produce outcomes that are listed in the
    outcome_space. If a default_label is used, it must be one of the allowed outcomes,
    or the decision must cover all cases with explicit branches that map to allowed
    outcomes.
  created: '2026-06-24'
  deactivated_reason: null
  id: r013
  reasoning: 'Error: verify: I2: outcome ''OUTCOME_OK'' not in outcome_space [''OUTCOME_DENIED_SECURITY'',
    ''OUTCOME_NONE_UNSUPPORTED'']. The PlanIR had a decision with branches for denied_security
    and unsupported, but a default_label ''ok'' that mapped to outcome ''OUTCOME_OK'',
    which is not in the allowed set. The root cause is that the plan assumed a success
    outcome, but the TOOL_PLAN only defines two outcomes. The plan must ensure that
    every possible path leads to an outcome in the outcome_space. The fix is to remove
    the ''ok'' branch and either omit the default or set it to one of the allowed
    outcomes, and cover all cases with branches that map to allowed outcomes.'
  status: active
  surface: ir
