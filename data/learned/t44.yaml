- agents_md_anchor: null
  content: Always set the answer block's outcome to the desired_outcome from the IntentSpec,
    not a hardcoded value.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'The grader expected outcome OUTCOME_NONE_UNSUPPORTED but the PlanIR''s
    answer block hardcoded OUTCOME_DENIED_SECURITY. The root cause is that the answer
    block did not use the IntentSpec''s desired_outcome. The failing fragment: answer.denied.outcome
    = ''OUTCOME_DENIED_SECURITY''. The new rule ensures the PLAN phase emits the correct
    outcome by referencing the IntentSpec.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a security constraint's deny_when condition holds, always add a decision
    branch that leads to the denial outcome (e.g., OUTCOME_DENIED_SECURITY) and include
    a corresponding answer block for that outcome; never map the denial condition
    to the desired outcome.
  created: '2026-06-22'
  deactivated_reason: r004 did not specify that the decision branch must set the outcome,
    leading to OUTCOME_NONE_CLARIFICATION; new rule explicitly requires setting outcome
    in the branch.
  id: r004
  reasoning: The plan's decision branch for the security constraint '#security-guest-refund'
    mapped to label 'unsupported' (OUTCOME_NONE_UNSUPPORTED) instead of the denial
    outcome. The verify phase detected that the constraint's deny_when held, but the
    outcome was not DENIED_SECURITY. The plan must branch to the denial outcome when
    a security constraint triggers, and the answer block must include that outcome.
    The existing rule r002 says to add branches for denial conditions, but the plan
    still misrouted the branch to the desired outcome. This rule explicitly forbids
    that.
  status: inactive
  surface: ir
