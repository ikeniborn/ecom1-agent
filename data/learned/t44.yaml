- agents_md_anchor: null
  content: When a param is defined as a record from a table, always include a discovery
    step to fetch that record and bind it to the param name, so that required refs
    can be resolved.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: interpret: unresolved required refs [''$return_request.record_path'']
    on OK answer. Root cause: PlanIR omitted any discovery step to fetch the return_request
    record, so the interpreter could not resolve the required ref. The failing PlanIR
    fragment is the empty ''rowsets'' and missing discovery for $return_request. The
    new rule ensures that whenever the IntentSpec defines a param as a record from
    a table, the plan includes a discovery step to materialize that record and bind
    it to the param name, enabling ref resolution.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the concat primitive to build a string; concat is for merging
    two lists of rows. Use a format or template step to construct strings from a template
    and a list of values.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() takes 2
    positional arguments but 3 were given. CONTRACT: concat(a, b): both args must
    be list[dict] rows (parse Exec output via rowsets first). Root cause: the PlanIR
    used concat with three string arguments to build an SQL UPDATE statement, but
    concat is designed to concatenate two lists of rows, not strings. Failing PlanIR
    fragment: {"prim":"concat","args":["UPDATE return_requests SET return_status =
    ''approved'' WHERE return_id = ''","$return_request.return_id","'';"],"into":"update_sql"}.
    The plan should have used a format or template step to construct the SQL string
    from a template and a list of values. No existing rule covers this.'
  status: inactive
  surface: ir
