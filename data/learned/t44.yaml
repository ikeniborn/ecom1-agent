  content: Never use 'Read' or 'Write' RPCs in the ops section of PlanIR; instead,
    use 'Exec' RPCs with appropriate commands to read or write files, ensuring the
    'path' and 'stdin' fields are set correctly.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "g" field.''
    Root cause: The PlanIR ops section contains a ''Read'' RPC, which the real VM
    does not support; it only supports ''Exec'' RPCs. The VM attempts to parse the
    response as an ExecResponse, but the Read operation returns a different response
    structure, causing a protocol mismatch. The failing PlanIR fragment is the ''Read''
    RPC in ops. Rule: Use only ''Exec'' RPCs for all file operations.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always extract the 'stdout' field from an ExecResponse using a 'get' operation
    before using the output in string comparison operations such as contains_any.
  created: '2026-06-25'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "employee" field.''
    Root cause: PlanIR uses `$_identity_raw` (an ExecResponse object) directly in
    a `contains_any` operation with rhs ["employee"]. The VM attempts to access a
    field named "employee" on the ExecResponse, which does not exist. The failing
    fragment is the decision branch: `{"op":"contains_any","lhs":"$_identity_raw","rhs":["employee"]}`.
    The fix is to extract the stdout field from the ExecResponse before string operations.
    This rule ensures proper handling of Exec RPC outputs.'
  status: active
  surface: ir
