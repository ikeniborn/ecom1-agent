- agents_md_anchor: '#important-tools > payments'
  content: Always derive the answer outcome from runtime evidence instead of hardcoding
    OUTCOME_OK; when a planned op invokes a tool subcommand or capability that is
    absent from that tool's --help discovery output (or whose result reports the action
    unsupported), emit OUTCOME_NONE_UNSUPPORTED rather than reporting success.
  created: '2026-06-06'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_NONE_UNSUPPORTED,
    got OUTCOME_NONE_CLARIFICATION''. Root cause: script treats outcome as a constant
    — final call is vm.answer(message=message, outcome="OUTCOME_OK", refs=refs) —
    and emits the op vm.exec(path="/bin/payments", args=["approve-refund", ...]) without
    checking payments_help, the discovery binding that lists supported subcommands.
    The ''approve-refund'' capability is not actually supported by /bin/payments,
    so the correct grounded outcome is OUTCOME_NONE_UNSUPPORTED. Failing fragment:
    the unconditional outcome="OUTCOME_OK" combined with empty parsed fields downgraded
    at the harness to OUTCOME_NONE_CLARIFICATION, never reaching the required UNSUPPORTED.
    Linkage: existing rules r002-r005 govern argument resolution, delimiter parsing,
    and emitting every declared RPC — none govern deriving the outcome field from
    --help capability evidence, so this is a distinct CODEGEN technique, not a duplicate.
    Note it composes with r005: still emit the declared op, but set outcome from its
    result/help, not a literal.'
  status: active
