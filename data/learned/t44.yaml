- agents_md_anchor: null
  content: When a param is defined as a record from a table, always include a decision branch that checks
    if the record was found (i.e., the rowset is non-empty), and if not, set the outcome to OUTCOME_NONE_UNSUPPORTED.
  created: '2026-06-22'
  deactivated_reason: null
  id: r008
  reasoning: The PlanIR only had a decision branch for guest identity, and the default branch also set
    OUTCOME_DENIED_SECURITY. The return_request lookup for pay_023 returned no rows, so the correct outcome
    should have been OUTCOME_NONE_UNSUPPORTED, as the grader expected. The PlanIR lacked a branch to handle
    missing record, causing the wrong outcome.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use the 'get' primitive with a single argument; 'get' requires an object and a key. To
    assign a literal value to a param, use a 'literal' compute step instead.
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'The compute step ''get'' failed with ''missing 1 required positional argument: key'' because
    the script provided only one argument (''pay_027'') instead of the required two (object, key). The
    intent was to set the payment_id param to the literal ''pay_027'', but ''get'' is designed to retrieve
    a value from an object by key. The correct approach is to use a ''literal'' compute step to assign
    a constant value. The script also omitted a discovery step for the return_requests table, but the
    immediate error is the misuse of ''get''.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When binding identity from /bin/id, always parse the output into a structured fact with a 'kind'
    field (e.g., 'employee', 'guest') and bind it as $identity, so that decision branches and security
    constraints can reference $identity.kind.
  created: '2026-06-22'
  deactivated_reason: null
  id: r010
  reasoning: The script bound the raw /bin/id output to 'identity' but did not parse it into a structured
    object with a 'kind' field. The decision branch `$identity.kind == 'guest'` therefore never matched,
    causing the script to fall through to the default 'unsupported' outcome. The security constraint's
    deny_when condition evaluated true (likely because the interpreter extracted 'kind' from the raw output
    differently), but the script's outcome was OUTCOME_NONE_UNSUPPORTED, violating the constraint. The
    fix is to parse the /bin/id output to set identity.kind explicitly.
  status: active
  surface: ir
