- agents_md_anchor: null
  content: When a security constraint's deny_when condition is present, always add
    a decision branch that evaluates the condition using the facts and params, and
    set the branch's 'outcome' to the denial outcome (e.g., OUTCOME_DENIED_SECURITY);
    never rely on the default branch or the answer block's outcome field to set the
    final outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The PlanIR had no decision branches, so the condition was not evaluated.
    The default_label 'denied' led to an answer block with outcome OUTCOME_DENIED_SECURITY,
    but the system did not use that outcome, resulting in OUTCOME_NONE_CLARIFICATION.
    The grader expected OUTCOME_NONE_UNSUPPORTED (likely a misalignment), but the
    root cause is that the outcome was not set by a decision branch. Existing rule
    r004 says to add a branch but does not require setting the outcome in the branch,
    which is necessary.
  status: inactive
  surface: ir
