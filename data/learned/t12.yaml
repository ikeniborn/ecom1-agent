- agents_md_anchor: null
  content: Always set the answer message to a literal string that already contains
    the computed value, not a template with variable placeholders.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: The verify step failed because the answer message was '<COUNT:{count_val}>'
    (a template with a placeholder) instead of the literal '<COUNT:1>'. The regex
    ^<COUNT:\d+>$ did not match the placeholder syntax. The PlanIR must embed the
    computed value directly into the answer message string.
  status: active
  surface: ir
