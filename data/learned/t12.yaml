- agents_md_anchor: null
  content: When a policy document defines a product classification, always extract
    the exact set of products from the document (e.g., by reading its content and
    parsing a list of product IDs or a family identifier) rather than relying on a
    hardcoded product kind name or excluding a family ID.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more specific rule that covers both extraction
    technique and correct handling of ReadResponse fields.
  id: r001
  reasoning: 'Error: grader: Answer should be ''<COUNT:143>''. The PlanIR''s SQL query
    hardcoded product_kind_name = ''Cordless Saw and Sander'' and excluded product_family_id
    != ''fam_power_tools_cordless_saw_sander_0007_uu3fvg4v'', but the policy doc likely
    defines the classification differently (e.g., a specific family or list of IDs).
    The doc was read but its content was not used to ground the query, causing an
    incorrect count. Root cause: PlanIR did not parse the policy doc to determine
    the exact classification criteria. New rule instructs PLAN to always extract classification
    from the doc content.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When querying a database for rows, always use a structured query RPC (e.g.,
    Query) that returns a list of dicts, not Exec with SQL which returns raw text.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''filter_rows'' expects list[dict]; use ''get'' for a single
    row. Root cause: PlanIR discovery step used Exec RPC with SQL ''SELECT product_sku
    FROM product_variants;'' and bound output to ''all_skus_rows''. Exec returns raw
    stdout string, not a list of dicts. The compute step filter_rows then failed because
    its first argument was a string, not a list of dicts. Failing PlanIR fragment:
    discovery step with Exec and compute step filter_rows. Rule linkage: new rule
    to prevent using Exec for structured row retrieval.'
  status: inactive
  surface: ir
