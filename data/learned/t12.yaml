- agents_md_anchor: null
  content: When adding a compute step to PlanIR, always use the 'prim' field to specify the operation
    (e.g., 'extract_regex') and use 'source' to reference the input data. Never include 'name' or 'input'
    fields.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'The PlanIR validation error indicates that a compute step contained a dict with ''name'':
    ''fuzzy_sku_receipt'' and ''input'': ''$policy_text'' instead of the required ''prim'' field. The
    schema expects a ''prim'' field for the operation and does not permit ''name'' or ''input'' as extra
    fields. This rule ensures future compute steps are correctly structured.'
  status: active
  surface: ir
- agents_md_anchor: '#planir-compute-prims'
  content: When the answer shape is a formatted string (e.g., '<COUNT:%d>'), use a compute step with prim
    'format' and args [template, value] to produce the final message string. Never use concat for string
    building; concat is only for merging two row lists.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() takes 2 positional arguments
    but 3 were given. CONTRACT: concat(a, b): both args must be list[dict] rows. Root cause: PlanIR compute
    step used concat with three arguments (a string literal, a number, a string literal) to build a formatted
    message string, but concat is designed to merge two row lists, not to concatenate strings. Failing
    fragment: {"prim":"concat","args":["<COUNT:","$count_num",">"],"into":"final_msg"}. The correct approach
    is to use a ''format'' prim to produce the final message string from a template and the count value.
    This rule ensures future plans use the appropriate prim for string formatting.'
  status: active
  surface: ir
