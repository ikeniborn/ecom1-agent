    exists with filters, apply them; otherwise count all matching products'' allowed
    the raw identifier ''anchors_plugs'' extracted from the policy document to be
    used directly as the kind predicate in SQL, bypassing the verification action
    ''SELECT pk.name, pk.id FROM product_kinds pk WHERE LOWER(pk.name) LIKE ''%anchor%''''.
    Because the database kind identifier does not match the document slug, the query
    returned zero rows. The new rule links to the cited action by mandating that its
    returned values are always used instead of an unverified document kind_id.'
