  id: r002
  reasoning: 'Verbatim error: ''fidelity: AssertionError: fidelity drift (RPC multiset)
    expected: [Answer, Exec, Exec] got: [Answer, Exec, Exec, Search]''. Root cause:
    prior rule r001 told CODEGEN to run a filesystem search to discover the ops-policy
    doc ref and populate answer refs. The failing fragment is `doc_hits = vm.search(root="/docs",
    pattern=label)` plus `_collect_md_paths`, which injects an extra Search RPC absent
    from the tool_plan (discovery=1 Exec, ops=1 Exec, answer=1 Answer). Fidelity compares
    the script''s RPC multiset against the frozen tool_plan exactly, so any unplanned
    RPC fails regardless of correctness. The new rule supersedes r001: ref paths must
    be derived from existing planned RPC outputs or the answer_template, never via
    a newly added search/exec call.'
