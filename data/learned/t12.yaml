- content: 'For any catalogue count report task (''how many products are [TYPE]?''):
    (1) Run tree:/docs/ — files may be in /docs/current-updates/, /docs/catalogue-addenda/,
    or /docs/policy-updates/. Do NOT assume location. (2) READ the identified file
    directly (file-read action, not search). (3) The file gives CRITERIA — typically
    ''count only SKUs with inventory in an open [BRAND] store in [CITY] with available_today
    > 0''. CRITICAL: Apply ALL criteria from the policy doc in your SQL. Do NOT count
    all products — ONLY those matching city+store_brand+available_today criteria.
    SQL with location filter: SELECT COUNT(DISTINCT p.sku) FROM products p JOIN product_kinds
    pk ON p.kind_id=pk.id JOIN inventory i ON p.sku=i.sku JOIN stores s ON i.store_id=s.id
    WHERE pk.name=''[TYPE FROM TASK]'' AND LOWER(s.city)=''[CITY FROM DOC]'' AND LOWER(s.name)
    LIKE ''%[BRAND FROM DOC]%'' AND s.is_open=1 AND i.available_today>0. (4) Include
    the file path in grounding_refs. CRITICAL FORMAT: The answer MUST be EXACTLY ''<COUNT:N>''
    where N is the integer — NOTHING else. No spaces. No product name after. No extra
    text before or after. Example correct: ''<COUNT:154>''. Example WRONG: ''<COUNT:154>
    Work Top''. Do NOT return ''<COUNT:264>'' when policy says count with location
    filter. Do NOT output OUTCOME_NONE_CLARIFICATION.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r018
  reasoning: 't12: scored 0.00. SQL got 264 (all products of type) but correct answer
    is 68 (only products in specific city+brand stores with available_today > 0).
    Agent read the policy doc but didn''t apply the location/inventory filter in SQL.'
  source: manual
  status: active
