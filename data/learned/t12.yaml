- agents_md_anchor: null
  content: When a policy document defines a product family identifier, always extract
    the identifier from the document's text content using a regex or string parsing,
    and use the extracted value in subsequent SQL queries and decision checks. Never
    use the entire ReadResponse object in string operations; always access its 'content'
    field to get the text.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The error 'Protocol message ReadResponse has no "fam_workwear_work_jackets_0001_3f3vgi5c"
    field.' occurred because the PlanIR's decision branch used a contains_any check
    on the bound variable $doc_content, which was the entire ReadResponse message,
    not its text content. The interpreter attempted to access a protobuf field named
    after the family ID, which does not exist. Additionally, the SQL query hardcoded
    the family ID, violating the principle of extracting it from the document. The
    new rule ensures the PlanIR binds the 'content' field of ReadResponse and extracts
    the identifier dynamically, preventing both the field-access error and hardcoding.
  status: inactive
  surface: ir
