entries:
- content: 'When asked how many catalogue products are Cordless Drill Driver: run
    tree:/docs/ first, identify the file in /docs/catalogue-addenda/ whose filename
    contains ''cordless'' or ''drill'' or ''driver''. READ THE FILE CONTENT — do NOT
    attempt to parse counts from the filename. The count embedded in the filename
    (e.g. ''0013'') is NOT the product count; the actual count is stated in the document
    body. Include that addenda doc path in grounding_refs. The answer format is "<COUNT:%d>".'
  created: '2026-05-23'
  deactivated_reason: r001 is superseded by this general rule which covers all catalogue
    addenda count tasks, not only Cordless Drill Driver, and explicitly prohibits
    the search action that caused this failure while preserving the correct tree-based
    file discovery and file-reading requirements.
  id: r001
  reasoning: Agent incorrectly read "0013" from filename as count=13 but correct answer
    is 300. Count must come from file content not filename.
  source: manual
  status: inactive
- content: Never use search:<keyword> /docs/catalogue-addenda/ when the spec_goal
    involves determining an authoritative catalogue product count by reading a relevant
    addendum document; always run tree:/docs/ first to identify the file in /docs/catalogue-addenda/
    whose filename contains the product keywords. READ THE FILE CONTENT — do NOT attempt
    to parse counts from the filename. The count embedded in the filename is NOT the
    product count; the actual count is stated in the document body. Include that addenda
    doc path in grounding_refs. The answer format is '<COUNT:%d>'.
  created: '2026-05-23'
  deactivated_reason: r002 only prohibited search:<keyword> /docs/catalogue-addenda/
    but the agent used list:/docs/catalogue-addenda/ which also failed; the new rule
    generalizes the prohibition to both list and search, making r002 obsolete.
  id: r002
  reasoning: 'Verbatim error: Execute exception [''Search the catalogue-addenda directory
    for filenames refere]: search failed: not found. Root cause category: wrong-action.
    Failing fragment citation: action string ''search:Hammer /docs/catalogue-addenda/''
    and spec_goal ''Determine the authoritative catalogue product count for ''Hammer
    Measuring and Cutting Tool'' by reading the relevant addendum document and cross-referencing
    the products table''. Rule linkage: the new rule prohibits the failing search
    action and mandates running tree:/docs/ first for any catalogue addenda count
    task, which is the correct way to locate the relevant addendum file by filename
    keywords before reading its body.'
  source: learn
  status: inactive
- content: Never use list:/docs/catalogue-addenda/ or search:<keyword> /docs/catalogue-addenda/
    when the spec_goal involves determining an authoritative catalogue product count
    by reading a relevant addendum document; always run tree:/docs/ first to identify
    the file in /docs/catalogue-addenda/ whose filename contains the product keywords.
    READ THE FILE CONTENT — do NOT attempt to parse counts from the filename. The
    count embedded in the filename is NOT the product count; the actual count is stated
    in the document body. Include that addenda doc path in grounding_refs. The answer
    format is '<COUNT:%d>'.
  created: '2026-05-23'
  deactivated_reason: r003 is superseded because it only prohibited list and search
    under /docs/catalogue-addenda/ but did not explicitly forbid find under /docs/,
    which allowed the empty-result failure.
  id: r003
  reasoning: 'Verbatim error: ''Execute exception [''List the catalogue addenda directory
    to locate the file who]: list failed: not found''. Root cause: wrong-action —
    the agent issued list:/docs/catalogue-addenda/ directly instead of first exploring
    /docs/ with tree:/docs/ to confirm the directory structure and locate the correct
    addendum file. Failing fragment: action string ''list:/docs/catalogue-addenda/''
    in PLAN_OUTPUT and SDD_OUTPUT actions. The new rule prohibits this exact direct-list
    action and mandates tree:/docs/ first, which is the only reliable way to identify
