entries:
- content: Always run `tree -L 2` on `/docs` to verify the exact filename of a policy
    document before including an action to read `/docs/payments.md` or any other policy
    file in the plan.
  created: '2026-05-23'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''Execute exception [''Start with the task-specific
    payment policy to establish 3D]: read failed: not found''. Root cause category:
    wrong-action. The first plan action `/docs/payments.md` (SDD_OUTPUT actions array
    and PLAN_OUTPUT action field) failed because the file does not exist at that path.
    The agent ignored the BASE instruction to run `tree -L 2` on `/docs` when starting
    work, which would have revealed the correct policy filename and prevented the
    not-found failure. Rule linkage: the new rule requires `tree -L 2` on `/docs`
    before attempting to read `/docs/payments.md`.'
  source: learn
  status: active
- content: Never attempt to read a payment record directly from `/proc/payments/pay_037.md`;
    always use `/bin/payments` (consulting `--help` first) to query payment workflow
    state and determine 3DS recovery eligibility.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r002'
  id: r002
  reasoning: 'Verbatim error: ''Execute exception [''Read the payment record to verify
    ownership by cust_033 and]: read failed: not found''. Root cause category: wrong-action.
    The plan included the direct file-read action `/proc/payments/pay_037.md` and
    the step ''Read the payment record at /proc/payments/pay_037.md'', but payment
    workflow state is managed by the dedicated `/bin/payments` tool, so the markdown
    file path does not exist. The new rule directly prohibits that exact file-read
    action and mandates the correct tool invocation.'
  source: learn
  status: inactive
- content: Never execute the bare action `/bin/payments pay_037`; always run `/bin/payments
    --help` first and then invoke the confirmed valid subcommand (e.g., `recover-3ds`)
    with the payment ID.
  created: '2026-05-23'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''ANSWER clarification: The 3DS recovery was not started
    because an invalid payments subcommand was used (`pay_037` is not valid).'' Root
    cause category: wrong-action. Failing fragment: the SDD_OUTPUT and PLAN_OUTPUT
    action `/bin/payments pay_037` passed the payment ID as a bare subcommand instead
    of using a valid subcommand such as `recover-3ds`. Rule linkage: the new rule
    prohibits the bare `/bin/payments pay_037` action and requires confirming and
    using a valid subcommand from `/bin/payments --help`.'
  source: learn
  status: active
- content: Never attempt to read a payment record directly from `/proc/payments/pay_037.md`,
    and never execute the bare action `/bin/payments pay_037`; always run `/bin/payments
    --help` first and then invoke the confirmed valid subcommand (e.g., `recover-3ds`)
    with the payment ID to query payment workflow state and determine 3DS recovery
    eligibility.
  created: '2026-05-23'
  deactivated_reason: null
  id: r004
  reasoning: r002 and r003 share the same spec_goal of handling payment pay_037 /
    3DS recovery workflow. They overlap and prescribe different but complementary
    actions. r003 (highest id) serves as the base; extended to incorporate r002's
    prohibition against reading `/proc/payments/pay_037.md` directly, ensuring both
    improper direct file access and bare command execution are covered in a single
    rule.
  source: learn
  status: active
- content: When /bin/payments recover-3ds pay_037 returns "payment is not waiting
    for 3DS action" or "not eligible for recovery", the correct outcome is OUTCOME_NONE_UNSUPPORTED
    — NOT OUTCOME_OK. The operation cannot proceed because the payment is not in the
    required 3DS-challenge state.
  created: '2026-05-23'
  deactivated_reason: null
  id: r005
  reasoning: Agent gave OUTCOME_OK after receiving "not waiting for 3DS action" from
    the tool. Expected is OUTCOME_NONE_UNSUPPORTED.
  source: manual
  status: active
- content: 'CRITICAL for 3DS recovery (ANY outcome — OK or UNSUPPORTED): after finding
    the payment ID (pay_XXX), ALWAYS do a direct file-read of /proc/payments/PAY_ID.json
    BEFORE running /bin/payments recover-3ds. This adds it to FILES_READ_IN_PRIOR_CYCLES
    so ANSWER can include it in grounding_refs. For BOTH OUTCOME_OK and OUTCOME_NONE_UNSUPPORTED,
    grounding_refs MUST include /proc/payments/PAY_ID.json. Without it the harness
    fails even on OUTCOME_NONE_UNSUPPORTED.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r006
  reasoning: 'OUTCOME_NONE_UNSUPPORTED but harness failed: missing /proc/payments/pay_015.json
    in grounding_refs. Fix: read the payment file directly before running the recovery
    tool, regardless of expected outcome.'
  source: manual
  status: active
