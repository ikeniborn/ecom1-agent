- agents_md_anchor: null
  content: When discovery output shows the planned operation is not supported by the
    available tool (the tool's --help/usage does not list the planned subcommand,
    or no tool can perform the requested action), set the vm.answer outcome to OUTCOME_NONE_UNSUPPORTED
    and emit no mutation — do not fabricate CLI flags (e.g. --dry-run) and do not
    default to OUTCOME_OK or a clarification outcome.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_NONE_UNSUPPORTED,
    got OUTCOME_NONE_CLARIFICATION''. Root cause: script always emits recover-3ds
    and unconditionally calls vm.answer(outcome=''OUTCOME_OK''); the ineligible/unsupported
    branch never maps to OUTCOME_NONE_UNSUPPORTED. Failing fragment: ''recover_args
    = ["recover-3ds", ..., "--dry-run"]'' (fabricated flag not in plan) followed by
    ''vm.answer(message=message, outcome="OUTCOME_OK", refs=refs)''. The recover-3ds
    subcommand is not a supported operation of /bin/payments, so the correct terminal
    outcome is OUTCOME_NONE_UNSUPPORTED, not OK and not CLARIFICATION. Rule linkage:
    distinct from r001 (RPC multiset fidelity) and r002 (try/except per RPC); this
    governs outcome-code selection when an operation is unsupported.'
  status: active
- agents_md_anchor: null
  content: When parsing /bin/sql (or any tabular CLI) stdout into rows, detect the
    actual delimiter from the output and key cells by the header line — do not hard-code
    a pipe split; /bin/sql emits comma-separated CSV with a header row, so a `split('|')`
    (plus an `'|' not in line` skip) drops every data row, leaving header-derived
    template refs like record_path empty and failing the answer_refs check.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$payment_state.record_path'', ''$payments_policy_doc'', ''$security_policy_doc''])
    but actual refs [] contain only static template entries []". OBSERVED_RPC_OUTPUTS
    shows the SQL DID return a row — header `payment_id,record_path,basket_id,...`
    then `pay_035,/proc/payments/pay_035.json,basket_235,...` — comma-separated CSV.
    Root cause: the `parse_rows` helper filters lines with `if not line or "|" not
    in line: continue` then `line.split("|")`. The tool output contains no pipes,
    so every line is skipped, `prows` is empty, `prow` stays {}, `prow.get(''record_path'')`
    is falsy, and `refs` is built empty. The two /docs Find calls also returned <empty>,
    so policy refs are absent too, but the record_path drop is purely the wrong delimiter.
    Failing fragment: `if not line or "|" not in line: continue` + `line.split("|")`.
    Rule linkage: existing r001/r002/r003 cover RPC emission, try/except wrapping,
    and unsupported-outcome — none address output parsing; this adds delimiter/header-aware
    row parsing so runtime refs populate.'
  status: active
