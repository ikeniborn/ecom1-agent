- agents_md_anchor: null
  content: Always validate that both arguments to the 'eq' primitive are defined and
    non-null before calling 'eq', by using 'isnull' or 'coalesce' primitives to provide
    a default value or by guarding the 'eq' with a conditional branch.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'The error ''interpret: compute step ''eq'' failed: ''eq'''' occurs because
    the ''eq'' primitive received a null or undefined argument (likely ''$payment_status''
    from a missing or null column). The PlanIR attempts to compare ''$payment_status''
    to the string ''requires_3ds'' without first ensuring the value exists. The compute
    step should include a null check or default value to prevent this failure.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always construct each element of a decision branch's 'when' predicate's
    'args' as a valid PredExpr object (with 'ref', 'literal', 'op', etc. keys), never
    as a bare string or a raw list.
  created: '2026-06-24'
  deactivated_reason: null
  id: r002
  reasoning: PlanIR validation failed because decision branch conditions used bare
    strings (e.g., '$payment') and raw lists instead of proper PredExpr objects. The
    PlanIR generator must emit structured PredExpr for all condition arguments to
    satisfy the PlanIR schema.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always place the decision branch that leads to a DENIED_SECURITY outcome
    as the first branch in the decision tree, before any branch that leads to a non-DENIED
    outcome.
  created: '2026-06-24'
  deactivated_reason: null
  id: r003
  reasoning: 'Error: ''interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree''. The PlanIR decision tree has
    branches in order: not_found (non-DENIED), denied_security (DENIED_SECURITY),
    eligible (non-DENIED), default unsupported (non-DENIED). This violates the security-first
    principle that requires any branch that could result in a security denial to be
    evaluated before any non-DENIED branch. Root cause: decision branch ordering did
    not prioritize the security check. Failing PlanIR fragment: the ''decision'' object
    with branches array. Rule linkage: the security constraint (anchor /docs/security.md)
    with deny_when condition implies that the security check must be first to avoid
    bypassing safety.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Do not include a Read RPC for a path that is not listed in the plan's required
    refs or that duplicates data already obtained via a SQL query, as it may fail
    if the path does not exist.
  created: '2026-06-25'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: ''real_vm: read failed: not found'' during execution. The PlanIR
    includes a Read RPC at ''/proc/payments/pay_041'' which does not exist. The required
    refs only need a record_path from the SQL query; the file read is redundant and
    causes failure. The SQL query already retrieves all needed fields including record_path.
    The rule prevents unnecessary file reads that are not required by the plan''s
    refs.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use the 'concat' primitive to build a JSON string from fragments;
    instead, use the 'json_build' primitive with key-value pairs to construct JSON
    objects for Write RPC content.
  created: '2026-06-25'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: ''concat'' step failed because it received 33 arguments but expects
    exactly 2 (both list[dict] rows). Root cause: PlanIR used ''concat'' to manually
    concatenate string fragments and variable values into a JSON string, which is
    a misuse of the primitive. The correct approach is to use ''json_build'' which
    accepts key-value pairs and produces a JSON object. The failing PlanIR fragment
    is the compute step with prim ''concat'' that builds ''new_payment_content''.
    No existing rule covers this misuse.'
  status: active
  surface: ir
