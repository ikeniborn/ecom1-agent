    which is not a valid predicate op and caused a PlanIR validation error.
  id: r005
  reasoning: The grader expected OUTCOME_NONE_UNSUPPORTED but the interpreter returned
    OUTCOME_NONE_CLARIFICATION. The PlanIR's decision tree had a default_label 'unsupported'
    and an answer entry for 'unsupported' mapping to OUTCOME_NONE_UNSUPPORTED, yet
    the interpreter did not use it. This indicates the interpreter's default_label
    handling is unreliable; it likely requires an explicit branch to avoid falling
    into a clarification state. The failing fragment is the decision tree's reliance
    on default_label instead of a final catch-all branch.
  status: inactive
