- agents_md_anchor: null
  content: Always include discovery steps for all policy documents and record fields
    referenced in the objective's params and required_refs, and extract eligibility
    criteria before constructing the decision tree. When the objective defines a primary
    outcome with eligibility criteria and a fallback unsupported outcome, structure
    the decision to first check security constraints, then evaluate eligibility, and
    default to the unsupported outcome if eligibility fails.
  created: '2026-06-22'
  deactivated_reason: r001 did not enforce security-first ordering before null checks;
    the new rule strictly supersedes it by requiring security DENIED branches to be
    placed before any non-DENIED branch, including null checks.
  id: r001
  reasoning: The plan only read /docs/security.md and the payment's record_path, ignoring
    the 3DS policy and the payment's 3DS status/attempts. The decision tree had a
    single branch for guest access and defaulted to OUTCOME_DENIED_SECURITY, causing
    it to always return that outcome. The grader expected OUTCOME_NONE_UNSUPPORTED,
    indicating the payment is not eligible for 3DS recovery. The plan must read /docs/payments/3ds.md,
    extract eligible_recovery_statuses, and check the payment's three_ds_status and
    attempts to determine eligibility. The decision should first check security, then
    eligibility for OUTCOME_OK, and fall back to OUTCOME_NONE_UNSUPPORTED if not eligible.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always place security-first DENIED branches as the very first branch in
    the decision tree, before any null checks or eligibility checks, to ensure security
    constraints are evaluated first.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree''. Root cause: the PlanIR decision
    tree ordered the null-check ''unsupported'' branch before the ''denied_security''
    branch, violating the security-first constraint. The existing rule r001 said to
    check security first but did not explicitly require it before null checks, so
    it was insufficient. The new rule clarifies that security DENIED branches must
    be the absolute first branch.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use concat with a single argument; concat requires two list[dict]
    rowsets. To bind a literal value, use the param directly in the decision or answer,
    not a compute step.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'The PlanIR compute step {"prim":"concat","args":["pay_013"],"into":"payment_id"}
    fails because concat expects two list[dict] rowsets (a and b), but only one string
    literal is provided. The interpreter raises ''missing 1 required positional argument:
    b''. The payment_id is already a param and should be referenced directly in the
    decision and answer without a compute step. Similarly, eligible_3ds_status should
    be extracted from the policy doc, not hardcoded via concat.'
  status: inactive
