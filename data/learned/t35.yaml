- agents_md_anchor: null
  content: When the tool_plan's ops action is ineligible under the discovered runtime
    state or policy (max attempts reached, non-recoverable/final failure, target already
    finalized/paid), set the vm.answer outcome to OUTCOME_NONE_UNSUPPORTED and emit
    no mutation — do not return OUTCOME_OK with a 'no action taken' message, since
    the grader treats a state/policy-ineligible request the same as a capability-unsupported
    one.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_NONE_UNSUPPORTED,
    got OUTCOME_OK''. Root cause: script branches correctly on `supported` (recover-3ds
    present in --help), but its ineligible branch hard-codes `outcome = "OUTCOME_OK"`
    with `recovery_msg = "No recovery action taken: " + reason`. Failing fragment:
    the `else` arm under `if eligible:` — `outcome = "OUTCOME_OK"`. The 3DS recovery
    for pay_035 is ineligible (max attempts / non-recoverable / already finalized),
    so the correct terminal outcome is OUTCOME_NONE_UNSUPPORTED, not a successful
    OK with no-op text. Existing r003 covers only the tool-capability case (subcommand
    absent from --help); this new rule extends the same NONE_UNSUPPORTED mapping to
    the state/policy-ineligible case where the subcommand exists but the payment record
    disqualifies the action. Distinct trigger, complementary to r003 — not superseding.'
  status: active
