- agents_md_anchor: null
  content: Always parse /bin/id output using text operations (e.g., split, regex)
    to extract 'kind' and 'customer_id', because /bin/id returns plain text lines,
    not JSON.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'The script used format ''json'' to parse /bin/id output, which is plain
    text ''user: cust_092\nroles: customer''. This caused identity_parsed to be empty,
    leading to null identity.kind and identity.customer_id. The security branch condition
    evaluated to false (since null != ''guest'' and null != ''customer''), so the
    script took the eligibility branch and produced OUTCOME_NONE_UNSUPPORTED. The
    verifier detected that the security constraint''s deny_when held (likely because
    it treated null identity as ''guest''), expecting OUTCOME_DENIED_SECURITY. Root
    cause: incorrect rowsets format for /bin/id.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always implement the full deny_when logic from security constraints in
    the decision tree. When a constraint checks identity kind and customer_id mismatch,
    parse /bin/id output to extract both 'kind' and 'customer_id', fetch the payment
    record's customer_id, and include a branch that routes to OUTCOME_DENIED_SECURITY
    if the identity is a customer with a non-matching customer_id.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: verify: I3: security constraint ''/docs/security.md#payment-actions''
    deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY.
    Root cause: The PlanIR decision tree only checked for a guest identity via regex
    on /bin/id output, and defaulted to unsupported. It did not extract customer_id,
    did not fetch the payment''s customer_id, and omitted the branch for customer_id
    mismatch required by the security constraint''s deny_when. The existing in-session
    rule about parsing /bin/id was not applied to implement the full logic. This rule
    ensures future PlanIRs include all denial conditions.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never set default_label to null or None. If you need a default outcome,
    use an explicit catch-all branch with condition {'op':'true'} and label it with
    the desired outcome string, as per r005. This ensures the decision node always
    has a valid string label and avoids validation errors.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'PlanIR validation error: ''decision.default_label Input should be a
    valid string [type=string_type, input_value=None, input_type=NoneType]''. The
    generated PlanIR had a decision node with default_label set to None, which violates
    the schema. The existing rule r005 advises using an explicit catch-all branch
    instead of relying on default_label, but the script still produced a null default_label.
    This new rule explicitly forbids null default_label and reinforces the use of
    an explicit branch.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always implement a catch-all branch in a decision node using a condition
    that always evaluates to true, such as {'op':'eq','lhs':1,'rhs':1}, instead of
    {'op':'true'} which is not a valid predicate op.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'PlanIR validation failed with ''unknown predicate op ''true'''' on branch
    6. Root cause: existing rule r005 recommended using {''op'':''true''} for catch-all
    branches, but the PlanIR schema does not accept that op. The correct approach
    is to use a condition that always evaluates to true, e.g., {''op'':''eq'',''lhs'':1,''rhs'':1}.
    This rule replaces r005.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a security constraint references identity facts (e.g., $_facts.identity.kind,
    $_facts.identity.customer_id), include a discovery step to run /bin/id and parse
    the output to extract kind and customer_id, and bind them to variables used in
    the decision tree.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Error: verify: I3: security constraint ''/docs/security.md#payment-actions''
    deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY.
    Root cause: The PlanIR lacked a discovery step to run /bin/id and extract identity
    facts. The decision tree used $identity.kind and $identity.customer_id, but these
    variables were never bound, causing the security branches to evaluate to false.
    The eligibility branch then matched (three_ds_status was null, so ''not in_set''
    was true), leading to the wrong outcome. The interpreter correctly evaluated the
    security constraint using actual identity facts, but the decision tree could not
    route to DENIED_SECURITY because the identity variables were missing. The rule
    ensures that any security constraint depending on identity facts triggers a discovery
    step to populate those variables.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include a discovery step to run /bin/id and parse its output to
    populate $_facts.identity.kind and $_facts.identity.customer_id before evaluating
    any security constraint that references identity facts.
  created: '2026-06-22'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: real_vm: bad argument type for built-in operation. Root cause:
    PlanIR decision branch references $_facts.identity.kind but no discovery step
    runs /bin/id to bind it, causing a type error when the VM evaluates the eq predicate.
    Failing fragment: decision branch with when: {op: eq, lhs: $_facts.identity.kind,
    rhs: guest}. Existing in-session rule advised parsing /bin/id but was not applied;
    this rule makes it mandatory and explicit.'
  status: active
  surface: ir
