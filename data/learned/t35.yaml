- agents_md_anchor: null
  content: When identity discovery is required, always include a fallback decision
    branch that checks for missing or null identity fields (e.g., kind is null) and
    routes to the appropriate denial outcome (e.g., unsupported) to prevent the interpreter
    from falling back to a clarification outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: The grader expected OUTCOME_NONE_UNSUPPORTED but the interpreter produced
    OUTCOME_NONE_CLARIFICATION. The PlanIR's decision tree assumes identity_data will
    always contain 'kind' and 'customer_id', but if /bin/id output is missing or malformed,
    the compute steps fail and the interpreter falls back to clarification. The decision
    tree lacks a branch to handle missing identity facts, so the interpreter cannot
    reach the 'unsupported' label. The corrective rule ensures the PlanIR explicitly
    checks for null/missing identity fields and routes to a defined outcome, avoiding
    the fallback.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always use the ''get'' primitive with exactly two arguments: the object
    and the key. To extract a field from a rowset, first retrieve the row by index
    using ''get(rowset, index)'', then retrieve the field using ''get(row, field_name)''.
    Do not pass a dotted path as a single argument.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'The interpreter failed on compute step ''get'' with error: ''<lambda>()
    missing 1 required positional argument: ''key'' CONTRACT: get(obj, key)''. The
    PlanIR provided a single argument ''$id_rows.0.kind'', but ''get'' requires two
    separate arguments: the object and the key. The root cause is an incorrect assumption
    that ''get'' can accept a dotted path. The fix is to chain two ''get'' calls:
    one to retrieve the row by index, and another to retrieve the field. This rule
    ensures future PlanIRs use the correct two-argument form.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When constructing a decision tree with branches that lead to DENIED_SECURITY,
    always place those branches before any branches that lead to non-DENIED outcomes
    (unsupported or ok).
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: 'Error: interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree. The PlanIR has a branch for
    denied_security (when identity_kind is guest and security doc does not allow guest)
    as the second branch, after a branch for unsupported (when identity_kind is null).
    The security-first policy requires that all DENIED_SECURITY branches precede any
    non-DENIED branches. Fix: reorder branches so that the denied_security branch
    is first.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the 'concat' primitive with fewer than two arguments; concat
    is designed to concatenate two row lists (list[dict]) into one. To assign a literal
    string value, use a dedicated literal assignment primitive (e.g., 'set' or 'literal')
    or provide a second argument that is an empty list or a dummy rowset. Always ensure
    each concat call has exactly two arguments, each referencing a rowset or a variable
    holding a rowset.
  created: '2026-06-24'
  deactivated_reason: null
  id: r015
  reasoning: 'Error: ''interpret: compute step concat failed: <lambda>() missing 1
    required positional argument: b''. Root cause: PlanIR compute step uses concat
    with a single argument ["pay_021"] to assign a literal string to payment_id. The
    concat primitive expects exactly two arguments (both list[dict] rows). This violates
    the contract and causes a runtime argument count error. The failing fragment:
    {"prim":"concat","args":["pay_021"],"into":"payment_id"}. No existing rule covers
    concat argument count; new rule needed to prevent this pattern.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always order decision branches so that any branch leading to DENIED_SECURITY
    appears before any branch leading to non-DENIED outcomes (unsupported or ok).
  created: '2026-06-24'
  deactivated_reason: null
  id: r016
  reasoning: 'Error: interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree. Root cause: The decision tree
    in PlanIR has branches ordered as: 1) isnull($id_raw) -> unsupported (non-DENIED),
    2) contains_any($id_raw,[''guest'']) -> denied_security (DENIED), 3) complex condition
    -> ok (non-DENIED). This violates the security-first ordering rule that all DENIED_SECURITY
    branches must precede any non-DENIED branches. The existing session rule [in-session]
    states this but was not applied. The corrective rule reinforces the ordering constraint.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always place the DENIED_SECURITY branch as the first branch in the decision
    tree, before any branches leading to unsupported or ok outcomes.
  created: '2026-06-24'
  deactivated_reason: null
  id: r017
  reasoning: 'Error: interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree. Root cause: The decision tree
    in the PlanIR has branches ordered as: 1) unsupported (non-DENIED), 2) denied_security,
    3) ok. This violates the security-first policy that requires DENIED_SECURITY branches
    to appear before any non-DENIED branches. The existing rule [in-session] about
    ordering was not followed. The corrective rule reinforces that DENIED_SECURITY
    must be the first branch.'
  status: active
  surface: ir
