- agents_md_anchor: '#security'
  content: When a security constraint's deny_when condition references a fact path,
    the PlanIR must include a discovery step that reads that fact path and binds it
    to a local variable, and the decision branch must use that local variable to mirror
    the condition.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The error ''verify: I3: security constraint deny_when holds but outcome
    is OUTCOME_NONE_UNSUPPORTED'' occurred because the PlanIR''s decision branch condition
    used $identity.kind, but the discovery step /bin/id produced a string, not a record
    with a ''kind'' field, so the condition failed to match and the default ''unsupported''
    branch was taken. The security constraint''s condition uses $_facts.identity.kind,
    which correctly evaluated to guest. The PlanIR must read that system fact and
    use it in the decision branch.'
  status: inactive
  surface: ir
