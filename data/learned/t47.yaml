- agents_md_anchor: null
  content: Always access the 'stdout' field of an ExecResponse in decision conditions
    when you need the output text; do not use the raw response object.
  created: '2026-06-25'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "guest" field.''
    Root cause: The plan''s decision branch condition uses ''$identity_raw'' (the
    raw ExecResponse) as the lhs of contains_any, attempting to access a non-existent
    field ''guest''. ExecResponse only has fields like ''stdout'', ''stderr'', ''exit_code''.
    The failing PlanIR fragment is the decision branch: {"when":{"op":"contains_any","lhs":"$identity_raw","rhs":["guest"],"args":[]}}.
    No existing rule covers proper field access on ExecResponse; r001 only addresses
    discovery steps and required refs. New rule needed to guide correct field access.'
  status: active
