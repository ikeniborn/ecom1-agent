entries:
- agents_md_anchor: '#important-tools > id'
  content: When a param value is a placeholder token bound to a discovery RPC (e.g.
    a $agent_store_id resolved from /bin/id), parse that discovery output and substitute
    the real value into all dependent queries before building SQL — never emit the
    literal placeholder token into a WHERE/JOIN predicate.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ([$matched_paths]) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows ... check :name bindings on /bin/sql''. Root
    cause: discovery exec /bin/id returned user emp_036, but the script discarded
    it (`_ = getout(identity)`) and passed store_id literally as ''$agent_store_id''
    into every `si.store_id = ''$agent_store_id''` join. No store_inventory row ever
    matches that token, so in_stock=COALESCE(...,0)=0 for all rows, match=false for
    all, and refs (gated on matched && record_path) stays empty even though rows 2
    and 4 returned real SKUs/paths (AUT-1LA1M77A, MAC-25W652FW). Failing fragment:
    `store_lit = "''" + esc(store_id) + "''"` where store_id is the unresolved placeholder.
    Rule linkage: the caller''s home store_id must be derived from the id-tool identity
    output and substituted before query construction, per #important-tools > id.'
  status: active
- agents_md_anchor: '#important-tools > sql'
  content: When parsing /bin/sql output, split each row on the actual delimiter the
    tool emits (comma-separated CSV with a header line) and skip the header row before
    matching by row_id — never assume a pipe ('|') delimiter, because a wrong split
    collapses every field into one token so product_sku and record_path are silently
    dropped and refs come back empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$matched_paths'']) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column". Observed
    /bin/sql output is comma-delimited CSV with header `row_id,product_sku,record_path,in_stock,qty`
    (e.g. row2 returned `R2,AUT-1LA1M77A,/proc/catalog/automotive/wiper_blades/AUT-1LA1M77A.json,0,4`).
    Failing fragment: `parts = [p.strip() for p in line.split("|")]` in parse_row
    — splitting on ''|'' against comma output yields a single-element list, so `len(parts)
    >= 5` is never true and parse_row always returns `[rid,'''','''','''','''']`.
    Result: every SKU/record_path discarded, matched_paths stays empty, refs empty.
    Even rows that matched real products (R2, R4) were lost. Root cause is a delimiter
    mismatch between SQL output format and the parser, distinct from the placeholder-substitution
    rule already on file. Rule linkage: codifies parsing /bin/sql output by its real
    CSV delimiter so record_path columns survive and refs populate. (Secondary contributing
    bug — store_id resolved to '''' because /bin/id output carried only `user: emp_036`/roles,
    not a store_id, so the regex matched nothing and in_stock=0 everywhere; this is
    parsing-of-output adjacent but the dominant, fully reproducible refs-empty cause
    is the ''|'' vs '','' split.)'
  status: active
- agents_md_anchor: '#important-tools > id'
  content: 'When a discovery RPC returns only a principal identifier (e.g. /bin/id
    yields `user: emp_036`, not a home store_id), resolve dependent fields like store_id
    with a secondary /bin/sql lookup keyed on that identifier — never regex-scrape
    a field the identity output does not contain, and never default an unresolved
    binding to an empty string, which silently emits a degenerate predicate (store_id='''')
    so every inventory join misses and refs come back empty.'
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$matched_paths'']) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column". Root
    cause: store_id param was placeholder $agent_store_id meant to come from the calling
    employee''s home store, but /bin/id output is `user: emp_036\nroles: employee,
    store_manager, ...` — it carries NO store_id field. Failing fragment: `m = re.search(r''(?:home_)?store_id...'',
    ident_out)` finds nothing, then `store_id = resolved or ""` falls back to empty
    string, so every generated query ran `... si.store_id = ''''`. Result: store_inventory
    join matched nothing, in_stock=0 for all rows, match=false everywhere, matched_paths=[]
    → empty refs. Existing rule r-placeholder covers parsing/substituting a value
    that IS present in discovery output; this failure is the harder case where the
    field is absent and requires a derived secondary lookup plus a no-empty-fallback
    guard — semantically distinct, so not a skip.'
  status: active
