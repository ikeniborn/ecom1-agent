- agents_md_anchor: '#important-things > availability'
  content: When success criteria require referencing all matched/available products
    but the output also carries a separate match flag that encodes a quantity-satisfied
    threshold (in_stock >= requested qty), populate refs from every row whose product
    variant exists and is available (in_stock > 0) — never gate the reference list
    on the quantity-met flag, because a product that is available yet falls short
    of the requested quantity is still a matched, available product and its record_path
    must appear in refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/storage/bins_organizers/STO-12YF3E97.json''"
    — that path is row1 (Raaco storage bin), an exact match that exists and is available.
    Root cause: refs were gated on the match flag, which folds in a quantity test.
    Failing fragment: `match = _to_int(in_stock_disp) >= qty` then `if match and path:
    matched_paths.append(path)`. Row1 product matched and had stock but in_stock <
    requested qty (4), so match=false, path dropped, refs missed the required available
    product. Success_criteria explicitly says ''All matched SKU full record paths
    referenced in refs'' and availability constraint says reference available products
    — both decouple referencing from quantity sufficiency. Distinct from r001 (placeholder
    substitution), r002 (CSV delimiter), r003 (identity->store_id lookup); none address
    conflating availability-for-refs with quantity-for-match.'
  status: active
- agents_md_anchor: null
  content: When tool_plan ops declares a single RPC but the task iterates over N input
    rows, emit exactly one RPC covering all rows (batch via IN/UNION or fetch the
    full candidate set once and filter/join in-script) — never call that RPC once
    per row inside a loop, because per-row fan-out multiplies the executed RPC count
    and fails the fidelity multiset check that mirrors the frozen tool_plan.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer, Exec, Exec, Exec] got: [Answer, Exec, Exec, Exec,
    Exec, Exec, Exec, Exec]''. Root cause: tool_plan declares 2 discovery Exec (/bin/id,
    /bin/sql store lookup) + 1 ops Exec + 1 Answer = 3 Exec expected. Failing fragment:
    the `for ent in entries:` loop calls `res = vm.exec(path=''/bin/sql'', args=[sql],
    ...)` once per parsed row; 6 non-dup rows produced 6 extra SQL calls (2 discovery
    + 6 loop = 8 Exec). The single ops RPC in tool_plan was intended to run once,
    but codegen translated it into per-row fan-out. Rule linkage: existing r001-r004
    cover placeholder substitution, delimiter parsing, identity resolution, and refs
    gating — none constrain RPC call cardinality vs. the frozen tool_plan multiset.
    New rule fills that gap: collapse per-row queries into one batched RPC.'
  status: active
- agents_md_anchor: '#important-tools > sql'
  content: When batching multiple input rows into a single SQL RPC, scope the query
    to the relevant candidate set by filtering on the union of the rows' key fields
    (e.g. brand/line IN (...) or a WHERE over the parsed keys) rather than fetching
    the entire catalogue via a per-variant GROUP_CONCAT cross-join of product_variant_properties
    and filtering in-script — an unbounded full-table aggregate scan exceeds the VM
    exec read timeout.
  created: '2026-06-06'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: ''real_vm_exec: The read operation timed out''. Discovery
    RPCs returned fine (id -> emp_026; store lookup ran), so failure is in the ops
    RPC. Root cause: the single batched query has NO brand/line predicate — it scans
    every product_variants row, LEFT JOINs product_variant_properties for ALL variants,
    and GROUP_CONCATs props per SKU with GROUP BY over the whole table. Failing fragment:
    ''FROM product_variants pv LEFT JOIN store_inventory si ... LEFT JOIN product_variant_properties
    pvp ON pvp.product_sku = pv.product_sku ... GROUP BY pv.product_sku, ...'' with
    no WHERE. This full-catalogue aggregate exceeds the exec read timeout. Linkage:
    complements the in-session ''one RPC for N rows'' rule — that rule says batch
    into one call; this rule says keep that one call bounded by the rows'' key fields
    so it stays within the timeout, instead of an unbounded scan-then-filter-in-script.'
  status: active
