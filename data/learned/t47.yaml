  content: When an outcome's required refs include record_paths, the PlanIR must include
    discovery steps that produce those record_paths and attach them to the answer
    branch.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: interpret: unresolved required ref(s) [''$answer.matched_product_record_paths'',
    ''$answer.matched_inventory_record_paths''] on OK answer. Root cause: PlanIR answer
    for ''has_store_id'' branch had empty refs, and no discovery steps were defined
    to query product_variants, product_variant_properties, or store_inventory. The
    required refs were not grounded. Rule ensures that when an outcome demands record_path
    refs, the PlanIR must include discovery steps that generate those refs and attach
    them to the answer.'
