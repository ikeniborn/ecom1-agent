- agents_md_anchor: null
  content: When a success_criteria for an outcome includes a nonempty check on a field,
    the PlanIR answer branch for that outcome must include that field with a nonempty
    value.
  created: '2026-06-22'
  deactivated_reason: null
  id: r003
  reasoning: The verify step failed because the success_criteria for OUTCOME_DENIED_SECURITY
    required '$answer.denial_reason' to be nonempty, but the PlanIR answer branches
    only contained 'message' and 'outcome', omitting 'denial_reason'. The root cause
    is a missing required field in the answer structure. This rule ensures that any
    field validated by success_criteria is explicitly populated in the corresponding
    answer branch.
  status: active
  surface: ir
