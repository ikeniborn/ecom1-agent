- agents_md_anchor: null
  content: When a success_criteria for an outcome includes a nonempty check on a field,
    the PlanIR answer branch for that outcome must include that field with a nonempty
    value.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The verify step failed because the success_criteria for OUTCOME_DENIED_SECURITY
    required '$answer.denial_reason' to be nonempty, but the PlanIR answer branches
    only contained 'message' and 'outcome', omitting 'denial_reason'. The root cause
    is a missing required field in the answer structure. This rule ensures that any
    field validated by success_criteria is explicitly populated in the corresponding
    answer branch.
  status: inactive
  surface: ir
- agents_md_anchor: '#plan'
  content: When the task objective mentions specific data sources (e.g., product descriptions,
    catalogue items), the PlanIR must include discovery steps that read those data
    sources and attach their record_paths to the answer branch, even if the outcome
    is a denial, because the grader may require them.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/catalog/Ryobi/PWR-RZ0VIO7N.json''''.
    The TOOL_PLAN''s required_refs for OUTCOME_DENIED_SECURITY only list a policy_doc,
    but the grader expects a reference to a product catalogue item. The task objective
    mentions product descriptions and catalogue items, so the PlanIR should have included
    discovery steps to read those data sources and attach their record_paths to the
    answer branch, even though the outcome is a denial. Existing rule r001 only covers
    when required_refs explicitly include record_paths, which they did not. This new
    rule ensures that all data sources implied by the objective are discovered and
    referenced.'
  status: inactive
  surface: ir
- agents_md_anchor: '# compute'
  content: When using a compute step to bind a literal string to a variable for use
    in answer refs, use the 'literal' primitive with the string as its argument, not
    'concat'. The 'concat' primitive requires two rowsets (list[dict]) as arguments
    and cannot be used with a single literal path.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'ERROR: interpret: compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. The PlanIR compute step: {"prim":"concat","args":["/docs/security.md"],"into":"policy_doc_path"}.
    Concat expects two rowsets (list[dict]), but only one literal path was provided.
    The intent was to bind a variable to a path string for the answer ref. The correct
    primitive is ''literal'' with args containing the string, not ''concat''.'
  status: inactive
  surface: ir
