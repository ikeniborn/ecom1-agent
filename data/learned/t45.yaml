- agents_md_anchor: null
  content: When the TOOL_PLAN requires refs of kind record_path sourced from a row
    object, always extract the record_path column from the rowset into a dedicated
    compute variable and use that variable as the answer ref, never the row object
    itself.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$product_0.record_path'', ...] on OK answer. Root cause: PlanIR answer refs
    listed ''$store'' and ''$product_0'' (the row objects), but the required refs
    expect the actual record_path values. The compute section used ''first'' and ''get''
    to bind row objects, but did not extract the record_path field. The interpreter
    could not resolve dot-notation refs. Fix: extract record_path columns explicitly
    via ''column'' prim and bind them as separate variables, then reference those
    variables in the answer refs.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use dot-path expressions (e.g., '$store.record_path') as the source
    of an answer ref; always extract the required field into a dedicated compute variable
    using a 'get' primitive and use that variable as the source.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
