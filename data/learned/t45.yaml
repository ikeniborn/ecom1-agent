entries:
- agents_md_anchor: '#important-tools > sql'
  content: When parsing /bin/sql stdout into columns, split each row on commas (the
    tool emits CSV) rather than on '|'; a pipe split collapses every multi-column
    SELECT into one cell, so secondary columns like record_path are never extracted
    and runtime refs come back empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$store_path'']) but actual refs [] contain only static template entries []".
    Root cause: discovery SQL succeeded — OBSERVED output shows header ''store_id,store_name,record_path''
    and row ''store_brno_veveri,PowerTool Brno Veveri,/proc/stores/store_brno_veveri.json''
    — but /bin/sql emits comma-separated (CSV) rows, not pipe-delimited. Failing fragment:
    `cols = [c.strip() for c in line.split("|")]` then `if len(cols) >= 3`. Splitting
    the CSV line on ''|'' yields one cell (len 1), so the `>= 3` guard never fires,
    store_path stays None, refs=[]. Same pipe-split bug in the count parser (`line.split("|")[0]`)
    happens to still grab the single value, so count emitted but refs dropped. Rule
    links delimiter mismatch (pipe vs CSV) to the dropped-column refs failure.'
  status: active
