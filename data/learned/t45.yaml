  content: When a rowset is expected to contain exactly one row and you need to extract
    a field from it using an index (e.g., '0.field'), always set the rowset format
    to 'json' (not 'auto_delim') to ensure the result is always a list, even for a
    single row.
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/catalog/Bahco/HND-2O9KS4GG.json''''.
    Root cause: The rowset ''store_result'' was parsed with format ''auto_delim'',
    which for a single-row SQL result likely produced a single object instead of a
    list. The subsequent compute step ''get'' with path ''0.record_path'' failed to
    extract the value because the rowset was not indexable, leaving ''$store_record_path''
    empty. Consequently, the answer ref for ''record_path'' was missing or had a null
    path, causing the grader to report the required reference as missing. Failing
    PlanIR fragment: rowsets[0] format ''auto_delim'' and compute step ''get'' with
    args [''$store_result'', ''0.record_path''].'
  status: active
