- agents_md_anchor: '#important-things > references'
  content: When generating answer refs for an availability or inventory question,
    resolve and emit the full catalog record_path of each individual product the answer
    is based on (SELECT the variant/family record_path alongside the SKU), not only
    the store or container path; graders assert a reference to every relevant product
    object, so a refs list holding just the store path fails even when the count is
    correct.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/Fischer/FST-WY12PHPB.json''".
    Root cause: the script collects only the store''s record_path and passes it as
    the sole ref — failing fragment `refs = [record_path] if record_path else []`
    followed by `vm.answer(..., refs=refs)`. The plan''s answer_template likewise
    lists only `$store.record_path`, but the agents_md constraint (#important-things
    > references) requires full repo paths to the referenced objects, and the availability
    constraint means the relevant product catalog files (e.g. the resolved Fischer
    SKU) must be cited. No existing rule covers product-level refs: r001 only parses
    record_path from CSV, r004 only guards the store record_path being empty. New
    rule fills the gap by mandating per-product record_path emission in refs for availability/inventory
    answers.'
  status: active
- agents_md_anchor: '#important-things > availability'
  content: When the answer is an aggregate (COUNT/SUM) yet the grader requires per-product
    refs, run a second row-returning query that SELECTs each matching product's catalog
    record_path (or keep a non-collapsed result set) instead of reducing the whole
    plan to COUNT(*) only; a pure aggregate query discards the individual rows whose
    record_paths the answer template must cite, so refs come back empty even when
    the count is correct.
  created: '2026-06-06'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ... but actual refs [] contain only static template entries [] — SQL likely
    returned no rows or row parsing dropped the path column''. Root cause: ops_sql
    ends in ''SELECT COUNT(*) AS unavailable_count FROM matched ...'' — a pure aggregate
    that returns a single scalar and discards every per-product row, so no record_path
    is ever available to build refs; the script then hardcodes vm.answer(refs=[]).
    Failing fragment: ''SELECT COUNT(*) AS unavailable_count'' + ''vm.answer(message=message,
    outcome="OUTCOME_OK", refs=[])''. Linkage: r005 mandates emitting each product''s
    record_path but assumes a row-returning query exists; this rule adds the prerequisite
    technique — do not collapse to COUNT(*) alone when refs per product are required,
    retain a row query that yields the paths. Distinct from r005 (which covers WHICH
    path to emit) and r001 (CSV parsing).'
  status: active
- agents_md_anchor: '#important-things > availability'
  content: When an agents_md constraint restricts availability-answer refs to reference
    available products but not unavailable ones, build the refs list from a separate
    row-returning query that SELECTs the record_path of the AVAILABLE products (COALESCE(available_today_quantity,
    0) > 0) instead of reusing the unavailable-count predicate; the COUNT aggregates
    the unavailable SKUs while the cited refs must be their available complement,
    so an empty unavailable result set must never collapse refs to [].
  created: '2026-06-06'
  deactivated_reason: null
  id: r007
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ... but actual refs [] contain only static template entries ... SQL likely
    returned no rows''. OBSERVED ops query returned only the ''record_path'' header
    with zero data rows. Root cause: the script derives refs from the SAME predicate
    used for the count — WHERE COALESCE(si.available_today_quantity, 0) = 0 (the UNAVAILABLE
    set). When zero variants are unavailable, that query returns no rows, so refs=[]
    and the answer_refs check fails. But the agents_md constraint at ''#important-things
    > availability'' explicitly states the answer ''should reference products that
    are available, but should not reference unavailable products.'' Failing fragment:
    `SELECT m.record_path FROM matched m LEFT JOIN store_inventory si ... WHERE COALESCE(si.available_today_quantity,
    0) = 0;` feeding the refs loop. Linkage: existing r005/in-session require emitting
    per-product record_path but are silent on ref polarity; the new rule adds that
    the ref query''s filter polarity must follow the agents_md availability constraint
    (select the available complement), which neither prior rule covers — hence not
    a duplicate.'
  status: active
