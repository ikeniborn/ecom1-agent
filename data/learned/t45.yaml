    like ''$store.record_path'', which the interpret phase cannot resolve because
    it expects a compute variable name. The existing rule [in-session] already advises
    extracting record_path into a dedicated variable, but the PlanIR did not follow
    it. A new explicit prohibition of dot-path expressions in answer ref sources will
    prevent this.'
  status: inactive
  surface: ir
