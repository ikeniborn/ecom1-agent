- agents_md_anchor: null
  content: When a discovery step retrieves product_sku, always project it into a rowset
    column and include it in the answer refs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: grader: answer missing required reference ''/proc/catalog/automotive/engine_oil/AUT-2WSTNOGZ.json''.
    The PlanIR only extracted the count, not the product_sku values. The TOOL_PLAN''s
    required_refs was empty, but the grader still required the product reference.
    Root cause: the PLAN phase did not include the discovered product_sku in the answer
    refs. The failing PlanIR fragment: answer.ok.refs = [] and rowsets only captured
    ''cnt'' column, ignoring product_sku. The rule ensures future PlanIRs always capture
    and include product_sku references.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always verify that rowsets bound to required refs are non-empty before
    using them in an answer; if empty, branch to an error outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''unresolved required ref(s) ["$store.record_path", "$row.record_path"]
    on OK answer''. The PlanIR''s discovery steps query store and product data, but
    the decision block has no branches to check if those rowsets are empty. If the
    store or product queries return no rows, the refs cannot be resolved, causing
    the interpret failure. The PlanIR must include a decision branch that verifies
    the rowset is non-empty before proceeding to the OK answer that requires those
    refs.'
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-ir-compute-primitives'
  content: Never use the 'concat' primitive to build SQL strings or any string value;
    'concat' only merges two list[dict] rowsets. Build dynamic SQL directly in the
    'stdin' field of an Exec discovery step using $variable references.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: ''concat'' failed: <lambda>() takes 2 positional arguments but
    13 were given. The failing PlanIR used ''concat'' with many string fragments to
    assemble ''count_sql'' and ''paths_sql''. The ''concat'' primitive is designed
    to merge two rowsets (list[dict]), not to concatenate strings. The correct PLAN
    technique is to write the full SQL query directly in the Exec step''s ''stdin'',
    embedding $store_id as a variable reference, avoiding any compute-time string
    assembly.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include all required refs in the answer section, mapping each required
    ref's source to the corresponding rowset column that contains the record_path.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The interpret phase failed with 'unresolved required ref(s) ['$store.record_path',
    '$row.record_path'] on OK answer'. The PlanIR answer section had 'refs':[] but
    the intent's required_refs for OUTCOME_OK demanded record_path from $store and
    $row. The discovery steps and rowsets correctly extracted record_path columns,
    but the answer omitted them. The rule ensures future plans always include required
    refs.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When extracting a column value from a single row (e.g., after using 'first'),
    use the 'get' primitive instead of 'column'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The interpret error ''column expects list[dict] rows; use get for a
    single row'' occurred because the compute step applied ''column'' to the result
    of ''first'', which is a single dict. The correct primitive for extracting a field
    from a single row is ''get''. The failing PlanIR fragment: compute step ''column''
    with args [''$first_store'',''store_id''] after ''first'' on $store.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When deduplicating a rowset by a column, first use the 'column' primitive
    to extract the column values into a list, then apply 'dedupe' to that list; never
    pass a rowset and column name directly to 'dedupe'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: ''interpret: compute step ''dedupe'' failed: <lambda>() takes
    1 positional argument but 2 were given. CONTRACT: dedupe(seq)''. The PlanIR step
    `{"prim":"dedupe","args":["$matching_rows","spec_id"],"into":"unique_specs"}`
    passed two arguments to dedupe, but the primitive expects a single sequence. The
    correct pattern is to first extract the spec_id column from matching_rows using
    ''column'', then dedupe that list, then count the deduplicated list. This rule
    prevents future misuse of dedupe.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include all required refs in the answer section's 'refs' array,
    using objects with 'ref' pointing to the computed variable and 'kind' matching
    the required ref's kind (e.g., 'record_path').
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$row.record_path''] on OK answer. Root cause: The answer section in the PlanIR
    had ''refs'': [] but the required refs for OUTCOME_OK demanded record_path refs
    from $store.record_path and $row.record_path. The compute section correctly derived
    those variables, but they were not placed into the answer refs. The existing in-session
    rule ''Always include all required refs in the answer section'' was not followed;
    this new rule provides explicit format guidance.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a discovery SQL query may produce rows that need post-filtering (e.g.,
    removing nulls from an outer join), always apply the filter directly in the SQL
    query's WHERE clause or by using an INNER JOIN, rather than relying on a filter_rows
    compute step with a predicate object.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Error: interpret: compute step ''filter_rows'' failed: ''dict'' object
    has no attribute ''op''. The interpreter''s filter_rows implementation uses attribute
    access (pred.op) on the predicate argument, but the PlanIR supplied a plain dict
    {''op'':''not'',...}. This caused an AttributeError. Root cause: the PlanIR used
    a predicate dict for post-SQL filtering of null spec_index rows from a LEFT JOIN.
    The failing fragment: {"prim":"filter_rows","args":["$inventory_rows",{"op":"not","args":[{"op":"isnull","lhs":"$row.spec_index"}]}],"into":"matched_rows"}.
    The corrective rule instructs the PLAN phase to avoid filter_rows with predicate
    objects entirely and instead embed the filtering condition in the discovery SQL
    query (e.g., WHERE m.spec_index IS NOT NULL or use INNER JOIN), which is a robust
    PLAN technique that bypasses the interpreter''s predicate-handling limitation.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always pass SQL queries to the sql binary via the '-cmd' argument in the
    'args' field of the Exec RPC, not via 'stdin'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. The first discovery step used ''stdin'' to pass a static SQL query, but
    the Exec RPC failed to deliver it, causing the sql binary to print its usage banner.
    Root cause: the Exec RPC''s stdin delivery mechanism is unreliable or requires
    additional arguments to activate. The failing PlanIR fragment: {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"SELECT
    store_id, record_path FROM stores WHERE store_name LIKE ''%Jakomini%'' AND city
    = ''Graz'';"},"bind":"store_info_raw"}. This rule ensures SQL is always passed
    as a ''-cmd'' argument, which the sql binary accepts directly, avoiding stdin
    issues.'
  status: inactive
  surface: ir
