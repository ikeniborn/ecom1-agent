  content: Never omit the OUTCOME_OK answer branch when the TOOL_PLAN defines success criteria for it;
    always include the required refs for that outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r016
  reasoning: 'The error ''grader: answer missing required reference ''/proc/catalog/hand_tools/pliers_wrenches/HND-HINAM6H9.json''''
    occurred because the PlanIR only contained a decision for security and an answer for OUTCOME_DENIED_SECURITY,
    completely ignoring the main objective and its required refs for OUTCOME_OK. The script code had no
    discovery, rowsets, compute, or answer for the OK outcome, so the answer lacked the required record_path
    ref. The root cause is that the PlanIR failed to implement the task''s objective, defaulting to denied.
    The rule ensures that the PlanIR always includes the OUTCOME_OK branch and its required refs when
    the TOOL_PLAN defines success criteria for it.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include a valid decision tree in the PlanIR; the decision field must be a dictionary
    with at least a 'type' key and appropriate branches, never null or missing.
  created: '2026-06-22'
  deactivated_reason: null
  id: r017
  reasoning: 'The error ''plan: PLAN: validation failed: 1 validation error for PlanIR decision Input
    should be a valid dictionary or instance of DecisionTree [type=model_type, input_value=None, input_type=NoneType]''
    indicates the PlanIR had a null or missing decision field. The script code is empty, so the PLAN phase
    emitted a PlanIR without a proper decision tree. This rule ensures the PLAN phase always constructs
    a valid decision structure.'
  status: active
