- agents_md_anchor: null
  content: When the TOOL_PLAN requires multiple record_path refs sourced from a rowset,
    always verify that the rowset contains exactly the expected number of rows before
    extracting individual refs; if the count is less, branch to an unsupported outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/catalog/Keter/STO-3GODQ8BL.json''''.
    Root cause: The PlanIR''s SQL query may not return all 6 products if some are
    missing from the catalog, resulting in a rowset with fewer than 6 rows. The compute
    step blindly extracts product_0 through product_5 using ''get'' primitives, which
    fail or produce null for missing indices, causing the answer to lack required
    refs. The decision branch only checks for zero rows (no store) and defaults to
    ''ok'', so missing products still lead to OUTCOME_OK with incomplete refs. The
    rule ensures the PlanIR validates row count before extracting individual refs
    and branches to unsupported if the count is insufficient.'
  status: inactive
  surface: ir
