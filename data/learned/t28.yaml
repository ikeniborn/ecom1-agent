- agents_md_anchor: null
  content: Always emit every RPC declared in tool_plan (both discovery and ops) as
    an unconditional call so the executed RPC multiset matches the plan; encode pass/fail
    gating in arguments, branch text, or post-call handling — never wrap a planned
    op RPC in an `if` that can skip the call.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset)  expected: [Answer, Exec, Exec, Exec, Exec, Find, Read, Tree]  got:
    [Answer, Exec, Exec, Exec, Find, Read, Tree]''. Root cause: tool_plan has 4 Exec
    calls (id, sql-emp, sql-basket discovery + discount op) but script ran only 3.
    Failing fragment: `if all_pass: discount_result = vm.exec(path=''/bin/discount'',
    ...)` else branch sets a text string and never calls vm.exec — the ops RPC was
    gated behind data-dependent checks, so when checks failed the planned Exec was
    skipped, dropping it from the executed multiset. Fidelity counts RPCs structurally,
    independent of runtime branch outcome. Rule linkage: CODEGEN must translate every
    tool_plan op into an always-executed RPC and express the ''only apply if checks
    pass'' semantics through arguments or downstream message logic, not by omitting
    the call.'
  status: active
- agents_md_anchor: null
  content: Never default a resolved file-path variable to a directory root when its
    Find/discovery RPC returns no match; gate the dependent Read so it executes only
    with a concrete file path, since Read on a directory raises 'is a directory' and
    aborts the whole script.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: is a directory''. Observed:
    Find/Tree on /docs returned empty, so _find_path() produced no path. Failing fragment:
    `discount_policy_path = _find_path(discount_policy_find) or "/docs"` then `discount_policy
    = vm.read(path=discount_policy_path, number=True)` — the `or "/docs"` fallback
    substituted the directory root, and the unconditional Read on a directory aborted
    execution before any verification or answer ran. Root cause: directory-root fallback
    for a file-path placeholder feeding an unguarded Read. Rule linkage: distinct
    from the existing ''emit every planned RPC'' rule (that governs RPC multiset completeness);
    this governs the ARGUMENT value passed to a Read — guarding against a directory
    path reaching Read while still emitting the call, so both rules compose.'
  status: active
