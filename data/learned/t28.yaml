  content: Always include discovery steps to read all policy_doc references required
    for the desired outcome, and include those refs in every answer branch.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more comprehensive rule that requires the PlanIR
    to satisfy all constraints and success criteria, not just include policy_doc refs.
  id: r001
  reasoning: The PlanIR only read /docs/security.md and did not read /docs/discounts.md,
    which is required for the desired outcome OUTCOME_OK. The answer for denied_guest
    only included the security doc ref, causing the grader to report missing /docs/discounts.md.
    The root cause is that the PlanIR did not include discovery steps for all required
    policy docs and did not include those refs in the answer. The new rule ensures
    that all required policy_doc refs for the desired outcome are read and included
    in every answer branch.
