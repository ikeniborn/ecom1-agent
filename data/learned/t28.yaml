- agents_md_anchor: null
  content: When success_criteria gate an op behind authorization/security checks,
    derive the answer outcome from the computed pass/fail flags — set OUTCOME_DENIED_SECURITY
    (or the matching denial code) when any security gate fails, and reserve OUTCOME_OK
    for the all-pass branch; never hardcode a single outcome regardless of gate results.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_DENIED_SECURITY,
    got OUTCOME_NONE_CLARIFICATION''. Root cause: script terminates with a fixed `vm.answer(...,
    outcome="OUTCOME_OK", ...)` and computes `all_pass`/`is_manager`/`store_match`
    only for message text, never mapping a failed security gate to the outcome field.
    Failing fragment: `vm.answer(message=message, outcome="OUTCOME_OK", refs=refs)`
    paired with the gating block `all_pass = employee_valid and is_manager and store_match
    and subtotal_ok` whose result is discarded for outcome purposes. Task is an authorization
    check (manager/discount-issuer + store scope) that must DENY on failure; emitting
    OK (or falling into clarification) instead of OUTCOME_DENIED_SECURITY breaks the
    contract. Rule linkage: r001 (emit all op RPCs) and r002 (path defaulting) cover
    RPC multiset and path safety but neither maps gate results to the answer outcome
    — gap filled here.'
  status: active
- agents_md_anchor: null
  content: When parsing /bin/sql stdout into row dicts, treat the output as CSV with
    a header line and RFC-style quoted fields — use a quote-aware CSV parser (csv.reader/csv.DictReader)
    instead of line.split('|') or a naive comma split, so fields that embed the delimiter
    (e.g. group_concat lists) stay intact and path columns populate the runtime refs
    the answer_template requires.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$employee_path'', ''$store_path'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". Root cause: NOT empty SQL — OBSERVED_RPC_OUTPUTS shows /bin/sql returned
    a full row (emp_006, employee_path=/proc/employees/emp_006.json, store_path=/proc/stores/store_vienna_meidling.json,
    roles=quoted comma list). The failing fragment is `cols = line.split("|")` with
    guard `if len(cols) < 8: continue`: /bin/sql emits comma-separated CSV, not pipe-delimited,
    so every line splits into 1 column, all rows are dropped, `rows` stays empty,
    and refs=[] — tripping the answer_refs check. A naive comma split would also break
    because the roles column is CSV-quoted (`"customer_service,discount_manager,..."`)
    and itself contains commas. Linkage: existing rules (r001 RPC emission, r002 path
    defaulting, r003 outcome gating) cover none of this; the new rule addresses output-format/delimiter
    parsing of /bin/sql, mandating quote-aware CSV parsing so path columns survive
    and populate refs.'
  status: active
