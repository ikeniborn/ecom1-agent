- agents_md_anchor: null
  content: Always ensure that every answer branch in the PlanIR produces an outcome that is listed in
    the outcome_space. If the outcome_space contains only one outcome, all branches must produce that
    outcome.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: verify: I2: outcome ''OUTCOME_NONE_UNSUPPORTED'' not in outcome_space [''OUTCOME_DENIED_SECURITY''].
    The PlanIR''s decision branch had a default label ''not_guest'' that led to an answer with outcome
    OUTCOME_NONE_UNSUPPORTED, which is not in the allowed outcome_space. The plan should have been designed
    so that every answer branch produces an outcome from the outcome_space; since only OUTCOME_DENIED_SECURITY
    is allowed, the default branch must also produce that outcome. Root cause: the plan''s answer for
    the not_guest case used an unsupported outcome instead of the only allowed one.'
  status: active
  surface: ir
