- agents_md_anchor: null
  content: Always ensure that every answer branch in the PlanIR produces an outcome
    that is listed in the outcome_space. If the outcome_space contains only one outcome,
    all branches must produce that outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: verify: I2: outcome ''OUTCOME_NONE_UNSUPPORTED'' not in outcome_space
    [''OUTCOME_DENIED_SECURITY'']. The PlanIR''s decision branch had a default label
    ''not_guest'' that led to an answer with outcome OUTCOME_NONE_UNSUPPORTED, which
    is not in the allowed outcome_space. The plan should have been designed so that
    every answer branch produces an outcome from the outcome_space; since only OUTCOME_DENIED_SECURITY
    is allowed, the default branch must also produce that outcome. Root cause: the
    plan''s answer for the not_guest case used an unsupported outcome instead of the
    only allowed one.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the concat primitive with more than two arguments or with arguments
    that are not both list[dict] rowsets; concat is only for merging two rowset lists.
    For string concatenation, use a single string template with placeholders and a
    format operation, or use a join primitive if available.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() takes 2
    positional arguments but 3 were given. Root cause: The PlanIR compute step used
    concat with three string arguments, but concat expects exactly two list[dict]
    arguments. The failing fragment: ''{"prim":"concat","args":["UPDATE shopping_baskets
    SET discount_percent = 5, discount_reason_code = ''service_recovery'', discount_issuer_employee_id
    = ''","$combined.employee_id","'' WHERE basket_id = ''basket_054'';"]}''. This
    is a PlanIR shape bug. A new rule is needed to prevent misuse of concat for string
    building.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always define a rowset for each Exec RPC that returns tabular data (e.g.,
    SQL SELECT results) in the 'rowsets' section of the PlanIR, specifying the format
    (e.g., 'csv' or 'json') and columns if needed. Then use the rowset variable (e.g.,
    '$store_rows') in compute steps like 'first' instead of the raw ExecResponse variable.
  created: '2026-06-24'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: ''interpret: compute step ''first'' failed: ''ExecResponse''
    object is not subscriptable''. Root cause: The PlanIR applies the ''first'' primitive
    directly to the raw ExecResponse variable ($store) without first parsing the Exec
    output into a rowset. The failing fragment is the compute step `{"prim":"first","args":["$store"],"into":"store_row"}`.
    The plan includes a rowset for identity_raw but not for the SQL Exec RPCs. Existing
    rules r002 and r003 do not mandate this parsing step. The new rule ensures all
    tabular Exec outputs are parsed into rowsets before sequence operations, preventing
    the error.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always ensure that every answer branch's required refs are guaranteed to
    be non-null by the time that branch is taken. If a required ref depends on an
    entity that may not exist (e.g., basket, employee), add a branch to handle the
    missing entity case (e.g., OUTCOME_NONE_CLARIFICATION) and only include refs that
    are guaranteed to be non-null. Use separate discovery steps for each entity and
    check existence before combining, as per r003.
  created: '2026-06-24'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: verify: I1: required ref source(s) [''$basket.record_path'']
    did not resolve on OUTCOME_DENIED_SECURITY answer (resolve-before-cite). Root
    cause: The PlanIR''s denied_security answer branch includes a ref with source
    ''$basket_record_path'', but the variable is null because the combined SQL query
    returns nulls when the basket does not exist. The plan does not check for basket
    existence before branching, so the ref cannot be resolved. The failing PlanIR
    fragment is the answer block for ''denied_security'' which unconditionally includes
    $basket_record_path. Rule linkage: Existing rule r003 advises separate discovery
    steps and existence checks, but the plan ignored it. This new rule reinforces
    that pattern and adds the requirement that refs must be guaranteed non-null in
    each branch.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When building a decision tree in PlanIR, place all branches that lead to
    OUTCOME_DENIED_SECURITY before any branches that lead to OUTCOME_NONE_CLARIFICATION
    or OUTCOME_OK, to enforce security-first evaluation order.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: interpret: security-first violation: a DENIED_SECURITY branch
    follows a non-DENIED branch in the decision tree. Root cause: The PlanIR decision
    branches list three ''clarification'' (OUTCOME_NONE_CLARIFICATION) branches before
    three ''denied'' (OUTCOME_DENIED_SECURITY) branches. The security-first principle
    requires that all DENIED_SECURITY branches be evaluated before any non-DENIED
    branches to prevent information leakage and ensure policy enforcement. The failing
    PlanIR fragment shows the branch order: first three when conditions for missing
    entities (clarification), then three when conditions for security violations (denied).
    The fix is to reorder the branches so that all denied conditions are checked first.'
  status: active
  surface: ir
