- agents_md_anchor: null
  content: Always design the PlanIR to satisfy all constraints and success criteria for the desired outcome.
    Include discovery steps to read every policy_doc listed in required_refs for the desired outcome.
    Include rowsets to look up all entities referenced in params and constraints. Include compute steps
    to verify all conditions (e.g., role_code, store_id, subtotal). Structure decision branches so that
    the desired outcome is reached only when all conditions are met, and include all required refs in
    every answer branch.
  created: '2026-06-22'
  deactivated_reason: null
  id: r002
  reasoning: The PlanIR only handled the security constraint and omitted the discount policy doc, manager
    lookup, role/store verification, subtotal check, and discount application. The grader error 'answer
    missing required reference /docs/discounts.md' is a symptom of the PlanIR not attempting to achieve
    OUTCOME_OK. The existing rule r001 only covers including policy_doc refs, but the root cause is incomplete
    PlanIR design. This new rule supersedes r001 by requiring full constraint satisfaction.
  status: active
  surface: ir
- agents_md_anchor: null
  content: When building a PlanIR for verification tasks that depend on entity lookups, use separate discovery
    steps for each entity and check for their existence before combining. If any required entity is missing,
    produce OUTCOME_DENIED_SECURITY with the policy doc ref and any found record_paths, rather than allowing
    the plan to fail with OUTCOME_NONE_CLARIFICATION.
  created: '2026-06-22'
  deactivated_reason: null
  id: r003
  reasoning: The grader expected OUTCOME_DENIED_SECURITY but got OUTCOME_NONE_CLARIFICATION. The PlanIR
    used a single cross-join SQL query that returns zero rows if any of employee, store, or basket is
    missing, causing the compute steps to fail and the decision to produce no valid outcome. The plan
    must handle missing entities gracefully by separating lookups and explicitly checking for existence,
    falling back to a denied outcome with available refs.
  status: active
  surface: ir
- content: null
  created: '2026-06-22'
  id: v015
  score: 0.0
  score_detail:
  - answer missing required reference '/docs/discounts.md'
  source: verdict
  status: active
