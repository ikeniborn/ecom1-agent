- agents_md_anchor: null
  content: Never include a decision branch that directly leads to a security-denied
    outcome (denied_security) in the PlanIR. Instead, let the system's security constraint
    handle denial based on the identity kind. The PlanIR should only produce outcomes
    that are not security-denied, and the system will apply the security constraint
    automatically.
