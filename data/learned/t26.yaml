  content: Always parse the output of /bin/id to extract the user kind (e.g., 'employee',
    'guest') and set $_facts.identity.kind to that value using custom_extract. Use
    that fact in security decision branches.
  created: '2026-06-21'
  deactivated_reason: Exec tool not available in real VM; rule r001 encourages using
    Exec which leads to failure.
  id: r001
  reasoning: The PlanIR bound /bin/id output to 'identity' but did not parse it to
    extract a 'kind' field. The decision branch used $identity.kind (undefined), falling
    to default 'unsupported'. The security constraint's deny_when evaluated $_facts.identity.kind,
    which likely defaulted to 'guest' because no fact was set, triggering the requirement
    for OUTCOME_DENIED_SECURITY. The plan must extract identity.kind from /bin/id
    and set it as a fact to correctly evaluate the constraint.
  status: inactive
  surface: ir
