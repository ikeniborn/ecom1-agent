  content: When the desired outcome is a security denial, always include the security
    policy document reference (path '/docs/security.md') in the answer refs.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: grader: answer missing required reference ''/docs/security.md''.
    The PlanIR answer for deny_security only included /docs/discounts.md and /docs/checkout.md,
    missing the security policy doc. The TOOL_PLAN required_refs did not list it,
    but the grader expects it for security denials. Root cause: PLAN phase omitted
    the security policy reference. Failing PlanIR fragment: answer.deny_security.refs.
    Existing rules r002 and r003 do not cover this. New rule ensures security doc
    is included for security denial outcomes.'
  status: active
