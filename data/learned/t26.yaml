- agents_md_anchor: null
  content: Always base security denial decisions on the actual $_facts.identity.kind
    value from the pre-phase; never assume a default value like 'guest'.
  created: '2026-06-24'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). The plan''s decision branch
    checks if identity.kind == ''guest'' and denies, but the actual identity.kind
    is not guest, causing a spurious denial. The planner must not assume a default
    value; it should only deny when the predicate is confirmed true based on pre-phase
    facts.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never produce a security denial outcome unless the security constraint's
    deny_when predicate is satisfied by the actual pre-phase facts. Use the default
    branch for all other cases.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: verify phase reports ''outcome DENIED_SECURITY but no declared
    security deny_when predicate holds (spurious over-refusal)''. The PlanIR decision
    branch denies when $_facts.identity.kind == ''guest'', but the actual pre-phase
    fact does not equal ''guest'', so the condition is false. Yet the plan still produced
    a denial, indicating the decision logic incorrectly triggered the denied_security
    branch. The root cause is that the plan did not properly condition the denial
    on the actual fact value, leading to an over-refusal. The new rule ensures the
    plan only denies when the deny_when predicate is truly satisfied, preventing spurious
    denials.'
  status: active
