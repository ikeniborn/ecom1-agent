- agents_md_anchor: '#important-things > policy-grounding'
  content: Never hardcode or fabricate fallback document paths in answer refs; populate
    every policy/grounding reference exclusively from paths actually returned by the
    plan's Find/Read discovery results, and include all governing/policy documents
    surfaced by discovery rather than heuristically selecting or defaulting to a single
    guessed path.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/checkout.md''".
    Root cause: the script builds refs from guessed/hardcoded paths instead of the
    docs actually discovered. Failing fragment: `discount_policy_path = policy_paths[0]
    if policy_paths else "/docs/security.md"` plus the unconditional `if "/docs/security.md"
    not in refs: refs.append("/docs/security.md")`. It (a) defaults to a fabricated
    /docs/security.md never returned by Find, (b) heuristically picks one ''security''-named
    match, and (c) never surfaces the actual governing checkout policy doc, so the
    required /docs/checkout.md is absent. Linkage: existing r001/r002 cover iterable
    guarding and RPC-multiset fidelity, not reference fabrication; this CODEGEN technique
    rule forbids inventing/hardcoding ref paths and mandates deriving all grounding
    refs from real discovery output, complementing the policy-grounding constraint.'
  status: active
- agents_md_anchor: null
  content: When a Read's path is bound from a prior Find/discovery result, never fall
    back to the Find root or any directory path when that result is empty; bind the
    path only from a file entry actually returned, and skip the dependent Read when
    no file path exists, because Read on a directory raises a hard 'is a directory'
    error that aborts the whole script rather than degrading gracefully.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: is a directory''. Observed
    Find returned <empty> (plan Find used name=''discount'' but file is /docs/discounts.md,
    no match). Failing fragment: `policy_path = policy_paths[0] if policy_paths else
    "/docs"` then `policy_doc = vm.read(path=policy_path, number=True)` — with empty
    Find, policy_path falls back to directory root ''/docs'', and Read on a directory
    is a hard runtime crash that kills the script (not a soft fidelity miss). Linkage:
    r003 bars fabricated fallback *document* paths in answer refs; r002 mandates unconditional
    emit of planned Reads — but neither addresses that the bound path resolves to
    a directory and crashes vm.read. New rule scopes the Find→Read binding: a planned
    Read may be skipped (or must use a real file path only) when discovery yields
    no file, since a directory-read abort is strictly worse than a fidelity multiset
    mismatch.'
  status: active
