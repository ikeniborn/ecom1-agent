  content: Always use the 'ops' section to add required references to the answer via
    'add_ref' operations, rather than relying solely on the answer block's 'refs'
    field.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Grader error: ''answer missing required reference ''/docs/security.md''''.
    The PlanIR answer block for the denied outcome included the ref, but the interpreter
    did not emit it. This indicates that answer block refs are not reliably included.
    To guarantee required refs are attached, the PlanIR must use an ''add_ref'' operation
    in the ops section for each required reference. The failing PlanIR fragment is
    the answer block''s refs list that was ignored.'
  status: inactive
  surface: ir
- agents_md_anchor: '#plan'
  content: Never use Exec RPC to set $_facts.identity.kind; rely on the pre-phase
    fact directly in decision branches.
