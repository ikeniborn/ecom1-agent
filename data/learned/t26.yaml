  id: r004
  reasoning: 'Error: real_vm: runtime tool not found: not found. The PlanIR discovery
    step used Exec RPC to run /bin/echo ''guest'' to set $_facts.identity.kind. The
    Exec tool is not available in the real VM, causing failure. The pre-phase likely
    already provides $_facts.identity.kind, so the PlanIR should not attempt to re-derive
    it via Exec. Rule r001 suggests using /bin/id via Exec, which is also unavailable;
    thus r001 is obsolete.'
  status: active
