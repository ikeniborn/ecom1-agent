- agents_md_anchor: null
  content: When extracting a list payload from a tool result, guard each candidate
    with isinstance(v, (list, tuple)) before treating it as iterable, and avoid probing
    generic attribute names like items/keys/values via getattr — on dict/mapping results
    those names resolve to built-in bound methods that are truthy but not iterable.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: fidelity TypeError: ''builtin_function_or_method'' object
    is not iterable at line 17 in _first_path. Root cause: _first_path probes container
    attribute names (''matches'',''results'',''entries'',''files'',''items'') with
    getattr(find_result, attr, None). When find_result is a dict (or dict-like), getattr(...,''items'',None)
    returns the built-in bound method dict.items, which is truthy, so `containers
    = v` then `for item in containers` iterates a method object — fails. Failing fragment:
    the for-attr loop assigns v=getattr(...) without verifying v is a sequence. Rule
    linkage: codegen must not assume probed attribute names are payload lists; collision
    with built-in mapping methods (items/keys/values) yields callables, so candidates
    must pass an isinstance list/tuple check before iteration.'
  status: active
- agents_md_anchor: null
  content: Always emit every RPC enumerated in the tool_plan discovery and ops blocks
    exactly once and unconditionally; never gate a planned Read/Exec/Find/Tree call
    behind runtime-derived truthiness (e.g. `vm.read(...) if path else None`) or behind
    early-return guards (authorization/empty-result short-circuits placed before the
    ops calls), because fidelity is scored on the RPC multiset matching the plan —
    move guard-based answers after the planned ops, or issue best-effort planned calls
    before branching.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''fidelity: AssertionError: fidelity drift (RPC multiset)
    expected: [Answer, Exec×5, Find×2, Read×2, Tree] got: [Answer, Exec×4, Find×2,
    Tree]''. Diff = missing 2 Read and 1 Exec. Root cause: planned RPCs made conditional
    on runtime values. Failing fragments: `discount_policy = vm.read(...) if discount_policy_path
    else None` and `checkout_policy = vm.read(...) if checkout_policy_path else None`
    — both skipped when _first_path() returned empty, dropping the 2 Read calls; and
    the `discount apply` Exec was skipped by the early-return guards (`if not authorized:
    ...return` / `if not target_basket_id: ...return`) before the ops block ran, dropping
    1 Exec. Tool_plan freezes 11 RPCs; CODEGEN emitted only 8. Rule linkage: CODEGEN
    must translate every planned RPC into an unconditional call; conditional/guard
    logic may change the Answer outcome but must not suppress planned discovery Reads
    or ops Execs. Complementary to the existing extraction-guard rule (which addresses
    why _first_path can return empty) but distinct — that rule is about safe list
    extraction, this is about unconditional RPC emission for fidelity.'
  status: active
