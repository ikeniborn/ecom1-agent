- agents_md_anchor: '#important-things > policy-grounding'
  content: When success_criteria encode policy/security preconditions (attempt-limit
    checks, recoverable-vs-fraud failure reasons, hard-decline gates), evaluate those
    conditions against the fetched data and derive the answer outcome from them —
    emit OUTCOME_DENIED_SECURITY (or the relevant denial outcome) when any gate fails
    — instead of hardcoding OUTCOME_OK or deriving outcome solely from the op RPC's
    exit code.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_DENIED_SECURITY,
    got OUTCOME_OK''. Root cause: script set outcome unconditionally — `vm.answer(message=message,
    outcome="OUTCOME_OK", refs=refs)` — and computed restart_outcome only from `code(restart)==0`.
    It never evaluated the policy gates listed in success_criteria (three_ds_attempts
    < three_ds_max_attempts, three_ds_failure_reason recoverable not fraud/hard-decline).
    Failing fragment: `restart_outcome = "applied" if code(restart) == 0 else "failed"`
    then `outcome="OUTCOME_OK"`. The data fetched into `attempts`/`max_attempts`/`failure_reason`
    was rendered into the message but never used to branch the outcome. Correct technique:
    parse those fields, test against policy, and select the denial outcome when a
    security gate trips. Linkage: complements r001 (still fire the planned op, express
    failure via outcome/message) by specifying HOW to compute that outcome — from
    preconditions, not exit code.'
  status: active
- agents_md_anchor: null
  content: When a planned RPC's argument is derived from a prior RPC's output (e.g.
    a Read whose path is extracted from Find/Tree results), always issue that RPC
    unconditionally — supply a best-effort or fallback argument when extraction yields
    nothing, instead of wrapping the call in an `if parsed_value:` guard, because
    skipping the call on parse failure drops it from the fidelity RPC multiset.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: `fidelity: ... AssertionError: fidelity drift (RPC multiset)
    expected: [''Answer'',''Exec'',''Exec'',''Exec'',''Exec'',''Find'',''Read'',''Tree'']
    got: [''Answer'',''Exec'',''Exec'',''Exec'',''Exec'',''Find'',''Tree'']`. Missing
    RPC = Read. Root cause: tool_plan declares a Read RPC ($security_policy_path)
    but script gates it behind `if security_policy_path:` — `security_policy = None;
    if security_policy_path: security_policy = vm.read(...)`. The Find output parsing
    (sp_candidates extraction requiring a token starting ''/'' with ''security'' and
    a dotted basename) produced empty security_policy_path this run, so vm.read never
    fired and the multiset lost Read. Failing fragment: the conditional skip of vm.read
    on empty derived path. Rule linkage: r001 covers early-return/policy guards before
    op RPCs; this is the complementary case — a discovery RPC whose argument comes
    from upstream output skipped due to parse failure. New rule mandates issuing the
    derived-arg RPC unconditionally with a fallback path so the multiset stays intact.'
  status: active
