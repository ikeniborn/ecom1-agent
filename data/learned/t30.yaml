- agents_md_anchor: null
  content: When a decision branch depends on a fact that may not be guaranteed by
    the pre-phase, include a compute step to verify the fact's presence and add a
    fallback branch to a safe outcome (e.g., OUTCOME_NONE_UNSUPPORTED) to prevent
    the interpreter from defaulting to OUTCOME_NONE_CLARIFICATION.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The plan's decision branch used $_facts.identity.kind to check for guest
    access, but the pre-phase did not set this fact. The condition evaluated to an
    undefined state, causing the decision to produce a label not present in the answer
    block, which the interpreter defaulted to OUTCOME_NONE_CLARIFICATION. The expected
    outcome was OUTCOME_DENIED_SECURITY because the identity was guest. The plan should
    have included a compute step to verify the fact's existence and a fallback branch
    to handle missing data gracefully.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a decision branch depends on a fact that is not directly bound by
    a discovery step (e.g., identity.kind from /bin/id output), include a compute
    step to parse the discovery output and extract the required fact, binding it to
    a variable used in the decision branch, to ensure the branch evaluates correctly.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: verify: I3: security constraint ''#guest-access'' deny_when holds
    but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY. Observed /bin/id
    output: user: cust_076, roles: customer. The PlanIR bound the raw output to ''identity''
    but did not parse it to extract identity.kind. The decision branch used $identity.kind,
    which was undefined, causing the branch to fall through to the default ''unsupported''
    outcome. The interpreter''s security check independently evaluated $_facts.identity.kind
    (likely via its own parsing) and found it to be ''guest'', triggering the constraint.
    The plan must parse discovery outputs to produce the facts needed by decision
    branches and security constraints.'
  status: active
  surface: ir
