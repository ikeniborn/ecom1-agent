- agents_md_anchor: null
  content: When a decision branch depends on a fact that is not directly bound by
    a discovery step (e.g., identity.kind from /bin/id output), include a compute
    step to parse the discovery output and extract the required fact, binding it to
    a variable used in the decision branch, to ensure the branch evaluates correctly.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: 'Error: verify: I3: security constraint ''#guest-access'' deny_when holds
    but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY. Observed /bin/id
    output: user: cust_076, roles: customer. The PlanIR bound the raw output to ''identity''
    but did not parse it to extract identity.kind. The decision branch used $identity.kind,
    which was undefined, causing the branch to fall through to the default ''unsupported''
    outcome. The interpreter''s security check independently evaluated $_facts.identity.kind
    (likely via its own parsing) and found it to be ''guest'', triggering the constraint.
    The plan must parse discovery outputs to produce the facts needed by decision
    branches and security constraints.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a constraint references a fact that is provided by the pre-phase (e.g.,
    $_facts.identity.kind), use the pre-phase fact directly in the decision branch
    rather than re-discovering it with an Exec RPC, to ensure the fact is always bound
    and avoid grounding failures.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'The error ''grader: expected outcome OUTCOME_DENIED_SECURITY, got OUTCOME_NONE_CLARIFICATION''
    occurred because the PlanIR attempted to discover identity by executing /bin/id
    and parsing the output as JSON, but /bin/id output is not JSON, causing the identity_kind
    variable to be unbound. The decision branch condition then failed, leading to
    OUTCOME_NONE_CLARIFICATION. The constraint uses $_facts.identity.kind, which is
    a pre-phase fact. The PlanIR should have used that fact directly instead of re-discovering
    it, avoiding the parsing failure and ensuring the branch evaluates correctly.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use concat to build strings or assign single values; concat is only
    for merging two rowsets (list[dict]). When constructing answer variables, use
    intent params directly or compute steps that produce strings.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: ''concat'' failed: missing 1 required positional argument ''b''.
    The script used concat with a single string argument (e.g., concat(''basket_264''))
    to set basket_id, payment_id, and outcome_message. The concat primitive requires
    two list[dict] arguments (rowsets). The intent already provides basket_id and
    payment_id as params; they should be used directly in the answer template, not
    via compute. The outcome_message should be a string, not a rowset. This rule prevents
    future misuse of concat for string building.'
  status: active
  surface: ir
