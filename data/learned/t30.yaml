- agents_md_anchor: '#important-things > policy-grounding'
  content: When the answer must cite the policy governing the operation, derive the
    policy reference from the docs Tree/Find discovery results by matching the operation
    domain (the workflow being invoked, e.g. the sub-area of the action), and include
    that operation-specific policy document path in answer refs — do not substitute
    a single generically-named policy file (like a top-level security doc) for the
    specific policy that governs the action, and parse the docs Tree output rather
    than leaving it unused.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/payments/3ds.md''".
    Root cause: script grounded only on a generic policy file found via Find name="security"
    and built refs = [payment_path, sp_path] where sp_path resolves to the top-level
    security doc; the operation-specific policy that actually governs a 3DS-recovery
    restart (/docs/payments/3ds.md) was never located or cited. Failing fragment:
    `security_policy_path = vm.find(root="/docs", name="security", kind="file")` plus
    the unused `docs_tree = vm.tree(root="/docs", level=2)` — the Tree result that
    would have surfaced the payments/3ds policy was fetched but discarded, and refs
    only appended sp_path. Rule linkage: prior rules (r001-r004) cover RPC fidelity,
    delimiter parsing, gate-derived outcome, and unconditional derived-arg RPCs, but
    none address completeness of the grounding reference set; this rule adds the missing
    technique — match the policy doc to the operation domain from Tree/Find output
    and include it in refs.'
  status: active
