- agents_md_anchor: null
  content: Never use concat with a single argument to create a literal value; always
    use the 'literal' primitive for literal values because concat requires two list[dict]
    rows arguments.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: interpret compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. Contract: concat(a, b) both args must be
    list[dict] rows. Failing PlanIR fragment: two concat steps each with only one
    argument (e.g., {"prim":"concat","args":["basket_001"],"into":"basket_id"}). Root
    cause: the planner incorrectly used concat to create a literal string, but concat
    expects two row lists. The correct primitive for literal values is ''literal''.
    Rule linkage: new rule prevents this misuse.'
  status: active
  surface: ir
- agents_md_anchor: '#compute'
  content: Never use the 'column' primitive on a result that is a single dict (single
    row); use the 'get' primitive to extract a field from a single row.
  created: '2026-06-25'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: ''column'' expects list[dict]; use ''get'' for a single row.
    The script used column on $basket_query, which is a single-row result from Exec
    (SELECT ''basket_001'' AS basket_id). The Exec step returns a single dict, not
    a list. The correct primitive is ''get'' to extract the field. This rule prevents
    similar shape mismatches in future PlanIR generation.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always extract the 'stdout' field from an ExecResponse using a 'get' operation
    before using its content in a condition, because ExecResponse is a structured
    object with fields stdout, stderr, exit_code, not a raw string.
  created: '2026-06-25'
  deactivated_reason: null
  id: r003
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "guest" field.''
    Root cause: The PlanIR binds the raw ExecResponse from /bin/id to $identity_raw
    and then uses it directly in a ''contains_any'' condition with rhs [''guest''].
    The ExecResponse is a protobuf message with fields stdout, stderr, exit_code;
    it does not have a ''guest'' field. The condition should operate on the stdout
    string. The failing PlanIR fragment is the decision branch: {"when":{"op":"contains_any","lhs":"$identity_raw","rhs":["guest"],"args":[]}}.
    The fix is to add a compute step that extracts stdout via ''get'' and then use
    that variable in the condition. No existing rule covers this pattern.'
  status: active
  surface: ir
