  content: Never use concat with a single argument to create a literal value; always
    use the 'literal' primitive for literal values because concat requires two list[dict]
    rows arguments.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: interpret compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. Contract: concat(a, b) both args must be
    list[dict] rows. Failing PlanIR fragment: two concat steps each with only one
    argument (e.g., {"prim":"concat","args":["basket_001"],"into":"basket_id"}). Root
    cause: the planner incorrectly used concat to create a literal string, but concat
    expects two row lists. The correct primitive for literal values is ''literal''.
    Rule linkage: new rule prevents this misuse.'
