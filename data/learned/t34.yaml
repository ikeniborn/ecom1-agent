- agents_md_anchor: null
  content: Always execute every RPC declared in tool_plan (discovery and ops) exactly
    once; never gate a planned RPC behind a data-dependent conditional or early return
    — branch logic may shape only the Answer content, not whether planned calls fire.
  created: '2026-06-06'
  deactivated_reason: 'r001 mandated firing every planned ops RPC unconditionally
    and forbade gating any planned RPC on data — that rule drove the unconditional
    /bin/payments checkout and the hardcoded OUTCOME_OK, defeating the security gate.
    The new rule narrows it: idempotent discovery RPCs still fire once, but side-effecting/mutating
    ops must be gated on the authorization verdict and the outcome derived from it.'
  id: r001
  reasoning: 'Verbatim error: ''fidelity: AssertionError: fidelity drift (RPC multiset)''
    expected 5 Exec got 4 (expected [''Answer'',''Exec'',''Exec'',''Exec'',''Exec'',''Exec'',''Find'',''Find'',''Read'',''Read'',''Tree''],
    got same minus one Exec). Root cause: tool_plan declares 5 Exec — /bin/id, /bin/payments
    --help, two /bin/sql (basket, items) in discovery, plus the ops /bin/payments
    checkout. CODEGEN wrapped the ops Exec in authorization/eligibility/stock guards
    with early `return` (failing fragment: the `if not authorized: ... return` and
    `if not (eligible_status and all_in_stock): ... return` branches before `checkout_result
    = vm.exec(path="/bin/payments", ...)`). When a guard triggers, the final /bin/payments
    checkout Exec never fires, dropping one Exec from the multiset. Fidelity freezes
    the RPC multiset against tool_plan, so any conditionally-skipped planned RPC drifts.
    Rule linkage: force all planned RPCs to run unconditionally; encode refusal/denial
    purely in the Answer message and outcome, not by skipping the call.'
  status: inactive
- agents_md_anchor: '#important-tools > payments'
  content: When an ops RPC invokes a CLI subcommand, confirm that exact subcommand
    appears in the tool's discovered --help output before firing it; if it is absent,
    do not invoke the call and instead surface the unsupported verb in the Answer,
    since invoking an unknown subcommand can block until a read timeout.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''real_vm_exec: The read operation timed out''. Root
    cause: the ops call fired the failing fragment `checkout_result = vm.exec(path="/bin/payments",
    args=["checkout", "--basket", basket_id])`, but the discovered `payments --help`
    lists only the subcommands {recover-3ds, approve-refund, refund} — there is no
    `checkout` verb. Invoking the unknown subcommand stalled the exec channel and
    the read timed out instead of erroring fast. The discovery output that would have
    prevented this (payments_help) was already bound but never consulted before firing
    the op. This is a CODEGEN technique gap: the script must validate the planned
    subcommand against the tool''s discovered capability surface before executing
    it. Distinct from the existing data-gating rule — that rule governs domain conditionals
    (ownership/status/stock), while this governs capability preconditions read from
    --help, so no contradiction or supersession.'
  status: active
