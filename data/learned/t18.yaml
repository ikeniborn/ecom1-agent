- agents_md_anchor: null
  content: Do not use dotted paths as the source for required refs; use a variable
    that directly holds the record_path, such as one bound by a 'get' primitive.
  created: '2026-06-21'
  deactivated_reason: The rule forbidding dotted paths as source for required refs
    conflicts with TOOL_PLAN required_refs that use dotted paths; the new rule requires
    exact conformance to the required_refs source.
  id: r001
  reasoning: The interpret error 'unresolved required ref(s) ['$product.record_path']'
    occurred because the answer ref used a dotted path '$product.record_path' while
    the compute step had already extracted the record_path into a variable '$product_record_path'.
    The interpreter could not resolve the dotted path as a ref source. The fix is
    to use the variable '$product_record_path' as the ref source.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When using filter_rows, provide exactly two arguments: the rows variable
    and a predicate function (e.g., lambda row: row[''column''] == value). Do not
    pass column name and value as separate arguments.'
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The interpret phase failed with: ''filter_rows() takes 2 positional
    arguments but 3 were given''. The PlanIR compute step used filter_rows with three
    arguments: [''$combined_rows'', ''row_type'', ''store'']. The contract states
    filter_rows(rows, pred) expects a list of rows and a predicate. The error indicates
    the PlanIR incorrectly split the condition into column name and value. The fix
    is to use a predicate function as the second argument.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When using the ''get'' primitive, always provide exactly two arguments:
    the object and the key string. Do not pass a dotted path as a single argument.'
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'The error ''get() missing 1 required positional argument: ''key''''
    occurred because the PlanIR compute step used ''get'' with a single argument ''$product.record_path''.
    The ''get'' primitive expects two arguments: the object and the key. The correct
    usage is ''get'' with args [''$product'', ''record_path'']. Additionally, the
    step ''get'' with args [''$stores''] is also incorrect; it should use ''column''
    or direct rowset binding, but the primary failure is the missing key argument.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When an Exec RPC uses bind 'rows', the result is an ExecResponse object;
    use a custom_extract step to extract the 'rows' field before using it in compute
    steps.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: ''ExecResponse'' object is not subscriptable. The compute step
    ''first'' tried to index into $rows, which was the raw ExecResponse from the discovery
    RPC (bind ''rows''). The PlanIR must first extract the actual rows list from the
    ExecResponse (e.g., via custom_extract with path ''rows'') before passing to compute
    primitives. The failing fragment: {"prim":"first","args":["$rows"],"into":"product"}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using Exec RPC with bind, the result is an ExecResponse object; to
    parse its stdout into rows, first use a custom_extract step to extract the stdout
    string, then use rowsets on that string.
  created: '2026-06-21'
  deactivated_reason: Superseded by a more direct 'Never' rule that combines the stdout
    extraction requirement and adds a guard for empty rowsets.
  id: r005
  reasoning: 'Error: interpret: compute step ''filter_rows'' failed: ''str'' object
    has no attribute ''op'' CONTRACT: filter_rows(rows, pred): first arg must be list[dict]
    rows. The PlanIR used Exec with bind ''combined_raw'', then rowsets with from_
    ''combined_raw'' directly. The Exec RPC returned an ExecResponse object, not a
    raw string, so rowsets could not parse it, leaving ''combined_rows'' as a string.
    The filter_rows step then received a string instead of a list of dicts. Root cause:
    missing extraction of stdout from ExecResponse before rowsets. Failing fragment:
    rowsets step using from_ ''combined_raw'' without prior custom_extract.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the TOOL_PLAN's required_refs specify a source, the answer refs must
    use that exact source string, and the script must ensure a variable with that
    exact name exists (e.g., by using a 'get' primitive that extracts the record_path
    into a variable with the dotted name, such as 'product.record_path').
  created: '2026-06-21'
  deactivated_reason: r006's example used 'product.record_path' without the required
    $ prefix, causing the exact-name requirement to be misinterpreted. This new rule
    supersedes it with explicit handling of $ and rowset expressions.
  id: r006
  reasoning: The error 'unresolved required ref(s) ["$product.record_path"]' indicates
    the interpreter tried to resolve the required ref source from TOOL_PLAN (which
    is "$product.record_path") but found no such variable. The script used "$product_record_path"
    instead, violating the required ref's source. The existing rule forbids dotted
    paths as source for required refs, but the TOOL_PLAN's required_refs themselves
    use a dotted path, so the script must conform to that exact source.
  status: inactive
  surface: ir
