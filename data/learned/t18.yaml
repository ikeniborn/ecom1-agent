  reasoning: 'Error: ''interpret: compute step ''sum_col'' failed: _sum_col() missing 1 required positional
    argument: ''col''''. The PlanIR compute step for sum_col had args: [''$inventory_rows.available_today_quantity''],
    which is a single column reference. The contract requires two arguments: rows (list of dicts) and
    col (string). The correct args should be [''$inventory_rows'', ''available_today_quantity'']. This
    rule ensures the primitive is called with the proper number and type of arguments.'
  status: active
