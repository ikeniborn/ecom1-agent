- agents_md_anchor: null
  content: Always execute the exact SQL strings supplied in the tool_plan's discovery
    and ops stdin fields verbatim instead of reconstructing semantically-equivalent
    SQL in code; never collapse a discovery CTE joined via CROSS JOIN/`product_sku
    = t.product_sku` into a scalar `si.product_sku = (SELECT ...)` subquery, because
    a scalar subquery that resolves to more than one matching variant errors or silently
    keeps one row, undercounting the aggregate.
  created: '2026-06-07'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: grader: Answer should be "12 total". Root cause: CODEGEN
    did not run the frozen tool_plan ops SQL verbatim. The tool_plan resolves the
    target via `WITH target AS (SELECT pv.product_sku ...)` and aggregates with `...
    CROSS JOIN target t LEFT JOIN store_inventory si ON ... AND si.product_sku = t.product_sku`,
    which sums across every matching variant. The script rebuilt this as a scalar
    subquery — failing fragment `sku_subq = "(SELECT pv.product_sku " + target_pred
    + ")"` used in `... AND si.product_sku = " + sku_subq` (both vienna_sql and total_sql).
    When brand/series/model 218-FC5 + cleaner_type=''screen wash'' resolves to more
    than one product_sku (e.g. multiple pack sizes), scalar `=` either errors or truncates
    to a single SKU, so the Vienna SUM lands below the correct 12. Rule linkage: the
    new rule forbids reconstructing tool_plan SQL and forbids collapsing a set-valued
    CTE join into a scalar `= (subquery)`, preserving the multi-SKU sum. Distinct
    from r001 (CSV parsing), r002 (refs enumeration not gated on zero-row discovery
    — different query/concern), and r003 (no availability post-filter on refs).'
  status: active
