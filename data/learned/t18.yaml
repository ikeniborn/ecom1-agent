- agents_md_anchor: null
  content: When constructing decision branches, never nest a logical operator inside
    a 'not' op; instead, use a single top-level op (e.g., 'and', 'or', 'nonempty')
    and place the desired outcome in the default branch or use a direct op that matches
    the condition.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'The interpreter failed to evaluate the decision condition ''not'' with
    nested ''and'', resulting in OUTCOME_NONE_CLARIFICATION instead of the expected
    branch. The PlanIR used ''op'': ''not'' with args containing an ''and'' op, which
    is unsupported. The rule ensures decision conditions are simple and directly evaluable.'
  status: inactive
  surface: ir
