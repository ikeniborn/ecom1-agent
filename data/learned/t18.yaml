- agents_md_anchor: null
  content: Always use case-insensitive and whitespace-trimmed comparisons in SQL discovery
    steps when matching text values, to avoid false negatives.
  created: '2026-06-22'
  deactivated_reason: null
  id: r016
  reasoning: The plan produced OUTCOME_NONE_UNSUPPORTED because the product lookup
    SQL returned zero rows, likely due to a case mismatch in the EXISTS subquery (e.g.,
    'gray' vs 'Gray'). The decision branch correctly triggered unsupported when product_count=0,
    but the grader expected OK, indicating the product exists. The root cause is a
    fragile text comparison in the discovery SQL. The rule enforces robust matching
    (LOWER/TRIM) in all future plans.
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Always provide two arguments to the sum_col primitive: the rows reference
    (e.g., ''$inventory_rows'') and the column name string (e.g., ''available_today_quantity'').
    Do not pass a single column reference.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r017
  reasoning: 'Error: ''interpret: compute step ''sum_col'' failed: _sum_col() missing
    1 required positional argument: ''col''''. The PlanIR compute step for sum_col
    had args: [''$inventory_rows.available_today_quantity''], which is a single column
    reference. The contract requires two arguments: rows (list of dicts) and col (string).
    The correct args should be [''$inventory_rows'', ''available_today_quantity''].
    This rule ensures the primitive is called with the proper number and type of arguments.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using LIKE to match a text column in a discovery SQL step, always
    apply LOWER(TRIM(...)) to both the column and the pattern to ensure case-insensitive
    and whitespace-trimmed matching.
  created: '2026-06-22'
  deactivated_reason: null
  id: r018
  reasoning: The error 'unresolved required ref(s) ['$product_record_path']' occurred
    because the product discovery SQL returned no rows, causing product_record_path
    to be set to an empty string. The SQL used LIKE '%Valve and Connector%' without
    LOWER/TRIM on the product_name column, which likely caused a case/whitespace mismatch.
    The PlanIR did not handle the empty rowset case, but the root cause is the SQL
    not matching the product. The new rule ensures robust text matching in discovery
    steps.
  status: active
  surface: ir
