- agents_md_anchor: null
  content: When using LIKE to match a text column in a discovery SQL step, always apply LOWER(TRIM(...))
    to both the column and the pattern to ensure case-insensitive and whitespace-trimmed matching.
  created: '2026-06-22'
  deactivated_reason: null
