- agents_md_anchor: null
  content: Never use rowsets directly on an Exec RPC bind variable; always extract
    stdout via custom_extract first. When extracting a value from a potentially empty
    rowset, always check nonempty before using 'get'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: The script used rowsets on $product_query.stdout, but product_query is
    an Exec RPC with bind, so its result is an ExecResponse object, not a string.
    This caused rowsets to fail, leading to empty or invalid product_rows. The subsequent
    'get' on $product_rows.0 then failed, and the interpreter produced OUTCOME_NONE_CLARIFICATION
    instead of a defined outcome. Additionally, even with correct stdout extraction,
    the script's compute step assumes product_rows is nonempty; if the product is
    not found, the 'get' would still fail before the decision branches can check emptiness.
    The existing rules r005 and r007 describe the custom_extract requirement but were
    not followed; a stronger 'Never' rule is needed, and the empty-rowset guard is
    added.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always use the exact required ref source string (including leading $ and
    any brackets) as the variable name when setting it via compute. For a scalar ref
    like $product.record_path, set into: ''$product.record_path''. For a rowset expression
    like $vienna_stores[*].record_path, use a get primitive to extract the column
    list into a variable with that exact name.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Interpret error: unresolved required ref(s) [''$product.record_path'',
    ''$vienna_stores[*].record_path'']. The script set variable ''product.record_path''
    (missing $) and did not create a variable for ''$vienna_stores[*].record_path''.
    Required refs must be matched by variables with the exact source string, including
    $ and brackets. r006''s example omitted the $, leading to this mismatch. The new
    rule corrects this by enforcing exact string matching and specifying the get primitive
    for rowset expressions.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always ensure that required refs are set to a non-null value before the
    answer step, even if the source rowset is empty. For scalar refs like $product.record_path,
    use coalesce(get(first($rows), 'record_path'), '') to set the variable. For rowset
    refs like $vienna_stores[*].record_path, if the rowset is empty, set the variable
    to an empty list using a literal array; otherwise use column.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: The error 'unresolved required ref(s) ["$product.record_path", "$vienna_stores[*].record_path"]'
    occurred because the compute steps that set these variables did not produce a
    value when the source rowsets were empty. The product query returned no rows,
    so 'first' returned null, and 'get' on null did not set $product.record_path.
    Similarly, the Vienna stores query may have returned no rows, and 'column' on
    an empty rowset may not have set the variable. The plan must guarantee these refs
    are always defined for the OK outcome.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When using the filter_rows primitive, always pass exactly two arguments:
    the rows variable and a predicate object (e.g., {"op": "eq", "lhs": "row_type",
    "rhs": "product"}) rather than expanding the predicate into multiple positional
    arguments.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'Error: ''interpret: compute step ''filter_rows'' failed: _filter_rows()
    takes 2 positional arguments but 4 were given''. The failing PlanIR fragment:
    compute step ''filter_rows'' with args ["$combined","eq","row_type","product"].
    The contract states filter_rows(rows, pred) expects a single predicate argument,
    not a function name plus its arguments. The root cause is incorrect argument packing
    for the filter_rows primitive. This rule instructs the PLAN phase to always pack
    the predicate as a single object argument.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include all required refs from the TOOL_PLAN in the answer's refs
    array, using the exact source strings specified in the required_refs section.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: The interpret phase failed with 'unresolved required ref(s) ["$product.record_path",
    "$vienna_stores[*].record_path"] on OK answer'. The PlanIR script correctly computed
    variables with those names, but the answer section had an empty refs array ("refs":[]).
    The required refs must be explicitly listed in the answer's refs field to satisfy
    the required_refs constraint. The root cause is a missing answer refs declaration.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When extracting a required ref from a rowset, always handle the case where
    the rowset is empty. For scalar refs like $product.record_path, use coalesce(get(first($rows),
    ''column''), '''') to ensure the variable is set to an empty string rather than
    null. For rowset refs like $vienna_stores[*].record_path, use a conditional: if
    the rowset is empty, set the variable to an empty list using a literal array;
    otherwise use column.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product.record_path'',
    ''$vienna_stores[*].record_path''] on OK answer. Root cause: the compute steps
    set these refs using ''get'' and ''column'' without handling empty rowsets. When
    product_rows or vienna_rows were empty, the variables were set to null (or not
    set), causing the interpreter to treat them as unresolved. The failing PlanIR
    fragment: compute steps {"prim":"get","args":["$product","record_path"],"into":"$product.record_path"}
    and {"prim":"column","args":["$vienna_rows","record_path"],"into":"$vienna_stores[*].record_path"}.
    The new rule mandates coalesce and conditional logic to guarantee non-null values,
    preventing unresolved refs.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always ensure that required refs of kind 'record_path' are set to a non-empty
    string; if the source rowset is empty, do not set the variable to empty string
    (which is invalid) — instead, branch to a different outcome or guarantee the record
    is found. For rowset refs, if the source rowset is empty, set the variable to
    an empty list using a literal array; otherwise use column.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product.record_path'',
    ''$vienna_stores[*].record_path''] on OK answer. Root cause: The script set $product.record_path
    to an empty string (from empty product rowset) which is not a valid record_path,
    and set $vienna_stores[*].record_path via column on an empty rowset, likely resulting
    in null. The existing in-session rule suggested using coalesce to empty string,
    which is invalid for record_path refs. The new rule mandates non-empty strings
    for scalar record_path refs and empty list for rowset refs when source is empty.'
  status: inactive
  surface: ir
