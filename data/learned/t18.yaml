- content: Never emit the PLAN_OUTPUT action `WITH target_product AS (SELECT p.sku,
    p.path FROM products p LEFT JOIN product_properties pp ON p.sku = pp.sku AND pp.key
    = 'size' WHERE p.brand = 'Portwest' AND p.model LIKE '%3TU-ST2%' AND p.name LIKE
    '%Work Gloves%' AND pp.value_text = 'L') SELECT s.id, s.path AS store_path, s.name,
    s.city, t.sku, t.path AS product_path, COALESCE(i.available_today, 0) AS available_today
    FROM stores s CROSS JOIN target_product t LEFT JOIN inventory i ON i.store_id
    = s.id AND i.sku = t.sku WHERE LOWER(s.city) = 'vienna' AND LOWER(s.name) LIKE
    '%powertool%'` as a raw SQL string; always wrap SQL queries in `/bin/sql '<query>'`
    so the action begins with an absolute executable path.
  created: '2026-05-23'
  deactivated_reason: r001 mandated wrapping SQL in `/bin/sql '<query>'` using shell
    single quotes, which causes bash to fragment the argument whenever the SQL contains
    single-quoted string literals (e.g., ''size''), leading to syntax errors.
  id: r001
  reasoning: 'The verbatim error is `exec failed: invalid path: path must be absolute:
    "WITH"`. The root cause category is `wrong-action`: the emitted action is a raw
    SQL string that lacks an absolute executable path, so the executor treats the
    leading token `WITH` as a command path and rejects it. The failing fragment is
    the PLAN_OUTPUT action `WITH target_product AS (SELECT p.sku, p.path FROM products
    p LEFT JOIN product_properties pp ON p.sku = pp.sku AND pp.key = ''size'' WHERE
    p.brand = ''Portwest'' AND p.model LIKE ''%3TU-ST2%'' AND p.name LIKE ''%Work
    Gloves%'' AND pp.value_text = ''L'') SELECT s.id, s.path AS store_path, s.name,
    s.city, t.sku, t.path AS product_path, COALESCE(i.available_today, 0) AS available_today
    FROM stores s CROSS JOIN target_product t LEFT JOIN inventory i ON i.store_id
    = s.id AND i.sku = t.sku WHERE LOWER(s.city) = ''vienna'' AND LOWER(s.name) LIKE
    ''%powertool%''`. The rule requires that this exact action never be emitted as
    raw SQL and instead be wrapped in `/bin/sql ''<query>''`.'
  source: learn
  status: inactive
- content: Never emit the PLAN_OUTPUT action `/bin/sql 'SELECT p.sku, p.path FROM
    products p LEFT JOIN product_properties pp ON p.sku = pp.sku AND pp.key = ''size''
    WHERE p.brand = ''Portwest'' AND p.model LIKE ''%3TU-ST2%'' AND p.name LIKE ''%Work
    Gloves%'' AND pp.value_text = ''L'''` or any action that nests SQL single-quote
    escapes inside shell single quotes; instead wrap the query in shell double quotes
    or pass it via stdin so that inner SQL single quotes remain literal.
  created: '2026-05-23'
  deactivated_reason: null
  id: r002
  reasoning: 'The error message states: ''Unable to determine availability: all SQL
    queries failed with syntax errors. No product or store records could be retrieved
    to compute the total.'' The root cause is syntax: inside the shell command, SQL
    string literals were escaped as doubled single quotes (e.g., ''''size''''), but
    because the entire argument was wrapped in shell single quotes, bash interpreted
    each pair as ending and restarting the quoted string, fragmenting the SQL into
    multiple arguments. This caused the SQL engine to receive a malformed query and
    report a syntax error near the start of the statement. The failing fragment is
    the PLAN_OUTPUT action `/bin/sql ''SELECT p.sku, p.path FROM products p LEFT JOIN
    product_properties pp ON p.sku = pp.sku AND pp.key = ''''size'''' WHERE p.brand
    = ''''Portwest'''' AND p.model LIKE ''''%3TU-ST2%'''' AND p.name LIKE ''''%Work
    Gloves%'''' AND pp.value_text = ''''L''''''`. The existing rule r001 required
    wrapping the query in `/bin/sql ''<query>''`, which contributed by mandating shell
    single quotes without accounting for inner SQL single quotes. The new rule prohibits
    nesting SQL single-quote escapes inside shell single quotes and mandates double-quote
    wrapping or stdin.'
  source: learn
  status: active
