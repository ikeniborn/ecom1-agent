  content: 'Always provide two arguments to the sum_col primitive: the rows reference (e.g., ''$inventory_rows'')
    and the column name string (e.g., ''available_today_quantity''). Do not pass a single column reference.'
  created: '2026-06-22'
  deactivated_reason: null
