- agents_md_anchor: null
  content: When using Exec RPC with bind, place the custom_extract step to extract
    stdout immediately after the discovery step, before any rowsets step that references
    the extracted variable.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more direct 'Never' rule that combines the stdout
    extraction requirement and adds a guard for empty rowsets.
  id: r007
  reasoning: The script placed the custom_extract step at the end, after the answer
    block. The rowsets step referenced '$combined_stdout' before it was created, causing
    the interpreter to fail with 'custom_extract 'extract_stdout' failed'. The existing
    rule r005 already says 'first use a custom_extract step to extract the stdout
    string, then use rowsets on that string', but the script violated it. This new
    rule makes the ordering explicit to prevent future misplacement.
  status: inactive
  surface: ir
