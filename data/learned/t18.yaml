- agents_md_anchor: null
  content: Always use case-insensitive and whitespace-trimmed comparisons in SQL discovery
    steps when matching text values, to avoid false negatives.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: The plan produced OUTCOME_NONE_UNSUPPORTED because the product lookup
    SQL returned zero rows, likely due to a case mismatch in the EXISTS subquery (e.g.,
    'gray' vs 'Gray'). The decision branch correctly triggered unsupported when product_count=0,
    but the grader expected OK, indicating the product exists. The root cause is a
    fragile text comparison in the discovery SQL. The rule enforces robust matching
    (LOWER/TRIM) in all future plans.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always provide two arguments to the sum_col primitive: the rows reference
    (e.g., ''$inventory_rows'') and the column name string (e.g., ''available_today_quantity'').
    Do not pass a single column reference.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r017
  reasoning: 'Error: ''interpret: compute step ''sum_col'' failed: _sum_col() missing
    1 required positional argument: ''col''''. The PlanIR compute step for sum_col
    had args: [''$inventory_rows.available_today_quantity''], which is a single column
    reference. The contract requires two arguments: rows (list of dicts) and col (string).
    The correct args should be [''$inventory_rows'', ''available_today_quantity''].
    This rule ensures the primitive is called with the proper number and type of arguments.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using LIKE to match a text column in a discovery SQL step, always
    apply LOWER(TRIM(...)) to both the column and the pattern to ensure case-insensitive
    and whitespace-trimmed matching.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r018
  reasoning: The error 'unresolved required ref(s) ['$product_record_path']' occurred
    because the product discovery SQL returned no rows, causing product_record_path
    to be set to an empty string. The SQL used LIKE '%Valve and Connector%' without
    LOWER/TRIM on the product_name column, which likely caused a case/whitespace mismatch.
    The PlanIR did not handle the empty rowset case, but the root cause is the SQL
    not matching the product. The new rule ensures robust text matching in discovery
    steps.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always add a rowset step after an Exec RPC discovery step to extract the
    rows into a list variable before using that variable in compute primitives that
    expect a sequence (e.g., 'first', 'column', 'sum_col').
  created: '2026-06-24'
  deactivated_reason: null
  id: r019
  reasoning: 'Error: ''interpret: compute step ''first'' failed: ''ExecResponse''
    object is not subscriptable''. Root cause: The compute step ''first'' was applied
    to $product_info, which is an ExecResponse object (the raw result of an Exec RPC),
    not a list of rows. The PlanIR has no rowset step to extract rows from the ExecResponse,
    so the ''first'' primitive attempts to subscript the object, causing the failure.
    Failing PlanIR fragment: {"prim":"first","args":["$product_info"],"into":"product_row"}.
    This rule ensures that sequence primitives receive a proper list, preventing this
    error.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always use a predicate object (dict with op, lhs, rhs, args) as the second
    argument to filter_rows, not a flat list of strings.
  created: '2026-06-24'
  deactivated_reason: null
  id: r020
  reasoning: 'Error: interpret: compute step ''filter_rows'' failed: _filter_rows()
    takes 2 positional arguments but 4 were given. The PlanIR compute step for filter_rows
    passed args ["$rows","row_type","eq","product"] as four separate strings, but
    the contract expects (rows, pred) where pred is a predicate object. The correct
    PlanIR should be {"prim":"filter_rows","args":["$rows",{"op":"eq","lhs":"row_type","rhs":"product"}],"into":"product_rows"}.
    This is a PlanIR shape bug, not a data issue.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Always pass exactly one argument to the ''first'' primitive: the sequence
    reference (e.g., ''$rows''). Do not include an index; if you need the nth element,
    use the ''nth'' primitive with two arguments (sequence and index).'
  created: '2026-06-24'
  deactivated_reason: null
  id: r021
  reasoning: 'Error: ''interpret: compute step ''first'' failed: <lambda>() takes
    1 positional argument but 2 were given CONTRACT: first(seq)''. The PlanIR compute
    step used ''first'' with two arguments: [''$product_data_rows'', 0]. The ''first''
    primitive expects exactly one argument (the sequence). The fix is to use ''first($product_data_rows)''
    without the index. This is a PlanIR shape bug; no existing rule covers this.'
  status: active
  surface: ir
