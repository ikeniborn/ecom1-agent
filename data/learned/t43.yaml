- agents_md_anchor: null
  content: Always include a discovery step to verify the caller's identity kind before
    using it in a decision branch.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: Grader expected OUTCOME_NONE_UNSUPPORTED but script produced OUTCOME_DENIED_SECURITY.
    The script's decision branch relied on $_facts.identity.kind without any discovery
    step to ground that fact. The pre-phase likely set identity.kind incorrectly,
    causing the branch to trigger when it should not have. The root cause is missing
    discovery for authorization verification.
  status: inactive
  surface: ir
