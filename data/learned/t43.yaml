- agents_md_anchor: null
  content: When a decision tree includes a branch for a deny_when condition, also include a branch for
    the opposite condition leading to an outcome that permits the action; do not use a default label that
    always denies.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: Grader expected OUTCOME_OK but plan produced OUTCOME_DENIED_SECURITY. The plan's decision
    tree had only a branch for identity.kind eq 'guest' leading to denied, and a default label also denied.
    Thus, even for authenticated users, the outcome was denied. The plan must include a branch for the
    false case (non-guest) leading to a permissive outcome (e.g., OUTCOME_OK).
  status: active
  surface: ir
