- agents_md_anchor: '#important-tools > payments'
  content: When the tool_plan's policy/RBAC grounding shows the requested operation
    is impermissible or unsupported for the current actor (e.g. customer-initiated
    refund finalize not permitted), branch the answer to OUTCOME_NONE_UNSUPPORTED;
    reserve OUTCOME_NONE_CLARIFICATION strictly for genuine ambiguity among multiple
    valid matching candidates, not for zero-match or policy-blocked actions.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_NONE_UNSUPPORTED,
    got OUTCOME_NONE_CLARIFICATION''. Root cause: codegen maps every non-single-match
    branch to CLARIFICATION. The tool_plan itself flags the constraint (''customer-initiated
    immediate finalize not permitted; routed to approval per workflow'') — the payments
    policy + RBAC make the refund action unsupported for the current actor, so the
    correct terminal outcome is UNSUPPORTED, not a request for clarification. Failing
    fragment: the 0-row branch `vm.answer(message=..., outcome="OUTCOME_NONE_CLARIFICATION",
    ...)` and the multi-row branch both emit CLARIFICATION, and the single-match branch
    emits OUTCOME_OK while the policy already forbids the op. The script never derives
    UNSUPPORTED from the policy/RBAC constraint encoded in tool_plan. Rule linkage:
    distinct from r001/r002 (RPC-multiset emission, try/except guarding) — this governs
    outcome-token selection from policy grounding, which neither covers. v001 is a
    verdict marker, not a rule, so no semantic duplicate.'
  status: active
- agents_md_anchor: null
  content: When a planned RPC's argument is bound to a prior RPC's parsed output,
    still issue that dependent RPC unconditionally — pass an empty-string/sentinel
    argument when the upstream bind resolves empty, instead of wrapping the call in
    an `if bind:` guard that can drop it from the executed RPC multiset.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected [...Read...] got [...no Read...]''. Root cause: Read is chained
    on $returns_doc from Find; script wraps it in `if returns_doc:` so when Find parse
    yields empty (returns_doc=='''') the vm.read call is skipped, dropping Read from
    executed multiset. Failing fragment: `if returns_doc: ... returns_policy = vm.read(...)`
    else None. Linkage: r001 forbids gating a planned op behind a data-dependent guard
    but frames it around ops/early-returns; this is a chained DISCOVERY RPC whose
    bind argument may resolve empty — the technique fix is to still emit the call
    with a sentinel arg, which r001 does not literally state.'
  status: active
