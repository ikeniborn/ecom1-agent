- agents_md_anchor: null
  content: When a discovery RPC returns unstructured text, use a compute step to extract
    the required fact fields before decision.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: verify: I3: security constraint ''#security authentication''
    deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY.
    Observed RPC output: ''user: cust_011\nroles: customer''. The PlanIR discovery
    binds raw text to ''identity'' without parsing. The constraint check likely defaulted
    identity.kind to ''guest'' (deny_when true), but the decision branch compared
    the raw string to ''guest'' (false), leading to default ''unsupported'' outcome.
    Root cause: missing compute step to extract identity.kind from unstructured RPC
    output, causing mismatch between constraint evaluation and decision branching.'
  status: inactive
  surface: ir
