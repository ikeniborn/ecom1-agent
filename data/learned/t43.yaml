- agents_md_anchor: '#important-things > policy-grounding'
  content: Always parse a discovery RPC's output (Find/Tree/Read) robustly into the
    bound path and unconditionally include every reference declared in the tool_plan
    answer_template.refs in vm.answer's refs argument; never gate a required grounding
    reference behind an `if bind:` guard or let a fragile output parse leave it empty,
    since a dropped policy/document reference fails grader reference checks even when
    the RPC ran.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/returns.md''".
    Root cause: the Find result for the returns policy was parsed through a chain
    of brittle attribute lookups (getattr ''paths''/''matches'', dict fallbacks, then
    stdout line-splitting); when none matched, returns_doc stayed "". Failing fragment:
    `refs = []` then `if returns_doc: refs.append(returns_doc)` (and the zero/multi
    branches likewise append returns_doc only when truthy). Because returns_doc resolved
    empty, the required policy grounding reference was conditionally omitted from
    vm.answer refs, so the answer lacked /docs/returns.md despite the Find/Read RPCs
    executing. Linkage: tool_plan answer_template.refs binds $returns_doc and agents_md
    policy-grounding constraint mandates the policy doc as a grounding reference;
    the fix is robust path extraction plus unconditional inclusion of every declared
    ref. Distinct from r001/r002/r004 (which cover emitting/guarding RPCs, not answer
    ref completeness) and r003 (outcome branching).'
  status: active
