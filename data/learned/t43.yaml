- agents_md_anchor: null
  content: When a decision tree includes a branch for a deny_when condition, also
    include a branch for the opposite condition leading to an outcome that permits
    the action; do not use a default label that always denies.
  created: '2026-06-22'
  deactivated_reason: r005 forces a 'permitted' branch even when the outcome_space
    does not include a permitted outcome, leading to verify failure. This new rule
    supersedes it.
  id: r005
  reasoning: Grader expected OUTCOME_OK but plan produced OUTCOME_DENIED_SECURITY.
    The plan's decision tree had only a branch for identity.kind eq 'guest' leading
    to denied, and a default label also denied. Thus, even for authenticated users,
    the outcome was denied. The plan must include a branch for the false case (non-guest)
    leading to a permissive outcome (e.g., OUTCOME_OK).
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the outcome_space contains only a single outcome (e.g., OUTCOME_DENIED_SECURITY)
    and does not include a success outcome like OUTCOME_OK, the decision tree must
    not include any branch that produces an outcome not in that space; the default
    label must also produce an outcome within the space, or the tree should be structured
    to always produce the only allowed outcome.
  created: '2026-06-24'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: verify: I2: outcome ''OUTCOME_OK'' not in outcome_space [''OUTCOME_DENIED_SECURITY''].
    Root cause: PlanIR decision tree had a default branch ''permitted'' producing
    OUTCOME_OK, which is not in the outcome_space. The outcome_space only contains
    OUTCOME_DENIED_SECURITY, so the tree should only produce that outcome. Existing
    rule r005 forced inclusion of a ''permitted'' branch, which is invalid here. New
    rule prevents such invalid branches when outcome_space is restricted.'
  status: active
  surface: ir
