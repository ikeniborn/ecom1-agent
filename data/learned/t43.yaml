- agents_md_anchor: null
  content: When a parameter value is a literal string, use a compute step with prim 'literal' to bind
    it; never use 'concat' for a single literal.
  created: '2026-06-22'
  deactivated_reason: null
  id: r003
  reasoning: 'The interpret error ''concat: missing 1 required positional argument: b'' occurred because
    the plan used concat with a single string argument ''pay_005''. The concat primitive requires two
    list[dict] rows arguments. The intended operation was to bind the literal payment_id to a variable
    for the answer template. The correct primitive is ''literal'', which takes a single string and produces
    a row with that value. This rule prevents misuse of concat for literal binding.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Do not use a rowset with format 'json' on discovery RPC output that is not valid JSON; instead,
    use a compute step to extract the required fields.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: 'ERROR: verify: I3: security constraint ''/docs/security.md#customer-ownership'' deny_when
    holds but outcome is ''OUTCOME_NONE_UNSUPPORTED''. Root cause: The PlanIR used a rowset with format
    ''json'' to parse the output of /bin/id, which returns unstructured text (e.g., ''user: cust_014\nroles:
    customer''). This caused the identity kind extraction to fail, leading to a null value that did not
    match the ''guest'' branch, defaulting to ''unsupported''. The constraint check, however, correctly
    identified the caller as a guest (likely from raw output), triggering the deny condition. The existing
    rule r001 advises using a compute step for unstructured text, but the script used a rowset instead.
    This new rule explicitly forbids using ''json'' rowset format on non-JSON output.'
  status: active
  surface: ir
- content: null
  created: '2026-06-22'
  id: v015
  score: 0.0
  score_detail:
  - expected outcome OUTCOME_OK, got OUTCOME_DENIED_SECURITY
  source: verdict
