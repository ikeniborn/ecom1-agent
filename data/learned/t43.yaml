- content: 'For refund requests ("refund my payment pay_005" or similar): run tree:/docs/
    to find /docs/returns.md, read it to understand the returns/refund policy, then
    process the refund. Include /docs/returns.md in grounding_refs. Do NOT return
    OUTCOME_NONE_UNSUPPORTED without first reading the returns policy and checking
    available tools.'
  created: '2026-05-23'
  deactivated_reason: null
