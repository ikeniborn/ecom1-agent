- agents_md_anchor: null
  content: When a query depends on a named entity (e.g., store, brand), always include
    a discovery step to resolve the entity's identifier from the relevant table using
    a flexible match, and ensure the final answer defaults to 0 if no matching entity
    is found.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Verify failure: answer did not match regex ''^\d+ products$''. Observed
    RPC output for /bin/sql was empty, indicating the SQL query returned no rows.
    Root cause: the plan used a literal store name ''Linz Hauptplatz PowerTool shop''
    directly in the SQL, but that name likely did not match any store in the database,
    causing the inventory_check CTE to be empty. The SQL query then returned no rows,
    the compute step extracted null from an empty rowset, and the answer message became
    ''null products'' (or similar), failing the regex. The plan lacked a discovery
    step to resolve the store ID from the stores table and did not handle the empty-rowset
    case with a default value.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the objective requires counting products that meet a condition, the
    PlanIR must include discovery steps to resolve all entities (store, products)
    and a query to the relevant data source to count the products meeting the threshold,
    and the answer message must be exactly the required format without extra whitespace.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The verify step failed because the answer did not match the regex '^\d+
    products$'. The PlanIR only discovered the store_id, then hardcoded cnt=0 and
    answered '0 products'. The root cause is that the PlanIR omitted the necessary
    inventory query and product resolution steps, so the count was always 0 (and possibly
    the answer had a trailing newline causing regex mismatch). The new rule ensures
    future PlanIRs include entity resolution and a real counting query, and format
    the answer precisely.
  status: inactive
  surface: ir
