- agents_md_anchor: '#plan-compute-primitives'
  content: Do not use concat to build a JSON array string; concat only merges two
    list[dict] rows. Use format or json_array to construct a JSON array string from
    multiple values.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'The interpret error ''concat() takes 2 positional arguments but 19 were
    given'' occurred because the PlanIR compute step used concat with many string
    fragments to build a JSON array string. The concat primitive contract requires
    exactly two list[dict] arguments. The correct technique is to use format (with
    a template string and the values as arguments) or json_array to produce the JSON
    array string. The failing PlanIR fragment: {"prim":"concat","args":["[","\"","$sku0","\",",...],"into":"$skus_json"}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the required refs for an outcome include a record_path kind with source
    '$rows[*].record_path', the PlanIR answer refs must have source pointing to the
    record_path column of the rows (e.g., '$product_rows[*].record_path'), not the
    rows themselves.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: interpret: unresolved required ref(s) [''$rows[*].record_path'']
    on OK answer. The PlanIR answer refs had source ''$product_rows'' (the whole rows
    object) instead of ''$product_rows[*].record_path''. The required refs source
    is ''$rows[*].record_path'', so the answer refs must project the record_path column
    from the rows. This rule ensures the answer refs match the required refs'' column
    projection.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the required refs for an outcome include a record_path kind with source
    '$rows[*].record_path', the PlanIR must name the rows variable that holds the
    record_path column as '$rows' (i.e., use 'into':'rows' in the rowsets step) and
    the answer ref source must be exactly '$rows[*].record_path'.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more comprehensive rule that explicitly forbids
    defaulting to an unsupported outcome without attempting to ground required refs.
  id: r008
  reasoning: 'Error: interpret: unresolved required ref(s) [''$rows[*].record_path'']
    on OK answer. The PlanIR answer ref source was ''$matched_products[*].record_path'',
    but the required ref source is ''$rows[*].record_path''. The interpreter expects
    an exact match, so the rows variable must be named ''$rows'' and the answer ref
    source must be ''$rows[*].record_path''. The failing PlanIR fragment: rowsets
    step used ''into'':''matched_products'' and answer ref source ''$matched_products[*].record_path''.
    Root cause: variable name mismatch between required ref template and actual rows
    variable.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the required refs for an outcome include a record_path source from
    a rows variable, and the objective involves counting entities that meet a condition,
    first discover all candidate entities and store them in that rows variable, then
    separately compute the count of those that satisfy the condition, so that the
    rows variable is never empty and the required refs are always satisfied.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more comprehensive rule that explicitly forbids
    defaulting to an unsupported outcome without attempting to ground required refs.
  id: r009
  reasoning: The PlanIR's discovery step joined store_inventory with a filter on available_today_quantity
    >= 2, so if no products met the threshold the rows variable was empty. The required
    refs source '$rows[*].record_path' then yielded no refs, causing the interpreter
    to flag 'unresolved required ref(s)'. The root cause is that the plan did not
    separate discovery of all specified products from the count of those meeting the
    condition, violating the principle that required refs must be present even when
    the count is zero. The failing fragment is the single discovery step that both
    resolves SKUs and filters by availability.
  status: inactive
  surface: ir
