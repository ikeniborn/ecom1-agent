    (e.g., SELECT COUNT(*) FROM (SELECT p.sku FROM products p JOIN inventory i ON
    i.sku = p.sku AND i.store_id = ... WHERE i.available_today >= 4)). The actions
    list must never contain only the store lookup.
  created: '2026-05-21'
  deactivated_reason: null
  id: r009
  reasoning: r007 is subsumed by r008; r008 already requires including the inventory
    count query as a separate action and forbids listing only the store lookup. r007's
    specific mandate is a subset of r008's general rule, so r007 is redundant.
  source: learn
  status: active
