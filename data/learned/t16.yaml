entries:
- content: 'For multi-product availability count tasks (''how many of these products
    have at least N items available in STORE today''): NEVER use SELECT COUNT as the
    final SQL — it returns no paths and grounding_refs will be empty. Instead: SELECT
    DISTINCT p.sku, p.path FROM products p JOIN inventory i ON p.sku=i.sku JOIN stores
    s ON i.store_id=s.id WHERE <brand+model filter> AND LOWER(s.city)=''<city>'' AND
    LOWER(s.name) LIKE ''%powertool%'' AND i.available_today>=N. Count the returned
    rows for the answer. ALL returned p.path values MUST be in grounding_refs. Also
    verify specific product properties (disc diameter, sealant_type, etc.) match claimed
    values — use LEFT JOIN product_properties in the candidate CTE or individual HAVING
    clauses.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r001
  reasoning: 'COUNT SQL returned no paths → grounding_refs empty → harness required
    product file path. Fix: SELECT DISTINCT sku,path to get actual paths for grounding_refs.'
  source: manual
  status: active
- content: 'CRITICAL for multi-product availability count: The SQL action MUST be a
    raw SELECT starting directly with SELECT — NEVER use WITH/CTE syntax, NEVER wrap
    in /bin/sql. CORRECT pattern: SELECT DISTINCT p.sku, p.path FROM products p JOIN
    inventory i ON p.sku = i.sku JOIN stores s ON i.store_id = s.id WHERE LOWER(s.name)
    LIKE ''%storename%'' AND s.is_open=1 AND i.available_today >= N AND ((p.brand=''Brand1''
    AND LOWER(p.model) LIKE ''%model1%'') OR (p.brand=''Brand2'' AND LOWER(p.model)
    LIKE ''%model2%'') OR ...). Count returned rows for answer. ALL p.path values
    from SQL result → grounding_refs.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r002
  reasoning: 'Multi-product SQL kept failing with CTE/wrapper. Correct approach verified
    in t14 (passing): plain SELECT with OR conditions on brand+model LIKE patterns,
    no CTE, no wrapper.'
  source: manual
  status: active
