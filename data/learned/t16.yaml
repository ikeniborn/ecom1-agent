- agents_md_anchor: '#important-things > availability'
  content: When discovery resolves a unique entity (e.g. a store_id/record_path),
    bind that resolved identifier into the subsequent ops query and join on it directly,
    instead of re-deriving the same entity inside the ops SQL with an independent
    filter plus LIMIT 1; independent re-resolution can pick a different row than discovery
    did (or none), so downstream inventory/property joins evaluate against the wrong
    store and silently drop required matches.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/paints_finishes/wood_stain_oil/fam_paints_finishes_wood_stain_oil_0002_2kprzgwf/PNT-IMO3A7AZ.json''".
    Only the p4 (Wood Stain and Deck Oil) available variant is missing — 5 of 6 lines
    resolved fine, so the failure is store-scoped, not a per-line family/property
    text bug. Root cause: the Python discovery loop resolves store_path by scanning
    rows for the first name containing ''central'', but the ops SQL re-resolves the
    store independently via fragment `WITH st AS (SELECT store_id, record_path FROM
    stores WHERE city = %s AND lower(store_name) LIKE ''%%central%%'' LIMIT 1)`. The
    discovery-chosen store_id is never threaded into ops; the LIMIT 1 in ops can select
    a different ''central'' store (different table/order tiebreak) than discovery''s
    first match. The inventory INNER JOIN (`si.store_id = st.store_id`) then evaluates
    against the wrong store, so PNT-IMO3A7AZ''s qty>=min_qty row is absent and its
    record_path never enters refs. r003 covers not hard-filtering on the ''central''
    literal on the discovery side, and r002 covers not collapsing paths via group_concat
    (already applied — script returns one row per record), but neither covers threading
    the discovery-resolved entity id into ops; this new rule closes that gap by requiring
    the bound store_id from discovery to drive the ops join rather than an independent
    re-resolution.'
  status: active
