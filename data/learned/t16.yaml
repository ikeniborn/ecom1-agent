- agents_md_anchor: '#important-things > reference'
  content: When the answer must cite every matching record path, design the query
    to return one row per record and build refs by iterating all CSV data rows — do
    not aggregate paths with SQL group_concat into a single delimited cell, since
    re-splitting that cell is fragile and can drop or mangle required references.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/paints_finishes/wall_paint/fam_paints_finishes_wall_paint_0002_33m7fvug/PNT-JAXH8ES6.json''"
    — the available wall-paint variant (spec p4: Sikkens White gloss) never reached
    refs. Root cause: ops query collapses all matched record_paths into one scalar
    cell via group_concat(record_path, ''|''), then script re-splits that single CSV
    cell on ''|'' (paths_str.split(''|'')). This couples ref emission to a fragile
    in-cell delimiter; any per-variant path lost in aggregation/parse never appears
    in refs even though the variant is genuinely available. Failing fragment: "(SELECT
    group_concat(record_path, ''|'') FROM matched) AS paths" plus "paths = [p.strip()
    for p in paths_str.split(''|'') ...]". Rule linkage: complements r001 (which forbids
    splitting stdout rows on ''|'') by addressing query SHAPE — emit one matched row
    per record so refs come from iterating real CSV data rows, not from unpacking
    a group_concat blob. r001 stays active: it governs row/CSV parsing broadly; this
    rule governs query design for multi-ref answers.'
  status: active
- agents_md_anchor: null
  content: When the task describes an entity with a qualitative descriptor (central,
    main, flagship) that may not appear verbatim in the data, do not hard-filter on
    that literal substring (e.g. store_name LIKE '%central%'); resolve the entity
    from discovery rows instead — if a city/scope yields exactly one match, select
    it directly rather than requiring a word match that silently returns zero rows.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'ERROR verbatim: "answer_refs: template/constraints require runtime refs
    ([''$store_path'', ''$available_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows". Root cause: discovery returned
    single store ''PowerTool Bratislava Stare Mesto'' (no word ''central''), but both
    the discovery loop (`if "central" in name.lower()`) and ops CTE `st AS (... WHERE
    city=%s AND lower(store_name) LIKE ''%%central%%'' LIMIT 1)` filter on literal
    ''central''. No store_name contains it → st CTE empty → inner JOIN yields zero
    rows → pid/record_path empty → refs []. store_path also stayed None. Failing fragment:
    the `LIKE ''%central%''` predicate and matching name.lower() check. Linkage: codegen
    translated task''s qualitative term ''central'' into a literal text filter; correct
    technique is to resolve the lone city match from discovery, not constrain on an
    assumed substring. Distinct from r001 (CSV parsing) and r002 (per-row refs).'
  status: active
- agents_md_anchor: null
  content: Always emit every RPC declared in the tool_plan unconditionally; never
    add a conditional early-return that issues an Answer and skips a planned Exec
    when an intermediate (e.g. discovery) result is empty — let the planned query
    run and return zero rows instead, so the executed RPC multiset matches the plan.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''fidelity: AssertionError: fidelity drift (RPC multiset)
    expected: [Answer, Exec, Exec] got: [Answer, Exec]''. The plan issues two Execs
    (discovery store-resolve + ops count) then one Answer. Root cause: the failing
    fragment `if not store: vm.answer(message="0 products", ...); return` short-circuits
    after the discovery Exec when no store row resolves, so the second (ops) Exec
    is never dispatched — producing one Exec instead of two and dropping the multiset
    to [Answer, Exec]. The CODEGEN technique fault is inserting a guarded early-exit
    that bypasses a planned RPC; the script must translate each tool_plan op into
    an unconditional call. Linkage: distinct from r001 (CSV parsing), r002 (per-row
    refs), and the in-session entity-resolution rule — none constrain unconditional
    RPC emission / multiset fidelity.'
  status: active
