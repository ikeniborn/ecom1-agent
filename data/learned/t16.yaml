entries:
- agents_md_anchor: '#important-tools > sql'
  content: 'Always parse /bin/sql stdout as comma-delimited CSV with a header row:
    drop the first line, split data rows on '','', and map columns positionally —
    never split on ''|'' and never gate row selection on a column being numeric (isdigit),
    since IDs and paths are non-numeric strings.'
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$store_path'', ''$paths'']) but actual refs [] contain only static template
    entries []". OBSERVED_RPC_OUTPUTS show /bin/sql emits CSV: header line ''store_id,store_name,record_path''
    then ''store_graz_jakomini,PowerTool Graz Jakomini,/proc/...json'', and ''count,paths''
    then ''1,/proc/catalog/...AUT-ZMWEKFUZ.json''. Root cause: SCRIPT_CODE parses
    with `cols = line.split("|")` and gates row capture on `cols[0].strip().isdigit()`.
    Output is comma-delimited not pipe-delimited, so split(''|'') yields one column
    = whole line; and store_id ''store_graz_jakomini'' / count line ''1,/proc/...''
    fail isdigit (count line has comma+path appended). Failing fragments: `cols =
    line.split("|")` ... `if len(cols) >= 3 and cols[0].strip().isdigit()` and `cols
    = line.split("|", 1)` ... `if first.isdigit()`. Both store_path and paths_val
    stay empty → refs []. Rule linkage: corrective technique is to parse SQL output
    as CSV with header skip and positional columns, removing the pipe-delimiter and
    numeric-id assumptions.'
  status: active
