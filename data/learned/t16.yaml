- agents_md_anchor: null
  content: Always include discovery and rowsets steps to produce the rows variable
    referenced in the required refs for the target outcome, and never default to an
    unsupported outcome without first attempting to ground those refs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: The PlanIR was empty (no discovery, no rowsets, no compute) and immediately
    returned an unsupported answer. The required refs for OUTCOME_OK include a record_path
    from '$rows[*].record_path', but no rows variable was produced, causing the grader
    to report a missing reference. Existing rules r008, r009, r010 already address
    parts of this, but the plan still failed to attempt grounding. A stronger, combined
    rule is needed.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the answer shape expects a numeric count derived from existence checks,
    always structure the PlanIR query to return a single row with a numeric value
    (e.g., using COUNT aggregation or a fallback SELECT 0) so that the compute step
    always produces a number, even when no items match.
  created: '2026-06-22'
  deactivated_reason: null
  id: r012
  reasoning: 'Error: verify regex_match failed because answer was not ''qty=<digits>''.
    Observed RPC output was just ''qty'', indicating the SQL returned no rows. The
    PlanIR used UNION ALL of EXISTS subqueries; when no product matched, the result
    set was empty, causing the ''first'' row to be null and the final answer to lack
    a digit. Root cause: the query did not guarantee a numeric output for the count.
    The rule ensures future PlanIRs always produce a number by using aggregation or
    a fallback row.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When the success_criteria includes a regex_match on $answer, always set
    the answer section values to plain strings (the formatted message) rather than
    objects, so that $answer is a string and regex_match can succeed.
  created: '2026-06-22'
  deactivated_reason: null
  id: r013
  reasoning: 'Error: verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''regex_match'',
    ''lhs'': ''$answer'', ''rhs'': ''^qty=\d+$'', ''args'': []}. Root cause: The PlanIR
    answer section defined the answer as an object {"message":"qty={count}","outcome":"OUTCOME_OK","refs":[]},
    causing the interpreter to set $answer to that object instead of the message string.
    The regex_match op then failed because it received a non-string. The query correctly
    returned qty=0, so the message would have been ''qty=0'', which matches the regex.
    The failing PlanIR fragment is the answer section mapping ''ok'' to an object
    instead of a plain string.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use an object for the answer section when the success_criteria includes
    a regex_match on $answer; always set the answer section to a plain string (e.g.,
    'qty={count}') so that $answer is a string and regex_match can succeed.
  created: '2026-06-22'
  deactivated_reason: null
  id: r014
  reasoning: 'verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''regex_match'',
    ''lhs'': ''$answer'', ''rhs'': ''^qty=\d+$'', ''args'': []}. Root cause: The PlanIR
    answer section for the OK outcome was an object with message/outcome/refs instead
    of a plain string, causing $answer to be an object and regex_match to fail. Failing
    fragment: "answer":{"ok":{"message":"qty={count}","outcome":"OUTCOME_OK","refs":[]}}.
    Existing rule [in-session] warned about this but was not applied; this new rule
    reinforces with a Never directive.'
  status: active
  surface: ir
