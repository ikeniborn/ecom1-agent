entries:
- content: Always after executing action 'list:/proc/stores/', read the identified
    store file with a 'cat' action to retrieve inventory data, as required by spec_goal
    'Determine how many of the 6 specified products have at least 2 available_today
    in the central Linz hardware store'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r001
  reasoning: 'Verbatim error: ''Unable to determine count: inventory data not retrieved
    from Linz store file.'' Root cause category: wrong-action — the plan specified
    listing stores and querying inventory, but the actual action sequence only listed
    /proc/stores/ without subsequently reading the identified store file to obtain
    inventory data. Failing fragment: action ''list:/proc/stores/'' and spec_goal
    ''Determine how many of the 6 specified products have at least 2 available_today
    in the central Linz hardware store''. Rule linkage: the new rule ensures that
    after listing, the store file is read to retrieve inventory, directly addressing
    the missing step.'
  source: learn
  status: inactive
- content: Never execute the action 'list:/proc/stores/' if the central Linz store
    file path is already known from a prior listing; instead, directly read that store
    file with a 'cat' action to retrieve inventory data, as required by spec_goal
    'Determine how many of the six specified products have at least 2 available_today
    in the central Linz hardware store'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r002
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: list:/proc/stores/''. Root cause category: semantic (wrong-action).
    Failing fragment: the action ''list:/proc/stores/'' in both SDD_OUTPUT and PLAN_OUTPUT
    is repeated from a prior cycle. Rule linkage: the new rule must prevent repeating
    the same action identifier ''list:/proc/stores/'' when the store file path is
    already known.'
  source: learn
  status: inactive
- content: Never execute the action 'list:/proc/stores/' if the central Linz store
    file path is already known from a prior listing; if not known, first list to identify
    it. Then read the identified store file with a 'cat' action to retrieve inventory
    data, as required by spec_goal 'Determine how many of the 6 specified products
    have at least 2 available_today in the central Linz hardware store'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r003, r004, r005'
  id: r003
  reasoning: 'Merged r002 (highest id) extended to cover the listing case from r001.
    Both rules overlapped: they both ultimately require a cat on the store file. r002
    optimized by skipping list when path is known, but did not specify the initial
    list when path is unknown. Merged rule now covers both scenarios, making r001
    and r002 redundant.'
  source: learn
  status: inactive
- content: Always first list all store names from the stores table (e.g., 'SELECT
    name FROM stores') before applying a LIKE filter for 'Linz' to identify the central
    Linz store, as required by spec_goal 'Determine how many of the 6 specified products
    have at least 2 available_today in the central Linz hardware store'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r003, r004, r005'
  id: r004
  reasoning: 'Verbatim error: ''Empty result: '' (exact). Root cause: wrong-filter
    — the SQL query with LIKE ''%Linz%'' returned no rows, possibly because the store
    name does not contain ''Linz'' or the pattern is incorrect. Failing fragment:
    the action ''/bin/sql "SELECT id, name FROM stores WHERE name LIKE ''%Linz%'';"''
    and the spec_goal phrase ''central Linz hardware store''. Rule linkage: new rule
    will require a preliminary listing of all store names before applying a pattern
    to avoid empty results.'
  source: learn
  status: inactive
- content: Always first list all store names from the stores table (e.g., 'SELECT
    name FROM stores') before applying a LIKE filter for a specific branch name (e.g.,
    'Salzburg PowerTool'), to ensure the correct store name pattern is used, as required
    by spec_goal 'Determine how many of the 6 specified products have at least 4 available_today
    in the central Salzburg PowerTool store'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r003, r004, r005'
  id: r005
  reasoning: 'Verbatim error: ''Empty result: id,name''. Root cause category: empty-result.
    Failing fragment citation: the action ''SELECT id, name FROM stores WHERE name
    LIKE ''%Salzburg%PowerTool%'';'' and the spec_goal phrase ''central Salzburg PowerTool
    store''. Rule linkage: the new rule will require first listing all store names
    before applying a specific LIKE filter, directly addressing the empty-result root
    cause by ensuring the correct store name pattern is used.'
  source: learn
  status: inactive
- content: Never use file-based actions like 'list:/proc/stores/' to retrieve inventory
    data; instead, always use SQL queries. Always first list all store names from
    the stores table (e.g., 'SELECT name FROM stores') before applying a LIKE filter
    for a specific branch name, to ensure the correct store name pattern is used,
    as required by spec_goals like determining product availability in a specific
    store.
  created: '2026-05-21'
  deactivated_reason: null
  id: r006
  reasoning: r003 and r004 contradict on method (file-based vs SQL) for the same goal.
    r004 and r005 overlap in prescribing listing store names before LIKE filtering.
    Merged rule takes r005 (highest id) as base and extends it to negate file-based
    actions and generalize to any branch name.
  source: learn
  status: active
- content: 'Always include the inventory counting query (the second action from the
    SDD: SELECT COUNT(*) FROM (SELECT p.sku FROM products p JOIN inventory i ON i.sku
    = p.sku AND i.store_id = ...)) as a separate action in the plan decomposition
    when the spec_goal requires counting how many of a list of products have at least
    a given availability in a specific store. The plan must not list only the store
    lookup; it must also list the final count query.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r007'
  id: r007
  reasoning: 'Verbatim error: ''ANSWER clarification: Unable to determine count; inventory
    data not queried.'' Root cause category: wrong-action. The plan output''s action
    list contained only the store lookup (''SELECT id, name FROM stores WHERE name
    LIKE ''%Salzburg%'' AND name LIKE ''%PowerTool%'' LIMIT 1''), omitting the inventory
    counting query that was present in the SDD actions list. The failing fragment
    is the plan_action step: it did not include the second SQL query that joins inventory
    with products and property filters. The new rule mandates that the plan decomposition
    must include the counting query as an action, referencing the spec_goal of counting
    product availability in a store.'
  source: learn
  status: inactive
- content: Always include all distinct SQL queries required by the spec_goal as separate
    actions in the SDD actions list. When the spec_goal is to 'determine count of
    specified products that have at least 4 available in central Salzburg PowerTool
    branch', the actions list must contain at least the store lookup query (e.g.,
    SELECT id, name FROM stores WHERE ...) and the final inventory counting query
    (e.g., SELECT COUNT(*) FROM (SELECT p.sku FROM products p JOIN inventory i ON
    i.sku = p.sku AND i.store_id = ... WHERE i.available_today >= 4)). The actions
    list must never contain only the store lookup.
  created: '2026-05-21'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: ''Repeated action detected — must use a different query or approach.
    Action was: SELECT id, name FROM stores WHERE name LIKE ''%Salzburg%PowerTool%''''.
    Root cause: wrong-spec — the SDD actions list contained only one action (the store
    lookup), but the spec_goal requires multiple distinct queries (store lookup, product
    SKU retrieval, inventory checks). The plan decomposition described multiple steps
    but failed to translate them into distinct executable actions, causing the system
    to reuse the same action and trigger the repetition check. The failing fragment
    is the ''actions'' field in SDD_OUTPUT: [''SELECT id, name FROM stores WHERE name
    LIKE ''%Salzburg%PowerTool%'''']. The existing rule r007 (plan decomposition must
    include inventory counting query) was not followed; similarly, r006 (list all
    stores first) was not followed. A new rule is needed to enforce that the SDD actions
    list itself must contain all distinct queries required by the spec_goal, not just
    the first step.'
  source: learn
  status: active
- content: Always include all distinct SQL queries required by the spec_goal as separate
    actions in the SDD actions list. When the spec_goal is to 'determine count of
    specified products that have at least 4 available in central Salzburg PowerTool
    branch', the actions list must contain at least the store lookup query (e.g.,
