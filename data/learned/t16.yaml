  id: r001
  reasoning: The PlanIR attempted to read '/proc/instruction' which was not found,
    causing a real_vm read failure. The PlanIR should not assume a hardcoded path
    for the instruction text; instead, it should rely on the pre-phase to provide
    the necessary data via parameters or a guaranteed location.
  status: inactive
