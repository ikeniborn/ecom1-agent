entries:
- agents_md_anchor: null
  content: Always include all required refs in the answer block's refs array, mapping
    each ref to a computed variable that holds the exact value (scalar or array) expected
    by the ref pattern. When a ref requires a field from a record, extract that field
    into a dedicated variable and map the ref to it.
  created: '2026-06-21'
  deactivated_reason: The rule 'Always include all required refs... mapping each ref
    to a computed variable that holds the exact value... When a ref requires a field
    from a record, extract that field into a dedicated variable' incorrectly advised
    pre-extracting fields for list ref patterns, leading to this type error. The new
    rule supersedes it for list patterns.
  id: r001
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$counted_products[*].record_path''] on OK answer. The PlanIR''s answer block
    has an empty refs array, but the IntentSpec requires those refs for OUTCOME_OK.
    The compute section stores the full store JSON object and the counted_products
    JSON array, but does not extract the record_path fields into dedicated variables,
    nor does it map the required refs to any values. The plan must compute the exact
    scalar record_path from store and an array of record_paths from counted_products,
    then include them in the answer refs.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not pass a second argument to dedupe; it accepts only a sequence. To
    deduplicate by a specific field, first extract that field into a list using column
    or map, then dedupe that list.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''interpret: compute step ''dedupe'' failed: <lambda>() takes
    1 positional argument but 2 were given. CONTRACT: dedupe(seq)''. Root cause: PlanIR
    compute step ''dedupe'' was called with two arguments ([''$eligible_rows'',''criteria_index''])
    but the primitive expects only a sequence. Failing fragment: {"prim":"dedupe","args":["$eligible_rows","criteria_index"],"into":"$unique_criteria"}.
    The intent was to deduplicate eligible rows by criteria_index, but dedupe cannot
    accept a key. The correct pattern is to first project the criteria_index column
    into a separate list, then dedupe that list. This rule prevents future misuse
    of dedupe with extra arguments.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When a compute step needs to bind a rowset to a variable without transformation,
    always provide two list arguments to concat: the rowset and an empty rowset (obtained
    from a discovery step that returns no rows). Never call concat with a single argument.'
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: interpret: compute step ''concat'' failed: <lambda>() missing
    1 required positional argument: ''b''. Root cause: The PlanIR compute step used
    concat with only one argument (the matching_skus_rows rowset) to assign it to
    counted_products. The concat primitive requires exactly two list[dict] arguments.
    The failing fragment: {"prim":"concat","args":["$matching_skus_rows"],"into":"counted_products"}.
    The rule ensures future PLAN phases always supply a second argument (an empty
    rowset) when using concat for identity binding, preventing this interpreter error.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required ref pattern includes `[*].field`, do not pre-extract the
    field into a separate list. Instead, keep the list of records (e.g., the rowset)
    in a variable and map that variable directly to the ref. The interpreter will
    extract the field automatically.
  created: '2026-06-21'
  deactivated_reason: These rules advised using base variables in answer refs, which
    caused unresolved required refs. Superseded by new rule requiring exact required
    ref strings.
  id: r004
  reasoning: 'The error ''real_vm: bad argument type for built-in operation'' occurred
    because the answer block mapped the ref for ''$counted_products[*].record_path''
    to ''$counted_products_record_paths'', a pre-extracted list of strings. The interpreter
    attempted to access the ''record_path'' attribute on each string element, causing
    a type error. The required pattern expects a list of records, not a flat list
    of field values. The fix is to keep the matching rows as a variable (e.g., ''$counted_products'')
    and map that to the ref, letting the interpreter extract the field.'
  status: inactive
  surface: ir
