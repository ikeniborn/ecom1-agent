- agents_md_anchor: '#plan-phase'
  content: Always provide exactly two list-of-dict arguments to concat, each derived
    from a rowset or a previous compute step that outputs a list of rows. Never call
    concat with empty args. If you need to aggregate multiple row sources, first discover
    and parse each source into a rowset, then concatenate them.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: The plan's compute step 'concat' was called with empty args, violating
    the contract that concat requires two list-of-dict arguments. The plan lacked
    discovery steps to fetch product data and rowsets to parse them, so no row lists
    were available. The rule ensures concat is always supplied with two row lists
    derived from prior discovery and parsing steps.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use dotted field extraction paths like '$store.record_path' or '$matched_products[*].record_path'
    in the answer refs list. Instead, use the base rowset variable name (e.g., '$store',
    '$matched_products'). The interpreter will extract the required field automatically.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: The interpret error 'unresolved required ref(s) ['$store.record_path',
    '$matched_products[*].record_path']' shows that the interpreter cannot resolve
    dotted paths as refs. The answer step should provide the base rowset variable
    names, not pre-extracted field paths. Existing rule r006 correctly advises using
    base variables, but r007 conflicts by insisting on exact required ref strings.
    The script followed r007 and failed. Therefore, deactivate r007 and reinforce
    the correct approach.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use stdin to deliver SQL queries to the sql tool; pass the SQL as
    a command-line argument (e.g., as the first positional argument) or write it to
    a temp file and execute that file.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. The PlanIR used Exec with stdin field for SQL, but the sql tool did not
    receive the query via stdin, likely because it expects SQL as a command-line argument.
    Root cause: incorrect delivery method for SQL input. Failing PlanIR fragment:
    Exec step with path ''/bin/sql'' and stdin containing the SQL query. No existing
    rule covers this.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include the exact required ref strings from the IntentSpec in the
    answer step's refs list, including any dotted field paths or wildcards. Do not
    substitute base variable names when the required ref specifies a field extraction.
  created: '2026-06-22'
  deactivated_reason: These rules incorrectly required exact dotted ref strings in
    the answer refs list, conflicting with the interpreter's expected behavior and
    causing unresolved ref errors.
  id: r011
  reasoning: The interpret error 'unresolved required ref(s) ['$store.record_path',
    '$matched_products[*].record_path']' occurred because the answer refs list contained
    '$store' and '$matched_products' instead of the exact required ref strings. The
    interpreter expects the refs to match the required refs exactly, including dotted
    paths. Existing rule r006 incorrectly advised using base variable names, which
    directly caused this failure. The new rule reinforces r007 and explicitly forbids
    the substitution that r006 allowed.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When required refs in the IntentSpec contain dotted field extractions (e.g.,
    '$store.record_path' or '$matched_products[*].record_path'), include only the
    base rowset variable (e.g., '$store' or '$matched_products') in the answer refs
    list. The interpreter will extract the required field automatically.
  created: '2026-06-22'
  deactivated_reason: 'Conflicting guidance: required refs must be included exactly
    as specified, not as base variables. The interpreter does not automatically extract
    dotted fields from base variables; the answer refs list must match the required
    ref strings.'
  id: r012
  reasoning: The error 'unresolved required ref(s) ['$store.record_path', '$matched_products[*].record_path']'
    occurred because the answer step used the exact dotted paths from the IntentSpec.
    The interpreter cannot resolve these dotted refs; it expects the base rowset variable
    names. Existing rule r007 incorrectly mandates using the exact required ref strings,
    which caused the failure. The new rule corrects this by instructing to use base
    rowset variables, aligning with r006 and the in-session rule.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include the exact required ref strings from the IntentSpec in the
    answer step's refs list, including any dotted field paths or wildcards. Do not
    substitute base variable names when the required ref specifies a field extraction.
  created: '2026-06-22'
  deactivated_reason: These rules incorrectly required exact dotted ref strings in
    the answer refs list, conflicting with the interpreter's expected behavior and
    causing unresolved ref errors.
  id: r013
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$matched_products[*].record_path''] on OK answer. The PlanIR answer refs list
    contained [''$store'', ''$matched_products''] instead of the exact required ref
    strings. Existing rules r005 and r006 (and an in-session rule) incorrectly advised
    using base variables, causing the interpreter to reject the answer. The correct
    behavior is to include the exact required ref strings as specified in the IntentSpec.'
  status: inactive
  surface: ir
