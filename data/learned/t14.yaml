  content: When a discovery query may return zero rows and the answer requires refs
    from that query, always guard the extraction of required refs with a nonempty
    check and provide a fallback value (e.g., empty string) before the answer refs
    are evaluated.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r032
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$product1.record_path'', ...] on OK answer. Root cause: The PlanIR''s compute
    steps assume the query result rowset is non-empty, but if the store or any product
    lookup returns no rows, the rowset is empty, causing the ''get'' from index 0
    to fail and the ref variables to remain unset, leading to unresolved refs. Failing
    fragment: compute steps that directly ''get'' from ''$query_result.0'' without
    checking emptiness. Rule linkage: new rule to guard against empty rowsets.'
  status: inactive
  surface: ir
