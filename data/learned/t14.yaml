- agents_md_anchor: null
  content: When the answer_template declares a runtime ref token (a value starting
    with $, e.g. $store_path), the discovery SELECT must project the column backing
    that ref and the script must bind that column's parsed value into refs; never
    hardcode refs=[] or drop a template-required runtime ref.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$store_path'']) but actual refs [] contain only static template entries []".
    Root cause: answer_template.refs = [''$store_path''] is a runtime ref, but (a)
    the store discovery SELECT projected only store_id, store_name — no path column
    backing $store_path, and (b) failing fragment `refs = []  # $store_path has no
    resolvable value ... keep only static refs (none)` hardcoded an empty refs list,
    silently discarding the required runtime ref. Store query also returned 0 data
    rows (header only), so even a parse attempt would have found nothing. Both faults
    trace to CODEGEN not honoring the runtime-ref contract: it must add the backing
    column to the SELECT and bind the parsed row value, instead of emitting refs=[].
    Rule links the answer_template ref-token contract to the discovery SELECT projection
    and refs population technique.'
  status: active
- agents_md_anchor: '#important-things > availability'
  content: When a discovery query that backs a required runtime ref (a $-token in
    answer_template.refs) returns zero rows, do not call vm.answer with the empty/default
    value; guard for the empty result and emit the failure outcome instead of producing
    a placeholder answer with missing refs.
  created: '2026-06-06'
  deactivated_reason: r002's prescription to guard-and-vm.answer on empty discovery
    before the remaining planned ops directly produced the RPC-multiset drift. The
    new rule subsumes r002's intent (do not emit a placeholder OK answer with missing
    refs) while requiring all planned Exec RPCs to run first, with the failure-outcome
    choice deferred to final outcome/refs selection.
  id: r002
  reasoning: 'Verbatim error: "template/constraints require runtime refs ([''$store_path''])
    but actual refs [] contain only static template entries []". Root cause: the store
    discovery SELECT (city=''Innsbruck'' AND is_open=1 AND store_name LIKE ''%entral%'')
    returned <empty> — no central open store resolved — so store_path stayed None
    and refs=[]; the script still proceeded to vm.answer(message=''Total: 0'', refs=[]).
    Failing fragment: `store_path=None ... refs=[]; if store_path: refs.append(store_path);
    vm.answer(... refs=refs)` — no guard on the empty store rowset. Distinct from
    existing in-session rule (which mandates projecting+binding the ref column): here
    the column WAS projected (path) but the rowset was empty, so the new technique
    covers the empty-resolution guard before answering rather than the projection
    itself. No prior rule superseded.'
  status: inactive
- agents_md_anchor: '#important-tools > sql'
  content: Always pass a /bin/sql query to vm.exec through the stdin parameter exactly
    as declared in tool_plan.discovery[].args.stdin, never relocate it into an args/argv
    list; /bin/sql reads its query from stdin, so a query placed in args runs with
    empty input, yields empty stdout that misparses to a false-empty result, and triggers
    an early-bail branch that skips later planned discovery RPCs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer, Exec, Exec] got: [Answer, Exec]''. Root cause: tool_plan.discovery[0].args
    declares the query via `stdin`, but the script invoked it as `store = vm.exec(path="/bin/sql",
    args=[store_sql])` — query passed in args, not stdin. /bin/sql got no stdin input,
    returned empty stdout. Failing fragment: the store-parse loop over `store_out.splitlines()`
    therefore extracted no store_id, store_id stayed None, and the guard `if not store_id:
    vm.answer(... OUTCOME_NONE_CLARIFICATION); return` fired — bailing before the
    second planned Exec. Result: only one Exec ran, dropping an Exec from the RPC
    multiset and failing the fidelity reference trace which expects both discovery
    Execs plus Answer. The same mis-invocation appears on the result_sql call. This
    is distinct from the existing ref-binding/empty-guard rules — those address refs
    projection and placeholder answers, not the stdin-vs-args invocation channel that
    caused the empty output and skipped RPC.'
  status: active
