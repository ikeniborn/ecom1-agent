- agents_md_anchor: null
  content: When a discovery SQL query returns a single row and the answer requires
    refs extracted from that row, always use rowsets format 'json' and have the SQL
    query output a JSON object (e.g., via json_object()) with the exact keys needed
    for subsequent 'get' steps, rather than relying on auto_delim and column name
    mapping.
  created: '2026-06-22'
  deactivated_reason: null
  id: r034
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$product1.record_path'', ...] on OK answer. The PlanIR used a single SQL query
    returning one row, parsed with auto_delim, then get steps to extract refs. The
    likely root cause is that auto_delim produced a rowset with column names that
    did not match the expected keys (e.g., positional names like col0), causing the
    get steps to return null, which the interpreter treats as unresolved. The fix
    is to use format ''json'' and have the SQL output a JSON object with the exact
    keys, guaranteeing correct extraction.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Never pass more than two arguments to the ''get'' primitive in compute
    steps. When extracting a column value from a specific row of a rowset, always
    use two sequential ''get'' steps: first get the row by index (e.g., get($rowset,
    0)), then get the column from that row (e.g., get($row, ''column_name'')).'
  created: '2026-06-24'
  deactivated_reason: null
  id: r035
  reasoning: 'Error: ''interpret: compute step ''get'' failed: <lambda>() takes 2
    positional arguments but 3 were given''. Root cause: PlanIR compute steps such
    as {"prim":"get","args":["$store_rows","0","store_id"]} pass three arguments to
    ''get'', but the primitive expects exactly two (obj, key). The correct pattern
    is two sequential ''get'' calls: first to retrieve the row by index, then to retrieve
    the column from that row. This is a PlanIR shape bug, not a data issue. No existing
    rule covers this misuse of ''get''.'
  status: active
  surface: ir
