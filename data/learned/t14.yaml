- agents_md_anchor: null
  content: 'Always provide two arguments to the ''get'' primitive: the rowset variable
    and the field name as a string. Do not pass a dotted path as a single argument.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r021
  reasoning: 'Error: interpret: compute step ''get'' failed: <lambda>() missing 1
    required positional argument: ''key'' CONTRACT: get(obj, key). Root cause: compute
    step used ''get'' with a single argument ''$first_row.store_record_path'' instead
    of two arguments ''$first_row'' and ''store_record_path''. Failing PlanIR fragment:
    {"prim":"get","args":["$first_row.store_record_path"],"into":"store"}. This rule
    ensures correct argument count for ''get''.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use a Read RPC to fetch the instruction text; the pre-phase already
    provides it as a literal. Use the instruction literal directly in compute steps.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r022
  reasoning: 'real_vm: read failed: not found. The PlanIR attempted to Read ''/proc/instruction.json'',
    which does not exist. The pre-phase provides the instruction text as a literal;
    the PlanIR should not hardcode a file read for it. The failing PlanIR fragment:
