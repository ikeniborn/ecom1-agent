- agents_md_anchor: '#important-things > references'
  content: When a spec qualifies through multiple distinguishing properties, build
    the refs/projection query so it re-derives qualifying variants using the EXACT
    same per-property predicates as the COUNT query (each property matched as its
    own EXISTS on product_variant_properties with the correct typed column — property_value_text
    vs property_value_number — and the same resolved store_id), then bind and append
    every projected variant record_path to refs; any divergence (relaxed predicate,
    wrong typed column, OR instead of AND, or a different store binding) between the
    qualification test and the projection silently drops a qualifying variant and
    the grader rejects the answer for the missing product reference.
  created: '2026-06-06'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/Helios/PNT-OYI3I497.json''".
    Root cause: the qualifying Helios variant counted by op1 was not surfaced into
    refs by op2''s projection. The Helios spec is the case requiring TWO conjoined
    text properties (product_type AND color_family); the refs/projection query must
    re-derive each spec''s qualifying variants under identical predicates and the
    same store_id as the COUNT query, otherwise the exact contributing variant path
    is dropped from refs even though the count is correct. Failing fragment: matched_sql
    Helios branch + the matched_paths collection loop appending r[1] (record_path)
    — the projected row for PNT-OYI3I497 never reached refs, so refs=[store_path]+matched_paths
    omitted the required path. Linkage: extends r004 (which mandates a per-variant
    projection exists) with a parity requirement — the projection''s predicates/typed-columns/store
    binding must match the qualification test so no qualifying variant is lost; recurrence
    of v002 shows structural projection alone is insufficient without predicate parity.'
  status: active
- agents_md_anchor: '#important-tools > sql'
  content: When parsing /bin/sql stdout, split each output line on the delimiter the
    tool actually emits (comma-separated CSV with a leading header row), not on '|';
    splitting on the wrong delimiter collapses the whole row into parts[0], so the
    header-skip check, store_id extraction, and the ref/path column parse all fail
    and yield a false-empty result that drops every runtime ref.
  created: '2026-06-06'
  deactivated_reason: null
  id: r007
  reasoning: 'Verbatim ERROR: "answer_refs: template/constraints require runtime refs
    ([''$store_path'']) but actual refs [] contain only static template entries []
    — SQL likely returned no rows or row parsing dropped the path column". OBSERVED_RPC_OUTPUTS
    show /bin/sql emits CSV — header line ''store_id,store_name,city'' uses commas.
    Failing fragment: parsing loops use `parts = [p.strip() for p in raw.split("|")]`
    for both the discovery row and the result rows. Root cause: /bin/sql is comma-delimited
    but the script splits on ''|'', so every column lands in parts[0]; the `parts[0].lower()
    != "store_id"` header guard and the 4-column result parse never match, store_id
    stays None and rows[] stays empty, so refs[] is empty and the grader rejects the
    missing $store_path runtime ref. This is a delimiter-parsing technique distinct
    from r001 (which covers projecting/binding the ref column) — even a correctly
    projected path column would be dropped by the wrong split. No existing rule addresses
    /bin/sql output delimiter parsing.'
  status: active
