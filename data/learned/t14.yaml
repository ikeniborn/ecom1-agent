- agents_md_anchor: null
  content: When the plan includes a discovery RPC that enumerates the actual property_key
    vocabulary (or value column types) for the target families, parse that discovery
    output and reconcile every property predicate in the ops/match query against it
    before issuing the query — map each plan-supplied property name to an existing
    discovered key and select the value column the data actually uses (property_value_text
    vs property_value_number); transcribing the plan's hardcoded property keys/columns
    verbatim when the discovery probe reveals a different key or a numeric-vs-text
    column mismatch makes every EXISTS predicate fail, so the whole match query returns
    zero rows and refs end up empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r008
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$available_paths'']) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column; check
    `:name` bindings on /bin/sql and the SELECT columns". Root cause: the ops match
    CTE returned ZERO rows (observed final RPC output = header `pnum,record_path`
    only), so avail is empty, paths=[], refs empty. The script transcribed the plan''s
    per-property EXISTS predicates verbatim while ignoring its own discovery probe
    (prop_keys), which returned the real vocabulary: the actual key is `lumen`, NOT
    the plan''s hardcoded `luminous_flux_lm`, and numeric properties (voltage_v, wattage_w,
    disc_diameter_mm) live in property_value_number, not the text column the predicates
    compared. Failing fragment: `EXISTS (... x.property_key = ''luminous_flux_lm''
    AND x.property_value_text = :p4_luminous_flux_lm)` plus numeric `property_value_text
    = ''18''/''125''/''10''` — each fails, matched CTE empties, `SELECT pnum, record_path
    FROM avail` yields header-only, parse_rows produces no data rows, refs=[]. Rule
    linkage: r006 enforces predicate/typed-column consistency BETWEEN the count and
    projection queries but assumes both already use a correct existing key; r001/r004
    assume the match query returns rows. None cover validating the predicates themselves
    against the discovery vocabulary probe before issuing, so this is a new, complementary
    CODEGEN technique — not a superset of r006.'
  status: active
- agents_md_anchor: '#important-things > availability'
  content: When qualifying variants by property_value_text equality to task-supplied
    literal values, normalize both sides (LOWER()/TRIM()) or first probe the distinct
    stored property_value_text per (family, property_key) and map each task literal
    to the actual stored token — never transcribe the task's literal casing/format
    into a raw text-equality predicate, because case-, whitespace-, or format-different
    text fails exact equality, silently drops the EXISTS, and collapses the whole
    match (and thus refs) to zero rows.
  created: '2026-06-06'
  deactivated_reason: null
  id: r009
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$available_paths'']) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column". OBSERVED
    final ops query returned header-only (''pnum,record_path'' with no data rows).
    Upstream links all verified working: store resolved (store_vienna_praterstern
    via record_path LIKE ''%praterstern%'' since real store_name is ''PowerTool Vienna
    Praterstern''); family names matched (prop_keys discovery returned a non-empty
    key list for the IN(...) families); property KEYS and value-COLUMN types reconciled
    — script emits typed OR predicates e.g. (x.property_value_text=''18'' OR x.property_value_number=18);
    stdout parse is correct (header skipped, no data rows → qty=0, refs=[]). The only
    unverified link is exact property_value_text equality to the task literals on
    text-only keys (tool_type=''pruning saw'', product_type=''metal paint'', color_family=''White'',
    battery_platform=''18v-system'', kit_contents=''case'', size=''M''), where the
    predicate is raw equality with no numeric fallback. Failing fragment: prop_predicate''s
    text_pred = ''x.property_value_text = '' + q(val), substituting the literal verbatim;
    any case/whitespace/format divergence from the stored token makes every such EXISTS
    false, so matched→avail yields zero rows and refs empties. Rule linkage: extends
    [in-session]/r006 (which reconcile KEYS and value COLUMNS / predicate parity)
    to the still-uncovered dimension of VALUE casing/format reconciliation.'
  status: active
- agents_md_anchor: '#important-things > references'
  content: When a discovery RPC enumerates the actual property_key vocabulary, validate
    every plan-supplied property_key against the parsed discovered set before building
    its EXISTS predicate; for any plan key absent from the vocabulary, substitute
    the closest discovered key by normalized token/substring overlap, and only if
    no candidate exists relax that single predicate so the variant still qualifies
    on family name plus its remaining valid distinguishing properties — never emit
    a verbatim EXISTS on a key the discovery never returned, because a dead predicate
    can never match and silently zeroes that product's UNION ALL branch, dropping
    its record_path from refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r010
  reasoning: 'Verbatim error: ''template/constraints require runtime refs ([$available_paths])
    but actual refs [] contain only static template entries [] — SQL likely returned
    no rows''. The final result query returned only the header line `pnum,record_path`
    with zero data rows. Root cause: the prop_keys discovery returned the real property_key
    vocabulary (base_type, battery_platform, color_family, ..., lumen, ..., power_w,
    ..., wattage_w, ...), which does NOT contain `luminous_flux_lm` — the actual luminous-flux
    key is `lumen`. The script transcribed the plan''s product-4 predicate verbatim
    via exists_clause(''luminous_flux_lm'', params[''p4_luminous_flux_lm'']), emitting
    `LOWER(TRIM(x.property_key)) = ''luminous_flux_lm''`, a dead EXISTS that can never
    match, which drops the Philips LED bulb''s UNION ALL branch and its record_path.
    Failing fragment: the line4 spec entry (''luminous_flux_lm'', params[''p4_luminous_flux_lm''])
    fed into the EXISTS builder despite the discovery output proving the key is absent.
    Linkage: the existing in-session reconcile rule warns to map plan keys to discovered
    keys but is silent on the fallback when a key is absent from a flat merged vocabulary
    that lacks family attribution; this rule adds the concrete detect→substitute→relax
    technique so an unknown key never zeroes a product branch and never drops its
    required catalog reference.'
  status: active
- agents_md_anchor: null
  content: When resolving an entity (store, city, brand, etc.) through a task-supplied
    text filter in the discovery/resolution query — whether an equality match (column
    = literal) or a LIKE substring pattern — make the comparison case- and whitespace-insensitive
    by wrapping BOTH the column and the literal/pattern in LOWER()/TRIM() (e.g. LOWER(TRIM(store_name))
    LIKE LOWER(TRIM(:pattern)) and LOWER(TRIM(city)) = LOWER(TRIM(:city))), not only
    the variant property_value_text predicates; transcribing the task's literal casing
    into a raw column = literal or column LIKE pattern silently returns zero resolution
    rows whenever the stored value differs in case/whitespace, and that empty resolution
    CTE then CROSS JOINs away every downstream matched variant, collapsing the whole
    result set and emptying refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r011
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$store_path'', ''$qualifying_record_paths'']) but actual refs [] contain only
    static template entries [] — SQL likely returned no rows or row parsing dropped
    the path column; check `:name` bindings on /bin/sql and the SELECT columns". Root
    cause: the store discovery query `SELECT ... FROM stores WHERE city = ''Salzburg''
    AND store_name LIKE ''%central%''` returned ONLY the header line `store_id,record_path,store_name,is_open`
    with zero data rows — the query executed and emitted correct column headers (so
    transport via args worked and parsing was fine), meaning the WHERE predicate matched
    nothing. The failing fragment is the case-sensitive substring filter `store_name
    LIKE ''%central%''` (lowercase literal) which fails when the stored store_name
    uses different casing (e.g. ''PowerTool Salzburg Central''). With target_store
    empty, `matched m CROSS JOIN target_store ts` yields zero rows, so the ops query
    also returned header-only, store_path stayed None, qualifying_record_paths stayed
    empty, and refs collapsed to []. Linkage: the script already applies r009''s LOWER(TRIM())
    normalization to property_value_text predicates (text_eq helper) but does NOT
    normalize the store-resolution city equality or store_name LIKE pattern; this
    rule extends case-insensitive matching to the resolution/discovery filters that
    gate the entire CROSS JOIN, complementing r009 (variant property text) and r006/r004
    (per-product refs).'
  status: active
- agents_md_anchor: null
  content: When a task supplies a descriptive locator word (e.g., 'central', 'main',
    'downtown') to resolve an entity through a LIKE substring filter, do not transcribe
    that descriptor verbatim into the resolution query; first probe the candidate
    set scoped by the reliable key (e.g., SELECT store_name FROM stores WHERE city
    = :city) and map the descriptor to the actual stored token via synonym/translation/abbreviation,
    because a verbatim substring the data expresses with a different word returns
    zero resolution rows whose empty CTE then CROSS JOINs away every downstream matched
    row and empties refs — case/whitespace normalization alone cannot fix a semantic
    token mismatch.
  created: '2026-06-06'
  deactivated_reason: null
  id: r012
  reasoning: 'Verbatim ERROR: "answer_refs: template/constraints require runtime refs
    ([''$store_path'', ''$qualifying_record_paths'']) but actual refs [] contain only
    static template entries [] — SQL likely returned no rows or row parsing dropped
    the path column". Root cause: both /bin/sql RPCs returned header-only output (store
    query: ''store_id,record_path,store_name,is_open'' with no data rows; match query:
    header with no data rows). The script already applied LOWER(TRIM(...)) to city
    and store_name (per the in-session normalization rule), yet the store still failed
    to resolve — so this is NOT a case/whitespace problem. Failing fragment: `AND
    LOWER(TRIM(store_name)) LIKE LOWER(TRIM(''%central%''))` — the task''s descriptor
    ''central'' does not appear verbatim in the stored store_name (likely a synonym/German
    token e.g. ''Zentral''/''Mitte''/''Hauptbahnhof''). The empty target_store CTE
    CROSS JOINs away all matched variants, collapsing the whole result and emptying
    refs. Rule linkage: existing in-session rule and r009/r010 cover case/whitespace
    and property_value/property_key reconciliation, but none covers a task-supplied
    DESCRIPTIVE locator used as an entity-name LIKE substring that the stored data
    expresses with a different lexical token; the new rule adds the probe-and-map
    technique for descriptor synonyms in entity resolution.'
  status: active
