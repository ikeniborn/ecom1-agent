- agents_md_anchor: '#important-things > availability'
  content: When the answer counts or filters products and an agents_md availability
    constraint requires referencing the available products, project each matched variant's
    catalog path alongside the aggregate and append every contributing product path
    to refs; a COUNT-only discovery collapses the rows and drops the per-product catalog
    references the grader requires.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/Mellerud/CLN-3Q19VP4J.json''".
    Root cause: the result discovery returns only COUNT(*) AS total, so the SKUs/catalog
    paths of the matched-and-available variants never reach the script; the only ref
    captured is store_path (refs=[store_path]). Failing fragment: "SELECT COUNT(*)
    AS total FROM m JOIN store_inventory si ..." plus "refs=[]; if store_path: refs.append(store_path)"
    — no per-product path projected or appended. The agents_md availability constraint
    (#important-things > availability) demands the answer reference the available
    products; counting collapses those rows so the contributing Mellerud variant catalog
    file is absent from refs. Rule linkage: distinct from r001/r002/r003 (those cover
    $-token runtime refs from answer_template and stdin placement); this covers grader/agents_md-required
    per-product refs that the count aggregation discards.'
  status: active
- agents_md_anchor: null
  content: When tool_plan declares ops/RPCs after the discovery RPC, never let a discovery-result
    guard call vm.answer and return before the remaining planned Exec RPCs execute;
    the fidelity grader compares the full executed RPC multiset against the plan,
    so issue every planned Exec first and apply empty-result/missing-ref guards only
    when choosing the final outcome and refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''fidelity: AssertionError: fidelity drift (RPC multiset)
    expected: [Answer, Exec, Exec, Exec] got: [Answer, Exec]''. Plan declares 3 Exec
    RPCs (1 discovery + 2 ops: count_row, matched_rows) plus the Answer. Executed
    multiset shows only 1 Exec then Answer — the script ran the store discovery Exec,
    hit the empty/short-row guard, and bailed before the two op Execs. Failing fragment:
    `if not store_rows or len(store_rows[0]) < 4 or not store_rows[0][3]: vm.answer(message=...,
    outcome=''OUTCOME_NONE_UNSUPPORTED'', refs=[]); return`. This early-return (an
    over-eager application of r002) short-circuits the two planned op RPCs, dropping
    the RPC count from 4 to 2 and failing fidelity. Root cause: guard ordering — a
    failure guard must not gate whether planned RPCs run. r002 mandated the early
    failure-outcome bail; this new rule supersedes it by folding the missing-ref decision
    into post-RPC outcome selection so the full planned RPC multiset is always emitted.'
  status: active
