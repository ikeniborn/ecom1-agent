- agents_md_anchor: null
  content: Always ensure that every required ref in the answer step is resolvable
    by guaranteeing that the corresponding rowset extraction produces the necessary
    columns and at least one row (with nulls if needed) when the discovery may return
    zero results.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: The interpret phase reported unresolved required refs ['$store.record_path',
    '$matched_products[*].record_path']. The plan's answer step included these exact
    refs, but the rowset extraction likely produced empty rowsets or missing columns,
    making the refs unresolvable. The discovery SQL may have returned zero rows because
    the store or products were not found, or the output format caused column mapping
    failure. The plan needs a fallback to ensure required refs are always resolvable.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always ensure that rowsets bound to required refs contain at least one
    row with the necessary columns, even if the discovery query returns no results.
    Use a compute step to insert a default row with nulls if the rowset is empty,
    so that the ref is resolvable.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$matched_products[*].record_path''] on OK answer. Root cause: The PlanIR''s
    discovery steps may return empty rowsets (e.g., store query or product matching
    query returning zero rows), causing the interpreter to fail to resolve the required
    refs even though the answer step includes the exact ref strings. The failing PlanIR
    fragment is the rowsets ''store'' and ''matched_products'' that lack a guarantee
    of at least one row. Existing rule r011/r013 correctly require exact ref strings,
    but the PlanIR did not ensure the rowsets are non-empty. This new rule addresses
    the emptiness problem.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using Exec with /bin/sql, embed all variable data directly into the
    SQL query string in the stdin field; do not pass extra named arguments to Exec
    beyond 'path' and 'stdin'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'The error ''interpret: tool validation: arg ''store_name'' not accepted
    by Exec (accepts: args, path, stdin)'' occurred because the plan passed ''store_name''
    as a separate argument to Exec. Exec only accepts ''path'' and ''stdin'' (and
    optionally ''args'' for subprocess arguments). The store name should have been
    embedded directly in the SQL string, e.g., ''WHERE store_name = ''''Graz Lend
    hardware shop'''''', rather than passed as a named parameter. The script code
    shows the SQL already contains the literal, but the extra argument caused the
    validation failure.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the dedupe primitive, pass only a single sequence argument (a
    list of values). To deduplicate a rowset by a column, first extract that column
    into a list using a compute step (e.g., 'project' or 'extract_column') and then
    apply dedupe to that list.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r017
  reasoning: 'Error: ''interpret: compute step ''dedupe'' failed: <lambda>() takes
    1 positional argument but 2 were given CONTRACT: dedupe(seq)''. The PlanIR compute
    step {"prim":"dedupe","args":["$matched_products","product_family_id"],"into":"$unique_specs"}
    passed two arguments (a rowset and a column name) to dedupe, which expects a single
    sequence. The root cause is misuse of the dedupe primitive: it cannot accept a
    rowset and column name directly. The fix is to first extract the product_family_id
    column into a list, then dedupe that list.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include the exact required ref strings from the IntentSpec in the
    answer step's refs list, including any dotted field paths or wildcards. Do not
    substitute base variable names when the required ref specifies a field extraction.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r018
  reasoning: 'The error ''interpret: unresolved required ref(s) [''$store.record_path'',
    ''$matched_products[*].record_path'']'' occurred because the answer step''s refs
    list contained only ''$store'' and ''$matched_products'', not the exact dotted
    paths required by the IntentSpec. The rowsets did contain the necessary columns,
    so the failure was purely due to incorrect ref strings. Existing rules r011 and
    r013 already state this, but the script violated them. r012 contradicts this by
    advising to use base variable names only. The new rule reinforces the correct
    behavior and supersedes r011, r012, r013.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required ref in the IntentSpec contains a dotted field extraction
    (e.g., '$store.record_path' or '$matched_products[*].record_path'), include only
    the base rowset variable (e.g., '$store' or '$matched_products') in the answer
    refs list. The interpreter will automatically extract the required field from
    the rowset. Do not include the dotted path in the refs list.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r019
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$matched_products[*].record_path''] on OK answer. The PlanIR answer step used
    the exact dotted ref strings from the IntentSpec, but the interpreter could not
    resolve them. The root cause is that the interpreter expects base rowset variables
    in the answer refs list, not dotted field extractions. Existing rule r012 correctly
    states this, but conflicting rules r011 and r013 instructed the opposite. The
    script followed the conflicting rules, causing the failure. The corrective rule
    reinforces r012 and supersedes r011/r013.'
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-answer-refs'
  content: Always include the exact required ref strings from the IntentSpec in the
    answer step's refs list, including any dotted field paths or wildcards. Do not
    substitute base variable names when the required ref specifies a field extraction.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r020
  reasoning: 'The interpret phase failed with ''unresolved required ref(s) ["$store.record_path",
    "$matched_products[*].record_path"]''. The PlanIR answer step provided refs ["$store",
    "$matched_products"], but the IntentSpec required the dotted paths. The interpreter
    could not resolve the required refs because the answer refs list omitted the field
    extractions. The rowsets themselves contained the necessary columns (record_path),
    so the failure is purely a PlanIR shape bug: the answer step must list the exact
    required ref strings from the IntentSpec.'
  status: inactive
  surface: ir
