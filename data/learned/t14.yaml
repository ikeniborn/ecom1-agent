- agents_md_anchor: '#plan-answer-refs'
  content: Always include all required refs from the IntentSpec in the answer step's
    refs list, mapping each required ref to the variable that holds the corresponding
    record_path or rowset. Never leave the refs list empty when the IntentSpec specifies
    required refs.
  created: '2026-06-22'
  deactivated_reason: These rules incorrectly suggest using base variables instead
    of exact required ref strings, causing unresolved ref errors.
  id: r005
  reasoning: The interpret error 'unresolved required ref(s) [\'$store.record_path\',
    \'$matched_products[*].record_path\'] on OK answer' occurred because the PlanIR
    answer step had an empty refs list, despite the IntentSpec requiring those refs.
    The compute steps correctly bound $store and $matched_products, but the answer
    step did not include them. The root cause is a missing mapping from required refs
    to bound variables in the answer step.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When required refs specify a source pattern with a field extraction (e.g.,
    '$store.record_path' or '$matched_products[*].record_path'), include the base
    variable (e.g., '$store' or '$matched_products') in the answer refs, not a pre-extracted
    field variable. The interpreter will extract the field automatically.
  created: '2026-06-22'
  deactivated_reason: These rules incorrectly suggest using base variables instead
    of exact required ref strings, causing unresolved ref errors.
  id: r006
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$matched_products[*].record_path''] on OK answer. Root cause: The answer refs
    list contained pre-extracted field variable ''$store_record_path'' and renamed
    rowset ''$matched_rows'' instead of the base variables ''$store'' and ''$matched_products''
    that the interpreter expects to resolve the required ref patterns. The PlanIR
    should have bound the store record to ''$store'' and the product rowset to ''$matched_products'',
    then included those in answer refs.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include the exact required ref strings from the IntentSpec in the
    answer step's refs list, not just the base variable. For example, if required
    ref is '$store.record_path', include '$store.record_path' in refs, not '$store'.
    For '$matched_products[*].record_path', include '$matched_products[*].record_path'.
  created: '2026-06-22'
  deactivated_reason: r007 instructs to include the exact required ref strings with
    dotted paths, which leads to unresolved ref errors. The correct approach is to
    use base rowset variable names.
  id: r007
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$matched_products[*].record_path''] on OK answer. Root cause: answer step refs
    list contained base variables ''$store'' and ''$matched_products'' instead of
    the exact required ref strings. The interpreter expects the refs to match the
    required ref strings exactly, then resolves the field from the rowset. Existing
    rules r004 and in-session rule incorrectly advised using base variables. Failing
    PlanIR fragment: answer step ''refs'':[''$store'',''$matched_products''].'
  status: inactive
  surface: ir
