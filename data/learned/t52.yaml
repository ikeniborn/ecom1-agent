  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'real_vm: read failed: is a directory. The PlanIR used Find to discover
    a receipt file, but the Read step attempted to read a directory. The Find RPC
    likely returned a directory entry (possibly the root itself) instead of a file,
    and the PlanIR did not check the entry''s type before using its path. The corrective
    rule ensures that any path passed to Read is verified as a file, preventing this
    class of error.'
  status: inactive
  surface: ir
- agents_md_anchor: null
