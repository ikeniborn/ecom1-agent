- agents_md_anchor: null
  content: 'When extracting structured data from a receipt file, do not use a single
    complex SQL query to parse and join; instead, separate the steps: first read the
    file content, then parse it into a list of items using compute primitives, then
    query the database for current prices, and finally compute totals using the ''sum''
    primitive.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: The plan attempted to parse the receipt and join with product_variants
    in one SQL query, which likely failed to correctly extract sku, quantity, and
    unit_price_cents from the unstructured file, leading to an incorrect total and
    the wrong outcome. A stepwise approach with dedicated parsing and separate database
    query is more robust.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a file path must be discovered from a directory listing, do not place
    the Read RPC in the discovery section; instead, list the directory in discovery,
    compute the file path, and then perform the Read in the compute section.
  created: '2026-06-22'
  deactivated_reason: null
  id: r013
  reasoning: 'The error ''real_vm: read failed: is a directory'' occurred because
    the Read RPC in the discovery section attempted to read a path that was not yet
    resolved, likely defaulting to the directory /uploads. The receipt path was computed
    later in the compute section, but discovery RPCs execute first. The Read RPC must
    be moved to the compute section after the path is determined.'
  status: active
  surface: ir
- agents_md_anchor: '#discovery'
  content: When listing a directory to find a file, always filter the list to include
    only entries where type == 'file' before selecting a path to Read.
  created: '2026-06-22'
  deactivated_reason: null
  id: r014
  reasoning: 'The error ''real_vm: read failed: is a directory'' occurred because
    the PlanIR attempted to Read a path that was a directory, not a file. The List
    RPC returned a list of entries from /uploads, and the script used the first entry''s
    path without checking its type. The existing rule (in-session) only addressed
    moving Read to compute, but did not ensure the path is a file. Therefore, a new
    rule is needed to always filter directory listings to include only files before
    selecting a path to Read.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using Find to locate a file, always verify that the returned entry's
    type is 'file' before using its path in a Read RPC; if the type is not 'file',
    fall back to listing the parent directory and filtering for files manually.
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: 'real_vm: read failed: is a directory. The PlanIR used Find to discover
    a receipt file, but the Read step attempted to read a directory. The Find RPC
    likely returned a directory entry (possibly the root itself) instead of a file,
    and the PlanIR did not check the entry''s type before using its path. The corrective
    rule ensures that any path passed to Read is verified as a file, preventing this
    class of error.'
  status: active
  surface: ir
