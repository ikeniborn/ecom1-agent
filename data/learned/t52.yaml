- agents_md_anchor: null
  content: Always structure each PlanIR step as an object with an 'rpc' field for
    Exec RPC calls, and use a 'then' field to chain primitives; never use 'rowsets'
    or 'compute' as top-level step types.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The PlanIR validation failed with 38 errors because the discovery steps
    used invalid top-level keys 'rowsets' and 'compute' instead of the required 'rpc'
    field. The schema expects every step to have an 'rpc' field (for Exec RPC) and
    optionally a 'then' list of primitives; 'rowsets' and 'compute' are not permitted
    as step types. This rule corrects the PlanIR shape for all future cycles.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a Read RPC's path argument depends on a previous discovery step, always
    place the Read step after the compute that extracts the path, or use a 'then'
    chain to sequence the extraction and the Read. Never use a variable in an RPC
    argument that is not yet bound by a preceding compute step.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: real_vm: read failed: invalid path: path must be absolute: "discover
    the receipt file from /uploads/ directory listing". Root cause: The PlanIR placed
    the Read RPC in the discovery array before the compute step that sets receipt_file_path
    from the Find output. The variable $receipt_file_path was unbound at Read time,
    causing the interpreter to substitute the literal param description. The rule
    ensures dependent RPCs are sequenced after the compute that binds their arguments.'
  status: inactive
  surface: ir
