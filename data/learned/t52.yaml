- agents_md_anchor: null
  content: Always use the 'sum' primitive to sum a list of scalar numbers; use 'sum_col'
    only when you have a list of dicts and need to sum a specific column.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'The error ''sum_col() missing 1 required positional argument: ''col''''
    occurred because the plan applied sum_col to a list of scalars (old_price_cents_list)
    extracted via ''column'' primitive. sum_col expects a list of dicts and a column
    name. The correct primitive for summing a list of numbers is ''sum''.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always provide exactly two arguments to filter_rows: the rows list and
    a predicate expression; never pass a column name and a value list as separate
    arguments.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Error: ''interpret: compute step ''filter_rows'' failed: _filter_rows()
    takes 2 positional arguments but 3 were given. CONTRACT: filter_rows(rows, pred):
    first arg must be list[dict] rows''. The failing PlanIR compute step was: {"prim":"filter_rows","args":["$all_products","product_sku","$unique_skus"],"into":"filtered_products"}.
    The step passed three arguments (rows, column name, list of values) instead of
    the required two (rows, predicate). Root cause: incorrect understanding of filter_rows
    signature. No existing rule covers this specific argument count error.'
  status: inactive
  surface: ir
