- agents_md_anchor: null
  content: When a downstream RPC's path argument is derived from a prior discovery
    RPC that returned empty (e.g. a List yielding no entries), do not synthesize a
    hardcoded literal filename and feed it to a Read/Exec; wrap such best-effort RPC
    calls in error handling so a 'not found' failure is caught and the remaining planned
    RPC chain still runs, because an unhandled VM exec error aborts the whole script
    before any answer is produced.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: not found''. Observed RPC
    output: List {''path'':''/uploads''} returned <empty>. Root cause: discovery List
    returned no entries, so the receipt-resolution loop found nothing; the fallback
    chain hit its last branch and fabricated receipt_path = uploads_dir + ''/receipt.txt''.
    Failing fragment: ''if receipt_path is None: receipt_path = uploads_dir.rstrip("/")
    + "/receipt.txt"'' followed by ''receipt = vm.read(path=receipt_path, number=True)''.
    That guessed literal does not exist, so vm.read raised an unguarded VM exec error
    that aborted the script before vm.answer. Rule linkage: r004 already says continue
    the planned chain instead of short-circuiting with an early error answer, but
    it assumes a real best-effort candidate exists; this case adds that when the List
    is empty there is no real candidate, and synthesizing one then calling Read unguarded
    crashes the run — so best-effort RPCs built on empty discovery must be wrapped
    so a not-found does not abort. Distinct from r001 (callable-attribute filtering)
    and r003 (stdin payload).'
  status: active
