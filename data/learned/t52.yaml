- agents_md_anchor: null
  content: Never apply list-based primitives (first, get, filter, etc.) directly to
    an Exec RPC output; always use the 'rows' primitive first to convert it to a list
    of dicts.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Error: ''interpret: compute step ''first'' failed: ''ExecResponse''
    object is not subscriptable''. The PlanIR discovery step bound an Exec RPC result
    to ''receipt_analysis'', then compute used ''first'' on it. Exec RPC returns an
    ExecResponse object, not a list, so ''first'' fails. The correct pattern is to
    chain ''rows'' to convert the output into a list of dicts before applying list
    primitives. Existing rule r005 advises using ''rows'' for conversion but does
    not explicitly forbid direct use of list primitives on Exec outputs.'
  status: inactive
  surface: ir
