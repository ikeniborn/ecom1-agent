- agents_md_anchor: null
  content: When extracting list or collection fields from RPC result objects by probing
    candidate attribute names with getattr (e.g. items, entries, files, keys), reject
    any value that is callable or not a list/tuple before returning it, because names
    like 'items'/'keys' resolve to bound builtin methods that are truthy but non-iterable
    as data.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: `TypeError: ''builtin_function_or_method'' object is
    not iterable` at run() line 39 — the `for e in entries_of(uploads):` loop. Root
    cause: `entries_of()` does `getattr(r, a, None)` over (''entries'',''items'',''files'',''children'')
    and returns the first truthy hit. When the RPC List result is a dict or object
    exposing a `.items` bound method, `getattr(r,''items'',None)` yields that method
    object — truthy, so it is returned, then iterated → not-iterable crash. Failing
    fragment: the candidate-attribute accessor in entries_of (and the same flaw exists
    in as_text). Rule linkage: CODEGEN must guard attribute-probing extractors to
    accept only list/tuple data and skip callables, so method-name collisions can''t
    masquerade as collection data.'
  status: active
- agents_md_anchor: null
  content: When a path for a downstream Read/Stat comes from a prior discovery RPC
    (directory list or search), guard that the resolved path is non-null and refers
    to a file before calling Read/Stat; if the listing yields no usable file entry,
    abort early with an error answer instead of falling through and passing None or
    the directory path itself, since reading a directory or a None path fails the
    run.
  created: '2026-06-06'
  deactivated_reason: 'r002 instructs early abort with an error answer when a discovery
    listing yields no clean file entry; that exact behavior skipped the planned Stat/Read/Exec
    RPCs and caused the RPC-multiset fidelity drift. The new rule supersedes it: guard
    but continue the full planned RPC chain with a best-effort candidate instead of
    bailing.'
  id: r002
  reasoning: 'Verbatim error: ''real_vm_exec: read failed: is a directory''. OBSERVED_RPC_OUTPUTS
    show list /uploads returned empty and the next stat was called with path None.
    Root cause: discovery loop over _entries(uploads) never set receipt_path (empty/unmatched
    entries), the `if receipt_path is None and entries:` fallback also no-op''d on
    empty entries, so receipt_path stayed None and flowed unchecked into vm.stat(path=None)
    then vm.read(path=None), which the harness resolved to the directory and rejected
    with ''is a directory''. Failing fragment: receipt_stat=vm.stat(path=receipt_path);
    receipt=vm.read(path=receipt_path) with no validation that receipt_path resolved
    to a file. Rule linkage: existing in-session rule covers callable rejection during
    field extraction but not null/directory path guarding before chained Read/Stat
    — distinct CODEGEN technique.'
  status: inactive
