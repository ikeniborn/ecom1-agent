- agents_md_anchor: null
  content: When filtering a list of dicts by a field value in a compute step, do not
    pass the field name, operator, and value as separate arguments to filter_rows;
    instead, use the 'where' primitive with a condition object (op, lhs, rhs) to specify
    the filter condition.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r019
  reasoning: 'Error: ''filter_rows'' takes 2 positional arguments but 4 were given.
    Root cause: The compute step used filter_rows with four arguments (list, field,
    operator, value), but the primitive expects only two arguments: a list of dicts
    and a predicate function. The PlanIR fragment: {''prim'':''filter_rows'',''args'':[''$uploads_list'',''type'',''eq'',''file'']}.
    This violates the contract. The correct approach is to use the ''where'' primitive
    with a condition object, e.g., {''prim'':''where'',''args'':[''$uploads_list'',{''op'':''eq'',''lhs'':''type'',''rhs'':''file''}]}.
    Existing rule r014 correctly states the intent to filter for files, but does not
    specify the correct primitive; this new rule provides the correct implementation.'
