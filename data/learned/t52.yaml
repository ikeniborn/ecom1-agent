- agents_md_anchor: null
  content: Always ensure that all arguments to Exec RPCs are strings; never pass a
    list, dict, or other non-string value directly. If a variable contains complex
    data, serialize it to a JSON string using a compute step before passing it to
    Exec.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'Error: real_vm: bad argument type for built-in operation. The Exec RPC
    in discovery uses $receipt_data.items_json as an argument. receipt_data is produced
    by a custom_extract step that likely returns a dict or list, not a string. Passing
    a non-string reference to Exec causes a type error. Additionally, the Exec step
    appears before the custom_extract step in the execution order, so receipt_data
    may be undefined, but the error message points to a type mismatch rather than
    an undefined variable. The root cause is that the argument is not a string. The
    failing PlanIR fragment: {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"...","args":["--items_json","$receipt_data.items_json"]}}.
    The new rule ensures that Exec arguments are always strings, preventing type errors.'
  status: inactive
  surface: ir
