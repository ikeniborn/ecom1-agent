entries:
- agents_md_anchor: null
  content: 'Always pass two arguments to sum_col: the rows (list of dicts) and the
    column name. Do not first extract a column into a scalar list and then try to
    sum it.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: ''interpret: compute step ''sum_col'' failed: _sum_col() missing
    1 required positional argument: ''col''''. The PlanIR used sum_col with a single
    argument (a list of scalars from a prior column extraction) instead of the required
    two arguments (rows, col). The contract states sum_col(rows, col) expects list[dict]
    rows. The failing fragments: compute steps ''old_total_cents'' and ''new_total_cents''
    both called sum_col on extracted scalar lists. The fix is to call sum_col directly
    on the rowset with the column name.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always construct filter_rows predicates using the predicate builder (e.g.,
    Predicate(op='in_set', lhs='$row.product_sku', rhs='$receipt_skus')) rather than
    a plain dict.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The interpret error ''dict'' object has no attribute ''op'' indicates
    the filter_rows step received a plain dict for the predicate argument, but the
    interpreter expects a predicate object with an ''op'' attribute. The script used
    a dict: {"op":"in_set","lhs":"$row.product_sku","rhs":"$receipt_skus"}. The rule
    instructs to use the predicate builder to create a proper predicate object.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always use the 'rows' primitive to convert the output of an Exec RPC (SQL
    query) into a list of dicts before passing it to primitives that expect list[dict]
    (e.g., filter_rows, sum_col).
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: ''filter_rows'' expects list[dict]; use ''get'' for a single
    row. Root cause: PlanIR discovery step bound $all_products directly to Exec output
    of ''SELECT product_sku, price_cents FROM product_variants;'', which is likely
    a raw string (stdout) rather than a list of dicts. The compute step then tried
    filter_rows on that string, violating the primitive''s contract. Failing PlanIR
    fragment: discovery bind ''all_products'' from Exec, then compute filter_rows
    with first arg ''$all_products''. The PlanIR should have inserted a ''rows'' primitive
    to parse the Exec output into a list of dicts before using it in filter_rows.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required file path resolves to a directory, use a discovery step
    to list the directory contents and select the appropriate file before reading.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'real_vm: read failed: is a directory. The PlanIR discovery step Read
    used $receipt_file_path, which resolved to a directory (likely /uploads/). The
    plan lacked a step to list the directory and pick a file. The pre-phase should
    also deep-read /uploads/ to provide the exact file path.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use the concat primitive to build JSON strings; concat is only for
    concatenating two list[dict] rows. To convert any Exec RPC output (JSON object
    or table) into a list of dicts, always use the 'rows' primitive with the appropriate
    format directly on the output, and never manually wrap it in brackets.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The interpreter failed on the first concat step: ''concat'' received
    three string arguments (''['', ''$id_raw'', '']'') but expects exactly two list[dict]
    rows. The plan attempted to wrap the Exec /bin/id JSON object in brackets to create
    a JSON array string for the rowsets parser. This misuse of concat for string building
    is the root cause. The same pattern appears for tables_json and receipt_file_json.
    The existing rule about using ''rows'' for SQL outputs is too narrow; this new
    rule generalizes it to all Exec outputs and explicitly forbids concat-based JSON
    construction.'
  status: inactive
  surface: ir
