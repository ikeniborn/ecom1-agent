- agents_md_anchor: null
  content: Always verify that table and column names used in SQL queries exactly match
    those discovered in the pre-phase deep-read; if the pre-phase did not surface
    the schema, first execute a discovery query to list tables and their columns before
    constructing the main query.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more specific rule that also integrates pre-phase
    deep-read requests to prevent missing schema.
  id: r004
  reasoning: The cycle failed with grader outcome OUTCOME_NONE_CLARIFICATION, which
    is not defined in the plan's answer block. This indicates the plan execution likely
    aborted due to an RPC error (e.g., SQL syntax or missing table/column) before
    reaching the answer phase. The PlanIR used hardcoded table names like 'product_variants',
    'product_kinds', 'product_variant_properties' without confirming they exist in
    the actual database. If the real schema uses different names (singular vs plural,
    different casing), the SQL would fail, causing the system to default to a clarification
    outcome. The new rule enforces schema alignment with pre-phase discoveries, preventing
    such grounding failures.
  status: inactive
  surface: ir
