entries:
- content: Always search spec_goal model designators across p.series, p.model, AND
    p.name with OR LIKE conditions; never filter property values via HAVING on a nullable
    LEFT JOIN aggregate — use an INNER JOIN or a subquery WHERE on product_properties
    instead.
  created: '2026-05-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''Empty result: sku,path,brand,series,model,name,power_source,tool_type''.
    Root cause: wrong-filter — the action filters p.series LIKE ''%Silent TE 28G-O1A%''
    but the series name ''Silent TE 28G-O1A'' is a model-level designator that may
    live in p.model or p.name rather than p.series. Additionally, the HAVING clause
    filters on power_source=''corded'' after a LEFT JOIN — if the property key doesn''t
    exist the CASE returns NULL and HAVING drops the row, masking presence of the
    product entirely. Failing fragment: action ''SELECT p.sku ... WHERE p.brand =
    ''Einhell'' AND p.series LIKE ''%Silent TE 28G-O1A%'' ... HAVING power_source
    = ''corded'''' — series filter too narrow, HAVING on nullable aggregate silently
    drops rows. Rule must target both: broaden series/model/name search and use WHERE
    on property join instead of HAVING on nullable aggregate.'
  source: learn
  status: active
last_run:
  cycles_used: 2
