- agents_md_anchor: '#plan-phase-rowsets'
  content: Always define a rowset for any Exec RPC whose output will be used in compute
    steps, and reference the rowset variable instead of the raw RPC bind.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The compute step 'first' failed because $product_inventory was bound
    to the raw ExecResponse object, which is not subscriptable. The PlanIR omitted
    a rowset to parse the SQL stdout into a list of records. The fix is to add a rowset
    for the second RPC and use that rowset variable in the compute step.
  status: inactive
  surface: ir
