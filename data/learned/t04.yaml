- agents_md_anchor: null
  content: If the pre-phase deep-read does not include the schema of database tables
    referenced in SQL queries, the plan must first execute a discovery query to list
    all tables and their columns, and then use only those exact names in subsequent
    queries; alternatively, request the missing tables in the LEARN phase's prephase_deep_read.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: The plan produced OUTCOME_NONE_CLARIFICATION instead of the expected
    OUTCOME_OK or defined OUTCOME_NONE_UNSUPPORTED. This indicates the SQL query likely
    failed due to incorrect table or column names (e.g., 'product_variants', 'product_kinds',
    'product_variant_properties') that were not verified against the actual database
    schema. The pre-phase deep-read did not surface these tables, so the plan assumed
    names without discovery. Existing rule r004 already warns about this, but the
    plan did not apply it. The corrective rule reinforces the need for schema verification
    and ties it to pre-phase deep-read coverage.
  status: inactive
  surface: ir
