- agents_md_anchor: null
  content: When filtering product variants by property values, always first discover
    the actual stored values for the target property keys via a separate query, then
    use those exact values in the main join.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. The
    PlanIR''s SQL query used exact string matches for property values (''12 V'', ''12v-system'',
    ''two battery kit'') but returned no rows, indicating the stored values differ
    (e.g., ''12V'', ''12V System'', ''2 Battery Kit''). The root cause is that the
    PlanIR assumed the literal values from the intent match the database exactly.
    A corrective rule: add a pre-discovery step to query distinct property_value_text
    for the required property_keys, then use those retrieved values in the main query,
    ensuring the filter matches the actual stored data.'
  status: inactive
  surface: ir
