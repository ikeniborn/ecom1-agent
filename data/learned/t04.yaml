  content: Never flatten dot-separated ref names in PlanIR. When a required ref uses
    dot notation (e.g., $table.column), the plan must bind a variable with the exact
    same dot-separated name (e.g., $table.column) — do not replace the dot with an
    underscore. This applies to all compute steps and rowset bindings.
