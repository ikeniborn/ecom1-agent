entries:
- content: Never assume the brand or series field matches the task description exactly;
    instead, first query distinct brand values containing 'Tox' and distinct series
    values containing '1HZ-MZK' to discover actual values before applying the filtered
    join.
  created: '2026-05-21'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''Empty result: sku,name,series''. Root cause category:
    ''wrong-filter''. Failing fragment: the action ''SELECT p.sku, p.name, p.series
    FROM products p WHERE p.brand = ''Tox'' AND p.series LIKE ''%TOX 1HZ-MZK%'' LIMIT
    20'' returned zero rows. Rule linkage: The new rule addresses the overly strict
    brand and series filters that caused the empty result, by requiring discovery
    of actual values before filtering.'
  source: learn
  status: active
