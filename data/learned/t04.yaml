- agents_md_anchor: null
  content: When querying product variants by property values, always first discover
    the exact property key names used in the database (e.g., by querying the product_variant_properties
    table) and use those exact names in the query.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The plan used SQL with EXISTS subqueries referencing property keys 'anchor
    type', 'diameter', 'length' but the actual property keys in the database may differ
    (e.g., 'anchor_type', 'diameter_mm', 'length_mm'). The query returned no rows,
    causing the decision to fall through to the default branch and produce OUTCOME_NONE_UNSUPPORTED.
    The plan should have first discovered the exact property key names from the product_variant_properties
    table before constructing the query. This rule ensures that property key names
    are grounded in the actual schema.
  status: inactive
  surface: ir
- agents_md_anchor: '#plan-phase'
  content: When using filter_rows in a compute step, always express the predicate
    as a list with the operation as the first element (e.g., ['and', ['contains_any',
    '$row.property_key', ['cleaner']], ['eq', '$row.cleaner_type', 'interior cleaner']]),
    never as a dict with 'op' and 'args' keys.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'The interpreter failed on compute step ''filter_rows'' with error: ''dict''
    object has no attribute ''op''. The PlanIR passed a dict {''op'':''and'',''args'':[...]}
    as the predicate, but the interpreter expects a predicate object with an .op attribute,
    not a dict. The correct PlanIR format for predicates is a list where the first
    element is the operation string. The failing fragment: {"prim":"filter_rows","args":["$rows",{"op":"and","args":[{"op":"contains_any","lhs":"$row.property_key","rhs":["cleaner"]},{"op":"eq","lhs":"$row.cleaner_type","rhs":"interior
    cleaner"}]}],"into":"matching_rows"}. This rule ensures predicates are lists,
    preventing the dict attribute error.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using Exec RPC to run SQL queries, the bound variable is an ExecResponse
    object, not a list. To access the rows, first extract the 'rows' attribute using
    a compute step with 'get' (e.g., {"prim":"get","args":["$exec_result","rows"],"into":"rowset"})
    or define a rowsets step that maps the ExecResponse to a rowset. Only then apply
    operations like 'first' or 'filter' on the extracted row list.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: ''ExecResponse'' object is not subscriptable at compute step
    ''first''. Root cause: The PlanIR binds the Exec RPC output directly to ''found_product_list''
    and then attempts to call first() on it, but the Exec RPC returns an ExecResponse
    object (with attributes like ''rows'', ''columns'', etc.), not a list. The ''rowsets''
    field is empty, so no conversion occurs. The failing fragment: {"rpc":"Exec",...,"bind":"found_product_list"}
    followed by {"prim":"first","args":["$found_product_list"],...}. The rule corrects
    this by mandating an intermediate extraction step before list operations.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using Exec RPC to run SQL queries, the result rows are arrays (lists)
    of values, not objects with column names. To access a specific column value, use
    the column index (e.g., $rows.0.1 for the second column) or first define a rowsets
    step that maps the ExecResponse to a rowset with named columns using the 'columns'
    attribute of the ExecResponse.
  created: '2026-06-24'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: verify: I1: required ref source(s) [''$found_product.record_path'']
    did not resolve on OUTCOME_OK answer (resolve-before-cite). Root cause: The plan
    accesses $rows.0.record_path, but SQL result rows are arrays (lists) of values,
    not objects with column names. The observed RPC output shows the SQL returned
    one row, but the ref source fails because $rows.0 is a list, not an object with
    a ''record_path'' key. The failing PlanIR fragment is the ref source in the answer
    block: ''source'': ''$rows.0.record_path''. The correct approach is to use index
    access (e.g., $rows.0.1) or to map the ExecResponse to a rowset with named columns.
    This rule addresses a common PlanIR shape bug when handling SQL results.'
  status: active
  surface: ir
