  id: r009
  reasoning: 'r007 and r008 address the same spec_goal. r007 prohibits find with assumed
    file extensions and requires deriving exact files from list/tree output. r008
    (highest id) is a strict superset: it also prohibits generic keyword searches
    (*fraud*, hit), forbids ending the SDD with only list/tree, and explicitly mandates
    first listing /proc/payments/ before determining the exact hit identifier and
    files. r008 fully subsumes r007, making r007 redundant.'
  source: learn
  status: inactive
- content: Never assume a specific archived payment file path such as `/proc/payments/archive.json`
    in the SDD actions or plan when the spec_goal is to identify archived payment
    records for a confirmed fraud hit; always derive the exact file names from the
    output of `list:/proc/payments/` and `tree:/proc/payments/` before emitting any
    `read` or `grep` action, and allow the action list to contain only discovery actions
    when the exact filenames are not yet known.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r010'
  id: r010
  reasoning: 'The verbatim error is: ''Execute exception [''Inspect the discovered
    archived payment file to extract the]: read failed: not found''. The root cause
    is wrong-action: the SDD and plan assumed the concrete file path `/proc/payments/archive.json`
    without first confirming its existence through the output of `list:/proc/payments/`
    or `tree:/proc/payments/`, resulting in a read on a non-existent file. The failing
    fragment is the SDD action `/proc/payments/archive.json` and the plan action `/proc/payments/archive.json`
    under the spec_goal ''Identify all archived payment records belonging to the confirmed
    fraud hit''. The new rule directly addresses this by prohibiting assumed file
    paths like `/proc/payments/archive.json` and requiring that any `read` or `grep`
    action be grounded in observed directory listing output.'
  source: learn
  status: inactive
- content: Never leave the PLAN `action` field empty when the `steps` or SDD `actions`
    prescribe a discovery cycle such as `list:/proc/payments/` and `tree:/proc/payments/`
    to locate archive filenames; always populate PLAN `action` with the exact discovery
    command(s) drawn from the corresponding SDD `actions`.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r011'
  id: r011
  reasoning: 'Verbatim error: ''PLAN phase: action is empty''. Root cause category:
    wrong-action. Failing fragment citation: PLAN_OUTPUT.action = '''' while PLAN_OUTPUT.steps[0]
    states ''Use list and tree on /proc/payments/ to discover the exact names of archive
    and payment files'' and SDD_OUTPUT.actions already specifies ''list:/proc/payments/''
    and ''tree:/proc/payments/''. The planner produced a description of the discovery
    work but omitted the concrete action string, leaving the field empty. Rule linkage:
    the new rule mandates that the PLAN action must carry the exact discovery commands
    instead of being left blank.'
  source: learn
  status: inactive
