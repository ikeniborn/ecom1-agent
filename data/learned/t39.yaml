- agents_md_anchor: null
  content: Always include discovery steps that bind every variable referenced in the
    answer message and required refs for the expected outcome; never emit a plan that
    leaves a required ref unbound.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The plan's OK branch required $identified_payments.0.record_path but
    the plan had no RPCs to query archived payments or bind $identified_payments.
    The only discovery steps were identity and security doc reads, leaving the required
    ref unresolved. The plan must include steps to produce all data needed for the
    answer.
  status: inactive
  surface: ir
