- agents_md_anchor: null
  content: When a Search RPC returns a match whose path is a directory, do not Read
    it directly; instead, use List RPC on that path to discover the actual file, then
    Read the file.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'The plan used Search to find ''fraud'' in /docs, bound the first match''s
    path to $fraud_doc_path, then Read that path. The real_vm error ''read failed:
    is a directory'' shows the path resolved to a directory, not a file. The plan
    lacked a step to handle directory results, causing the Read to fail and the cycle
    to abort. The rule instructs future plans to check the type or list directory
    contents before reading.'
  status: active
  surface: ir
