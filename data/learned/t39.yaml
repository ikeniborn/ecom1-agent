entries:
- content: Never execute `search:fraud /proc/payments/` when the spec_goal references
    a specific confirmed fraud hit without first exploring the `/proc/payments/` directory
    structure and file naming conventions to determine the exact hit identifier or
    correct search term.
  created: '2026-05-23'
  deactivated_reason: r001 only required exploration before searching for 'fraud',
    which the current SDD technically satisfied by including 'list:/proc/payments/'
    before the 'find:*fraud*' action. The updated rule supersedes r001 by prohibiting
    the 'fraud' filename search entirely unless the directory listing explicitly supports
    it, and mandates deriving the exact identifier from observed contents.
  id: r001
  reasoning: 'Verbatim error: ''Empty result''. Root cause category: wrong-action.
    The failing fragment is the PLAN_OUTPUT action `search:fraud /proc/payments/`
    and the SDD_OUTPUT plan step ''Search for fraud-related keywords across all payment
    files to find the known fraud hit'', which assumed the literal keyword ''fraud''
    would be present in the archived payment records. The new rule directly prohibits
    this generic search action when the task references a specific confirmed fraud
    hit.'
  source: learn
  status: inactive
- content: Never execute `find:*fraud* /proc/payments/` when the spec_goal is to identify
    archived payment records for a confirmed fraud hit; after listing `/proc/payments/`,
    determine the exact hit identifier or correct search term from the observed file
    naming conventions and file contents rather than defaulting to the keyword 'fraud'.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r002'
  id: r002
  reasoning: 'Verbatim error: ''Empty result''. Root cause category: wrong-filter.
    The failing fragment is the PLAN_OUTPUT action ''find:*fraud* /proc/payments/''
    and the SDD plan step ''Use filename search for any files with ''fraud'' in the
    name to see if the hit identifier appears in filenames.'' The spec_goal is ''Identify
    the specific archived payment records that belong to the confirmed fraud hit and
    cite each one by its absolute path.'' The directory was listed first, yet the
    agent defaulted to searching filenames for ''*fraud*'', which yielded nothing
    because the hit identifier is not present in filenames. The new rule directly
    prohibits that exact action and mandates deriving the correct identifier from
    the directory listing or file contents.'
  source: learn
  status: inactive
- content: Never conclude the SDD action list with only `list:/proc/payments/` and
    `tree:/proc/payments/` when the spec_goal is to identify archived payment records
    for a confirmed fraud hit; always append a concrete content inspection action
    such as `read` or `grep` on observed payment files to extract the exact fraud
    hit identifier.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r003, r004'
  id: r003
  reasoning: 'Verbatim error: ''PLAN phase: action is empty''. Root cause: wrong-spec.
    Failing fragment: SDD_OUTPUT plan step 2 ''From the observed naming patterns and
    directory structure, determine the exact fraud hit identifier or correct content
    search term'' and the associated actions ["list:/proc/payments/", "tree:/proc/payments/"];
    this left the PLAN phase with no executable candidate after directory discovery
    because the identifier deduction step is not a concrete tool action, forcing an
    empty action string. Rule linkage: The new rule mandates that the SDD action list
    must not end after only directory listing and must instead include a concrete
    content inspection action to extract the fraud hit identifier.'
  source: learn
  status: inactive
- content: When the spec_goal is to identify archived payment records for a confirmed
    fraud hit, never execute `find:*fraud* /proc/payments/` and never conclude the
    SDD action list with only `list:/proc/payments/` and `tree:/proc/payments/`. After
    listing `/proc/payments/`, determine the exact hit identifier or correct search
    term from the observed file naming conventions and file contents rather than defaulting
    to the keyword 'fraud', and always append a concrete content inspection action
    such as `read` or `grep` on observed payment files to extract the exact fraud
    hit identifier.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r003, r004'
  id: r004
  reasoning: r002 and r003 address the same spec_goal with complementary restrictions;
    r003 (highest id) extended to also prohibit blind `find:*fraud*` and require deriving
    the exact identifier from file naming conventions and contents before inspecting
    files.
  source: learn
  status: inactive
- content: When the spec_goal is to identify archived payment records for a confirmed
    fraud hit, never execute content searches under `/proc/payments/` using assumed
    generic keywords such as `hit`; always first list `/proc/payments/` and derive
    the exact hit identifier or correct search term from observed file naming conventions
    and contents before performing any concrete content inspection action such as
    `read` or `grep`.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r005, r006'
  id: r005
  reasoning: '1. Verbatim error: ''Empty result:''. 2. Root cause category: wrong-action.
    3. Failing fragment citation: the action string ''search:hit /proc/payments/''
    from SDD_OUTPUT and PLAN_OUTPUT. 4. Rule linkage: the new rule prohibits executing
    content searches with assumed generic keywords such as ''hit'' under /proc/payments/
    and mandates deriving the search term from observed files first.'
  source: learn
  status: inactive
- content: When the spec_goal is to identify archived payment records for a confirmed
    fraud hit, never execute `find:*fraud* /proc/payments/` and never execute content
    searches under `/proc/payments/` using assumed generic keywords such as `hit`;
    never conclude the SDD action list with only `list:/proc/payments/` and `tree:/proc/payments/`.
    Always first list `/proc/payments/`, then determine the exact hit identifier or
    correct search term from observed file naming conventions and file contents rather
    than defaulting to keywords like 'fraud' or 'hit', and always append a concrete
    content inspection action such as `read` or `grep` on observed payment files to
    extract the exact fraud hit identifier.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r005, r006'
  id: r006
  reasoning: r003 is a strict subset of r004 (both prohibit ending with only list/tree
    and require concrete inspection, but r004 adds the `find:*fraud*` prohibition
    and deriving terms from observed files). r005 overlaps with the same spec_goal
    and adds the prohibition on generic keywords like `hit` plus the requirement to
    list first. Merged into the highest-id rule r005, extended to cover the `find:*fraud*`
    and `tree` prohibitions from r004 and the no-generic-keyword requirement from
    r005.
  source: learn
  status: inactive
- content: When the spec_goal is to identify archived payment records for a confirmed
    fraud hit, never execute `find:*.md /proc/payments/` or any `find` with an assumed
    file extension under `/proc/payments/`; always derive the exact payment files
    to inspect from the observed output of `list:/proc/payments/` and `tree:/proc/payments/`,
    and always append a concrete content inspection action such as `read` or `grep`
    on those observed files to extract the exact fraud hit identifier.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r007'
  id: r007
  reasoning: 'The verbatim error is ''Empty result'' produced by the action `find:*.md
    /proc/payments/`. Root cause category: wrong-action. The failing fragment is the
    SDD action `find:*.md /proc/payments/` and the corresponding PLAN action `find:*.md
    /proc/payments/`, which assumed a `.md` file extension in `/proc/payments/` rather
    than deriving the actual files from the `list`/`tree` output. Existing rule r006
    requires appending `read` or `grep` on observed payment files, but it does not
    explicitly prohibit a `find` with an assumed extension like `*.md`, leaving a
    loophole that led to the empty result. The new rule closes this gap by explicitly
    banning `find:*.md` and any assumed-extension `find` under `/proc/payments/` for
    this spec_goal.'
  source: learn
  status: inactive
- content: When the spec_goal is to identify archived payment records for a confirmed
    fraud hit, never execute `find` with any assumed pattern or file extension under
    `/proc/payments/` (including `*fraud*` or `*.md`); never execute content searches
    under `/proc/payments/` using assumed generic keywords such as `hit` or `fraud`;
    and never conclude the SDD action list with only `list:/proc/payments/` and `tree:/proc/payments/`.
    Always first list `/proc/payments/`, then determine the exact hit identifier and
    the exact payment files to inspect from observed file naming conventions, file
    contents, and the output of `list:/proc/payments/` and `tree:/proc/payments/`
    rather than defaulting to keywords like 'fraud' or 'hit', and always append a
    concrete content inspection action such as `read` or `grep` on those observed
    payment files to extract the exact fraud hit identifier.
  created: '2026-05-23'
  deactivated_reason: r008 and r009 are identical and mandate that a concrete read/grep
    action always be appended in the same SDD cycle, which forces the agent to hallucinate
    filenames like `archive.json` before observing directory contents; a phased discovery
    approach is required instead.
  id: r008
  reasoning: r005, r006, and r007 all address the same spec_goal. r007 (highest id)
    is used as the base and extended with the broader `find` and content-search prohibitions,
    the explicit list-first requirement, and the no-list-only conclusion constraint
    from r005 and r006, producing a single comprehensive rule that covers all three.
  source: learn
  status: inactive
