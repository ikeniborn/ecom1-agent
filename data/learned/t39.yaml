- agents_md_anchor: '#important-things > reference'
  content: When success_criteria narrows the answer to a single confirmed subset (one
    cluster/group) but the ops query can return multiple groups, do not concatenate
    every returned row into refs; first reconcile the ops result against the grounding
    evidence and the success_criteria signature, keep only the rows of the one confirmed
    group, then cite their record_paths.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: payment fraud refs recovered ~0% EUR from
    fraud amount, and also marked a few payments as false positives.'' Root cause:
    codegen took the ops query stdout and pushed EVERY returned row''s record_path
    into refs (loop building record_paths, then refs.append per rp). The plan''s cluster
    query groups on both fingerprints with count>1, so it emits all qualifying pairs
    as separate clusters — not the single Risk Ops-confirmed ring required by success_criteria
    #2. Citing all of them yields false positives, while the true ring (which shares
    the confirmed device_fingerprint/payment_method_fingerprint signature, possibly
    via only one of the two) gets fragmented and mostly missed, giving ~0% EUR recall.
    Failing fragment: `for line in out.splitlines(): ... record_paths.append(rp)`
    followed by `refs.append(security_policy_path)` — no narrowing to the confirmed
    group. Linkage: the new rule forces codegen to filter the ops result to the single
    confirmed subset before emitting refs, rather than blindly citing every row a
    broader detection query returns. Distinct from r001/r002 (RPC emission + verbatim
    arg transcription), which constrain how queries are run, not how their multi-row
    output is reduced to the success_criteria-mandated subset.'
  status: active
