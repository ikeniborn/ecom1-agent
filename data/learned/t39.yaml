- agents_md_anchor: null
  content: Always include discovery steps in the plan when the outcome space contains
    OUTCOME_OK, even if the request appears ambiguous; never emit a clarify-only plan
    without attempting discovery.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: ''attempt grounded discovery before clarifying (clarify-only
    plan rejected while OUTCOME_OK is reachable)''. The PlanIR had no discovery steps
    and a decision defaulting to clarify. The planner must always attempt discovery
    when a successful outcome is possible, rather than immediately clarifying.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using Read RPC, always reference the 'content' field of the response
    for text analysis; never treat the top-level ReadResponse object as a string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''real_vm: Protocol message ReadResponse has no "guest" field.''
    The plan''s decision branch applied ''contains_any'' directly to $security_doc,
    which is the raw ReadResponse message, not its textual content. The Read RPC returns
    a structured message; the plan must extract the ''content'' field before performing
    text searches. Failing PlanIR fragment: decision branch with ''contains_any''
    on $security_doc.'
  status: inactive
  surface: ir
