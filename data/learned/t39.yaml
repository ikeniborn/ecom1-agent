entries:
- content: Always list the contents of the target directory (e.g., /proc/payments/)
    and its subdirectories to locate the 'archived payments' subdirectory before searching,
    and if a plain-text search for 'fraud' yields empty, use structured search (e.g.,
    grep for patterns like 'FRAUD', 'status:fraud', or 'flagged') within that subdirectory.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r001
  reasoning: 'Verbatim error: ''Empty result: ''. Root cause category: wrong-action
    (the search for plain text ''fraud'' across /proc/payments/ returned empty because
    the fraudulent records are likely in an ''archived'' subdirectory and the indicator
    is not literal word ''fraud'' but a field value or flag). Failing fragment citation:
    action ''search:fraud /proc/payments/'' from SDD_OUTPUT.plan[1]. Rule linkage:
    new rule must prevent blind plain-text search without exploring directory structure
    and understanding file format.'
  source: learn
  status: inactive
- content: When the spec_goal is 'Identify and cite all payment records flagged as
    fraudulent within the archived payments directory', always first locate the exact
    archived subdirectory under /proc/payments/ (e.g., by listing both /proc/payments/
    and /proc/payments/archived/ or similar), then perform a structured grep search
    for patterns like 'FRAUD', 'fraud', 'flagged', 'status:fraud' within that subdirectory,
    and only if no matches are found after that exhaustive search, report that no
    records match and request clarification.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r002'
  id: r002
  reasoning: 'Verbatim error: ''The fraud review indicates one hit is present, but
    the listing of payment records does not include any fraud marker. Please specify
    which record is flagged or provide the fraud criteria (e.g., a specific field
    or transaction ID) to search for.'' Root cause category: wrong-action (action
    ''list:/proc/payments/'' was taken without proceeding to search). Failing fragment
    citation: action ''list:/proc/payments/'' only; spec_goal ''Identify and cite
    all payment records flagged as fraudulent within the archived payments directory''
    requires searching the archived subdirectory. Rule linkage: existing rule r001
    advises to list and search but the agent failed to execute the search steps.'
  source: learn
  status: inactive
- content: Always list the contents of /proc/payments/ and its subdirectories to locate
    the 'archived payments' subdirectory (e.g., /proc/payments/archived/). Then perform
    a structured grep search for patterns like 'FRAUD', 'fraud', 'flagged', 'status:fraud'
    within that subdirectory. If no matches are found after exhaustive search, report
    that no records match and request clarification.
  created: '2026-05-21'
  deactivated_reason: r003 causes repeated listing of /proc/payments/ which triggers
    the 'Repeated action detected' error; the new rule avoids repetition by skipping
    the listing when the directory structure is already known.
  id: r003
  reasoning: 'Merged r002 (higher id) as base and r001: both require locating the
    archived payments subdirectory and searching for fraudulent records. r001''s plain-text
    search step is subsumed by r002''s structured grep, and r002''s final reporting
    step is added. The merged rule is generalized to apply to any fraud search scenario,
    not just the specific spec_goal, to cover the full scope of both rules.'
  source: learn
  status: inactive
- content: Never repeat the directory listing action 'list:/proc/payments/' if the
    archived payments subdirectory is already known from a previous listing; instead,
    directly perform a structured grep search on /proc/payments/archived/ for fraud
    patterns (FRAUD, fraud, flagged, status:fraud) and read any matching files for
    citation.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r004'
  id: r004
  reasoning: 'Error verbatim: ''Repeated action detected — must use a different query
    or approach. Action was: list:/proc/payments/''. Root cause category: wrong-action.
    Failing fragment: action ''list:/proc/payments/'' in both SDD_OUTPUT and PLAN_OUTPUT.
    Rule linkage: existing rule r003 mandates listing /proc/payments/ as the first
    step, which triggers the repetition error when the listing was already performed
    in a prior cycle. The rule forces the same action regardless of prior context,
    causing the system to reject it as repeated.'
  source: learn
  status: inactive
- content: Always use the `/bin/grep` tool with `-rl` flag to search for fraud-related
    keywords (FRAUD, fraud, flagged, status:fraud) in the /proc/payments/archived/
    directory, rather than relying on a generic 'search:' action which does not correspond
    to an executable in /bin.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r005'
  id: r005
  reasoning: 'The error is ''Execute exception [Search for fraud-related keywords
    in archived payment files]: search failed: not found''. Root cause category: wrong-action.
    The failing fragment is the action ''search:fraud /proc/payments/archived/'' from
    SDD_OUTPUT.actions and PLAN_OUTPUT.action. The spec_goal ''Identify and cite all
    fraudulent payment records from /proc/payments/archived/'' is correct, but the
    planner attempted a command ''search:fraud'' which is not an executable in /bin.
    The existing rule r004 recommends ''structured grep search'' but does not specify
    the exact tool, leading to an invalid action. The new rule must mandate the use
    of the actual grep binary to prevent command-not-found errors.'
  source: learn
  status: inactive
