- agents_md_anchor: null
  content: Always transcribe each ops/discovery RPC's argument payload verbatim from
    the tool_plan — copy the declared command and query string exactly (substituting
    only bound params), and never replace it with self-invented logic such as a different
    detection query that the plan did not specify.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''grader: payment fraud refs recovered ~0% EUR from
    fraud amount, and also marked more than ten payments as false positives.'' Root
    cause: CODEGEN ignored the frozen tool_plan ops SQL (shared payment_method_fingerprint
    / device_fingerprint reuse across customers + three_ds exhausted criteria) and
    substituted an entirely different self-authored query. Failing fragment: `fraud_sql
    = ("WITH base AS (... LAG(lat) OVER w ... in_speed > 2.0 ... impossible-travel
    ...)")` implements a geo-velocity rule using observed_latitude/observed_longitude
    that appears nowhere in tool_plan.ops. Wrong detection logic → recovers ~0% of
    true fraud EUR and flags >10 false positives. Linkage: distinct from r001 (which
    governs RPC-primitive/count fidelity) because this targets faithful transcription
    of each RPC''s argument content, not the RPC type or multiset.'
  status: active
