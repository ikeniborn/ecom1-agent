- agents_md_anchor: '#security'
  content: When a decision branch uses a fact like $_facts.identity.kind, always include
    a discovery step to retrieve that fact before the decision; never rely on implicit
    defaults.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_DENIED_SECURITY. Root
    cause: the plan''s decision branch evaluated $_facts.identity.kind = ''guest''
    as true, but the test case had a non-guest identity. The plan did not include
    any discovery step to retrieve identity facts, so the interpreter likely defaulted
    to ''guest'', causing the deny branch to fire. Failing PlanIR fragment: decision.branches[0].when.
    New rule ensures identity facts are explicitly retrieved before use.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When parsing RPC output with auto_delim format, always ensure that the
    column candidates match the actual column names in the output; if the output includes
    a header row, use those names; if not, use positional references (e.g., col0)
    or switch to a format that includes headers (e.g., csv with header=true).
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: The interpret phase failed with 'unresolved required ref(s) ["$fraudulent_payments.*.record_path"]
    on OK answer'. The PlanIR attempted to extract a 'record_path' column from the
    raw SQL output using auto_delim format and candidates ['record_path']. If the
    SQL output did not include a header row, the auto_delim parser may have assigned
    a generic name (e.g., col0) instead of 'record_path', causing the column extraction
    to fail and leaving the ref source unresolvable. The rule ensures that column
    mapping is explicit and matches the actual output format.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always ensure that the output format of SQL queries includes a header row
    when using auto_delim format; if the SQL output does not include headers, use
    positional column references (e.g., col0) or switch to a format that includes
    headers (e.g., csv with header=true).
  created: '2026-06-24'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: interpret: unresolved required ref(s) [''$fraudulent_payments.*.record_path'']
    on OK answer. Root cause: The rowset mapping from ''fraudulent_payments_raw''
    to ''fraudulent_payments'' used auto_delim format with column candidate ''record_path'',
    but the SQL output likely did not include a header row, so the column was not
    parsed. The required ref could not be resolved. The PlanIR fragment: rowset definition.
    Existing rule r007 advises to ensure column candidates match actual output, but
    the plan assumed headers without verification. This new rule explicitly requires
    ensuring headers or using positional/header-inclusive formats.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a decision branch uses a fact like $_facts.identity.kind, always include
    a compute step that extracts the kind from the raw identity discovery output and
    binds it to $_facts.identity.kind before the decision; never assume the fact is
    automatically populated from a raw binding.
  created: '2026-06-24'
  deactivated_reason: null
  id: r010
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). Observed /bin/id output shows
    user emp_001, roles employee, etc., so identity.kind is not guest. The plan''s
    decision branch for guest denial triggered incorrectly because $_facts.identity.kind
    was never set. The plan bound /bin/id output to identity_raw but did not extract
    the kind into $_facts.identity.kind. The decision condition used $_facts.identity.kind,
    which was missing, causing the interpreter to default or misfire, leading to a
    spurious denial. Root cause: missing compute step to parse identity output and
    bind the fact. This rule ensures that any fact used in a decision is explicitly
    extracted and bound before the decision, preventing spurious over-refusals.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always extract the stdout field from an ExecResponse object (e.g., $identity_raw.stdout)
    before using it in a decision condition; never pass the raw ExecResponse object
    to a condition operation like contains_any.
  created: '2026-06-24'
  deactivated_reason: null
  id: r011
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "guest" field.''
    Root cause: The PlanIR used `contains_any` on the raw ExecResponse object bound
    to `identity_raw` (output of /bin/id). The runtime attempted to access a field
    ''guest'' on the ExecResponse, which does not exist. The correct technique is
    to first extract the stdout string from the ExecResponse via a compute step (e.g.,
    get $identity_raw.stdout) and then apply string matching. This also aligns with
    existing rules [r007] and the in-session rule about extracting identity kind,
    but those were not followed. The new rule explicitly addresses the ExecResponse
    object structure.'
  status: active
  surface: ir
