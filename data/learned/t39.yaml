- content: When the SDD `actions` prescribe a discovery cycle containing `list:/proc/payments/`
    and `tree:/proc/payments/` to locate archive filenames for a confirmed fraud hit,
    never emit a previously executed discovery command in the PLAN `action`; always
    issue the next unexecuted discovery command from the SDD `actions` list, and after
    both `list` and `tree` have been executed, advance to `read` or `grep` of the
    discovered archive files instead of repeating any discovery step.
  created: '2026-05-23'
  deactivated_reason: Superseded by a stricter unconditional rule that explicitly
    forbids `find:*.json` and mandates the exact SDD discovery sequence, removing
