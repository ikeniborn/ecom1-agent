- agents_md_anchor: null
  content: When the desired outcome is OUTCOME_OK, always include discovery steps
    to bind all required refs for that outcome before evaluating constraints; never
    emit a plan that only checks a constraint and defaults to a deny outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The plan only read /docs/security.md and then checked identity.kind ==
    guest, defaulting to denied. It never attempted to read the incident doc or query
    archived payments, so it could not produce the required refs for OUTCOME_OK. The
    plan must first attempt to satisfy the success criteria for the expected outcome,
    then apply constraints.
  status: inactive
