- agents_md_anchor: null
  content: Always emit exactly one VM call per tool_plan RPC using the primitive matching
    its declared rpc type — keep Exec RPCs as vm.exec(path=...) and never substitute
    a convenience helper (vm.tree, etc.) that emits a different RPC name; also emit
    every discovery RPC even when its output is unused downstream, since the fidelity
    check compares the executed RPC multiset against the plan.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer, Exec, Exec, Exec, Exec, Find, Read] got: [Answer,
    Exec, Exec, Find, Read, Tree]''. Root cause: codegen diverged from tool_plan RPC
    shape two ways — (1) substituted vm.tree(root=''/docs'', level=2) for the planned
    Exec(/bin/sh -c ''tree -L 2 /docs''), producing a ''Tree'' RPC where the plan
    declared ''Exec''; (2) dropped the planned discovery Exec(/bin/id) identity call
    entirely. Plan declared 4 Exec (tree, id, sql schema, sql fraud); script emitted
    only 2 Exec (schema, fraud) plus 1 Tree, and omitted id. Failing fragment: ''docs_tree
    = vm.tree(root="/docs", level=2)'' and the absent id call. Rule linkage: codegen
    must mirror tool_plan RPCs one-to-one by declared type, never swapping in helper
    primitives or skipping unused discovery calls.'
  status: active
