  id: r015
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: tree:/proc/payments/''. Root cause category: wrong-action.
    The PLAN_OUTPUT `action` field contained `"tree:/proc/payments/"`, which had already
    been executed in a prior cycle, instead of selecting the remaining unexecuted
    discovery command from the SDD_OUTPUT `actions` list `["list:/proc/payments/",
    "tree:/proc/payments/"]`. Rule linkage: The new rule explicitly prohibits repeating
    an already-executed discovery command and requires the PLAN `action` to advance
    to the next unexecuted command from the SDD `actions` list, then move on to reading/grepping
    archives once discovery is complete.'
