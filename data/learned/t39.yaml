- agents_md_anchor: null
  content: Never assume the identity fact contains a 'kind' field; always use the
    'user' and 'roles' fields from /bin/id output when evaluating security deny_when
    conditions in decision branches.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'The error ''verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds'' indicates a spurious over-refusal. The PlanIR decision
    branch used `$_facts.identity.kind` to check for ''guest'', but the /bin/id output
    provides ''user'' and ''roles'', not ''kind''. This caused the condition to evaluate
    incorrectly (likely undefined behavior), leading to a false denial. The root cause
    is using a non-existent field in the decision condition. The rule ensures that
    decision branches rely on actual available fields, preventing such mismatches.'
  status: active
  surface: ir
