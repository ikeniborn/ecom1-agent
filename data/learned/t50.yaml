- agents_md_anchor: null
  content: When a security constraint includes a deny_when condition, the decision
    must contain a branch that evaluates that condition and, if true, routes to a
    DENIED_SECURITY outcome with an appropriate message and the required refs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The PlanIR lacked a decision branch to check the deny_when condition
    (identity.kind == 'guest'). The security constraint explicitly forbids guest access
    to customer-specific resources, so the plan should have produced OUTCOME_DENIED_SECURITY
    instead of defaulting to unsupported. The rule ensures future plans include such
    security checks.
  status: inactive
  surface: ir
- agents_md_anchor: '#plan/compute'
  content: Never use the 'get' primitive with a single argument; 'get' requires an
    object and a key. To include a literal required ref path in the answer, place
    it directly in the answer's refs array without a compute step.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The PlanIR compute step 'get' was called with only one argument ('/docs/security.md'),
    violating the contract 'get(obj, key)'. The intent required a policy doc ref;
    the correct approach is to embed the literal path directly in the answer's refs
    array, not to compute it via 'get'.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a decision branch evaluates a security constraint's deny_when condition,
    the lhs must use the exact variable path from the IntentSpec (e.g., $_facts.identity.kind)
    rather than a shortened or assumed name (e.g., $identity.kind).
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: ''verify: I3: security constraint ''#customer/guest'' deny_when
    holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY''. The
    PlanIR decision branch used ''$identity.kind'' as lhs, but the IntentSpec defines
    the caller identity as ''$_facts.identity''. The branch condition failed to match
    because the variable was undefined, causing the default ''none_unsupported'' outcome
    to be selected. The existing rule about including a deny_when branch is correct
    but insufficient; the branch must reference the exact variable path from the IntentSpec.'
  status: inactive
  surface: ir
