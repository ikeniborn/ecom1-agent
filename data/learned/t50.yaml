- agents_md_anchor: null
  content: Always include a reference to the primary discovered record (the one matching
    the objective's target entity) in the answer's refs array, even if the answer
    shape does not explicitly require it.
  created: '2026-06-22'
  deactivated_reason: null
  id: r009
  reasoning: 'The grader reported: ''answer missing required reference ''/proc/baskets/basket_152.json''''.
    The PlanIR discovered the newest open basket and placed a record ref with path
    ''$newest_open_basket_path'' in the answer''s refs array for both outcome branches.
    However, the interpreter likely omitted this ref because the answer shape only
    specified a message skeleton and did not mandate any refs beyond the policy docs.
    The root cause is that the PlanIR assumed the interpreter would include the refs,
    but the interpreter only includes what the answer shape explicitly requires. The
    corrective rule ensures that discovered record refs are always included in the
    answer, regardless of the answer shape.'
  status: active
  surface: ir
