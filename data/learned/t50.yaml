- agents_md_anchor: null
  content: When the objective describes a business action (e.g., checkout, return,
    cancel), include a reference to the corresponding policy document (e.g., /docs/checkout.md)
    in the answer's refs array, regardless of the outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: ''grader: answer missing required reference ''/docs/checkout.md''''.
    The PlanIR''s answer refs for OUTCOME_DENIED_SECURITY included /docs/security.md
    (from constraints) and a basket record, but the grader expected /docs/checkout.md
    because the objective involves checkout. The plan''s required_refs for this outcome
    only listed /docs/security.md, but the grader''s check implies that the checkout
    action itself requires its policy document. The root cause is that the PLAN phase
    did not infer the need for the action-specific policy doc. The new rule instructs
    the PLAN phase to always include the policy document matching the objective''s
    action verb.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use the concat primitive to build SQL query strings; concat is only
    for merging rowsets. Instead, construct the SQL query using a string template
    with variable substitution directly in the Exec step's stdin field, or use a dedicated
    string-formatting primitive if available.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: ''interpret: compute step ''concat'' failed: <lambda>() takes
    2 positional arguments but 3 were given. CONTRACT: concat(a, b): both args must
    be list[dict] rows (parse Exec output via rowsets first)''. Root cause: PlanIR
    used concat primitive with three string arguments to assemble a SQL query, violating
    the primitive''s contract. Failing fragment: compute step {"prim":"concat","args":["SELECT
    basket_id, record_path, basket_status, store_id FROM shopping_baskets WHERE customer_id
    = ''","$cid","'' AND basket_status = ''open'' ORDER BY basket_created_at DESC
    LIMIT 1"],"into":"basket_sql"}. The concat primitive is designed to merge rowsets,
    not strings. The plan should instead embed the variable directly in the Exec stdin
    using a template (e.g., stdin: "SELECT ... WHERE customer_id = ''$cid'' AND ...")
    or use a string-formatting primitive if the toolset provides one. This rule prevents
    future misuse of concat for string assembly.'
  status: active
  surface: ir
