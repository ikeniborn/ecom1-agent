- agents_md_anchor: null
  content: Always include a decision branch that checks whether the primary discovery
    step returned a non-null result before referencing fields of that record in answer
    refs. If the record is absent, route to an outcome that does not require those
    fields, or use a conditional ref that resolves to null.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Error: ''verify: I1: required ref source(s) [''''$basket.record_path'''']
    did not resolve on OUTCOME_DENIED_SECURITY answer (resolve-before-cite)''. Root
    cause: The PlanIR''s decision only checks identity kind, not whether the basket
    discovery returned a result. The compute step ''first'' on an empty rowset yields
    null, so $basket.record_path cannot be resolved. The answer refs unconditionally
    include $basket.record_path, causing verification failure. Failing PlanIR fragment:
    decision has only one branch (deny_security) and its answer refs include {"kind":"record_path","source":"$basket.record_path"}.
    Rule linkage: Existing rule g001 describes the read-only discovery pattern but
    does not mandate an existence check before referencing the record''s fields. This
    new rule fills that gap.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always use the actual parameter values from the TOOL_PLAN params (e.g.,
    $customer_id) in SQL queries by interpolating the pre-resolved fact value into
    the Exec step's stdin field; never hardcode NULL or omit the parameter. Additionally,
    when the TOOL_PLAN has multiple constraints that can deny, the decision must include
    branches for each deny condition and an explicit allow branch, not a single branch
    with a default that always denies.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'Error: verify I1 required ref source ''$basket.record_path'' did not
    resolve on OUTCOME_DENIED_SECURITY. Root cause: the SQL query in the PlanIR used
    ''customer_id = NULL'' instead of the actual customer_id from $_facts.identity.customer_id,
    causing the basket_raw query to return no rows, so $basket was null and its record_path
    could not be resolved. Additionally, the decision only has one branch (identity.kind
    != customer) with default_label ''deny_security'', which would incorrectly deny
    even for customers, ignoring the availability constraint. The PlanIR must use
    parameter values from the TOOL_PLAN params and structure decisions to cover all
    constraints.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always interpolate the actual parameter values from TOOL_PLAN.params (e.g.,
    $customer_id) into SQL queries in the Exec step's stdin field, using the pre-resolved
    fact values, and never hardcode NULL or other placeholders. Additionally, always
    place a null-check branch for the primary discovered record as the first decision
    branch after the compute step, before any identity-based or availability-based
    branches, to ensure that answer refs depending on the record are only used when
    the record exists; if the record is null, route to an outcome that does not require
    fields from that record, or use conditional refs that resolve to null.
  created: '2026-06-24'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: 'Error: verify: I1: required ref source(s) [''$basket.record_path'']
    did not resolve on OUTCOME_DENIED_SECURITY answer. Root cause: (1) The SQL query
    in the discovery step hardcodes ''WHERE b.customer_id IS NULL'' instead of using
    the actual $customer_id from params, so for a customer the query returns no rows
    and $basket becomes null. (2) The decision branch for deny_security (identity.kind
    != ''customer'') is placed before any null-check branch, so when the identity
    is not customer, the branch is taken even though $basket is null, causing the
    ref $basket.record_path to fail. The fix requires using the actual parameter value
    in the SQL and reordering decision branches so that a null-basket check precedes
    the identity check, ensuring refs only resolve when the record exists.'
  status: inactive
  surface: ir
