- agents_md_anchor: null
  content: Always include a discovery step that attempts to find the target record
    (e.g., most recent open basket) using any available context (e.g., session customer
    ID) before falling back to clarification. The decision must have a branch for
    successful discovery (leading to OUTCOME_OK) and a default branch for clarification
    when discovery returns no record. The discovery step should be a SQL query that
    selects the record with appropriate ordering and limit, and the compute step should
    bind the result.
  created: '2026-06-24'
  deactivated_reason: null
  id: r013
  reasoning: The plan is clarify-only (no discovery steps) but the outcome_space includes
    OUTCOME_OK, which the interpreter considers reachable. The plan must attempt grounded
    discovery before clarifying. The corrective rule ensures that the plan includes
    a discovery step to find the basket using any available context, with a decision
    branch for success (OUTCOME_OK) and a fallback to clarification.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never include a Read RPC with a literal path that is not a known table
    or document; use Exec SQL to query known tables. When the TOOL_PLAN requires asking
    for a customer identifier (OUTCOME_NONE_CLARIFICATION), the PlanIR must not include
    any discovery steps that depend on that identifier; instead, the plan should first
    present the clarification answer and stop, deferring discovery to a subsequent
    cycle after the identifier is provided.
  created: '2026-06-24'
  deactivated_reason: null
  id: r014
  reasoning: 'Error ''real_vm: read failed: not found'' on first discovery step Read
    at ''/customer/guest''. That path does not exist in the data model. The TOOL_PLAN
    requires asking for a customer identifier, but the plan prematurely attempts to
    read a non-existent path. The plan should not include any discovery steps that
    depend on an unprovided identifier; it should first ask for the identifier and
    stop. Additionally, the plan should never use a literal path that is not known
    to exist; instead, use Exec SQL to query known tables.'
  status: active
  surface: ir
