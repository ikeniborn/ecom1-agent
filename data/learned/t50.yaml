  content: When constructing the answer's refs array, include all policy document
    paths that appear as anchors in the constraints, not only those listed in the
    outcome's required_refs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The grader error ''answer missing required reference ''/docs/checkout.md''''
    occurred because the PlanIR answer for the denied_security branch only included
    the /docs/security.md ref, but the constraints contain an anchor for #docs/checkout.md.
    The grader expects that any policy document referenced in the constraints must
    be included in the answer''s refs array, regardless of whether it is explicitly
    listed in the outcome''s required_refs. The script''s answer omitted /docs/checkout.md,
    causing the failure.'
  status: inactive
