- agents_md_anchor: '#Important things > policy grounding'
  content: When a policy-grounding constraint requires the answer to cite the governing
    policy documents, do not rely on a single keyword-scoped docs-discovery result
    (e.g. Find name="checkout"); enumerate the full policy docs root and include every
    policy document that governs the performed operation (checkout, security, availability,
    etc.) as grounding references, so required policy docs the narrow filter omits
    are still added to refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/security.md''".
    Root cause: discovery Find scoped name="checkout" limit 5 surfaces only checkout-named
    docs; script builds refs solely from that result (policy_paths) so /docs/security.md,
    which also governs the checkout operation, is never discovered nor referenced.
    Failing fragment: `checkout_policy_find = vm.find(root="/docs", name="checkout",
    ...)` then `for p in policy_paths: refs.append(p)` — refs can only ever contain
    checkout-named docs. Existing r003 only mandates including ALL entries of a discovery
    call (don''t break on first), but does not address a discovery scope too narrow
    to surface every governing policy doc. New rule covers grounding completeness
    across the full policy directory and subsumes r003''s narrower ''include all matches''
    lesson.'
  status: active
