- agents_md_anchor: '#important-things > policy-grounding'
  content: When a policy-grounding constraint applies, iterate over EVERY entry returned
    by each docs-discovery RPC and add all their paths to the answer's refs array;
    never select only the first match and break, since a single discovery call can
    surface multiple required grounding documents.
  created: '2026-06-06'
  deactivated_reason: r003 only required adding every path from a single docs-discovery
    call; the new rule generalizes it to enumerating the full policy docs root and
    including every governing policy document, which fully subsumes the 'don't select
    only the first match' behavior while also fixing the narrow-scope omission r003
    cannot catch.
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/security.md''".
    Root cause: codegen collected only ONE grounding doc. Failing fragment — the policy-doc
    loop `for e in (cp_entries or []): ... policy_path = p; break` stops after first
    entry, so only the checkout doc path is captured and emitted in refs; any additional
    required grounding doc (e.g. security.md) returned by the same discovery RPC is
    silently dropped. Linkage: policy-grounding constraint (#important-things > policy-grounding)
    demands ALL applied policy docs be referenced; rule forces full enumeration of
    discovery results into refs rather than first-match-and-break. Distinct from r001
    (RPC emission) and r002 (placeholder resolution).'
  status: inactive
- agents_md_anchor: null
  content: When probing a tool result of unknown shape for a collection field by attribute
    name, use dict-key lookup first for dict results and verify the retrieved value
    is actually a list or tuple before iterating; never iterate a getattr() result
    unguarded, since candidate names like items/keys/values resolve to truthy built-in
    methods that are not iterable.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''fidelity: ... File "<string>", line 24, in find_paths
    TypeError: ''builtin_function_or_method'' object is not iterable''. Failing fragment:
    find_paths() loops attr in (''matches'',''results'',''entries'',''items'',''files''),
    does v = getattr(r, attr, None) then `if v:` then `for e in v`. Root cause: ''items''
    (also ''keys''/''values'') is a built-in method name; getattr(r,''items'') on
    a dict-like result returns the bound dict.items method object, which is truthy
    so passes `if v:` but is not iterable, so `for e in v` raises. The dict fallback
    only triggers when getattr returned None, so it never runs. Linkage: generalizes
    shape-tolerant extraction technique — guard container type and prefer key lookup
    over getattr for dicts. Not covered by r001 (emit all RPCs), r002 (resolve placeholders),
    or r003 (collect all doc refs).'
  status: active
