  content: When the objective references a specific entity (e.g., 'most recently created
    open shopping basket'), the PlanIR must include discovery steps to locate that
    entity and include its resolved path in the answer's refs array, regardless of
    the outcome.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/baskets/basket_093.json''''.
    Root cause: The PlanIR omitted any discovery of the basket that is the subject
    of the checkout objective. The answer refs only contained policy docs (/docs/security.md,
    /docs/checkout.md) but the grader expected the path of the most recent basket.
    The failing PlanIR fragment is the answer.deny_guest.refs array, which lacked
    the basket path. No existing rule covers entity refs; r004 only addresses policy
    doc refs from constraints.'
  status: inactive
