- agents_md_anchor: null
  content: Do not re-resolve identity facts in the PlanIR; use the pre-resolved $_facts.identity.kind
    directly in decision branches.
  created: '2026-06-22'
  deactivated_reason: null
  id: r008
  reasoning: 'verify: I3: security constraint ''#security-guest-checkout-denied''
    deny_when holds but outcome is ''OUTCOME_NONE_UNSUPPORTED'', not DENIED_SECURITY.
    The PlanIR included a discovery step to run /bin/id and bind it as ''identity'',
    then used $identity.kind in the decision branch. The pre-phase already resolved
    identity.kind as ''guest'', but the PlanIR''s re-resolution returned ''customer''
    (or the branch used the wrong source). The security constraint requires that when
    identity.kind is ''guest'', the outcome must be DENIED_SECURITY. The PlanIR''s
    decision branch used $identity.kind (from its own discovery) instead of $_facts.identity.kind,
    causing the branch to not fire and default to OUTCOME_NONE_UNSUPPORTED, violating
    the constraint. The PlanIR must not re-resolve identity; it must use the pre-resolved
    $_facts.identity.kind directly.'
  status: active
  surface: ir
