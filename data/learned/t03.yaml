- agents_md_anchor: null
  content: Always ensure that decision branch conditions accessing row attributes
    (e.g., $row.brand) are guarded by a prior check that the rowset is nonempty and
    the row variable is defined, to prevent evaluation errors that lead to unintended
    outcomes.
  created: '2026-06-22'
  deactivated_reason: r004 warned about guarding but did not specify safe evaluation
    order; new rule provides a concrete safe pattern using nested branches.
  id: r004
  reasoning: 'The error ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''
    indicates the interpreter produced an outcome not defined in the script. The script''s
    decision branch condition uses an ''and'' with nonempty($rows) and eq($row.brand,
    ''Dewalt'') and eq($row.model, ''DCF887''). If $rows is empty, $row (computed
    as first($rows)) is undefined, causing the eq checks to fail with an evaluation
    error. The interpreter likely defaults to a clarification outcome when condition
    evaluation fails, bypassing the script''s default ''unsupported'' branch. The
    root cause is that the condition accesses $row attributes without ensuring $row
    is defined in all evaluation paths. The PlanIR should be restructured to avoid
    evaluating attribute conditions on a potentially undefined row.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using concat to build a message string, always ensure every argument
    is a string. If a column is numeric (e.g., price_cents), cast it to text in the
    SQL query (CAST(price_cents AS TEXT) or price_cents::text) so the rowset column
    is already a string.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: ''real_vm: bad argument type for built-in operation''. Root cause:
    the concat compute step received a non-string argument ($row.price_cents, an integer)
    causing a type error. Failing PlanIR fragment: compute step {"prim":"concat","args":["Brand:
    ","$row.brand",", Series: ","$row.series",", Model: ","$row.model",", Price: ","$row.price_cents","
    ","$row.price_currency"],"into":"product_details"}. The rule ensures all concat
    arguments are strings by casting numeric columns in SQL.'
  status: active
  surface: ir
