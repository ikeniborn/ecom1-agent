- agents_md_anchor: null
  content: When using concat to build a message string, always ensure every argument
    is a string. If a column is numeric (e.g., price_cents), cast it to text in the
    SQL query (CAST(price_cents AS TEXT) or price_cents::text) so the rowset column
    is already a string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: ''real_vm: bad argument type for built-in operation''. Root cause:
    the concat compute step received a non-string argument ($row.price_cents, an integer)
    causing a type error. Failing PlanIR fragment: compute step {"prim":"concat","args":["Brand:
    ","$row.brand",", Series: ","$row.series",", Model: ","$row.model",", Price: ","$row.price_cents","
    ","$row.price_currency"],"into":"product_details"}. The rule ensures all concat
    arguments are strings by casting numeric columns in SQL.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always use nested decision branches when checking rowset nonempty and then
    a specific row attribute, instead of combining them in a single 'and' condition,
    to prevent evaluation errors on empty rowsets.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION.
    Root cause: The decision branch condition used ''and'' with two nonempty checks:
    first on $rows, second on $rows.0.product_sku. When $rows was empty, the interpreter
    likely evaluated the second check anyway, causing an error that defaulted to OUTCOME_NONE_CLARIFICATION
    instead of the intended OUTCOME_NONE_UNSUPPORTED. Failing PlanIR fragment: decision.branches[0].when.
    Rule linkage: r004 warns about guarding but does not enforce safe evaluation order;
    the attempted guard failed due to non-short-circuit evaluation.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always use the 'query' field for SQL discovery steps in PlanIR, not 'stdin'.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'The PlanIR validation error: ''Extra inputs are not permitted'' for
    ''discovery.0.stdin'' indicates that the discovery step incorrectly used ''stdin''
    to hold a SQL query. The correct field for SQL queries in PlanIR discovery steps
    is ''query''. The failing PlanIR fragment is the discovery step with stdin containing
    the SQL.'
  status: active
  surface: ir
- content: null
