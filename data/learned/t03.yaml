- agents_md_anchor: null
  content: 'Catalogue tasks (existence / claim-verification / count): identify the
    product by its attributes matched NORMALIZED (case- and whitespace-insensitive),
    preferring the real rows in the pre-phase CATALOGUE_CANDIDATES fact over a guessed
    query; ground every positive/identifying answer in the matched record''s record_path;
    produce the answer token/format the instruction asks for; both present and absent
    are OUTCOME_OK (never CLARIFICATION). This is a general method — derive concrete
    SQL/values from THIS run''s facts, never reuse a fixed recipe.'
  created: '2026-06-18'
  deactivated_reason: Rule rc1's blanket assertion that absent catalogue results are
    OUTCOME_OK conflicts with singleton-outcome plans that require a nonempty record_path,
    causing planning deadlock; the new rule subsumes its attribute-matching guidance.
    Rule v003 references an unrelated adhesive product record and is stale.
  id: rc1
  pinned: true
  reasoning: 'General method-not-value rule (reverted from prescriptive prose per
    user directive: execution CONTROL belongs in the harness check-specs + interpreter
    scripts, not in task-prose). Pinned.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never attach a 'params' field to an Exec RPC — ExecRequest has no params
    field, so any ':name' bind placeholders in the SQL stdin cannot be substituted;
    inline the literal brand/model values directly into the stdin SQL string (already
    LOWER/TRIM-normalized) instead of using bind parameters.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r006
  reasoning: 'Verbatim error: ''real_vm: Protocol message ExecRequest has no "params"
    field.'' Root cause: discovery RPC built SQL with bind placeholders (:brand, :model_token)
    and tried to supply them via args.params: {"brand":"Bernardo","model_token":"3OB"}.
    The VM''s ExecRequest schema only accepts path/args/stdin — the extra ''params''
    key is rejected at the protocol layer before any SQL runs. Failing PlanIR fragment:
    discovery[0].args.params plus the '':brand''/'':model_token'' placeholders in
    stdin. The existing rc1 rule correctly shaped the existence query (brand + ONE
    token, normalized LIKE, record_path, match_count/first_record, found/absent branches)
    but said nothing about how Exec carries values; this rule closes that gap by forbidding
    the unsupported params channel and requiring inlined literals in stdin.'
  status: inactive
  surface: ir
