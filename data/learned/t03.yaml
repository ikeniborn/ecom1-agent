  content: Always use the exact required ref source path (e.g., $row.column) in the
    answer's refs list, rather than a computed variable that holds the same value,
    because the system resolves refs by matching the source path.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Diagnosis: verify failure ''I1: required ref source(s) [''''$row.record_path'''']
    did not resolve on OUTCOME_OK answer (resolve-before-cite)''. Root cause: The
    PlanIR answer for the ''exists'' branch specified refs as [''$record_path''],
    a computed variable, but the required ref source is ''$row.record_path'' (a path
    from the rowset). The system attempts to resolve the required ref source by matching
    it against the answer''s refs; since ''$record_path'' is not the same path, resolution
    fails. Failing PlanIR fragment: "answer":{"exists":{"message":"The product {product_name}
    is present in the catalogue.","outcome":"OUTCOME_OK","refs":["$record_path"]}}.
    The fix is to use ''$row.record_path'' directly in the refs list. This rule ensures
    future PlanIR scripts match required ref sources exactly.'
  status: active
  surface: ir
