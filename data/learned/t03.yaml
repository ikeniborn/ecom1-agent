- agents_md_anchor: null
  content: When discovering property keys for filtering, avoid using LIKE patterns
    on property values to infer keys; instead, first retrieve all properties for a
    known entity of the same type and brand to see the exact key names and value formats,
    then use those exact keys and values in the main query.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. Root
    cause: The discovery step used LIKE patterns on property_value_text to find wattage
    and luminous flux keys, but the actual key names or value formats for the target
    product likely differed (e.g., numeric value without unit, or key not containing
    ''watt''). This caused the EXISTS subqueries to fail, returning zero rows. Failing
    PlanIR fragment: the discovery step with ''WHERE (property_value_text LIKE ''%6%W%''
    OR property_value_number = 6) AND (property_key LIKE ''%watt%'' OR property_key
    LIKE ''%power%'')''. The new rule ensures future plans first inspect all properties
    of a similar product to get exact keys and value representations, avoiding mismatches.'
  status: inactive
  surface: ir
