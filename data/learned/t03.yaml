- agents_md_anchor: null
  content: Always name the rowset 'into' variable to exactly match the variable name
    used in the TOOL_PLAN's required_refs for the answer branch. If the discovery
    step's bind uses the same name, rename the discovery bind to a different name
    (e.g., append '_raw') to avoid conflict, and then create the rowset with the required
    name.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: interpret: unresolved required ref(s) [''$matching_products.0.record_path'']
    on OK answer. Root cause: The PlanIR''s answer ref uses $matching_products_rows.0.record_path,
    but the TOOL_PLAN''s required_refs expect $matching_products.0.record_path. The
    rowset was named ''matching_products_rows'' while the required ref variable is
    ''matching_products''. The interpreter looks for $matching_products (the raw RPC
    output) and tries to access .0.record_path on a string, causing unresolved ref.
    The fix is to name the rowset ''matching_products'' and rename the discovery bind
    to avoid conflict.'
  status: active
  surface: ir
