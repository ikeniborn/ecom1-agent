- agents_md_anchor: null
  content: When the success criteria for OUTCOME_OK requires a non-empty ref derived
    from a catalogue row (e.g., a record_path), do not map the not-found or empty-rowset
    decision branch to OUTCOME_OK; restrict OUTCOME_OK to the branch where the match
    rowset is non-empty, the first-row variable is safely populated, and the required
    path field is resolvable.
  created: '2026-06-19'
  deactivated_reason: null
  id: r007
  reasoning: 'The error ''interpret: unresolved required ref(s) [''$catalogue_match.record_path'']
    on OK answer'' stems from the PlanIR assigning OUTCOME_OK to both found and not_found
    decision branches. The task''s success criteria for OUTCOME_OK explicitly requires
    a non-empty ''$catalogue_match.record_path''. When the lookup returns zero rows,
    the unconditional first-row compute yields null/undefined, so the required ref
    path cannot be resolved when the interpreter validates the OK outcome for the
    not_found branch. The plan must avoid labeling an absent match as OK whenever
    the success criteria mandates a grounded record citation. Rule v003 is a stale
    literal-path rule from an unrelated adhesives/sealants task and is irrelevant
    here.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a catalogue presence task requires grounding a non-empty record_path
    reference and the outcome space offers no absent-product outlet, always emit a
    non-empty PlanIR JSON that discovers and binds the pre-phase CATALOGUE_CANDIDATES
    rowset to a named variable via normalized attribute matching; never suppress the
    discovery block or return an empty response to resolve a perceived not-found condition
    during planning, because the verify phase must judge the concrete rowset against
    the success criteria rather than the planner deadlocking over an impossible branch.
  created: '2026-06-19'
  deactivated_reason: null
  id: r008
  reasoning: 'The error ''plan: PLAN LLM returned empty response'' with an empty SCRIPT_CODE
    indicates the planner deadlocked. Root cause: Existing rule [rc1] asserts both
    present and absent results are OUTCOME_OK, but the current TOOL_PLAN exposes only
    OUTCOME_OK and its success criteria strictly requires a nonempty ''$catalogue_match.record_path''.
    Rule [in-session] forbids mapping an empty-rowset branch to OUTCOME_OK when a
    nonempty record_path is required. With no alternative outcomes available, the
    planner could not reconcile these constraints and emitted nothing. The failing
    PlanIR fragment is the entire empty output. The corrective rule forces the PLAN
    phase to always produce a concrete discovery/binding PlanIR for the candidate
    rowset, transferring the not-found evaluation to the verify phase where the success
    criteria naturally applies.'
  status: active
  surface: ir
