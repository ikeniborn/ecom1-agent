- agents_md_anchor: null
  content: When constructing a query to match entities by multiple attributes, first
    verify the exact attribute keys and value formats in the database to avoid mismatches.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The SQL query assumed exact property keys 'Wattage' and 'Luminous Flux'
    and exact value strings '15 W' and '806 lm', but the database may store them differently
    (e.g., 'Wattage (W)', '15W', 'Luminous Flux (lm)', '806lm'). The query returned
    0 rows, leading to OUTCOME_NONE_UNSUPPORTED. The plan should first explore the
    product_variant_properties table to discover the actual keys and value formats
    for the given property names, then use those in the matching query.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the plan's required refs specify a source path like '$row.record_path',
    the answer ref must use that exact source path. If the rowset is bound to a plural
    name, set a variable named 'row' to the first row via a compute step, then reference
    '$row.record_path' in the answer ref.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'The error ''interpret: unresolved required ref(s) ["$row.record_path"]
    on OK answer'' indicates the answer ref source ''$record_path'' does not match
    the required ref source ''$row.record_path'' from the plan. The script computed
    a variable ''$record_path'' from the first row, but the plan expects a ref sourced
    from ''$row.record_path''. The fix is to bind the first row to a variable named
    ''row'' and use ''$row.record_path'' as the answer ref source, or directly set
    ''$row.record_path'' as the source.'
  status: inactive
  surface: ir
