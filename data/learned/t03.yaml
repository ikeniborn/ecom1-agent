- agents_md_anchor: null
  content: 'Existence query ("is X in the catalogue"/"do you carry X"). MATCH MINIMALLY:
    brand + ONE distinctive model/series token via normalized LIKE (LOWER/TRIM) on
    a SHORT fragment; do NOT add extra variant-property JOINs/EXISTS unless one token
    is genuinely insufficient — over-constraining yields a false 0-row ''absent''
    for a present product. For ''regular or flat''/''bare or kit'' alternants match
    ANY variant (OR), never require all. SELECT the record_path column. COMPUTE match_count=count(rows);
    first_record=first(rows). DECIDE match_count ge 1 -> label found else label absent.
    ANSWER (single top-level mapping, NO Answer op in ops): found.message contains
    the literal token <YES> and found.refs=[$first_record.record_path]; absent.message
    contains the literal token <NO> and absent.refs=[]. INTENT: required_refs[OUTCOME_OK]=[]
    (record_path is CONDITIONAL, authored per-branch); outcome_space=[OUTCOME_OK].
    NEVER answer CLARIFICATION/UNSUPPORTED — ''absent'' is OUTCOME_OK with <NO>. Read
    single-record fields with get, never column.'
  created: '2026-06-18'
  deactivated_reason: null
  id: rc1
  reasoning: Consolidated authoritative method rule (rule-overload fix, mirrors t01).
    Folds the learnable-INTENT + conditional-grounding levers + family method; replaces
    accumulated ref-shaping rules that caused 5-6 cycle non-convergence -> empty CLARIFICATION.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never attach a 'params' field to an Exec RPC — ExecRequest has no params
    field, so any ':name' bind placeholders in the SQL stdin cannot be substituted;
    inline the literal brand/model values directly into the stdin SQL string (already
    LOWER/TRIM-normalized) instead of using bind parameters.
  created: '2026-06-18'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: ''real_vm: Protocol message ExecRequest has no "params"
    field.'' Root cause: discovery RPC built SQL with bind placeholders (:brand, :model_token)
    and tried to supply them via args.params: {"brand":"Bernardo","model_token":"3OB"}.
    The VM''s ExecRequest schema only accepts path/args/stdin — the extra ''params''
    key is rejected at the protocol layer before any SQL runs. Failing PlanIR fragment:
    discovery[0].args.params plus the '':brand''/'':model_token'' placeholders in
    stdin. The existing rc1 rule correctly shaped the existence query (brand + ONE
    token, normalized LIKE, record_path, match_count/first_record, found/absent branches)
    but said nothing about how Exec carries values; this rule closes that gap by forbidding
    the unsupported params channel and requiring inlined literals in stdin.'
  status: active
  surface: ir
