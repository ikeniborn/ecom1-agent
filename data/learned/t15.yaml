- agents_md_anchor: null
  content: When required refs specify source paths like $store.record_path or $products.N.record_path,
    the PlanIR must bind those exact dotted variable paths in compute steps and use
    them in the answer block's refs, not simplified names.
  created: '2026-06-22'
  deactivated_reason: r008 required binding flat variables with dotted names, which
    caused interpret failure; superseded by r009 and the new rule.
  id: r008
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$products.0.record_path'', ...]. The PlanIR answer block used refs with source
    ''$store_path'' and ''$prod0_path'', but the required refs demanded ''$store.record_path''
    and ''$products.0.record_path''. The compute steps bound the simpler names, so
    the interpreter could not resolve the required refs. Root cause: mismatch between
    variable paths in answer refs and the required refs'' source paths. Failing PlanIR
    fragment: answer.ok.refs with source ''$store_path'', ''$prod0_path'', etc.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When required refs use dotted source paths (e.g., $store.record_path),
    the PlanIR must set the parent variable as an object containing the leaf field,
    not as a flat variable with the dotted name.
  created: '2026-06-22'
  deactivated_reason: r009 instructs to set parent as object, which prevents the interpreter
    from resolving dotted required refs; superseded by the new rule that requires
    flat variables with dotted names.
  id: r009
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'',
    ''$products.0.record_path'', ...]. Root cause: The PlanIR compute steps set flat
    variables like ''$store_path'' and ''$products.0.record_path'' (literal dotted
    names), but the interpreter resolves dotted source paths by navigating nested
    variables. It expected a ''$store'' object with a ''record_path'' field and a
    ''$products'' array of objects each with ''record_path''. Because those parent
    variables were never set, all required refs were unresolved. The in-session rule
    that advised binding exact dotted variable paths as flat names is incorrect and
    led to this failure.'
  status: inactive
  surface: ir
