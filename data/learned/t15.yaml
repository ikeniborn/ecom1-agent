- agents_md_anchor: '#important-things > availability'
  content: When the answer must reference matching products (availability/count tasks),
    make the ops query SELECT the individual product_sku of each matching variant
    rather than only COUNT(*), then include every matching product's catalog ref path
    in vm.answer refs — an aggregate-only query discards the per-item SKUs the grader
    requires as references.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/proc/catalog/storage/bins_organizers/STO-D0B4ZK0E.json''".
    Root cause: ops SQL is `SELECT COUNT(*) AS available_count ...` — it collapses
    matched variants into a single number and never returns the individual product_sku
    values, so the script''s refs list only ever contains store_path. The availability
    constraint (#important-things > availability) requires the answer to reference
    the products that are available; the grader enforces this by demanding each matching
    variant''s catalog JSON path (e.g. STO-D0B4ZK0E for the Raaco storage bin). Failing
    fragment: `SELECT COUNT(*) AS available_count FROM prod p JOIN store_inventory
    si ...` plus `refs = []; if store_path: refs.append(store_path)`. Linkage: extends
    r002 (extract refs from output rows) to a structural cause — the rows themselves
    lack the needed SKUs because the query aggregates; fix is to also return per-variant
    SKUs and emit their catalog refs.'
  status: active
