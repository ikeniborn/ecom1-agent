- agents_md_anchor: '#important-tools > sql'
  content: When filtering variants by property values in SQL, do not assume every
    property lives in property_value_text — numeric discriminators (length_mm, voltage_v,
    wattage_w, luminous_flux_lm, etc.) are commonly stored in a numeric column (property_value_num),
    so a `property_value_text = :bind` predicate silently fails to match and drops
    that variant; compare each property against BOTH typed columns (e.g. `(p.property_value_text
    = :v OR CAST(p.property_value_num AS TEXT) = :v)`) so numeric-keyed products still
    match and their required catalog refs reach vm.answer.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: grader: answer missing required reference ''/proc/catalog/automotive/wiper_blades/AUT-2D3E2A2Y.json''.
    Root cause: the script already emits per-SKU refs (r003 applied), so the Michelin
    wiper blade is available (qty>=3) yet its ref is absent — meaning the variant
    was never matched, not merely unreferenced. Failing fragment: every property EXISTS
    subquery checks only `p.property_value_text = prod.vN` (e.g. michelin length_mm=''650'').
    A numeric discriminator stored in property_value_num never equals the text bind,
    so the AND-chained predicate excludes product 4 entirely, dropping its required
    catalog ref. Other numeric products (Makita/Milwaukee voltage, Osram wattage)
    hit the same defect but did not surface because they were not available, so the
    grader required no ref for them. Linkage: extends r001/r002/r003 (parsing, runtime
    refs, per-SKU refs) by addressing the upstream match failure that empties refs
    for genuinely-available items.'
  status: active
- agents_md_anchor: '#important-things > availability'
  content: When matching a variant's text property values in /bin/sql, compare case-
    and whitespace-insensitively (use `property_value_text = :v COLLATE NOCASE` or
    `LOWER(TRIM(property_value_text)) = LOWER(TRIM(:v))`) instead of strict `property_value_text
    = :v`; the catalog stores property values with casing/spacing that often differs
    from the plan params, so exact equality silently drops every matching variant,
    returning no rows and leaving the count at 0 with refs empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ([\''$available_paths\'']) but actual refs [] contain only static template
    entries [] — SQL likely returned no rows''. Discovery succeeded (store_graz_lend
    resolved), but the per-variant UNION ALL ops query returned <empty>, so paths=[]
    → count=0 and refs=[]. The harness treats this as a failure, meaning matching
    available variants exist but were not found, i.e. the query is over-constrained.
    Failing fragment: the codegen emits exact text predicates `p0_0.property_value_text=''screen
    wash''` ... `p5_1.property_value_text=''Clear''` (note capitalized ''Clear'').
    SQLite `=` on TEXT is case- and whitespace-sensitive; any divergence between the
    plan param casing/spacing and the stored value drops that variant. This is distinct
    from r004 (numeric typed-column handling) and r001 (CSV parsing): both numeric
    typing and parsing are already handled correctly here, so the residual silent-drop
    cause is strict text equality. Rule links failing fragment → root cause (case-sensitive
    text match) → fix (COLLATE NOCASE / LOWER+TRIM).'
  status: active
