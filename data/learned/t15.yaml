- agents_md_anchor: null
  content: When the task requires resolving multiple items from a specification, use
    discovery steps to query the relevant tables for each item, extract the identifier
    column into a rowset, and then use concat to merge the identifier rowsets before
    using them in a subsequent query. Do not call concat with a single literal list;
    always provide two rowsets as arguments.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'The PlanIR omitted discovery steps to resolve product SKUs from the
    instruction. The concat step was called with a single empty list literal, violating
    the concat contract (requires two list[dict] rowsets). The inventory query referenced
    :skus_json, which was never populated. Root cause: missing product lookup steps.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include a decision block in the PlanIR after discovery steps, even
    if the outcome is unconditional.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'PlanIR validation failed: ''decision'' field missing. The generated
    PlanIR had only discovery steps but no decision block, which is required. The
    rule ensures the PlanIR always contains a decision block.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When success criteria reference $answer.<field>, ensure the PlanIR's answer
    block includes a data field with that field set to the computed value, or use
    a compute step that sets answer.data.<field>.
  created: '2026-06-21'
  deactivated_reason: Superseded by new rule that explicitly requires the answer block
    to include a 'data' object when success criteria reference $answer.data.<field>.
  id: r003
  reasoning: The verify step failed because $answer.count was undefined. The PlanIR
    only set a compute variable 'count' to 0 but did not bind it to the answer's data.
    The answer block only had a message. The success criteria expected $answer.count
    to be a number. The rule ensures the answer object contains the required data
    fields for verification.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When success criteria reference $answer.<field>, the PlanIR must set answer.data.<field>
    to the computed value, either via a compute step that sets answer.data.<field>
    or by including a data field in the answer block.
  created: '2026-06-21'
  deactivated_reason: r004 is superseded by the new rule, which clarifies that the
    answer block must include a 'data' object when success criteria reference $answer.data.<field>,
    not just rely on a compute step.
  id: r004
  reasoning: 'The verify error: success_criteria[OUTCOME_OK][0] failed because it
    expected $answer.count but the answer block only had a message template with {count}
    and no data field. The compute step set a variable ''count'' but did not map it
    to answer.data.count. The PlanIR must ensure that any field referenced in success
    criteria is present in the answer''s data object.'
  status: inactive
  surface: ir
