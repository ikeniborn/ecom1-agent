entries:
- agents_md_anchor: '#important-tools > sql'
  content: When parsing /bin/sql stdout, split each row on commas matching the emitted
    CSV header line and skip the header row — the sql tool returns comma-delimited
    rows, so splitting on '|' (or any non-comma delimiter) matches nothing and drops
    every data row, leaving refs empty even when the query returns results.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$available_paths'']) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column". Root
    cause: SCRIPT_CODE parses sql output with `if "|" not in line: continue` then
    `cols = line.split("|")`, but OBSERVED_RPC_OUTPUTS shows /bin/sql emits CSV (`store_id,store_name\nstore_salzburg_elisabeth_vorstadt,PowerTool...`)
    — comma-delimited with a header line, no pipes. Failing fragment: every data line
    lacks ''|'', so the loop `continue`s on all rows and `paths` stays empty regardless
    of query results, forcing refs=[] and the answer_refs failure. Rule linkage: codegen
    must split sql output on commas per the CSV header, not on ''|'', so record_path
    column is extracted into runtime refs.'
  status: active
- agents_md_anchor: null
  content: When the answer_template or constraints declare a runtime ref placeholder
    (e.g. $store_path), the script must extract that value from the resolving discovery/ops
    SQL output rows and pass it into vm.answer refs; never hardcode refs to an empty
    list, which fails runtime-ref validation even when the query succeeds.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ([''$store_path'']) but actual refs [] contain only static template entries
    []''. Root cause: answer_template.refs declared the runtime placeholder $store_path,
    but CODEGEN hardcoded `refs = []` with comment ''$store_path cannot be bound to
    a filesystem path here; keep only static refs (none)''. The script ran the discovery
    query (returning store_id store_bratislava_stare_mesto) yet never parsed that
    output to resolve $store_path, then emitted vm.answer(refs=refs) with an empty
    list — so the harness saw zero runtime refs and rejected. Failing fragment: `refs
    = []` followed by `vm.answer(..., refs=refs)`. Rule linkage: distinct from r001
    (which covers CSV delimiter parsing of stdout); this rule covers populating declared
    runtime ref placeholders from query output instead of dropping them.'
  status: active
