- agents_md_anchor: null
  content: When success criteria reference $answer.data.<field>, the PlanIR's answer
    block must include a 'data' object containing that field set to the computed value.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: The verify step failed because success_criteria[OUTCOME_OK][0] expected
    $answer.data.count >= 0, but the answer block lacked a 'data' field, causing the
    reference to be undefined. The compute step set answer.data.count, but the answer
    block did not include a data object, so the final answer structure did not contain
    the required field. The SQL query returned count 0, which would satisfy the criteria
    if properly included.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When success criteria reference $answer.data.<field>, the PlanIR answer
    block must include a 'data' object (even if empty) so that compute steps can set
    its fields.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The verify step failed because $answer.data.count was undefined. The
    SQL query returned 0, which satisfies the 'ge 0' condition, but the answer block
    lacked a 'data' object. The compute step 'first' attempted to set answer.data.count,
    but without a pre-existing 'data' object in the answer block, the field was not
    created, causing the verification to fail. The existing rule r004 allowed either
    a compute step or a data field, but the compute step alone was insufficient; the
    answer block must explicitly include a 'data' object.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When success criteria reference $answer.data.<field>, the PlanIR answer
    block for that outcome must include a 'data' object with that field set to the
    computed value, not rely on a separate compute step to set answer.data.<field>.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The PlanIR answer block for OUTCOME_OK lacked a 'data' object, causing
    the success criteria check on $answer.data.count to fail because the field was
    not present in the final answer. The existing in-session rule required a data
    object but was not followed. A new rule will enforce that the answer block directly
    includes the data object with the computed field.
  status: inactive
  surface: ir
