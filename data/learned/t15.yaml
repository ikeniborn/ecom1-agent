- agents_md_anchor: null
  content: Always include all required references in the answer refs by extracting
    the necessary record paths from the data and adding them to the answer's refs
    list.
  created: '2026-06-22'
  deactivated_reason: Superseded by more specific rule that mandates exact source
    paths and inclusion in answer refs.
  id: r013
  reasoning: 'Error: ''grader: answer missing required reference ''/proc/catalog/automotive/chargers_bulbs/AUT-OUBI8TMR.json''''.
    The PlanIR answer section had no refs, but the grader expected a specific record
    path. Root cause: the PlanIR did not extract and include the required reference.
    The rule ensures future plans will populate answer refs when required_refs are
    non-empty.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required ref uses a dotted source path (e.g., $store.record_path),
    the PlanIR must ensure that the object assigned to the parent variable has a property
    whose name exactly matches the leaf field (e.g., 'record_path'). If the data source
    provides a column with a different name, alias it in the SQL query or rename it
    in a compute step.
  created: '2026-06-22'
  deactivated_reason: null
  id: r014
  reasoning: 'Error: interpret: unresolved required refs [''$store.record_path'']
    on OK answer. Root cause: The SQL query aliased the store''s record_path column
    as ''store_record_path'', but the answer ref expected the leaf field ''record_path''.
    The PlanIR set $store as the first row of the rowset, so $store had a property
    ''store_record_path'' instead of ''record_path'', causing the dotted ref to fail.
    Existing rule r011 correctly requires using an object with the leaf field, but
    did not enforce exact naming alignment between the column alias and the required
    ref''s leaf name. The failing PlanIR fragment: SQL alias ''store_record_path''
    and answer ref source ''$store.record_path''.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'When a required ref uses a dotted source path that depends on a lookup
    that may return no rows (e.g., a store query), always ensure the parent variable
    is set to a fallback object containing the required leaf property (e.g., { record_path:
    null }) so the ref resolves even when the lookup fails. Use a decision branch
    or a compute default to provide this fallback before the answer step.'
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: 'The error ''interpret: unresolved required ref(s) [''$store.record_path'']
    on OK answer'' indicates the interpreter could not resolve the path $store.record_path,
    most likely because the store lookup returned no rows, leaving $store null or
    undefined. The PlanIR''s SQL returns a row with NULL record_path when the store
    is missing, but the interpreter''s first() may still produce a null $store, or
    the required ref resolution treats a null parent as unresolvable. The fix is to
    guarantee $store is always an object with a record_path property, e.g., by adding
    a decision branch that sets $store to { record_path: null } when the store is
    not found, so the ref resolves to null rather than failing.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When the intent spec defines required refs for an outcome, the PlanIR must
    include those refs in the answer step's refs list, using the exact source paths
    specified. Do not omit them.
  created: '2026-06-22'
  deactivated_reason: null
  id: r016
  reasoning: 'Error: interpret: unresolved required ref(s) [''$store.record_path'']
    on OK answer. Root cause: The PlanIR answer step''s refs list is empty, so the
    required ref $store.record_path is missing. The PlanIR correctly set $store as
    an object with a record_path property, but failed to add the ref to the answer.
    Existing rule r013 covers this generally but was not followed; a more explicit
    rule is needed to enforce inclusion of exact source paths.'
  status: active
  surface: ir
