- agents_md_anchor: null
  content: When required refs use dotted source paths (e.g., $product_0.record_path),
    the PlanIR must bind a flat variable with that exact dotted name by extracting
    the leaf field from the parent object, and use that variable in the answer refs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product_0.record_path'',
    ...] on OK answer. The PlanIR set parent objects (e.g., product_0) and used dotted
    refs in the answer block, but the interpreter could not resolve them. The interpreter
    expects flat variables with the exact dotted name (e.g., a variable literally
    named ''$product_0.record_path'') to satisfy required refs. Existing rule r009
    (set parent as object) contradicts this requirement and caused the failure. Rule
    r008 already hints at binding the exact dotted path, but was not followed. This
    new rule clarifies the correct technique and supersedes r009.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When required refs use dotted source paths (e.g., $store.record_path),
    the PlanIR must set the parent variable as an object containing the leaf field
    (e.g., set $store as an object with a record_path property), and use the dotted
    path in the answer refs. Do not set a flat variable with the dotted name.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: The interpret phase failed with 'unresolved required ref(s)' for all
    dotted refs. The PlanIR set flat variables named '$store.record_path' etc. via
    compute steps, but the interpret phase expects the parent object to exist so that
    dotted refs resolve as property access. Existing rule r009 correctly mandates
    setting the parent object, but the PlanIR followed the contradictory in-session
    rule. Deactivating r008 which incorrectly required flat dotted variable names.
  status: inactive
  surface: ir
