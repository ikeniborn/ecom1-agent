- agents_md_anchor: null
  content: Do not extract required refs by hardcoded index from a rowset that may
    be incomplete before confirming the rowset contains all expected items; instead,
    check a completeness flag or count first, and only perform the extractions if
    the flag indicates all items are present, or move the extractions into the decision
    branch's ops to avoid triggering clarification when items are missing.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: The PlanIR unconditionally extracts $product_0.record_path through $product_5.record_path
    from $product_rows by index (0..5) in the global compute block. If the SQL query
    returns fewer than 6 product rows (some products not matched), accessing a missing
    index fails, causing the interpreter to abort with OUTCOME_NONE_CLARIFICATION
    before reaching the decision block. The decision block correctly checks $all_found
    to branch to 'unsupported' when not all products are found, but the extraction
    failure prevents reaching that logic. The fix is to guard the extractions behind
    the completeness check or move them into the 'ok' branch's ops.
  status: inactive
  surface: ir
