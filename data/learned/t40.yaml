    or hardcoded archive file path such as ''/proc/payments/archive.zip'' in SDD or
    PLAN actions; instead always emit ''tree:/proc/payments/'' as the initial concrete
    PLAN action to reveal actual archive containers; and after such a listing discovers
    archive files, never allow the PLAN action to be empty—always emit a concrete
