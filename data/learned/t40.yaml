    all payment records under /data/payments/ that belong to the known fraud hit',
    always first query /bin/sql against sqlite_master to discover all table names,
    and then obtain the column names of each candidate table using 'PRAGMA table_info'
    or 'SELECT sql FROM sqlite_master WHERE name=...'. Use only those verified column
    names when constructing queries; do not hardcode column names like 'fraud_flag'
    or 'status' until you have verified they exist in the table's schema. Then query
    payment-adjacent tables for fraud-related fields (e.g., fraud_flag, is_fraud,
    fraud_status, or specific transaction IDs). If no fraud_flag column is found in
    any payment-adjacent table, explore other tables (e.g., fraud_hits) and alternative
    columns to locate fraud-associated identifiers. Use the resulting identifiers
    (e.g., transaction_id, path, file_name) to locate and cite the corresponding files
    under /data/payments/. Never request clarification when the spec_goal mentions
    a 'known fraud hit' without explicit identifier; instead, always query the database
    for a table named 'fraud_hits' or any table containing fraud case identifiers
    (e.g., hit_id, fraud_case_id, transaction_id) and retrieve those identifiers to
    join with payment records; only request clarification after fully exploring all
    tables and finding no fraud-related data.
  created: '2026-05-21'
  deactivated_reason: These rules reference /data/payments/ which is not the payment
    directory in this task; the task uses /proc/payments/. The new rule corrects the
    path and consolidates the behavior, making these obsolete.
  id: r008
  reasoning: r006 and r007 both address the same spec_goal about identifying payment
    records belonging to a known fraud hit. r006 provides a detailed procedural flow
    for querying the database and locating files; r007 explicitly forbids premature
    clarification and emphasizes exploring all tables before asking. These rules overlap
    completely in scope and are consistent. r007 (higher id) is used as the base and
    extended with the step-by-step guidance from r006. r001 is unrelated (search location)
    and is not part of this consolidation.
  source: learn
  status: inactive
- content: Always, for the spec_goal 'Identify and cite every payment record under
    /data/payments/ that belongs to the known fraud hit discovered from the database',
    after retrieving the fraud hit identifier from the database, query all tables
    that potentially contain file paths (e.g., payments, payment_files, transactions)
    using PRAGMA table_info to find columns like path, file_path, or filename. Join
    the fraud hit identifier with rows in such tables to obtain concrete file paths.
    Only if no mapping table exists should you fall back to searching file contents
    or filenames with the identifier.
  created: '2026-05-21'
  deactivated_reason: These rules reference /data/payments/ which is not the payment
    directory in this task; the task uses /proc/payments/. The new rule corrects the
    path and consolidates the behavior, making these obsolete.
  id: r009
  reasoning: 'Verbatim error: ''Empty result''. Root cause category: empty-result.
    The SDD_OUTPUT plan assumed existence of a ''fraud_hits'' table and that the identifier
    could be directly used to search /data/payments/ via grep (action ''search:${FRAUD_HIT_ID}
    /data/payments/''). This resulted in no matches because the connection between
    the fraud hit identifier and actual payment file paths was missing. The spec_goal
    specified ''Identify and cite every payment record under /data/payments/ that
    belongs to the known fraud hit discovered from the database'', but the plan did
    not include a step to query the database for a table that maps fraud identifiers
    to file paths (e.g., payments, payment_files, transactions). The existing rule
    r008 correctly guides schema exploration but does not mandate joining fraud identifiers
    with a file-path table before resorting to filesystem search. This gap caused
    the empty result.'
  source: learn
  status: inactive
- content: Never request clarification for the spec_goal 'Identify and cite every
    payment record under /proc/payments/ that belongs to the known fraud hit discovered
    from the database'; instead, always query /bin/sql against sqlite_master to discover
    all table names, then obtain column names using PRAGMA table_info, and explore
    all tables for fraud-related fields (e.g., fraud_hits table, fraud_flag, is_fraud,
    hit_id, transaction_id). Only after fully exploring all tables and finding no
    fraud-related data should you request clarification. For any spec_goal targeting
    /proc/payments/, treat the identical logic as previously applied to /data/payments/.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r010'
  id: r010
  reasoning: 'Verbatim error: ''ANSWER clarification: The task references a known
    fraud hit in older payment history, but no identifier or criteria for that hit
    were provided. I need clarification on what constitutes the fraud hit (e.g., transaction
    ID,''. Root cause category: ''wrong-action'' – agent requested clarification instead
    of continuing to explore database tables. Failing fragment: spec_goal ''Identify
    and cite every payment record under /proc/payments/ that belongs to the known
    fraud hit discovered from the database'' and the action ''SELECT name FROM sqlite_master
    ...'' which was not followed by further table exploration. Rule linkage: existing
    rule r008 explicitly forbids requesting clarification for this spec_goal and mandates
    full table exploration before asking, but the agent violated it, likely because
    r008 references /data/payments/ while the spec uses /proc/payments/, causing the
    agent to treat the rule as inapplicable.'
  source: learn
  status: inactive
- content: Never search in /proc/ for payment records or historical data, except when
    the spec_goal explicitly requires identifying records under /proc/payments/ (e.g.,
    'Identify and cite every payment record under /proc/payments/ that belongs to
    the known fraud hit discovered from the database'). In such cases, always query
    /bin/sql against sqlite_master to discover all table names, obtain column names
    using PRAGMA table_info, and explore all tables for fraud-related fields (e.g.,
    fraud_hits table, fraud_flag, is_fraud, hit_id, transaction_id). Only after fully
    exploring all tables and finding no fraud-related data should you request clarification.
    For any spec_goal targeting /proc/payments/, treat the identical logic as previously
    applied to /data/payments/.
  created: '2026-05-21'
  deactivated_reason: r011 mandated the exact action that led to the repeated query
    error; the new rule supersedes it by restricting repetition and guiding to the
    next step.
  id: r011
  reasoning: 'Merged r001 (general prohibition on searching /proc/ for payments) with
    r010 (specific process for spec_goal targeting /proc/payments/). The two rules
    contradict: r001 says never search in /proc/, r010 says to do so for a specific
    goal. The merged rule resolves the conflict by adding an exception for the spec_goal
    while retaining the general prohibition. r010''s process logic is incorporated
    verbatim as the highest-id rule.'
  source: learn
  status: inactive
- content: Never repeat the query 'SELECT name FROM sqlite_master WHERE type='table'
    ORDER BY name' in consecutive actions; after the first successful execution, proceed
    to examine the columns of the discovered tables using PRAGMA table_info without
    re-querying sqlite_master. This applies to spec_goal 'Identify and cite every
    payment record under /proc/payments/ that belongs to the known fraud hit discovered
    from the database.'
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r012'
  id: r012
  reasoning: 'Verbatim error: ''Repeated action detected — must use a different query
    or approach. Action was: SELECT name FROM sqlite_master WHERE type=''table'' ORDER
    BY name''. Root cause: wrong-action because the same schema discovery query was
    executed again instead of progressing to column inspection. Failing fragment:
    the action string ''SELECT name FROM sqlite_master WHERE type=''table'' ORDER
    BY name'' from SDD_OUTPUT/PLAN_OUTPUT. Rule linkage: new rule must prevent repeating
    this action and mandate a different next step.'
  source: learn
  status: inactive
- content: Always query the database (sqlite_master and PRAGMA table_info on all tables)
    to discover any fraud-related tables or columns (e.g., fraud_hits, fraud_flag,
    is_fraud) before requesting clarification on a known fraud hit. Only after fully
    examining all tables and finding no fraud-related identifiers should clarification
    be requested. This applies to spec_goal 'Identify and cite all payment record
    files under /data/payments/ that belong to the known fraud hit discovered from
    the database.'
  created: '2026-05-21'
  deactivated_reason: null
  id: r013
  reasoning: 'Verbatim error: ''The task references a known fraud hit but does not
    specify which hit. Please provide an identifier (e.g., payment ID, customer ID,
    date range, or the fraud case reference) so the specific payment records can be
    located.'' Root cause: wrong-spec — the spec_goal intended the fraud hit to be
    discovered from the database, but the assistant prematurely requested a human-provided
    identifier instead of querying the database. Failing fragment: spec_goal ''Identify
    and cite all payment record files under /data/payments/ that belong to the known
    fraud hit discovered from the database.'' Rule linkage: the new rule must enforce
    that the database is queried first per the spec_goal''s assumption that the hit
    is discoverable there.'
  source: learn
  status: active
- content: Always query the database (sqlite_master and PRAGMA table_info on all tables)
    to discover any fraud-related tables or columns (e.g., fraud_hits, fraud_flag,
    is_fraud) before requesting clarification on a known fraud hit. Only after fully
    examining all tables and finding no fraud-related identifiers should clarification
    be requested. Never repeat the sqlite_master query in consecutive actions; after
    the first successful execution, proceed to examine the columns of the discovered
    tables using PRAGMA table_info without re-querying sqlite_master. This applies
    to spec_goals that require identifying and citing payment records belonging to
    a known fraud hit discovered from the database.
  created: '2026-05-21'
  deactivated_reason: null
  id: r014
  reasoning: Merged r013 (higher id, broader rule) with r012 (specific constraint
    on not repeating sqlite_master query). r012's additional restriction is compatible
    and fills a gap; deactivating r012 reduces redundancy while preserving all guidance.
  source: learn
  status: active
