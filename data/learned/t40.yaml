- agents_md_anchor: null
  content: Always structure the PlanIR so that the default decision branch performs
    the task required for the desired outcome, including discovery of all required
    refs and data sources, and produces an answer block that matches the answer_shape
    and required refs for that outcome.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more explicit rule that mandates populating
    discovery and rowsets sections when data retrieval is required.
  id: r004
  reasoning: The PlanIR script only implemented the security check and set both decision
    branches to OUTCOME_DENIED_SECURITY. It omitted discovery of the fraud policy
    document /docs/payments/3ds.md and the payment data archive, and made no attempt
    to identify fraudulent records. The interpreter, expecting a path to OUTCOME_OK,
    found none and returned OUTCOME_NONE_CLARIFICATION. The root cause is that the
    PLAN phase did not build a default branch that pursues the objective. Existing
    rule r003 mandates the default branch produce the desired outcome, but it was
    not followed; additionally, no discovery for the task was included. A new rule
    is needed to enforce that the default branch always includes the necessary discovery
    and compute to achieve the desired outcome.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When using filter_rows, provide exactly two arguments: the rows list and
    a predicate function. Do not pass column name, operator, and value as separate
    arguments; instead, construct a predicate that takes a row and returns a boolean
    (e.g., using a lambda or a predicate expression).'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'The PlanIR called filter_rows with 4 arguments: rows, column name, operator,
    and value. The contract requires exactly 2 arguments: rows (list[dict]) and pred
    (function). This caused the interpret error. The new rule clarifies the correct
    argument structure for filter_rows.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using Read RPC to retrieve a document for content inspection, always
    extract the text content from the response (e.g., via a compute step using get
    or extract) before applying string operations like contains_any; do not pass the
    raw response object directly to contains_any.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: ''real_vm: Protocol message ReadResponse has no "guest denied"
    field.'' The PlanIR used contains_any on the raw Read response object $security_doc,
    expecting it to be a string. The Read RPC returns a structured protobuf message,
    not a plain string. The decision block''s condition ''contains_any($security_doc,
    ["guest denied", ...])'' failed because the VM tried to find a field named ''guest
    denied'' in the ReadResponse message. The fix is to first extract the document''s
    text content (e.g., via a compute step like ''get($security_doc, "content")'')
    and then apply contains_any to that extracted string.'
  status: active
  surface: ir
