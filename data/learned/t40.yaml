entries:
- content: Never search in /proc/ for archived payment records or historical data;
    instead, use /bin/sql to query the database or search in a designated file system
    directory (e.g., /data/payments/).
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r001, r010'
  id: r001
  reasoning: 'Verbatim error: ''ERROR: Empty result: ''. Root cause: wrong-spec -
    the spec_goal ''Identify and cite every payment record that belongs to the confirmed
    fraud hit in the older archived payment history.'' and action ''search:fraud /proc/''
    incorrectly assumed payment records are stored in /proc/, which is a virtual filesystem
    for processes, not archived data. This led to an empty result. Rule linkage: new
    rule will cite the action identifier ''search:fraud /proc/'' and spec_goal phrase
    ''older archived payment history''.'
  source: learn
  status: inactive
- content: Never assume that fraud records are literally tagged with the keyword 'fraud'
    in the payment files under /data/payments/; instead, for the spec_goal 'Identify
    and cite all payment records under /data/payments/ that belong to the known fraud
    hit', first query /bin/sql for fraud-related fields (e.g., a 'fraud_flag' column
    or specific transaction IDs) and use the resulting identifiers to locate and cite
    the corresponding files.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003'
  id: r002
  reasoning: 'Verbatim error: ''search failed: not found''. Root cause category: wrong-filter
    — the filter ''fraud'' was assumed to appear literally in payment files under
    /data/payments/, but no files matched. Failing fragment: spec_goal phrase ''Identify
    and cite all payment records under /data/payments/ that belong to the known fraud
    hit'' and action ''search:fraud /data/payments/''. Rule linkage: new rule must
    forbid assuming keyword presence and instead require obtaining specific identifiers
    from Risk Ops or querying the database.'
  source: learn
  status: inactive
- content: Always first query sqlite_master to discover all tables and their schemas
    before executing any query against a specific table; for the spec_goal 'Identify
    and cite all payment records under the payments directory that belong to the known
    fraud hit', if no fraud_flag column is found in any payment-adjacent table, explore
    other tables (e.g., fraud_hits) and alternative columns (e.g., is_fraud, fraud_status)
    to locate fraud-associated identifiers.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002, r003'
  id: r003
  reasoning: 'Verbatim error: ''Empty result:'' from action ''SELECT t.id, t.file_name,
    t.transaction_id, t.fraud_flag FROM payments t WHERE t.fraud_flag IS NOT NULL
    AND t.fraud_flag != '''';''. Root cause category: wrong-spec (spec assumed existence
    of table ''payments'' and column ''fraud_flag'' without verification). Failing
    fragment: action in PLAN_OUTPUT that directly queried assumed table/column without
    schema discovery. Rule linkage: new rule must enforce schema discovery before
    assuming any table/column for the spec_goal ''Identify and cite all payment records
    under the payments directory that belong to the known fraud hit''.'
  source: learn
  status: inactive
- content: Never assume that fraud records are literally tagged with the keyword 'fraud'
    in the payment files under /data/payments/. Instead, for the spec_goal 'Identify
    and cite all payment records under /data/payments/ that belong to the known fraud
    hit', first query /bin/sql against sqlite_master to discover all tables and their
    schemas. Then query payment-adjacent tables for fraud-related fields (e.g., fraud_flag,
    is_fraud, fraud_status, or specific transaction IDs). If no fraud_flag column
    is found in any payment-adjacent table, explore other tables (e.g., fraud_hits)
    and alternative columns to locate fraud-associated identifiers. Use the resulting
    identifiers (e.g., transaction_id, path, file_name) to locate and cite the corresponding
    files under /data/payments/. Do not ask for clarification if such a column exists;
    only request clarification if no fraud-related column is found in any table.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r004, r005'
  id: r004
  reasoning: 'Merged r002 (about not assuming keyword ''fraud'' and using /bin/sql
    for fraud fields) with r003 (about first querying sqlite_master and exploring
    alternative tables/columns). The merged rule combines the full workflow: discover
    schema, identify fraud columns by various names, fall back to other tables if
    needed, and use the identifiers to locate files. r001 is distinct and not included.'
  source: learn
  status: inactive
- content: Always, after querying sqlite_master for table names, obtain the column
    names of each candidate table using 'PRAGMA table_info' or 'SELECT sql FROM sqlite_master
    WHERE name=...' and use only those column names when constructing queries. For
    the spec_goal 'Identify and cite all payment records under /data/payments/ that
    belong to the known fraud hit', do not hardcode column names like 'fraud_flag'
    or 'status' until you have verified they exist in the table's schema.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r004, r005'
  id: r005
  reasoning: 'Verbatim error: ''Empty result: ''. Root cause category: wrong-column.
    Failing fragment: action ''SELECT * FROM fraud_hits WHERE fraud_flag = 1 OR status
    LIKE ''%confirm%'' LIMIT 5'' from SDD_OUTPUT actions. The spec_goal ''Identify
    and cite all payment records under /data/payments/ that belong to the known fraud
    hit'' assumes existence of an entity and columns that may not match reality. The
    agent did not verify the table''s schema before using column names ''fraud_flag''
    and ''status'', causing an empty result. New rule prevents hardcoding column names
    without schema confirmation.'
  source: learn
  status: inactive
- content: Never assume that fraud records are literally tagged with the keyword 'fraud'
    in the payment files under /data/payments/. For the spec_goal 'Identify and cite
    all payment records under /data/payments/ that belong to the known fraud hit',
    always first query /bin/sql against sqlite_master to discover all table names,
    and then obtain the column names of each candidate table using 'PRAGMA table_info'
    or 'SELECT sql FROM sqlite_master WHERE name=...'. Use only those verified column
    names when constructing queries; do not hardcode column names like 'fraud_flag'
    or 'status' until you have verified they exist in the table's schema. Then query
    payment-adjacent tables for fraud-related fields (e.g., fraud_flag, is_fraud,
    fraud_status, or specific transaction IDs). If no fraud_flag column is found in
    any payment-adjacent table, explore other tables (e.g., fraud_hits) and alternative
    columns to locate fraud-associated identifiers. Use the resulting identifiers
    (e.g., transaction_id, path, file_name) to locate and cite the corresponding files
    under /data/payments/. Do not ask for clarification if such a column exists; only
    request clarification if no fraud-related column is found in any table.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r006, r007'
  id: r006
  reasoning: r004 and r005 both target the same spec_goal ('Identify and cite all
    payment records under /data/payments/ that belong to the known fraud hit'). r005
    extends r004 by mandating the use of PRAGMA table_info to verify column names
    and prohibiting hardcoded column names. r004 adds the initial principle (never
    assume 'fraud' keyword) and the fallback exploration of other tables. Merging
    them into one comprehensive rule eliminates redundancy and ensures all steps are
    captured as a single directive.
  source: learn
  status: inactive
- content: Never request clarification when the spec_goal mentions a 'known fraud
    hit' without explicit identifier; instead, always query the database for a table
    named 'fraud_hits' or any table containing fraud case identifiers (e.g., hit_id,
    fraud_case_id, transaction_id) and retrieve those identifiers to join with payment
    records; only request clarification after fully exploring all tables and finding
    no fraud-related data.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r006, r007'
  id: r007
  reasoning: 'Verbatim error: ''ANSWER clarification: The task indicates a confirmed
    fraud hit in archived payment history, but no specific fraud hit identifier or
    criteria were provided.'' Root cause category: wrong-action – the system requested
    clarification instead of performing the necessary database queries to discover
    the fraud hit identifier. Failing fragments: action ''SELECT name, sql FROM sqlite_schema
    WHERE sql IS NOT NULL ORDER BY type, name;'' and spec_goal phrase ''known fraud
    hit''. The agent only retrieved the schema and then stopped, never querying for
    a fraud_hits table or similar to obtain the hit identifier. Rule linkage: new
    rule will reference the spec_goal ''Identify all payment files (full paths) associated
    with the known fraud hit'' to enforce explicit exploration before clarification.'
  source: learn
  status: inactive
- content: Never assume that fraud records are literally tagged with the keyword 'fraud'
