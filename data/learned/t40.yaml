  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r013, r014'
  id: r014
  reasoning: r011, r012, and r013 all address the same spec_goal; r013 (highest id)
    is extended to incorporate the prohibitions against search:fraud, find:*, hardcoded
    subdirectory paths, and the explicit non-empty PLAN requirement from r011 and
    r012.
  source: learn
  status: inactive
- content: When the spec_goal is to identify every archived payment record under /proc/payments/
    that belongs to the known fraud hit, never allow the PLAN action to be empty;
    always emit 'tree:/proc/payments/' as the initial concrete PLAN action, and after
    archive containers are discovered always emit a concrete file-reading or archive-extraction
    command as the PLAN action.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r015, r016'
  id: r015
  reasoning: 'Verbatim error: ''PLAN phase: action is empty''. Root cause: wrong-action.
    The PLAN_OUTPUT action field is '''' even though the plan steps require an initial
    unfiltered directory listing of /proc/payments/ and the SDD actions already specify
    ''tree:/proc/payments/''. Failing fragment: PLAN_OUTPUT action is '''' instead
    of containing the concrete unfiltered directory listing command. Rule linkage:
    the new rule explicitly requires the PLAN action to be populated with the concrete
    directory listing command ''tree:/proc/payments/'' rather than being empty at
    the start of the workflow.'
  source: learn
  status: inactive
- content: 'When the spec_goal is to identify every archived payment record under
    /proc/payments/ that belongs to the known fraud hit: never include ''search:fraud
    /proc/payments/'' in SDD actions; never use ''find:* /proc/payments/'' as the
