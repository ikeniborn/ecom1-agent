entries:
- content: Always resolve proc/payments path by listing directory contents before
    searching; then execute all fallback search terms ('fraud', 'flagged', 'suspicious',
    'chargeback', 'dispute') in sequence within a single cycle before returning empty
    result — never exit on first zero-hit search when plan defines fallbacks.
  created: '2026-05-20'
  deactivated_reason: 'Consolidated: r001, r003'
  id: r001
  reasoning: 'Verbatim error: ''Empty result:''. Root cause: wrong-key — the search
    targeted keyword ''fraud'' in /proc/payments/ but returned zero results, meaning
    fraud indicators use different terminology or the path is wrong. Failing fragment:
    action ''search:fraud /proc/payments/'' and spec_goal ''Every payment file containing
    fraud keyword is found''. The plan had a fallback to ''flagged''/''suspicious''/''chargeback''
    but the cycle ended before executing it, and the path /proc/payments/ (with leading
    slash) may differ from the actual relative path proc/payments. Rule must mandate:
    (1) try relative path proc/payments not /proc/payments, (2) execute all fallback
    terms before declaring empty result, and (3) list directory first to confirm path
    exists.'
  source: learn
  status: inactive
- content: Always emit PLAN phase output as valid JSON with an 'actions' array of
    bare action strings (e.g. 'search:fraud /proc/payments/'); never emit prose, markdown,
    or explanatory text as PLAN phase output — the harness parser rejects non-JSON
    and blocks execution.
  created: '2026-05-20'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''PLAN phase: failed to parse LLM output. Raw: No filesystem
    tools available in current tool set (no Bash, Grep, Read, Glob).'' Root cause:
    wrong-action — the PLAN phase LLM attempted to emit raw narrative text describing
    PCM tool calls instead of valid JSON action descriptors the harness could parse.
    Failing fragment: actions array [''search:fraud /proc/payments/'', ''search:flagged
    /proc/payments/'', ...] — these are correct action identifiers but the LLM output
    in PLAN phase was unparseable prose wrapping them. Rule linkage: r001 addresses
    search sequencing but does not address the output format requirement for PLAN
    phase; the PLAN LLM must emit structured JSON only, never prose. The existing
    r001 rule may have contributed by being verbose enough to push the PLAN LLM into
    narrative explanation mode rather than JSON output mode.'
  source: learn
  status: active
- content: 'Never emit OUTCOME_NONE_CLARIFICATION after a list:/proc/payments/ result
    returning filenames-only; a directory listing is a prerequisite step only — always
    proceed immediately to execute every search: action in SDD_OUTPUT.actions before
    any clarification or early-exit, because spec_goal ''Identify and cite all payment
    records that belong to the confirmed fraud incident'' requires content-level evidence,
    not filename enumeration.'
  created: '2026-05-20'
  deactivated_reason: 'Consolidated: r001, r003'
  id: r003
  reasoning: 'Verbatim error: ''Only a directory listing was returned — no file contents,
    no fraud flags, no SQL results. Cannot identify fraud records from filenames alone.''
    Root cause category: wrong-action — after list:/proc/payments/ returned 700+ filenames,
    ANSWER phase emitted OUTCOME_NONE_CLARIFICATION and halted without executing any
    of the subsequent search: actions explicitly listed in SDD_OUTPUT.actions ([''search:fraud
    /proc/payments/'', ''search:flagged /proc/payments/'', ...]). Failing fragment:
    ANSWER_OUTPUT.completed_steps = [''received list: result for /proc/payments/'',
    ''observed 700+ payment filenames, no content'', ''determined no fraud indicators
    present in filenames alone'', ''concluded file reads or search needed''] — agent
    treated list: result as terminal evidence of insufficiency rather than as a prerequisite
    step. r001 says ''execute all fallback search terms in sequence within a single
    cycle'' but does not explicitly state that a list: result returning filenames-only
    is NOT a terminal result and must not trigger OUTCOME_NONE_CLARIFICATION. The
    new rule must close this gap: list: success ≠ task completion when spec_goal requires
    content-level evidence.'
  source: learn
  status: inactive
- content: 'Never emit OUTCOME_NONE_CLARIFICATION after a list:/proc/payments/ result
    returning filenames-only; a directory listing is a prerequisite step only — always
    proceed immediately to execute every search: action in sequence (''fraud'', ''flagged'',
    ''suspicious'', ''chargeback'', ''dispute'') within a single cycle before any
    clarification or early-exit, because spec_goal ''Identify and cite all payment
    records that belong to the confirmed fraud incident'' requires content-level evidence,
    not filename enumeration. Never exit on first zero-hit search when plan defines
    fallbacks.'
  created: '2026-05-20'
  deactivated_reason: 'Consolidated: r004'
  id: r004
  reasoning: 'r001 and r003 address the same execution flow: list /proc/payments/
    first, then run all fallback search terms without early exit. r003 (higher id)
    adds the explicit prohibition on OUTCOME_NONE_CLARIFICATION after listing and
    the ''prerequisite step only'' framing. Merged rule takes r003 as base and folds
    in r001''s explicit fallback term list (''fraud'',''flagged'',''suspicious'',''chargeback'',''dispute'')
    and the ''single cycle'' constraint. r002 is orthogonal (PLAN phase JSON format)
    — left unchanged.'
  source: learn
  status: inactive
- content: 'Never terminate with empty result for spec_goal ''Identify and cite all
    payment records that belong to the confirmed fraud incident'' after keyword searches
    alone; when search:fraud, search:flagged, search:suspicious, search:chargeback,
    and search:dispute all return empty results against /proc/payments/, immediately
    execute list:/proc/payments/ then read: every listed file in sequence, because
    fraud indicators may be encoded as status codes, numeric flags, or structured
    fields rather than keyword text.'
  created: '2026-05-20'
  deactivated_reason: r005 and r006 describe the required fallback behavior but do
    not enforce that the actions array includes all fallback actions; the failure
    shows that narrative plan alone is insufficient. The new rule supersedes by mandating
    the actions array content.
  id: r005
  reasoning: 'Verbatim error: ''Empty result''. Root cause: wrong-action — all keyword
    searches (fraud, flagged, suspicious, chargeback, dispute) returned zero hits,
    yet the pipeline has no fallback beyond keyword searching. Failing fragment: SDD
    actions array only lists 3 of 5 keywords (''search:fraud /proc/payments/'', ''search:flagged
    /proc/payments/'', ''search:suspicious /proc/payments/'') — ''chargeback'' and
    ''dispute'' absent from actions despite appearing in plan text; more critically,
    even if all 5 ran, spec_goal ''Identify and cite all payment records that belong
    to the confirmed fraud incident'' cannot be satisfied by keyword search alone
    when payment files may encode fraud via status codes, numeric flags, or structured
    fields rather than literal keyword text. r004 prevents early-exit on first zero-hit
    but does not mandate a read-all-files fallback when every search returns empty.
    Rule linkage: new rule must mandate list: + read: fallback when all content searches
    for spec_goal return empty.'
  source: learn
  status: inactive
- content: 'Never terminate with empty result for spec_goal ''Identify and cite all
    payment records that belong to the confirmed fraud incident'' without exhausting
    the full pipeline: (1) after list:/proc/payments/ returns filenames, immediately
    execute every search: action in sequence (''fraud'', ''flagged'', ''suspicious'',
    ''chargeback'', ''dispute'') — never emit OUTCOME_NONE_CLARIFICATION on a directory
    listing alone; (2) when all keyword searches return empty results, immediately
    read: every listed file in sequence, because fraud indicators may be encoded as
    status codes, numeric flags, or structured fields rather than keyword text. Never
    exit on first zero-hit search when plan defines fallbacks.'
  created: '2026-05-20'
  deactivated_reason: r005 and r006 describe the required fallback behavior but do
    not enforce that the actions array includes all fallback actions; the failure
    shows that narrative plan alone is insufficient. The new rule supersedes by mandating
    the actions array content.
  id: r006
  reasoning: r004 covers post-listing → run all searches; r005 covers post-searches-empty
    → read all files. Sequential stages of same pipeline. r005 is base (highest id);
    extended with r004's prohibition on early OUTCOME_NONE_CLARIFICATION and the directory-listing-as-prerequisite-only
    constraint.
  source: learn
  status: inactive
- content: Always populate the 'actions' array in PLAN_OUTPUT with every atomic action
    from the plan steps in order, including fallback search actions (e.g., search:flagged,
    search:suspicious, search:chargeback, search:dispute) and file listing/reading
    actions, so that the harness executes the full pipeline without early termination.
  created: '2026-05-20'
  deactivated_reason: 'Consolidated: r007, r008'
  id: r007
  reasoning: 'Error: ''Empty result''. Root cause category: wrong-action — the PLAN_OUTPUT
    actions array contained only ''search:fraud /proc/payments/'', omitting the fallback
    steps described in the plan steps (search:flagged, search:suspicious, search:chargeback,
    search:dispute, list, read). Failing fragment: action ''search:fraud /proc/payments/''
    in actions array; spec_goal ''Identify and cite all payment records that belong
    to the confirmed fraud incident''. Rule linkage: new rule requires that the actions
    array includes all planned fallback actions to ensure the harness executes the
    full pipeline.'
  source: learn
  status: inactive
- content: Always include a 'list:' or 'tree:' action for the target archive directory
    before attempting 'search:fraud' in that directory, and populate the actions array
    with fallback search actions (e.g., search:flagged, search:suspicious, search:chargeback,
    search:dispute) to ensure robustness when the primary keyword is not found.
  created: '2026-05-20'
  deactivated_reason: 'Consolidated: r007, r008'
  id: r008
  reasoning: 'Verbatim error: "Search for ''fraud'' keyword across all files in /proc/archiv]:
    search failed: not found". Root cause category: wrong-action — the plan specified
    only a single search action without verifying directory existence or including
    fallback keywords. Failing fragment: action "search:fraud /proc/archive/" and
    plan step "Run the search action to find all files in /proc/archive/ containing
    the keyword ''fraud''." Rule linkage: the new rule must mandate listing before
    searching and fallback keywords to address the missing exploration and alternative
    queries.'
  source: learn
  status: inactive
- content: Always populate the 'actions' array in PLAN_OUTPUT with every atomic action
    from the plan steps in order, including fallback search actions (e.g., search:flagged,
    search:suspicious, search:chargeback, search:dispute) and file listing/reading
    actions. In particular, before searching for fraud in an archive directory, include
    a 'list:' or 'tree:' action for that directory. This ensures robustness when the
    primary keyword is not found and prevents early termination.
  created: '2026-05-20'
  deactivated_reason: null
  id: r009
  reasoning: 'Merged r007 and r008: both require fallback search actions and file
    listing/reading actions; r008 adds specific requirement for list/tree before fraud
    search in archive dir; r007 adds general requirement for all atomic actions in
    order and file listing/reading actions. Combined into a single rule covering both
    aspects.'
  source: learn
  status: active
- content: Always scope tree and list actions to the smallest relevant directory;
    when spec_goal mentions 'archived payment history', first list /proc/payments/
    to identify the archive subdirectory, then tree that archive subdirectory only;
    never run tree directly on /proc/payments/ without prior size confirmation.
  created: '2026-05-20'
  deactivated_reason: null
  id: r010
  reasoning: 'Verbatim error: ''The read operation timed out''. Root cause: wrong-spec
    — the SDD_OUTPUT specified action ''tree:/proc/payments/'' which is too broad
    for the task, causing a timeout. The spec_goal states ''archived payment history'',
    implying a subdirectory within /proc/payments/ should be targeted. The failing
    fragment is the action ''tree:/proc/payments/'' from SDD_OUTPUT and PLAN_OUTPUT.
    Rule linkage: the new rule will cite spec_goal ''archived payment history'' and
    require scoping tree to the archive subdirectory after listing the top-level /proc/payments/.'
  source: learn
  status: active
task_id: t40
