- agents_md_anchor: null
  content: Always ensure that the answer block for the default decision branch (the
    one not matching any deny condition) produces the desired outcome (e.g., OUTCOME_OK)
    and includes the required refs and message skeleton as per the answer_shape.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'grader: expected outcome OUTCOME_OK, got OUTCOME_DENIED_SECURITY. Root
    cause: PlanIR''s answer for the default ''ok'' branch incorrectly set outcome
    to OUTCOME_DENIED_SECURITY and message to ''Access denied.'' instead of producing
    OUTCOME_OK with required refs and message skeleton. The decision structure correctly
    had a deny branch for guest and default ok, but the answer mapping for ok was
    wrong. Existing rule r001 covers decision structure but not answer mapping details.'
  status: inactive
  surface: ir
