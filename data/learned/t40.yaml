- agents_md_anchor: null
  content: When using Read RPC to retrieve a document for content inspection, always
    extract the text content from the response (e.g., via a compute step using get
    or extract) before applying string operations like contains_any; do not pass the
    raw response object directly to contains_any.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: ''real_vm: Protocol message ReadResponse has no "guest denied"
    field.'' The PlanIR used contains_any on the raw Read response object $security_doc,
    expecting it to be a string. The Read RPC returns a structured protobuf message,
    not a plain string. The decision block''s condition ''contains_any($security_doc,
    ["guest denied", ...])'' failed because the VM tried to find a field named ''guest
    denied'' in the ReadResponse message. The fix is to first extract the document''s
    text content (e.g., via a compute step like ''get($security_doc, "content")'')
    and then apply contains_any to that extracted string.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always populate the discovery and rowsets sections with steps to retrieve
    the data required for the desired outcome; never leave them empty when the outcome
    depends on data from a source.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION.
    Root cause: PlanIR had empty discovery, rowsets, compute, and ops sections, so
    no data was retrieved to satisfy the success criteria (nonempty payments, contains_any
    record_paths). The decision only checked identity, and the ''ok'' answer block
    lacked any data. The interpreter could not produce OUTCOME_OK, falling back to
    OUTCOME_NONE_CLARIFICATION. Existing rule r004 already required discovery for
    the desired outcome, but it was too general and not followed. A more explicit
    rule is needed.'
  status: inactive
  surface: ir
- content: null
  created: '2026-06-22'
