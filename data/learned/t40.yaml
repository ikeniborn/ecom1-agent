- agents_md_anchor: null
  content: Always include discovery and rowsets steps that directly retrieve the data needed to construct
    the answer for the desired outcome; a plan that only handles security constraints without attempting
    to produce the primary answer is incomplete.
  created: '2026-06-22'
  deactivated_reason: null
  id: r008
  reasoning: 'The plan only read /docs/security.md and checked identity; it never attempted to read /docs/payments/3ds.md
    or payment_transactions, so it could not produce OUTCOME_OK. The error ''expected outcome OUTCOME_OK,
    got OUTCOME_DENIED_SECURITY'' shows the plan was security-only and never designed to fulfill the objective.
    Root cause: missing discovery/rowsets for the fraud data required by the desired outcome.'
  status: active
  surface: ir
