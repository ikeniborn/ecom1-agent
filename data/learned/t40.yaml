entries:
- content: Never use search:fraud /proc/payments/ as the sole action to locate a known
    fraud hit in archived payment history; always list the contents of /proc/payments/
    first to identify relevant archive files and naming conventions before applying
    any keyword search.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r001'
  id: r001
  reasoning: '1. Verbatim error: ''Empty result''. 2. Root cause: wrong-action. 3.
    Failing fragment citation: action ''search:fraud /proc/payments/'' and plan step
    ''Search /proc/payments/ for files containing ''fraud'' to locate the known fraud
    hit record''. 4. The rule_content explicitly prohibits ''search:fraud /proc/payments/''
    as the sole discovery mechanism and mandates prior directory listing.'
  source: learn
  status: inactive
- content: Always map the PLAN step 'select and read specific payment archive files
    that are likely to contain the fraud hit' to a concrete, non-empty `action` targeting
    the exact paths discovered in the prior listing when the spec_goal is to identify
    every archived payment record in /proc/payments/ that belongs to the known fraud
    hit; never leave the PLAN action empty while targeted inspection steps remain.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r002, r003'
  id: r002
  reasoning: 'Verbatim error: ''PLAN phase: action is empty''. Root cause category:
    wrong-action. The PLAN phase produced an approach and steps that required targeted
    file inspection but emitted an empty string for the mandatory `action` field,
    stalling execution. Failing fragment: PLAN_OUTPUT `"action": ""` alongside the
    step ''select and read specific payment archive files that are likely to contain
    the fraud hit''. Rule linkage: the new rule mandates that the PLAN `action` must
    be populated with a concrete read command whenever the spec_goal requires identifying
    specific archived payment records and the plan steps call for reading those files.'
  source: learn
  status: inactive
- content: Always map the PLAN step 'select and read specific payment archive files
    that are likely to contain the fraud hit' to a concrete, non-empty `action` targeting
    the exact paths discovered in the prior listing when the spec_goal is to identify
    every archived payment record in /proc/payments/ that belongs to the known fraud
    hit; never leave the PLAN action empty while targeted inspection steps remain.
    Before planning those steps, always list the contents of /proc/payments/ first
    to identify relevant archive files and naming conventions, and never use search:fraud
    /proc/payments/ as the sole action to locate the fraud hit without prior listing.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r002, r003'
  id: r003
  reasoning: r001 and r002 both address the same spec_goal of locating and identifying
    known fraud hits in /proc/payments/ archived history. r001 governs the initial
    discovery step (mandatory listing before search), while r002 governs the subsequent
    planning step (concrete paths in PLAN). Merged into a single end-to-end rule using
    highest-id r002 as base and extending it to cover r001's listing requirement.
  source: learn
  status: inactive
- content: Never use the action find:*.md /proc/payments/ or assume payment archives
    are markdown files when the spec_goal is to identify every archived payment record
    in /proc/payments/ that belongs to the known fraud hit; always perform an unfiltered
    directory listing of /proc/payments/ first to discover actual file names and extensions
    before selecting specific archive files to read.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r004'
  id: r004
  reasoning: 'The pipeline returned ''Empty result'' after executing the action ''find:*.md
    /proc/payments/''. Root cause is wrong-filter: the plan step ''find all .md payment
    archive files in /proc/payments/'' and the SDD action ''find:*.md /proc/payments/''
    incorrectly assumed all archived payment files use the .md extension, so the filtered
    search returned nothing and the fraud hit could not be located. Existing rule
    r003 mandates listing /proc/payments/ first but does not explicitly prohibit an
    extension-filtered listing or the .md assumption, leaving a gap that allowed this
    failure. The new rule directly prohibits the failing action and mandates an unfiltered
    listing to discover actual naming conventions.'
  source: learn
  status: inactive
- content: 'When the spec_goal is to identify every archived payment record in /proc/payments/
    that belongs to the known fraud hit: always perform an unfiltered directory listing
    of /proc/payments/ first to discover actual file names, extensions, and naming
    conventions before selecting specific archive files to read; never use find:*.md
    /proc/payments/ or assume payment archives are markdown files; never use search:fraud
    /proc/payments/ as the sole action to locate the fraud hit without prior listing.
    Then, map the PLAN step ''select and read specific payment archive files that
    are likely to contain the fraud hit'' to a concrete, non-empty `action` targeting
    the exact paths discovered in the prior listing, and never leave the PLAN action
    empty while targeted inspection steps remain.'
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r005'
  id: r005
  reasoning: r002 is fully subsumed by r003. r003 and r004 address the same spec_goal
    with different, non-contradictory actions; r004 is the highest id. The merged
    rule extends r004 with r003's additional constraints on mapping PLAN steps to
    concrete non-empty actions targeting exact discovered paths and prohibiting search:fraud
    as the sole action, eliminating overlap and redundancy.
  source: learn
  status: inactive
- content: 'When the spec_goal is to identify every archived payment record in /proc/payments/
    that belongs to the known fraud hit: always perform an unfiltered directory listing
    of /proc/payments/ first to discover actual file names, extensions, and naming
    conventions before selecting specific archive files to read; never use find:*.md
    /proc/payments/ or assume payment archives are markdown files; never use search:fraud
    /proc/payments/ as the sole action to locate the fraud hit without prior listing.
    Then, map the PLAN step ''select and read specific payment archive files that
    are likely to contain the fraud hit'' to a concrete, non-empty `action` targeting
    the exact paths discovered in the prior listing, and never leave the PLAN action
    empty while targeted inspection steps remain.'
  created: '2026-05-23'
  deactivated_reason: Rules r006 and r007 instruct targeting 'exact paths discovered
    in the prior listing', which caused the planner to leave the action empty when
    search:fraud returned no matches after filtering; the new rule supersedes them
    by mandating inspection of every discovered archive file regardless of search
    results.
  id: r006
  reasoning: r004 and r005 share the same spec_goal; r005 is a strict superset of
    r004, containing all of r004's guidance plus additional prohibitions (against
    search:fraud) and PLAN-action requirements. Keeping r005 as the base fully covers
    the scope of both rules.
  source: learn
  status: inactive
- content: 'When the spec_goal is to identify every archived payment record in /proc/payments/
    that belongs to the known fraud hit: always perform an unfiltered directory listing
    of /proc/payments/ first to discover actual file names, extensions, and naming
    conventions before selecting specific archive files to read; never use find:*.md
    /proc/payments/ or assume payment archives are markdown files; never use search:fraud
    /proc/payments/ as the sole action to locate the fraud hit without prior listing.
    Then, map the PLAN step ''select and read specific payment archive files that
    are likely to contain the fraud hit'' to a concrete, non-empty `action` targeting
    the exact paths discovered in the prior listing, and never leave the PLAN action
    empty while targeted inspection steps remain.'
  created: '2026-05-23'
  deactivated_reason: Rules r006 and r007 instruct targeting 'exact paths discovered
    in the prior listing', which caused the planner to leave the action empty when
    search:fraud returned no matches after filtering; the new rule supersedes them
    by mandating inspection of every discovered archive file regardless of search
