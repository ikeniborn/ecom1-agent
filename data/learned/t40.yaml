  id: r007
  reasoning: r005 and r006 are semantically identical duplicates with the same spec_goal
    and identical action prescriptions; r006 (highest id) is kept as the base and
    fully covers r005.
  source: learn
  status: inactive
- content: Never rely on search:fraud /proc/payments/ to eliminate archive files from
    inspection when the spec_goal is to identify every archived payment record in
    /proc/payments/ that belongs to the known fraud hit; always perform an unfiltered
    directory listing of /proc/payments/ first, and then always map the PLAN step
    to a concrete, non-empty action that opens every discovered archive file to inspect
    its contents, and never leave the PLAN action empty while archive files remain.
  created: '2026-05-23'
  deactivated_reason: r008 allowed a discovery-only command ('find:* /proc/payments/')
    to satisfy its 'concrete, non-empty action' requirement and did not clearly mandate
    an archive-opening action in the PLAN step, which contributed to the repeated
    failure to inspect archive contents.
  id: r008
  reasoning: 'Verbatim error: "PLAN phase: action is empty". Root cause category:
    wrong-filter — the PLAN_OUTPUT approach states "no targeted file-read candidates
    remain after filtering" because it relied on search:fraud /proc/payments/ to eliminate
    archives, which left zero files to inspect and produced an empty action. Failing
    fragment: PLAN_OUTPUT `"action": ""` and approach text "no targeted file-read
    candidates remain after filtering". Existing rules r006 and r007 contributed to
    this failure by instructing the planner to target only "exact paths discovered
    in the prior listing", so when the search returned no matches the planner left
    the action empty; the new rule supersedes them by prohibiting reliance on search:fraud
    to filter out archives and mandating a non-empty action that inspects every discovered
    file.'
  source: learn
  status: inactive
- content: Never include 'search:fraud /proc/payments/' in SDD actions and never use
    'find:* /proc/payments/' as the PLAN action when the spec_goal is to identify
    every archived payment record in /proc/payments/ that belongs to the known fraud
    hit; after an unfiltered directory listing discovers archive files, the PLAN action
    must be a concrete file-reading or archive-extraction command that opens each
    discovered archive to inspect its payment contents.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r009, r010'
  id: r009
  reasoning: '1. Verbatim error: ''Empty result''. 2. Root cause category: wrong-action
    — the PLAN action was ''find:* /proc/payments/'', which only enumerates file paths
    and never opens or inspects archive contents, while the SDD actions still included
    ''search:fraud /proc/payments/'' as a substitute for actually reading archives.
    3. Failing fragment citation: PLAN action ''find:* /proc/payments/'' and SDD action
    ''search:fraud /proc/payments/''. 4. Rule linkage: the new rule directly prohibits
    both the discovery-only PLAN action and the reliance on search:fraud in SDD actions
    when the spec_goal is ''Identify every archived payment record in /proc/payments/
    that belongs to the known fraud hit and cite the full path of each record.'''
  source: learn
  status: inactive
- content: Never include 'list:/proc/payments/archive/' or any other hardcoded archive
    subdirectory path in SDD actions or PLAN actions when the spec_goal is to identify
    every archived payment record in /proc/payments/ that belongs to the known fraud
    hit; instead, rely on the unfiltered listing of /proc/payments/ to reveal actual
    archive containers, then apply concrete file-reading or archive-extraction commands
    to each discovered container.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r009, r010'
  id: r010
  reasoning: 'Verbatim error: ''Execute exception [''List the archive subdirectory
    under /proc/payments/ to enum]: list failed: not found''. Root cause category:
    wrong-action. Failing fragment citation: the SDD action ''list:/proc/payments/archive/''
    and the PLAN action ''list:/proc/payments/archive/''. Rule linkage: the new rule
    prohibits hardcoding ''list:/proc/payments/archive/'' and instead requires deriving
    archive containers from an unfiltered /proc/payments/ listing before using concrete
    file-reading or archive-extraction commands.'
  source: learn
  status: inactive
- content: Never allow the PLAN action to be empty when the spec_goal is to identify
    every archived payment record under /proc/payments/ that belongs to the known
    fraud hit and an unfiltered directory listing of /proc/payments/ has already been
    performed; always emit a concrete file-reading or archive-extraction command that
    opens each discovered archive container to inspect its payment contents.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r011, r012'
  id: r011
  reasoning: 'Verbatim error: "PLAN phase: action is empty". Root cause category:
    wrong-action. The PLAN phase halted instead of progressing to inspection: PLAN_OUTPUT
    action was "" and its approach stated "All candidate discovery actions were previously
    attempted, leaving no remaining executable action to locate archived fraud payment
    records." This directly contradicts the required next step from the SDD plan step
    2 ("Use concrete file-reading commands to open each discovered container and inspect
    its archived payment contents"). The new rule plugs this exact gap by explicitly
    mandating that the PLAN action must not be empty after the directory listing and
    must instead be a concrete file-reading or archive-extraction command.'
  source: learn
  status: inactive
- content: 'When the spec_goal is to identify every archived payment record under
    /proc/payments/ that belongs to the known fraud hit: never include ''search:fraud
    /proc/payments/'' in SDD actions; never use ''find:* /proc/payments/'' as the
    PLAN action; never include any hardcoded archive subdirectory path (e.g., ''list:/proc/payments/archive/'')
    in SDD or PLAN actions; instead rely on an unfiltered directory listing of /proc/payments/
    to reveal actual archive containers; and after such a listing discovers archive
    files, never allow the PLAN action to be empty—always emit a concrete file-reading
    or archive-extraction command that opens each discovered archive container to
    inspect its payment contents.'
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r011, r012'
  id: r012
  reasoning: r009, r010, and r011 all address the same spec_goal and prescribe compatible
    but overlapping constraints; r011 (highest id) forms the base and is extended
    with the prohibitions against search/find and hardcoded archive paths from r009
    and r010.
  source: learn
  status: inactive
- content: Never include a hardcoded archive file path such as '/proc/payments/archive.zip'
    in SDD actions or as the PLAN action when the spec_goal is to identify every archived
    payment record under /proc/payments/ that belongs to the known fraud hit; always
    perform an unfiltered directory listing of /proc/payments/ first to discover actual
    archive containers, then emit a concrete file-reading or archive-extraction command
    for each discovered archive.
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r013, r014'
  id: r013
  reasoning: 'Verbatim error: Execute exception [''Read the discovered archive container
    to inspect its paymen]: read failed: not found. Root cause category: wrong-action.
    Failing fragment citation: SDD action ''/proc/payments/archive.zip'' and PLAN
    action ''/proc/payments/archive.zip''. Rule linkage: The new rule explicitly bans
    hardcoding an archive file path such as ''/proc/payments/archive.zip'' in SDD
    actions or as the PLAN action and mandates an unfiltered directory listing of
    /proc/payments/ before any file-reading command is emitted, directly addressing
    the failed fragment.'
  source: learn
  status: inactive
