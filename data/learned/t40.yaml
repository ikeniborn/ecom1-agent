- agents_md_anchor: null
  content: When the objective implies a success outcome but the desired outcome is
    a denial, structure the decision with a default branch that yields the success
    outcome, and a conditional branch for the denial outcome that matches the security
    constraint's deny condition.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The PlanIR's decision had only a branch for deny (when identity.kind
    eq guest) and defaulted to deny. The grader expected OUTCOME_OK, indicating the
    identity was not guest, so the plan should have allowed. The tool plan's desired
    outcome is OUTCOME_DENIED_SECURITY, but the objective (identify payment records)
    implies a success outcome. The plan must default to the success outcome and deny
    only when the security constraint is triggered.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include discovery steps to retrieve the data needed for compute
    primitives that require list inputs; ensure compute steps like concat are provided
    with the correct arguments from prior rowsets or compute outputs.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The plan omitted discovery steps entirely, so no rowsets were available.
    The concat compute step was called with zero arguments, violating its contract
    (expects two list[dict] arguments). This caused an interpret failure. The plan
    must first discover the relevant archived payment records, then use compute steps
    to extract and concatenate the record paths. The rule ensures future plans include
    necessary discovery and properly supply arguments to compute primitives.
  status: inactive
  surface: ir
