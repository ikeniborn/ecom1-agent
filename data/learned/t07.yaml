- agents_md_anchor: '#plan-phase'
  content: 'Always use ''get'' with exactly two arguments: the object and the key.
    To provide a default value, first set the variable to the default using ''set''
    or ''get'' with a literal, then use ''get'' with two arguments to extract the
    value from the row if it exists.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'The error ''compute step ''get'' failed: <lambda>() takes 2 positional
    arguments but 3 were given'' occurred because the PlanIR used get with three arguments
    (row, column, default). The get primitive only accepts two arguments. The existing
    rule r003 suggests binding defaults, but the implementation must use a separate
    set/get step for the default before the two-argument get. The failing fragment:
    ''get'' with args [''$product_row'', ''product_sku'', ''''].'
  status: inactive
  surface: ir
