- agents_md_anchor: null
  content: Always include in the answer object every field referenced by the success
    criteria (e.g., sku, record_path) as a separate key, not only embedded in the
    message string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'ERROR: verify: success_criteria[OUTCOME_NONE_UNSUPPORTED][0] failed:
    {''op'': ''nonempty'', ''lhs'': ''$answer.sku'', ''rhs'': None, ''args'': []}.
    Root cause: The PlanIR answer branches only set ''message'', ''outcome'', and
    ''refs'', but the success criteria for OUTCOME_NONE_UNSUPPORTED requires a nonempty
    $answer.sku. The answer object had no ''sku'' field, so the nonempty check failed.
    The message skeleton ''Product {sku}: {result}'' does not create a separate sku
    field. The script must explicitly set a ''sku'' field in the answer object. This
    rule ensures that any field referenced in success criteria is present as a top-level
    key in the answer object.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include in the answer object every field referenced by the success
