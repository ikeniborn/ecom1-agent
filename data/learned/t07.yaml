- agents_md_anchor: null
  content: When using the all_true primitive, provide a single list argument containing
    the boolean values to check, not multiple separate arguments.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Error: interpret: compute step ''all_true'' failed: <lambda>() takes
    1 positional argument but 3 were given. Root cause: The PlanIR compute step for
    all_true passed three separate arguments (has_color_green, has_finish_eggshell,
    has_finish_matte) instead of a single list containing those booleans. The contract
    for all_true expects a single sequence argument. Failing PlanIR fragment: {"prim":"all_true","args":["$has_color_green","$has_finish_eggshell","$has_finish_matte"],"into":"all_props"}.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always bind computed values to variables that exactly match the required
    ref source paths, including dotted paths (e.g., $product.record_path), not flat
    names.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''$product.record_path'']
    on OK answer''. The PlanIR computed record_path into a flat variable ''$product_record_path'',
    but the required ref expects ''$product.record_path''. The answer refs used the
    flat variable, causing the interpreter to fail to resolve the required ref. The
    root cause is a mismatch between the variable name used in the answer ref and
    the required ref path. The rule ensures that compute steps produce variables with
    the exact dotted path expected by required refs.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always bind variables that are required refs to a default value (e.g.,
    empty string) before attempting to extract them from a rowset, so they remain
    resolved even when the rowset is empty.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'Error: interpret: unresolved required ref(s) [''$product.record_path'']
    on OK answer. The PlanIR binds $product.record_path via a get on $first_row, but
    when the product is not found the rowset is empty, first_row is null, and the
    get primitive may not bind the variable, leaving it unresolved. The required ref
    is demanded for both found_yes and found_no branches, so it must be bound unconditionally.
    Root cause: missing default binding for a ref that may be needed even when the
    source rowset yields no rows.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the concat primitive, always provide exactly two arguments (a
    and b). If you only need to pass a single value, use 'set' or 'get' instead.
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The interpret phase failed with: ''concat() missing 1 required positional
    argument: b''. The PlanIR compute step ''concat'' was called with only one argument:
    ["$product_sku"]. The concat primitive requires two arguments to concatenate.
    The step intended to assign the SKU to variable ''sku'', but concat is the wrong
    primitive for a single value. The fix is to use a single-value assignment primitive
    (e.g., ''set'' or ''get'') or provide two arguments to concat.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always use filter_rows with exactly two arguments: the rows list and a
    predicate dict (e.g., {"column": "<col>", "op": "<op>", "value": "<val>"}). Never
    pass column, op, and value as separate arguments.'
  created: '2026-06-21'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: ''filter_rows() takes 2 positional arguments but 4 were given''.
    The PlanIR compute step ''filter_rows'' was invoked with 4 arguments: rows, column,
    operator, value. The primitive contract requires exactly 2 arguments: rows (list[dict])
    and pred (dict). This misuse caused the interpret failure.'
  status: inactive
  surface: ir
