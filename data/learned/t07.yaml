- agents_md_anchor: null
  content: When the desired outcome's success criteria require a specific substring
    in the answer, ensure that every answer message produced by any decision branch
    contains that substring.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Grader error: ''Answer should contain ''<NO>''''. The PlanIR''s decision
    branches ''not_found'' and ''claim_present'' produce messages without ''<NO>''
    (e.g., ''Product not found.'' or ''<YES>...''), while only ''claim_absent'' includes
    it. If the product was not found or all properties matched, the answer lacked
    ''<NO>'', failing the grader. Root cause: answer messages for alternative branches
    do not satisfy the desired outcome''s success criteria. The rule ensures all answer
    messages incorporate the required pattern to pass the grader.'
  status: inactive
  surface: ir
