- agents_md_anchor: null
  content: Always name the answer message field 'msg' (not 'message') so that success
    criteria referencing $answer.msg can find it.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more explicit rule that combines the requirements
    to include sku, record_path, and msg fields in the answer object.
  id: r010
  reasoning: The verify error 'contains_any' on '$answer.msg' failed because the PlanIR
    answer object for the 'not_found' branch used the key 'message' instead of 'msg'.
    The success criteria expects $answer.msg, but the answer object had 'message',
    so the field was missing. The observed RPC output shows the SQL returned data
    correctly, but the verify step could not locate the message string. The fix is
    to align the answer field name with the success criteria reference.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include both a 'message' field and a 'msg' field in the answer object
    for each outcome branch, with identical content, so that PlanIR validation (which
    requires 'message') and success criteria referencing $answer.msg are both satisfied.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: PlanIR validation failed with 'answer.found.message Field required' and
    'answer.not_found.message Field required'. The success criteria for both outcomes
    reference $answer.msg. The existing in-session rule instructed to name the field
    'msg', which caused the omission of the required 'message' field. The corrective
    rule ensures both fields are present.
  status: inactive
