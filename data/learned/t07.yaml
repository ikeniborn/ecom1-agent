entries:
- agents_md_anchor: '#important-tools > sql tool'
  content: When parsing /bin/sql stdout in CODEGEN, split rows on the delimiter the
    tool actually emits (CSV/comma) and strip the header by matching the first line's
    fields against the known SELECT column names; never hardcode a pipe ('|') delimiter
    or test only the first cell for a single column name, or row parsing silently
    drops every column (including the path) and refs come back empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column; check
    :name bindings on /bin/sql and the SELECT columns". Root cause: OBSERVED_RPC_OUTPUTS
    shows /bin/sql emits comma-separated output (`product_sku,record_path,product_name,...`),
    but the script parses with `ln.split("|")`. Failing fragment: `cols = [c.strip()
    for c in ln.split("|")]` plus header guard `rows[0][0].lower() in ("product_sku","sku")`.
    With pipe-split on CSV text, each whole line becomes a single column, so `rows[0][0]`
    is the entire header string (never equal to ''product_sku''), the header is not
    dropped, and `record_path = r[1]` is out of range / wrong — refs stays []. Even
    when data rows exist, the path column is never extracted. Rule linkage: the corrective
    technique is delimiter-correct CSV parsing and column-name-based header detection,
    a CODEGEN translation concern, not a domain conclusion.'
  status: active
- agents_md_anchor: '#important-tools > sql tool'
  content: When a CODEGEN answer must cite a base record's SKU and record_path even
    on a negative or absent-property verdict, never put the discriminating property
    comparisons in the WHERE clause of a LEFT JOIN query — that collapses the LEFT
    JOIN into an effective INNER JOIN and returns zero rows whenever a property differs,
    leaving refs empty; instead select the base record unconditionally and expose
    each property match as a CASE/boolean SELECT column, then decide the verdict in
    code so the base path always survives for refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$path'']) but actual refs [] contain only static template entries [] — SQL
    likely returned no rows or row parsing dropped the path column". OBSERVED_RPC_OUTPUTS
    shows only the header line `product_sku,record_path,...,volume_number` with zero
    data rows. Root cause: the failing fragment is the trailing filter `WHERE cf.property_value_text
    = ''Black'' AND fin.property_value_text = ''eggshell''` applied to the cf/fin/vol
    LEFT JOINs. Predicating on LEFT-JOINed columns in WHERE turns those joins into
    INNER joins, so when no base variant carries both color_family=Black and finish=eggshell
    the entire result set is empty. The script''s no-rows branch then calls vm.answer(refs=[]).
    But intent explicitly requires answering <NO> while still citing the checked base
    SKU/record_path — impossible once the property filter drops the base row. Linkage:
    rule tells CODEGEN to keep the base row unconditional and move property checks
    into SELECT/CASE columns evaluated in Python, guaranteeing record_path is always
    available to populate the required $path ref.'
  status: active
