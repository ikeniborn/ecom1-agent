- agents_md_anchor: null
  content: When a catalogue claim-verification task requires citing a checked record
    even for a negative/absent result, always bind a concrete candidate record from
    the pre-phase pool to checked_record before evaluating the claim, and project
    that record’s record_path and product_sku into the answer template unconditionally
    in both outcome branches.
  created: '2026-06-19'
  deactivated_reason: null
  id: r012
  reasoning: 'Verbatim error: plan: PLAN LLM returned empty response. Root cause:
    the planner tried to bind checked_record only if the combined attribute claim
    (both fastener types and 4 mm diameter) matched a candidate row. In the absent-claim
    branch no row satisfied the test, so record_path and product_sku remained unbound,
    violating the success_criteria required_refs that demand non-empty checked_record
    fields even for a <NO> answer. Confronted with an unsatisfiable dependency chain,
    the LLM emitted an empty PlanIR. Failing PlanIR fragment: the entire script body
    is empty. Rule linkage: this complements rc1 by adding a structural invariant
    that checked_record must be anchored to a real candidate (e.g., the base product
    line) before claim inspection, guaranteeing the required refs are grounded for
    both present and absent outcomes.'
  status: active
  surface: ir
