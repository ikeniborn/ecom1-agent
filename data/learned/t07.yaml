- agents_md_anchor: null
  content: When searching for a product by name, use a LIKE or ILIKE pattern with
    wildcards to match the product name, rather than exact equality, to avoid missing
    the product due to minor naming variations.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: 'Error: verify: success_criteria[OUTCOME_NONE_UNSUPPORTED][0] failed:
    nonempty sku. Root cause: The SQL query used exact equality on product_name, which
    likely did not match the actual product name in the database, causing the query
    to return no rows. Consequently, the compute step ''first'' returned null, and
    the answer''s sku field was empty, violating the success criteria. The rule instructs
    future PlanIR to use flexible name matching (LIKE/ILIKE) to reliably find the
    base product SKU.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the all_true primitive, pass a single list of boolean values
    as the argument, not multiple individual arguments.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'The interpret step failed with ''all_true failed: <lambda>() takes 1
    positional argument but 3 were given''. The PlanIR compute step passed three separate
    arguments to all_true, but the primitive expects a single sequence (list) of booleans.
    The correct usage is to wrap the values in a list: args: [["$has_color_blue",
    "$has_size_xl", "$has_size_l"]]. This rule ensures future PlanIR uses of all_true
    conform to the contract.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always include in the answer object for each outcome branch a 'sku' field
    with the product SKU, a 'record_path' field with the record path, and a 'msg'
    field with the message, as required by the success criteria.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: The PlanIR answer for the 'ok' branch only had a 'message' field and
    no 'sku' field, causing the verification of success criteria 'nonempty $answer.sku'
    to fail. The existing rules r009 and r010 already require including all referenced
    fields and naming the message field 'msg', but they were not applied. A more explicit
    combined rule will prevent this.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the intent spec's required_refs specify a source string (e.g., '$product_variant.record_path'),
    the answer refs must use that exact source string, not a local variable name derived
    from it.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''$product_variant.record_path'']
    on OK answer''. The PlanIR answer for OK outcome had refs with source ''$record_path'',
    but the required_refs in the intent spec for OUTCOME_OK demand source ''$product_variant.record_path''.
    The interpreter could not resolve the required ref because the source strings
    did not match. The failing fragment: answer.ok.refs[0].source = ''$record_path''
    instead of ''$product_variant.record_path''. This rule ensures answer refs use
    the exact source string from required_refs.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When you have a single row (dict) and need a field value, use the 'get'
    primitive; 'column' is only for extracting a column from a list of rows.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'Error: ''column'' expects list[dict] rows; use ''get'' for a single
    row. The PlanIR used ''first'' to reduce rows to a single dict, then applied ''column''
    to that dict, causing failure. The fix is to replace ''column'' with ''get'' when
    extracting fields from a single row.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use concat to combine scalar values; concat only merges two lists
    of rows. To create a list of values, use the list primitive.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r017
  reasoning: 'The interpret step failed with: ''concat() takes 2 positional arguments
    but 3 were given''. The PlanIR used concat with three scalar booleans (has_color_blue,
    has_size_xl, has_size_l) to build a list for all_true. However, concat is designed
    to merge two lists of rows, not to combine scalars. The correct approach is to
    use the list primitive to create a list from the three booleans, then pass that
    single list to all_true. This rule prevents misuse of concat for scalar aggregation.'
  status: inactive
  surface: ir
