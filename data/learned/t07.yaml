- agents_md_anchor: '#important-tools > sql'
  content: When a CODEGEN discovery query must locate a base catalogue record whose
    path/SKU will be cited as a required reference, do not over-constrain it with
    an exact-equality conjunction across several human-entered denormalized columns
    (e.g. brand AND series AND model); one normalized/variant-spelled field yields
    zero rows and empty refs even though the record exists. Match on the most stable
    identifier or use relaxed/normalized comparison (LIKE/lower/trim), and confirm
    at least one row returned before building refs — derive the reference from the
    catalogue path convention (/proc/catalog/<category>/<subcategory>/<SKU>.json)
    rather than blindly trusting a record_path column.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: grader: answer missing required reference ''/proc/catalog/adhesives_sealants/sealants/ADH-2ZDN11UB.json''.
    The required record (SKU ADH-2ZDN11UB) exists in the catalogue, so refs being
    empty means the discovery query returned no rows — the failing fragment is the
    base CTE WHERE pv.brand = :brand AND pv.series = :series AND pv.model = :model,
    a strict three-way exact-equality conjunction over denormalized free-text attribute
    columns. Any single field mismatch (normalization, spacing, variant spelling between
    ''Sika 1NG-QLV'' and the stored row) collapses the result to zero rows, so the
    rows[] branch is skipped and refs=[] — distinct from r002 (property comparison
    in LEFT JOIN WHERE) and r001 (stdout delimiter/header parsing), both of which
    are correctly applied here yet cannot help when the base SELECT itself matches
    nothing. Root cause: over-constrained base-record lookup plus reliance on the
    DB record_path column instead of the canonical catalogue file path. New rule links
    these into a reusable CODEGEN technique: relax/normalize the base match, assert
    a row exists, and synthesize the canonical /proc/catalog path from the SKU.'
  status: active
