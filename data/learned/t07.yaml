- agents_md_anchor: null
  content: 'Catalogue tasks (existence / claim-verification / count): identify the
    product by its attributes matched NORMALIZED (case- and whitespace-insensitive),
    preferring the real rows in the pre-phase CATALOGUE_CANDIDATES fact over a guessed
    query; ground every positive/identifying answer in the matched record''s record_path;
    produce the answer token/format the instruction asks for; both present and absent
    are OUTCOME_OK (never CLARIFICATION). This is a general method — derive concrete
    SQL/values from THIS run''s facts, never reuse a fixed recipe.'
  created: '2026-06-18'
  deactivated_reason: 'Superseded because it contains the contradictory clause ''INTENT:
    required_refs[OUTCOME_OK]=[]'' which conflicts with the frozen TOOL_PLAN that
    mandates $base.record_path, contributing to planner paralysis.'
  id: rc1
  pinned: true
  reasoning: 'General method-not-value rule (reverted from prescriptive prose per
    user directive: execution CONTROL belongs in the harness check-specs + interpreter
    scripts, not in task-prose). Pinned.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always project every binding that success_criteria reads as $result.<name>
    into the emitted result object under that exact name — bind the count of the discovery
    rowset and surface it as a result field, so verify resolves $result.checked_count
    to a number, not undefined; a count>=0 check can fail ONLY when the field is missing
    from the result namespace.
  created: '2026-06-18'
  deactivated_reason: superseded by canonical rc1
  id: r007
  reasoning: 'Verbatim error: verify: success_criteria[OUTCOME_OK][0] failed: {''op'':
    ''ge'', ''lhs'': ''$result.checked_count'', ''rhs'': 0, ''args'': []}. The predicate
    is checked_count>=0 — trivially true for any non-negative count (even 0), so the
    only failure mode is $result.checked_count being absent or non-numeric. OBSERVED_RPC_OUTPUTS
    shows the SQL returned 1 base row (WRK-2C46MVO8, extra_holds=0), so discovery
    + rowset parse + count logic all worked. Failing PlanIR fragment: compute emits
    {"prim":"count","args":["$rows"],"into":"checked_count"} as a LOCAL binding, and
    ops:[] plus the answer blocks never surface checked_count into the result object
    — so verify reads $result.checked_count as undefined and ge(undefined,0) fails.
    Root cause = result-projection gap, not a grounding/data gap. Linkage: rc1 covers
    the find-base/test-extra/decision shape but is silent on exposing the verification
    counter as a $result field; this rule adds the missing projection step without
    superseding rc1.'
  status: inactive
  surface: ir
