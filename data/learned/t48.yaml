- agents_md_anchor: null
  content: When a task requires selecting rows that match a domain predicate (e.g.
    fraud) from a TSV, derive the exact match condition from the actual header names
    and the observed value domain in the Read output rather than guessing columns
    via fuzzy keyword matching plus generic truthy/non-empty tests; heuristic predicates
    simultaneously miss true matches (≈0% recovery) and admit false positives, failing
    the amount grader.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''grader: answer amount mismatch | archive fraud refs
    recovered ~0% EUR from fraud amount, and also marked a few payments as false positives.''
    Root cause: fraud classification predicate is a guess, not derived from data.
    Failing fragment: find_col([''is_fraud'',''fraud'']) / find_col([''incident''])
    keyword matching feeding `is_fraud = is_truthy(cols[flag_idx])` then fallback
    `is_fraud = non_empty(cols[incident_idx])`. This fuzzy column pick + truthy/non-empty
    heuristic both excludes real fraud rows (~0% recovered) and includes non-fraud
    rows (false positives). Distinct from r004 (gutter stripping breaks columns) —
    here columns parse but the membership condition is semantically wrong. r001/r002
    (dedup) and r003 (terminal answer) unrelated. New CODEGEN technique: predicate
    must come from actual header/value domain, not assumed key set or generic truthiness.'
  status: active
- agents_md_anchor: null
  content: When a discovery Search/grep RPC is issued to locate predicate-matching
    records across the archive (distinct from the target-file Read), join those hits
    back to the target rows by the shared key (RowID or path fragment) to decide membership,
    instead of re-deriving the predicate only from the target file's own columns;
    the matching signal lives in the sibling Search RPC output, so ignoring it leaves
    the in-file column search unmatched, zero rows selected, and refs empty.
  created: '2026-06-06'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$fraud_row_refs'']) but actual refs [] contain only static template entries
    [] — SQL likely returned no rows or row parsing dropped the path column". Root
    cause: the plan issues a Search RPC fraud_hits=vm.search(root=''/archive'', pattern=''(?i)fraud'')
    precisely because fraud membership is established outside the TSV (sibling archive
    records), yet SCRIPT_CODE binds fraud_hits then never uses it. Failing fragment:
    `fraud_idx = find_col([lambda h: ''fraud'' in h])` followed by the in-TSV cell
    scan `if ''fraud'' in row[ci]...` — when neither header nor any TSV cell contains
    ''fraud'', fraud_idx stays -1, the per-row loop `if fraud_idx < 0 ... continue`
    skips every row, total_cents=0 and refs=[]. r004 (gutter strip + non-empty assert)
    and r005 (derive predicate from in-file header/value domain) both assume the predicate
    is inside the target file; neither covers the cross-RPC join case where the predicate
    signal is in the Search output and must be matched by key. New rule fills that
    gap.'
  status: active
- agents_md_anchor: null
  content: Do not place the refs-non-empty assertion or the runtime-refs construction
    inside the same broad try/except whose fallback emits empty refs with the planned
    OUTCOME_OK; the handler swallows the AssertionError and ships the exact empty-refs
    answer that fails refs verification, so build and validate runtime refs OUTSIDE
    the swallowing handler and reserve the catch-all fallback for genuinely unrecoverable
    errors rather than masking a refs-parse miss as a successful OUTCOME_OK.
  created: '2026-06-06'
  deactivated_reason: null
  id: r007
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ([\''$fraud_row_refs\'']) but actual refs [] contain only static template
    entries [] — SQL likely returned no rows or row parsing dropped the path column''.
    Root cause: script wraps the entire parse+select+ref-build plus `assert refs,
    "no fraud refs built"` inside one `try`, and the `except Exception as e:` falls
    back to `vm.answer(message="EUR 0.00", outcome=outcome, refs=[])`. When ref construction
    yields nothing, the assert raises, the broad except catches it, and the fallback
    answers OUTCOME_OK with refs=[] — satisfying outcome but failing refs verification.
    Failing fragment: `assert refs, "no fraud refs built"` followed by `except Exception:
    vm.answer(..., refs=[])`. Linkage: r004 mandates asserting refs non-empty before
    answer, and r003 mandates wrapping the body in try/except that still answers the
    planned outcome on failure; these interact destructively here — the assert from
    r004 is neutralized because it sits inside r003''s swallowing handler, which then
    emits the planned OUTCOME_OK with empty refs. New rule resolves the interaction
    by requiring the refs build/validate to live outside the catch-all so a refs miss
    cannot be silently downgraded to a passing-outcome empty-refs answer.'
  status: active
- agents_md_anchor: null
  content: 'When a Read RPC targets a large archived or export file that can exceed
    the VM read timeout, request bounded line ranges (offset/limit or start/end) and
    accumulate pages instead of issuing a single unbounded full-file Read, and never
    read the same large file fully more than the plan strictly requires, because an
    unbounded full-file read raises ''real_vm_exec: The read operation timed out''.'
  created: '2026-06-06'
  deactivated_reason: null
  id: r008
  reasoning: 'Verbatim error: ''real_vm_exec: The read operation timed out''. Observed
    discovery RPCs returned empty (stat/list) and execution aborted at a read. Failing
    fragments: `tsv_content = vm.read(path=archive_path, number=True)` (discovery)
    and `fraud_rows = vm.read(path=archive_path, number=True)` (ops) — both unbounded
    full-file reads of an /archive export, issued twice on the same large file. Root
    cause: a whole-file Read of a large archived TSV exceeds the VM per-RPC read timeout;
    doubling it (discovery + duplicate ops read) compounds I/O. Linkage: existing
    rules (r001/r002/r004/r005, in-session) cover dedup-vs-fidelity, refs gutter stripping,
    predicate derivation, and Search join — none address the read-timeout failure
    mode, so a new technique rule is needed: paginate large-file reads with bounded
    ranges rather than one unbounded read. This does not conflict with r002 (still
    re-issue planned RPCs) — it changes HOW each read is shaped, not whether it is
    issued.'
  status: active
