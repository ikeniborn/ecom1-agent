- agents_md_anchor: null
  content: When the objective instructs to find a column indicating a condition (e.g.,
    fraud) from a delimited file, use a discovery step to read the file's header and
    inspect column names for keywords, then use that column in filtering; do not assume
    external policy documents or database tables.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: The plan produced OUTCOME_NONE_UNSUPPORTED because its decision branches
    relied on regex matching against /docs/security.md, which either didn't exist
    or didn't contain the expected patterns. The objective explicitly instructs to
    read the TSV file and find a column indicating fraud (e.g., 'is_fraud', 'fraud_flag')
    by inspecting the file itself. The plan instead used an external policy document
    and assumed a 'payment_transactions' table, violating the method. The root cause
    is a PLAN design that bypasses direct file inspection for fraud indicator columns.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'When using filter_rows, specify the predicate as a dict with an ''op''
    key (e.g., {"op": "in_set", "args": ["$row.fraud_flag", ["true", "1", "yes", "fraud",
    "incident", "TRUE", "YES"]]}) rather than a list.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'interpret: compute step ''filter_rows'' failed: ''list'' object has
    no attribute ''op''. The PlanIR predicate was a list ["in_set", "$row.fraud_flag",
    [...]] but the interpreter expects a dict with an ''op'' attribute. Existing rule
    r003 incorrectly advises to use a list; it must be deactivated and replaced with
    this dict-based rule.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When the answer_shape requires a ref of kind 'record_path', the plan must
    include a discovery step to identify the column in the source file that contains
    the record path (e.g., by reading the header and matching keywords like 'path',
    'file', 'record', or 'id'), and then use that column name in the rowsets step
    and subsequent refs; do not assume a column named 'record_path' exists.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The plan assumed a column named 'record_path' exists in the TSV, but
    the file likely had a different column name (e.g., 'file_path', 'id'). The required
    ref '$fraud_rows[*].record_path' was unresolved because the rowset did not contain
    a column with that exact name. The plan should have first discovered the actual
    column name from the header and used it.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use concat to build strings; concat is for merging rowsets (list[dict]
    rows). Use a string formatting primitive (e.g., 'format') to build SQL queries
    or other string templates.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Error: ''concat'' failed because it received 9 string arguments instead
    of 2 rowset arguments. The PlanIR used concat to assemble SQL query strings (agg_query,
    agg_script, rec_query, rec_script) by concatenating many string fragments. The
    concat primitive''s contract is to merge two rowsets (list[dict] rows), not to
    concatenate strings. The root cause is misuse of concat for string building. The
    failing PlanIR fragment: compute steps with prim ''concat'' and multiple string
    args. No existing rule covers this.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always specify the predicate in filter_rows as a list with the operation
    name as the first element (e.g., ["in_set", "$row.column", ["val1", "val2"]])
    rather than a dict, because the implementation accesses the operation via attribute
    lookup.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: ''dict'' object has no attribute ''op'' when using filter_rows
    with a dict predicate {"op":"in_set",...}. The implementation expects a list (e.g.,
    ["in_set", ...]) and accesses the operation via attribute lookup, which fails
    on a dict. The in-session rule that recommended a dict is incorrect and caused
    this failure. r003 already correctly specifies the list format.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always specify the predicate in filter_rows as a dict with an ''op'' key
    (e.g., {"op": "in_set", "args": ["$row.column", ["val1", "val2"]]}) rather than
    a list, because the implementation accesses the operation via attribute lookup.'
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Error: interpret: compute step ''filter_rows'' failed: ''list'' object
    has no attribute ''op''. The PlanIR used a list predicate ["in_set", "$row.fraud_flag",
    ["true","1","yes","fraud","incident","TRUE","YES"]], but the implementation expects
    a dict with an ''op'' key. Root cause: incorrect predicate shape. Existing rule
    r003 advises the opposite (list form), which is now proven wrong and must be deactivated.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When creating a rowset from a JSON source, always specify the columns you
    will reference in the 'columns' field, using the column names as they appear in
    the JSON objects, to ensure the interpreter can resolve refs to those columns.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: The error 'unresolved required ref(s) ["$fraud_rows[*].record_path"]'
    occurred because the PlanIR defined a rowset 'fraud_rows' from a JSON source but
    left the 'columns' field empty ([]). The interpreter could not resolve the column
    'record_path' from that rowset. The SQL query correctly extracted 'record_path'
    and 'amount' into a JSON array, but the rowset definition must explicitly declare
    the columns to make them available for refs and compute steps.
  status: inactive
  surface: ir
