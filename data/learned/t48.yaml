- agents_md_anchor: '#plan-phase-rowsets'
  content: When an Exec RPC returns a single scalar value (e.g., a formatted total)
    and you need to use it as the answer message, use format 'single' in the rowset
    definition to capture the entire output as one column, rather than 'auto_delim'
    which may fail to parse a single line without headers.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: The verify step failed because the answer message did not match the regex
    '^EUR \d+\.\d{2}$'. The plan used an Exec RPC to compute the total via SQL and
    bind the output to 'raw_total'. The rowset definition used format 'auto_delim'
    with a column mapping expecting a 'formatted' column. However, the SQL output
    is a single scalar value (e.g., 'EUR 123.45') without a header row. The 'auto_delim'
    format likely failed to parse this as a delimited file, resulting in an empty
    rowset and an empty message. The fix is to use format 'single' to capture the
    entire output as a single column, or to use 'raw' and reference the output directly.
    This rule ensures the plan phase selects the correct rowset format for scalar
    Exec outputs.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using format 'single' to capture a scalar output from an Exec RPC,
    always set the column mapping's candidates to ['value'] because the interpreter
    names the single column 'value'.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r013
  reasoning: 'The verify step failed because the answer message did not match the
    required regex ''^EUR \d+\.\d{2}$''. The PlanIR attempted to bind the total from
    the SQL output using a rowset with format ''single'' and column mapping candidates:
    [''total'']. However, the interpreter likely names the single column ''value''
    by default, so the binding to ''total_str'' failed, leaving the message empty
    or malformed. The observed RPC outputs are empty, but the error pattern indicates
    a column name mismatch. The existing in-session rule only advises using format
    ''single'', not the correct column name.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a SQL query filters on a column, always first verify the column exists
    in the source data by reading the header and checking column names; if the column
    is missing, branch to an unsupported outcome rather than executing the query.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: The verify error indicates the answer message did not match the expected
    EUR amount regex. The observed RPC outputs show the archive file header was read
    but contains no 'is_fraud' column. The PlanIR executed a SQL query filtering on
    'is_fraud = true', which likely failed because the column does not exist, causing
    the Exec RPC to return an error message. That error message was then captured
    as the total_msg, failing the regex. The plan should have included a step to parse
    the header, check for the required column, and branch to an unsupported outcome
    if missing.
  status: inactive
  surface: ir
