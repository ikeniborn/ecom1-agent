- agents_md_anchor: null
  content: When a security constraint specifies deny conditions, always include an
    allow branch or set the default label to 'allow' so that requests not meeting
    the deny condition are permitted.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The PlanIR decision block contains only a single branch that labels 'deny'
    when the guest-and-path-not-allowed condition is true, and the default_label is
    also 'deny'. This causes every request to be denied, even when the identity is
    not a guest or the path is allowed. The grader expected OUTCOME_OK but got OUTCOME_DENIED_SECURITY
    because the plan never produces an allow outcome. The fix is to structure the
    decision so that the deny condition triggers a deny branch, and the default (or
    an explicit allow branch) triggers the normal processing.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always strip leading and trailing whitespace from string values extracted
    from rowsets before using them in answer messages, to ensure they match strict
    regex patterns.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The verify error was regex mismatch on $answer.msg against '^EUR \d+\.\d{2}$'.
    The PlanIR extracted the formatted string from the SQL output via a rowset and
    used it directly in the answer message. SQL output often includes a trailing newline,
    which would cause the regex to fail. The plan lacked a trim step. No other failure
    indicators were present; the decision branch was 'ok', so the string was non-empty
    but contained whitespace.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always specify the predicate in filter_rows as a list with the operation
    name as the first element (e.g., ["in_set", "$row.column", ["val1", "val2"]])
    rather than a dict, because the implementation accesses the operation via attribute
    lookup.
  created: '2026-06-22'
  deactivated_reason: r003 incorrectly advises using a list for the predicate, which
    causes 'list' object has no attribute 'op' error; the correct form is a dict with
    an 'op' key.
  id: r003
  reasoning: The error 'dict' object has no attribute 'op' indicates that the filter_rows
    primitive attempted to access .op on the predicate dict, but dicts have keys,
    not attributes. The PlanIR used {"op":"in_set",...} as the predicate. The correct
    format is a list where the first element is the operation name, which can be accessed
    as an attribute or index. This is a PlanIR shape bug.
  status: inactive
  surface: ir
