- agents_md_anchor: null
  content: When a plan needs to filter rows based on a column in a TSV/CSV file, always first read the
    header, parse column names, and use a decision branch to check for the required column; if missing,
    branch to unsupported, otherwise proceed with filtering and computation.
  created: '2026-06-22'
  deactivated_reason: null
  id: r015
  reasoning: The plan read the header but did not parse it or check for the fraud indicator column; it
    immediately defaulted to unsupported. The plan must include a decision branch that checks the header
    for the required column and proceeds to filter and compute if present.
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a Read RPC output is used in a decision branch or any string operation, always first extract
    the 'content' field with a get primitive, because the bound variable is a ReadResponse protobuf, not
    a plain string.
  created: '2026-06-22'
  deactivated_reason: null
  id: r016
  reasoning: 'The error ''real_vm: Protocol message ReadResponse has no ''three_ds_status'' field.'' occurred
    because the plan used the bound variable ''header_line'' (a ReadResponse protobuf) directly in a ''contains_any''
    decision branch, causing the interpreter to attempt field access on the message. The failing fragment
    is the decision branch: ''when'': {''op'':''and'', ... ''args'':[{''op'':''contains_any'',''lhs'':''$header_line'',''rhs'':[''three_ds_status'',...]},
    ...]}. The correct approach is to first extract the ''content'' field from the ReadResponse. This
    rule ensures that string operations are applied to the content string, not the protobuf.'
  status: active
  surface: ir
- content: null
