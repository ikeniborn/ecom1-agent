- agents_md_anchor: null
  content: When an ops RPC duplicates a Read already bound in discovery for the same
    path and args, reuse the discovery binding instead of re-issuing the read.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''real_vm_exec: The read operation timed out''. Stat
    returned empty and the second full read never completed. Root cause: the script
    issues two identical full-file reads of the same large TSV — discovery binds archive_rows
    = vm.read(path=archive_path, number=False) and ops binds fraud_rows = vm.read(path=archive_path,
    number=False) with identical args. Failing fragment: ''archive_rows = vm.read(...)''
    followed by ''fraud_rows = vm.read(...)'' against the same archive_path, doubling
    I/O on the archive and tripping the read timeout. The tool_plan itself duplicates
    the Read across discovery and ops, but the CODEGEN fix is to dedupe at script
    level: detect that fraud_rows reads the same path/args as an existing binding
    and reuse it (content fallback already reads archive_rows, so the second read
    is dead I/O). Rule linkage: corrective technique tells CODEGEN to collapse redundant
    identical reads into one bound result, eliminating the timeout.'
  status: active
- agents_md_anchor: null
  content: Always re-issue every RPC declared in the tool_plan, including ops RPCs
    that duplicate a discovery RPC for the same path and args, because fidelity is
    verified by exact RPC multiset equality against the plan and any dedup/reuse drops
    a required call.
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: ''AssertionError: fidelity drift (RPC multiset) expected:
    [Answer, Read, Read, Stat] got: [Answer, Read, Stat]''. Root cause: tool_plan
    declares Stat+Read in discovery and a second Read in ops (4 RPCs incl. Answer);
    fidelity test compares the multiset of issued RPCs to the plan. Failing fragment:
    ''fraud_rows = archive_rows'' with comment ''reuse the discovery read (LEARNED_RULE)''
    — this skips vm.read in ops, yielding only one Read instead of two. The prior
    in-session reuse rule directly caused this drift. New rule inverts it: fidelity
    demands every planned RPC actually fire, so duplicate reads must be re-issued,
    not aliased.'
  status: active
