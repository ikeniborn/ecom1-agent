- agents_md_anchor: null
  content: Always emit exactly one terminal vm.answer carrying the answer_template's
    outcome on every code path, and wrap the script body in a try/except that still
    answers with that planned outcome on failure; an uncaught exception or a path
    that never calls vm.answer degrades the run to OUTCOME_NONE_CLARIFICATION instead
    of the OUTCOME_OK the plan declared.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''.
    answer_template fixes outcome=OUTCOME_OK, and every explicit vm.answer in SCRIPT_CODE
    passes OUTCOME_OK, so the only way the harness recorded OUTCOME_NONE_CLARIFICATION
    is that execution aborted before any vm.answer ran — an unhandled exception (e.g.
    in vm.stat/vm.read RPC dispatch, the assert, or cell parsing) propagated and the
    harness defaulted the missing answer to a clarification outcome. Failing fragment:
    the run() body has no surrounding try/except guaranteeing a terminal answer —
    `vm.answer(...)` is reachable only if all prior lines succeed, so any raise silently
    downgrades the outcome. Linkage: this is a CODEGEN technique for translating answer_template.outcome
    into a guaranteed terminal answer; distinct from r001/r002 (RPC multiset fidelity)
    and v001 (verdict record), which do not cover answer-emission guarantees.'
  status: active
- agents_md_anchor: null
  content: When answer_template.refs holds a runtime placeholder (e.g. $fraud_row_refs)
    that must expand to per-row refs parsed from a number=true Read, strip the Read
    tool's actual line-number gutter format before splitting the body on its delimiter
    and assert the built refs list is non-empty before vm.answer; a leftover gutter
    prefix shifts the first column and breaks header/column detection, so zero rows
    match and refs stay empty, failing refs verification even when outcome is OUTCOME_OK.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''answer_refs: template/constraints require runtime
    refs ([\''$fraud_row_refs\'']) but actual refs [] contain only static template
    entries [] — ... row parsing dropped the path column''. Root cause: answer_template.refs=[''$fraud_row_refs'']
    needs a runtime-built list, but SCRIPT_CODE parses the number=true Read with regex
    `^\s*\d+\t(.*)$` assuming a TAB gutter; Read''s gutter format differs, so the
    gutter is not stripped, the header split on TAB is shifted, fraud_idx/amount_idx/rowid_idx
    detection fails, the row loop appends nothing, and refs stays []. Failing fragment:
    the `re.match(r"^\s*\d+\t(.*)$", ln)` gutter-strip plus heuristic `_find` column
    detection, compounded by `except Exception: outcome=''OUTCOME_OK''` swallowing
    parse failure into an empty refs answer. Linkage: rule forces correct gutter stripping
    and a non-empty refs assertion so runtime ref placeholders are actually populated.
    Complements r003 (still answer OK) rather than superseding it — r003 covers terminal
    answer/outcome, this covers refs population.'
  status: active
