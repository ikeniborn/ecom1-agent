- agents_md_anchor: null
  content: When a plan's decision branches to an unsupported outcome, always set the
    decision's default_label to the exact outcome label (e.g., 'OUTCOME_NONE_UNSUPPORTED')
    and use that label as the key in the answer block, not a custom branch label.
  created: '2026-06-22'
  deactivated_reason: null
  id: r017
  reasoning: 'Error: grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION.
    Root cause: The PlanIR decision default_label was ''unsupported'' (a custom branch
    label) instead of the outcome label ''OUTCOME_NONE_UNSUPPORTED'', and the answer
    block key was ''unsupported'' rather than the outcome label. The plan interpreter
    could not resolve the outcome and defaulted to OUTCOME_NONE_CLARIFICATION. Failing
    fragment: decision.default_label = ''unsupported'', answer block key ''unsupported''.
    This rule ensures future plans use the exact outcome label for default_label and
    answer key.'
  status: active
  surface: ir
