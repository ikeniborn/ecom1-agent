- agents_md_anchor: '#discovery'
  content: When the objective references a file path, use a discovery step to read
    the file content (e.g., Exec with cat or a read RPC) and then parse it as delimited
    text, rather than assuming a database table.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: The plan attempted to query a TSV file using SQL via /bin/sql, which
    is not a valid approach for a flat file. The SQL query likely returned nothing,
    causing the decision to fall to the default 'no_fraud' branch and produce OUTCOME_NONE_UNSUPPORTED.
    The correct approach is to read the file content and parse it as a delimited rowset,
    then filter rows based on the fraud indicator column.
  status: inactive
  surface: ir
