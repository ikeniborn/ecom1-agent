- agents_md_anchor: null
  content: When the objective specifies a literal response token (e.g., '<NO>'), the
    answer message for any outcome that is not the desired outcome must include that
    token.
  created: '2026-06-22'
  deactivated_reason: r003 only required the literal token for non-desired outcomes,
    but the answer_shape skeleton must be used for the reached outcome regardless
    of desired status. This new rule supersedes it.
  id: r003
  reasoning: 'Grader error: ''Answer should contain ''<NO>''''. The plan''s claim_absent
    answer message was ''Product does not match (SKU: {sku})'' without the required
    token. The objective''s answer shape uses a {result} placeholder, which must be
    filled with the token for negative outcomes. The existing rule r001 already states
    the token must be used, but the plan did not apply it; this rule explicitly ties
    the token to non-OK outcomes to prevent recurrence.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use 'eq' as a compute primitive; equality comparisons should be
    performed in decision branches using the 'eq' operator.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The interpret error ''compute step eq failed: eq'' indicates the interpreter
    does not support ''eq'' as a compute primitive. The Plan used compute steps with
    prim ''eq'' to check cleaner_type and volume equality, but the interpreter rejected
    it. Decision branches already use ''eq'' operator successfully, so equality checks
    must be moved there.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a discovery step may return zero rows, always include a decision branch
    that checks for empty rowset and maps to an outcome that does not require nonempty
    refs from that rowset.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'ERROR: verify: success_criteria[OUTCOME_NONE_UNSUPPORTED][0] failed:
    {''op'': ''nonempty'', ''lhs'': ''$product.sku'', ''rhs'': None, ''args'': []}.
    OBSERVED_RPC_OUTPUTS show only column headers, no data rows, meaning the SQL query
    returned zero rows. The PlanIR discovery step binds the result to ''raw_product'',
    then ''first'' computes ''$product'' from an empty rowset, making ''$product.sku''
    empty. The decision tree''s second branch checks nonempty sku but the default
    label is also ''unsupported'', so the empty-rowset case falls through to the unsupported
    outcome, which requires nonempty sku in success_criteria. The plan lacks a branch
    for the empty-rowset case, causing a mismatch between the decision path and the
    outcome''s required refs.'
  status: inactive
  surface: ir
