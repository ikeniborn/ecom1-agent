- agents_md_anchor: null
  content: Never use 'column' on a single row (dict); 'column' expects a list of dicts.
    When you have a single row from 'first' or similar, use 'get' to extract a field.
    If the row could be None, guard with a conditional or use 'get' with a default.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r018
  reasoning: 'Error: ''column'' expects list[dict]; use ''get'' for a single row.
    PlanIR used ''first'' to get a single row, then ''column'' on that row. ''column''
    requires a list of dicts; ''get'' is for single dict. This caused plan failure.
    Fix: replace ''column'' with ''get'' when operating on a single row.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always define the exact variable name required by the TOOL_PLAN's required_refs
    (e.g., `$matched_product.record_path`) in the PlanIR's compute steps, and use
    that variable as the source in the answer's refs, rather than using a differently
    named variable like `$first_row.record_path`.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r019
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''''$matched_product.record_path'''']
    on OK answer''. Root cause: The PlanIR answer''s ref source is `$first_row.record_path`,
    but the TOOL_PLAN''s required_refs specify source `$matched_product.record_path`.
