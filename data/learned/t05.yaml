- agents_md_anchor: '#answer-generation'
  content: When the answer_shape specifies a literal token, the answer message for
    the reached outcome must be generated by substituting variables into that skeleton,
    not by using a different literal string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'The grader error ''Answer should contain ''<NO>'''' occurred because
    the OK branch answer message was ''YES, SKU: {sku}'' instead of the required skeleton
    ''<NO> (SKU: {sku})''. The answer_shape skeleton applies to the outcome that is
    reached, regardless of label. The existing rule r003 only mandates the token for
    non-desired outcomes, which is insufficient when the skeleton itself contains
    the token for the desired outcome. This rule ensures the answer message always
    matches the skeleton.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required ref source is '$row.<column>', the answer ref must use
    that exact source and the rowset must include a column named '<column>' bound
    from discovery; do not extract the column into a separate variable and use that
    variable as the ref source.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''$row.record_path'']
    on OK answer''. The intent spec requires ref source ''$row.record_path''. The
    PlanIR compute step extracted record_path into a variable ''record_path'' and
    the answer ref used source ''$record_path'', which does not match the required
    source. The rowset already has a column ''record_path'' bound from the SQL output,
    so the answer ref should directly use ''$row.record_path'' without an intermediate
    compute step. The mismatch caused the interpreter to fail to resolve the ref.'
  status: inactive
  surface: ir
