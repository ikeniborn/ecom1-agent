- agents_md_anchor: null
  content: 'Always decompose catalogue-variant verification PlanIR into two sequential
    discovery bindings: first filter the base candidate rowset by the claim entity
    tokens to bind the base SKU and its record path; then filter the variant property
    rowset by that bound SKU and the claimed extra attributes to bind a hit indicator.
    Emit a single OUTCOME_OK answer mapping conditioned on whether the base binding
    and property hit binding are non-empty, using a message pattern that interpolates
    a YES/NO verdict and the bound SKU, and project only the base record path as the
    ref.'
  created: '2026-06-19'
  deactivated_reason: superseded by prescriptive broad-OR rc1
  id: r012
  reasoning: 'ERROR: ''plan: PLAN LLM returned empty response'' with empty SCRIPT_CODE.
    Root cause is existing rule [rc1], which attempts to encode the entire PlanIR—including
    literal SQL, answer message templates, and ref projection—into one verbose prose
    paragraph. This overloads the PLAN LLM and causes it to return nothing. The fix
    is a structural rule that instructs the planner to emit clean sequential rowset
    bindings and a single conditional answer mapping without embedding executable
    SQL or literal values.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always decompose catalogue-variant verification PlanIR into exactly two
    sequential Discovery bindings followed by one Answer binding: first filter CATALOGUE_CANDIDATES
    by the claim entity tokens to bind the base product_sku; second filter product_variant_properties
    by that bound SKU and by BOTH claimed extra attributes to bind a hit indicator.
    Emit a single OUTCOME_OK Answer mapping with three branches—message contains YES
    and the bound SKU when both bindings are non-empty; message contains NO and the
    bound SKU when the base binding is non-empty but the property hit is empty; message
    contains NO with no SKU when the base binding is empty—and project an empty refs
    list for every branch because required_refs[OUTCOME_OK] is empty.'
  created: '2026-06-19'
  deactivated_reason: superseded by prescriptive broad-OR rc1
  id: r013
  reasoning: 'The error is a completely empty PLAN response. Root cause is contradictory
    structural guidance in active rules: rc1 embeds literal SQL and states ''NO Answer
    op'' while simultaneously describing an answer mapping, and both rc1 and [in-session]
    mandate projecting a base record_path ref that directly conflicts with TOOL_PLAN.required_refs[OUTCOME_OK]=[].
    This contradiction paralyzes the PLAN LLM. Additionally, the prior rules fail
    to explicitly instruct a composite filter for both extra attributes (screw type
    and pack count). The new rule resolves all conflicts by prescribing two Discovery
    bindings, a single OUTCOME_OK Answer with three clear branches, and an empty refs
    list.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always build PlanIR for catalogue claim-verification tasks that require
    a negative answer template by first deriving the candidate rowset from pre-phase
    CATALOGUE_CANDIDATES via normalized attribute matching, then projecting the record's
    `record_path` into `checked_record_path` and the SKU into `checked_sku`, and finally
    using a decision branch to bind `answer_text` to the required negative format
    string containing both the checked SKU and the cited record path whenever the
    claimed multi-attribute combination is absent from the matched record.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r014
  reasoning: 'The error is `plan: PLAN LLM returned empty response`. The root cause
    is the absence of a structural pattern telling the planner how to emit a conditional-verification
    PlanIR that ends in a hardcoded negative answer shape with mandatory record citations.
    With an empty PlanIR (no JSON produced), the cycle never reached execution. Existing
    rule rc1 advises normalization and grounding but does not prescribe the decision-branch
    shape or the explicit result-field projection (`checked_record_path`, `checked_sku`,
    `answer_text`) needed when the instruction mandates a `<NO>`-style template. The
    new rule supplies the missing PlanIR skeleton: match candidates → inspect claimed
    attributes → branch → populate citation fields and bind the negative template.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Always emit a non-empty PlanIR for catalogue claim-verification tasks that
    require a negative-answer template by first defining a rowset against CATALOGUE_CANDIDATES
    filtered with normalized case-/whitespace-insensitive product-line tokens, then
    projecting the matched record's record_path and sku into checked_record_path and
    checked_sku, and finally binding answer_text to the required negative format string
    that includes both projected values; never return an empty plan even if the claimed
    multi-attribute combination is absent.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r015
  reasoning: 'Error is plan: PLAN LLM returned empty response. The failing PlanIR
    fragment is the entirely empty SCRIPT_CODE. Root cause: the existing in-session
    rule described the desired logic but did not explicitly forbid an empty plan output,
    so the planner stalled instead of emitting the mandatory skeleton when it needed
    to produce a negative answer. The new rule directly corrects this by mandating
    the exact non-empty node sequence (rowset → projection → bind) and removing ambiguity
    about whether to emit anything when the claim is false.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never wrap PlanIR JSON in markdown code fences; emit raw structured JSON
    without language tags or triple-backtick delimiters so downstream parsers consume
    it directly.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r016
  reasoning: 'Error: ''plan: PLAN: could not parse JSON; head: \''```json\n{\''...''.
    Root cause: the planner enclosed the PlanIR in a ```json markdown block, causing
    the strict JSON parser to fail on the leading backticks and language tag. Failing
    fragment: the JSON began with ''```json'' rather than a bare object. Existing
    rules r014/r015 define the internal rowset and projection semantics but do not
    constrain the outer envelope; this new rule closes that gap by mandating raw JSON
    output.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never include a separate `params` (bound-parameter) field in an Exec RPC's
    args — the ExecRequest protocol message has no `params` field; inline the normalized,
    case-/whitespace-insensitive filter literals directly into the SQL stdin string
    (e.g. LOWER(TRIM(brand)) = LOWER(TRIM('<value>'))) instead of using named placeholders
    (:foo) backed by an external params map.
  created: '2026-06-19'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r017
  reasoning: 'Verbatim error: ''real_vm: Protocol message ExecRequest has no "params"
    field.'' Root cause: the PlanIR discovery step emits an Exec RPC whose args carry
    a `params` object — failing fragment {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"...WHERE
    LOWER(TRIM(brand)) = LOWER(TRIM(:brand)) ...","params":{"brand":"Heco","series":"Zinc
    Plated","model":"TopFix GTU-YPJ"}}}. The SQL uses named placeholders (:brand/:series/:model)
    bound through a `params` map, but the ExecRequest schema accepts only path/stdin
    — there is no parameter-binding channel, so the VM rejects the message before
    any RPC runs. Fix is a PlanIR-shape change: drop the `params` field and inline
    the literals into the stdin SQL itself. Linkage: complements rc1/r015 (normalized
    matching, non-empty plan) by constraining HOW filter values reach the Exec RPC
    — through the SQL string, never an external bound-params object.'
  status: inactive
  surface: ir
