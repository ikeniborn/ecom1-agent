- agents_md_anchor: null
  content: 'Catalogue tasks (existence / claim-verification / count): identify the
    product by its attributes matched NORMALIZED (case- and whitespace-insensitive),
    preferring the real rows in the pre-phase CATALOGUE_CANDIDATES fact over a guessed
    query; ground every positive/identifying answer in the matched record''s record_path;
    produce the answer token/format the instruction asks for; both present and absent
    are OUTCOME_OK (never CLARIFICATION). This is a general method — derive concrete
    SQL/values from THIS run''s facts, never reuse a fixed recipe.'
  created: '2026-06-18'
  deactivated_reason: Both mandate projecting a base record_path ref that conflicts
    with TOOL_PLAN.required_refs[OUTCOME_OK]=[]; rc1 additionally embeds literal SQL
    and contradictory 'NO Answer op' phrasing that prevents clean PlanIR generation;
    the dense [in-session] rule fails to disambiguate the dual-attribute check and
    ref policy, causing the PLAN LLM to return empty.
  id: rc1
  pinned: true
  reasoning: 'General method-not-value rule (reverted from prescriptive prose per
    user directive: execution CONTROL belongs in the harness check-specs + interpreter
    scripts, not in task-prose). Pinned.'
  status: active
