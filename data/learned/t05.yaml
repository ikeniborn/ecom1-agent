- agents_md_anchor: null
  content: 'Always decompose catalogue-variant verification PlanIR into two sequential
    discovery bindings: first filter the base candidate rowset by the claim entity
    tokens to bind the base SKU and its record path; then filter the variant property
    rowset by that bound SKU and the claimed extra attributes to bind a hit indicator.
    Emit a single OUTCOME_OK answer mapping conditioned on whether the base binding
    and property hit binding are non-empty, using a message pattern that interpolates
    a YES/NO verdict and the bound SKU, and project only the base record path as the
    ref.'
  created: '2026-06-19'
  deactivated_reason: superseded by prescriptive broad-OR rc1
  id: r012
  reasoning: 'ERROR: ''plan: PLAN LLM returned empty response'' with empty SCRIPT_CODE.
    Root cause is existing rule [rc1], which attempts to encode the entire PlanIR—including
    literal SQL, answer message templates, and ref projection—into one verbose prose
    paragraph. This overloads the PLAN LLM and causes it to return nothing. The fix
    is a structural rule that instructs the planner to emit clean sequential rowset
    bindings and a single conditional answer mapping without embedding executable
    SQL or literal values.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: 'Always decompose catalogue-variant verification PlanIR into exactly two
    sequential Discovery bindings followed by one Answer binding: first filter CATALOGUE_CANDIDATES
    by the claim entity tokens to bind the base product_sku; second filter product_variant_properties
    by that bound SKU and by BOTH claimed extra attributes to bind a hit indicator.
    Emit a single OUTCOME_OK Answer mapping with three branches—message contains YES
    and the bound SKU when both bindings are non-empty; message contains NO and the
    bound SKU when the base binding is non-empty but the property hit is empty; message
    contains NO with no SKU when the base binding is empty—and project an empty refs
    list for every branch because required_refs[OUTCOME_OK] is empty.'
  created: '2026-06-19'
  deactivated_reason: superseded by prescriptive broad-OR rc1
  id: r013
  reasoning: 'The error is a completely empty PLAN response. Root cause is contradictory
    structural guidance in active rules: rc1 embeds literal SQL and states ''NO Answer
    op'' while simultaneously describing an answer mapping, and both rc1 and [in-session]
    mandate projecting a base record_path ref that directly conflicts with TOOL_PLAN.required_refs[OUTCOME_OK]=[].
    This contradiction paralyzes the PLAN LLM. Additionally, the prior rules fail
    to explicitly instruct a composite filter for both extra attributes (screw type
    and pack count). The new rule resolves all conflicts by prescribing two Discovery
    bindings, a single OUTCOME_OK Answer with three clear branches, and an empty refs
    list.'
  status: inactive
  surface: ir
