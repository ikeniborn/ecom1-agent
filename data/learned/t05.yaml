- agents_md_anchor: null
  content: When invoking `/bin/sql` via the `Exec` RPC, always write the SQL statement
    into the `stdin` field and never pass it via a `-c` command-line argument.
  created: '2026-06-19'
  deactivated_reason: superseded by simplified pinned rc1
  id: r007
  reasoning: 'Error was `interpret: sql returned usage banner — SQL not delivered
    via stdin`. Root cause: the PlanIR routed the SQL text into the `args` array prefixed
    with `-c`, while the `/bin/sql` binary expects the statement on its standard input
    stream; the interpreter therefore received a usage banner and no rows. Failing
    PlanIR fragment: `"args":["-c","WITH base AS ..."]`. The rule corrects the PlanIR
    shape to align with the tool''s interface by mandating SQL delivery through `stdin`.'
  status: inactive
  surface: ir
