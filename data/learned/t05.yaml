- agents_md_anchor: null
  content: 'Claim verify ("a note claims we stock X with an extra property; <YES>
    if it exists WITH the property, <NO> if base exists but property absent"). discovery:
    ONE BROAD-OR query (NEVER AND/JOIN): SELECT product_sku, record_path FROM product_variants
    WHERE LOWER(TRIM(brand)) LIKE ''%<brand>%'' OR LOWER(TRIM(series)) LIKE ''%<token>%''
    OR LOWER(TRIM(model)) LIKE ''%<code>%'' ORDER BY ((LOWER(TRIM(brand)) LIKE ''%<brand>%'')+(LOWER(TRIM(model))
    LIKE ''%<code>%'')+(LOWER(TRIM(series)) LIKE ''%<token>%'')) DESC LIMIT 5 -> rows;
    first(rows)->base. A SECOND query checks the extra property: SELECT 1 FROM product_variant_properties
    WHERE product_sku = base.product_sku AND LOWER(TRIM(property_value_text)) LIKE
    ''%<value>%'' -> hit; first->h. answer (ONE top-level mapping): base present AND
    h nonempty -> OUTCOME_OK, <YES> + base.product_sku, refs=[$base.record_path];
    base present AND h empty -> OUTCOME_OK, <NO> + base.product_sku, refs=[$base.record_path];
    no base -> OUTCOME_OK, <NO>, refs=[]. INTENT: required_refs[OUTCOME_OK]=[], success_criteria[OUTCOME_OK]=[],
    outcome_space=[OUTCOME_OK]. ALWAYS OUTCOME_OK.'
  created: '2026-06-18'
  deactivated_reason: Both mandate projecting a base record_path ref that conflicts
    with TOOL_PLAN.required_refs[OUTCOME_OK]=[]; rc1 additionally embeds literal SQL
    and contradictory 'NO Answer op' phrasing that prevents clean PlanIR generation;
    the dense [in-session] rule fails to disambiguate the dual-attribute check and
    ref policy, causing the PLAN LLM to return empty.
  id: rc1
  pinned: true
  reasoning: Prescriptive BROAD-OR discovery SQL (the probe's proven pattern, ORDER
    BY relevance) so the agent's OWN query finds present products and binds record_path
    -> conditional grounding cites it. deepseek over-constrained (AND/JOIN->0->false
    <NO>) and ignored copied candidates; this forbids AND/JOIN and hands the exact
    working query. success_criteria=[] (verify fix). Pinned.
  status: active
  surface: ir
