  deactivated_reason: null
  id: r013
  reasoning: 'Error: verify: I1: required ref source(s) [''$product_variant.record_path'']
    did not resolve on OUTCOME_NONE_UNSUPPORTED answer. Root cause: The PlanIR answer
    for the unsupported branch uses ref source ''$record_path'', but the IntentSpec
    requires ''$product_variant.record_path''. The compute step sets variable ''record_path''
    instead of ''product_variant.record_path''. The verify phase cannot resolve the
    ref because the variable name does not match. The same issue exists for the ok
    branch. The fix is to compute a variable named exactly ''product_variant.record_path''
    and reference it in both answer refs.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'Never use a dotted variable name (e.g., ''$product_variant.record_path'')
    as the ''into'' target of a ''get'' primitive. Instead, first compute the value
    into a simple variable (e.g., ''$record_path'') using ''get'', then use a ''let''
    primitive to bind the dotted name: {''prim'':''let'', ''args'':[''$product_variant.record_path'',
    ''$record_path'']}. If ''let'' is unavailable, use ''merge'' to build an object
    with the required dotted path.'
  created: '2026-06-24'
  deactivated_reason: null
  id: r014
  reasoning: 'Error: verify: I1: required ref source(s) [''$product_variant.record_path'']
    did not resolve on OUTCOME_NONE_UNSUPPORTED answer (resolve-before-cite). Root
    cause: The compute step ''{"prim":"get","args":["$product_row","record_path"],"into":"$product_variant.record_path"}''
    attempted to set a variable with a dot in its name. The PlanIR interpreter does
    not support dots in variable names, so the variable was never created, leaving
    the required ref unresolved. The in-session rule ''Always match the answer ref
    source variable name exactly...'' prompted this approach but is insufficient because
    ''get'' cannot target dotted names. A two-step compute (simple variable + let
    alias) is needed.'
  status: active
  surface: ir
