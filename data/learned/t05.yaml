- agents_md_anchor: null
  content: Do not use Exec RPC with a raw SQL string argument for tabular discovery
    queries; instead use a Query RPC that passes table, columns, and filter conditions
    as structured JSON parameters to avoid escaping failures that corrupt PlanIR.
  created: '2026-06-19'
  deactivated_reason: superseded by pinned rc1
  id: r008
  reasoning: 'Error: `plan: PLAN: could not parse JSON; head: ''{"discovery":[{"rpc":"Exec","args":{"path":"/bin/sql","args":["WITH
    base AS (SELECT product_sku, record_path FROM product_variants WHERE brand=\''Ajax\''
    AND series=\''Eco\'' AND model=\''Classic 25C-DXE\'' ORDER...''`. The planner
    emitted a discovery step as an `Exec` RPC to `/bin/sql` containing a complex multi-line
    SQL CTE with string literals. Embedding raw SQL inside a JSON string field is
    fragile: quotes, backslashes, and newlines easily break serialization, producing
    unparseable PlanIR and leaving SCRIPT_CODE empty. The root cause is the choice
    of `Exec` with an inline SQL payload instead of a structured query RPC. The rule
    enforces using a native `Query` RPC with table/columns/filters as structured objects,
    eliminating JSON escaping risks.'
  status: inactive
  surface: ir
