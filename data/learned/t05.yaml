  id: r001
  reasoning: 'Error: ''grader: Answer should contain \''<NO>\''''. Root cause: The
    PlanIR''s found_base_only branch answer message was ''NO {all_rows.0.product_sku}''
    instead of ''<NO> {all_rows.0.product_sku}''. The objective explicitly requires
    responding with ''<NO>'' and the product SKU when the base product exists but
    the claim is absent. The answer_shape skeleton ''{status} {sku}'' is generic;
    the literal ''<NO>'' must be used exactly as specified.'
