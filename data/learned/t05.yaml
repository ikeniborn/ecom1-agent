- agents_md_anchor: null
  content: 'Claim verify ("a note claims we stock X ... cite the record; <YES> if
    it exists, <NO> if base exists but the extra property is absent"). ONE discovery
    query: SELECT product_sku, record_path FROM product_variants WHERE brand + ONE
    series/model token matched (LOWER/TRIM LIKE; use facts CATALOGUE_CANDIDATES).
    compute: count(rows)->n; first(rows)->r. decision: n ge 1 -> present else absent.
    answer (ONE top-level mapping, NO Answer op): present -> OUTCOME_OK, message contains
    <YES> and the SKU, refs [$r.record_path]; absent -> OUTCOME_OK, message contains
    <NO>, refs []. INTENT: required_refs[OUTCOME_OK]=[]; outcome_space [OUTCOME_OK].
    ALWAYS OUTCOME_OK, never CLARIFICATION/UNSUPPORTED. Keep the plan minimal.'
  created: '2026-06-18'
  deactivated_reason: 'Superseded: rc1 directs the PLAN phase to use specific SQL/query-level
    constructs (CATALOGUE_CANDIDATES, first(rows)) that belong to the interpret phase,
    causing planner paralysis and empty responses.'
  id: rc1
  pinned: true
  reasoning: 'Simplified-for-convergence (user-chosen): minimal single-query IR, terse
    imperative, 1-cycle target. Trades some correctness for the plan actually reaching
