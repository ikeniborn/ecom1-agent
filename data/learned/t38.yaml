- content: Never assume the known fraud hit is identified by the presence of the word
    'fraud' or 'fraudulent' in file content. Instead, first enumerate all archived
    payment files using find /proc/payments -type f, then read each file to search
    for the specific fraud hit reference identifier or other fraud indicator as provided
    by Risk Ops, to fulfill the spec_goal 'Identify all payment records in /proc/payments/
    that are associated with the known fraud hit'.
