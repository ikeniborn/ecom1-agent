- content: Never use a literal keyword search (e.g., 'fraud') as the sole method to
    identify fraudulent records when the spec_goal is 'Identify the fraudulent payment
    record(s) from archived payments with full filesystem paths, and cite each one'.
    Always first explore the directory structure (tree:/proc/) and then read payment
    files to detect fraud indicators such as flags, status fields, or other markers.
  created: '2026-05-21'
  deactivated_reason: New rule supersedes r001 by unconditionally forbidding the literal
    keyword search action, closing the loophole that allowed its use as part of a
    multi-step plan.
  id: r001
  reasoning: 'Verbatim error: ''Empty result:''. Root cause: wrong-filter – the keyword
    ''fraud'' is not present in any archived payment file, resulting in empty search.
    Failing fragment: action ''search:fraud /proc/payments/'' from SDD_OUTPUT and
    PLAN_OUTPUT. Rule linkage: the new rule will prohibit literal keyword searches
    for fraud identification and mandate directory exploration + content inspection
    instead.'
  source: learn
  status: inactive
- content: Always include read actions for payment files in the actions list when
    the spec_goal is 'Identify the fraudulent payment record(s) from archived payments
    with full filesystem paths, and cite each one'.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r002'
  id: r002
  reasoning: 'Verbatim error: ''Unable to identify fraudulent payment record. The
    listing of /proc/payments/ shows many payment files but no fraud label. <NO>''.
    Root cause category: wrong-action. Failing fragment: action list ''list:/proc/payments/''
    only, without any read operations. Rule linkage: new rule references spec_goal
    ''Identify the fraudulent payment record(s) from archived payments with full filesystem
    paths, and cite each one''.'
  source: learn
  status: inactive
- content: Never include a literal keyword search action (e.g., 'search:fraud') in
    any action list or plan when the spec_goal is 'Identify the fraudulent payment
    record(s) from archived payments with full filesystem paths, and cite each one'.
    Instead, rely solely on directory exploration (tree:/proc/payments/) and reading
    payment files to detect fraud indicators such as flags, status fields, or other
    markers.
  created: '2026-05-21'
  deactivated_reason: r003 contradicts r004 by mandating tree as the sole exploration
    method; this caused the agent to use tree first, which was flagged as repeated
    because it had been used previously. Deactivating r003 enforces r004's preference
    for list as first action and avoids action repetition.
  id: r003
  reasoning: 'Error: ''Repeated action detected — must use a different query or approach.
    Action was: search:fraud /proc/payments/'' — root cause category: wrong-action
    — failing fragment: action ''search:fraud /proc/payments/'' in SDD_OUTPUT — rule
    linkage: r001 prohibits literal keyword search as sole method, but spec_goal and
    success_criteria still allowed it; the action was reused causing repetition. A
    stronger rule is needed to absolutely forbid the search:fraud action for this
    spec_goal.'
  source: learn
  status: inactive
- content: Always prefer the list action over the tree action as the first directory
    enumeration step when the spec_goal is 'Identify the fraudulent payment record(s)
    from archived payments with full filesystem paths, and cite each one', to avoid
    timeout; tree may be used only as a fallback if list does not reveal the full
    structure.
  created: '2026-05-21'
  deactivated_reason: 'Consolidated: r004'
  id: r004
  reasoning: 'Verbatim error: ''Execute exception ["Explore the directory structure
    and enumerate all payment f]: The read operation timed out''. Root cause: wrong-spec
    (the spec''s actions list included tree:/proc/payments/ as the first exploration
    step, which timed out because the directory is too large). Failing fragment: action
    ''tree:/proc/payments/'' from both SDD_OUTPUT actions list and PLAN_OUTPUT action.
    Rule linkage: new rule must enforce that for the given spec_goal, the first directory
    exploration action should be list instead of tree to avoid timeout.'
  source: learn
  status: inactive
- content: Always use the list action as the first directory enumeration step when
