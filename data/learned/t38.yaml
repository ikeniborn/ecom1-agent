- agents_md_anchor: null
  content: Do not emit an empty PlanIR (no discovery, no rowsets, no compute, empty
    decision.branches) that falls through to a params_missing/clarification default
    just because the IntentSpec flags the entity-identifying params as 'not provided
    in the instruction'; when the objective names operationally-grounded entities
