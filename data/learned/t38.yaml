- content: 'IDD phase for fraud detection MUST set scope_estimate.files_to_read=120
    (there are approximately 120 timestamp-named payment files). This is critical:
    the pipeline uses files_to_read to compute batch_cap = ceil(120/remaining_cycles)+2
    files per batch. Without this, batch_cap defaults to 6, causing inefficient reads.
    With files_to_read=120 and 11 remaining cycles, batch_cap=13 → reads 13 timestamp
    files per cycle → all 120 files covered in ~9 cycles. Always set scope_estimate={"files_to_read":
    120} in IDD output. IMPORTANT: SDD must also list at least batch_cap timestamp
    file paths as actions each cycle (not fewer) so the pipeline does not fall back
    to adding numbered pay_001-080 files from tree_fill.'
  created: '2026-05-27'
  deactivated_reason: null
  id: r073
  reasoning: Actual count is 120 timestamp files (2025-06-27 to 2025-07-01+), not
    60. Run 3 read only 53/120 in 8 cycles. Also SDD listing <batch_cap files causes
    numbered files to fill batch slots via tree_fill (alphabetically sorted, numbered
    before timestamp).
  source: manual
  status: active
- content: 'Always emit ANSWER phase output as pure JSON object matching exactly {reasoning:
    string, message: string, outcome: ''OUTCOME_OK''|''OUTCOME_NONE''|''OUTCOME_CONTINUE'',
    grounding_refs: [string]}. Never wrap in markdown code fences. Never output narrative
    paragraphs outside the JSON structure. If still collecting data (files unread,
    cycles remain), set outcome=''OUTCOME_CONTINUE'' and grounding_refs=[]. Only set
    outcome=''OUTCOME_OK'' when velocity cluster fully confirmed. Malformed or prose
    ANSWER output causes immediate parse failure.'
  created: '2026-05-27'
  deactivated_reason: r074 stated the same rule but failed to prevent recurrence;
    new rule supersedes with explicit OUTCOME_CONTINUE example and first/last character
    constraint.
  id: r074
  reasoning: 'Verbatim error: ''ANSWER phase: failed to parse LLM output''. Root cause:
    wrong-spec — ANSWER phase emitted non-parseable output (narrative prose, markdown
    fences, or malformed JSON) instead of required structured schema {reasoning, message,
    outcome, grounding_refs}. Failing fragment: PLAN_OUTPUT action reads single file
    then hands to ANSWER, which likely tried to dump multi-file aggregation reasoning
    as free-form text rather than structured JSON. No existing rule governs ANSWER
    phase output format. Rule linkage: rule must constrain ANSWER phase output to
    strict JSON schema matching the expected fields, prohibiting prose or code-fence
    wrapping.'
  source: learn
  status: inactive
- content: 'Always keep SDD phase output compact: spec_goal must be under 120 characters,
    each success_criteria item under 80 characters, and plan/actions fields must not
