    table — JOIN it (it DOES exist). Two-step method in ONE SQL: (1) IDENTIFY the
    single compromised account: the fraud customer is the one owning a SINGLE device_fingerprint
    that exhibits impossible travel — per device, order archived rows by payment_created_at
    and compute consecutive-leg (ABS(observed_latitude-LAG(observed_latitude))+ABS(observed_longitude-LAG(observed_longitude)))/NULLIF((julianday(payment_created_at)-julianday(LAG(payment_created_at)))*24.0,0)
    deg/hr; the fraud device is the one whose MAX abs deg/hr is impossibly high (>5,
    faster than ~500 km/h). Take that device''s customer_id. Other customers may show
    multi-DEVICE impossible travel — those are red herrings; only a SINGLE device
    physically teleporting marks the real hit, and there is exactly one. (2) FLAG
    the fraud records: every archived payment OF THAT CUSTOMER whose observed location
    is FAR FROM the customer''s registered home — (ABS(observed_latitude-home_latitude)+ABS(observed_longitude-home_longitude))
