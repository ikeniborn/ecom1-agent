    a different attribute (e.g., filename, metadata, or a specific fraud hit reference).
    Failing fragment: spec_goal phrase ''likely containing \"fraud\" or \"fraudulent\"
    keywords'' and the action ''search:fraud /proc/payments/''. Rule linkage: new
    rule must prohibit assuming keyword presence without empirical evidence from Risk
    Ops or file inspection.'
  source: learn
  status: inactive
- content: Always use find /proc/payments -type f as the initial enumeration action
    for archived payment files in /proc/payments/ (instead of tree:/proc/payments/)
