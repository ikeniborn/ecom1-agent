- agents_md_anchor: null
  content: For a read-only data-access or classification task (the plan's `ops` contains
    no mutation), do NOT author a `security` constraint whose `deny_when` depends
    on identity alone (e.g. `identity.kind`); reading or classifying records is permitted
    regardless of identity kind. Reserve `OUTCOME_DENIED_SECURITY` for a protected
    mutation (checkout / refund / discount / account change).
  created: '2026-06-23'
  deactivated_reason: null
  id: g001
  pinned: true
  reasoning: An identity-only security deny on a read-only task caused a terminal
    over-refusal; identity alone is not grounds for a security denial when nothing
    is being mutated.
  status: active
  surface: ir
- agents_md_anchor: null
  content: 'To identify fraudulent archived payment records, do NOT guess `payment_status`
    literal values. FIRST DISCOVER the marking: run `SELECT DISTINCT payment_status,
    three_ds_status FROM payment_transactions WHERE is_archived_basket_reference =
    1` (and inspect related 3DS columns) to learn the actual values present. THEN
    read the payments / 3DS policy doc (e.g. /docs/payments/3ds.md) for the criteria
    that flag a payment as fraudulent, and select rows matching those criteria. Apply
    a customer-ownership filter only if the requester is a customer. Cite each matching
    record''s record_path.'
  created: '2026-06-23'
  deactivated_reason: null
  id: g002
  pinned: true
  reasoning: Prior failures guessed payment_status literal values and read the wrong
    (identity) doc /docs/security.md. The correct method is to DISCOVER actual status
    values via SELECT DISTINCT first, then consult the payments/3DS policy doc for
    fraud criteria. Discover-don't-guess + the payments/3DS doc fixes both failure
    modes.
  status: active
  surface: ir
