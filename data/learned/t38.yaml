  content: Always make the answer object the explicit `return {"message":..., "outcome":...,
    "refs":...}` value of run(); never rely solely on a trailing vm.answer(...) side-effect
    call, because the grader captures the outcome from run()'s return value — a body
    that calls vm.answer() but then falls through to an implicit None return registers
    no outcome and defaults to OUTCOME_NONE_CLARIFICATION.
  created: '2026-06-05'
  deactivated_reason: null
  id: r028
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION''.
    Root cause: script never returns a value — final statement is the side-effect
    call vm.answer(message=message, outcome="OUTCOME_OK", refs=refs) and run() falls
    through to implicit None. The grader reads run()''s RETURN value (per answer_template
    contract {message,outcome,refs}), not the vm.answer side-effect, so the captured
    outcome is empty and defaults to OUTCOME_NONE_CLARIFICATION despite the script
    correctly building OUTCOME_OK. Failing fragment: `vm.answer(message=message, outcome="OUTCOME_OK",
    refs=refs)` as last line with no `return`. Linkage: existing r017/r019 only mandate
    ordering of a returned dict (emit before heavy parsing) and assume `return` is
    used; none forbid using vm.answer''s side-effect in place of a return. This rule
    adds the missing mechanism constraint: the outcome contract is the return value,
    not the helper call.'
  status: active
