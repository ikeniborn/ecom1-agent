    Rule linkage: Existing rule r003 states ''Never include a literal keyword search
    action... rely solely on directory exploration (tree:/proc/payments/) and reading
    payment files'' – this misled the agent to use tree as the mandatory first step,
    ignoring r004 which says ''Always prefer the list action over the tree action
    as the first directory enumeration step''. The repetition error occurred because
    tree was reused from a prior cycle, which would have been avoided if list had
    been used first as r004 prescribes.'
  source: learn
  status: inactive
