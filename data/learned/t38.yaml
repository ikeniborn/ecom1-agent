- agents_md_anchor: null
  content: When using Exec with /bin/sql, always provide the SQL query as the stdin
    string and do not use args for parameter substitution; embed parameter values
    directly into the SQL string using compute steps to construct the query.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. Root cause: The second Exec step for /bin/sql included both ''stdin''
    and ''args'' with --param flags. The Exec RPC likely ignored stdin when args were
    present, causing the sql binary to receive no query and print its usage banner.
    Failing PlanIR fragment: {"rpc":"Exec","args":{"path":"/bin/sql","stdin":"SELECT
    record_path FROM payment_transactions WHERE device_fingerprint = :device_fp OR
    payment_method_fingerprint = :method_fp;","args":["--param","device_fp=$fraud_device_fp","--param","method_fp=$fraud_method_fp"]}}.
    The correct PLAN technique is to construct the full SQL string with embedded values
    via a compute step and pass it as stdin only.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Do not use logical operators (or, and, not) in decision branch conditions;
    instead, use multiple branches with the same label to represent OR conditions,
    and nested branches for AND conditions.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'The plan produced OUTCOME_NONE_CLARIFICATION, indicating the decision
    block''s condition evaluation failed. The condition used ''or'' and ''not'' operators,
    which are likely unsupported by the PlanIR interpreter. The plan should have used
    two separate branches with the same ''denied'' label: one for fraudulent_count
    != 1 and one for empty record_paths.'
  status: inactive
  surface: ir
