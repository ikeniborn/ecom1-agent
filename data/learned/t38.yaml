- agents_md_anchor: null
  content: Always define a rowsets entry for any discovery bind (from a Search RPC)
    that will be used with a 'column' or 'list' primitive in the compute section,
    before referencing that bind in compute.
  created: '2026-06-21'
  deactivated_reason: null
  id: r003
  reasoning: 'Error: ''plan: list primitive consumes a raw discovery bind; parse it
    with a rowsets entry first (compute ''column'' arg $archive_search_results); list
    primitive consumes a raw discovery bind; parse it with a rowsets entry first (compute
    ''column'' arg $fraud_search_results)''. Root cause: The PlanIR has a compute
    section with ''column'' primitives directly referencing discovery bindings ($archive_search_results,
    $fraud_search_results) without first parsing them into a rowsets entry. The system
    requires that discovery results be structured via a rowsets entry before column
    extraction. Failing PlanIR fragment: ''compute'': [{''prim'':''column'',''args'':[''$archive_search_results'',''path''],...},
    ...] with ''rowsets'':[]. The existing in-session rule about discovering archive
    paths is correct but insufficient; it does not enforce the necessary plan structure.
    This new rule fills that gap.'
  status: active
  surface: ir
