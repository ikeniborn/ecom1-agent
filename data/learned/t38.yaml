- content: Never return a CLARIFICATION response during the ANSWER phase when the
    spec_goal is to collect fraud payment file paths; reserve progress status and
    counts of remaining files for the CLARIFICATION phase and use the ANSWER phase
    only for the final outcome. Do not hardcode expected record counts into success_criteria
    or spec_goal without first verifying them against actual directory tree results.
  created: '2026-05-26'
  deactivated_reason: 'Consolidated: r048'
  id: r048
  reasoning: 'Verbatim error: ''ANSWER phase: failed to parse LLM output''. Root cause:
    wrong-action / wrong-spec. The SDD spec_goal hardcodes ''collect exactly 18 fraudulent
    payment file paths'' and existing rule r045 instructs the ANSWER phase to ''return
    CLARIFICATION stating how many timestamp files remain unread.'' Instructing a
    CLARIFICATION response from the ANSWER phase violates the phase-specific output
    schema and likely caused the parser failure. Additionally, rules r044 and r046
    assume unverified totals (60 files, 18 frauds) from the prior failed run, baking
    hallucinated quantities into the spec. Failing fragment: spec_goal ''collect exactly
    18 fraudulent payment file paths as grounding_refs'' and r045 ''After identifying
    a velocity cluster, return CLARIFICATION stating how many timestamp files remain
    unread.'' The new rule targets both the phase-misalignment and the hardcoded-count
    issue by referencing spec_goal and success_criteria.'
  source: learn
  status: inactive
- content: 'When investigating fraud in /proc/payments/: always begin with action
    tree:/proc/payments/ as the first action in cycle 1. If find:*.json returns an
    empty result, fall back to search:/proc/payments/ to locate payment files. Do
    not read numbered files pay_001.json through pay_080.json for fraud detection,
    as they have basket_archived=false and contain no fraud; skip them entirely. After
    tree:/proc/payments/, in the SDD phase list only unread timestamp-named file paths
    (e.g., /proc/payments/pay_20240413T160129Z_A8tb4CtG2S.json) as next actions, continuing
    through each subsequent cycle until all timestamp files are inspected. Velocity
    attack signature: same customer_id making payments at multiple geographically
    separated stores within a short time window (impossible travel), with alternating
    payment method fingerprints and device fingerprints as additional fraud signals.
    Identify all such impossible-travel clusters and submit their file paths as grounding_refs.
    If confirmed fraud hits appear in PRIOR_RESULTS, use decision=proceed and do not
    issue hard_stop while any timestamp files remain unread. Reserve progress status
    and counts of remaining unread files for the CLARIFICATION phase; do not return
    CLARIFICATION during the ANSWER phase. Use the ANSWER phase only for the final
    outcome. Do not hardcode expected record counts into success_criteria or spec_goal
    without first verifying them against actual directory tree results.'
  created: '2026-05-26'
  deactivated_reason: r049 contains the unqualified instruction 'use decision=proceed
    and do not issue hard_stop while any timestamp files remain unread', which caused
    the LLM to emit a `decision` field during the ANSWER phase, producing a semantic
    parse failure. The replacement rule preserves all correct sequencing and fraud-signature
    guidance from r049 while restricting `decision` to CLARIFICATION/SDD and clarifying
    ANSWER-phase requirements.
  id: r049
  reasoning: Rules r021, r023, r038, r042, r043, r047, and r048 all address the identical
    spec_goal of investigating fraud in /proc/payments/ and prescribe complementary
    actions across different phases. They are merged into a single rule using the
    highest id (r048) as the base, extended to cover file-location, file-filtering,
    velocity-signature detection, decision handling, and phase management. The older
    rules are deactivated to prevent redundant or fragmented guidance.
  source: learn
  status: inactive
- content: Never include a `decision` field in ANSWER phase output; restrict `decision=proceed`
    and `hard_stop` directives to the CLARIFICATION and SDD phases only. Always begin
    fraud investigations in /proc/payments/ with action tree:/proc/payments/ in cycle
    1, skip sequentially numbered non-archived payment files entirely, and list only
    unread timestamp-named payment file paths as next actions in each SDD cycle until
    all timestamp files are inspected. Identify velocity fraud by same customer_id
    at multiple geographically separated stores within a short time window with alternating
    payment method and device fingerprints, and cite every confirmed fraudulent record
    by its exact file path in `grounding_refs`. Escalate to ANSWER only after all
    timestamp-named payment files and required store location data have been collected,
    and use ANSWER solely for the final outcome without progress counts or `decision`
    fields.
  created: '2026-05-26'
  deactivated_reason: 'Consolidated: r050'
  id: r050
  reasoning: 'Verbatim error: ''ANSWER phase: failed to parse LLM output''. Root cause
    category: wrong-action. The existing rule r049 includes the instruction: ''If
    confirmed fraud hits appear in PRIOR_RESULTS, use decision=proceed and do not
    issue hard_stop while any timestamp files remain unread.'' This caused the LLM
    to emit a `decision` field while operating in the ANSWER phase, producing a CLARIFICATION/SDD-style
    payload that the ANSWER-phase parser rejected semantically. The new rule replaces
    r049 by restricting `decision` usage to non-ANSWER phases and preserving the correct
    file-reading sequence and fraud-signature logic.'
  source: learn
  status: inactive
