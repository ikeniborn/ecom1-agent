- agents_md_anchor: null
  content: Never use a compute step with prim='field' to extract a 'content' field
    from a variable bound from a Read RPC response; the Read RPC returns the content
    as a string directly. Use the variable directly as the content string.
  created: '2026-06-24'
  deactivated_reason: null
  id: r013
  reasoning: 'Error ''interpret: compute step ''field'' failed: ''field'''' indicates
    that the compute step with prim=''field'' attempted to extract a field from a
    variable that is not a map/object. The variable $policy_raw was bound from a Read
    RPC of /docs/payments/3ds.md. The Read RPC returns the content as a string directly,
    not as a structured response with a ''content'' field. Therefore, the field extraction
    fails. Existing rule [r012] incorrectly assumes a structured response and should
    be deactivated. The corrective rule instructs to use the variable directly as
    the content string without field extraction.'
  status: active
  surface: ir
