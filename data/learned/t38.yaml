- agents_md_anchor: null
  content: When the PlanIR filters a rowset by a policy-defined rule (fraud signals,
    status enums, attempt thresholds), derive every predicate value and threshold
    from the policy document / facts.policies content that a discovery step binds
    — do not bake guessed status strings or comparison thresholds into the SQL WHERE.
    A discovery step that reads the policy into a bind but then filters on invented
    signal values returns zero matching rows, leaving the rowset empty so any OK-required
    citation ref projected from it (e.g. $rows.record_path) stays unresolved at interpret
    time even though the ref is correctly emitted in answer.refs and the citation
    column was selected.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r009
  reasoning: 'Verbatim error: ''interpret: unresolved required ref(s) [$rows.record_path]
    on OK answer''. The ''found'' answer DOES emit the ref structurally ({kind:record_path,
    source:$rows.record_path}), so r006 is satisfied, and record_path is selected
    in the SELECT, so r007''s column-name check passes too. Root cause is upstream:
    the failing PlanIR discovery reads /docs/payments/3ds.md into bind ''policy_doc''
    but never uses it — the fraud WHERE predicate bakes guessed signal values (LOWER(three_ds_status)
    IN (''failed'',''failure'',''declined'',''error'',''rejected'',''abandoned''),
    three_ds_attempts >= three_ds_max_attempts). TOOL_PLAN.params explicitly says
    ''read the rule from facts.policies, do not bake values''. When the real policy
    defines fraud by different status enums / reason codes / thresholds, this invented
    predicate matches no archived rows, fraud_raw is empty, rowset ''rows'' is empty,
    and $rows.record_path projects nothing — hence the unresolved required ref. New
    rule targets predicate-VALUE grounding (derive from policy content), distinct
    from r006 (emit ref in array) and r007 (verify column NAMES exist); none are superseded.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a rowset's membership filter must apply a rule defined in a policy
    document the instruction names by path, request that document via prephase_deep_read
    and ground the SQL WHERE predicates (signal column names, status enums, attempt
    thresholds) on its surfaced contents before authoring the query — do not place
    a Read of the policy in the PlanIR discovery list and expect its bind to shape
    the filter, because the discovery Read resolves only at execution time, after
    the static SQL text is already fixed, so it cannot feed the WHERE; an unguided
    filter then falls back to invented enum/threshold values, matches zero scoped
    rows, and leaves any OK-required citation ref projected from that empty rowset
    (e.g. $rows.record_path) unresolved at interpret time even when the ref is correctly
    emitted in answer.refs and the citation column was selected. Alternatively select
    the full scoped rowset unfiltered and apply the policy-derived predicate in a
    compute/decision step.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r010
  reasoning: 'Verbatim error: ''interpret: unresolved required ref(s) [\''$rows.record_path\'']
    on OK answer''. Root cause: the PlanIR discovery reads /docs/payments/3ds.md into
    bind policy_doc_text, but the WHERE filter never consumes that bind — it is statically
    authored with guessed three_ds_status enums (''failed'',''failure'',''declined'',''error'',''rejected'',''abandoned'',''expired'',''timeout'',''not_authenticated'',''unauthenticated'')
    and a guessed three_ds_attempts >= three_ds_max_attempts threshold. Static SQL
    text is frozen at plan time, so a runtime discovery Read cannot ground it; the
    invented signals match zero archived rows, $rows is empty, and the citation ref
    source:$rows.record_path stays unresolved even though answer.refs emits it (r006
    satisfied) and the column was selected (r007 schema concern not the blocker).
    The [in-session] rule already names this empty-rowset-from-guessed-values failure
    but its advice (''derive predicate values from the bind a discovery step reads'')
    is structurally unachievable for static SQL and the cycle failed again following
    it — so this rule supplies the workable mechanism: surface the policy doc via
    prephase_deep_read so the plan author sees real signals before authoring, or move
    the policy predicate into compute/decision over an unfiltered scoped rowset. Not
    skipped: existing rules diagnose but do not give an actionable grounding path.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When an OK answer's required citation ref projects a column from a rowset
    whose membership depends on a policy-defined predicate (status enums, attempt
    thresholds, anomaly signals named only in a doc), request that policy document
    via prephase_deep_read so its predicate values are eagerly surfaced (Tier-2) before
    the PlanIR is authored, then ground the filter on those surfaced values — either
    encoded in the SQL WHERE or applied as a post-fetch compute/decision filter over
    the schema-verified membership-scoped rowset — and never bake guessed enum/threshold
    literals into static SQL, because a discovery-list Read of the policy resolves
    only at execution time after the static SQL text is fixed, so an unguided filter
    falls back to invented values, matches zero scoped rows, and leaves the projected
    ref unresolved at interpret time even when the ref is correctly emitted in answer.refs
    and the citation column was selected.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r011
  reasoning: 'Verbatim error: ''interpret: unresolved required ref(s) [\''$rows.record_path\'']
    on OK answer''. The ref is correctly emitted (answer.refs has {kind:record_path,
    source:$rows.record_path}, satisfying r006) and record_path is in the SELECT list
    (satisfying r007''s projection), so the ref stays unresolved because the rowset
    is EMPTY. Root cause: the fraud filter is baked into static SQL WHERE with guessed
    signal values — `LOWER(COALESCE(three_ds_status,'''')) IN (''failed'',''fail'',''declined'',''error'',''rejected'',''abandoned'')`
    and `three_ds_attempts >= three_ds_max_attempts` — none grounded on /docs/payments/3ds.md.
    The discovery Read binds policy_doc_text only at execution time, after the static
    SQL is fixed, so it cannot shape the WHERE; the invented enums/threshold match
    zero archived rows, $rows collapses to empty, and the projected citation ref cannot
    resolve. The two in-session rules already diagnose this shape but were never enacted
    because prephase_deep_read stayed []; the corrective lever is to actually request
    the eager policy deep-read so predicates are grounded before authoring, and to
    apply the policy predicate over the membership-scoped (is_archived_basket_reference=1)
    rowset rather than via an unguided static WHERE.'
  status: inactive
  surface: ir
