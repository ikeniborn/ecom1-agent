- agents_md_anchor: null
  content: When the outcome space includes both a deny and an allow outcome, the answer
    block must contain 'deny' and 'allow' branches, each with a 'message' field.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: PlanIR validation failed with 'answer.deny.message Field required' and
    'answer.allow.message Field required'. The PlanIR likely had an answer block with
    deny/allow branches but omitted the 'message' field inside each. The schema requires
    both branches to have a 'message' field, even if the allow outcome's success criteria
    do not reference $answer.msg. Existing rules r001-r003 address top-level 'msg'
    fields, not branch-level 'message' fields, so they do not cover this failure.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required ref in the answer block references a field from an RPC
    output (e.g., $payment.record_path), the PlanIR must include a compute step that
    extracts that field from the bound output and binds it to a variable matching
    the source path, so the ref can be resolved.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r005
  reasoning: 'Error: ''interpret: unresolved required ref(s) [''$payment.record_path'']
    on OK answer''. The PlanIR script fetches payment data via Exec and binds to ''payments_raw'',
    but never extracts the ''record_path'' field into a variable named ''$payment.record_path''.
    The answer block''s allow branch references ''$payment.record_path'' as a required
    ref, but no such variable exists. Root cause: missing compute step to extract
    the field from the RPC output. Failing PlanIR fragment: the answer block''s refs
    list and the absence of a corresponding compute extraction.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a required ref in the answer block references a variable (e.g., $payment.record_path),
    the PlanIR must include a discovery step to retrieve the data and a compute step
    to bind that variable to the actual path of the retrieved records, so the ref
    can be resolved.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Error: interpret: unresolved required ref(s) [''$payment.record_path'']
    on OK answer. Root cause: The PlanIR''s allow answer branch requires a ref with
    source ''$payment.record_path'', but the PlanIR contains no RPC step to retrieve
    payment records and no compute step to bind that variable. The failing fragment
    is the ''allow'' answer block: {"message":"Payment records retrieved.","outcome":"OUTCOME_OK","refs":[{"kind":"record_path","path":null,"source":"$payment.record_path"}]}.
    The variable $payment.record_path is never bound, so the ref cannot be resolved.
    This rule ensures that any variable-sourced ref is backed by a discovery step
    and a compute binding.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use an RPC bind name directly as the source of a required ref in
    the answer block without a compute step that extracts the actual path string from
    the RPC output and binds it to a variable with the same name.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: The error 'unresolved required ref(s) ["$payment.record_path"] on OK
    answer' occurred because the PlanIR bound the SQL RPC output to 'payment.record_path'
    and used that as the source for the required ref, but the interpreter expects
    the ref source to resolve to a literal path string. The RPC output is a table,
    not a path. The PlanIR lacked a compute step to extract the 'record_path' column
    from the bound output and bind it to a variable named 'payment.record_path'. The
    existing in-session rule described this requirement but was not applied; a stronger
    Never rule is needed to prevent direct binding without extraction.
  status: inactive
  surface: ir
