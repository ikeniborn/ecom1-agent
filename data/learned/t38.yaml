  content: Always emit every tool_plan Exec RPC as vm.exec(path=..., args=...) verbatim
    — including /bin/sh, /bin/tree, and /bin/sql wrappers — and never substitute a
    higher-level VM helper such as vm.tree(); the fidelity grader counts RPC kinds
    by VM method name, so swapping a planned Exec for a Tree (or any helper) drops
    one Exec and adds a foreign kind, producing multiset drift.
