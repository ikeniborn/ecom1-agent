entries:
- content: Never rely on a single content keyword search across /proc/payments/ as
    the only discovery step for the fraudulent payment record specified in the spec_goal;
    always list the directory and inspect individual files to locate and confirm the
    target record.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r001'
  id: r001
  reasoning: 'Verbatim error: ''Empty result''. Root cause: wrong-filter. The failing
    fragment is the plan step ''Search /proc/payments/ for files containing fraud-related
    keywords to quickly locate the fraudulent record'' and the executed action ''search:fraud
    /proc/payments/''. The literal keyword ''fraud'' produced no matches in the archived
    payment files despite the task asserting one fraudulent hit exists. The rule therefore
    targets the spec_goal and action to ensure directory-level enumeration and file
    inspection are used rather than halting on a single empty keyword search.'
  source: learn
  status: inactive
- content: Never produce a plan whose sole action is `list:/proc/payments/` when the
    spec_goal requires identifying fraudulent payment records by inspecting file contents;
    always include explicit follow-on read actions for each enumerated payment record
    file after the directory listing.
  created: '2026-05-25'
  deactivated_reason: r002 and r003 targeted the abstract 'plan' rather than the concrete
    `actions` array, permitting a multi-step plan while the executable `actions` remained
    a single `list:/proc/payments/` entry. The new rule supersedes them by precisely
    governing the `actions` sequence.
  id: r002
  reasoning: 'The ANSWER states: ''Need the result of `search:fraud /proc/payments/`
    or direct reads of individual payment files under `/proc/payments/` to locate
    the confirmed fraud hit and cite the specific record path.'' Root cause: wrong-action.
    The SDD and PLAN produced only `list:/proc/payments/` as the action, omitting
    the follow-on file reads required by the spec_goal to ''individually inspecting
    each file''s contents for fraud indicators.'' Consequently the ANSWER phase lacked
    file contents and requested clarification instead of citing the fraudulent record
    paths. The new rule prevents stopping at a bare directory listing by requiring
    explicit read actions for the enumerated files.'
  source: learn
  status: inactive
- content: Never rely on a single content keyword search across /proc/payments/ as
    the only discovery step for the fraudulent payment record specified in the spec_goal,
    and never produce a plan whose sole action is `list:/proc/payments/` when the
    spec_goal requires identifying fraudulent payment records by inspecting file contents;
    always list the directory and include explicit follow-on read actions for each
    enumerated payment record file after the directory listing to locate and confirm
    the target record.
  created: '2026-05-25'
  deactivated_reason: r002 and r003 targeted the abstract 'plan' rather than the concrete
    `actions` array, permitting a multi-step plan while the executable `actions` remained
    a single `list:/proc/payments/` entry. The new rule supersedes them by precisely
    governing the `actions` sequence.
  id: r003
  reasoning: r001 and r002 address the same spec_goal of locating fraudulent payment
    records in /proc/payments/; r001 prohibits keyword-search-only discovery while
    r002 prohibits list-only plans. They overlap in requiring directory listing followed
    by per-file inspection, so they are merged into a single comprehensive rule using
    r002 (highest id) as the base.
  source: learn
  status: inactive
- content: Never emit an `actions` sequence whose only element is `list:/proc/payments/`
    when the spec_goal requires identifying fraudulent payment records by inspecting
    file contents; always include explicit follow-on read actions for each enumerated
    payment record file after the directory listing.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r004'
  id: r004
  reasoning: '1. Verbatim error: ''ANSWER clarification: Need to read `/proc/payments/README.md`
    and inspect the archived payment record files under `/proc/payments/` for fraud
    indicators to identify the specific records involved in the confirmed incident.
    The directory listing alone does not contain fraud classification data.'' 2. Root
    cause: wrong-action — the SDD_OUTPUT `actions` array contained only `[''list:/proc/payments/'']`
    despite the `plan` correctly describing file reads, so no payment files were actually
    inspected. 3. Failing fragment: `actions: [''list:/proc/payments/'']` in SDD_OUTPUT
    and the sole action in PLAN_OUTPUT `action: ''list:/proc/payments/''`. 4. Rule
    linkage: existing rules r002 and r003 targeted the ''plan'' abstraction rather
    than the concrete `actions` array, allowing a compliant multi-step `plan` to coexist
    with a non-compliant single-entry `actions` array; the new rule closes this loophole
    by explicitly governing the `actions` sequence.'
  source: learn
  status: inactive
- content: Never emit an `actions` sequence that reads only a subset of discovered
    payment record files under `/proc/payments/` when the `spec_goal` requires inspecting
    every archived payment record for fraud indicators; always include explicit read
    actions for each remaining uninspected payment record file, or use a `search:`
    action scoped to `/proc/payments/` to retrieve all candidate records without per-file
    enumeration.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r005'
  id: r005
  reasoning: '1. Verbatim error: ''Need to read the remaining payment files under
    `/proc/payments/` such as `/proc/payments/pay_003.json` and the archived timestamped
    files to locate the confirmed fraud records.'' 2. Root cause: wrong-action. 3.
    Failing fragment: The SDD_OUTPUT `actions` sequence `["/proc/payments/README.md",
    "/proc/payments/pay_001.json", "/proc/payments/pay_002.json"]` included only two
    payment record files, leaving 80+ other files uninspected, while the `spec_goal`
    requires identifying ''every archived payment record under /proc/payments/ that
    exhibits the fraud indicators'' and `success_criteria[1]` mandates that ''Every
    payment record file under /proc/payments/ is inspected for fraud markers via direct
    read or targeted content search''. 4. Rule linkage: The new rule directly addresses
    this partial-coverage action set by requiring that, when the spec_goal demands
    inspecting every payment record, the actions must either read every remaining
    uninspected file or use a scoped search action to cover the directory.'
  source: learn
  status: inactive
- content: Never emit an `actions` sequence whose only element is `list:/proc/payments/`
    or that reads only a subset of discovered payment record files under `/proc/payments/`
    when the `spec_goal` requires inspecting archived payment records for fraud indicators;
    always include explicit read actions for each remaining uninspected payment record
    file, or use a `search:` action scoped to `/proc/payments/` to retrieve all candidate
    records without per-file enumeration.
  created: '2026-05-25'
  deactivated_reason: r006 and r007 incorrectly permit a `search:` action scoped to
    `/proc/payments/` as an alternative to explicit reads when inspecting archived
    payment records; the current failure demonstrates that this search does not reliably
    retrieve all timestamped archived files, so those rules must be replaced by one
    requiring `tree:` discovery followed by explicit reads.
  id: r006
  reasoning: r004 and r005 address the same spec_goal of inspecting /proc/payments/
    for fraud. r004’s prohibition against a list-only action is a specific instance
    of the broader subset-read coverage in r005. The merged rule retains r005 as the
    base and extends it to explicitly include r004’s list-only case, ensuring all
    records are inspected either by reading every file or by using a scoped search.
  source: learn
  status: inactive
- content: Never emit an `actions` sequence whose only element is `list:/proc/payments/`
    or that reads only a subset of discovered payment record files under `/proc/payments/`
    when the `spec_goal` requires inspecting every archived payment record for fraud
    indicators; always include explicit read actions for each remaining uninspected
    payment record file, or use a `search:` action scoped to `/proc/payments/` to
    retrieve all candidate records without per-file enumeration.
  created: '2026-05-25'
  deactivated_reason: r006 and r007 incorrectly permit a `search:` action scoped to
    `/proc/payments/` as an alternative to explicit reads when inspecting archived
    payment records; the current failure demonstrates that this search does not reliably
    retrieve all timestamped archived files, so those rules must be replaced by one
    requiring `tree:` discovery followed by explicit reads.
  id: r007
  reasoning: r005 and r006 address the same spec_goal of inspecting archived payment
    records for fraud indicators. r006 (highest id) expands the prohibition to include
    list-only actions but drops the word 'every'. Merged rule takes r006 as base and
    restores 'every archived payment record' from r005 to cover the full scope of
    both rules.
  source: learn
  status: inactive
- content: Never use a content-keyword `search:` action as the sole retrieval mechanism
    for `/proc/payments/` when the `spec_goal` requires inspecting every archived
    timestamped payment record; always use `tree:/proc/payments/` to discover all
    filenames first, then include explicit read actions for each remaining uninspected
    payment record file.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r008'
  id: r008
  reasoning: 'Verbatim error: ''Need to read the remaining current payment files `/proc/payments/pay_021.json`
    through `/proc/payments/pay_080.json` and the archived timestamped payment records
    (e.g., `/proc/payments/pay_20250627T075617Z_DofnCeeMMg.json`) to complete the
    fraud review and classify every f''. Root cause category: wrong-action. The SDD_OUTPUT
    actions sequence was [`search:pay_ /proc/payments/`], and the spec_goal required
    ''Inspect every remaining archived and current payment record under /proc/payments/''.
    Using a single content-keyword `search:` action as the sole retrieval mechanism
    did not discover the archived timestamped records or the remaining current files,
    so the agent could only report on the 20 previously inspected files. The rule
    must replace this insufficient search-only approach with a discovery step that
    guarantees every file is found.'
  source: learn
  status: inactive
- content: Never include a `search:` action on a path outside `/proc/payments/` in
    the `actions` array when the `spec_goal` requires inspecting every archived timestamped
    payment record under `/proc/payments/`; always use `tree:/proc/payments/` to discover
    all filenames first, then include explicit read actions for each remaining uninspected
    payment record file.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r009, r010'
  id: r009
  reasoning: 'Verbatim error: ''ANSWER phase: failed to parse LLM output''. Root cause
    category: wrong-action. The failing fragment is the SDD_OUTPUT `actions` array:
    ["search:store /proc/stores/", "/proc/payments/pay_023.json"]. This injected an
    irrelevant content-keyword search on an unrelated path and omitted the required
    `tree:/proc/payments/` discovery step and explicit reads for the remaining payment
    files, starving the ANSWER phase of proper payment context. Existing rule r008
    only blocks using `search:` as the sole retrieval mechanism for `/proc/payments/`;
    it does not block extraneous searches on other paths, which is the loophole exploited
    here. The new rule directly targets the `actions` array and the `spec_goal` by
    prohibiting off-target searches and mandating tree-based discovery inside `/proc/payments/`.'
  source: learn
  status: inactive
- content: When the `spec_goal` requires inspecting every archived timestamped payment
    record under `/proc/payments/`, never use a content-keyword `search:` action as
    the sole retrieval mechanism for `/proc/payments/`, and never include a `search:`
    action on a path outside `/proc/payments/` in the `actions` array; always use
    `tree:/proc/payments/` to discover all filenames first, then include explicit
    read actions for each remaining uninspected payment record file.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r009, r010'
  id: r010
  reasoning: 'r008 and r009 share the same spec_goal (inspecting every archived timestamped
    payment record under `/proc/payments/`). r008 prohibits search: as the sole mechanism
    on `/proc/payments/` while r009 prohibits search: outside `/proc/payments/` in
    the actions array. These are different action prescriptions; merged under highest-id
    r009 to encompass both constraints.'
  source: learn
  status: inactive
- content: Always include explicit read actions in the `actions` array for every remaining
    uninspected payment record file under `/proc/payments/` when the `spec_goal` requires
    inspecting every archived timestamped payment record and the success criterion
    demands that every payment record file under `/proc/payments/` is explicitly read
    and inspected; never truncate the `actions` array to only a subset of the discovered
    files.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r011'
  id: r011
  reasoning: '1. Verbatim error: ''ANSWER clarification: Need to read the remaining
    uninspected payment files under `/proc/payments/`, including `/proc/payments/pay_027.json`
    through `/proc/payments/pay_077.json` and any additional files beyond `pay_077.json`,
    before all payment records in the fraud incident can be cited.'' 2. Root cause:
    wrong-action. The SDD_OUTPUT `actions` array contained only `/proc/payments/pay_024.json`,
    `/proc/payments/pay_025.json`, and `/proc/payments/pay_026.json`, omitting the
    majority of remaining uninspected payment record files that the `spec_goal` and
    success criteria required to be explicitly read. 3. Failing fragment: The SDD_OUTPUT
    `actions` array listed only three files when the success criterion ''Every payment
    record file under /proc/payments/ is explicitly read and inspected'' demanded
    explicit reads for all remaining files discovered by `tree:/proc/payments/`. 4.
    Rule linkage: The new rule mandates that the `actions` array must contain explicit
    read actions for every remaining uninspected payment record file, directly addressing
    the truncation gap in the SDD actions.'
  source: learn
  status: inactive
- content: When the `spec_goal` requires inspecting every archived timestamped payment
    record under `/proc/payments/`, never use a content-keyword `search:` action as
    the sole retrieval mechanism for `/proc/payments/`, and never include a `search:`
    action on a path outside `/proc/payments/` in the `actions` array; always use
    `tree:/proc/payments/` to discover all filenames first, then include explicit
    read actions in the `actions` array for every remaining uninspected payment record
    file, ensuring that every payment record file under `/proc/payments/` is explicitly
    read and inspected; never truncate the `actions` array to only a subset of the
    discovered files.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r012'
  id: r012
  reasoning: r009 and r010 overlap on the same spec_goal, with r010 being a strict
    superset of r009 (adding the prohibition against content-keyword search as the
    sole retrieval mechanism). r011 addresses the identical spec_goal with complementary
    constraints about full coverage and no truncation of read actions. Taking the
    highest-id rule (r011) as the base and extending it with the retrieval restrictions
    from r009/r010 produces a single comprehensive rule.
  source: learn
  status: inactive
- content: Never anchor the `spec_goal` or `success_criteria` to `/proc/payments/README.md`
    as the source of incident-classification criteria without first verifying its
    contents; when the task involves a confirmed fraud or critical incident, always
    search the `docs/` policy directory for incident definitions and matching rules
    before finalizing the spec.
  created: '2026-05-25'
  deactivated_reason: r013 is superseded by this more general rule; it only prohibited
    anchoring to `/proc/payments/README.md`, but the same failure mode can occur with
    any policy document path whose contents have not been verified to contain the
    required incident criteria.
  id: r013
  reasoning: 'The verbatim ANSWER clarification states: ''Need to read `/docs/merchant-continuity-and-critical-incidents.md`
    to obtain the confirmed fraud incident criteria and matching rules. Also need
    to read all remaining `/proc/payments/pay_*.json` files that were not yet inspected
    (e.g., `pay_001.json` through `pay_077.json` and any others shown in the directory
    listing), because the README does not define fraud indicators and those files
    have not been examined.'' Root cause category: wrong-spec. The failing SDD_OUTPUT
    `spec_goal` fragment reads: ''Identify every payment record file under /proc/payments/
    that matches the fraud incident criteria documented in the README,'' and the `success_criteria`
    includes: ''/proc/payments/README.md has been read and its fraud criteria understood.''
    By anchoring the criteria source to the README before verifying its contents,
    the spec became unfulfillable and halted progress. Existing rules r011 and r012
    address explicit file reads under `/proc/payments/` but do not prevent incorrectly
    anchoring the `spec_goal` or `success_criteria` to a local README for incident
    criteria.'
  source: learn
  status: inactive
- content: When the `spec_goal` requires inspecting every archived timestamped payment
    record under `/proc/payments/` and/or the success criterion demands that every
    payment record file under `/proc/payments/` is explicitly read and inspected,
    never use a content-keyword `search:` action as the sole retrieval mechanism for
    `/proc/payments/`, and never include a `search:` action on a path outside `/proc/payments/`
    in the `actions` array; always use `tree:/proc/payments/` to discover all filenames
    first, then include explicit read actions in the `actions` array for every remaining
    uninspected payment record file, ensuring that every payment record file under
    `/proc/payments/` is explicitly read and inspected; never truncate the `actions`
    array to only a subset of the discovered files.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r014'
  id: r014
  reasoning: 'r011 and r012 address the same spec_goal (inspecting every archived
    timestamped payment record under `/proc/payments/`). r011 is a strict subset of
    r012: it only mandates explicit reads and no truncation. r012 (highest id) subsumes
    those requirements and adds discovery-protocol constraints (use `tree:`, prohibit
    `search:` as sole mechanism). The merged rule takes r012 as the base and extends
    its trigger condition to explicitly include r011’s success-criterion clause, fully
    replacing r011 without contradicting it.'
  source: learn
  status: inactive
- content: Never anchor the `spec_goal` or `success_criteria` to a policy document
    path as the source of fraud or incident-classification criteria without first
    reading the document to verify it contains matching rules for the incident type;
    when the task involves a confirmed fraud or critical incident, always search the
    `docs/` policy directory for relevant incident definitions and matching rules
    and confirm the selected document actually contains the required criteria before
    including it in the spec.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r015'
  id: r015
  reasoning: 'The verbatim error states: "The specified policy document `/docs/merchant-continuity-and-critical-incidents.md`
    contains no fraud criteria or matching rules—it explicitly disclaims being a policy
    for risk review." Root cause category: wrong-spec. The failing fragment is the
    `spec_goal` phrase "that satisfy the confirmed fraud incident criteria documented
    in /docs/merchant-continuity-and-critical-incidents.md" and `success_criteria`
    entry 0 which predicates success on "The policy document /docs/merchant-continuity-and-critical-incidents.md
    is read and its confirmed fraud incident criteria and matching rules are extracted
    and applied to every payment record." Rule linkage: The new rule prohibits anchoring
    the `spec_goal` or `success_criteria` to an unverified policy document path and
    mandates broad searching of the `docs/` policy directory and verification of contents
    before finalizing the spec.'
  source: learn
  status: inactive
- content: When the `spec_goal` requires inspecting every archived timestamped payment
    record under `/proc/payments/` and/or the success criterion demands that every
    payment record file under `/proc/payments/` is explicitly read and inspected,
    never use a content-keyword `search:` action as the sole retrieval mechanism for
    `/proc/payments/`, and never include a `search:` action on a path outside `/proc/payments/`
    in the `actions` array; always use `tree:/proc/payments/` to discover all filenames
    first, then include explicit read actions in the `actions` array for every remaining
    uninspected payment record file, ensuring that every payment record file under
    `/proc/payments/` is explicitly read and inspected; never truncate the `actions`
    array to only a subset of the discovered files.
  created: '2026-05-25'
  deactivated_reason: Superseded by r020. Rule prescribed enumerating all remaining
    files in actions array, causing SDD to generate 75+ actions and LLM timeout. Pipeline
    tree-batch handles multi-file reads automatically from cached tree output; SDD
    only needs to provide first unread file as primary action.
  id: r016
  reasoning: r012 is a strict subset of r014. Both prescribe identical actions for
    the overlapping scenario (spec_goal requiring inspection of every archived timestamped
    payment record), but r014 adds the additional trigger of a success criterion demanding
    that every payment record file be explicitly read and inspected. Keeping r014
    alone covers the full scope of both rules.
  source: learn
  status: inactive
- content: Never include a direct read action for a presumed single policy file path
    in the `actions` array when the `spec_goal` requires locating fraud or incident-classification
    criteria in `/docs/`; always include a filesystem discovery action for `/docs/`
    such as `tree:/docs/` or `find:*fraud* /docs/` in the `actions` array before reading
    any specific document, then verify the selected document contains the required
    matching rules.
  created: '2026-05-25'
  deactivated_reason: Counterproductive when tree:/docs/ already in PRIOR_ACTIONS.
    Forcing tree:/docs/ every cycle wastes an action slot and displaces payment file
    reads. answer.md now handles the fraud-criteria-from-docs issue directly.
  id: r017
  reasoning: 'Verbatim error: ''ANSWER clarification: Need to read the remaining payment
    record files under `/proc/payments/` (including `pay_003.json` through `pay_077.json`
    and any files beyond the truncated tree listing) and locate a policy document
    in `/docs/` containing explicit fraud classification criteria and matching rules
    before any classification can be performed.'' Root cause: wrong-action. Failing
    fragment: `actions: ["/docs/security.md", "tree:/proc/payments/"]`. Rule linkage:
    the new rule prohibits guessing a single policy file path in the `actions` array
    and instead mandates a filesystem discovery action for `/docs/` before any specific
    document is read.'
  source: learn
  status: inactive
- content: When the `spec_goal` requires inspecting every archived timestamped payment
    record under `/proc/payments/` and/or the success criterion demands that every
    payment record file under `/proc/payments/` is explicitly read and inspected,
    never use a content-keyword `search:` action as the sole retrieval mechanism for
    `/proc/payments/`, and never include a `search:` action on a path outside `/proc/payments/`
    in the `actions` array; always use `tree:/proc/payments/` to discover all filenames
    first, then include explicit read actions in the `actions` array for every remaining
    uninspected payment record file, ensuring that every payment record file under
    `/proc/payments/` is explicitly read and inspected; never truncate the `actions`
    array to only a subset of the discovered files.
  created: '2026-05-25'
  deactivated_reason: Superseded by r020. Same truncation-prohibition error as r016.
  id: r018
  reasoning: r014 and r016 are string-identical duplicates; kept r016 as base and
    deactivated r014.
  source: learn
  status: inactive
- content: When the `spec_goal` requires locating fraud or incident-classification
    criteria in `/docs/` or when the task involves a confirmed fraud or critical incident,
    never anchor the `spec_goal` or `success_criteria` to a policy document path as
    the source of such criteria without first reading the document to verify it contains
    matching rules for the incident type, and never include a direct read action for
    a presumed single policy file path in the `actions` array; always include a filesystem
    discovery action for `/docs/` such as `tree:/docs/` or `find:*fraud* /docs/` in
    the `actions` array before reading any specific document, then verify the selected
    document actually contains the required matching rules before including it in
    the spec.
  created: '2026-05-25'
  deactivated_reason: Counterproductive when tree:/docs/ already in PRIOR_ACTIONS.
    Deactivated for same reasons as r017.
  id: r019
  reasoning: r015 and r017 share the same spec_goal of locating fraud or incident-classification
    criteria in `/docs/` but prescribe different actions; r017 (higher id) is the
    base, extended to cover r015's constraint against anchoring spec_goal/success_criteria
    to an unverified policy path.
  source: learn
  status: inactive
- content: When `tree:/proc/payments/` has been executed and appears in PRIOR_ACTIONS,
    do NOT enumerate all remaining unread payment file paths in the `actions` array;
    output only 1–3 unread payment file paths as actions. The pipeline automatically
    batches additional unread files from the cached tree listing up to batch_cap per
    cycle. Enumerating all 50–100 file paths in a single actions array causes LLM
    timeout and conflicts with the 1–3 action limit in sdd.md.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r020'
  id: r020
  reasoning: Rules r016 and r018 required enumerating ALL remaining unread files in
    the actions array (never truncate). With 75+ unread files, SDD generated a 75-path
    actions array causing the LLM to take 20+ minutes and timeout repeatedly. The
    pipeline tree-batch mechanism in pipeline.py reads files from prior_results tree
    cache automatically when primary action is from the same directory. SDD only needs
    to provide the first unread file as primary; pipeline fills rest up to batch_cap.
  source: manual
  status: inactive
- content: 'For fraud review tasks — where the task text contains any of: ''confirmed
    fraud hit'', ''confirmed a known fraud hit'', ''confirmed fraud incident'', ''fraud
    hit in archived payment history'', ''fraud review says'', ''one hit is present
    in the archived payments'', ''cite every payment record you are marking'', or
    any phrase asking to identify fraudulent payment records from history: set `decision
    = ''proceed''`. Do NOT hard_stop for a missing fraud case ID, Risk Ops ticket
    number, or other external reference. The fraud incident is discoverable by inspecting
    all archived payment files in /proc/payments/ for behavioral patterns (e.g., payment_method_fingerprint
    reuse across multiple customer accounts, timing clustering, shared device identifiers).
    Requesting clarification on ''which hit'' is incorrect — the agent''s job is to
    find it from the data.'
  created: '2026-05-25'
  deactivated_reason: null
  id: r021
  reasoning: In run 3, IDD hard_stopped with OUTCOME_NONE_CLARIFICATION claiming 'that
    hit' is ambiguous without a case ID. This is wrong — the task expects the agent
    to identify fraud by behavioral pattern analysis of payment files. There is no
    external case ID to provide; the hit is in the data itself. Extended patterns
    in run 10 to cover new task text variant "Fraud review says one hit is present
    in the archived payments. Identify the fraudulent payment records from history.
    Leave files unchanged and cite every payment record you are marking."
  source: manual
  status: active
- content: For fraud review tasks ('cite every payment record you mark as fraud',
    'confirmed fraud hit'), ANSWER must return OUTCOME_NONE_CLARIFICATION if the tree
    listing in EXECUTE_OUTPUT shows more files in /proc/payments/ than the file reads
    in FILES_READ_IN_PRIOR_CYCLES + current cycle reads. Do NOT return OUTCOME_OK
    based on a subset of payment files — 'cite every' means all files must be inspected
    before a final classification can be made. Include in the clarification message
    the EXACT path of the next unread payment file enclosed in backticks (e.g. `\/proc\/payments\/pay_003.json`)
    so SDD can use it as primary action in the next cycle.
  created: '2026-05-25'
  deactivated_reason: 'Consolidated: r022'
  id: r022
  reasoning: In run 4, cycle 1 read only 24 of ~100 payment files (sorted oldest-first
    by timestamp) and found 5 fraud records. ANSWER immediately returned OUTCOME_OK
    with score 0.59. This is wrong because 76 files remained unread and could contain
