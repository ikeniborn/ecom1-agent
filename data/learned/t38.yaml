- agents_md_anchor: '#instruction > action-scope'
  content: Always emit each required_ref of the chosen OK outcome as an explicit structured
    entry in that outcome's answer.refs array, projecting its rowset-column source
    (e.g. {kind, source:$rowset.record_path}) — interpolating those values into the
    message string alone, or leaving answer.refs as [], leaves the required ref unresolved
    at interpret time even when the rowset is nonempty and the value already appears
    in the message text, because interpret-time resolution validates the refs array,
    not message placeholders.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: 'Verbatim error: "interpret: unresolved required ref(s) [''$fraud_payments.record_path'']
    on OK answer". required_refs.OUTCOME_OK declares one ref {kind:record_path, source:$fraud_payments.record_path},
    but the failing PlanIR''s answer block is "ok":{...,"refs":[]} — refs is empty.
    The plan computed the column via {"prim":"column","args":["$fraud_payments","record_path"],"into":"payment_record_paths"}
    and only interpolated it as {payment_record_paths} inside the message skeleton;
    it never emitted the structured $fraud_payments.record_path ref into answer.ok.refs.
    Interpret-time ref resolution checks the refs array, not message-string placeholders,
    so the required ref stays unresolved regardless of whether fraud_payments has
    rows. Root cause is the answer.refs projection, not rowset grounding. This is
    distinct from r003/r004/r005, which all guarantee a nonempty rowset (schema-verified
    columns, policy-derived criteria, nonempty OK gate) but say nothing about wiring
    the required ref into the answer block; the new rule closes that gap.'
  status: inactive
  surface: ir
