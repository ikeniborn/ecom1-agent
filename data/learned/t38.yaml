  status: inactive
- content: Always use tree:/proc/payments/ or find /proc/payments -type f to enumerate
    archived payment files when list:/proc/payments/ has been previously attempted
    or is unavailable; then read each discovered file to verify fraud indicators,
    as required by the spec_goal 'Identify and cite all fraudulent payment records
    from the archived payments files in /proc/payments/ without altering any files.'
  created: '2026-05-21'
