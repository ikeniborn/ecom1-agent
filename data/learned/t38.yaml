- agents_md_anchor: null
  content: When the PlanIR runs SQL through the /bin/sql Exec RPC, deliver the query
    over the RPC's real stdin-pipe channel so the tool reads it on standard input
    — do not drop the query into an inline `stdin` arg key the runner does not forward
    to the process, because an unfed sql binary prints its usage banner instead of
    executing, returns no rowset, leaves the bound rows_raw empty, and any OK-required
    citation ref projected from it (e.g. $rows.record_path) stays unresolved at interpret
    time even though the ref is correctly emitted in answer.refs and the citation
    column was selected.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r012
  reasoning: 'Verbatim error: ''interpret: sql returned usage banner — SQL not delivered
    via stdin''. Root cause is mechanical, not grounding: the discovery step Exec
    on /bin/sql placed the query in a sibling `stdin` arg key — {"rpc":"Exec","args":{"path":"/bin/sql","args":["-csv","-header"],"stdin":"WITH
    archived AS (...) ..."},"bind":"rows_raw"} — but the runner never piped that string
    to the process standard input, so /bin/sql received no query and emitted its usage
    banner. With no rows returned, rows_raw is empty, the rowsets->rows projection
    yields zero rows, and the OK-required citation ref $rows.record_path (required_refs.OUTCOME_OK
    record_path) is unresolved despite being correctly emitted. This is orthogonal
    to r009/r010/r011 (policy-derived predicate grounding of WHERE values) — those
    concern WHICH rows match; this concerns the SQL never executing at all. New rule
    covers the Exec stdin-delivery contract.'
  status: inactive
  surface: ir
