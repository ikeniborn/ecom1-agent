- agents_md_anchor: null
  content: Always extract the string content from a ReadResponse (or any protocol
    message) before using it as the lhs of a string operator (contains_any, contains,
    etc.) in a decision condition; use a compute step with prim='field' to get the
    'content' field.
  created: '2026-06-24'
  deactivated_reason: r012 incorrectly assumes Read RPC returns a structured response
    with a 'content' field; the response is a string, so field extraction fails.
  id: r012
  reasoning: 'Error: ''real_vm: Protocol message ReadResponse has no "failed" field.''
    Root cause: The decision condition uses contains_any on $fraud_criteria_doc, which
    is a ReadResponse object. The VM interprets contains_any on a message as checking
    for field existence, and ''failed'' is not a field of ReadResponse, causing the
    failure. Failing PlanIR fragment: the decision branch condition with lhs=$fraud_criteria_doc.
    No existing rule covers this technical requirement; a new rule is needed to ensure
    string extraction before using a message in a string operator.'
  status: inactive
  surface: ir
