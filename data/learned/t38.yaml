- content: "CRITICAL - FILE TYPE RULE: /proc/payments/ contains TWO types of files.\n\
    \  1. NUMBERED files: pay_001.json through pay_080.json — CURRENT payments, basket_archived=false,\
    \ ALL PRE-VERIFIED CLEAN. DO NOT READ THEM. DO NOT CITE THEM AS FRAUD. EVER.\n\
    \  2. TIMESTAMP files: pay_YYYYMMDDTHHMMSSZ*.json (e.g. pay_20240413T160328Z_XVMF3TBPxL.json)\
    \ — ARCHIVED historical payments, THESE are the fraud candidates.\n\n  SDD phase\
    \ MUST list ONLY timestamp-format files as read actions. If SDD includes any pay_NNN.json\
    \ in actions, it is WRONG.\n\n  IMPORTANT: Even if cust_093 (or any customer)\
    \ appears in numbered pay_NNN files with suspicious GPS pattern, those numbered\
    \ file records are NOT the fraud. The fraud is ONLY in timestamp files. Only cite\
    \ /proc/payments/pay_YYYYMMDDTHHMMSSZ*.json paths as grounding_refs.\n\n  Cycle\
    \ 1: tree:/proc/payments/ to list all files. Then read ONLY timestamp files in\
    \ batches of 15-20 per cycle. Never read pay_001 through pay_080."
  created: '2026-05-26'
  deactivated_reason: null
  id: r070
  reasoning: 'Confirmed: numbered files = no fraud. Timestamp files = fraud candidates.
    Opus ignored previous rule and cited numbered files as fraud (pay_015, pay_016,
    etc.) — must explicitly forbid citing numbered files.'
  source: manual
  status: active
- content: "VELOCITY ATTACK DEFINITION (critical - read carefully):\n  - ONE specific\
    \ customer_id making payments at 5+ DISTINCT store_ids within a SHORT window (5-15\
    \ minutes). NOT different customers on the same day.\n  - Time gap between first\
    \ and last payment in the cluster MUST be under 30 minutes. If the same customer\
    \ appears at stores over hours or days, that is NOT a velocity attack.\n  - Physical\
    \ impossibility: a single person cannot be in Bratislava AND Graz AND Innsbruck\
    \ within 4-15 minutes.\n\n  AGGREGATION REQUIRED before submitting:\n  - After\
    \ reading each batch, build a mental table: customer_id → list of (store_id, timestamp)\n\
    \  - Find which customer_id appears at 5+ DISTINCT store_ids all within 30 minutes\n\
    \  - Only THAT customer's payments are fraud.\n\n  DO NOT submit OUTCOME_OK if:\n\
    \  - The 'cluster' contains payments from different customer_ids\n  - The cluster\
    \ spans more than 30 minutes between first and last payment\n  - Fewer than 5\
    \ distinct store_ids for the same customer\n\n  When a GENUINE velocity cluster\
    \ is found, submit OUTCOME_OK with ALL timestamp file paths that belong to that\
    \ customer's attack. There may be 10-21 fraud payments total. Read more timestamp\
    \ files if cycle budget remains — do NOT stop at first 9 files. Submit OUTCOME_OK\
    \ with best found cluster when cycles nearly exhausted."
  created: '2026-05-26'
  deactivated_reason: null
  id: r071
  reasoning: Opus submitted 9 payments from 9 DIFFERENT customers as fraud (wrong).
    Velocity attack = one customer, 5+ stores, within minutes. Must aggregate by customer_id.
  source: manual
  status: active
