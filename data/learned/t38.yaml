- agents_md_anchor: null
  content: When the success criteria require $answer.msg, the answer block must include
    a top-level 'msg' field, not nested under a branch label.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: The verify step failed because success_criteria[OUTCOME_DENIED_SECURITY]
    checked for nonempty $answer.msg, but the PlanIR placed the message inside a branch-specific
    'deny' object (deny.message). The answer block must directly set 'msg' to satisfy
    the criteria.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When success_criteria references $answer.msg, the answer block must contain
    a top-level 'msg' field, not nested under a branch label.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: The PlanIR placed the message inside a branch label 'denied' (answer.denied.message),
    but the interpreter maps $answer.msg to the top-level 'msg' field. The verify
    step failed because $answer.msg was empty. The security doc was read successfully,
    so the failure is purely a PlanIR shape bug.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When success_criteria reference $answer.msg, the answer block must be a
    dictionary containing a 'msg' key, not a plain string.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: 'PlanIR validation error: ''answer.msg Input should be a valid dictionary
    or instance of AnswerTemplateIR [type=model_type, input_value=''Access denied:
    guest acc...access payment records.'', input_type=str]''. Root cause: the answer
    block was emitted as a plain string instead of a dict with a ''msg'' field. Existing
    rules cover nesting but not the type mismatch.'
  status: inactive
  surface: ir
