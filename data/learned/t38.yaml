    are the fraud; do NOT flag that customer''s at-home payments even when they sit
    on the impossible-travel device (they are false positives), and DO flag the customer''s
    far-from-home payments made on OTHER devices (do not restrict to the single device).
    Emit those record_path values as refs (read-only). Cite /docs/security.md as the
    governing policy grounding ref. Never hardcode device/customer ids or paths —
    they re-seed every run; always compute.'
