- content: 'Fraud payments are timestamp-named files in /proc/payments/ matching velocity
    attack pattern.

    Velocity attack signature: same customer_id making payments at multiple geographically
    separated stores within a short time window of minutes.

    Single customer cannot physically be at 10 different city stores within 4 minutes.

    Alternating payment method fingerprints and device fingerprints are additional
    fraud signals.

    Identify all such impossible-travel clusters and submit their file paths as grounding_refs.

    '
  created: '2026-05-26'
  deactivated_reason: 'Consolidated: r021, r023, r038, r042, r043, r047'
  id: r043
  reasoning: Run 23 confirmed first cluster of 10 fraud payments (cust_042, 2024-04-13,
    10 stores in 4 min).
  source: manual
  status: inactive
- content: 'There are approximately 60 timestamp-named payment files in /proc/payments/.

    There are 18 total fraud payments to find across all timestamp files.

    Read ALL 60 timestamp files to find every velocity fraud cluster.

    There may be multiple distinct clusters across different dates or customers.

    Do not stop after finding the first cluster.

    '
  created: '2026-05-26'
