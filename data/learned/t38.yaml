- content: 'Use SQL to find velocity fraud efficiently instead of reading individual
    files. Run: /bin/sql ''SELECT customer_id, store_id, created_at, id, path FROM
    baskets WHERE status=''''archived'''' ORDER BY customer_id, created_at'' to get
    all archived baskets. Velocity fraud: same customer_id at 5+ different store_ids
    within minutes. This is O(1) instead of reading 60 files individually.'
  created: '2026-05-26'
  deactivated_reason: Replaced with precise SQL rules r058-r061
  id: r054
  reasoning: Baskets table has customer_id, store_id, created_at, status. Archived
    baskets = historical payments. SQL is instant vs 10 file reads per cycle.
  source: manual
  status: inactive
- content: 'SQL velocity query to find fraud clusters: SELECT customer_id, COUNT(DISTINCT
    store_id) as stores, MIN(created_at) as first_seen, MAX(created_at) as last_seen
    FROM baskets WHERE status=''''archived'''' GROUP BY customer_id, substr(created_at,1,10)
    HAVING COUNT(DISTINCT store_id) >= 5. Then map customer_ids to payment file paths
    in /proc/payments/ and read only those files.'
  created: '2026-05-26'
  deactivated_reason: Replaced with precise SQL rules r058-r061
  id: r055
  reasoning: Aggregation query instantly identifies velocity attackers. No need to
    read all 60 files.
  source: manual
  status: inactive
