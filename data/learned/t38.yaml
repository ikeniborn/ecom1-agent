entries:
- agents_md_anchor: null
  content: Never include a List or Read RPC for a path that is not explicitly provided
    in the user's intent or confirmed by a prior discovery step (e.g., a search result
    or a doc that mentions the path). If the path is unknown, first search for it
    using appropriate patterns derived from the intent, or ask for clarification.
  created: '2026-06-24'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: ''real_vm: list failed: not found'' on path ''/payments''. Root
    cause: The PlanIR guessed a directory path ''/payments'' without evidence that
    it exists. The user intent mentions ''archived payment history'' but does not
    specify a path. The agent attempted to list a non-existent directory, causing
    a VM failure. Failing PlanIR fragment: {"rpc":"List","args":{"path":"/payments"},"bind":"payments_list"}.
    The rule prevents such guesswork by requiring that any path used in a List or
    Read RPC must be either explicitly given in the intent or discovered via a prior
    search or documentation read.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include at least one discovery step (List, Read, or Search) in the
    PlanIR when the IntentSpec's required_refs for a non-clarification outcome contain
    a path that is not explicitly provided in the user's intent or confirmed by a
    prior step. The discovery step should attempt to locate the required data (e.g.,
    search for the policy doc, list archived payment records) before falling back
    to a clarification answer.
  created: '2026-06-24'
  deactivated_reason: null
  id: r002
  reasoning: 'Error: ''interpret: attempt grounded discovery before clarifying (clarify-only
    plan rejected while OUTCOME_OK is reachable)''. The PlanIR had no discovery steps
    and immediately defaulted to clarification, even though the IntentSpec required
    refs (policy_doc /docs/security.md, record_path from $fraud_payment_records) for
    OUTCOME_OK. The interpreter rejects a clarify-only plan when a non-clarification
    outcome is reachable. Root cause: the plan omitted any List/Read/Search to ground
    the required refs. The existing rule (rXXX) allowed asking for clarification without
    attempting discovery, which is now superseded.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When the IntentSpec's required_refs for a non-clarification outcome include
    a record_path from a category (e.g., 'payment records', 'archived history') and
    the exact path is not explicitly provided in the user's intent or confirmed by
    a prior discovery step, the PlanIR must first search for the directory or file
    that contains such records using patterns derived from the category description
    (e.g., search for 'payment' or 'archive' in the root or in a known parent directory).
    Only after the search yields a valid path should a List or Read RPC be issued
    on that path. If the search returns no results, the PlanIR should fall back to
    a clarification answer.
  created: '2026-06-24'
  deactivated_reason: Superseded by new rule that explicitly requires reading the
    file to bind the record_path ref.
  id: r003
  reasoning: 'The error ''real_vm: list failed: not found'' occurred because the PlanIR
    attempted to List ''/payments'' which does not exist. The user''s intent mentions
    ''archived payment history'' but does not provide an explicit path. The existing
    rule #1 prohibits listing unknown paths, but the PlanIR violated it. The root
    cause is that the PlanIR hardcoded ''/payments'' without first searching for the
    actual location of archived payment records. The fix is to enforce a rule that
    requires searching for the directory or file using patterns derived from the category
    description before listing. Additionally, deep-reading the root directory (''/'')
    will provide the pre-phase with knowledge of available top-level paths, preventing
    future hardcoding of non-existent paths.'
  status: inactive
  surface: ir
- agents_md_anchor: '#security'
  content: When the IntentSpec includes a security deny_when predicate, the PlanIR
    must include a decision branch that denies only when that predicate is true; the
    default branch must be the non-denial outcome (e.g., OUTCOME_OK) and must include
    discovery steps to satisfy required_refs for that outcome.
  created: '2026-06-25'
  deactivated_reason: null
  id: r004
  reasoning: The PlanIR unconditionally denied with outcome DENIED_SECURITY, but the
    security constraint only denies when identity.kind == 'guest'. The identity was
    not guest, so the denial was spurious. The plan must only deny when the predicate
    holds, and otherwise proceed to discover the fraudulent payment record as required
    by the IntentSpec.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always include discovery steps that produce all required_refs for the non-clarification
    outcome that is the default branch. If a required_ref is a record_path from a
    category not explicitly provided, the plan must first search for the directory,
    list its contents, and read the identified file to bind the record_path ref. The
    answer branch must not have empty refs for that outcome.
  created: '2026-06-25'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: interpret: unresolved required ref(s) [''$fraudulent_payment_record.record_path'']
    on OK answer. The PlanIR''s ok branch has empty refs and no discovery steps to
    locate the fraudulent payment record. Root cause: the plan only checks identity
    and does not search for or read the archived payment record. Existing rule r003
    advises searching for the directory but does not explicitly require reading the
    file to produce the record_path ref. The new rule supersedes r003 by adding the
    read step and ensuring the answer branch includes the refs.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always set the default branch label of a decision to the non-denial outcome
    (e.g., OUTCOME_OK) when the IntentSpec includes a security deny_when predicate.
    The deny branch must only be taken when the predicate is true.
  created: '2026-06-25'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). Root cause: PlanIR decision
    has two branches: one for guest (deny) and default_label also set to ''deny'',
    causing unconditional denial. The user identity (emp_011) is not guest, so the
    deny_when predicate is false, yet the plan still denies. The existing rule [in-session]
    about security deny_when was violated because the default branch was not set to
    the non-denial outcome. This new rule makes the requirement explicit: default
    branch must be the non-denial outcome, and deny only when predicate true.'
  status: active
  surface: ir
- agents_md_anchor: '#security'
  content: Always set the default branch of the decision to the non-denial outcome
    (OUTCOME_OK) when the IntentSpec includes a security deny_when predicate, and
    use the identity kind from the /bin/id RPC output (bound to a variable) for the
    deny branch condition to avoid spurious over-refusal, with a fallback that if
    the identity kind is unavailable, the deny branch is not taken.
  created: '2026-06-25'
  deactivated_reason: null
  id: r007
  reasoning: 'Error: verify: I3: outcome DENIED_SECURITY but no declared security
    deny_when predicate holds (spurious over-refusal). The PlanIR''s decision has
    a deny branch with condition eq($_facts.identity.kind, ''guest''), but the observed
    identity (emp_011) is not guest. The default branch is ''not_found'' (OUTCOME_NONE_CLARIFICATION)
    instead of OUTCOME_OK, violating the existing in-session rule. The spurious denial
    likely occurred because the condition relied on the pre-phase fact $_facts.identity.kind,
    which may be undefined or incorrectly set, causing the deny branch to be taken.
    The new rule ensures the condition uses the actual /bin/id RPC output and that
    the default branch is the non-denial outcome, preventing over-refusal.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Always access the stdout field of an ExecResponse (e.g., $_id_output.stdout)
    when using its output in a decision condition or compute step, rather than using
    the entire response object.
  created: '2026-06-25'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: ''real_vm: Protocol message ExecResponse has no "guest" field''.
    Root cause: PlanIR decision condition uses $_id_output (the entire ExecResponse
    object) as lhs of contains_any, but the runtime attempts to access a field ''guest''
    on the ExecResponse object, which does not exist. The ExecResponse has fields
    stdout, stderr, exit_code. The condition should use $_id_output.stdout to get
    the string output. This is a PlanIR shape bug: the condition references the raw
    RPC response instead of its stdout field.'
  status: active
  surface: ir
