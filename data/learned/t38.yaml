- agents_md_anchor: null
  content: When an OK-only required ref projects a rowset column for citation (e.g.
    $rows.record_path), probe the source table's schema first and confirm that BOTH
    the membership-filter columns AND the citation/path column exist under the exact
    names used in SELECT/WHERE before authoring the query; selecting guessed column
    names — whether for the policy signals or for the citation column itself — makes
    the query error or return blank/zero rows, so the rowset is empty and the projected
    ref stays unresolved even when the table holds matching records. Map the citation
    ref to a schema-verified column and build filter predicates from verified columns,
    not invented names.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r007
  reasoning: 'Verbatim error: ''interpret: unresolved required ref(s) [\''$rows.record_path\'']
    on OK answer''. The PlanIR correctly guards OK on nonempty $rows (r005) and emits
    the record_path ref as a structured answer.refs entry {kind:record_path, source:$rows.record_path}
    (r006), so the failure is upstream: the rowset itself came back empty. Failing
    fragment — the SQL SELECTs payment_id, record_path, three_ds_status, three_ds_failure_reason,
    three_ds_attempts, three_ds_max_attempts, is_archived_basket_reference and applies
    a WHERE with hand-invented enums (''failed'',''failure'',''rejected'',''declined'',''denied'',''error'',''aborted'',''not_authenticated'',''unauthenticated'',''abandoned'',''challenge_failed'',
    payment_status IN (''fraud'',''chargeback'',''reversed'',''voided''), attempts>=max_attempts)
    while /docs/payments/3ds.md is read only as bind policy_doc and never feeds the
    filter — the membership-criteria half of this is exactly r004 (policy read to
    satisfy citation ref, WHERE applies guessed constants). The NEW, complementary
    root cause this rule targets: every column name (three_ds_*, record_path, is_archived_basket_reference)
    is also guessed against an unverified schema; if the real table names the citation
    column or the filter columns differently, the query errors or projects blanks
    and $rows.record_path is unresolved independent of whether criteria match. r004
    covers criteria grounding; r005 covers the nonempty success gate; r006 covers
    ref projection — none require schema-verifying the citation/filter columns. This
    rule closes that gap. prephase_deep_read surfaces both the policy content and
    the actual schema at plan time so the next cycle authors verified column names
    and policy-derived enums rather than guessing.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When a compute step collapses a rowset column into a single string for
    message interpolation, do not feed a fixed-arity binary primitive like `concat`
    a single list/column argument — verify each compute primitive's declared arity
    against the args supplied, and to fold a multi-value column into one string use
    a list-aggregating join primitive (or a reduce that hands `concat` its two required
    operands per step) rather than calling the 2-arg primitive with one arg.
  created: '2026-06-20'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r008
  reasoning: 'Verbatim error: `plan: primitive ''concat'' takes 2 arg(s), plan supplies
    1`. Root cause: the PlanIR compute chain extracts the record_path column then
    tries to flatten it to a single string for the {record_paths} message placeholder
    via `{"prim":"concat","args":["$record_paths_col"],"into":"record_paths"}` — but
    `concat` is a binary primitive requiring exactly 2 operands; supplying one list
    argument fails plan-time arity validation before execution. Failing fragment:
    the lone-arg `concat` over `$record_paths_col`. The planner conflated ''join a
    list into a string'' (an aggregation/reduce) with ''concatenate two operands''
    (binary concat). Distinct from existing rules: r004/r005/in-session address policy-derived
    criteria and schema-verified columns to keep the rowset nonempty; r006 addresses
    projecting refs into answer.refs rather than message placeholders — none cover
    compute-primitive arity. This rule adds arity-checking before emitting compute
    steps. Note r006 already implies the {record_paths} message interpolation is not
    what resolves the ref, but the immediate fix is correct primitive arity for any
    column-to-string fold.'
  status: inactive
  surface: ir
