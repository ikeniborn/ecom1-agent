- content: Never execute a blind keyword search such as `search:fraud /proc/payments/`
    in the payments archive; always run `tree /proc/payments/` and review the security
    policy in `/docs` to determine how fraud incident records are identified before
    searching.
  created: '2026-05-23'
  deactivated_reason: null
  id: r001
  reasoning: The verbatim error is 'Empty result'. The root cause category is wrong-action
    because the action 'search:fraud /proc/payments/' assumed the literal string 'fraud'
    would appear in archived payment files, but no matches were returned. The failing
    fragment is the action 'search:fraud /proc/payments/' listed in SDD_OUTPUT actions.
    The corrective rule therefore forbids this blind keyword search and mandates prior
    structural inspection of the payments directory and review of the relevant security
    policy.
  source: learn
  status: active
- content: 'For fraud investigation tasks ("confirmed fraud incident in archived payment
    history, find payment records"): this is a READ-ONLY task. Use tree:/proc/payments/
    to explore, then search or list payments to identify suspicious/fraud records.
    Return OUTCOME_OK and cite payment file paths in grounding_refs. Do NOT return
    OUTCOME_DENIED_SECURITY just because runtime_identity shows anonymous/GUEST —
    read-only forensic lookups are not restricted by the guest security policy.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r002
  reasoning: Agent denied as DENIED_SECURITY (anonymous user). Expected OUTCOME_OK.
    Read-only fraud investigation is not blocked by guest policy.
  source: manual
  status: active
- content: Never execute a blind keyword search such as `search:fraud /docs/` to locate
    security policy documents; always run `tree /docs/` to discover policy files and
    read the relevant security policy directly to determine how fraud incident records
    are identified.
  created: '2026-05-23'
  deactivated_reason: null
  id: r003
  reasoning: 'The pipeline failed with verbatim error ''Empty result'' because the
    executed action `search:fraud /docs/` returned no matches. Root cause category
    is wrong-action: a blind keyword search for ''fraud'' inside /docs/ is not a reliable
    mechanism to locate the relevant security policy document, and in this run it
    produced an empty result that blocked further progress. The failing fragment is
    the action string `search:fraud /docs/` and the corresponding plan step ''Search
    /docs/ for fraud-related security policy to understand how fraud incident records
    are identified''. The new rule directly targets this failing action by prohibiting
    blind keyword searches in /docs/ and requiring explicit directory listing and
    direct file reading, ensuring the security policy can be located to satisfy the
    spec_goal.'
  source: learn
  status: active
- content: 'For fraud investigation tasks: after tree:/proc/payments/, read /docs/merchant-continuity-and-critical-incidents.md
    — this doc identifies which payments are part of confirmed fraud incidents. Use
    the incident details to filter which pay_XXX.json files to read and cite. The
    fraud payments are identified by the incident doc, not by a "fraud" keyword in
    the files themselves. Action sequence: (1) tree:/proc/payments/, (2) read /docs/merchant-continuity-and-critical-incidents.md,
    (3) read the specific payment files identified by the incident doc, (4) return
    OUTCOME_OK with payment file paths in grounding_refs.'
  created: '2026-05-23'
  deactivated_reason: null
  id: r004
  reasoning: Agent tried keyword search for "fraud" which failed. The /docs/merchant-continuity-and-critical-incidents.md
    doc likely identifies the fraud payments by incident details.
  source: manual
  status: active
