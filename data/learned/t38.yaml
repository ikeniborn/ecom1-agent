  content: When the instruction mentions archived or older data, first discover the
    correct archive path by reading documentation or listing known archive directories
    before attempting to list the archive.
  created: '2026-06-21'
  deactivated_reason: null
  id: r001
  reasoning: 'Error: real_vm: list failed: not found for path /archive/payments. Root
