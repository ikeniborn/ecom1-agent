- agents_md_anchor: null
  content: 'When probing an RPC result for its row/entry collection via getattr over
    candidate attribute names, never include dict-method names (''items'',''keys'',''values'',''get'')
    in the candidate list, and reject any getattr/dict-get value that is callable
    before returning or iterating it; getattr(some_dict, ''items'') returns the truthy
    built-in dict.items bound method, so a later for-loop over it raises TypeError:
    ''builtin_function_or_method'' object is not iterable.'
  created: '2026-06-05'
  deactivated_reason: null
  id: r027
  reasoning: 'Verbatim error: fidelity TypeError: ''builtin_function_or_method'' object
    is not iterable, line 44 in run -> the loop `for it in _items(fraud_docs)`. Root
    cause: helper `_items(r)` probes `for attr in ("entries","hits","results","matches","items")`
    with `getattr(r, attr, None)`; when an RPC result is a dict (e.g. {''stdout'':
    ''''} stub or a dict-shaped return), `getattr(dict_obj, ''items'')` resolves to
    the built-in bound method `dict.items`, which is truthy, so `_items` returns that
    method object instead of a list. The caller then does `for it in <bound builtin>`,
    which is not iterable -> crash. Failing fragment: `for attr in (... "items"):
    v = getattr(r, attr, None); ... if v: return v`. Linkage: extends the compacted
    result-shape extraction guidance — extraction helpers must guard against dict-method
    name collisions and callable returns, not just None/empty; no existing rule covers
    the getattr-vs-dict-method aliasing pitfall.'
  status: active
