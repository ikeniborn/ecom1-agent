- agents_md_anchor: null
  content: When extracting a single numeric count from SQL output, use format 'regex'
    with a pattern like '(\d+)' to capture the number directly, avoiding auto_delim
    parsing failures that can leave the answer unbound.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'Error: verify: success_criteria[OUTCOME_OK][0] failed: {''op'': ''ge'',
    ''lhs'': ''$answer'', ''rhs'': 0, ''args'': []}. Observed SQL output: ''cnt\n0''.
    The PlanIR used rowsets with format ''auto_delim'' and column candidates [''cnt'']
    to extract the count, but the answer was not bound correctly (likely remained
    as literal ''{count_result}''), causing verification to fail. The root cause is
    the rowsets extraction step: the auto_delim format may not reliably parse a simple
    header+value output, leaving the count_result variable undefined. A regex extraction
    directly captures the numeric value, ensuring the answer is a number and passes
    the >=0 check.'
  status: inactive
  surface: ir
