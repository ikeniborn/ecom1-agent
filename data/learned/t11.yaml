  content: Always emit one script RPC call for every tool_plan entry across both discovery
    and ops, even when entries are byte-identical — fidelity verifies the RPC multiset,
    so collapsing duplicate calls drops required invocations.
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [''Answer'', ''Exec'', ''Exec''] got: [''Answer'', ''Exec'']''.
    Root cause: tool_plan lists Exec twice (one discovery entry + one identical ops
    entry), each must produce a runtime RPC. Failing fragment: SCRIPT_CODE calls vm.exec
    exactly once then vm.answer once, yielding multiset [''Exec'',''Answer''] instead
    of [''Exec'',''Exec'',''Answer''] — CODEGEN deduped the two identical Exec entries
    into a single call. Rule linkage: translation technique is to map each tool_plan
    RPC entry 1:1 to a script call without dedup, since the fidelity check compares
    RPC multisets.'
