- agents_md_anchor: null
  content: When parsing /bin/sql stdout into rows, split each line on comma because
    /bin/sql emits CSV — splitting on '|' collapses every row to a single column,
    so the len(cols) >= 2 guard never fires and runtime ref columns like record_path
    are silently dropped from refs.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$matched_products.record_path'']) but actual refs [''/proc/catalog''] contain
    only static template entries [''/proc/catalog''] — SQL likely returned no rows
    or row parsing dropped the path column". Root cause: SQL DID return rows — OBSERVED_RPC_OUTPUTS
    shows comma-delimited CSV (header ''product_sku,record_path'' then ''MAC-13QQL55G,/proc/catalog/.../MAC-13QQL55G.json'').
    But the failing fragment `cols = [c.strip() for c in line.split("|")]` splits
    on pipe, which is absent in CSV output. Result: cols becomes a one-element list
    holding the whole line, the `if len(cols) >= 2 and cols[-1]` guard is False for
    every data row, so record_paths stays empty and refs degrades to just [''/proc/catalog''].
    (The header-skip `cols[0].lower() == "product_sku"` also misfires since cols[0]
    is the entire ''product_sku,record_path'' string.) Rule linkage: the new rule
    fixes the delimiter assumption at the parse layer so runtime ref columns are recovered
    — not covered by r001 (RPC multiset emission), r002 (addenda/doc ref discovery),
    or v003 (a verdict, not a rule).'
  status: active
