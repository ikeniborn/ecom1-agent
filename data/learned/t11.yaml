- agents_md_anchor: null
  content: When a policy document defines product kind mappings, always extract the exact product_kind_id
    values from the document and use them in a simple COUNT query on the product_variants table, avoiding
    hardcoded guesses and unnecessary joins to store_inventory or stores unless the objective explicitly
    requires inventory constraints.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: The error 'Answer should be 7' indicates the PlanIR produced an incorrect count. The script
    hardcoded product_kind_id = 'compressors_extractors' and joined store_inventory/stores with filters,
    which likely excluded valid products or used a non-existent ID. The policy doc should be parsed to
    extract the actual product_kind_id values for Compressor and Dust Extractor, then a simple COUNT on
    product_variants with those IDs should be performed. The script's unnecessary store/inventory joins
    and guessed ID caused the failure.
  status: active
  surface: ir
- agents_md_anchor: null
  content: When using the result of a Read RPC in string operations like contains_any, first extract the
    text content from the ReadResponse object using a compute step with prim 'extract' and field 'content'.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'The error ''Protocol message ReadResponse has no "work_jackets" field.'' occurred because
    the decision branch applied contains_any directly to the $policy_doc ref, which is a ReadResponse
    object, not a plain string. The contains_any primitive likely tried to access a field named ''work_jackets''
    on the object, which doesn''t exist. The root cause is that the PlanIR did not extract the text content
    from the ReadResponse before performing string operations. The failing PlanIR fragment is the decision
    branch: ''when: {op: contains_any, lhs: $policy_doc, rhs: ["work_jackets"]}''. The new rule ensures
    that the content field is extracted first, making string operations valid.'
  status: active
  surface: ir
