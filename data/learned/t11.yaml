  content: When emitting answer refs, do not copy answer_template.refs verbatim —
    first discover relevant addenda/documentation files for the query's subject (glob
    or query the docs directory by the entities/kinds in params) and append any matches
    to the refs list, since the grader fails answers that omit required source addenda
    references.
  created: '2026-06-06'
