- agents_md_anchor: null
  content: When a policy document defines product kind mappings, always extract the
    exact product_kind_id values from the document and use them in a simple COUNT
    query on the product_variants table, avoiding hardcoded guesses and unnecessary
    joins to store_inventory or stores unless the objective explicitly requires inventory
    constraints.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r006
  reasoning: The error 'Answer should be 7' indicates the PlanIR produced an incorrect
    count. The script hardcoded product_kind_id = 'compressors_extractors' and joined
    store_inventory/stores with filters, which likely excluded valid products or used
    a non-existent ID. The policy doc should be parsed to extract the actual product_kind_id
    values for Compressor and Dust Extractor, then a simple COUNT on product_variants
    with those IDs should be performed. The script's unnecessary store/inventory joins
    and guessed ID caused the failure.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using the result of a Read RPC in string operations like contains_any,
    first extract the text content from the ReadResponse object using a compute step
    with prim 'extract' and field 'content'.
  created: '2026-06-22'
  deactivated_reason: null
  id: r007
  reasoning: 'The error ''Protocol message ReadResponse has no "work_jackets" field.''
    occurred because the decision branch applied contains_any directly to the $policy_doc
    ref, which is a ReadResponse object, not a plain string. The contains_any primitive
    likely tried to access a field named ''work_jackets'' on the object, which doesn''t
    exist. The root cause is that the PlanIR did not extract the text content from
    the ReadResponse before performing string operations. The failing PlanIR fragment
    is the decision branch: ''when: {op: contains_any, lhs: $policy_doc, rhs: ["work_jackets"]}''.
    The new rule ensures that the content field is extracted first, making string
    operations valid.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: Never use a compute step to execute a command or SQL query; always use
    the appropriate RPC (e.g., sql_query, read) for database operations, and ensure
    that the 'args' field of a compute step is always a list of arguments, not a dict.
  created: '2026-06-24'
  deactivated_reason: null
  id: r008
  reasoning: 'Error: plan validation failed because compute.1.args was a dict instead
    of a list. The input_value shows a dict with keys ''path'' and ''stdin'', indicating
    an attempt to run a command via compute step. Root cause: the PlanIR generator
    incorrectly used a compute step with a command to execute a SQL query, violating
    the expected schema. The corrective rule ensures that compute steps use list args
    and that SQL queries are performed via dedicated RPCs, preventing schema validation
    errors.'
  status: active
  surface: ir
- agents_md_anchor: null
  content: When a policy document defines a product_kind_id, always extract it from
    the document content using a compute step with string operations (e.g., contains_any
    or regex) and use that extracted value in the SQL query, rather than hardcoding.
    Additionally, ensure that the rowset parsing of the SQL result is placed after
    the ops array in the PlanIR JSON to guarantee the data is available before parsing.
  created: '2026-06-24'
  deactivated_reason: null
  id: r009
  reasoning: 'Error: verify success_criterion failed because $count was undefined.
    The PlanIR hardcoded ''wall_paint'' instead of extracting the product_kind_id
    from the policy document (violating r006). The rowset parsing of the SQL result
    may have failed because the rowset definition appeared before the ops array, causing
    $parsed_count to be undefined when compute steps ran. The plan must extract the
    exact product_kind_id from the document and ensure the rowset is defined after
    the ops to guarantee data availability.'
  status: active
  surface: ir
