- agents_md_anchor: null
  content: When a required ref is a file read, always add a decision branch that checks
    if the bound content is non-empty; if empty, produce OUTCOME_NONE_UNSUPPORTED.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: The plan produced OUTCOME_NONE_CLARIFICATION instead of OUTCOME_OK. The
    answer for 'ok' required a ref from reading '/docs/policy-updates/2024-07-17-catalogue-reporting-anchors-plugs-vienna.md'.
    If the file read failed (empty/null bind), the ref source would be missing, causing
    the outcome to fallback to OUTCOME_NONE_CLARIFICATION. The plan lacked a decision
    branch to check the file content and produce OUTCOME_NONE_UNSUPPORTED when empty.
  status: active
  surface: ir
