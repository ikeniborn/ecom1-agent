  id: r002
  reasoning: 'Verbatim error: "grader: answer missing required reference ''/docs/catalogue-addenda/2024-07-17-reporting-tool-boxes-bags-salzburg.md''".
    Root cause: script emitted refs=["/proc/catalog"] copied directly from answer_template,
    never discovering subject-area addenda docs. Failing fragment: vm.answer(message=message,
    outcome="OUTCOME_OK", refs=["/proc/catalog"]). Grader requires the catalogue-addenda
    reporting doc for the queried product kinds. Rule linkage: CODEGEN must augment
    answer refs with discovered addenda docs rather than trust answer_template refs
    as complete. Distinct from r001 (RPC multiset emission) — this targets ref discovery,
    not call duplication.'
