- agents_md_anchor: null
  content: Do not hardcode constant values in discovery queries to simulate facts
    that are already available in the interpreter's $_facts (e.g., identity.kind).
    Instead, reference the $_facts path directly in decision branch conditions.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION. The
    script''s discovery step hardcoded ''guest'' as kind in a SQL constant, but the
    actual identity is not guest, and the query likely failed due to missing column
    ''record_path'' in payment_transactions, causing empty rows and a compute failure
    that led to clarification. The root cause is fabricating a fact instead of using
    $_facts.identity.kind, and possibly selecting a non-existent column.'
  status: active
  surface: ir
