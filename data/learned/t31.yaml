- agents_md_anchor: null
  content: When parsing /bin/sql exec stdout, treat output as CSV — a header row followed
    by comma-separated value rows — and map columns by header name rather than assuming
    a pipe `|` delimiter; splitting on `|` and skipping lines lacking `|` discards
    every row, leaving runtime-bound refs (record_path, etc.) empty and failing the
    answer_refs check.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$payment_path'', ''$policy_path'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". Root cause: /bin/sql emits CSV (header line `payment_id,record_path,basket_id,...`
    then `pay_070,/proc/payments/pay_070.json,...`), but the parser assumed a pipe-delimited
    format. Failing fragment: `if not line or "|" not in line: continue` followed
    by `cols = [c.strip() for c in line.split("|")]` — since no SQL line contains
    `|`, every line is skipped, so record_path/payment_path stay "" and refs ends
    empty. The SQL itself returned a valid row (record_path=/proc/payments/pay_070.json);
    only the delimiter assumption in CODEGEN dropped it. Linkage: distinct from r001/r002
    (which cover op emission and try/except wrapping) — this is a stdout-format parsing
    technique. policy_path also empty because tree/find returned no docs, but the
    runtime-ref failure the error flags is the path column, fixed by correct CSV parsing.'
  status: active
- agents_md_anchor: null
  content: Always emit every planned discovery RPC unconditionally, including a Read/Exec
    whose args bind to a value resolved from an earlier RPC (e.g. $policy_path from
    Find); when the upstream resolution yields empty, still invoke the call with a
    best-effort or fallback argument instead of wrapping it in an `if resolved_value:`
    guard — the fidelity multiset counts discovery RPCs as well as ops, so a skipped
    Read drops the executed multiset below the frozen plan.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''fidelity: ... AssertionError: fidelity drift (RPC
    multiset) expected: [Answer, Exec, Exec, Exec, Exec, Find, Read, Tree] got: [Answer,
    Exec, Exec, Exec, Exec, Find, Tree]''. Diff = missing one Read. Root cause: the
    plan''s Read RPC (bind payments_policy) binds path to $policy_path, which is resolved
    at runtime from the Find result. In the script the read is guarded — `payment_path`
    logic aside, the failing fragment is `if policy_path:` wrapping `payments_policy
    = vm.read(path=policy_path, number=True)`. When Find parsing produced no candidate,
    policy_path stayed '''' and vm.read was skipped entirely, so the executed multiset
    lost its Read and failed the frozen-plan comparison. Linkage: r001 already mandates
    unconditional emission for ops-list RPCs and forbids policy guards; this case
    extends the same invariant to discovery RPCs and to data-availability guards (empty
    dynamic binding), which r001''s ops-scoped wording did not cover — hence a distinct
    rule rather than a duplicate.'
  status: active
