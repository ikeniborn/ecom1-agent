- agents_md_anchor: null
  content: When a decision branch uses $_facts.identity.kind to enforce a security
    constraint, include a discovery step to read the identity source file (e.g., /home/user/.session)
    and use its content to determine the kind, rather than relying solely on $_facts.
  created: '2026-06-22'
  deactivated_reason: null
  id: r006
  reasoning: 'Error: grader expected OUTCOME_OK but got OUTCOME_DENIED_SECURITY. The
    PlanIR decision branch correctly checks $_facts.identity.kind == ''guest'' to
    deny, but the pre-phase mis-set identity.kind to ''guest'' even though the true
    identity is not guest (desired outcome OK). The PlanIR had no independent verification
    of identity, so it trusted the incorrect $_facts and took the deny branch. The
    new rule ensures the PlanIR reads the identity source file directly, making the
    decision robust to pre-phase errors.'
  status: active
  surface: ir
