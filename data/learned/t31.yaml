- agents_md_anchor: null
  content: When the desired outcome is a deny outcome (e.g., OUTCOME_DENIED_SECURITY) and the deny condition
    is not always true, set the default_label to a non-deny outcome (e.g., 'ok') and add a branch for
    the deny condition only. Never set default_label to a deny outcome unless the deny condition is always
    true.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: The script's decision default_label was 'deny', which maps to OUTCOME_DENIED_SECURITY. The
    deny condition (identity.kind == 'guest') was not always true, so the outcome was produced even when
    identity.kind was 'customer', causing the success criteria to fail. Existing rule r001 warns against
    this but was not applied; this rule clarifies the case when the desired outcome itself is a deny outcome.
  status: active
  surface: ir
- agents_md_anchor: null
  content: Do not hardcode constant values in discovery queries to simulate facts that are already available
    in the interpreter's $_facts (e.g., identity.kind). Instead, reference the $_facts path directly in
    decision branch conditions.
  created: '2026-06-22'
  deactivated_reason: null
  id: r005
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_CLARIFICATION. The script''s discovery
    step hardcoded ''guest'' as kind in a SQL constant, but the actual identity is not guest, and the
    query likely failed due to missing column ''record_path'' in payment_transactions, causing empty rows
    and a compute failure that led to clarification. The root cause is fabricating a fact instead of using
    $_facts.identity.kind, and possibly selecting a non-existent column.'
  status: active
  surface: ir
- content: null
  created: '2026-06-22'
  id: v015
  score: 0.0
  score_detail:
  - expected outcome OUTCOME_OK, got OUTCOME_DENIED_SECURITY
  source: verdict
  status: active
  submitted_message: Guests are not permitted to perform payment operations.
  submitted_outcome: OUTCOME_DENIED_SECURITY
  submitted_refs:
