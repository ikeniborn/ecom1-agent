  content: When the desired outcome is a deny outcome (e.g., OUTCOME_DENIED_SECURITY)
    and the deny condition is not always true, set the default_label to a non-deny
    outcome (e.g., 'ok') and add a branch for the deny condition only. Never set default_label
    to a deny outcome unless the deny condition is always true.
  created: '2026-06-22'
  deactivated_reason: null
  id: r004
  reasoning: The script's decision default_label was 'deny', which maps to OUTCOME_DENIED_SECURITY.
    The deny condition (identity.kind == 'guest') was not always true, so the outcome
    was produced even when identity.kind was 'customer', causing the success criteria
    to fail. Existing rule r001 warns against this but was not applied; this rule
    clarifies the case when the desired outcome itself is a deny outcome.
  status: active
  surface: ir
