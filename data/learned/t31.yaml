- agents_md_anchor: null
  content: When a discovery SQL query joins a primary entity with a secondary entity
    that may be missing, use LEFT JOIN instead of implicit cross join to ensure the
    primary row is always returned. This prevents empty rowsets that cause compute
    failures and CLARIFICATION outcomes.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The interpreter returned OUTCOME_NONE_CLARIFICATION, indicating a plan
    execution error rather than a business-logic mismatch. The PlanIR's discovery
    SQL used a cross join ('FROM pay, basket') which returns zero rows if the basket
    subquery is empty. The subsequent compute step 'first' on an empty rowset likely
    failed, causing the interpreter to fall back to CLARIFICATION. Additionally, the
    table name 'shopping_baskets' may be incorrect; the pre-phase did not deep-read
    the database schema to confirm it. The decision branch checking basket_status
    (ne 'checked_out') is unnecessary per r002 but did not cause this error.
  status: inactive
  surface: ir
