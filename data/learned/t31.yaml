- agents_md_anchor: '#decision-branches'
  content: When a decision includes a deny branch for a constraint condition, set
    the default_label to the desired outcome (e.g., 'ok') and add a branch for the
    deny condition only. Never set default_label to a deny outcome unless the deny
    condition is always true.
  created: '2026-06-22'
  deactivated_reason: Superseded by a more precise rule that explicitly handles deny
    outcomes as the desired outcome.
  id: r001
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_DENIED_SECURITY. Root
    cause: decision block has a single branch for guest -> denied, and default_label
    is ''denied''. Since the identity is not guest, the branch is skipped and default_label
    ''denied'' is taken, always producing denied. The PlanIR fragment: decision.branches
    only contains the deny condition, and default_label is ''denied''. No path to
    OUTCOME_OK exists. The answer block also only defines the denied outcome, but
    the primary bug is the decision logic. No existing rule covers this.'
  status: inactive
  surface: ir
