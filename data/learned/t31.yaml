- agents_md_anchor: null
  content: When building a decision for a payment action, do not add branches that
    check unrelated entity states (like basket status) unless the policy doc explicitly
    requires them. Derive eligibility conditions solely from the relevant policy document's
    content, extracting allowed statuses or other criteria, and never hardcode a list
    of values.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: grader expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. Root
    cause: The decision branch `when: {op: ne, lhs: $basket_status, rhs: "checked_out"}`
    matched because the basket status was not "checked_out", leading to the unsupported
    outcome. This branch is an over-constraint not required by the instruction or
    policy. Additionally, the branch checking three_ds_status against a hardcoded
    set ["status2","status3"] may have failed if the actual status was different;
    the plan should have extracted eligible statuses from the 3ds.md policy document.
    Failing PlanIR fragment: decision branches for basket_status and the hardcoded
    in_set check. The rule prevents adding extraneous entity-state checks and mandates
    deriving conditions from policy docs rather than hardcoding.'
  status: inactive
  surface: ir
