entries:
- agents_md_anchor: '#important-tools > sql'
  content: 'When parsing /bin/sql stdout in CODEGEN, treat output as comma-separated
    CSV with a leading header line: split each row on '','' (not ''|'') and skip the
    first header line before extracting columns.'
  created: '2026-06-06'
  deactivated_reason: null
  id: r001
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$product_path'', ''$store_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". Root cause: /bin/sql emits CSV (OBSERVED output header ''store_id,store_path,product_sku,product_path,available_today_quantity''
    is comma-delimited), but the failing fragment `cols = [c.strip() for c in line.split("|")]`
    splits on ''|''. With comma data every row collapses to len(cols)==1, hits `if
    len(cols) < 5: continue`, so every row (including any data rows) is dropped →
    product_path stays None, store_paths empty → refs == []. The script also never
    skips the header line. Rule linkage: codegen must match the /bin/sql CSV output
    contract (comma delimiter + header row) when parsing stdout into refs.'
  status: active
- agents_md_anchor: '#important-tools > sql'
  content: Always pass the SQL text to /bin/sql through the stdin parameter exactly
    as the tool_plan declares (e.g. vm.exec(path='/bin/sql', args=[], stdin=query)),
    never as an argv element, because /bin/sql reads its query from stdin; supplying
    it via args leaves stdin empty so the tool emits only the header line and zero
    data rows, collapsing refs to [].
  created: '2026-06-06'
  deactivated_reason: null
  id: r002
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$product_path'', ''$store_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". OBSERVED_RPC_OUTPUTS confirm both /bin/sql calls returned only the header
    line (e.g. ''store_id,store_path,product_sku,product_path,available_today_quantity'')
    with no data rows. Root cause: tool_plan specifies the query in `stdin` with `args:
    []`, but SCRIPT_CODE invokes `vm.exec(path="/bin/sql", args=[discovery_sql])`
    and `vm.exec(path="/bin/sql", args=[ops_sql])` — passing the SQL as an argv element
    while leaving stdin unset. /bin/sql reads from stdin, so the query never executes
    and only the schema header is printed; the parse loop then iterates lines[1:]
    (empty), product_path stays None, store_paths stays [], refs=[]. Failing fragment:
    `vm.exec(path="/bin/sql", args=[discovery_sql])`. Linkage: rule forces CODEGEN
    to route SQL via stdin per tool_plan, distinct from the existing CSV-parsing rule
    which only governs how populated stdout is split.'
  status: active
- agents_md_anchor: '#important-things > references'
  content: When the answer_template requires runtime refs sourced from query rows
    (e.g. $product_path, $store_paths), do not emit vm.answer with OUTCOME_OK if the
    parsed result set has zero data rows (only the CSV header line); detect the empty
    rowset and fail instead, so an answer never ships with refs=[] while the template
    demands row-derived paths.
  created: '2026-06-06'
  deactivated_reason: null
  id: r003
  reasoning: 'Verbatim error: "answer_refs: template/constraints require runtime refs
    ([''$product_path'', ''$store_paths'']) but actual refs [] contain only static
    template entries [] — SQL likely returned no rows or row parsing dropped the path
    column". Root cause: both /bin/sql calls (discovery + ops) returned only the header
    line and zero data rows (OBSERVED_RPC_OUTPUTS show `product_sku,record_path,product_name`
    and `store_id,store_path,...,available_today_quantity` with no following rows).
    Failing fragment: `data = parse_csv(...)` yields [], so the `for r in data:` loop
    never runs, leaving `product_path=None` and `store_paths=[]`, hence `refs=[]`;
    yet the script still calls `vm.answer(message="%d products" % total, outcome="OUTCOME_OK",
    refs=refs)`. The CODEGEN defect is shipping OUTCOME_OK with empty refs when answer_template
    lists $product_path/$store_paths. Rule linkage: existing rules cover CSV comma-parsing
    and stdin query passing but none guard the zero-row → empty-refs case; this rule
    forces the script to surface an empty rowset as failure rather than emit OUTCOME_OK
    with refs=[].'
  status: active
