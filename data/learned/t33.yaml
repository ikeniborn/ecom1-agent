- agents_md_anchor: null
  content: When using 'first' to extract a single row from a rowset, always ensure
    the rowset is nonempty before referencing its fields, or use a decision branch
    that checks the rowset length directly.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r003
  reasoning: The plan's compute step used 'first' on $product_rows without checking
    if the rowset was empty. The SQL query (which violated r002 by using stdin) likely
    returned no rows, causing $product to be null. The decision condition then referenced
    $product.record_path, which failed and led the interpreter to produce OUTCOME_NONE_CLARIFICATION
    instead of the expected OUTCOME_OK or even the defined OUTCOME_NONE_UNSUPPORTED.
    The plan must guard against empty rowsets when extracting a single row.
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: When using filter_rows in a compute step, the predicate must be a string
    expression (e.g., 'row.record_path == row.record_path'), not a dict.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r004
  reasoning: 'The interpret step failed with "''dict'' object has no attribute ''op''"
    because the predicate for filter_rows was provided as a dict. The interpreter
    expects a string expression that can be evaluated against each row. The failing
    PlanIR fragment: compute step ''filter_rows'' with args [''$store_rows'', {''op'':''eq'',''lhs'':''$row.record_path'',''rhs'':''$row.record_path''}].
    Additionally, the filter was redundant (always true), so it could be omitted entirely,
    but the rule addresses the predicate format.'
  status: inactive
  surface: ir
