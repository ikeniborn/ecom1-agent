- content: Always emit SQL actions as structured JSON action list entries in the PLAN
    output — never narrate or present queries as prose or markdown code blocks, even
    when the SQL tool appears unavailable; the PCM harness dispatches the JSON action
    field, not inline text, as required by spec_goal 'Sum available_today units across
    all open Vienna PowerTool stores for the Bahco Comfort Grip BE 1ZR-PGS side cutter
    125mm pliers product'.
  created: '2026-05-24'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''PLAN phase: failed to parse LLM output. Raw: SQL tool
    not in available toolset. Presenting queries for PCM harness execution.'' Root
    cause: wrong-action — the PLAN phase LLM tried to output SQL queries directly
    in natural language / markdown instead of returning a parseable JSON action list,
    because it believed the SQL tool was unavailable and broke out of the structured
    output format. Failing fragment: the SDD action ''SELECT p.sku, p.path, p.name,
    p.series, MAX(CASE WHEN pp.key=...'' was never emitted as a JSON action; the LLM
    instead narrated it as prose, causing the PCM harness JSON parser to fail. Rule
    linkage: the new rule must target the PLAN output format — the LLM must always
    emit SQL actions as structured JSON action fields regardless of perceived tool
    availability, never as prose or markdown blocks.'
  source: learn
  status: active
