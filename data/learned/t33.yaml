- content: Always search product line identifier tokens (e.g. '1ZR-PGS') across p.series,
    p.model, AND p.name using OR conditions in the standalone SKU identification query
    required by spec_goal 'Sum available_today units of Bahco Comfort Grip BE 1ZR-PGS
    side cutter 125 mm pliers across all open Vienna PowerTool stores' — never filter
    on p.series alone, because the token may reside in p.model or p.name instead.
  created: '2026-05-24'
  deactivated_reason: null
  id: r006
  reasoning: 'Verbatim error: ''Empty result: sku,path,name,series,tool_type,length_mm''.
    Root cause category: wrong-filter. Failing fragment: SDD_OUTPUT action[0] clause
    ''LOWER(p.series) LIKE \''%1zr-pgs%\'''' — the string ''BE 1ZR-PGS'' from the
    product name appears in the products.name or products.model column, not necessarily
    in products.series (schema separates series/model/name fields). Filtering only
    p.series produced zero rows. Success criterion ''Exact SKU identified via standalone
    pivot query on products + product_properties matching brand=Bahco, series containing
    1ZR-PGS, tool_type=side cutter, length_mm=125'' failed because the identifier
    token was sought only in the wrong column. Rule must require OR-spanning p.series,
    p.model, and p.name when searching for product line identifiers in the standalone
    SKU query. Additionally, r003 and r005 reference Uvex brand success criteria and
    are mismatched residue from a prior task cycle — both should be deactivated.'
  source: learn
  status: active
