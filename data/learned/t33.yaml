entries:
- content: Always identify the exact product SKU with a standalone query on the products
    and product_properties tables before executing any inventory-aggregation action
    that joins stores, products, and product_properties, satisfying the success criterion
    'The exact product SKU is identified by matching brand Uvex, series/model containing
    2KV-937 and Industrial, size L, and color family Green.'
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r001'
  id: r001
  reasoning: 'The verbatim error was ''Empty result: store_id,store_name,sku,product_name,product_path,available_today''.
    Root cause category is wrong-action: the pipeline used a single monolithic SQL
    join that simultaneously filtered for the product identity, property values, and
    positive inventory, making it impossible to distinguish whether the product did
    not exist or simply had zero available stock. This directly contradicted the separate
    success criterion ''The exact product SKU is identified by matching brand Uvex,
    series/model containing 2KV-937 and Industrial, size L, and color family Green.''
    The failing fragment is the action ''SELECT i.store_id, s.name AS store_name,
    i.sku, p.name AS product_name, p.path AS product_path, i.available_today FROM
    inventory i JOIN stores s ON i.store_id = s.id JOIN products p ON i.sku = p.sku
    LEFT JOIN product_properties pp_size ON p.sku = pp_size.sku AND pp_size.key =
    ''size'' LEFT JOIN product_properties pp_color ON p.sku = pp_color.sku AND pp_color.key
    = ''color_family'' WHERE LOWER(s.city) = ''graz'' AND p.brand = ''Uvex'' AND (p.name
    LIKE ''%2KV-937%'' OR p.model LIKE ''%2KV-937%'') AND (p.name LIKE ''%Industrial%''
    OR p.series LIKE ''%Industrial%'') AND pp_size.value_text = ''L'' AND pp_color.value_text
    = ''Green'' AND i.available_today > 0''. The corrective rule mandates decoupling
    SKU identification from inventory aggregation so that the product record can always
    be retrieved and cited independently of store stock levels.'
  source: learn
  status: inactive
- content: Always apply COLLATE NOCASE or LOWER() to the brand equality filter and
    to product_properties.value_text comparisons in the standalone SKU identification
    action that queries products and product_properties, satisfying the success criterion
    'The exact product SKU is identified by matching brand Uvex, series/model containing
    2KV-937 and Industrial, size L, and color family Green.'
  created: '2026-05-23'
  deactivated_reason: 'Consolidated: r002'
  id: r002
  reasoning: 'Verbatim error: ''Empty result: sku,path,brand,series,model,name,size,color_family''.
    Root cause category: wrong-filter. The standalone SKU identification action executed
    ''WHERE p.brand = ''Uvex'''' using a case-sensitive equality predicate against
    the products table. SQLite text comparisons are case-sensitive by default (BINARY
    collation), so if the stored brand value differs in case (e.g., ''uvex'' or ''UVEX''),
    the filter eliminates all candidate rows before the property pivot, yielding an
    empty result set. Failing fragment: action string ''SELECT ... FROM products p
    LEFT JOIN product_properties pp ... WHERE p.brand = ''Uvex'' ...''. Rule linkage:
    the new rule mandates case-insensitive comparison (COLLATE NOCASE or LOWER())
    for the brand filter and property value filters in that exact standalone SKU identification
    action.'
  source: learn
  status: inactive
