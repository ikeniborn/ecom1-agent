- agents_md_anchor: '#plan-phase'
  content: When a plan requires filtering by a specific value from a table, ensure
    the pre-phase deep-reads that table to obtain the exact value.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r001
  reasoning: 'Grader error: expected OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED. Root
    cause: product discovery SQL returned no rows, likely because the literal product_family_name
    ''Loctite Threadlocker EA 3UJ-5ML Adhesive and Glue'' did not exactly match the
    database value. The failing PlanIR fragment is the WHERE clause on product_families.product_family_name.
    The pre-phase did not surface the actual family name, so the plan used the instruction''s
    literal, causing a mismatch. The new rule ensures future plans deep-read the source
    table to obtain exact values before constructing filters.'
  status: inactive
  surface: ir
- agents_md_anchor: null
  content: Never use stdin to pass SQL to the sql binary in an Exec RPC; instead pass
    the SQL as a command-line argument using -c or --command.
  created: '2026-06-22'
  deactivated_reason: 'capped (re-bloat guard: keep newest 3; pin to protect)'
  id: r002
  reasoning: 'Error: ''interpret: sql returned usage banner — SQL not delivered via
    stdin''. The PlanIR discovery step used Exec with args: {path:''/bin/sql'', stdin:''...'',
    args:[''--set'',...]}. The sql binary did not receive the SQL on stdin, causing
    a usage banner. Root cause: Exec RPC does not support stdin delivery for sql;
    the SQL must be passed as a command-line argument. Failing PlanIR fragment: the
    first Exec call with ''stdin'' key. Rule linkage: new rule to correct Exec usage
    for sql.'
  status: inactive
  surface: ir
