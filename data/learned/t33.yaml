- agents_md_anchor: null
  content: Do not silently `continue` past parsed /bin/sql rows whose column count
    differs from the expected schema; a count mismatch signals a delimiter or parse
    error, so surface or repair it instead of dropping the row, because dropping every
    data row leaves store_paths/refs empty and collapses a valid OUTCOME_OK into a
    false OUTCOME_NONE_UNSUPPORTED.
  created: '2026-06-06'
  deactivated_reason: null
  id: r004
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED''.
    Root cause: the script only reaches OUTCOME_NONE_UNSUPPORTED via the guard `if
    not store_paths or not product_path`. store_paths is built only inside the `for
    cols in rows` loop, which first executes `if len(cols) < 5: continue`. When /bin/sql
    output is parsed with a naive `l.split('','')` and the actual rows do not split
    into the 5 expected columns (delimiter/format mismatch or a field-level mismatch),
    every data row hits the `len(cols) < 5: continue` branch and is silently discarded,
    leaving store_paths=[] and product_path=None — so the script bails to NONE_UNSUPPORTED
    even though inventory exists and the grader expected OK. Failing fragment: `if
    len(cols) < 5:\n    continue` combined with `if not store_paths or not product_path:
    return vm.answer(... outcome=''OUTCOME_NONE_UNSUPPORTED'' ...)`. Rule linkage:
    extends r001 (comma-CSV) and r003 (detect truly-empty rowset) by covering the
    distinct case where rows parse non-empty but mis-column and are silently dropped
    — the silent skip masks a parse defect and fabricates an unsupported outcome.'
  status: active
