- agents_md_anchor: '#important-things > availability'
  content: When the answer_template needs both an aggregate total and row-derived
    refs, compute the total by summing the parsed detail rows in code and gate OUTCOME
    solely on the presence of those detail rows; do not issue a separate SQL aggregate
    (e.g. COALESCE(SUM(...),0)) and fold its rowset into the NONE gate, because a
    COALESCE aggregate always returns one row while any parse hiccup on the detail
    query independently empties it, and OR-ing the two emptiness checks collapses
    a valid OUTCOME_OK into OUTCOME_NONE_UNSUPPORTED.
  created: '2026-06-06'
  deactivated_reason: null
  id: r005
  reasoning: 'Verbatim error: ''grader: expected outcome OUTCOME_OK, got OUTCOME_NONE_UNSUPPORTED''.
    Root cause: script runs two independent /bin/sql queries (store detail rows +
    a separate COALESCE(SUM) total) and gates the outcome on `if not store_rows or
    not total_rows`. Vienna stores with matching available stock exist (grader expected
    OUTCOME_OK), so the answer must derive a real qty and store/product refs. The
    total query''s COALESCE(SUM,0) always emits one row, so `not total_rows` is dead;
    the effective gate is `not store_rows`. Splitting total and detail across two
    queries means the detail rowset parsing empty (header-only) zeroes the whole answer
    to NONE even when the aggregate would have data, instead of summing the same detail
    rows used for refs. Failing fragment: `if not store_rows or not total_rows: return
    vm.answer(message=..., outcome="OUTCOME_NONE_UNSUPPORTED", refs=[])`. Linkage:
    extends r003 (empty-rowset false-NONE) and r004 (parse fragility) but targets
    a distinct technique — single-rowset derivation of total+refs rather than a redundant
    aggregate query feeding the NONE gate.'
  status: active
