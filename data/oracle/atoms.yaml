  polarity: anti_pattern
- id: verify-variant-combination-scan-full-line-not-single-sku
  description: Confirming or denying that a product line contains a variant with a specific attribute
    combination requires scanning every variant and matching all attributes on one same row, not testing
    a single arbitrarily-picked SKU.
  domain:
  - catalogue-verification
  - sql
  - product-data
  - data-validation
  content: 'When verifying whether a product line includes a variant with a precise multi-attribute combination
    (e.g. type + diameter + length), do NOT select one representative base record with `LIMIT 1` and test
    only its properties. Absence of the combination on one arbitrary SKU is NOT absence across the whole
    line, so that shortcut yields a wrong verdict. Correct method: (1) restrict to the full set of candidate
    variants in the line; (2) for existence, require that ONE SAME variant row satisfies ALL attribute
    predicates simultaneously (logical AND across attributes within a single SKU, OR across SKUs) — never
    let matches for different attributes come from different rows; (3) keep attribute predicates tight
    (exact numeric/normalized text match) so a loose per-attribute filter cannot falsely report presence;
    (4) return the absent/NO verdict only after exhaustively checking all variants, and emit the exact
    verdict token the consumer/grader expects (e.g. the literal `<NO>` marker, not just the word). Note:
    per-SKU `MAX(CASE...)` aggregation is only valid once the query already spans the full candidate set;
    pairing it with `LIMIT 1` collapses the search and corrupts the result.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
  embedding_hash: d804072be60e8ea8e46590c1451fbb97aa911fe9c36cb6bad31c2d7ba1229250
  source_task: t05
  polarity: anti_pattern
- id: verify-multi-attribute-product-claim-against-catalog
  description: Verify a multi-attribute product claim against a catalog DB and refute when no record matches
    all attributes
  domain:
  - catalog-verification
  - sql
  - claim-validation
  - eav-schema
  content: 'To confirm or refute a claim that a catalog contains a product matching several attributes
    at once (brand, series/line, model, plus typed properties like adhesive_type or color_family): build
    ONE query that ANDs every claimed attribute together so a partial match cannot pass. Normalize every
    text comparison with LOWER(TRIM(...)) on both the column and the bound claim value to neutralize case
    and whitespace. For attributes stored in an EAV side table (property_key/property_value pairs per
    SKU), match each with its own EXISTS subquery keyed on the SKU rather than a join, so multiple required
    properties compose without row multiplication. Project a stable identifier (SKU) and a normalized
    record path. Then branch strictly on result count: zero rows means the claim is unsupported — emit
    the explicit refutation token (e.g. NONE/unsupported) and cite no record; one-or-more rows means confirmed
    — cite the exact matched record (SKU + path) as the reference. A claim is refuted, not errored, when
    no row satisfies the full conjunction.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
  embedding_hash: a6f52b00304d3827c793c05b1e2211df9eef01ae803e3640cc8847be36f28a4d
