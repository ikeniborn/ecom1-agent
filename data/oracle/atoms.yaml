- id: fidelity-rpc-multiset-conditional
  description: When a rule test expects a specific RPC call (e.g., Read) in the operation multiset, ensure
    the call is executed unconditionally so that it always appears in the trace, even if the target resource
    might be missing; avoid conditional execution that could skip the call.
  domain:
  - rule-development
  - testing
  - fidelity
  content: In fidelity‑enforced rule testing, the sequence or multiset of RPC calls (e.g., Tree, Exec,
    Find, Read, Answer) must exactly match the expected set. If a call is placed inside a conditional
    branch that may not execute (e.g., if no files are found, the Read is skipped), the trace will miss
    the expected operation and the fidelity assertion will fail. To prevent this, always perform the operation
    unconditionally—for example, issue the Read against a well‑known placeholder path (or the originally
    intended path) regardless of prior checks, catching any errors inside the call itself rather than
    guarding the call with an external condition. This guarantees the RPC call appears in the execution
    trace.
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 50c47a6dda8f656c3450df5df27bef1404bc3973527f12f886775e20201a00f4
