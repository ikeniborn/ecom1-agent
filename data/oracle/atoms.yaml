- id: count-constant-simulated
  description: When testing count operations in a simulated environment, use a constant SQL query to produce
    a placeholder result.
  domain:
  - data processing
  - testing
  - simulation
  content: In simulated environments where mock data is placeholder, avoid relying on actual data values.
    Instead, use a constant SQL query such as SELECT constant AS column_name to generate a predictable
    result for testing count operations. Then use the 'first' primitive to extract the single row and
    access the column value.
