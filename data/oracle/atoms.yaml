- id: answer-refs-empty-when-sql-path-column-missing
  description: Answer-reference lists built from SQL query rows come back empty when the query returns
    no rows or when the path/identifier column is absent from the SELECT or dropped during row parsing
  domain:
  - sql
  - data-pipeline
  - citations
  - debugging
  content: 'When a routine must cite records by emitting their stored path/id as references, the refs
    are populated by reading a path column out of parsed query rows. If the final refs list is empty while
    the template expects runtime refs, the failure is upstream of the ref-building code: either (1) the
    query matched zero rows (over-restrictive filters, wrong join type, or a bind parameter that never
    substituted — verify named :param bindings actually resolve), or (2) the rows exist but the path column
    was never SELECTed, was aliased inconsistently, or the row parser dropped it (header/column-name mismatch,
    index misalignment in CSV parsing). Diagnose by confirming the SELECT explicitly returns the record-path
    column with the exact alias the parser reads, and that the WHERE/JOIN conditions return at least one
    row. Use LEFT JOIN + COALESCE to retain entities with zero related records so their paths still appear.
    General principle: empty downstream collections derived from query results point to the query or the
    row-to-dict mapping, not the collection-building loop — validate column presence and bind substitution
    at the data source first.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: e42e554701d76cceb5f916781768419f5fa4755f8f801a4c3b85b97b1e5dc7b4
  source_task: t18
- id: sql-projection-runtime-refs
  description: Ensure answer refs include per-row runtime values by returning and parsing the identifier
    column from a SQL projection
  domain:
  - sql
  - data-query
  - answer-validation
  content: 'When an answer must attach per-record runtime refs (e.g. record/file paths) drawn from a SQL
    projection, the static template refs alone are insufficient — the refs list must contain one runtime
    entry per matched row. To guarantee this: (1) the SELECT must explicitly list the identifier/path
    column, in a known column position, so row parsing can extract it; (2) if the SQL tool rejects named
    `:param` bindings, inline literals safely by escaping quotes (double single-quotes) instead of relying
    on binds, otherwise the query may error or return zero rows; (3) parse data rows by skipping the header
    line and splitting on the delimiter at the column index matching the SELECT order, guarding against
    header echoes and blank lines; (4) before answering, verify the refs list actually contains runtime
    entries — if it holds only the static template entries, the query returned no rows or parsing dropped
    the column, so re-check the WHERE filter values, the binding mechanism, and the selected columns.
    Empty result vs. parse-drop are distinct failures: confirm row count separately (a COUNT(*) aggregate
    always yields one data row) to disambiguate.'
