- id: safe_product_existence_check
  description: Method for verifying whether a product (or any record) exists in a catalogue/database while
    preventing leakage of internal identifiers or paths in the response.
  domain:
  - database
  - security
  - policy_enforcement
  content: "When you need to confirm the presence of a specific product:\n1. Formulate a query that returns\
    \ only a boolean or count, e.g., `SELECT EXISTS(SELECT 1 FROM product_variants WHERE brand = ? AND\
    \ product_name ILIKE ? AND series ILIKE ? AND properties ILIKE ?);` or `SELECT COUNT(*) FROM product_variants\
    \ WHERE …;`.\n2. Execute the query and capture the result in a scalar variable (e.g., `found`).\n\
    3. Do **not** bind or expose any raw record identifiers, paths, or other internal data to the answer\
    \ payload.\n4. Map the scalar result to a generic outcome:\n   - If `found` is true (or count > 0)\
    \ → return a success message such as \"Product found\" with `OUTCOME_OK`.\n   - If `found` is false\
    \ (or count = 0) → return a generic failure message such as \"Product not found\" with `OUTCOME_DENIED_SECURITY`\
    \ (or another appropriate denial outcome).\n5. Reference only policy documentation or non‑sensitive\
    \ metadata in the response; omit any fields that could reveal internal storage details.\n6. Ensure\
    \ the decision logic uses a simple non‑empty check on the boolean/count result rather than inspecting\
    \ bound record paths.\n\nBy following these steps you satisfy the security policy that forbids exposing\
    \ internal catalogue paths while still providing the required existence check."
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
