- id: cite-fraud-payment
  description: When investigating a fraud payment, cite the payment identifier to ensure proper verification
    and successful outcome.
  domain:
  - fraud detection
  - payment processing
  content: In a fraud payment investigation, the investigation lessons must include a citation of the
    payment ID. This action is required for the decision to default to 'ok' and the answer to return 'OUTCOME_OK',
    confirming the fraud case is properly handled.
