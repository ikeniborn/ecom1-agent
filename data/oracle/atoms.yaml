- id: sql-count-distinct-parent-over-child
  description: Using COUNT(*) over a child or variant table overcounts parent entities; use COUNT(DISTINCT
    parent_key) when the requirement is to count distinct parents.
  domain:
  - sql
  - database
  - aggregation
  content: When a query must return the number of distinct parent entities but is executed against a child
    or variant table, use COUNT(DISTINCT parent_foreign_key_column) rather than COUNT(*). Counting all
    rows in the child table inflates the result when a single parent has multiple associated child records,
    whereas counting distinct parent identifiers yields an accurate parent-level total.
