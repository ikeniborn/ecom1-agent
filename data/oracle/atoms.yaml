  - decision logic
  content: When querying for fraudulent payment records based on 3DS failure indicators (e.g., status='failed'
    or failure_reason not null), ensure the query conditions match the actual data schema and that the
    data source (e.g., archived payments) contains the expected records. Use a count of matching rows
