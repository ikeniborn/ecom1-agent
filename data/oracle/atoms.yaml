- id: sql-cli-no-named-bindings-inline-literals-and-select-ref-column
  description: When a SQL CLI tool rejects named parameter bindings, inline values as escaped quoted literals
    and always SELECT the row-identifier/path column so runtime refs can be populated; empty refs signal
    zero rows or a dropped path column.
  domain:
  - sql
  - data-query
  - tooling
  - answer-refs
  content: 'Some SQL execution tools (e.g. a /bin/sql CLI) do not accept `:name` parameter bindings. In
    that case, build the query by interpolating values as SQL string literals, escaping each value by
    doubling single quotes (`v.replace("''", "''''")`) to prevent injection and syntax errors. When the
    answer/verification layer requires runtime reference paths (refs) derived from results, the SELECT
    clause MUST explicitly include the row''s identifier/path column (e.g. a record_path), and the row-parsing
    code must map it by header name into each result record. An empty refs list when rows were expected
    has two likely causes: (1) the query genuinely matched no rows, or (2) the path column was omitted
    from SELECT or dropped during CSV/row parsing. Diagnose by verifying the SELECT column list contains
    the path column, confirming the binding/quoting style the tool actually supports, and checking the
    header-to-field mapping. Only emit empty refs for a true no-match (negative) answer; for positive
    answers, refs must carry the matched rows'' identifier paths.'
