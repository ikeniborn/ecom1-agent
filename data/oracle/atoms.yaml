- id: vm-script-fidelity-sequence
  description: Ensure a fixed, unconditional sequence of VM API calls to satisfy fidelity test assertions.
  domain:
  - coding
  - testing
  - fidelity
  content: 'When building scripts that interact with a virtual machine and must pass fidelity checks that
    verify the exact sequence of RPC calls, always invoke the required API functions in a deterministic
    order, even if data is missing or the calls would normally be skipped. For example, to match an expected
    trace of Tree, List, Read, Exec(id), Exec(sql), Answer, structure the script to:

    1. Always call vm.tree() first.

    2. Always call vm.list() to retrieve a path.

    3. Always call vm.read() on that path (or a dummy path) – do not skip because of empty or null data.

    4. Always perform at least one vm.exec() for system info (e.g., /bin/id).

    5. Always perform at least one vm.exec() for SQL, even if the item list is empty (use a safe no-op
    query).

    6. Finally, call vm.answer().

    This unconditional ordering prevents fidelity drift (missing calls in the trace) when data availability
    changes.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
