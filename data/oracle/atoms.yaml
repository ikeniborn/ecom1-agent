- id: sql-result-refs-empty-check-columns-and-bindings
  description: When answer/output refs derived from SQL query stdout come back empty, diagnose by checking
    SELECT columns and parameter bindings, not the downstream logic
  domain:
  - sql
  - data-parsing
  - agent-tooling
  content: 'When a script populates result references (paths/ids) by parsing the stdout of a SQL CLI tool
    and the refs end up empty while the template/contract expects runtime values, the fault is almost
    always upstream of the parser. Check, in order: (1) the SELECT projects the exact column being parsed
    (a JOIN/CTE or DISTINCT can drop or rename it); (2) WHERE/JOIN predicates actually matched rows —
    overly strict equality on typed property columns (text vs number, CAST mismatches) or wrong filter
    values yield zero rows that look identical to a parse failure; (3) the stdout parser splits on the
    delimiter the tool truly emits (header row, NULL markers, column separator | vs ,) and tolerates the
    row format; (4) value substitution uses the tool''s named-binding mechanism (`:name`) instead of hand-rolled
    string interpolation with manual quote-escaping, which is injection-prone and silently corrupts values
    containing separators or quotes. Distinguish ''zero rows'' from ''parser dropped column'' by logging
    raw stdout before parsing: a non-empty stdout with empty parsed refs means parser/column-name mismatch;
    empty stdout means the query returned nothing (fix predicates/bindings). Prefer parameterized bindings
    and an explicit, named SELECT projection so the ref column is guaranteed present and correctly typed.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 2ff174cad4f63634e71f03ce57f348358a8fd2b0c93e4cb662e8c8b6c8b7d261
  source_task: ''
- id: sql-runtime-refs-empty-check-select-and-parser
  description: When an answer requires runtime reference values pulled from query results but the collected
    refs come back empty, diagnose the SELECT column list, the row parser, and named-parameter bindings
    rather than the downstream logic.
  domain:
  - sql
  - data-parsing
  - validation
  - query-results
  content: 'If a task must emit runtime references (record paths, ids, keys) that originate from query
    rows, but the final ref set is empty while only static template entries remain, the failure is almost
    always upstream at data acquisition — not in the answer assembly. Check three things in order: (1)
    the SELECT actually projects the column whose value becomes the ref (a missing or aliased column yields
    nothing to extract); (2) the row parser preserves that column — delimiter detection, header/column
    alignment, and trimming can silently drop or shift a field, especially when output format (CSV vs
    pipe vs tab vs single-column) is auto-guessed; (3) named/`:name` parameter bindings and join/filter
    predicates are correct so the query returns rows at all (a zero-row result and a dropped-column result
    both surface as empty refs). Distinguish ''query returned no rows'' from ''rows returned but column
    lost'' by logging the raw stdout and the parsed header before extraction. General rule: when extracted
    values are empty, verify the data exists and survives each transformation stage (query → raw output
    → parse → extract) before suspecting the consumer.'
  source: distilled
