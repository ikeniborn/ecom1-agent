- id: rpc-multiset-must-match-intent-semantics
  description: Fidelity checks compare the multiset of RPC calls a script emits against the calls the
    intent implies; pick RPC primitives whose semantics match the operation, not a structurally convenient
    traversal.
  domain:
  - vm-scripting
  - rpc-fidelity
  - intent-mapping
  content: 'When a script''s correctness is validated by an RPC-multiset fidelity check, the assertion
    compares the set/count of RPC primitives actually invoked against those expected for the intent. Choose
    RPCs by operation semantics: an aggregation/counting intent maps to a compute/query RPC plus a result-return
    RPC (e.g. Exec + Answer), NOT a structure-listing/traversal RPC (e.g. Tree). A Tree/list call enumerates
    nodes but never computes or returns an aggregate, so it produces the wrong RPC multiset and fails
    fidelity even if it ''touches'' the right data. Method: (1) classify the intent''s operation (count/aggregate
    vs list/traverse vs mutate vs read-one); (2) emit only the RPCs that primitive operation requires;
    (3) ensure a result-return RPC is present when the intent expects an answer. Side note: a Pydantic
    field named ''schema'' triggers a ''shadows an attribute in parent BaseModel'' UserWarning — rename
    the field; this warning is noise and not the fidelity failure.'
