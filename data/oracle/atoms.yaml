- id: normalize-directory-listing
  description: Normalize a directory listing API response that may return a list or a dict, and each entry
    may be a plain filename string or a metadata dict. Output a uniform list of dicts with keys name,
    path, kind.
  domain:
  - file-system
  - api-integration
  - defensive-programming
  content: "def normalize_dir_listing(listing_result, base_directory=''):\n    \"\"\"Convert various directory\
    \ listing formats to a list of uniform entries.\n    Handles:\n    - listing_result as a list (of\
    \ strings or dicts) or a dict with 'entries'/'items'/'files'.\n    - entry as a string (filename)\
    \ or a dict with keys 'name', 'path', 'kind'.\n    Returns list of dicts with 'name', 'path', 'kind'.\
    \ Path is constructed if missing.\n    \"\"\"\n    # Step 1: Normalize outer structure to list\n \
    \   if isinstance(listing_result, list):\n        entries = listing_result\n    elif isinstance(listing_result,\
    \ dict):\n        for key in ['entries', 'items', 'files']:\n            if key in listing_result:\n\
    \                entries = listing_result[key]\n                break\n        else:\n           \
    \ entries = []\n    else:\n        entries = []\n\n    # Step 2: Normalize each entry to a dict\n\
    \    normalized = []\n    for e in entries:\n        if isinstance(e, str):\n            name = e\n\
    \            entry = {'name': name, 'path': f\"{base_directory}/{name}\" if base_directory else name,\
    \ 'kind': ''}\n        elif isinstance(e, dict):\n            entry = {\n                'name': e.get('name',\
    \ ''),\n                'path': e.get('path', ''),\n                'kind': e.get('kind', '')\n  \
    \          }\n            if not entry['path'] and entry['name']:\n                entry['path'] =\
    \ f\"{base_directory}/{entry['name']}\" if base_directory else entry['name']\n        else:\n    \
    \        continue\n        normalized.append(entry)\n    return normalized"
  source: distilled
