- id: safe-record-reference-in-answer
  description: Method to safely include a record reference in an answer by extracting the path from a
    query result and handling empty results to avoid missing required references.
  domain:
  - data-access
  - answer-construction
  content: When constructing an answer that must include a reference to a specific record (e.g., a basket),
    first query for the record to obtain its `record_path`. Use the `first` primitive to get the first
    row from the query result, then `column` to extract the `record_path` field. Before adding the reference
    to the answer's `refs` array, verify that the extracted path is not null. If the path is null (no
    record found), either omit the reference or provide a fallback reference (e.g., a generic policy doc).
    If the path is valid, include it in the `refs` array as `{"kind":"record","path":"$extracted_path","source":null}`.
    This ensures the answer always contains the required reference when a record exists, and avoids missing-reference
    errors when no record is found.
