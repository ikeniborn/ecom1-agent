- id: atom-unsupported-check
  description: Before aggregating data across entities, verify existence of both primary entity and related
    entities; if either is missing, return unsupported outcome.
  domain:
  - data-retrieval
  - sql
  - decision-logic
  content: When performing a cross-entity aggregation (e.g., summing inventory for a product across stores),
    first query the primary entity (product) and the related entities (stores) separately. If either query
    returns zero rows, the operation is unsupported and should return an appropriate outcome (e.g., OUTCOME_NONE_UNSUPPORTED)
    rather than attempting the aggregation. This avoids misleading results or errors due to missing data.
  source: distilled
