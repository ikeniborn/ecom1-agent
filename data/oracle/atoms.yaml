  content: 'A fidelity test asserts that the multiset of RPC operations a generated script emits equals
    the expected set for the given intent; mismatched operations raise ''fidelity drift (RPC multiset)''
    even when the script runs without crashing. When an intent calls for an aggregate/count/answer query,
