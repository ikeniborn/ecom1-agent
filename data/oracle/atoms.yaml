- id: count_available_products_by_kind
  description: Count distinct product SKUs of a specified product kind that are available in inventory
    for a given location or store.
  domain:
  - SQL
  - Inventory Management
  - Product Catalog
  content: "Use a two‑step Common Table Expression (CTE) approach:\n\n1. **Target SKUs** – Select distinct\
    \ SKUs from the product catalog that match the desired product kind.\n   ```sql\n   WITH target_skus\
    \ AS (\n     SELECT DISTINCT pv.product_sku\n     FROM product_variants pv\n     JOIN product_kinds\
    \ pk ON pv.product_kind_id = pk.product_kind_id\n     WHERE pk.product_kind_name = :product_kind_name\n\
    \   )\n   ```\n\n2. **Available Inventory** – Identify SKUs that are in stock at the desired location(s)\
    \ and meet any availability criteria (e.g., store open, quantity > 0).\n   ```sql\n   , available_inventory\
    \ AS (\n     SELECT si.product_sku\n     FROM store_inventory si\n     JOIN stores s ON si.store_id\
    \ = s.store_id\n     WHERE s.city = :city\n       AND s.is_open = 1\n       AND si.available_today_quantity\
    \ > 0\n   )\n   ```\n\n3. **Count** – Count the distinct SKUs that appear in both sets.\n   ```sql\n\
    \   SELECT COUNT(*) AS count\n   FROM target_skus ts\n   WHERE EXISTS (\n     SELECT 1 FROM available_inventory\
    \ ai\n     WHERE ai.product_sku = ts.product_sku\n   );\n   ```\n\nReplace `:product_kind_name` and\
    \ `:city` with the desired values. This pattern can be adapted to other dimensions (e.g., region,\
    \ warehouse) by adjusting the inventory CTE."
  source: distilled
