  polarity: anti_pattern
- id: scalar-count-from-filtered-sql
  description: Retrieve a scalar count from a database by executing an aggregated SQL query with a filter
    condition, extracting the single result value, and returning it.
  domain:
  - database
  - sql
  - data-retrieval
