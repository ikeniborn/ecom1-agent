  - fidelity-testing
  - code-generation
  content: 'Fidelity tests compare the multiset of RPC calls a script emits against an expected multiset
    for the given intent. When the intent is to count or aggregate items, the script must perform an execution/computation
    RPC (e.g. Exec) to derive the value and a result RPC (e.g. Answer) to return it. Calling a structure-traversal
    RPC (e.g. Tree) only enumerates a hierarchy — it neither computes the count nor returns an answer,
    so the produced RPC multiset diverges from the expected one and triggers ''fidelity drift (RPC multiset)''.
    General rule: choose RPCs by what the intent demands as output (a returned scalar/answer) and the
    operation needed to produce it (compute), not by what merely surfaces data. Match the RPC verbs to
    intent semantics — counting => execute then answer, listing/navigation => traverse.'
