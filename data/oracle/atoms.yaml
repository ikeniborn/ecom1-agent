- id: sql-count-available-skus-by-kind-and-location
  description: Count distinct product SKUs of a given product kind that are available in open stores of
    a specific city.
  domain:
  - SQL
  - Data Retrieval
  - Inventory Management
  content: "Use Common Table Expressions (CTEs) to first select distinct product SKUs from `product_variants`\
    \ joined with `product_kinds` filtered by a placeholder `{{product_kind_name}}`. Then create a second\
    \ CTE selecting SKUs from `store_inventory` joined with `stores` filtered by `{{city}}`, `stores.is_open\
    \ = 1`, and `available_today_quantity > 0`. Finally, count the rows where the SKU from the first CTE\
    \ exists in the second CTE:\n```\nWITH target_skus AS (\n  SELECT DISTINCT pv.product_sku\n  FROM\
    \ product_variants pv\n  JOIN product_kinds pk ON pv.product_kind_id = pk.product_kind_id\n  WHERE\
    \ pk.product_kind_name = '{{product_kind_name}}'\n),\nlocation_inventory AS (\n  SELECT si.product_sku\n\
    \  FROM store_inventory si\n  JOIN stores s ON si.store_id = s.store_id\n  WHERE s.city = '{{city}}'\
    \ AND s.is_open = 1 AND si.available_today_quantity > 0\n)\nSELECT COUNT(*) AS count\nFROM target_skus\
    \ ts\nWHERE EXISTS (\n  SELECT 1 FROM location_inventory li WHERE li.product_sku = ts.product_sku\n\
    );\n```"
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
  embedding_hash: b1a2ceef0fd6ea6d27563d621dc64f5d32ec981e0ad141130d60f03579196097
  source_task: t10
  polarity: anti_pattern
- id: count_available_products_by_kind
  description: Count distinct product SKUs of a specified product kind that are available in inventory
    for a given location or store.
  domain:
  - SQL
  - Inventory Management
  - Product Catalog
  content: "Use a two‑step Common Table Expression (CTE) approach:\n\n1. **Target SKUs** – Select distinct\
    \ SKUs from the product catalog that match the desired product kind.\n   ```sql\n   WITH target_skus\
    \ AS (\n     SELECT DISTINCT pv.product_sku\n     FROM product_variants pv\n     JOIN product_kinds\
    \ pk ON pv.product_kind_id = pk.product_kind_id\n     WHERE pk.product_kind_name = :product_kind_name\n\
    \   )\n   ```\n\n2. **Available Inventory** – Identify SKUs that are in stock at the desired location(s)\
    \ and meet any availability criteria (e.g., store open, quantity > 0).\n   ```sql\n   , available_inventory\
    \ AS (\n     SELECT si.product_sku\n     FROM store_inventory si\n     JOIN stores s ON si.store_id\
    \ = s.store_id\n     WHERE s.city = :city\n       AND s.is_open = 1\n       AND si.available_today_quantity\
    \ > 0\n   )\n   ```\n\n3. **Count** – Count the distinct SKUs that appear in both sets.\n   ```sql\n\
    \   SELECT COUNT(*) AS count\n   FROM target_skus ts\n   WHERE EXISTS (\n     SELECT 1 FROM available_inventory\
    \ ai\n     WHERE ai.product_sku = ts.product_sku\n   );\n   ```\n\nReplace `:product_kind_name` and\
    \ `:city` with the desired values. This pattern can be adapted to other dimensions (e.g., region,\
    \ warehouse) by adjusting the inventory CTE."
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
