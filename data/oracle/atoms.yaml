- id: answer-refs-require-live-row-evidence-not-static-template-refs
  description: When an answer must cite per-row evidence references, the query must actually return rows
    and the parser must extract the reference column; zero rows or a dropped column collapses refs to
    static-only and fails runtime-ref constraints.
  domain:
  - sql
  - data-retrieval
  - answer-validation
  - parameter-binding
  content: 'If an answer contract requires runtime references (one ref per matching record) but the produced
    refs contain only static template/literal entries, the row query returned no rows OR the row parser
    dropped the reference column. Diagnose in this order: (1) Confirm the SELECT explicitly lists the
    reference/identifier column — never rely on it surviving a generic split. (2) Confirm the WHERE filter
    actually matches rows; run a COUNT(*) with the same predicate and compare to the number of parsed
    refs — mismatch means parsing loss, zero means filter/data problem. (3) Verify parameter binding:
    some SQL runners do not resolve named binds (`:name`); when a runner ignores binds, values silently
    become NULL and the predicate matches nothing. Use confirmed-working binds, or fall back to safely
    escaped inline literals (double single-quotes). General rule: derive evidence refs from the live result
    set, validate count against an independent aggregate, and treat a refs list equal to the static seed
    as a failure signal, not success.'
