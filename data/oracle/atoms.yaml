- id: sql-answer-provenance-refs-require-path-column
  description: When an answer must carry runtime provenance refs, the SQL SELECT must explicitly include
    the identifier/path column and row-parsing must preserve it; empty refs signal a missing column or
    dropped parse, not absent data.
  domain:
  - sql
  - data-provenance
  - answer-validation
  content: 'If a task''s answer schema requires runtime reference values (e.g. record paths/ids) drawn
    from query results, the failure mode ''required runtime refs but actual refs empty'' almost always
    means the data path broke, not that the dataset is empty. Diagnose in this order: (1) Confirm the
    SELECT column list explicitly includes the identifier/path column needed for the ref — aggregate or
    filtered queries often omit it. (2) Verify parameter bindings ('':name'' placeholders) are actually
    substituted, since unbound predicates can silently return zero rows. (3) Check the row parser: header-detection
    that strips the first line, delimiter splitting (pipe vs comma), and column-index assumptions can
    drop the path field even when rows are returned. (4) Distinguish ''no rows matched'' (predicate too
    strict) from ''rows matched but path column not captured'' by re-running with a minimal SELECT that
    returns only the id/path. General rule: provenance columns must survive every transform stage from
    query to final answer object; never assume the ref column rides along implicitly.'
