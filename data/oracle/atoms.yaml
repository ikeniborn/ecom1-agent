- id: rpc-fidelity-match-expected-call-multiset
  description: Counting/aggregation queries must emit the data-operation RPC calls the fidelity test expects,
    not a structural traversal
  domain:
  - vm-scripting
  - rpc
  - testing
  content: 'A fidelity test validates the exact multiset of RPC calls a VM script emits, not just the
    final value. To answer a query that computes or counts over data, emit the data-path operations the
    harness expects (e.g. an execute step followed by an answer/return step) rather than substituting
    a structural primitive like a full tree/directory traversal. A tree listing gathers nodes but is the
    wrong primitive for aggregation: it produces a different call multiset and fails with ''fidelity drift
    (RPC multiset)'' even when it could technically reach the data. Map each intent to the operation pair
    the spec records, then verify the emitted call set equals the expected set before returning.'
