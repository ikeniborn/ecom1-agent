- id: sql-answer-refs-empty-diagnosis
  description: When an answer requires runtime references sourced from query output but the validated
    refs come back empty, diagnose the query rather than the validator
  domain:
  - sql
  - data-validation
  - debugging
  content: 'When a task''s answer must carry runtime reference values (ids, paths, record locators) extracted
    from query results, and the post-check reports those refs are empty/missing while only static template
    refs remain, the failure is almost always upstream in the query, not the validator. Check three things
    in order: (1) the SELECT projection actually includes the reference column the validator reads — a
    column dropped from SELECT or renamed away from the expected alias yields rows with no ref; (2) parameter/named
    bindings are populated correctly so filters are not silently comparing against empty/null literals;
    (3) the query returns any rows at all — chained INNER JOINs, EXISTS subqueries, or WHERE predicates
    that are too strict (especially case- or whitespace-sensitive equality on free-text columns) can eliminate
    all rows. Mitigate text-match fragility by normalizing both sides with LOWER(TRIM(...)) and matching
    numeric values against both the numeric column and its text cast. Verify by running the query standalone
    and confirming both row count > 0 and presence of the reference column before trusting the validator''s
    report.'
