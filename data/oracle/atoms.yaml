- id: fidelity-rpc-multiset-match-intent
  description: Script RPC calls must match the expected RPC multiset for the intent; counting/aggregation
    intents need compute+answer ops, not tree traversal
  domain:
  - agent-orchestration
  - fidelity-testing
  - rpc
  content: 'Fidelity tests assert the multiset of RPC calls a script emits equals the expected set for
    the given intent. A drift error (''expected: [...] got: [...]'') means the script used wrong primitives.
    To fix: read the expected RPC list, then rewrite the script to emit exactly those ops. For aggregation/counting
    intents, use a compute/exec op plus an answer op to return the count — do NOT use a tree/list traversal
    primitive, which only enumerates structure and emits the wrong RPC. Map each intent verb to its primitive:
    count/sum→exec+answer, navigate/inspect→tree. Ignore unrelated pydantic warnings (e.g. field name
