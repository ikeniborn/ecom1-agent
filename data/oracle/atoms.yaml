  content: 'To confirm whether a catalogue contains an entity variant with a set of claimed attributes:
    (1) Locate the base entity first via case-insensitive, trimmed, LIKE-based fuzzy matching across several
    identifying columns (brand, series, model, name) so wording differences don''t cause false negatives.
