- id: fidelity-drift-stub-detection
  description: Detect and prevent fidelity drift where a script's implementation fails to realize its
    stated intent
  domain:
  - code-quality
  - verification
  - code-generation
  content: 'Fidelity drift occurs when generated or edited code diverges from the declared intent — most
    starkly when the body is a no-op stub (e.g. a function that only contains `pass` or `return`). Before
    accepting a script as complete, cross-check the implementation against the intent: every stated goal
    must map to executable logic that produces an observable effect. Treat empty bodies, unreachable returns,
    and placeholder stubs as drift signals, not finished work. Verify by defining a success criterion
    from the intent and confirming the code satisfies it, rather than trusting that a syntactically valid
    script does what it claims.'
  source: distilled
