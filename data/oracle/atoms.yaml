- id: verify-eav-variant-presence-with-normalized-matching-and-fallback-citation
  description: Verify presence/absence of a record matching parent attributes plus multiple key-value
    (EAV) property constraints, always citing a concrete checked record
  domain:
  - sql
  - data-verification
  - eav-schema
  - catalogue-query
  content: 'To verify whether a catalogue/EAV-backed store contains a record matching both header attributes
    (on the main row) and several dynamic properties (in a child key-value table), build a two-tier query:
    (1) a `base` CTE that filters the main table by the header attributes, normalizing every comparison
    with `LOWER(TRIM(...))` on both column and literal so casing/whitespace never causes false negatives,
    and using `LIKE ''%...%''` for substring/name matches. (2) A `matched` CTE that keeps only base rows
    where one `EXISTS` subquery holds per required property — each subquery hitting the child properties
    table on the foreign key, normalizing the property KEY (also `REPLACE(key,''_'','' '')` and an `IN
    (...)` set of synonym spellings like ''screw type''/''screwtype'' to absorb naming drift) and the
    property VALUE with the same `LOWER(TRIM)`. Decide present vs absent from `(SELECT COUNT(*) FROM matched)`.
    Critically, always surface a citable record even on absence: `COALESCE((SELECT id FROM matched LIMIT
    1), (SELECT id FROM base ORDER BY rank, id LIMIT 1))`, where `rank` is a CASE flag (0 if the row satisfies
    the primary discriminating property, else 1) so the fallback cites the closest near-miss. This guarantees
    the verdict (FOUND/NOT FOUND with outcome OK) is backed by an exact SKU/record path regardless of
    branch. General principles: normalize before comparing; treat each constraint as an independent EXISTS
    rather than a join (avoids row multiplication and cardinality bugs); rank-and-COALESCE to always return
    evidence; both branches are a successful verification, not an error.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: a2ea92ef760e98f34303e7547b969b2bcaaa1f4694389d2a97316c5684b432ff
