  - decision_logic
  content: When defining a decision with branches and a default label, always include an answer mapping
    for every possible label, including the default. If a label is not explicitly mapped, the system may
    return OUTCOME_NONE_CLARIFICATION instead of the intended outcome, causing unexpected behavior. For
    example, if a decision has a 'not_found' default label, map it to an appropriate outcome such as OUTCOME_NONE_UNSUPPORTED
