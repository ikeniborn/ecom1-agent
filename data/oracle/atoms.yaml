- id: catalog-product-existence-check
  description: Reusable pattern for safely determining whether a product variant exists in a catalog using
    a SQL query and returning a generic success/failure outcome without exposing sensitive record identifiers.
  domain:
  - SQL
  - catalog-management
  - product-lookup
  - security‑aware‑responses
  content: "### Overview\nA generic, security‑conscious method to verify the presence of a product variant\
    \ in a catalog. The method runs a parameterised SQL query, extracts the primary key (or any unique\
    \ identifier) if any rows are returned, and maps the result to a high‑level outcome (`OUTCOME_OK`\
    \ for found, `OUTCOME_NOT_FOUND` for missing). No raw identifiers are exposed in the response.\n\n\
    ### Steps\n1. **Define Query Parameters**\n   ```sql\n   SELECT unique_id\n   FROM product_variants\n\
    \   WHERE brand = :brand\n     AND product_name ILIKE :product_name_pattern\n     AND line_name =\
    \ :line_name\n     AND cleaner_type = :cleaner_type;\n   ```\n   *Use named parameters (`:param`)\
    \ to avoid SQL injection.*\n\n2. **Execute Query**\n   - Use a safe execution primitive (e.g., `Exec`\
    \ RPC) that accepts the query and a map of parameter values.\n   - Capture the result set in a temporary\
    \ binding (e.g., `sql_output`).\n\n3. **Parse Result Set**\n   - Convert the raw output to a structured\
    \ rowset (auto‑delimited or JSON).\n   - Extract the column containing the unique identifier into\
    \ a list, e.g., `product_ids`.\n\n4. **Determine Existence**\n   - If `product_ids` is non‑empty →\
    \ set `found = true`.\n   - Otherwise → `found = false`.\n\n5. **Map to Outcome**\n   ```json\n  \
    \ {\n     \"found\": {\n       \"message\": \"Product exists.\",\n       \"outcome\": \"OUTCOME_OK\"\
    \n     },\n     \"not_found\": {\n       \"message\": \"Product not found.\",\n       \"outcome\"\
    : \"OUTCOME_NOT_FOUND\"\n     }\n   }\n   ```\n   *Never include the raw identifier (`unique_id`)\
    \ in the public message; keep it internal if needed for downstream processing.*\n\n6. **Return Decision**\n\
    \   - Use a decision block that branches on the boolean `found` value.\n   - The default branch should\
    \ be the `not_found` case.\n\n### Pseudocode Example\n```json\n{\n  \"discovery\": [\n    {\n    \
    \  \"rpc\": \"Exec\",\n      \"args\": {\n        \"path\": \"/bin/sql\",\n        \"stdin\": \"SELECT\
    \ unique_id FROM product_variants WHERE brand = :brand AND product_name ILIKE :name_pat AND line_name\
    \ = :line AND cleaner_type = :type;\",\n        \"params\": {\n          \"brand\": \"<BRAND>\",\n\
    \          \"name_pat\": \"%<PRODUCT_NAME>%\",\n          \"line\": \"<LINE_NAME>\",\n          \"\
    type\": \"<CLEANER_TYPE>\"\n        }\n      },\n      \"bind\": \"sql_output\"\n    }\n  ],\n  \"\
    rowsets\": [\n    {\n      \"from_\": \"sql_output\",\n      \"format\": \"auto_delim\",\n      \"\
    into\": \"product\",\n      \"columns\": [{\"into\": \"unique_id\", \"candidates\": [\"unique_id\"\
    ]}]\n    }\n  ],\n  \"compute\": [\n    {\"prim\": \"column\", \"args\": [\"$product\", \"unique_id\"\
    ], \"into\": \"product_ids\"},\n    {\"prim\": \"nonempty\", \"args\": [\"$product_ids\"], \"into\"\
    : \"found\"}\n  ],\n  \"decision\": {\n    \"branches\": [\n      {\"when\": {\"op\": \"eq\", \"lhs\"\
    : \"$found\", \"rhs\": true}, \"label\": \"found\"}\n    ],\n    \"default_label\": \"not_found\"\n\
    \  },\n  \"answer\": {\n    \"found\": {\"message\": \"Product exists.\", \"outcome\": \"OUTCOME_OK\"\
    },\n    \"not_found\": {\"message\": \"Product not found.\", \"outcome\": \"OUTCOME_NOT_FOUND\"}\n\
    \  }\n}\n```\n\n### Security Considerations\n- **Parameterisation** prevents injection attacks.\n\
    - **Outcome abstraction** avoids leaking internal identifiers.\n- **Default denial** (`OUTCOME_NOT_FOUND`)\
    \ is safe; only a generic success message is emitted when a match is confirmed.\n\nThis atom can be\
    \ reused for any catalog lookup by substituting the placeholder values with the appropriate context‑specific\
    \ data."
