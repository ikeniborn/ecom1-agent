- id: atom-count-collection-items
  description: General method to count items in a collection within a script handler
  domain:
  - data-processing
  - aggregation
  - scripting
  content: To count items in a collection (e.g., baskets, records, rows), iterate or query the source
    and return an integer total rather than executing no-op or placeholder statements. A handler whose
    body only assigns constants performs no real work and will not satisfy a counting intent. Implement
    the count by deriving length from the data source (len() of a list, COUNT() in a query, or an incrementing
    accumulator over a loop), validate the source is non-null before counting, and return the numeric
    result. When an error surfaces, capture the concrete exception message instead of a generic placeholder
