    rows, isolates the first record, and surfaces a specific column value in the final answer to perform
    counts or verification checks.
  domain:
  - workflow-orchestration
  - sql
  - data-extraction
  - verification
  content: In a multi-step workflow, run a scalar SQL query via an execution node and bind the raw output
    to a variable. Convert that raw output into a rowset using automatic delimiter detection. Apply a
    'first' extraction primitive to obtain the initial record from the rowset. Finally, reference the
    desired field of that first record in the answer template (e.g., '{<record>.<field>}') to return the
    scalar value. This pattern decouples query execution from result parsing and is reusable for any count,
    sentinel, or single-value lookup.
  source: distilled
