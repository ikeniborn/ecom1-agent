- id: catalog-existence-check-definitive-answer
  description: Answer product-catalogue existence checks definitively (YES/NO) instead of escalating to
    clarification, by querying with a normalized tolerant match on the most distinctive identifier.
  domain:
  - sql
  - catalog-search
  - data-retrieval
  - agent-decision-policy
  content: 'When asked whether a catalogue contains an item matching a verbose product description, treat
    it as a deterministic lookup, not an ambiguous request — return a definitive found/absent outcome
    rather than asking for clarification. Method: (1) Extract the single most distinctive identifier from
    the description (model/SKU/series code), since brand + long marketing names rarely match column values
    verbatim. (2) Query with case-insensitive, whitespace-tolerant matching: LOWER(TRIM(col)) compared
    to the brand exactly, and LIKE ''%token%'' across all plausible identifier columns (e.g. series OR
    model) so partial/embedded codes still hit. (3) Branch on row count >= 1 → present, else absent; both
    branches resolve to the success outcome. (4) Do not require every attribute (type, dimension, finish)
    to match in SQL — over-constraining causes false ''no match'' and tempts a clarification escalation.
    A query that can be executed and counted is answerable; reserve clarification only for genuinely under-specified
    intents.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
  embedding_hash: d90db609e8bcde1d5674c3188e4984d564639e1de461147c3378836381c8ea93
