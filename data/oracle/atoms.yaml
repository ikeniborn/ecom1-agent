- id: receipt-vs-catalog-total-comparison-ocr-normalization
  description: Compare an OCR-scanned receipt's ex-VAT subtotal with a database-calculated total using
    SKU normalization to correct common OCR errors, asserting a tolerance threshold.
  domain:
  - OCR
  - receipt processing
  - database integration
  - price comparison
  content: "To compare the pre‑tax total from a noisy OCR receipt against a database‑derived sum:\n1.\
    \ List the source directory and select the first file (receipt).\n2. Read the entire file content\
    \ as text.\n3. Query the product catalogue to build a map from product SKU to unit price (in cents).\n\
    4. Normalize all SKU strings to uppercase and replace digits with visually similar letters to undo\
    \ typical OCR swaps (0→O, 1→I, 5→S, 8→B, 2→Z), ensuring the same normalization is applied to receipt\
    \ line items and catalogue keys.\n5. Parse the receipt text line‑by‑line:\n   - Use regular expressions\
    \ to extract quantities and SKU-like patterns (e.g., `ABC-1234`).\n   - Look for a subtotal line containing\
    \ keywords like 'SUB T0TAL', 'SUBTOTAL', etc., and extract its numeric value as `old_ex`.\n6. Compute\
    \ `today_ex` by summing for each parsed line item `quantity × (matched catalogue price / 100)`. Unmatched\
    \ SKUs contribute zero.\n7. Compare the absolute difference `|today_ex - old_ex|` to a predefined\
    \ tolerance (e.g., 3 EUR).\n8. Return YES if within tolerance, otherwise NO."
  source: distilled
