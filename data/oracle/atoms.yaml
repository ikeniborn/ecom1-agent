- id: grader-required-reference-tokens
  description: When a grader rejects an answer for a missing required reference, ensure the output explicitly
    emits every referenced anchor the grader checks for
  domain:
  - grading
  - validation
  - output-contract
  content: 'Automated graders often assert that the answer string contains specific reference tokens (named
    anchors, expected keys, or identifiers from the rubric). An error of the form ''answer missing required
    reference'' means the produced output omitted a token the grader scans for, not that the computation
    is wrong. A no-op or stub implementation (e.g. a function body that only passes) will always fail
    such a check because it emits nothing. Method: (1) read the grader to enumerate the exact reference
    tokens it requires and how it matches them (substring, regex, structured field); (2) make the run
    function actually compute and write the result; (3) include each required reference verbatim in the
    emitted answer, in the format the grader expects; (4) re-run against the grader to confirm no reference
    is missing. Treat the set of required references as part of the output contract, distinct from the
    correctness of the underlying values.'
