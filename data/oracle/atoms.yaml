- id: count_via_sql_first_row
  description: Count records by executing a SQL query that returns a single count value, then extracting
    the first row's column.
  domain:
  - data extraction
  - counting
  - SQL
  content: To count records, execute a SQL query that returns the count as a single column (e.g., SELECT
    COUNT(*) AS cnt FROM table), then extract the first row's value from the result set. This pattern
    is useful when the count is needed as a single numeric value.
  source: distilled
