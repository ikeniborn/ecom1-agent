  content: In RPC fidelity tests that verify the multiset of event tags produced by a VM call, structural
    or introspection methods emit only structural tags (e.g., Tree). Operational tasks requiring results
    and side-effects must use operational methods (e.g., query or command execution) to generate the corresponding
    execution tags (e.g., Answer, Exec). Using a structural method for an operational intent causes fidelity
    drift because the emitted multiset will contain an unexpected structural tag and lack the required
    operational tags.
