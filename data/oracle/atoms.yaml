- id: rpc-multiset-match-intent-semantics
  description: Generated harness scripts must emit the operation/RPC multiset the intent semantically
    requires, not a superficially related op
  domain:
  - code-generation
  - testing
  - rpc-fidelity
  content: 'When a harness validates a generated VM/RPC script by comparing its emitted operation multiset
    against an expected set (a ''fidelity'' check), choose operations from the intent''s semantics, not
    from surface keywords. Aggregation/counting intents (''count X'', ''how many'', ''sum'') require an
    execute-then-answer pattern: run a query or aggregation op, then emit an answer op. Structural traversal
    ops (tree/walk/list-children) do not satisfy a count intent — they return structure, not a computed
    scalar. Calling a traversal op when the expected multiset is {Exec, Answer} yields a fidelity-drift
    assertion (expected one op set, got another) even though the call itself succeeds. Map intent verbs
    to op categories before emitting: count/aggregate -> Exec + Answer; enumerate-structure -> Tree.'
