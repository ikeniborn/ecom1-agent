- id: guest-access-denial-catalogue
  description: Deny guest users access to restricted catalogue data, returning a security denial outcome.
  domain:
  - security
  - access-control
  content: 'When a user with the role ''guest'' attempts to access a resource that requires authentication
    or higher privileges (e.g., catalogue data), the system must deny the request. The denial should produce
    an OUTCOME_DENIED_SECURITY outcome, include a clear message explaining the restriction (e.g., ''Access
    denied: guest users cannot access catalogue data.''), and reference the relevant security policy document.
    This rule ensures that unauthenticated or low-privilege users cannot view sensitive or restricted
    information.'
  source: distilled
