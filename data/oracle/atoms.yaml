- id: price-diff-check
  description: Method to compare total price from a receipt with current catalog prices and determine
    if the difference is within a specified threshold
  domain:
  - e-commerce
  - pricing
  - data-comparison
  content: '1. Locate receipt file (e.g., search for JSON in a designated uploads folder).

    2. Read and parse the receipt, extracting: list of items (SKU, quantity, unit net price excluding
    VAT), and optionally a pre-computed total net from the receipt.

    3. Query the product catalog (database, file, API) to get current net price (excluding VAT) per SKU.

    4. For each item, compute its net total: old_total = sum(qty * old_unit_net_price), current_total
    = sum(qty * current_unit_net_price). If a pre-computed receipt total is provided, validate against
    calculated old total; use whichever is more reliable.

    5. Calculate absolute difference: |current_total - old_total|.

    6. Check if all order items are still available in the catalog.

