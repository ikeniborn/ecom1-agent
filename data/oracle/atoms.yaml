- id: conditional-import-leads-to-unboundlocal
  description: Avoid conditional import statements; import modules at the top of the function to prevent
    UnboundLocalError.
  domain:
  - python
  - error-handling
  - best-practices
  content: When an `import` statement appears inside a conditional block (e.g., `if`, `for`) within a
    function, Python treats the imported module as a local variable. If the condition is not met and the
    code later tries to access the module, an `UnboundLocalError` is raised because the variable was never
    assigned. To avoid this, place all `import` statements at the very top of the function (or globally)
    so that the module is always available regardless of control flow.
  source: distilled
