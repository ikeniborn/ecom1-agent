- id: access_control_decision_allow_when_authorized
  description: Ensure decision logic grants access when the security policy permits and the requested
    resource exists, avoiding default denial that blocks authorized queries.
  domain:
  - security
  - access_control
  - decision_logic
  content: When constructing a decision tree for a request, first evaluate the relevant security policy
    (e.g., read the policy document and check the user's permissions). If the policy grants the required
    permission and the target resource is found (e.g., a product record path is non‑empty), route the
    flow to an explicit "allow" branch that returns the data. Only route to a "deny" branch when the policy
    explicitly forbids the action or when the resource is missing. Place the security check before any
    resource‑existence check and avoid using a generic default‑deny that could trigger for authorized
    cases.
  source: distilled
