- id: workflow-answer-ref-variable-resolution
  description: Ensure dynamic record citations in workflow answer arrays use the correct interpolation
    syntax so that variables resolve to literal values rather than being emitted as raw placeholder strings.
  domain:
  - workflow-automation
  - template-interpolation
  - answer-generation
  - citation-management
  content: In declarative workflow definitions that produce a final answer with required citations, reference
    lists (e.g., `refs`) must contain resolved literal values. If the DSL uses brace-style interpolation
    (e.g., `{results.0.record_path}`) for message templates, the same syntax must typically be used inside
    citation arrays; using an expression-style prefix (e.g., `$results.0.record_path`) inside an array
    element may be treated as a literal string, causing the emitted answer to lack the expected record
    identifier and fail grader checks for required references.
