- id: answer-runtime-refs-require-explicit-path-column-and-parsing
  description: When a query-backed answer must carry runtime reference paths, the discovery query must
    SELECT the path column explicitly and row parsing must extract it; empty refs despite a non-zero count
    signal a dropped column or diverging predicates between discovery and aggregate queries.
  domain:
  - sql
  - data-pipeline
  - answer-construction
  - result-parsing
  content: 'If an answer''s contract requires runtime refs (e.g. record paths) but the produced ref list
    is empty, do not trust a non-zero count to mask the gap. Checklist: (1) Confirm the discovery SELECT
    actually projects the path/identifier column, in a known position, and that the WHERE/JOIN predicate
    matches rows. (2) Keep the discovery query and any separate count/aggregate query using the IDENTICAL
    join and filter predicate — divergence makes count>0 while refs stay empty (or vice versa). (3) In
    delimited stdout parsing, split on the exact delimiter, skip header rows by name, and index the correct
    column; off-by-one column indexing silently drops the path. (4) Prefer parameter bindings (named/positional
    placeholders) over literal string interpolation to avoid quoting/escaping bugs that yield zero rows.
    (5) Validate post-parse: assert len(refs)==parsed_count (or count) and fail loudly if the answer requires
    refs but none were collected, rather than substituting the count for the ref list.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: dcc03e7cf730b8358af01548d06853c5b74f3a96cd2be95a90c8ca684cc3baf1
  source_task: t09
- id: most-recent-file-requires-mtime-sort-and-mandatory-read
  description: Identifying the 'most recent' file in a directory requires sorting entries by modification
    time and always performing the read; never rely on listing order or fragile file-type heuristics that
    can skip the read.
  domain:
  - filesystem
  - agent-tooling
  - rpc-fidelity
  content: 'When an intent says ''last'' or ''most recent'' file, recency is temporal: sort directory
    entries by their modification-time field (from stat/list metadata) and pick the max — do NOT treat
    the last element of the listing array as ''most recent'', since list order is unspecified. Two failure
    modes to avoid: (1) Ordering assumption — listing order may be name-sorted, inode-ordered, or arbitrary,
    so the final array element is not the newest file. (2) Over-aggressive pre-filtering — heuristics
    that classify entries as file-vs-directory (e.g. checking for a ''.'' in the name, or substring-matching
    a kind field) can drop every entry, causing an early ''nothing found'' return that silently skips
    the required read RPC. If the task''s contract expects a Read operation, the script must reach it;
    guard heuristics so they degrade to ''include'' rather than ''exclude all'', and verify the expected
    RPC multiset (Stat, List, Read, Answer) is actually emitted. Read the selected file unconditionally
    once a candidate exists.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: b935399d25925500aa2f1e6ab7e309cf2a98e9c6393dd3cbd47a615dc44b6abf
  source_task: t55
- id: find-most-recent-file-in-dir
  description: Reliably select and reference the most-recent file when asked for the 'last' file in a
    directory
  domain:
  - filesystem
  - file-selection
  - agent-tools
  content: 'To return the ''most recent'' / ''last'' file in a directory: (1) list the directory and filter
    entries to regular FILES only — never select the directory itself or a subdirectory; (2) rank by a
    real timestamp field (mtime/modified/updated), coercing to a number; pick the entry with the max timestamp.
    (3) Do NOT treat listing order as a proxy for recency — directory enumeration order is not guaranteed
    chronological, so falling back to entries[-1] can pick the wrong file and produce the wrong reference.
    If no timestamps are available, surface that ambiguity rather than guessing. (4) Resolve the chosen
    entry to its full rooted path (join with the directory path when the name is relative) and include
    that exact path in the answer''s refs, because graders/consumers match on the precise file reference.
    Read the selected file and return its contents alongside the reference.'
