    Answer (queries/results) and Exec (commands/execution). When an intent requires computation, counting,
    or state-change verification that expects an Answer/Exec RPC multiset, using structural browsing causes
    fidelity drift because the actual RPC multiset contains Tree and omits the required operational types.
    Satisfy such intents by invoking the specific query or execution primitives rather than navigating
    structure.
