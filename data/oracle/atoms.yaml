- id: noop-script-does-not-fulfill-intent
  description: A script whose body is only no-op padding (repeated effect-free assignments) does not implement
    its stated intent and must be rejected.
  domain:
  - code-generation
  - static-analysis
  - validation
  content: 'When generating or reviewing a script meant to satisfy a stated intent, verify the body contains
    logic that actually produces the requested result. A counting/aggregation intent requires iterating
    the target collection and returning a tally; a task that only repeats effect-free statements (e.g.
    assigning the same constant to a variable) computes nothing and never reads or returns a value, so
    it cannot fulfill any non-trivial intent. Treat blocks of identical no-op lines as filler: flag them,
