- id: atom_specific_entity_linking
  description: When linking records to a known entity, use specific identifiers and exact data locations
    to avoid ambiguity.
  domain: []
  content: To identify records related to a known entity (e.g., a fraud hit), always specify the unique
    identifier of that entity (e.g., case ID, payment ID) and the exact data source or archive path (e.g.,
    /archive/payments/). Avoid vague references like 'fraud hit' or 'archive' without qualification, as
    they lead to ambiguous queries and require clarification.
  source: distilled
