- id: policy_driven_product_counting
  description: Method to count products of a specific category according to a catalogue count policy by
    extracting criteria from the policy document and constructing a precise SQL query.
  domain:
  - inventory management
  - SQL
  - policy interpretation
  content: 'When counting products based on a catalogue count policy:

    1. Read the policy document to identify the exact product classification (e.g., product_kind_id),
    location (e.g., city), store status (e.g., is_open), and inventory availability conditions (e.g.,
    available_today_quantity > 0).

    2. Do not hardcode assumptions; extract these criteria dynamically from the policy text.

    3. Construct a SQL query that joins product_variants, store_inventory, and stores tables, filtering
    by the extracted classification, location, store status, and inventory condition.

    4. Use COUNT(DISTINCT product_sku) to count unique products meeting all criteria.

    5. Validate the query logic against the policy to ensure no missing or extra conditions that could
    lead to miscounts.'
