- id: sql-query-products-by-kind-brand-series-and-multi-properties
  description: SQL pattern to query products by kind, brand, series, and multiple variant properties using
    CTEs and INTERSECT
  domain:
  - sql
  - product-catalogue
  - query-pattern
  content: "To find products matching a specific kind, brand, series, and a set of variant properties\
    \ (key-value pairs), use a Common Table Expression (CTE) to resolve the kind ID from a kind table,\
    \ another CTE to find SKUs that possess all required properties by intersecting results of individual\
    \ property queries, then join the product variants table with both CTEs and filter by brand and series.\
    \ This pattern ensures that only products satisfying all given variant properties are returned. Generic\
    \ template:\n\nWITH kind AS (\n  SELECT kind_id FROM product_kinds WHERE kind_name = :kind_name\n\
    ),\nprops AS (\n  SELECT product_sku FROM variant_properties WHERE property_key = :key1 AND property_value_text\
    \ = :value1\n  INTERSECT\n  SELECT product_sku FROM variant_properties WHERE property_key = :key2\
    \ AND property_value_text = :value2\n  -- add more INTERSECT blocks for additional properties\n)\n\
    SELECT p.sku, p.name, p.record_path\nFROM product_variants p\nJOIN kind ON p.product_kind_id = kind.kind_id\n\
    JOIN props ON p.product_sku = props.product_sku\nWHERE p.brand = :brand AND p.series = :series;"
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 7f155d5c0a09013330d25572dea8ca6ca714379b2a5377727f344b75f4ce4c67
  source_task: t01
  polarity: method
- id: product-existence-check-via-sql-intersect
  description: A method to determine if a product exists in a catalog by querying a database with multiple
    variant property filters using SQL INTERSECT and counting results.
  domain:
  - database
  - product-catalog
  - sql
  content: 'To check for the existence of a product matching specific brand, series, kind, and multiple
    variant properties:

    1. Identify the product kind ID from a product_kinds table using the kind name.

    2. For each required variant property (e.g., screw_type, diameter), query the product_variant_properties
    table to get SKUs where property_key equals the desired value.

    3. Use INTERSECT to combine the SKU sets from each property filter, ensuring a product variant satisfies
    all properties simultaneously.

    4. Join the resulting SKUs with the product_variants table, filtering by brand, series, and the kind
    ID obtained in step 1.

    5. Count the resulting rows. If the count is greater than zero, the product exists; otherwise, it
    does not.'
  source: distilled
