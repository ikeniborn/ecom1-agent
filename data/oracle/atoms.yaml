- id: sql-result-refs-require-projected-path-column
  description: When a step must emit runtime references (e.g. record paths) derived from SQL output, empty
    refs mean either zero rows matched or parsing dropped the needed column — verify the SELECT projects
    the identifier/path column and the delimiter parser maps it.
  domain:
  - sql
  - data-pipelines
  - result-parsing
  - debugging
  content: 'A downstream stage that requires runtime reference values (record paths, ids) populated from
    a query will produce empty refs in two distinct cases: (1) the query matched no rows, or (2) rows
    came back but the reference column was never projected or was lost during row parsing. Diagnose before
    concluding: (a) Confirm the SELECT explicitly lists the identifier/path column you depend on — don''t
    assume it rides along. (b) Confirm named parameter bindings (e.g. :name placeholders) resolved to
    actual values, not empty strings, so the WHERE clause isn''t silently filtering everything out. (c)
    Confirm the stdout row parser detects the right delimiter from the header and indexes columns by header
    name, not fixed position, so a column shift doesn''t drop the path field. Distinguish ''no rows''
    from ''column dropped'' by counting parsed rows separately from checking the target column''s presence
    — an empty ref list with non-zero rows points at projection/parsing; zero rows points at the WHERE/binding.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
