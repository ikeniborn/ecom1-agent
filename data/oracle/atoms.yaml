- id: sql-count-available-skus-by-kind-and-location
  description: Count distinct product SKUs of a given product kind that are available in open stores of
    a specific city.
  domain:
  - SQL
  - Data Retrieval
  - Inventory Management
  content: "Use Common Table Expressions (CTEs) to first select distinct product SKUs from `product_variants`\
    \ joined with `product_kinds` filtered by a placeholder `{{product_kind_name}}`. Then create a second\
    \ CTE selecting SKUs from `store_inventory` joined with `stores` filtered by `{{city}}`, `stores.is_open\
    \ = 1`, and `available_today_quantity > 0`. Finally, count the rows where the SKU from the first CTE\
    \ exists in the second CTE:\n```\nWITH target_skus AS (\n  SELECT DISTINCT pv.product_sku\n  FROM\
    \ product_variants pv\n  JOIN product_kinds pk ON pv.product_kind_id = pk.product_kind_id\n  WHERE\
    \ pk.product_kind_name = '{{product_kind_name}}'\n),\nlocation_inventory AS (\n  SELECT si.product_sku\n\
    \  FROM store_inventory si\n  JOIN stores s ON si.store_id = s.store_id\n  WHERE s.city = '{{city}}'\
    \ AND s.is_open = 1 AND si.available_today_quantity > 0\n)\nSELECT COUNT(*) AS count\nFROM target_skus\
    \ ts\nWHERE EXISTS (\n  SELECT 1 FROM location_inventory li WHERE li.product_sku = ts.product_sku\n\
    );\n```"
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
