  polarity: anti_pattern
- id: catalog-verify-cite-base-record-path
  description: When answering existence/property-verification questions about a catalogue base product,
    always cite the canonical record file path of the base product actually examined as a reference in
    the answer
  domain:
  - data-verification
  - catalog-query
  - sql
  - grading-compliance
  content: 'A verify-then-check task (''does the catalogue stock base product X, and do claimed extra
    properties hold?'') is graded on two things: the YES/NO verdict AND the set of record references cited.
    Emit the canonical record path of the BASE product you examined as a reference for every branch —
    present, absent-of-extras, and even when no match is found if a base record was inspected. Pitfalls:
    (1) When variants fan out, do not let a property-scoring ORDER BY pick which record to cite; the grader
    expects the base product''s own record, so resolve and reference the base record deterministically
    rather than the highest-scoring variant. (2) Ensure the record-path column you surface is the actual
    filesystem/catalogue path the grader keys on (e.g. the per-record JSON path), not a synthesized or
    variant-level path. (3) A correct verdict with a missing or mismatched reference still fails grading
    (''answer missing required reference''). Always include the reference whenever a concrete record was
    checked.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
