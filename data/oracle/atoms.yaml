  - threshold logic
  content: "def format_threshold_message(token: str, diff: float, within_threshold: bool, subject: str\
    \ = 'difference', unit: str = '', threshold: float = None) -> str:\n    \"\"\"\n    Build a message\
    \ like: '<yes> The total price (excl. VAT) difference is 2.5 EUR, which is within the 3 EUR threshold.'\n\
