  - data-retrieval
  - answer-verification
  content: 'When a verification answer template requires runtime refs (e.g. one ref per matched record
    path) but the produced ref list is empty, do NOT conclude ''no match exists''. Empty runtime refs
    have two common root causes that must be ruled out before answering NO: (1) the SQL returned zero
    rows because of over-strict or wrong bindings — verify every named parameter (:name) is actually substituted
    and that filters on exact-text property values aren''t failing on case, whitespace, or synonym mismatch;
    (2) the SQL returned rows but row parsing dropped the path column — verify the SELECT list includes
    the ref/path column and that the stdout header-to-index parsing uses the correct delimiter (the table
    may emit ''|'' vs '',''), trims fields, and tolerates value-internal delimiters. General method: when
    refs come back empty, first re-run/inspect the raw query output and the parsed column map; only emit
    a NO answer when the query is confirmed correct AND parsing is confirmed lossless. Also prefer real
    parameter binding over naive string-replace of :name placeholders, since substring replacement is
    order-sensitive and unsafe.'
