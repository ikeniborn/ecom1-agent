- id: product-property-verification-normalization
  description: Ensure robust matching of product variant properties by normalizing text case and boolean
    representations to avoid false negatives.
  domain:
  - product_verification
  - sql_query
  - property_matching
  content: 'When verifying whether a product variant possesses specific property values (e.g., lens color,
    Bluetooth control), do not rely on exact string equality alone. Stored values may differ in case or
    use alternative representations for booleans. To avoid false negatives:


    1. For text properties (like lens color), use case-insensitive comparison. In SQL, apply LOWER() to
    both the stored value and the expected value: LOWER(property_value_text) = LOWER(''Yellow'').

    2. For boolean properties (like Bluetooth control), define a canonical set of affirmative values (e.g.,
    ''true'', ''1'', ''yes'', ''on'') and check membership: LOWER(property_value_text) IN (''true'', ''1'',
    ''yes'', ''on'').

    3. If post-processing in application code, normalize both the expected and actual values to a canonical
    form (e.g., lowercase string, boolean parsed from common representations) before comparison.

    4. Ensure that missing properties (NULL) are treated as non-matching, which is already achieved by
    left join and equality checks that fail on NULL.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
