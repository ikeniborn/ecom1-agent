- id: count-intent-exec-answer-not-tree
  description: Counting/aggregation intents require an Exec computation followed by an Answer return,
    not a structural listing RPC
  domain:
  - vm-scripting
  - rpc-fidelity
  - intent-mapping
  content: 'When an intent asks to count or aggregate items (e.g. tally a collection), the correct RPC
    sequence is an Exec call that computes the count followed by an Answer call that returns the result.
    Do NOT satisfy a count/aggregate intent with a structure-traversal RPC (such as a tree/listing call):
    listing surfaces nodes but never produces or returns a numeric result, so a fidelity check comparing
    the RPC multiset will flag drift (expected Exec+Answer, got the listing call). General rule: map the
    intent''s verb to the RPC''s effect — counting needs compute+return, not enumerate.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
