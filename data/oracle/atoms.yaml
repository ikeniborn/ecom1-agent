  content: 'To check if an item exists given imprecise natural-language descriptors: (1) Build a SELECT
    query that wraps columns and parameters in LOWER(TRIM(...)) and uses LIKE with concatenated wildcards
    (''%'' || term || ''%'') for substring matching. (2) Search across multiple relevant descriptor columns
    by OR-ing the conditions. (3) Bind each user-supplied term as a query parameter. (4) Limit results
