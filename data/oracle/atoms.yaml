  - Fuzzy Matching
  content: 'To reliably match SKUs extracted from OCR-scanned text against a known set of SKUs (e.g.,
    from a database), apply the following steps:


    1. Define a symmetric mapping of visually similar characters that are commonly confused by OCR: 0
    ↔ O, 1 ↔ I, 5 ↔ S, 8 ↔ B, 2 ↔ Z. Additional pairs (e.g., l ↔ 1) can be added as needed.

    2. Create a normalization function that, given a string, returns a canonical form where every character
    from these pairs is replaced by a single representative (e.g., all ''0'' and ''O'' become ''0'').

    3. For each SKU read from the receipt, first attempt an exact match against the database SKU set (case-insensitive).

    4. If no exact match is found, normalize both the receipt SKU and every database SKU and attempt a
    match on the normalized forms.

    5. Use the matched database entry to retrieve associated data (price, description, etc.). This approach
    tolerates typical OCR substitution errors without complex ML models and is effective for simple, structured
    receipts.'
