- id: scalar-sql-extraction
  description: Extract a single scalar value from a SQL query result by executing the query, capturing
    the output as a table, selecting the first row, and accessing the desired column.
  domain:
  - data processing
  - scripting
  - database
  content: When a script needs a single value from a database (e.g., a count or aggregate), it can execute
    a SQL command via a command-line tool, parse the output into a structured table, take the first row,
    and use the value of the relevant column. This pattern avoids complex parsing and is reusable for
    any scalar query.
