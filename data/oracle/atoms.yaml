- id: sql-result-refs-require-selected-column-and-bound-params
  description: When a query is expected to emit runtime references (e.g. record paths) but the extracted
    ref list comes back empty, the cause is almost always a missing SELECT column, unapplied named parameter
    bindings, or post-query row parsing that drops the target column — not absence of matching data.
  domain:
  - sql
  - data-extraction
  - validation
  - agent-tooling
  - debugging
  content: 'To reliably extract runtime values (paths, ids, keys) from a SQL pipeline, verify three layers
    in order: (1) the FINAL SELECT (including any UNION/CTE projection) actually lists the target column
    — intermediate CTEs that compute it are useless if the outer query omits it; (2) every named placeholder
    (:name) is bound, since an unbound parameter silently yields zero rows; (3) the post-query parser/regex
    matches the actual column format and column ordering, since a too-strict pattern can discard valid
    rows. An empty result set is ambiguous between ''no matching rows'' and ''projection/parse dropped
    the column'' — disambiguate by first running a minimal SELECT of just the key columns with a relaxed
    match, then add filters back one at a time. Distinguish ''zero matches'' from ''matches found but
    reference unextractable'' before concluding the data is absent.'
  source: distilled
