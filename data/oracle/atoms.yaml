  - grading-contract
  - boolean-determination
  content: For yes/no or existence-check tasks whose grader requires a specific literal marker (e.g. a
    token like <YES> or <NO>), emit that exact marker string verbatim in the answer message. A natural-language
    affirmation ('Yes — we carry ...') does NOT satisfy a substring/contains check for '<YES>'; the words
    'yes'/'no' are not interchangeable with the required sentinel. Before finalizing, confirm the answer
    template literally includes the grader's expected token (case- and bracket-exact). When the matched
    record proves the positive case, prepend/append the required affirmative sentinel alongside any human-readable
    explanation rather than relying on phrasing alone.
