- id: catalogue-product-count-by-kind-distinct-family
  description: Count catalogue products of a given product kind as distinct product families per the governing
    reporting policy
  domain:
  - catalogue
  - sql
  - reporting
  content: 'When a reporting policy asks to count ''products'' of a given product kind, first read the
    governing catalogue reporting policy doc — it dictates the counting unit. The catalogue model has
    three tiers: product_kinds (the category), product_variants (individual SKUs), and product_family
    (the logical product). ''Number of products'' means COUNT(DISTINCT product_family_id) over the variants
    of that kind, NOT a raw row/variant count — multiple variants share one family, so counting variants
    over-reports. Resolve the kind by matching on the kind name with case- and whitespace-insensitive
    comparison (LOWER(TRIM(name)) on both sides) rather than exact equality, since stored names vary in
    case/padding. Pattern: CTE selecting product_kind_id WHERE LOWER(TRIM(product_kind_name)) = LOWER(TRIM(:target)),
    then JOIN product_variants on product_kind_id and COUNT(DISTINCT product_family_id). Validate the
    result is >= 0 before reporting.'
