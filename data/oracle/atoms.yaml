- id: receipt-price-comparison-via-sql
  description: General method to compare a JSON receipt total excluding VAT with current product variant
    prices using a single SQL query, handling missing price fields and VAT rate fallback.
  domain:
  - coding
  - python
  - sql
  - data-processing
  content: 'When comparing the total price of items from a JSON receipt (which may contain unit prices
    including or excluding VAT) with today''s catalog prices stored in a database, you can use a single
    SQL query that:

    1. Parses the receipt JSON using json_each() and json_extract() to extract item SKU, quantity, and
    unit prices.

    2. Computes the net (excluding VAT) unit price by checking if an ex-VAT field exists; if not, it falls
    back to the price inclusive of VAT divided by (1 + VAT rate/100), using a VAT rate extracted from
    the receipt.

    3. Joins the extracted receipt items with the product_variants table on SKU to obtain current prices
    (in the same unit, e.g., cents).

    4. Aggregates the old total (using the computed net unit prices) and today''s total, then computes
    the absolute difference.

    5. Handles missing product variants by counting missing matches and flagging whether all products
    are available.

    6. Returns the old total, today''s total, the difference, a boolean indicating if the difference is
    within a predefined threshold (e.g., €2.00 = 200 cents), and whether all products were found.

    Important details: escape single quotes in the receipt JSON string when embedding it into SQL (e.g.,
    replace '' with ''''). Use COALESCE to fallback to the original unit_price_cents if ex-VAT price is
    unavailable. Wrap the entire logic in a WITH statement for readability. This method avoids multiple
    round trips and can be used in environments like a Python virtual machine that executes commands via
    exec() and reads files.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
