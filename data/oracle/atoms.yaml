- id: sql-runtime-no-named-binds-inline-literals
  description: When a SQL exec runtime ignores named parameter binds, inline values as escaped single-quoted
    literals instead
  domain:
  - sql
  - database
  - parameter-binding
  content: 'Some minimal SQL execution runtimes (e.g. a bare /bin/sql shim) do NOT resolve named bind
    placeholders like :name. Passing such binds silently yields an empty result set, which can drop expected
    columns and break downstream parsing. Method: inline parameter values directly into the SQL string
    as single-quoted literals, escaping embedded single quotes by doubling them ('' -> ''''). Verify the
    runtime''s bind support first; only fall back to literal inlining when binds are unsupported, since
    inlining forfeits injection protection and requires manual escaping. For scalar aggregates (COUNT,
    etc.), parse the last integer in stdout to stay header-agnostic; for row sets, parse cells positionally
    rather than by named column to survive header variation.'
  source: distilled
