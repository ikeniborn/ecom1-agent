- id: catalog-query-avoid-arbitrary-first-match
  description: When querying a product catalogue to verify existence of a specific variant and cite its
    reference, using broad filters with LIMIT 1 or a first-row selector risks returning the wrong item
    among similar variants.
  domain:
  - sql
  - catalog-querying
  - product-lookup
  - existence-verification
  - ambiguity-resolution
  content: Constrain existence queries with exact-match predicates on all available identifying attributes
    (brand, series, size, color, and especially SKU or model code) so the result set contains exactly
    the intended record. If the attributes do not guarantee uniqueness, return every candidate reference
    rather than selecting an arbitrary row, preventing an incorrect sibling variant from being presented
    as the answer.
