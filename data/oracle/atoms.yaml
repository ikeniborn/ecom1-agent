  content: 'To compare an old receipt total with current catalogue prices, first parse the receipt to
    extract each line item''s quantity and SKU. Since SKUs may contain visually ambiguous characters (e.g.,
    0 vs O, 1 vs I, 5 vs S), apply a canonical normalization mapping to convert them to a consistent form:
    e.g., ''0''→''O'', ''1''→''I'', ''5''→''S'', ''8''→''B'', ''2''→''Z'' (and their reversed mappings).
    Use this mapping to build a set of normalized SKUs from the receipt. Then query the product database
    for current prices of those normalized SKUs, e.g., `SELECT product_sku, price FROM products WHERE
    product_sku IN (...)`. Match each line item''s normalized SKU to the query result to compute the new
    total (sum of qty * price). Finally, compare the new total with the receipt''s declared total (e.g.,
    sub-total) to check if the absolute difference falls within a threshold. This approach handles OCR/misread
    SKU characters without manual correction.'
