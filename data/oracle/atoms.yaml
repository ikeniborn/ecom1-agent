- id: atom-robust-file-detection
  description: Method for reliably finding a file in a virtual directory listing using fallback heuristics
    to avoid missed files due to metadata inconsistencies.
  domain:
  - file-system
  - discovery
  - mock-testing
  content: 'When retrieving a directory listing from a virtual filesystem API, entries may contain a ''kind''
    field (e.g., ''FILE'', ''DIRECTORY'') and a ''name''. To robustly locate a target file, do not rely
    solely on exact ''kind'' == ''FILE''. Instead, check multiple conditions: if ''kind'' is absent or
    unexpected, fall back to checking whether the entry''s name contains a file extension (dot), or treat
    any entry that is not a directory (e.g., name does not end with ''/'') as a potential file. Example
    heuristic in Python: `if entry.get(''kind'') != ''DIRECTORY'' or ''.'' in entry.get(''name'', ''''):`.
    This ensures file discovery even when the API response varies between environments, preventing fidelity
    drift in mock-based tests.'
