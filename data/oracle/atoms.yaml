  - fidelity-testing
  content: 'When a fidelity check validates a script by comparing the multiset of RPC operations it emits
    against the set expected for the intent, choose operations whose semantics match the intent. A counting
    or aggregation intent expects compute/execute operations that derive a value plus an answer operation
    that returns the numeric result; it does NOT expect a structural traversal operation (e.g. listing
    a tree from a root). Calling a traversal RPC for a count produces a wrong operation multiset and fails
    the fidelity assertion even if no runtime exception occurs. Rule: map the verb of the intent (count,
    sum, list, fetch) to the operation category, then emit exactly those RPCs. Separately, never name
    a field ''schema'' (or other parent-defined attribute) on a Pydantic BaseModel subclass — it shadows
