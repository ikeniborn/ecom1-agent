- id: count-query-requires-exec-then-answer-not-tree-traversal
  description: Answering an aggregation/count intent requires a compute (Exec) plus an explicit Answer
    step, not a structural traversal call
  domain:
  - agent-orchestration
  - rpc-fidelity
  - data-query
  content: 'When a script must satisfy a counting or aggregation intent (count/sum/how-many), the emitted
    operation sequence must compute the result and then return it — i.e. an execute/query call followed
    by an answer call. A directory or tree traversal call (listing/walking the structure) does NOT satisfy
    such an intent: it enumerates nodes but never computes or emits the aggregate, so a fidelity check
    comparing the expected RPC multiset (e.g. [Exec, Answer]) against the actual one ([Tree]) fails as
    drift. General rule: match the operation primitives to the question type — traversal answers ''what
    exists'', but quantitative questions demand an explicit compute step plus a terminal answer step.
    Verify the produced call multiset equals the expected set before returning.'
