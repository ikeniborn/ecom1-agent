  - existence-check
  content: To determine if a record exists in a main table (e.g., product_variants) that satisfies both
    direct column conditions and multiple conditions on a related key-value properties table, use a SELECT
    query on the main table with WHERE clauses for direct attributes and multiple EXISTS subqueries for
    each property condition. Each EXISTS subquery checks the properties table for a matching record with
    the specific property key and value, linked by the main table's primary key. If the query returns
    any rows, the record exists; otherwise, it does not. This pattern avoids JOINs that could cause row
    multiplication and ensures all conditions are independently satisfied.
