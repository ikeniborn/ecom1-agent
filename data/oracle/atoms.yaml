- id: authorization_check_deny_pattern
  description: Pattern to securely deny unauthorized requests using a definitive authorization check to
    avoid clarification outcomes.
  domain:
  - security
  - authorization
  - discount
  content: When implementing an authorization check that must deny unauthorized callers, use a discovery
    command that returns a clear boolean 'authorized' field (or equivalent). In the decision, branch on
    'authorized == false' to a deny answer with outcome OUTCOME_DENIED_SECURITY. Avoid relying on ambiguous
    identity fields (e.g., 'kind') that may be missing or undefined, as this can lead to an OUTCOME_NONE_CLARIFICATION
    outcome instead of the intended denial.
  source: distilled
