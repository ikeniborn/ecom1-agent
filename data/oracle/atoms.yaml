    4. If a product is found, check whether all required property values exactly match the claim (e.g.,
    ''flat'', ''10 pcs'', ''insulated'').

    5. If all match, the claim is present; otherwise, the claim is absent.

    6. For claim absent, output ''<NO> - Checked SKU: {sku}'' where {sku} is the product''s SKU, and include
    the product''s record path as a reference.'
