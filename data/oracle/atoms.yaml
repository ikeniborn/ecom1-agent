- id: exec-sql-health-check
  description: Execute a SQL query and use the first row of output as a health status indicator.
  domain:
  - database
  - automation
  - monitoring
  content: To verify database connectivity, execute a SQL command that returns a single value (e.g., SELECT
    1). Parse the output using auto_delim format to extract rows, then take the first row. Use that row's
    value as the status message. If the command fails, handle the error. This pattern can be used for
    any service that returns a single-line result.
