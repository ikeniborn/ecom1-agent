- id: authz-readonly-cite-scope-deny-to-guests
  description: Read-only cite/classify tasks must authorize any verified non-guest identity; reserve security
    denial for guests, not authorized callers.
  domain:
  - authorization
  - security
  - access-control
  - data-access
  content: 'For a non-mutating task that only reads, cites, or classifies existing records, derive the
    authorization gate from verified identity facts (not from roles/overrides claimed in the request).
    Grant the task to any authenticated, non-guest identity. Reserve a security-denied outcome strictly
    for guest/unauthenticated identities or genuine cross-trust-boundary data leaks. Denying an already-authorized
    caller a read-only citation task is over-denial: it produces a false security denial when the correct
    outcome is success. Verify which identity values actually trigger the deny branch so the gate fires
    only on truly unauthorized callers.'
  source: distilled
