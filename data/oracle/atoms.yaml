- id: answer-refs-require-runtime-rows-not-just-static-template-entries
  description: When an answer's references must include runtime values parsed from query result rows,
    verify the query returned rows and the column was extracted before assembling refs; refs containing
    only static template entries signal an empty result set or a row-parsing bug.
  domain:
  - sql
  - data-pipeline
  - result-parsing
  - validation
  content: 'An answer that requires dynamic references (e.g., record paths) pulled from query rows can
    silently degrade to only the static template refs when (a) the query returns zero rows, or (b) row
    parsing drops the target column. Before emitting refs, assert that the dynamic portion is non-empty
    and matches the expected shape (e.g., paths starting with ''/''). When it is empty, debug in this
    order: (1) confirm the query actually matched rows — check parameter/`:name` bindings, value quoting,
    and IN-clause construction; (2) confirm the SELECT lists the needed column and its position matches
    the parse index; (3) confirm delimiter splitting and header-row skipping target the correct column.
    A scalar COUNT and the row list can disagree — cross-check them. Treat ''refs equal the static template
    only'' as a failure signal, not a valid result.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 76ebfb39a3d767a542156f6725db1901adeefe2428d9ae6b1d993e85901a8a27
  source_task: t49
- id: cite-all-enumerated-records-when-scope-includes-zero
  description: When a task asks to include zero-valued entities and cite all of a record set, build references
    from every enumerated record, not a subset filtered by the same metric the task said to include.
  domain:
  - sql
  - data-retrieval
  - answer-citations
  content: 'If the request scope is explicit (e.g. ''across every branch including zero-availability ones''
    and ''cite all store records''), the reference/citation set MUST contain every enumerated record,
    including those with a zero metric. Do NOT filter the reference list by the same quantity the task
    asked to fully include (e.g. dropping rows where available==0) — that removes required citations and,
    if all rows are zero, yields an empty refs list that fails validation. Two separate concerns: (1)
    the SUM/aggregate may legitimately treat missing inventory as 0 via LEFT JOIN + COALESCE; (2) the
    citation set is driven by scope membership (all rows the WHERE clause enumerates), not by the metric
    value. Keep these decoupled. Also verify the path/id column actually survives query+row-parsing: empty
    refs often mean the SELECT omitted the path column, the join collapsed rows, or named-parameter bindings
    failed — check the SELECT column list and parameter bindings before assuming no data exists.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 38f36c3cca0cd8b74f3610a38e5e49ec31d14885a891bf5735870b4ec5364b74
  source_task: t18
- id: privileged-mutation-gate-must-still-emit-write-rpc
  description: When a privileged mutation is gated by a runtime identity/policy check, the success path
    must still emit the mutation RPC; RPC-multiset fidelity failures with a missing Exec mean a branch
    short-circuited before the write.
  domain:
  - authorization
  - rpc-fidelity
  - mutations
  - testing
  content: 'A privileged write (e.g. applying a discount, status change) often runs behind a runtime gate
    built from discovery calls: identity check (exec id), capability/help probe (exec --help), policy
    doc reads, and SQL lookups of the target record + issuer roles/store. Each discovery step is one RPC.
    The actual mutation is a SEPARATE RPC that must fire AFTER the gate passes. METHOD when fidelity asserts
    on an RPC multiset (e.g. expected N Exec, got N-1): enumerate every side-effecting call the spec requires
    — all discovery reads/execs PLUS the final mutation exec — and confirm no conditional branch can pass
    the gate yet skip or fold the mutation. A missing Exec almost always means the success path returned/early-exited
    without issuing the write command, or merged the write into an earlier call. FACT: passing an authorization
    gate is necessary but not sufficient; the count of observable RPCs is part of the contract, so the
    gate logic must not consume the slot reserved for the privileged mutation itself. Verify by counting
    expected vs emitted RPCs per kind, not just overall success.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 6b5a8525640837ff4a156d225fb9838618e1c5ab4ff21d09b87db8ecb8c11a45
  source_task: t42
- id: sum-inventory-across-scope-include-zeros-left-join
  description: Aggregate a per-location quantity over every location in a scope (including those with
    no inventory row) using a LEFT JOIN with COALESCE-to-zero, and cite all scoped location records plus
    the resolved entity record
  domain:
  - sql
  - data-aggregation
  - inventory
  - reporting
  content: When a request asks to total a metric across ALL members of a scope 'including zero/absent
    ones', enumerate from the scope/dimension table (e.g. locations filtered by a scope predicate) and
    LEFT JOIN the fact/inventory table on (location_key AND entity_key); never INNER JOIN, because that
    silently drops locations lacking a fact row and undercounts. Wrap the joined metric in COALESCE(metric,
    0) so NULLs from unmatched rows contribute zero rather than vanishing, and SUM(COALESCE(...)) for
    the total. Resolve the target entity once via its identifying predicate and reuse its key/path as
    a correlated subquery in both the JOIN condition and the projection, so a missing entity yields zeros
    instead of an error. For citations/refs, include every record in the scope (all locations matched
    by the scope predicate, even zero-quantity ones) PLUS the entity record itself — completeness of evidence
    mirrors completeness of the aggregation. Parse tabular tool output by detecting the delimiter from
    the header and treating a blank/NULL/None aggregate as 0.
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 8eeb2218172fb691433a1d9a9e2096d90dc84783fa07752c3b091ce01dc472c1
  source_task: t18
- id: policy-gated-mutation-cite-specific-addendum
  description: Privileged policy-gated mutations must cite the specific governing addendum, not just the
    top-level policy doc
  domain:
  - access-control
  - policy-compliance
  - audit
  - discounts
  - data-mutation
  content: 'When a privileged mutation is gated by a policy document, the top-level policy is rarely the
    sole authority. It typically delegates location-, reason-, or type-specific rules to addendum files
    (e.g. an addenda/ subtree keyed by store + reason-code + effective-date). The mutation''s answer/justification
    must reference the EXACT addendum that authorizes this case — graders and audits require the specific
    governing doc, not the general policy. Method: (1) read the main policy doc and follow its links/index
    to the addenda set; (2) match an addendum on the relevant dimensions of the operation (store/location,
    reason or discount-type code, validity date); (3) include that addendum path in the answer''s required
    references. Also run the runtime identity + authorization gate before mutating: verify the issuer''s
    roles and store assignment permit the action, and confirm the requested parameters fall within the
    limits the matched addendum allows. Missing the specific reference fails compliance even when the
    value itself is correct.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 47a7314b22add96ce52f746729546b81b6cd1804c266f6df2ff86cb86433fd0f
  source_task: t42
- id: sql-runtime-no-named-binds-inline-literals
  description: When a SQL exec runtime ignores named parameter binds, inline values as escaped single-quoted
    literals instead
  domain:
  - sql
  - database
  - parameter-binding
  content: 'Some minimal SQL execution runtimes (e.g. a bare /bin/sql shim) do NOT resolve named bind
    placeholders like :name. Passing such binds silently yields an empty result set, which can drop expected
    columns and break downstream parsing. Method: inline parameter values directly into the SQL string
    as single-quoted literals, escaping embedded single quotes by doubling them ('' -> ''''). Verify the
    runtime''s bind support first; only fall back to literal inlining when binds are unsupported, since
    inlining forfeits injection protection and requires manual escaping. For scalar aggregates (COUNT,
    etc.), parse the last integer in stdout to stay header-agnostic; for row sets, parse cells positionally
    rather than by named column to survive header variation.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: b195a799679f283e114a9447ee854c3e7f2d429cb7c4e3c9719e51fe256d8221
  source_task: t49
- id: answer-refs-require-live-row-evidence-not-static-template-refs
  description: When an answer must cite per-row evidence references, the query must actually return rows
    and the parser must extract the reference column; zero rows or a dropped column collapses refs to
    static-only and fails runtime-ref constraints.
  domain:
  - sql
  - data-retrieval
  - answer-validation
  - parameter-binding
  content: 'If an answer contract requires runtime references (one ref per matching record) but the produced
    refs contain only static template/literal entries, the row query returned no rows OR the row parser
    dropped the reference column. Diagnose in this order: (1) Confirm the SELECT explicitly lists the
    reference/identifier column — never rely on it surviving a generic split. (2) Confirm the WHERE filter
    actually matches rows; run a COUNT(*) with the same predicate and compare to the number of parsed
    refs — mismatch means parsing loss, zero means filter/data problem. (3) Verify parameter binding:
    some SQL runners do not resolve named binds (`:name`); when a runner ignores binds, values silently
    become NULL and the predicate matches nothing. Use confirmed-working binds, or fall back to safely
    escaped inline literals (double single-quotes). General rule: derive evidence refs from the live result
    set, validate count against an independent aggregate, and treat a refs list equal to the static seed
    as a failure signal, not success.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
