- id: checkout-basket-method
  description: A reusable method for completing a shopping basket checkout process with security, inventory,
    and payment validation
  domain:
  - e-commerce
  - checkout
  - basket-processing
  content: 'To complete checkout for a basket: 1. Read the checkout policy document and security policy
    document. 2. Query the basket record to obtain its ID, status, store ID, customer ID, and record path.
    3. Query inventory to find any items where the requested quantity exceeds available stock or the product
    SKU is missing from the store inventory. 4. Query for an existing completed payment transaction for
    the basket. 5. Decision logic: a) If the security policy prohibits guest checkout and the basket has
    no customer ID, deny with a security message referencing the policy doc and basket record path. b)
    If the basket ID is missing, ask for clarification. c) If the basket record path is missing or inventory
    violations exist, return unsupported with a message referencing the policy doc. d) If the basket is
    already checked out and a completed payment exists, return success with the payment ID. e) Otherwise,
    execute the checkout command to finalize the basket and return success with the resulting payment
    ID. All outcomes include appropriate messages and references to policy documents or record paths as
    needed.'
