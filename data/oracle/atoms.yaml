- id: select-most-recent-file-explicit-sort
  description: Resolve 'most recent'/'last' file in a directory by explicit sort, not raw listing order
  domain:
  - filesystem
  - directory-listing
  - sorting
  content: Directory-listing APIs return entries in an unspecified order — it is NOT guaranteed to be
    chronological, lexical, or stable. To pick the 'most recent' file, stat each file entry and select
    the one with the max modification time. To pick the 'last' file by name, sort entries lexically and
    take the tail. Never assume entries[-1] (or the raw last entry) is the newest or alphabetically last.
    Filter to FILE-kind entries before sorting, then apply the explicit sort key the intent implies ('most
    recent' = mtime, 'last' = name).
