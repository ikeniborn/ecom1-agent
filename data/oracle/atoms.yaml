- id: inventory_aggregation_handle_missing_product
  description: When computing total available quantity of a product across all stores, always return an
    outcome of OK with a numeric total (including zero) even if the product does not exist in the database.
  domain:
  - inventory
  - SQL
  - data aggregation
  - error handling
  content: When aggregating inventory quantities across stores for a specific product, ensure the query
    returns a result for all cases. Use a LEFT JOIN from stores to inventory (or product) to include stores
    with zero quantity. If the product itself is not found, do not treat it as an unsupported case; instead,
    return a total of 0 (or appropriate default) and set the outcome to OK. The decision logic should
    not branch on product existence; it should always produce an answer.
  source: distilled
