  polarity: method
- id: catalogue-count-respect-governing-reporting-policy
  description: When counting catalogue entities by category under a governing reporting policy, count
    at the policy-defined unit (catalogue product), not at a finer granularity like variants/SKUs
  domain:
  - sql
  - reporting
  - data-modeling
  - business-rules
  content: 'A request to ''count products of kind X per the governing reporting policy'' is constrained
    by that policy''s definition of the counting unit. Read the policy doc first and let it dictate the
    grain. Catalogue ''products'' and their ''variants/SKUs'' are distinct levels: one catalogue product
    can map to many variant SKUs. COUNT(DISTINCT variant_sku) from a variants table counts variants and
    overcounts the catalogue-product total. To report catalogue products, count distinct catalogue-product
    identities (e.g. COUNT(DISTINCT product_id) on the products table, or COUNT(*) over the product entity
    filtered by kind) — not rows or SKUs in the variants table. General rule: before writing the aggregate,
    confirm which entity the policy counts, join/filter at that entity''s grain, and pick COUNT(DISTINCT
    <that-entity-key>). Match the category name case/whitespace-insensitively, but never let a join to
    a finer-grained child table inflate the count beyond the governed unit.'
  source: distilled
