- id: rpc-fidelity-match-operation-to-primitive
  description: Counting/aggregation tasks must emit the expected RPC primitives (compute + return), not
    a structural traversal
  domain:
  - vm-rpc
  - fidelity-testing
  - api-design
  content: 'Fidelity tests assert the multiset of RPC calls a script emits matches the operation''s intent.
    Pick the primitive by semantic of the task, not by what superficially returns data. An aggregation/count
    task expects a compute-and-return pair (e.g. Exec then Answer): run a query/computation, then surface
    the scalar result. A tree/list traversal primitive enumerates structure and does NOT satisfy a count
    contract — emitting it instead of the compute+return pair causes an RPC-multiset drift assertion.
    General rule: before scripting, identify the RPC multiset the intent requires and emit exactly those
    calls; map ''count/sum/aggregate'' to execute+answer, reserve traversal calls for explicit structure-listing
    intents.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: e4fe1ea50baae7c9daead46b9dd69a2a0645179d3ea52114ecdc02e2f319501d
