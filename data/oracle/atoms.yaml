    3. Build a SQL query to fetch current unit prices from a catalogue table (e.g., product_variants)
    for all extracted SKUs.

    4. Execute the query and build a mapping from normalized SKU to price (usually in cents).

    5. Compute the expected total ex-VAT: sum over items of (quantity * price_cents / 100).

    6. If the old receipt subtotal was parsed, calculate the absolute difference between it and the new
    total. If difference ≤ tolerance (e.g., 3 EUR), the receipt is still valid (<YES>), otherwise invalid
