- id: answer-refs-empty-diagnose-sql-rows-or-dropped-path-column
  description: When an answer template requires runtime reference paths but produced none, diagnose as
    zero rows returned or a dropped path column during row parsing.
  domain:
  - sql
  - data-querying
  - answer-validation
  content: 'When a response template mandates runtime references (e.g. record/file paths from query results)
    but the actual refs list is empty, treat it as a signal of one of two failures: (1) the query returned
    zero rows, or (2) row parsing dropped the column that holds the reference path. Checklist to resolve:
    ensure the SELECT explicitly includes the reference/path column by name; verify named parameter bindings
    match the placeholders and the WHERE predicates are not over-constraining (one mismatched filter value
    silently yields no rows); confirm the delimiter and header-to-index mapping used to parse stdout actually
    capture the path column and that rows shorter than the header are not being skipped. Distinguish ''no
    matching data'' (legitimately empty result → emit a negative answer with empty refs) from ''data exists
    but refs lost'' (parsing/SELECT bug → fix before answering). Never emit a positive/affirmative answer
    whose template promises a path while refs are empty.'
