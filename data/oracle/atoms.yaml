- id: policy-governed-count-grain
  description: When a count is requested 'per governing/reporting policy', read the policy doc and apply
    its counting grain instead of assuming one
  domain:
  - sql
  - data-reporting
  - requirements-interpretation
  content: 'When a task asks to count entities ''per the governing/reporting policy'' and a policy or
    addendum document is referenced, the policy — not the query author — defines the counting semantics:
    which entity is the unit of count, dedup/distinct rules, and inclusion/exclusion filters. Do not default
    to an arbitrary grain (e.g. COUNT(DISTINCT parent_family_id) vs COUNT(child_variants) vs COUNT(DISTINCT
    entity_id)); these yield different totals. Read the cited policy first, extract its explicit count
    definition, and translate that exact grain and filter set into the query. If the script reads the
    policy doc but never applies its rules to the SQL, that read is wasted — bind the policy''s definition
    to the actual COUNT expression and predicates.'
