- id: count_explore_deeper
  description: When counting records, if the root is a container, explore deeper to find actual records.
  domain:
  - data processing
  - ETL
  - file system
  content: To count records in a hierarchical data source (e.g., directory with files, database table),
    first identify the leaf nodes (actual data items) and then apply a counting operation. Do not count
    containers themselves.
