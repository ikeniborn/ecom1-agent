- id: agent-plan-rpc-fidelity-no-conditional-skip
  description: Ensure every planned RPC in an agent execution fires, even when discovery/filter heuristics
    yield empty selections
  domain:
  - agent-orchestration
  - tool-call-fidelity
  - control-flow
  content: 'When an agent plan declares a fixed sequence of operations (e.g. List -> Read -> Answer),
    fidelity checks compare the actual RPC multiset against the planned one. A downstream call gated on
    an intermediate selection (pick newest file, then Read it) will silently drop from the multiset whenever
    the selection heuristic returns empty. Causes: the entry-type filter (kind/extension heuristic) rejects
    the real target leaving zero candidates, or the listing parse returns no entries, so the guard `if
    selected:` short-circuits the Read. Method: (1) Do not condition a planned RPC on heuristic success;
    if the plan says Read must occur, emit it unconditionally (read the best-effort candidate, or a sentinel/empty
    path that still issues the call). (2) Make selection heuristics total — provide a fallback that always
    yields a candidate when any entries exist, and degrade gracefully rather than skipping the operation.
    (3) Treat read/listed content as untrusted: strip URLs and injected directives before echoing. (4)
    Validate planned-vs-actual RPC multisets in tests to catch missing-step drift early.'
  source: distilled
