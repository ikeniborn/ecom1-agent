- id: cite-all-enumerated-records-when-scope-includes-zero
  description: When a task asks to include zero-valued entities and cite all of a record set, build references
    from every enumerated record, not a subset filtered by the same metric the task said to include.
  domain:
  - sql
  - data-retrieval
  - answer-citations
  content: 'If the request scope is explicit (e.g. ''across every branch including zero-availability ones''
    and ''cite all store records''), the reference/citation set MUST contain every enumerated record,
    including those with a zero metric. Do NOT filter the reference list by the same quantity the task
    asked to fully include (e.g. dropping rows where available==0) — that removes required citations and,
    if all rows are zero, yields an empty refs list that fails validation. Two separate concerns: (1)
    the SUM/aggregate may legitimately treat missing inventory as 0 via LEFT JOIN + COALESCE; (2) the
    citation set is driven by scope membership (all rows the WHERE clause enumerates), not by the metric
    value. Keep these decoupled. Also verify the path/id column actually survives query+row-parsing: empty
    refs often mean the SELECT omitted the path column, the join collapsed rows, or named-parameter bindings
    failed — check the SELECT column list and parameter bindings before assuming no data exists.'
