- id: receipt-total-comparison-matched-set
  description: When comparing an old receipt total to current prices, ensure both totals are computed
    over the same set of products by joining parsed receipt items with current product prices before aggregation,
    to avoid mismatched product sets causing incorrect difference calculations.
  domain:
  - data-comparison
  - sql
  - receipt-parsing
  content: To compare the total price of products from an old receipt (excluding VAT) with today's total
    price, first parse the receipt text to extract SKU, quantity, and unit price for each line. Then,
    join these parsed items with a current price table (e.g., product_variants) using an INNER JOIN on
    SKU to retain only products that exist in both sources. Compute the old total as SUM(parsed.quantity
    * parsed.unit_price) and the current total as SUM(parsed.quantity * current.price) from this joined
    result set. Finally, compare the absolute difference of these two totals against the threshold. This
    avoids the error of including old items that are no longer available, which would inflate the old
    total and cause a false 'exceeds threshold' outcome.
  source: distilled
