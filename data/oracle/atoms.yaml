- id: exception-decision-order-check-existence-first
  description: In a decision tree for applying a policy exception, check for the existence of the exception
    before checking caller identity to avoid returning a security denial when the operation is actually
    unsupported.
  domain:
  - decision-logic
  - exception-handling
  - policy-enforcement
  content: When implementing a decision tree to apply a policy exception (e.g., from a handbook), structure
    the branches so that the existence of the exception is evaluated first. If the exception is not found
    in the relevant policy document, immediately return an 'unsupported' outcome. Only if the exception
    exists should subsequent checks (such as caller identity, role, or other prerequisites) be performed.
    This ordering prevents a premature security denial from masking the true reason for failure, ensuring
    that the outcome accurately reflects that the requested operation is not supported by any exception,
    rather than incorrectly implying a security violation.
