  source_task: ''
- id: sql-runtime-refs-empty-check-bindings-and-path-column
  description: When a query-driven script must emit runtime record references but produces none, verify
    parameter bindings, SELECT column list, and row parsing preserve the identifier/path column
  domain:
  - sql
  - data-pipeline
  - debugging
  content: 'If a script is required to return runtime references (record paths/ids resolved from a database)
    but the actual reference set comes back empty while only static template entries remain, the root
    cause is almost always one of three things: (1) the query returned zero rows because parameter placeholders
    (e.g. `:name` bindings) were not substituted or matched no records, (2) the SELECT clause omitted
    the identifier/path column the downstream step needs, or (3) the row parser dropped or mislabeled
    that column when splitting output. To diagnose: confirm every named bind placeholder is actually substituted
    before execution and resolves to a value that matches existing data; confirm the path/id column is
    explicitly listed in every SELECT (including each branch of a UNION); and confirm the parser maps
    the column position correctly and does not discard it on alternate delimiters. Add a discovery query
    that returns row counts first, so an empty result set is detected before attempting to build references
    from it.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: d152171e4838124f169bc7743490c17bff05d8b05c375c12a533a8ba108a8562
  source_task: ''
- id: runtime-refs-require-verified-query-rows
  description: When output must cite runtime-derived references (e.g. a record path), verify the query
    returned rows and the path column survived parsing before falling back to static template refs
  domain:
  - sql
  - data-access
  - grounding
  - verification
  content: 'When a result must include runtime-derived references (a path/id pulled from a query) rather
    than only static template paths, treat an output containing solely the static refs as a failure signal:
    the query likely returned zero rows or row-parsing dropped the needed column. Guard against this:
    (1) Match parameter-binding syntax to what the query tool actually supports — if named binds (:name)
    are unsupported, escape and inline literals (double single-quotes) instead, since silently-unbound
    params yield empty result sets. (2) Confirm the SELECT explicitly lists the column you depend on (e.g.
    the record path) and that the row-splitter maps it to the right index, accounting for header rows
    and delimiter count. (3) Only emit a runtime ref after confirming a non-empty parsed value; do not
    let citation logic degrade to static-doc paths without flagging that the dynamic lookup produced nothing.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 00221cf259b3e05759c9a4b0c3987e749b4e4b621956026fcd0b601b5dbda2fa
