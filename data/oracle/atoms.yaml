  - retail
  - financial
  - sku-matching
  content: "General method for price comparison across data sources:\n1. Parse receipt text to extract\
    \ individual item SKUs and the original total amount (excluding tax).\n2. Retrieve current product\
    \ catalog prices for all known SKUs.\n3. Normalize SKUs using a character confusion map (e.g., O↔0,\
    \ I↔1, S↔5, B↔8, Z↔2) to enable fuzzy matching.\n4. For each SKU on the receipt:\n   a. If an exact\
    \ match exists in the catalog, use its price.\n   b. Else if the normalized SKU maps to a catalog\
    \ SKU, use that price.\n   c. If no match is found, treat the item as discontinued (contribute zero\
    \ to total).\n5. Sum all matched prices to obtain the today's equivalent total.\n6. Compute absolute\
    \ difference between the original total and the today's total.\n7. Return TRUE if the difference is\
    \ less than or equal to a configurable tolerance threshold, otherwise return FALSE."
