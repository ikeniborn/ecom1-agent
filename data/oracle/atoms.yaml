- id: verify-claims-prioritized-candidates
  description: Verify multiple property claims against an entity resolved via prioritized candidate identifiers,
    producing a ternary YES/NO/ABSENT verdict that cites the record when the entity exists.
  domain:
  - data-validation
  - entity-resolution
  - claim-verification
  content: 'To verify attribute claims when an entity may be identified by multiple prioritized candidate
    keys: 1) Query for the first available base entity using an ordered candidate list. 2) Check each
    claimed attribute using normalized comparisons (e.g., case-insensitive and trimmed key/value matching).
    3) Produce a ternary verdict: YES if the entity exists and all claimed properties hold; NO if the
    entity exists but at least one claimed property does not hold; ABSENT if none of the candidate identifiers
    resolve to an entity. 4) In YES and NO responses, include the entity''s stable record identifier.
    5) In ABSENT responses, omit entity-specific citations.'
  source: distilled
  validated_by: grader-oracle
