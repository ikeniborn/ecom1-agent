- id: prefer-discovery-over-clarification-when-params-derivable
  description: When a data-query task names an entity and a scope, attempt schema/data discovery to resolve
    filter criteria before bailing to a clarification request
  domain:
  - data-query
  - task-resolution
  - clarification-handling
  content: 'When asked to find and cite records belonging to a referenced entity (e.g. a confirmed incident/case)
    within a bounded scope (e.g. archived history), do NOT immediately return a ''params_missing'' clarification
    just because identifiers, membership criteria, or scope flags are unstated. First run discovery: inspect
