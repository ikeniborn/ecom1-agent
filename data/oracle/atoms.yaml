  - checkout
  - 3ds
  - security
  content: When processing a checkout recovery after a 3DS failure, evaluate the 3DS status and attempt
    count. If the 3DS status is 'failed' and the number of attempts has reached the maximum allowed, deny
    the recovery for security reasons. If the 3DS status is 'success', allow the recovery. For any other
    status (e.g., pending, not attempted), the recovery action is unsupported.
