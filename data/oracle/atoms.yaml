- id: claim-verify-subquery-ref-citation
  description: Verify a multi-property claim against a database entity by anchoring to a base record and
    independently checking each required property via correlated EXISTS subqueries; ensure the discovered
    record path is always cited in the answer refs for any located entity, including when the claim is
    disproved.
  domain:
  - scripting
  - claim-verification
  - sql
  - answer-formatting
  content: '1) Discover the base entity with a robust normalized search (e.g., LOWER/TRIM/LIKE on name/brand)
    and select its SKU and canonical record path. 2) Evaluate the claim using one or more EXISTS clauses
    against the property table, correlating by SKU and matching each target property key/value. 3) Convert
    result flags to numbers and branch the answer: if the entity is absent respond accordingly, if the
    claim holds respond positively, otherwise respond negatively. 4) In every answer branch where the
    entity was located (positive or negative claim outcome), include the discovered record path in the
    refs array so the grader can validate the source.'
