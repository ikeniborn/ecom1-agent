- id: catalog-price-ex-vat
  description: catalogue price_cents is ex-VAT (net); no VAT division for ex-VAT totals
  domain:
  - pricing
  - sql
  - receipt
  content: 'Receipt-vs-today ex-VAT comparison. catalogue product_variants.price_cents is ex-VAT (net)
    — confirmed: an unchanged item''s receipt unit price equals catalogue price_cents/100 exactly — so
    today_ex = SUM(qty*price_cents)/100 with NO division by (1+vat); the receipt SUBTOTAL line is already
    the ex-VAT total and the VAT rate is printed on the receipt, not in /docs (do not search /docs for
    VAT). old_ex = the receipt SUBTOTAL (sum of ALL line items qty*unit; parse the printed ''SUB T0TAL''
    line, OCR may write 0 for O). today_ex = SUM over EVERY receipt line item of qty*catalogue_price;
    a line item whose SKU is genuinely absent from the catalogue (discontinued) contributes 0 to today_ex
    (NOT its old price, NOT dropped) — so its full value enters the diff and forces <NO>. Do NOT restrict
    the OLD side to matched SKUs. Receipt SKUs are OCR-noisy: match the catalogue EXACTLY first, then
    FUZZY (treat 0/O, 1/I, 5/S, 8/B, 2/Z as interchangeable) before declaring a SKU discontinued. diff
    = abs(today_ex - old_ex); answer <YES> if diff <= 3 EUR else <NO>; refs = receipt path.

    '
  source: investigation
  validated_by: manual
  validated_at: '2026-06-05'
  status: active
  embedding_hash: ''
  source_task: ''
