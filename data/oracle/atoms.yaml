- id: product-variant-existence-eav-join-pattern
  description: SQL pattern to verify product variant existence by joining a main product table with multiple
    EAV property CTEs and applying normalized fuzzy matching across descriptive columns.
  domain:
  - sql
  - eav-pattern
  - product-catalog
  - data-integration
  content: 'To determine whether a product variant exists when dynamic attributes live in an EAV/properties
    table and static descriptors live in a main product table: (1) Create one CTE per critical property,
    selecting product_sku where LOWER(TRIM(property_key)) equals the target key and LOWER(TRIM(property_value_text))
    equals the target value. (2) JOIN the main product_variants table with every property CTE on product_sku.
    (3) Filter direct columns (e.g., brand) using LOWER(TRIM()) equality. (4) Match the product line with
    an OR-ed set of LOWER(TRIM()) LIKE ''%%'' predicates across series, model, and product_name. (5) Count
    the resulting rows to establish existence; zero means absent, non-zero means present. Normalize all
    comparisons with LOWER(TRIM()) to defeat case and whitespace mismatches.'
  source: distilled
  validated_by: ''
  validated_at: ''
