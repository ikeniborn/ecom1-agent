- id: sql-inline-literals-when-named-binds-unsupported
  description: When a SQL execution tool ignores :name bind parameters (returns zero rows despite valid
    data), inline parameter values as escaped single-quoted SQL literals instead
  domain:
  - sql
  - data-access
  - tooling
  - query-building
  content: 'Some SQL execution interfaces accept a raw query string but do NOT resolve named bind parameters
    (`:name`/`?` placeholders) — they pass the literal placeholder text to the engine, which matches nothing
    and silently returns zero rows. Symptom: a query that should match data returns empty results, and
    any downstream contract requiring runtime values (e.g. row-path refs) fails with an empty set rather
    than an error. Before assuming the data is absent, verify whether binds are honored. If not, build
    the query by inlining each parameter as a quoted SQL literal: wrap string values in single quotes
    and escape embedded single quotes by doubling them (`''` -> `''''`) to prevent injection and syntax
    breakage. Centralize this in a small `lit()` helper. Caveat: inlining only safe for trusted/internal
    params; doubling-quotes guards correctness but is not a substitute for true parameterization where
    the engine supports it. Also parse result columns by name from the header row (locate index of each
    needed column) rather than fixed positional offsets, and treat an empty/whitespace value in a required
    column as a dropped row.'
  source: distilled
