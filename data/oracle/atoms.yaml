- id: fidelity-drift-noop-transform
  description: Detect and prevent fidelity drift caused by no-op or stub transformation scripts
  domain:
  - data-transformation
  - testing
  - code-quality
  content: 'Fidelity drift occurs when a transformation''s output diverges from the source intent. A common
    root cause is a stub or no-op implementation (e.g. a function body that only passes/returns nothing)
    that performs no actual transformation, so the result never reflects the declared intent. To prevent:
    assert the implementation produces a non-trivial, intent-conforming output before trusting it; add
    a test that compares output against the expected mapping of the input intent and fails on identity/empty
    results; treat an empty or unchanged output as a drift signal, not a success. Never ship a transformation
