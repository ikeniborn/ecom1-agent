- id: 3ds-recovery-guest-deny
  description: When restarting a 3-D Secure recovery flow, deny the request if the identity kind is 'guest',
    otherwise initiate recovery and reference the 3DS documentation and payment record path.
  domain:
  - payments
  - security
  content: To restart a 3-D Secure recovery flow, check the identity kind. If identity.kind equals 'guest',
    deny the request with an OUTCOME_DENIED_SECURITY and reference the security policy document (/docs/security.md).
