- id: compute_total_inventory_by_city_and_product
  description: Compute total available today quantity of a product across all stores in a given city,
    including stores with zero availability, using SQL left join and coalesce; handle missing product
    with unsupported outcome.
  domain:
  - inventory
  - sql
  - data-processing
  content: 'To compute total available today quantity of a specific product across all stores in a city:

    1. Query all store IDs and record paths for the given city from the `stores` table.

    2. Query the product SKU and record path from `product_variants` joined with `product_variant_properties`
    using filters: brand, series, model, and optionally property key-value pairs (e.g., storage_type =
    ''parts case'').

    3. Perform a left join between the city stores and `store_inventory` on store_id and the product SKU
    obtained from step 2, summing `available_today_quantity` with COALESCE(SUM(...), 0) to include stores
    with no inventory.

    4. Extract the product SKU and total from the results.

    5. If the product SKU is nonempty, return the total as an integer with outcome OK; otherwise, return
    outcome NONE_UNSUPPORTED indicating product not found.'
  source: distilled
