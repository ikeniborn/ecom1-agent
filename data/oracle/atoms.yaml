- id: resolve-records-by-given-reference-not-reconstructed-filters
  description: When a task supplies a specific review/hit reference to locate records, match on that reference
    directly instead of rebuilding the filter from inferred status columns, and treat an empty result
    as a likely over-constrained query rather than grounds for a no-results clarification
  domain:
  - data-query
  - sql
  - record-identification
  - fraud-review
  content: 'When asked to identify specific records that a given signal (a review hit, alert, or reference)
    already points at, drive the lookup from the provided reference/identifier rather than reconstructing
    the selection from indirectly inferred status flags. Avoid AND-ing several inferred predicates (e.g.
    a status enum AND a separate reason-not-null AND a scope flag) that the source signal never required
    — each extra conjunct narrows results and can drop the true target. If such a query returns zero rows,
    do not default to a ''no records found, please clarify'' outcome: the empty set is usually a symptom
    of an over-constrained or column-mismatched filter, so first relax/recheck predicates and confirm
    column names against the source signal. Reserve a clarification outcome for genuine ambiguity in the
    request, not for an empty query result that the filter design caused.'
