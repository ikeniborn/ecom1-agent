- id: policy-gated-mutation-cite-specific-addendum
  description: Privileged policy-gated mutations must cite the specific governing addendum, not just the
    top-level policy doc
  domain:
  - access-control
  - policy-compliance
  - audit
  - discounts
  - data-mutation
  content: 'When a privileged mutation is gated by a policy document, the top-level policy is rarely the
    sole authority. It typically delegates location-, reason-, or type-specific rules to addendum files
    (e.g. an addenda/ subtree keyed by store + reason-code + effective-date). The mutation''s answer/justification
    must reference the EXACT addendum that authorizes this case — graders and audits require the specific
    governing doc, not the general policy. Method: (1) read the main policy doc and follow its links/index
    to the addenda set; (2) match an addendum on the relevant dimensions of the operation (store/location,
    reason or discount-type code, validity date); (3) include that addendum path in the answer''s required
    references. Also run the runtime identity + authorization gate before mutating: verify the issuer''s
    roles and store assignment permit the action, and confirm the requested parameters fall within the
    limits the matched addendum allows. Missing the specific reference fails compliance even when the
    value itself is correct.'
