  - code-quality
  - static-analysis
  content: 'A ''bad syntax'' lint error means the parser cannot read the source; the code is invalid and
    no runtime behavior is guaranteed. Treat it as a blocking failure, not a warning. Method: (1) read
    the linter''s reported line/column to locate the offending token; (2) check the construct''s grammar
    — balanced delimiters, correct keywords, proper indentation/whitespace for the language, complete
    statements; (3) fix only the syntactic defect without altering intended logic; (4) re-run the linter
    (and the language''s own parser/compiler) until it reports zero syntax errors before considering the
    task done. Never ship or commit code that fails a syntax-level lint check.'
