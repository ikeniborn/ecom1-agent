  content: 'To count entities in a collection, iterate the collection (or query the data source) and return
    the cardinality rather than padding the routine with no-op statements; a function that only contains
    filler assignments performs no real work and will not produce a count. Implement an explicit aggregation:
    initialize a counter at zero, increment once per matching element, and return the total. Guard against
    empty or null collections by returning zero. Avoid dead code (repeated meaningless assignments) since
