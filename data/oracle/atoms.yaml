- id: fraud-archived-payment-total
  description: Identify fraudulent archived payments based on policy-defined criteria, compute total fraudulent
    amount, and output formatted total.
  domain:
  - fraud detection
  - payment processing
  - data analysis
  content: 'General method to detect fraud in archived payment records and calculate total fraudulent
    amount:


    1. **Retrieve fraud detection policy**: Read a security or policy document that defines what constitutes
    a fraudulent transaction (e.g., specific payment statuses, 3D Secure failure reasons, or other indicators).


    2. **Parse policy rules**: Extract the relevant fraud indicators from the policy using pattern matching
    (e.g., regex) or structured parsing. Determine which fields and values signify fraud.


    3. **Load archived payment data**: Import the archived payment batch file (e.g., TSV, CSV) into a
    queryable structure (e.g., temporary database table).


    4. **Filter fraudulent payments**: Query the archived payments, joining with any necessary reference
    data (e.g., transaction logs) if the archive lacks direct fraud flags. Apply the fraud criteria extracted
    from the policy to select only fraudulent payment rows.


    5. **Compute total amount**: Sum the payment amounts (in smallest currency unit, e.g., cents) for
    the filtered fraudulent payments. Convert to major currency unit (e.g., euros) and remainder for formatted
    output.


    6. **Format and output**: Present the total in a human-readable format (e.g., "EUR 123.45"). If no
    fraud rule is found in the policy, output an appropriate unsupported outcome message.


    7. **Reference rows**: Optionally collect identifiers (e.g., record paths) of the fraudulent payments
    for audit or further investigation.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
