- id: null-in-list-counting
  description: When counting items for multiple specific products using an IN clause with subqueries that
    may return NULL, ensure NULLs are excluded to avoid missing valid rows.
  domain:
  - sql
  - inventory
  - counting
  content: When constructing a list of product SKUs from multiple subqueries that each may return NULL
    if the product does not exist, use COALESCE or filter out NULLs before using IN. For example, instead
    of `WHERE product_sku IN (SELECT product_sku FROM product1 UNION ALL SELECT product_sku FROM product2
    ...)`, use `WHERE product_sku IN (SELECT product_sku FROM product1 WHERE product_sku IS NOT NULL UNION
    ALL SELECT product_sku FROM product2 WHERE product_sku IS NOT NULL ...)`. Alternatively, verify each
    product exists beforehand and only include those that do. This prevents the IN clause from containing
    NULL, which would cause the condition to evaluate to UNKNOWN for all rows, resulting in an empty set
    even if some products exist.
  source: distilled
