- id: receipt-price-validation
  description: Method for verifying whether the total ex-VAT cost of items on a scanned/OCR receipt matches
    current catalogue prices within a given tolerance, using file discovery, text parsing with OCR error
    tolerance, SKU normalization, SQL price lookup, and total comparison.
  domain:
  - finance
  - data-extraction
  - e-commerce
  - price-audit
  content: 'General procedure:

    1. Discover receipt file in a given directory (e.g., list all files, find first with extension).

    2. Read the full text from the receipt file.

    3. Parse each line to extract line items: quantity (integer), SKU (alphanumeric with hyphens), and
    price (decimal). Use regex patterns tolerant to OCR artifacts (e.g., ''0'' vs ''O'', ''1'' vs ''I'',
    ''S'' vs ''5'').

    4. For each captured SKU, apply character normalisation (replace ''O''→''0'', ''I''→''1'', ''S''→''5'',
    ''B''→''8'', ''Z''→''2'') to reduce mismatches.

    5. Construct a SQL query to retrieve product variants by their SKUs (using exact normalized matches)
    from a product_variants table; fallback to fuzzy matching if needed.

    6. For each line item, compute the expected total = quantity × (price_cents / 100) from the database,
    and sum all to get the current catalogue ex-VAT total.

    7. Extract the receipt''s SUBTOTAL from lines containing keywords like ''SUBTOTAL'' (normalized to
    uppercase, replace ''0'' with ''O'' for pattern matching). Parse the numeric value after a colon/equals.

    8. Calculate absolute difference between the computed total and the receipt subtotal, and compare
    against the allowed tolerance (e.g., 2.00 EUR).

    9. Return a boolean indicating whether the difference is within tolerance, or the difference value.'
