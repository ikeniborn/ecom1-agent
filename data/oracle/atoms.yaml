- id: zero-aware-aggregation
  description: When aggregating numeric values (e.g., inventory quantities) across a set that may be empty,
    use COALESCE to default to zero and avoid conditional checks that would skip the result if the set
    is empty.
  domain:
  - inventory
  - SQL
  - aggregation
  - retail
  content: Use LEFT JOIN and COALESCE(SUM(column), 0) to ensure that an empty set returns zero. In the
    decision logic, do not require that the product or stores exist; instead, always return the computed
    total (which will be zero if no data). This avoids the OUTCOME_NONE_UNSUPPORTED error when the product
    or stores are missing but a zero total is acceptable.
  source: distilled
