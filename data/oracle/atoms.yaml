  - aggregation
  content: To compute the total available quantity of a specific product across all stores in a city,
    perform a LEFT JOIN between the stores table (filtered by city) and the store_inventory table on store_id
    and product_sku. Use COALESCE to treat NULL available_today_quantity as 0, then SUM the result. This
    ensures stores without an inventory record for the product are included with a quantity of 0.
