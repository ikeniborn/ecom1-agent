- id: atom_safe_sql_empty_result_handling
  description: Method to safely process SQL query output in procedural scripts, preventing assertion failures
    when the result set is empty.
  domain:
  - software_development
  - testing
  - sql
  content: "When a script executes a SQL query that may return zero rows, always implement a fallback\
    \ answer to avoid downstream errors like 'AssertionError: last result empty'. Follow these steps:\n\
    \n1. Execute the parameterized SQL query using the environment's database command (e.g., `/bin/sql`)\
    \ and capture its full output.\n2. Parse the output assuming a tabular format (commonly CSV with a\
    \ header row). Split the text into lines, where the first line is the header.\n3. Determine if actual\
    \ data rows exist by checking `len(lines) > 1`.\n   - If yes, extract the relevant answer value from\
    \ the first data row (e.g., by splitting on the delimiter). Optionally capture an associated path\
    \ or identifier.\n   - If no, set a default answer string that clearly represents the negative or\
    \ “not found” case (e.g., 'No, item not found.').\n4. Use the resolved answer string for final output\
    \ or assertions. Never pass an empty or `None` value to an assertion that expects a truthy result.\n\
    \nThis pattern decouples result parsing from the expectation of data presence, making the script robust\
    \ against empty query results."
