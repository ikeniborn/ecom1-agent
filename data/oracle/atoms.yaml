- id: sql-eav-existence-empty-refs
  description: Empty runtime refs on an EAV existence query signal zero returned rows; verify bindings,
    SELECT columns, and JOIN cardinality before trusting a NO answer
  domain:
  - sql
  - data-modeling
  - query-construction
  - backend
  content: 'When answering a yes/no existence question by joining an entity table to an Entity-Attribute-Value
    (EAV) property table filtered on a single property_key plus property_value, an empty result set is
    ambiguous: it can mean the entity does not exist, the property is not recorded for it, or the stored
    value differs (case, units, synonym) from the literal you filtered on. If a response template/contract
    requires runtime refs (e.g. a record_path per match) and the actual refs list comes back empty, that
    is a structural signal the SQL returned no rows or the path column was dropped during row parsing
    — not proof of a true NO. Checklist before emitting NO: (1) confirm the SELECT projects every column
    the template/parser needs (the ref/path column included); (2) confirm WHERE-clause value literals
    match stored normalization (trim/lowercase/canonicalize both sides, or compare case-insensitively);
    (3) confirm the AND-chained property filter does not over-constrain — multiple required properties
    on the same key column need self-joins or aggregation/EXISTS subqueries, not repeated AND on one joined
    row; (4) prefer parameterized/named bindings over manual string concatenation to avoid quoting and
    injection bugs. To distinguish ''entity absent'' from ''property absent/mismatched'', split the check:
    first query the entity by identity, then LEFT JOIN the property so a present entity with a non-matching
    property yields a row with NULL value rather than zero rows. Only assert a definitive negative once
    the entity-level query confirms the entity exists and the property genuinely lacks the target value.'
  source: distilled
  validated_by: ''
