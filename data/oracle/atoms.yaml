- id: handbook_exception_check
  description: Method to determine if a specific exception is permitted by a handbook, with permission
    verification, and produce appropriate outcomes.
  domain:
  - policy_enforcement
  - handbook_lookup
  - exception_handling
  content: "To check if a handbook permits a specific exception:\n1. Read the handbook document and the\
    \ caller's identity (e.g., from /docs/security.md).\n2. Search the handbook for lines containing the\
    \ exception name (e.g., 'queue-save quick complete').\n3. If no matching section is found, the exception\
    \ is unsupported (OUTCOME_NONE_UNSUPPORTED).\n4. If a matching section is found, verify the caller's\
    \ permissions:\n   - If the caller lacks required permissions (e.g., identity kind is 'guest'), deny\
    \ with OUTCOME_DENIED_SECURITY.\n   - If the caller has sufficient permissions, the exception is supported\
    \ and can be applied (OUTCOME_OK or similar).\n5. Do not default to unsupported when a matching section\
    \ exists; ensure proper branching to avoid clarification outcomes."
  source: distilled
  validated_by: ''
