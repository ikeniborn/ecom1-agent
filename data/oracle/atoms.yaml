- id: gate-singleton-extraction-on-count
  description: When a script queries for records and needs to return a representative row only if any
    exist, the extraction of that representative must be guarded by the existence check. Unconditionally
    extracting `first` from a potentially empty rowset in a compute phase before the decision can cause
    a runtime fault that prevents the absent/empty branch from ever being reached.
  domain:
  - scripting
  - sql-integration
  - decision-logic
  - existence-check
  content: Structure the pipeline so the decision branches on `count(rows)` before any step tries to access
    a single row. Only evaluate `first(rows)` or access row fields inside the success branch of the decision,
    or use an extraction primitive that safely returns null on emptiness. If the compute phase unconditionally
    derives a singleton record from a rowset that may be empty, the resulting error/undefined value can
    abort execution with a clarification failure instead of reaching the intended absent/negative branch.
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
  embedding_hash: f9ace03aa98f59fb07b61354d9c85da1853d6a1223518101c37d88dcf14df6f5
  source_task: t02
  polarity: anti_pattern
- id: exact-key-filter-for-entity-claim
  description: Do not use prioritized LIMIT 1 fallback across candidate IDs when the claim specifies an
    exact entity; it risks selecting the wrong record and emitting an incorrect reference path.
  domain:
  - claim-verification
  - sql
  - data-querying
  - reference-integrity
  content: When a claim identifies a specific entity by a unique key (e.g., SKU, product ID, record path),
    the verification query must filter on that exact key using an equality condition. Using IN (...) with
    an ORDER BY ... LIMIT 1 across multiple candidate keys introduces fallback logic that can return a
    different record than the one claimed. This causes the answer to cite the wrong reference path or
    omit a required reference entirely. If ambiguity exists, resolve to the canonical key before querying;
    never let the database select among candidate keys on your behalf.
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
