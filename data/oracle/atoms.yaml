- id: sql-count-records
  description: Count records in a SQLite database table matching a given condition and return the numeric
    count.
  domain:
  - database
  - sql
  - data-retrieval
  content: "To count records in a SQLite database table that satisfy a condition:\n1. Use the `Exec` RPC\
    \ to run the `sql` binary on the database file, providing a `SELECT COUNT(*)` query via stdin.\n \
    \  Example query: `SELECT COUNT(*) AS cnt FROM <table> WHERE <condition>;`\n2. Parse the output using\
    \ `rowsets` with `format: auto_delim` to extract the count into a column (e.g., `cnt`).\n3. In the\
    \ `compute` phase, use `first` to get the first row, then `get` to retrieve the count string from\
    \ the column, and `to_number` to convert it to a numeric value.\n4. In the `decision` phase, check\
    \ if the numeric value is nonempty (i.e., the query succeeded and returned a count). If so, branch\
    \ to `ok` and include the count in the answer message.\n5. The `answer` for the `ok` branch can embed\
    \ the count using a placeholder like `<QTY:{value}>`."
