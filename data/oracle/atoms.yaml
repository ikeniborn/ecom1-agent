  content: Before issuing queries against a database with unknown schema, enumerate the actual tables
    (e.g. SELECT name, sql FROM sqlite_schema WHERE type='table' with NO name filter) and pick the relevant
    table by inspecting its columns/role. Do not hardcode an assumed table name in the discovery filter
