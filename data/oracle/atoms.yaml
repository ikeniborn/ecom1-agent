- id: sql_check_product_existence
  description: Reusable method to verify whether a product with specific attributes exists in a catalog
    by joining product variant and property tables and applying filtered criteria.
  domain:
  - SQL
  - Data Retrieval
  - Catalog Management
  - Security
  content: "Use a parameterized query that joins the product_variants table with the product_variant_properties\
    \ table on the SKU, then filter on the desired attributes (e.g., brand, product name pattern, product\
    \ family name, property key, and property value). Example pattern:\n\n```sql\nSELECT pv.record_path\n\
    FROM product_variants pv\nJOIN product_variant_properties pvp ON pv.product_sku = pvp.product_sku\n\
    WHERE pv.brand = ?\n  AND pv.product_name LIKE ?\n  AND pv.product_family_id = (\n        SELECT product_family_id\n\
    \        FROM product_families\n        WHERE product_family_name = ?\n      )\n  AND pvp.property_key\
    \ = ?\n  AND pvp.property_value_text = ?;\n```\n\nReplace the placeholders with the appropriate values\
    \ at execution time. This approach avoids hard‑coding values, mitigates SQL injection risks, and respects\
    \ access‑control policies."
