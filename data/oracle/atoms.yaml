  content: To test whether an entity meets several independent attribute conditions simultaneously while
    those attributes reside in a separate Entity-Attribute-Value (EAV) table, use multiple correlated
    EXISTS subqueries—one per required attribute—against the EAV table from the main entity query. Normalize
    values inside each subquery predicate (e.g., via LOWER(TRIM(...))) for case-insensitive and whitespace-tolerant
