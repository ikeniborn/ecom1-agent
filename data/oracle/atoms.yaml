- id: vat-exclusive-recompute-tolerance-check
  description: Recompute a receipt's ex-VAT total at current prices and test the difference against a
    tolerance
  domain:
  - finance
  - tax-calculation
  - document-parsing
  content: 'To compare an old receipt against current catalogue prices on a net (ex-VAT) basis: (1) Parse
    each line item (quantity, unit price, VAT rate) from the receipt. Gross/net depends on whether printed
    prices include VAT — detect from the document''s VAT summary or per-line flag, do not assume. (2)
    Derive net per line: if prices are VAT-inclusive, net = gross / (1 + vat_rate); if exclusive, net
    = printed price. Never subtract the rate as a flat percentage of gross (gross * rate overstates the
    tax). (3) Recompute the target total by multiplying each item''s quantity by its CURRENT catalogue
    unit price, applying the same net convention. (4) Compare: within = abs(recomputed_net_total - receipt_net_total)
    <= tolerance. Use absolute difference so both increases and decreases count, and keep the tolerance
    comparison inclusive (<=) at the boundary. Edge cases to handle: discontinued SKUs (no current price
    → flag, exclude or fail rather than silently dropping), mixed VAT rates across lines (sum net per-line,
    never apply one blended rate), currency/rounding (round at the line level matching the receipt''s
    rounding, then sum, to avoid accumulated drift). Return a structured result with the two totals, the
    delta, and the boolean verdict — not just yes/no.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 302c0ecf1d6cadcbe0ff651a327dd99ae107620af0fba5b67ba55e5adb5394bb
  source_task: t52
- id: pydantic-field-shadows-basemodel-attr
  description: Naming a Pydantic model field after a BaseModel-reserved attribute (e.g. 'schema') triggers
    a shadowing UserWarning
  domain:
  - python
  - pydantic
  - data-modeling
  content: 'In Pydantic, do not name a model field with an identifier that already exists on BaseModel
    (such as ''schema'', ''copy'', ''dict'', ''json'', ''construct'', ''fields''). Doing so shadows the
    inherited attribute/method and emits ''UserWarning: Field name "X" shadows an attribute in parent
    "BaseModel"'', and can break that inherited behavior. Fix: rename the field to a non-conflicting name;
    if the wire/serialized name must stay the reserved word, keep a safe Python attribute name and map
    it via Field(alias=...) (with populate_by_name/allow_population_by_field_name enabled as needed).'
