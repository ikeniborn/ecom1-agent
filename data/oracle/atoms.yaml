- id: fidelity-drift-stub-implementation
  description: Stub or no-op implementations cause fidelity drift between stated intent and actual behavior
  domain:
  - code-quality
  - verification
  - implementation-fidelity
  content: 'When an implementation diverges from its stated intent, the result is fidelity drift: the
    code''s observable behavior no longer matches the specification it claims to satisfy. A common root
    cause is a placeholder or no-op body (e.g. a function that only passes without doing work) shipped
    as if complete. To prevent drift: (1) treat every intent/spec as a verifiable contract and derive
    at least one concrete check from it before writing the body; (2) reject empty or pass-through bodies
    unless a no-op is explicitly the intended behavior; (3) after implementing, re-read the intent and
    confirm each required effect is produced, not just that the code runs; (4) when intent is vague or
    trivial, surface the ambiguity rather than silently emitting a stub. Verification that the code performs
    the intended effect — not merely that it executes — is what closes the drift gap.'
  source: distilled
