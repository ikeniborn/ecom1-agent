- id: receipt-catalog-price-comparison
  description: Method to compare total price of items from a receipt against a product catalog, ensuring
    all items are matched and the price difference is within a specified threshold.
  domain:
  - retail
  - price-verification
  - data-processing
  content: '1. Read the receipt text from a file or input source.

    2. Extract individual items from the receipt text, each containing a product identifier (e.g., SKU)
    and a price (in cents or smallest currency unit). This extraction may require fuzzy matching or OCR
    post-processing.

    3. Query the product catalog (e.g., database) to retrieve all product variants with their identifiers
    and current prices.

    4. Parse the catalog data into a structured list of records (identifier, price).

    5. Sum the prices of all extracted receipt items to obtain the old total.

    6. Collect the unique product identifiers from the receipt items.

    7. Filter the catalog records to only those identifiers present in the receipt.

    8. Sum the prices of the matched catalog records to obtain the current total.

    9. Count the number of matched catalog records; compare with the number of unique receipt identifiers
    to detect any missing products (i.e., products on the receipt not found in the catalog).

    10. Compute the absolute difference between the old total and the current total.

    11. Convert the difference to the desired currency unit (e.g., divide cents by 100 to get EUR).

    12. If the difference is within the allowed threshold (e.g., 3 EUR) and there are zero missing products,
    the comparison is successful; otherwise, it fails.

    13. Return an appropriate outcome with the computed difference and missing count.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
