- id: count-intent-use-exec-answer-not-tree
  description: For count/aggregate intents, emit an exec aggregation that yields a scalar then return
    it via answer — do not walk the full tree
  domain:
  - agent-orchestration
  - rpc-fidelity
  - query-planning
  content: 'When the intent is to count or aggregate entities, the operation must match the intent: issue
    an exec/aggregation call that computes the scalar, then surface it with an answer call. A tree/listing
    traversal returns the whole structure instead of the count, so a fidelity check comparing the RPC
    multiset will drift (expected aggregate+answer ops, got a single tree-walk op). Rule: pick the RPC
    by the verb in the intent — counting/summing/aggregating -> exec then answer; enumerating/exploring
    structure -> tree. Verify the emitted RPC set equals the intent''s expected operation set before returning.'
