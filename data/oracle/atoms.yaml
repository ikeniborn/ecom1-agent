    container and its relationships, not a scalar aggregate. To satisfy a counting intent, you must explicitly
    traverse or query the retrieved structure to compute the cardinality, then return the resulting scalar
    through the appropriate answer or result mechanism. Relying solely on the retrieval call omits both
