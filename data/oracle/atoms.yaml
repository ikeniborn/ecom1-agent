- id: normalized-catalogue-product-matching
  description: Normalize both sides when matching or counting catalogue products to avoid misses from formatting
    and case differences.
  domain:
  - catalogue
  - product
  - matching
  content: When matching or counting catalogue products by name, brand, kind, or category, NORMALIZE both
    sides first (lowercase, trim, collapse internal whitespace, strip surrounding punctuation) and match
    on the normalized tokens via ILIKE rather than exact string equality. Resolve a product kind/category
    by its normalized descriptor; count distinct products of the resolved kind. This avoids misses from
    formatting/case differences and miscounts from un-normalized category labels.
  source: investigation
