- id: distinguish_unsupported_vs_denied_for_identity_restricted_operations
  description: When an operation is inherently restricted to certain identity kinds, return OUTCOME_NONE_UNSUPPORTED
    for non-matching identities, not OUTCOME_DENIED_SECURITY. Reserve security denial for policy violations
    within allowed identity kinds.
  domain:
  - access_control
  - outcome_handling
  - identity_management
  content: 'For operations that are only available to specific identity kinds (e.g., checkout for customers),
    if the caller''s identity kind does not match the required kind, the correct outcome is OUTCOME_NONE_UNSUPPORTED,
    indicating the operation is not supported for that identity. Do not use OUTCOME_DENIED_SECURITY unless
    the identity is of a kind that could potentially perform the operation but is explicitly blocked by
    a security policy (e.g., a banned customer). This distinction prevents misleading security alerts
    and correctly communicates capability limitations. Implementation: after discovering the identity
    kind, check if the operation is defined for that kind. If not, branch to unsupported. Only consult
    security policies to deny access for identities that are otherwise eligible.'
  source: distilled
