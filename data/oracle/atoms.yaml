  - verification
  - task-fidelity
  content: 'Fidelity drift occurs when an implementation diverges from its declared intent — e.g. a function
    stubbed as a no-op (pass) while the intent specifies real behavior. To catch it: (1) Restate the intent
    as a verifiable success criterion before coding. (2) After implementing, diff actual script behavior
    against that criterion, not against the code''s superficial structure. (3) Treat empty/placeholder
    bodies (pass, TODO, stub returns) as drift signals when intent demands work. (4) Add a test asserting
    the intended effect so drift surfaces automatically rather than silently passing. Never mark a task
    complete on a stub that merely parses; verify the output matches intent.'
