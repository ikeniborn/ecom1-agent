  - SQL
  content: 'To compute total available quantity of a product across all stores in a given city, first
    query the product by its identifying attributes (brand, series, model, and specific properties such
    as anchor_type, diameter_mm, length_mm) to obtain its SKU and record path. If no product matches,
    return an unsupported outcome. Otherwise, for that SKU, query all stores in the city using a LEFT
    JOIN with the inventory table, coalescing null quantities to zero. Sum the available_today_quantity
    column. Return the total sum along with citations: the product record path and the list of store record
