- id: eav-multi-property-verification
  description: Use grouped boolean aggregate indicators to test whether a catalogue record satisfies multiple
    claimed properties simultaneously.
  domain:
  - SQL
  - data-validation
  - EAV-schema
  - catalog-querying
  content: 'When validating N independent claimed properties against a one-to-many property or EAV table,
    compute per-entity indicator flags using aggregate Boolean expressions such as `MAX(CASE WHEN <condition_i>
    THEN 1 ELSE 0 END)` grouped by the entity primary key. Combine the N flags algebraically (e.g., via
    product or `LEAST`) into a single composite conformance flag. Application logic should then branch
    into three exclusive outcomes: (a) no candidate entity exists → ABSENT; (b) entity exists with composite
    flag affirming all claims → YES; (c) entity exists but composite flag shows any claim unsatisfied
    → NO. Always return the examined entity identifier in YES/NO responses.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: active
