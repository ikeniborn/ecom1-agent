- id: sql-answer-refs-empty-debug-bindings-and-select-columns
  description: When a runtime SQL query must populate answer refs (e.g. record paths) but they come back
    empty, diagnose binding, predicate, and parser-column issues
  domain:
  - sql
  - data-pipelines
  - debugging
  - query-validation
  content: 'When validation reports that required runtime refs (like record paths pulled from query results)
    are missing while actual refs are empty, the rows either never came back or the parser dropped the
    path column. Diagnose in this order: (1) Confirm parameter bindings actually resolved — `:name` placeholders
    that were never substituted or escaped wrong produce predicates that match nothing; prefer the engine''s
    native bind params over manual string inlining, and if inlining, sort keys longest-first to avoid
    prefix collisions (`:line1` vs `:line`). (2) Verify the SELECT list actually includes the path/ref
    column and that joins/WHERE predicates aren''t over-restrictive (zero-row result). (3) Check the row
    parser against the real output format — match the actual delimiter, skip only true header lines, and
    ensure the column you need survives splitting. A useful robustness pattern: when a property/value
    can live in either a text column or a numeric column, match against both (e.g. compare to `property_value_text`
    OR a normalized `printf(''%g'', property_value_number)`), since a number-vs-text mismatch silently
    yields zero matches. Empty refs are a symptom — distinguish ''query returned nothing'' from ''parser
    discarded the column'' before fixing.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 66e3d5510a310e08408ded907d2512f82d97c0aca687de695d4a469d43c4860d
