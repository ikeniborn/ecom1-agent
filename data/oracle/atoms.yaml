- id: trusted_system_override_checkout
  description: A reusable checkout pattern for trusted system override, including authorization verification,
    basket status check, inventory validation, and transactional payment recording with override fingerprints.
  domain:
  - e-commerce
  - checkout
  - payment-processing
  content: "To complete a checkout using trusted-system-override:\n1. Verify that the instruction authorization\
    \ field equals 'verified'.\n2. Confirm the basket status is 'active'.\n3. Check that all items in\
    \ the basket have sufficient inventory (no item has requested_quantity > available_today_quantity).\n\
    4. If all conditions pass, execute a database transaction:\n   - Generate a unique payment ID (e.g.,\
    \ using randomblob(16) hex).\n   - Insert a payment record with: payment_id, record_path (e.g., '/payments/'\
    \ + payment_id + '.json'), basket_id, customer_id, store_id, total amount (sum of requested_quantity\
    \ * price_cents), currency, status 'completed', current timestamp, payment_method_fingerprint and\
    \ device_fingerprint both set to 'trusted_system_override', and default location (0.0, 0.0).\n   -\
    \ Update the basket status to 'checked_out'.\n   - Return the payment_id and record_path.\n5. If any\
    \ condition fails, return an appropriate outcome: 'denied_security' for invalid authorization, 'unsupported_basket'\
    \ for non-active basket, or 'unsupported_inventory' for insufficient stock."
