- id: normalized-catalogue-existence-match
  description: 'General method for catalogue decisions: ground in real candidate rows / on-demand env
    probe, normalized matching, record_path grounding.'
  domain:
  - product-catalogue
  - lookup
  - existence
  - sql
  - method
  content: 'To answer any catalogue question (does a product exist / do we carry it / a support-note claim
    verification / how many), GROUND the decision in the ACTUAL data rather than guessing: use the pre-phase
    CATALOGUE_CANDIDATES rows (real product_variants matching the entity tokens) and, when unsure, probe
    the environment on demand (SELECT DISTINCT a column, or sample the relevant table). Match the product
    by its identifying attributes NORMALIZED — LOWER/TRIM with LIKE on a distinctive brand/series/model
    token — never raw equality, because stored values are re-seeded each run. A product is PRESENT iff
    a row matches its brand plus a distinctive model/series token; ground a positive answer in that row''s
    record_path. Do NOT over-constrain the match with every variant property (that yields a false ''absent'').
    Both present and absent are valid OUTCOME_OK answers; emit the exact token/format the instruction
    requests.'
  source: investigation
  validated_by: manual
  validated_at: '2026-06-18'
  status: active
