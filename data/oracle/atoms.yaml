  - sql-querying
  - output-formatting
  content: When you need to compute a total amount from a subset of rows (e.g., fraudulent payments) and
    output a formatted total message along with references to each contributing row, use a SQL window
    function (SUM OVER ()) to attach the total to every row in the same query. This avoids a separate
    aggregation step. Extract the formatted total from the first row of the result set. If the result
    set is empty, construct a default formatted total (e.g., 'EUR 0.00') and provide an empty list of
    references. Always return a successful outcome (OUTCOME_OK) with the formatted message and the list
    of row references, regardless of whether any rows were found. Do not branch to an unsupported outcome
