- id: externalize-all-search-literals
  description: Never hardcode run-specific identifiers or search fragments inside SQL predicates or matching
    logic; always bind them as external parameters or variables.
  domain:
  - sql
  - query-construction
  - code-generation
  - data-discovery
  content: When writing discovery queries or filter logic that must match a specific runtime entity (e.g.,
    a product by line, series, model, or SKU), do not embed any run-specific literal strings, codes, or
    path fragments directly into the query text, even inside LIKE patterns or OR conditions. Partial parameterization—where
    some terms use bound variables while others remain as hardcoded literals—makes the script non-reusable
    and produces false negatives or false positives when the literal does not apply to the current run.
    Every variable search term must be passed through an explicit external parameter (e.g., :line_descriptor)
    or template variable, ensuring the logic remains fully generalized and correctly locates the target
    record so its path or ID can be returned and referenced in the answer.
  source: distilled
  validated_by: ''
