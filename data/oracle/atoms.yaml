- id: guarded-mutation-requires-write-exec
  description: After identity/RBAC/scope gates pass, a guarded state change must execute the mutating
    operation, not just read-and-answer.
  domain:
  - access-control
  - rbac
  - data-mutation
  - policy-enforcement
  content: 'When implementing a privileged mutation behind an authorization gate, the canonical operation
    sequence is: (1) read the governing policy docs, (2) exec the identity probe to obtain caller role/id/scope,
    (3) read/query the target record''s current state, and (4) on PASS, exec the mutating write (e.g.,
    SQL UPDATE) that actually applies the change. The verification reads and the identity probe do NOT
    substitute for the write call. Returning a denial/answer after only the discovery reads under-counts
    the expected operation trace: the success path performs one more state-changing exec than the deny
    path. Only short-circuit before the mutation when a gate definitively fails; otherwise proceed to
    the write so the requested change is effected and the operation multiset matches the intended (read-policy,
    probe-identity, read-state, write-mutation) shape.'
  source: distilled
  validated_by: ''
  validated_at: ''
  status: candidate
  embedding_hash: 804775fb108320ca6bbc0e2e9f3a058764c1f841cdcc7fe5cd03be2dd152174e
