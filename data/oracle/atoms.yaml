- id: row-reference-concatenation
  description: To generate per-row record paths for citing individual rows, use element-wise string concatenation
    of a base path with a row identifier column.
  domain:
  - data-processing
  - row-referencing
  content: When processing tabular data and needing to reference specific rows (e.g., for error messages
    or citations), construct a new column of unique row paths by concatenating a fixed base string (like
    a file path or sheet name) with a row identifier (such as a row number or ID column) using an element-wise
    string concatenation operation. This requires a primitive that can concatenate a scalar string with
    each element of a column, or two columns element-wise. Without this primitive, per-row references
    cannot be generated.
  source: distilled
