- id: checkout_recovery_after_3ds_failure
  description: Method to safely recover a checkout after a 3DS failure, ensuring customer ownership, basket
    status, payment status, 3DS status, and attempt limits.
  domain:
  - payment processing
  - 3DS security
  - checkout recovery
  content: 'To recover a checkout after a 3DS failure:

    1. Verify the caller''s identity matches the basket''s customer_id.

    2. Retrieve the basket; its status must be ''checked_out''.

    3. Retrieve the latest payment transaction for the basket with payment_status = ''requires_3ds_action''.

    4. If the payment''s three_ds_status is ''successful'', finalize the payment directly by setting payment_status
    to ''completed''.

    5. If the payment''s three_ds_status is ''recoverable'', basket status is ''checked_out'', payment
    status is ''requires_3ds_action'', and three_ds_attempts < three_ds_max_attempts, then recover by
    setting three_ds_status to ''successful'', payment_status to ''completed'', and incrementing three_ds_attempts.

    6. Otherwise, deny the recovery for security reasons.'
